/td></tr><tr><td>σωτὴρ πάντων ἀνθρώπων</td><td>sōtēr pantōn anthrōpōn</td><td>一切人的救主</td><td>呼應 2:4「願意萬人得救」</td></tr><tr><td>μάλιστα πιστῶν</td><td>malista pistōn</td><td>尤其是信的人的</td><td>μάλιστα：特別、尤其；也可讀作「就是」</td></tr></table>","gram":"<p><strong>4:9 的 πιστὸς ὁ λόγος（pistos ho logos） 是指 4:8 還是 4:10？多數學者認為指前一節的格言，4:10 用 γὰρ（gar） 接著解釋：我們勞苦正是為了這個應許。</strong></p><p><strong>◆ 經文鑑別 4:10。</strong>SBLGNT（以及拜占庭傳統的 RP）作 κοπιῶμεν καὶ ὀνειδιζόμεθα（kopiōmen kai oneidizometha），「我們勞苦並且受辱罵」；WH、Tregelles 與 NA28 作 κοπιῶμεν καὶ ἀγωνιζόμεθα（kopiōmen kai agōnizometha），「我們勞苦並且努力奮鬥」。和合本「勞苦努力」跟的是 ἀγωνιζόμεθα（agōnizometha）。兩個字形在希臘文中拼法相近，抄寫時容易混淆。支持 ἀγωνιζόμεθα（agōnizometha） 的是幾份重要的早期抄本（西乃抄本原筆、亞歷山大抄本等），而且與 6:12「打那美好的仗」的 ἀγωνίζου（agōnizou） 同字根，切合 4:7–8 體育場的比喻；支持 ὀνειδιζόμεθα（oneidizometha） 的抄本數量多、分佈廣，而且「受辱罵」是較難的讀法，抄寫者較可能把它改成順著上下文的「努力」。本講義的判斷：兩讀都有力，意思也相容——為福音勞苦的人，既要奮力，也要受辱；解經跟和合本讀作「勞苦努力」，同時在 gram 保留 SBLGNT 的「受辱罵」，提醒讀者這條路上有羞辱。</p><p>ὅτι ἠλπίκαμεν（hoti ēlpikamen） 是完成式：指望早已放在永活的神身上，至今不改。ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων（hos estin sōtēr pantōn anthrōpōn）, μάλιστα πιστῶν（malista pistōn） 的 μάλιστα（malista） 有兩種讀法：一般讀作「尤其」，也有學者讀作「就是」（意即：萬人的救主，指的就是信的人）。無論哪一讀，這一句都不是說人人最終都會得救。</p>","exp":"<p><strong>「我們勞苦努力，正是為此，因我們的指望在乎永生的神；他是萬人的救主，更是信徒的救主。」（4:10）——指望放對了地方，勞苦就有了意義。</strong></p><p>保羅為甚麼願意勞苦？因為敬虔有「今生和來生的應許」（4:8），而這應許是建立在一位「永生的神」身上。偶像不會活，假教訓沒有將來，但我們的神是活的。若 SBLGNT 的讀法「受辱罵」是對的，這句話就更有份量：保羅和提摩太不只累，還被人罵；他們仍然做下去，是因為指望不在人的掌聲上。</p><p>「萬人的救主，更是信徒的救主」要小心讀。有人據此推論：既然神是萬人的救主，所有人最後都會得救。這不是保羅的意思。同一卷書說神「願意萬人得救，明白真道」（2:4），也說有人「離棄真道」（4:1），6:9 說貪財的人會「沉在敗壞和滅亡中」。神是萬人的救主，至少有兩層意思：第一，祂是唯一的救主，救恩只有一個源頭，向萬人敞開（2:5–6 基督捨自己作萬人的贖價）；第二，祂在今生普遍地看顧萬人，叫「日頭照好人，也照歹人」（太 5:45）。而這救恩要藉著信才落實到一個人身上，所以說「更是信徒的救主」。</p><p>這一節給傳福音的人兩樣東西。一是勇氣：門是向萬人開的，沒有一個人在神的救恩範圍之外。二是迫切：門雖然開著，人仍要進來。我們勞苦，正是為此。</p><p>對一般的信徒，這一節也是安慰。你為主擺上的時間、在職場上為信仰受的冷眼、在家裡默默的忍耐，都不是白費的；因為你的指望不在今天的回報，而在那一位永遠活著的神身上。</p>"},{"a":11,"z":12,"star":3,"grk":"<p lang=\"grc\">Παράγγελλε ταῦτα καὶ δίδασκε.</p><p lang=\"grc\">μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ἀγάπῃ ἐν πίστει, ἐν ἁγνείᾳ.</p>","lit":"<p>這些事你要吩咐，也要教導。</p><p>不要讓任何人藐視你的年輕，倒要成為信的人的模子：在話語上、在生活上、在愛裡、在信裡、在純潔上。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Παράγγελλε</td><td>Parangelle</td><td>要吩咐</td><td>追蹤字 παραγγέλλω：呼應 1:3、1:5 的「命令」</td></tr><tr><td>νεότητος</td><td>neotētos</td><td>年輕</td><td>當時可指四十歲以下</td></tr><tr><td>καταφρονείτω</td><td>kataphroneitō</td><td>藐視</td><td>字面「往下想」：看低</td></tr><tr><td>τύπος</td><td>typos</td><td>模子、印記</td><td>敲打留下的痕跡；也是鑄造用的模具</td></tr><tr><td>ἀναστροφῇ</td><td>anastrophē</td><td>生活、行為</td><td>日常的來回往返</td></tr><tr><td>ἁγνείᾳ</td><td>hagneia</td><td>清潔</td><td>新約僅 4:12、5:2：性上與心思的純潔</td></tr></table>","gram":"<p><strong>4:11 兩個現在式命令 Παράγγελλε ταῦτα καὶ δίδασκε（Parangelle tauta kai didaske） 把 4:1–10 全部收起來；4:12 接著轉向提摩太本人：μηδείς σου τῆς νεότητος καταφρονείτω（mēdeis sou tēs neotētos kataphroneitō）。</strong></p><p>Παράγγελλε（Parangelle） 是本卷追蹤字 παραγγελία（parangelia） 家族的一站。1:3 保羅要提摩太「囑咐」那幾個人，1:5 說「命令的總歸就是愛」；這裡命令再次交到提摩太手上，語氣比 4:6 的 ὑποτιθέμενος（hypotithemenos） 強。</p><p>4:12 的結構是「不要……倒要……」：μηδείς（mēdeis）…καταφρονείτω（kataphroneitō）, ἀλλὰ τύπος γίνου τῶν πιστῶν（alla typos ginou tōn pistōn）。第三人稱命令不是叫提摩太去管別人怎麼想，而是用 ἀλλὰ（alla） 轉向他能負責的事：你要成為。γίνου（ginou） 是現在式命令：持續地成為，是一個過程。</p><p>τύπος（typos） 原指敲打留下的痕跡，像約 20:25 的「釘痕」；引申為模具、樣式。五個範圍各由 ἐν（en） 帶出：ἐν λόγῳ（en logō）, ἐν ἀναστροφῇ（en anastrophē）, ἐν ἀγάπῃ ἐν πίστει（en agapē en pistei）, ἐν ἁγνείᾳ（en hagneia）。前兩項是外在可見的（說話、生活），後三項是內在的品格（愛、信、純潔）。1:16 保羅說自己是給後來信的人作 ὑποτύπωσιν（hypotypōsin）「榜樣」，這裡提摩太被要求成為同一類的模子。</p>","exp":"<p><strong>「不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。」（4:12）——不能靠頭銜贏得的尊重，要靠生命留下的印子。</strong></p><p>提摩太大約三十多歲，在一個重視年齡的文化裡帶領一個有長輩的教會。5:1 保羅會教他怎樣對待年老的人。在這裡，保羅沒有給提摩太一張證書，也沒有說「你告訴他們，我是使徒派來的」；他說：「不可叫人小看你」，方法是作榜樣。尊重無法用職分強迫別人給你，只能用生命讓人看見。</p><p>τύπος（typos） 這個字很有畫面：模子壓在蠟上，蠟上就有了形狀。一位傳道人不只是把知識傳給會眾，他的生命本身就在會眾身上壓出印子。他怎樣說話，會眾會學；他怎樣對待人，會眾會學；他在壓力下怎樣反應，會眾也會學。</p><p>五個範圍值得一個一個看：言語——說話誠實、有恩典；行為——日常的作息與待人；愛心——對人的真心；信心——在難處中對神的信靠，也可以譯作「忠信」；清潔——在男女關係與心思意念上的純潔。這五項沒有一項需要年紀才能做到。年輕人可能缺乏經驗，但不必缺乏品格；經驗要靠歲月累積，品格卻可以從今天開始操練。</p><p>這一節也是寫給會眾的。在年輕的傳道人身上，不要只看年紀；也要給他們成長的空間。而每一位信徒，都在某個人眼前是一個模子：父母之於兒女，老同學之於新朋友。我們都在別人身上留下印子。問題不是有沒有，而是留下的是甚麼樣的印子。</p>"},{"a":13,"z":13,"star":1,"grk":"<p lang=\"grc\">ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.</p>","lit":"<p>直到我來，你要專注於那宣讀、那勸勉、那教導。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἕως ἔρχομαι</td><td>heōs erchomai</td><td>直到我來</td><td>現在式：保羅預期要回到以弗所</td></tr><tr><td>πρόσεχε</td><td>proseche</td><td>要專注</td><td>與 4:1 προσέχοντες 同一個字：聽從誰</td></tr><tr><td>τῇ ἀναγνώσει</td><td>tē anagnōsei</td><td>那宣讀</td><td>有冠詞：指聚會中公開誦讀聖經</td></tr><tr><td>τῇ παρακλήσει</td><td>tē paraklēsei</td><td>那勸勉</td><td>根據所讀的經文勸人</td></tr><tr><td>τῇ διδασκαλίᾳ</td><td>tē didaskalia</td><td>那教導</td><td>追蹤字 διδασκαλία：健康的教訓</td></tr></table>","gram":"<p><strong>4:13 的動詞 πρόσεχε（proseche） 和 4:1 的 προσέχοντες（prosechontes） 是同一個字：有人「專注於」迷惑人的靈和鬼魔的教訓，提摩太卻要「專注於」宣讀、勸勉、教導。人總是專注於某樣東西，問題是哪一樣。</strong></p><p>三個名詞都帶冠詞，排成一列：τῇ ἀναγνώσει（tē anagnōsei）, τῇ παρακλήσει（tē paraklēsei）, τῇ διδασκαλίᾳ（tē didaskalia）。冠詞表示這是眾人都知道的聚會項目。ἀνάγνωσις（anagnōsis） 在猶太會堂指公開誦讀律法和先知書（徒 13:15「讀完了律法和先知的書」），初期教會承接了這個做法，也宣讀使徒的書信（西 4:16；帖前 5:27）。次序也有意思：先讀經，後勸勉，再教導；勸勉與教導都從所讀的經文出來。追蹤字 διδασκαλία（didaskalia） 在 4:1 是「鬼魔的道理」，在這裡回到健康的教導。</p>","exp":"<p><strong>「你要以宣讀、勸勉、教導為念，直等到我來。」（4:13）——聚會的第一件事，是讓神的話被大聲讀出來。</strong></p><p>初期教會大多數信徒沒有自己的聖經，許多人也不識字。他們接觸神話語的主要方式，就是在聚會中聽人宣讀。主耶穌在拿撒勒會堂「站起來要念聖經」（路 4:16），保羅寫信也要求在眾人面前宣讀：「要把這信念給眾弟兄聽」（帖前 5:27）。</p><p>今天我們人手一本聖經，手機裡還有好幾種譯本，宣讀似乎變得不重要了。其實正好相反。聚會中公開讀經，提醒所有人：今天的權威不是講員，而是神的話；勸勉與教導都要從經文裡出來，而不是從講員的想法裡出來。一場聚會若讀經只佔三十秒，講道卻佔了五十分鐘，次序就容易倒過來。</p><p>「直等到我來」也很溫暖。保羅不是把提摩太丟在以弗所不管，他說他會回來；在這段等待的時間裡，提摩太要守住這三件事。這是一個屬靈父親交託給兒子的日常功課。</p>"},{"a":14,"z":14,"star":2,"grk":"<p lang=\"grc\">μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.</p>","lit":"<p>不要忽略那在你裡面的恩賜，就是藉著預言、伴隨長老團按手而賜給你的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ ἀμέλει</td><td>mē amelei</td><td>不要忽略</td><td>現在式禁令：不要一直放著不管</td></tr><tr><td>χαρίσματος</td><td>charismatos</td><td>恩賜</td><td>字典形 χάρισμα：從 χάρις 恩典而來的禮物</td></tr><tr><td>διὰ προφητείας</td><td>dia prophēteias</td><td>藉著預言</td><td>呼應 1:18「從前指著你的預言」</td></tr><tr><td>ἐπιθέσεως τῶν χειρῶν</td><td>epitheseōs tōn cheirōn</td><td>按手</td><td>μετὰ：伴隨按手，不是藉著按手</td></tr><tr><td>πρεσβυτερίου</td><td>presbyteriou</td><td>長老團</td><td>眾長老作為一個群體</td></tr></table>","gram":"<p><strong>4:14 說恩賜 ἐδόθη σοι（edothē soi）「被賜給你」——被動語態，真正的賜予者是神。兩個介系詞分工清楚：διὰ προφητείας（dia prophēteias） 是「藉著預言」，μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου（meta epitheseōs tōn cheirōn tou presbyteriou） 是「伴隨眾長老按手」。</strong></p><p>χάρισμα（charisma） 與 χάρις（charis） 同字根，是恩典具體落在一個人身上的禮物。μὴ ἀμέλει（mē amelei） 是現在式禁令，暗示提摩太可能正在退縮，或者因為年輕、因為反對而不敢使用；提後 1:6 保羅更直接地說要「再如火挑旺起來」。</p><p>按手的人在這裡是 τοῦ πρεσβυτερίου（tou presbyteriou），長老團；提後 1:6 說的是「藉我按手」。兩處可以並存：保羅與當地長老一同按手。介系詞的差別很重要：恩賜「藉著」預言被指明，「伴隨」按手被確認，按手本身不是恩賜的來源。徒 13:3 也是禁食禱告之後按手打發人，按手是教會承認、差遣、代禱的記號。5:22 保羅又提醒「給人行按手的禮，不可急促」，可見按手是慎重的事，不是儀式性的形式。</p>","exp":"<p><strong>「你不要輕忽所得的恩賜，就是從前藉著預言、在眾長老按手的時候賜給你的。」（4:14）——恩賜是神給的，也是教會一同確認的。</strong></p><p>按手禮傳遞甚麼？有些傳統把它看成一種能力的傳輸，好像手一按下去，恩賜就從一個人流到另一個人身上。經文的用字比這個更謹慎：恩賜是神賜下的，預言把它指明出來，長老們的按手則是教會在神面前一同承認、一同交託、一同代禱。按手不是魔法，是一份公開的託付。</p><p>這對提摩太很重要。當他因為年輕被人小看（4:12），當他面對假教師的反對而想退縮時，他可以回想那一天：神藉著預言說了話，眾長老把手放在他頭上，為他禱告，差遣他出去。他不是自己封自己的，是被神與教會一同差派的。這份記憶可以讓人在軟弱時站得住。</p><p>「不要輕忽」也是一個警告。恩賜像一塊田，不耕就長草。許多人有神所賜的恩賜，卻因為害怕失敗、怕別人的眼光、或者忙於別的事，就把它放在一邊。保羅說：不要放著不管。</p><p>對會眾來說，這一節也提醒教會的責任：按手不只是儀式的那一刻，被按手的人往後的成長，也需要眾人持續的代禱與扶持。</p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ᾖ πᾶσιν·</p><p lang=\"grc\">ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.</p>","lit":"<p>這些事你要反覆揣摩，要在這些事裡面，好使你的進展向眾人顯明。</p><p>你要留意你自己和那教導，要持續在其中；因為做這事，你既要救你自己，也要救那些聽你的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μελέτα</td><td>meleta</td><td>反覆揣摩</td><td>現在式命令：思想、操練、下功夫</td></tr><tr><td>ἐν τούτοις ἴσθι</td><td>en toutois isthi</td><td>要在這些事裡面</td><td>整個人沉浸其中</td></tr><tr><td>προκοπὴ</td><td>prokopē</td><td>長進</td><td>字面「往前砍路」：開路前進</td></tr><tr><td>ἔπεχε σεαυτῷ</td><td>epeche seautō</td><td>留意你自己</td><td>先看守自己</td></tr><tr><td>ἐπίμενε αὐτοῖς</td><td>epimene autois</td><td>要持續在其中</td><td>現在式命令：持守下去</td></tr><tr><td>σώσεις</td><td>sōseis</td><td>你要救</td><td>未來式：持守的結果</td></tr></table>","gram":"<p><strong>4:15–16 連用五個命令：μελέτα（meleta）, ἴσθι（isthi）, ἔπεχε（epeche）, ἐπίμενε（epimene），加上 4:14 的 μὴ ἀμέλει（mē amelei）。全都是現在式，表示持續的動作。</strong></p><p>μελέτα（meleta） 有「思想、揣摩、操練」的意思，與 4:7 的 γύμναζε（gymnaze） 形成呼應：操練不只是身體，也是心思的反覆。ἐν τούτοις ἴσθι（en toutois isthi） 字面是「在這些事裡面存在」，指整個人投入其中。ἵνα（hina） 帶出目的：σου ἡ προκοπὴ φανερὰ ᾖ πᾶσιν（sou hē prokopē phanera ē pasin），你的長進向眾人顯明。προκοπὴ（prokopē） 是開路前進的意思，提摩太不需要完美，但要讓人看見他在往前走——這正是回應 4:12「不可叫人小看你年輕」的方法。</p><p>4:16 的次序值得注意：ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ（epeche seautō kai tē didaskalia），先是 σεαυτῷ（seautō），再是 τῇ διδασκαλίᾳ（tē didaskalia）。追蹤字 διδασκαλία（didaskalia） 在這裡翻轉：要看守教訓，先要看守自己。結果子句 τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου（touto gar poiōn kai seauton sōseis kai tous akouontas sou） 的「救」是未來式，指在信心中持守到底，與 2:15 一樣不是說人靠自己的行為得救，而是說持守真道是得救之人必有的路。</p>","exp":"<p><strong>「你要謹慎自己和自己的教訓，要在這些事上恆心」（4:16）——先看守自己，再看守教訓。</strong></p><p>這一節的次序是給每一位服事者的鏡子。我們很容易倒過來：花很多時間檢查別人的教導對不對，卻很少檢查自己的生命。保羅先說「自己」，再說「教訓」，因為一位傳道人若自己的生命壞了，他的教訓再正確，也會失去力量；而且，教訓的偏差，常常是從生命的偏差開始的。</p><p>4:15 的「長進」也很溫柔。保羅沒有要提摩太完美無缺，他要的是「長進」，是讓人看見他在往前走。會眾不需要一位完美的牧者，他們需要一位誠實地在成長的牧者。一個肯承認「我還在學」的領袖，往往比一個假裝甚麼都懂的領袖更能帶人。</p><p>「又能救自己，又能救聽你的人」不是說傳道人可以成為別人的救主，救恩只屬於「萬人的救主」（4:10）。這裡的「救」，是指在真道上持守到底，使自己和聽眾都不被 4:1 那些引誘人的道理拖走。傳道人在這件事上有真實的責任：他自己站得穩，才能幫別人站得穩。</p><p>第 4 章就這樣走完一圈：從有人離棄真道（4:1），到提摩太要在真道上恆心（4:16）；從被烙慣了的良心（4:2），到一個天天操練敬虔、留意自己的生命。這是 321 常說的次序：先生命，後事工。經文先說完了，這個次序才接得上去。</p><p>對會眾而言，這一節也不只是寫給講台上的人。每一位在家中帶領兒女、在小組裡陪伴人的信徒，都在同一個責任裡：先留意自己的生命，再留意自己傳給別人的話。看守好自己，就是對身邊的人最好的保護。</p>"}],"5":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,</p><p lang=\"grc\">πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.</p>","lit":"<p>對一位年長的人，你不要嚴厲地斥打，而是要勸他，像對父親；對年輕的男人，像對弟兄；</p><p>對年長的婦女，像對母親；對年輕的婦女，像對姊妹，在一切的清潔裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πρεσβυτέρῳ</td><td>presbyterō</td><td>對一位年長的人</td><td>這裡指年紀，與 νεωτέρους 成對；5:17 才是職分</td></tr><tr><td>μὴ ἐπιπλήξῃς</td><td>mē epiplēxēs</td><td>不要斥打</td><td>新約只此一次；字面是「打上去」</td></tr><tr><td>παρακάλει</td><td>parakalei</td><td>要勸</td><td>現在式命令：一貫的態度</td></tr><tr><td>ὡς πατέρα</td><td>hōs patera</td><td>如同父親</td><td>四個 ὡς 的第一個</td></tr><tr><td>ὡς ἀδελφούς</td><td>hōs adelphous</td><td>如同弟兄</td><td>同輩的男人</td></tr><tr><td>ὡς μητέρας</td><td>hōs mēteras</td><td>如同母親</td><td>年長的婦女</td></tr><tr><td>ὡς ἀδελφὰς</td><td>hōs adelphas</td><td>如同姊妹</td><td>年輕的婦女</td></tr><tr><td>ἐν πάσῃ ἁγνείᾳ</td><td>en pasē hagneia</td><td>在一切的清潔裡</td><td>4:12「清潔」同字；5:22 ἁγνὸν 同字根</td></tr></table>","gram":"<p><strong>兩節經文只有一個動詞。</strong>μὴ ἐπιπλήξῃς（mē epiplēxēs） 是不定過去式假設語氣加 μὴ（mē），禁止一個動作開頭：「連一次都不要」。ἐπιπλήξῃς（epiplēxēs） 在新約只出現這一次，字根是「打」，意思是厲聲斥責，像揮出去的一拳。接著 ἀλλὰ（alla） 轉向現在式命令 παρακάλει（parakalei）：不是偶爾勸一下，是一直用勸的態度。然後這個動詞一路管下去，帶出四組受詞，每一組都用 ὡς（hōs） 接一個家人的稱呼。和合本把「勸」重複四次，原文只寫一次，四個人共用一個動作。</p><p>Πρεσβυτέρῳ（Presbyterō） 與 5:17 的 πρεσβύτεροι（presbyteroi） 同字，但這裡與 νεωτέρους（neōterous） 成對，又接著 πρεσβυτέρας（presbyteras） 與 νεωτέρας（neōteras），四個詞是兩代、兩性的排列，所以指的是年紀，不是職分。到 5:17 加上 Οἱ καλῶς προεστῶτες（Hoi kalōs proestōtes），才轉成「長老」的職分。同一個字先講家人、後講職分，次序本身就有意思。</p><blockquote><p>ἐν πάσῃ ἁγνείᾳ（en pasē hagneia） 放在最後一組之後。文法上可以管全部四組，位置上最貼近「少年婦女」。ἁγνεία（hagneia） 在全卷出現兩次，另一次是 4:12 提摩太要作榜樣的「清潔」；5:22 的 σεαυτὸν ἁγνὸν τήρει（seauton hagnon tērei） 又用同字根收尾。一位年輕的傳道人，清潔是從他對待姊妹的方式開始的。</p></blockquote>","exp":"<p>以弗所教會遇到甚麼？提摩太年輕，保羅要他「不可叫人小看你年輕」（4:12）。可是年輕的領袖最容易犯兩種錯：面對比他年長的人，不是怕，就是硬。教會裡傳異教的人裡面，很可能有些年紀比他大、資歷比他深。年輕人一急，就容易拍桌子。</p><p>保羅的原則只有一句：「不可嚴責老年人，只要勸他如同父親」（5:1）。第 3 章說教會是「真理的柱石和根基」（3:15），也說它是「神的家」。這兩節把「家」落到稱呼上：父親、弟兄、母親、姊妹。<strong>這是家事，不是人事。</strong>公司處理一位出錯的資深員工，照人事規章辦；家裡處理一位做錯事的父親，你會先記得他是你父親。規矩可以一樣，口氣不會一樣。耶穌早就這樣定義祂的家：「凡遵行我天父旨意的人，就是我的弟兄姊妹和母親了」（太 12:50）。</p><p>「勸」不等於不說。παρακαλέω（parakaleō） 包括懇求、勸誡、扶持，裡面有真話，只是不帶拳頭。家的溫度也不等於「家醜不可外揚」。同一章到了 5:20，確實犯罪的長老「當在眾人面前責備他」——家人的稱呼管的是口氣，不是用來遮蓋罪。把「家」當成不可以說真話的理由，是把這兩節讀歪了。</p><p>對少年婦女，保羅加了一句：「總要清清潔潔的」（5:2）。年輕的傳道人與姊妹之間，最好的保護不是冷淡，是清楚：像對待自己的姊妹那樣，沒有曖昧，也沒有私下的特權。這一句保護姊妹，也保護傳道人自己。教會所有的規矩，都從家人的稱呼開始；稱呼對了，很多事就不會走到需要規矩的地步。</p>"},{"a":3,"z":4,"star":3,"grk":"<p lang=\"grc\">Χήρας τίμα τὰς ὄντως χήρας.</p><p lang=\"grc\">εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.</p>","lit":"<p>寡婦你要尊敬，就是那些真是寡婦的。</p><p>但若有一位寡婦有兒女或孫輩，讓他們先學著向自己的家盡敬虔，並且把回報還給先人；因為這在神面前是蒙悅納的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τίμα</td><td>tima</td><td>要尊敬</td><td>τιμάω：尊敬，也包括實際的供養</td></tr><tr><td>τὰς ὄντως χήρας</td><td>tas ontōs chēras</td><td>那真是寡婦的</td><td>ὄντως 與 6:19「那真正的生命」同字</td></tr><tr><td>μανθανέτωσαν πρῶτον</td><td>manthanetōsan prōton</td><td>讓他們先學</td><td>主詞是兒女與孫輩</td></tr><tr><td>τὸν ἴδιον οἶκον εὐσεβεῖν</td><td>ton idion oikon eusebein</td><td>向自己的家盡敬虔</td><td>εὐσέβεια 追蹤；和合本譯「行孝」</td></tr><tr><td>ἀμοιβὰς ἀποδιδόναι</td><td>amoibas apodidonai</td><td>把回報還出去</td><td>ἀμοιβή 新約只此一次</td></tr><tr><td>τοῖς προγόνοις</td><td>tois progonois</td><td>給先人</td><td>父母與祖父母兩代</td></tr><tr><td>ἀπόδεκτον ἐνώπιον τοῦ θεοῦ</td><td>apodekton enōpion tou theou</td><td>在神面前蒙悅納</td><td>與 2:3 同一句型</td></tr></table>","gram":"<p><strong>5:3 是一個框住的句子。</strong>Χήρας τίμα τὰς ὄντως χήρας（Chēras tima tas ontōs chēras）：「寡婦」在頭，「寡婦」在尾，中間夾著命令 τίμα（tima）。第二個「寡婦」前面加了 ὄντως（ontōs），「真正的」。這個副詞在本段出現三次（5:3、5、16），像三根釘子把整段釘住；全卷第四次是 6:19 τῆς ὄντως ζωῆς（tēs ontōs zōēs），「那真正的生命」。</p><p>τίμα（tima） 是 τιμάω（timaō） 的命令式。這個字在希臘文裡不只是心裡的敬重，常常包括實際的供養——耶穌責備法利賽人用「各耳板」逃避奉養父母（可 7:11--12），用的正是「孝敬父母」這條誡命。所以 5:3 的「尊敬」接下去就談到誰來供應；5:17 的 τιμῆς（timēs） 也要照這個意思讀。</p><p>5:4 的主要動詞 μανθανέτωσαν（manthanetōsan） 是第三人稱複數命令式。主詞是誰？有人讀作寡婦自己「學著」照顧家；但動詞是複數，前面最近的複數是 τέκνα ἢ ἔκγονα（tekna ē ekgona），而且下文說「報答」先人，所以主詞是兒女和孫輩。和合本也這樣讀。</p><blockquote><p>最要緊的是 τὸν ἴδιον οἶκον εὐσεβεῖν（ton idion oikon eusebein）。εὐσεβεῖν（eusebein） 就是「敬虔」的動詞，與 2:2、3:16、4:7--8 的 εὐσέβεια（eusebeia） 同一個字根。和合本譯作「行孝」，譯得很中文；原文的意思更重：<strong>照顧年老的父母，是敬虔的一部分。</strong>ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις（amoibas apodidonai tois progonois），「把回報還給先人」；結尾 ἀπόδεκτον ἐνώπιον τοῦ θεοῦ（apodekton enōpion tou theou） 與 2:3 為萬人禱告「可蒙悅納」是同一句型。</p></blockquote>","exp":"<p>從使徒行傳開始，教會就在照顧寡婦，而且照顧出了問題：「因為在天天的供給上忽略了他們的寡婦」（徒 6:1）。到了以弗所，問題倒過來：名單愈來愈長，有些人其實有家人可以倚靠，教會的力量反而照顧不到真正沒有人管的人。雅各說得更直接，敬虔「就是看顧在患難中的孤兒寡婦」（雅 1:27）。</p><p>保羅的第一句話是：「要尊敬那真為寡婦的」（5:3）。重點在「真」。這不是要教會變得小氣，是要把有限的照顧，給那真正沒有倚靠的人。</p><p>第二句話把責任先交還給家：「便叫他們先在自己家中學著行孝，報答親恩」（5:4）。華人讀這一節很容易點頭，因為我們本來就講孝。可是保羅用的字不是「孝」，是「敬虔」。這把孝道從文化義務，提到神面前：你怎樣對待那個養你長大、如今老了的人，就是你的敬虔在家裡的樣子。「因為這在神面前是可悅納的」（5:4）——神看見的，不只是聚會裡的手舉得多高，也包括週末有沒有回家看看父母。</p><p>還要看清楚這裡的內容是甚麼。5:4 的「行孝」放在供養寡婦的上下文裡，指的是照顧、供應、報答，也就是 5:1--2 的「如同父親」「如同母親」那種尊重。它談的不是成年兒女要在每一件事上服從父母的安排。<strong>看顧與順從是兩回事</strong>，5:8 會把這一點說得更清楚。</p><p>次序也值得留意：保羅說「先」在自己家中學。不是教會不管，是家人先管；教會接住的，是家人接不住、或根本沒有家人的那一位。一間教會若讓有兒女的寡婦全靠教會，表面上很有愛心，其實是讓那些兒女錯過了在家裡學敬虔的機會。</p>"},{"a":5,"z":7,"star":1,"grk":"<p lang=\"grc\">ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·</p><p lang=\"grc\">ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.</p><p lang=\"grc\">καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·</p>","lit":"<p>但那真是寡婦、又被留下獨自一人的，已經把盼望放在神身上，並且晝夜恆常持守在祈求和禱告中；</p><p>但那放縱享樂的，活著，卻已經死了。</p><p>這些事你也要囑咐，好叫她們成為無可指摘的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μεμονωμένη</td><td>memonōmenē</td><td>被留下獨自一人的</td><td>完成式被動分詞：孤單已成事實</td></tr><tr><td>ἤλπικεν ἐπὶ θεὸν</td><td>ēlpiken epi theon</td><td>已經把盼望放在神身上</td><td>完成式：放上去，一直放著</td></tr><tr><td>προσμένει</td><td>prosmenei</td><td>恆常持守</td><td>現在式：持續不斷</td></tr><tr><td>ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς</td><td>tais deēsesin kai tais proseuchais</td><td>在祈求和禱告中</td><td>與 2:1 同一對詞</td></tr><tr><td>σπαταλῶσα</td><td>spatalōsa</td><td>放縱享樂的</td><td>雅 5:5 同字</td></tr><tr><td>ζῶσα τέθνηκεν</td><td>zōsa tethnēken</td><td>活著，卻已經死了</td><td>現在分詞對完成式</td></tr><tr><td>παράγγελλε</td><td>parangelle</td><td>要囑咐</td><td>παραγγέλλω 追蹤</td></tr><tr><td>ἀνεπίλημπτοι</td><td>anepilēmptoi</td><td>無可指摘的</td><td>3:2 監督的第一條資格同字</td></tr></table>","gram":"<p><strong>5:5 與 5:6 用兩個 δέ（de） 對照兩種寡婦。</strong>第一種：ἡ δὲ ὄντως χήρα καὶ μεμονωμένη（hē de ontōs chēra kai memonōmenē），真是寡婦，而且被留下獨自一人。μεμονωμένη（memonōmenē） 是完成式被動分詞，孤單不是心情，是已經成形的處境。她有兩個動作：ἤλπικεν（ēlpiken） 是完成式，盼望放在神身上，而且一直放著；προσμένει（prosmenei） 是現在式，持續留在祈求與禱告裡。ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς（tais deēsesin kai tais proseuchais） 這一對詞，正是 2:1 保羅勸全教會「為萬人懇求、禱告」用的字。</p><p>第二種：ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν（hē de spatalōsa zōsa tethnēken）。只有三個字，卻是全段最重的一句。σπαταλῶσα（spatalōsa） 是放縱、奢華度日；ζῶσα（zōsa） 是現在分詞「活著」，τέθνηκεν（tethnēken） 是完成式「已經死了」。活與死放在同一個人身上，是刻意的矛盾修辭。</p><p>5:7 的 παράγγελλε（parangelle） 是全卷第五條追蹤字，從 1:3 的「囑咐」一路下來。ἀνεπίλημπτοι（anepilēmptoi） 與 3:2 監督「必須無可指責」同一個字：寡婦與監督，用的是同一把尺。</p>","exp":"<p>「那獨居無靠、真為寡婦的，是仰賴神，晝夜不住地祈求禱告」（5:5）。這讓我們想起聖殿裡的亞拿，八十四歲，「禁食祈求，晝夜事奉神」（路 2:37）。真為寡婦的，不只是被照顧的人，她自己也在服事：她是教會的禱告者。一間教會若記得這些獨居的長者，就多了一群晝夜為它禱告的人。</p><p>對照的那一位，「但那好宴樂的寡婦正活著的時候也是死的」（5:6）。保羅沒有說她窮，也沒有說她孤單，說的是她把日子花在享樂上。身體活著，裡面卻已經沒有盼望的方向。這句話的鋒利，不是用來羞辱任何一位寡婦，是要教會分辨：照顧的是需要，不是助長放縱。</p><p>「這些事你要囑咐她們，叫她們無可指責」（5:7）。這個標準，與第 3 章對監督的要求是同一個字。教會裡沒有一群人比較次要。被照顧的人和照顧人的人，在神面前站在同一個標準下，也同樣被尊重。</p>"},{"a":8,"z":8,"star":3,"grk":"<p lang=\"grc\">εἰ δέ τις τῶν ἰδίων καὶ μάλιστα οἰκείων οὐ προνοεῖ τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.</p>","lit":"<p>但若有人不預先供應自己的人，尤其是家裡的人，他就已經否認了信仰，並且比不信的人更壞。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τῶν ἰδίων</td><td>tōn idiōn</td><td>自己的人</td><td>親屬，較廣的一圈</td></tr><tr><td>μάλιστα οἰκείων</td><td>malista oikeiōn</td><td>尤其是家裡的人</td><td>οἶκος 追蹤；同住、同一家的人</td></tr><tr><td>οὐ προνοεῖ</td><td>ou pronoei</td><td>不預先供應</td><td>字面「先想」：先想到、先預備</td></tr><tr><td>τὴν πίστιν ἤρνηται</td><td>tēn pistin ērnētai</td><td>已經否認了信仰</td><td>完成式：行為已經說出立場</td></tr><tr><td>ἀπίστου χείρων</td><td>apistou cheirōn</td><td>比不信的人更壞</td><td>連外邦人都知道奉養父母</td></tr></table>","gram":"<p><strong>5:8 的動詞是 προνοεῖ（pronoei），不是「順從」。</strong>προνοέω（pronoeō） 字面是「先想」，意思是預先想到、預先預備，在新約裡指供應與安排：保羅說他募款時 προνοοῦμεν（pronooumen），「留心行光明的事」（林後 8:21）。本節夾在 5:4 的「報答」與 5:16 的 ἐπαρκείτω（eparkeitō）「救濟」中間，講的是經濟與生活上的照顧。新約談兒女「聽從」用的是另一個字，ὑπακούετε（弗 6:1），而且對象是還在家中受養育的兒女，同一段也立刻要求作父親的「不要惹兒女的氣」（弗 6:4）。</p><p>受詞分兩圈：τῶν ἰδίων（tōn idiōn） 是自己的親屬，μάλιστα οἰκείων（malista oikeiōn） 是其中更近的家裡人。後果也分兩層：τὴν πίστιν ἤρνηται（tēn pistin ērnētai） 用完成式，不供應自己家人的人，行為已經說出他否認了信仰；ἀπίστου χείρων（apistou cheirōn），連不信的人都不如——希臘羅馬社會本來就把奉養父母視為基本的義務。</p><blockquote><p>條件句 εἰ δέ τις（ei de tis） 是泛指，「若有人」，不分男女。5:16 再回到「信主的婦女」，是另一個具體處境。</p></blockquote>","exp":"<p>這是全章最重的一句：「人若不看顧親屬，就是背了真道，比不信的人還不好，不看顧自己家裡的人，更是如此」（5:8）。正因為它重，所以最容易被拿來壓人。這一節有兩種讀歪的方式，方向相反，都要擋住。</p><p><strong>第一種，把「看顧」讀成「順從」。</strong>有人用 5:4、5:8 對一位從小被打、被羞辱、被控制的成年兒女說：「你不回家，就是背了真道。」也有人用它要求成年兒女交出全部收入、聽從父母安排婚姻與工作，甚至要受害者回到施暴的人身邊。可是經文的動詞是 προνοέω（pronoeō），是供應與照顧；它沒有說要承受虐待，也沒有說要放棄判斷。照顧可以有很多樣子：負擔生活費、安排醫療與長照、與兄弟姊妹分工、透過第三方聯絡、在有人陪同的安全場合探望。若有人身、性或經濟上的虐待，先顧安全，必要時尋求專業協助與法律保護；這和 5:8 不衝突，反而是在保護一個同樣屬於神家的人。</p><p><strong>第二種，用「界線」取消孝道。</strong>今天有人說：「我有界線，所以我對父母沒有虧欠。」保羅不接受這種說法。「當孝敬父母」（出 20:12）是帶著應許的誡命；耶穌也責備用宗教理由逃避奉養父母的人（可 7:11--12）。<strong>界線決定怎樣看顧，不決定要不要看顧。</strong>界線可以保護我不再受傷，卻不給我理由讓一位年老無靠的母親無人照料。</p><p>把兩邊放在一起，5:8 的意思就清楚了：成年兒女對年老的父母有供應的責任，這是敬虔在家裡的樣子；這份責任的內容是看顧，不是無條件的順從，更不是繼續承受傷害。華人的孝道常常把「孝」與「順」綁在一起，保羅的字卻是「敬虔」與「供應」。這讓一個受過傷的人，也能在神面前找到盡孝的路。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,</p><p lang=\"grc\">ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.</p>","lit":"<p>寡婦要被列入名冊，年歲不少於六十，是一個丈夫的妻子，</p><p>在美好的工作上有見證：若她養育過兒女，若她接待過陌生人，若她洗過聖徒的腳，若她救助過受壓的人，若她跟隨過各樣良善的工作。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Χήρα καταλεγέσθω</td><td>Chēra katalegesthō</td><td>寡婦要被列入名冊</td><td>καταλέγω 新約只此一次</td></tr><tr><td>μὴ ἔλαττον ἐτῶν ἑξήκοντα</td><td>mē elatton etōn hexēkonta</td><td>年歲不少於六十</td><td>當時的「老年」門檻</td></tr><tr><td>ἑνὸς ἀνδρὸς γυνή</td><td>henos andros gynē</td><td>一個丈夫的妻子</td><td>與 3:2 μιᾶς γυναικὸς ἀνήρ 成對</td></tr><tr><td>ἐν ἔργοις καλοῖς μαρτυρουμένη</td><td>en ergois kalois martyroumenē</td><td>在美好的工作上有見證</td><td>καλός 追蹤</td></tr><tr><td>ἐτεκνοτρόφησεν</td><td>eteknotrophēsen</td><td>養育過兒女</td><td>新約只此一次</td></tr><tr><td>ἐξενοδόχησεν</td><td>exenodochēsen</td><td>接待過陌生人</td><td>新約只此一次</td></tr><tr><td>ἁγίων πόδας ἔνιψεν</td><td>hagiōn podas enipsen</td><td>洗過聖徒的腳</td><td>約 13 的動作</td></tr><tr><td>θλιβομένοις ἐπήρκεσεν</td><td>thlibomenois epērkesen</td><td>救助過受壓的人</td><td>與 5:16 ἐπαρκείτω 同字</td></tr><tr><td>ἐπηκολούθησεν</td><td>epēkolouthēsen</td><td>跟隨過</td><td>5:24 ἐπακολουθοῦσιν 同字</td></tr></table>","gram":"<p><strong>5:9 換了一個動詞：καταλεγέσθω（katalegesthō），「被列入名冊」。</strong>前面講的是誰該被照顧，這裡講的是一份正式的名單。這個字在新約只出現這一次，原是登錄兵籍、登錄團體成員的字，暗示以弗所教會已經有一群被承認的寡婦，有她們的身分與服事（5:5 的禱告、5:10 的接待）。</p><p>資格有三：年歲 μὴ ἔλαττον ἐτῶν ἑξήκοντα（mē elatton etōn hexēkonta）；ἑνὸς ἀνδρὸς γυνή（henos andros gynē）；ἐν ἔργοις καλοῖς μαρτυρουμένη（en ergois kalois martyroumenē）。第二項與 3:2 監督的 μιᾶς γυναικὸς ἀνήρ（mias gynaikos anēr） 正好成對。它不太可能是「一生只結過一次婚」：5:14 保羅自己要年輕的寡婦再嫁，若這樣讀，聽從 5:14 的人日後反而失去資格。比較好的讀法是婚姻中的專一與忠誠。</p><blockquote><p>5:10 連用五個 εἰ（ei） 子句，動詞全是不定過去式：ἐτεκνοτρόφησεν（eteknotrophēsen）、ἐξενοδόχησεν（exenodochēsen）、ἔνιψεν（enipsen）、ἐπήρκεσεν（epērkesen）、ἐπηκολούθησεν（epēkolouthēsen）。這是在回顧一生，不是考一次試。前兩個是新約只出現在這裡的合成字；最後一個 ἐπηκολούθησεν（epēkolouthēsen） 會在 5:24 以 ἐπακολουθοῦσιν（epakolouthousin） 再出現：善行跟隨著她，罪也跟隨著人。</p></blockquote>","exp":"<p>「寡婦記在冊子上，必須年紀到六十歲，從來只作一個丈夫的妻子」（5:9）。這份名冊不只是救濟名單，也是一份服事的名單。在古代，六十歲大概已經是再婚與謀生都不容易的年紀；教會在這裡作的是長期的承諾：她把餘生交在禱告與服事裡，教會負責她的生活。</p><p>資格幾乎全是品格，與第 3 章監督、執事的資格一樣：不是看她有甚麼頭銜，是看她怎樣活過來。「洗聖徒的腳」（5:10）是最卑微的服事，主耶穌在最後的晚餐親自做過。養育兒女、接待遠人、救濟遭難的人——這些都是在家裡、在門口、在沒有講台的地方做的事。神的家記得的，正是這些沒有人鼓掌的事。</p><p>今天的教會不一定要照抄「六十歲」這條線，但原則仍然清楚：長期的照顧，給真正沒有倚靠的人；被教會正式託付的人，要有一段被看見的生命。這兩件事都在保護人：保護被照顧的人不被輕看，也保護教會的資源不被濫用。</p><p>「從來只作一個丈夫的妻子」也不要讀成對再婚者的審判。保羅在下一段就要年輕的寡婦再嫁；這一句看重的是她在婚姻中的忠誠，不是她的婚姻史。</p>"},{"a":11,"z":15,"star":2,"grk":"<p lang=\"grc\">νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,</p><p lang=\"grc\">ἔχουσαι κρίμα ὅτι τὴν πρώτην πίστιν ἠθέτησαν·</p><p lang=\"grc\">ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.</p><p lang=\"grc\">βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·</p><p lang=\"grc\">ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.</p>","lit":"<p>但年輕的寡婦你要推辭；因為每當她們的情慾發動、與基督相背的時候，她們就想要嫁人，</p><p>她們擔著判決，因為她們廢棄了起初的信諾；</p><p>同時她們也學會閒懶，在各家中走來走去；不只是閒懶，而且是多話的、好管閒事的，說那些不該說的。</p><p>所以我願意年輕的婦女嫁人、生兒女、管理家，不給敵對的人任何辱罵的藉口；</p><p>因為已經有些人轉向，跟在撒但的後面去了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>νεωτέρας δὲ χήρας παραιτοῦ</td><td>neōteras de chēras paraitou</td><td>年輕的寡婦你要推辭</td><td>推辭的是入冊，不是人</td></tr><tr><td>καταστρηνιάσωσιν τοῦ Χριστοῦ</td><td>katastrēniasōsin tou Christou</td><td>情慾發動、與基督相背</td><td>新約只此一次</td></tr><tr><td>τὴν πρώτην πίστιν ἠθέτησαν</td><td>tēn prōtēn pistin ēthetēsan</td><td>廢棄了起初的信諾</td><td>πίστις 在這裡是「誓約」</td></tr><tr><td>ἀργαὶ μανθάνουσιν</td><td>argai manthanousin</td><td>學會閒懶</td><td>反諷：學錯了東西</td></tr><tr><td>περιερχόμεναι τὰς οἰκίας</td><td>perierchomenai tas oikias</td><td>在各家中走來走去</td><td>οἶκος 追蹤</td></tr><tr><td>φλύαροι καὶ περίεργοι</td><td>phlyaroi kai periergoi</td><td>多話、好管閒事</td><td>περίεργοι：在別人的事上忙</td></tr><tr><td>βούλομαι οὖν νεωτέρας γαμεῖν</td><td>boulomai oun neōteras gamein</td><td>所以我願意年輕的嫁人</td><td>保羅的正面心意</td></tr><tr><td>οἰκοδεσποτεῖν</td><td>oikodespotein</td><td>管理家</td><td>新約只此一次；很重的字</td></tr><tr><td>ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ</td><td>exetrapēsan opisō tou Satana</td><td>轉向跟在撒但後面</td><td>與 1:6 同一個動詞</td></tr></table>","gram":"<p><strong>παραιτοῦ（paraitou） 推辭的是名冊，不是人。</strong>同一個命令式在 4:7 用在「老婦荒渺的話」上；這裡的受詞是年輕寡婦入冊的申請。理由由 γὰρ（gar） 帶出：ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ（hotan gar katastrēniasōsin tou Christou）, γαμεῖν θέλουσιν（gamein thelousin）。καταστρηνιάσωσιν（katastrēniasōsin） 新約只此一次，字面是「慾望發動而背向基督」；被定罪的不是 γαμεῖν θέλουσιν（gamein thelousin）「想嫁人」本身，而是 5:12 τὴν πρώτην πίστιν ἠθέτησαν（tēn prōtēn pistin ēthetēsan）。</p><p>τὴν πρώτην πίστιν（tēn prōtēn pistin） 有兩種讀法。①入冊時對基督的誓約：她們承諾以餘生專心禱告服事，後來又反悔；②她們起初的信仰：再嫁給不信的人，以致離開信仰。和合本「當初所許的願」取第一種。本講義也取第一種，因為 5:14 保羅隨即「願意」她們嫁人——問題不在婚姻，在一個不該太早許下、許了又守不住的誓約。</p><p>5:13 有一個反諷：ἀργαὶ μανθάνουσιν（argai manthanousin），她們「學」的是閒懶。2:11 保羅要女人 μανθανέτω（manthanetō），好好學道；這裡卻學錯了東西。λαλοῦσαι τὰ μὴ δέοντα（lalousai ta mē deonta），說不該說的，可能不只是閒話，也包括挨家傳講異教的話。</p><blockquote><p>5:14 一口氣三個不定詞：γαμεῖν（gamein）、τεκνογονεῖν（teknogonein）、οἰκοδεσποτεῖν（oikodespotein）。4:3 傳異教的人「禁止嫁娶」，保羅卻說要嫁、要生、要管家。οἰκοδεσποτεῖν（oikodespotein） 是「作一家之主」，在新約只出現這裡，給婦女的位置很高。5:15 的 ἐξετράπησαν（exetrapēsan） 與 1:6 那些「偏離」的人同一個動詞——偏離真道的，有男也有女。</p></blockquote>","exp":"<p>「至於年輕的寡婦，就可以辭她」（5:11）。聽起來很冷，其實是很深的牧養智慧。一位三十出頭、剛失去丈夫的姊妹，在最痛的時候，很可能願意許下一生的承諾：「我以後只服事主。」保羅知道，人在哀傷裡許的願，未必是幾年後的心。教會若太快接受，等於替她立了一個她很可能守不住的重擔。</p><p>所以保羅說：「所以我願意年輕的寡婦嫁人」（5:14）。這一句要讀進去：保羅不是勉強允許再婚，是正面地「願意」。這與他在哥林多前書說寡婦可以「隨意再嫁」（林前 7:39）一致。今天的教會面對年輕的寡婦或單親的姊妹，不要用屬靈的話把她推進一個不屬於她的誓言，也不要用眼光讓她為再婚感到羞愧。</p><p>5:13 描寫的閒懶、說長道短，不要讀成「女人都是這樣」。保羅在描寫一個具體的處境：沒有家、沒有工作、被教會供養的年輕人，很容易在各家之間流動，成了傳話的人，甚至成了假教訓的傳遞者。任何人在這種處境裡都會有同樣的危險。「因為已經有轉去隨從撒但的」（5:15），用的是 1:6 描寫那些偏離真道的人的同一個字。保羅的解決辦法不是把人關起來，是讓她有一個家、有一份託付、有一個可以建立的生活。</p>"},{"a":16,"z":16,"star":1,"grk":"<p lang=\"grc\">εἴ τις πιστὴ ἔχει χήρας, ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.</p>","lit":"<p>若有一位信主的婦女有寡婦，讓她救助她們，不要讓教會受重擔，好叫教會可以救助那些真是寡婦的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἴ τις πιστὴ</td><td>ei tis pistē</td><td>若有一位信主的婦女</td><td>SBLGNT；RP 作 πιστὸς ἢ πιστὴ</td></tr><tr><td>ἐπαρκείτω αὐταῖς</td><td>eparkeitō autais</td><td>讓她救助她們</td><td>與 5:10 ἐπήρκεσεν 同字</td></tr><tr><td>μὴ βαρείσθω ἡ ἐκκλησία</td><td>mē bareisthō hē ekklēsia</td><td>不要讓教會受重擔</td><td>現在式命令：不要一直壓著</td></tr><tr><td>ταῖς ὄντως χήραις</td><td>tais ontōs chērais</td><td>那些真是寡婦的</td><td>ὄντως 第三次，收住全段</td></tr></table>","gram":"<p><strong>◆ 經文鑑別。</strong>本節開頭有兩種讀法：</p><p>①SBLGNT 作 εἴ τις πιστὴ ἔχει χήρας（ei tis pistē echei chēras），「若有一位信主的婦女有寡婦」。支持它的是幾份最早的大楷抄本與亞歷山大抄本群。②RP（拜占庭多數本）作 εἴ τις πιστὸς ἢ πιστὴ（ei tis pistos ē pistē），「信主的男人或婦女」，見於較晚的多數抄本。</p><p>判斷：取 SBLGNT。外證上短讀較早；內證上，抄經者看見 5:4、5:8 是泛指，很容易補上 πιστὸς ἢ（pistos ē） 讓命令也包括男人，卻很難想像有人會刻意刪掉男人。和合本「信主的婦女」正是照 SBLGNT。兩種讀法的教導其實不衝突：男人的責任 5:8 已經說過了，本節是加上一個具體的處境。</p><p>ἐπαρκείτω（eparkeitō） 與 5:10 寡婦「救濟遭難的人」同字；ταῖς ὄντως χήραις（tais ontōs chērais） 是 ὄντως（ontōs） 在本段的第三次，與 5:3 首尾呼應。</p>","exp":"<p>「信主的婦女，若家中有寡婦，自己就當救濟她們」（5:16）。這很可能是一位家境較好的姊妹，家裡住著守寡的親戚，或是靠她生活的寡婦。新約裡有不少這樣的婦女：開門接待教會的呂底亞，作許多人保護者的非比。保羅沒有把她們當作旁觀者，而是把她們當作神家裡第一線的照顧者。</p><p>理由很實際：「不可累著教會，好使教會能救濟那真無倚靠的寡婦」（5:16）。教會的力量有限，家人、親族、身邊的網絡能接住的，先接住；教會的錢與人，才留得給那些身邊一個人都沒有的。這不是推卸責任，是分工。今天教會設立關懷基金、探訪長者，也可以照這個次序思考：先問誰在她身邊，再問教會補上甚麼。這樣，最孤單的那一位才不會被漏掉；有能力的弟兄姊妹，也才有機會在自己家門口操練敬虔。</p>"},{"a":17,"z":18,"star":3,"grk":"<p lang=\"grc\">Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·</p><p lang=\"grc\">λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.</p>","lit":"<p>那些好好站在前面帶領的長老，要算為配得加倍的尊榮，尤其是那些在話語和教導上勞苦的；</p><p>因為經上說：「踹穀的牛，你不可籠住牠的嘴」，又說：「工人配得他的工價。」</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οἱ καλῶς προεστῶτες πρεσβύτεροι</td><td>Hoi kalōs proestōtes presbyteroi</td><td>那些好好帶領的長老</td><td>3:4 προϊστάμενον 同字</td></tr><tr><td>διπλῆς τιμῆς</td><td>diplēs timēs</td><td>加倍的尊榮</td><td>τιμή：尊敬兼酬金</td></tr><tr><td>ἀξιούσθωσαν</td><td>axiousthōsan</td><td>要算為配得</td><td>與 5:18 Ἄξιος 同字根</td></tr><tr><td>μάλιστα</td><td>malista</td><td>尤其</td><td>或讀「就是」</td></tr><tr><td>οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ</td><td>hoi kopiōntes en logō kai didaskalia</td><td>在話語和教導上勞苦的</td><td>διδασκαλία 追蹤</td></tr><tr><td>λέγει γὰρ ἡ γραφή</td><td>legei gar hē graphē</td><td>因為經上說</td><td>一個動詞帶兩句引文</td></tr><tr><td>Βοῦν ἀλοῶντα οὐ φιμώσεις</td><td>Boun aloōnta ou phimōseis</td><td>踹穀的牛你不可籠嘴</td><td>申 25:4</td></tr><tr><td>Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ</td><td>Axios ho ergatēs tou misthou autou</td><td>工人配得他的工價</td><td>與路 10:7 一字不差</td></tr></table>","gram":"<p><strong>5:17 的 τιμῆς（timēs） 要接著 5:3 的 τίμα（tima） 讀。</strong>寡婦的「尊敬」包括供養，長老的 διπλῆς τιμῆς（diplēs timēs） 也一樣。「加倍」有兩種理解：①尊敬加上酬金，兩樣都給；②慷慨、充足的供應，不是精算出來的兩倍薪水。兩者都承認這裡有經濟的成分，5:18 的「工價」就是證據。</p><p>Οἱ καλῶς προεστῶτες（Hoi kalōs proestōtes） 與 3:4--5 監督要 καλῶς（kalōs） 管理自己的家用同一個字：先在家裡管得好，才在神的家裡管。μάλιστα（malista） 一般譯「尤其」，表示長老中有一部分特別在話語與教導上勞苦；也有學者主張讀作「就是」，那麼所有長老都在教導。本講義取「尤其」，但兩種讀法都把教導放在供應的中心。κοπιῶντες（kopiōntes） 是現在分詞，「勞苦」是累到疲乏的字，不是坐辦公室的頭銜。</p><p><strong>◆ 5:18 的引文。</strong>λέγει γὰρ ἡ γραφή（legei gar hē graphē） 之後有兩句話。第一句 Βοῦν ἀλοῶντα οὐ φιμώσεις（Boun aloōnta ou phimōseis） 引自申 25:4，保羅把「牛」放到句首加重；申命記原是保護替人踹穀的牲口，保羅在林前 9:9 也用同一句講傳道人的供應。第二句 Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ（Axios ho ergatēs tou misthou autou），舊約找不到，卻與路 10:7 耶穌差遣七十人時的話一字不差（太 10:10 作「飲食」）。</p><blockquote><p>兩種讀法：①「經上說」只管前一句，καί（kai） 之後是另引一句眾所周知的主的話；②一個 λέγει（legei） 管兩句，那麼保羅把耶穌的話（或已成文的福音書）與申命記並稱為 ἡ γραφή（hē graphē）。文法上，一個動詞接 καί（kai） 再接第二句，比較自然的是第二種。本講義的判斷：傾向第二種，但不用這一節去斷定路加福音成書的年代；至少可以確定，保羅把主的話與律法放在同一個權威上。這使我們想起彼後 3:16 把保羅的信與「別的經書」並列。</p></blockquote>","exp":"<p>以弗所教會有一群勞苦的長老，也有一群「以敬虔為得利」的人。保羅在這裡要同時對兩邊說話。</p><p>對教會：「那善於管理教會的長老，當以為配受加倍的敬奉；那勞苦傳道教導人的，更當如此」（5:17）。供應傳道人，不是施捨，是本分。保羅用兩句經文作根據。第一句是「牛在場上踹穀的時候，不可籠住牠的嘴」（申 25:4）——本系列申命記講義第 25 章講過，神連替人工作的牛都顧念，讓牠邊走邊吃。第二句是主耶穌的話：「你們要住在那家，吃喝他們所供給的，因為工人得工價是應當的」（路 10:7）。華人教會有一種很深的想法，以為傳道人愈窮愈屬靈。這兩句經文都不支持。讓一位全時間教導的人為生活焦慮，是教會沒有盡本分。</p><p>對傳道人：同一封信也說，有人「以敬虔為得利的門路」（6:5）。「加倍的敬奉」不是要求的權利，是教會給出的尊重。一個傳道人若把 5:17 當作向會眾要錢的條文，他就站到了 6:5 那邊。所以本講義的立場是兩邊同時講：教會有責任合理地供應，傳道人有責任不貪；財務透明，是兩邊共同的保護。</p><p>還有一點容易忽略：配受敬奉的是「善於管理」的、「勞苦」的。尊榮跟著勞苦與品格走，不跟著頭銜走；同工的待遇也該照這個原則，看實際的負擔，而不是看名片上的職稱。這也為下面三節鋪了路：既然長老的尊榮是因為他的生命，他的生命出了問題，尊榮就不能拿來作擋箭牌。</p>"},{"a":19,"z":21,"star":3,"grk":"<p lang=\"grc\">κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·</p><p lang=\"grc\">τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.</p><p lang=\"grc\">διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.</p>","lit":"<p>針對一位長老的控告，你不要接受，除非是根據兩個或三個見證人。</p><p>那些持續犯罪的，你要在眾人面前責備，好叫其餘的人也有懼怕。</p><p>我在神和基督耶穌並蒙揀選的天使面前鄭重囑咐你：要遵守這些事，不帶預先的判斷，甚麼都不照著偏向去做。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κατηγορίαν μὴ παραδέχου</td><td>katēgorian mē paradechou</td><td>不要接受控告</td><td>法庭用語：立案、受理</td></tr><tr><td>ἐκτὸς εἰ μὴ</td><td>ektos ei mē</td><td>除非</td><td>雙重否定加強</td></tr><tr><td>ἐπὶ δύο ἢ τριῶν μαρτύρων</td><td>epi dyo ē triōn martyrōn</td><td>根據兩個或三個見證人</td><td>申 19:15</td></tr><tr><td>τοὺς ἁμαρτάνοντας</td><td>tous hamartanontas</td><td>那些持續犯罪的</td><td>現在分詞：仍在犯</td></tr><tr><td>ἐνώπιον πάντων ἔλεγχε</td><td>enōpion pantōn elenche</td><td>在眾人面前責備</td><td>公開處理</td></tr><tr><td>φόβον ἔχωσιν</td><td>phobon echōsin</td><td>有懼怕</td><td>其餘的人，包括其他長老</td></tr><tr><td>διαμαρτύρομαι</td><td>diamartyromai</td><td>我鄭重囑咐</td><td>法庭作證的字</td></tr><tr><td>χωρὶς προκρίματος</td><td>chōris prokrimatos</td><td>不帶預先的判斷</td><td>πρόκριμα 新約只此一次</td></tr><tr><td>κατὰ πρόσκλισιν</td><td>kata prosklisin</td><td>照著偏向</td><td>πρόσκλισιν 新約只此一次；秤桿傾向一邊</td></tr></table>","gram":"<p><strong>5:19 的動詞是 παραδέχου（paradechou），是「受理」，不是「聽」。</strong>κατηγορία（katēgoria） 是正式的控告，帶著要定案的意思。保羅說的是：對長老的正式控告，要 ἐπὶ δύο ἢ τριῶν μαρτύρων（epi dyo ē triōn martyrōn） 才能成立。目的是保護無辜者免於誣告。這是申 19:15 的原則：「不可憑一個人的口作見證，總要憑兩三個人的口作見證才可定案」（申 19:15）。耶穌在太 18:16、保羅在林後 13:1 都用過同一條。</p><p>申命記講的是「定案」的門檻，不是「開口」的門檻。同一段緊接著說：「審判官要細細地查究」（申 19:18）——查證的責任在審判的人身上，不在提出控訴的人身上。作假見證的，申命記也嚴厲處理（申 19:19）。所以這條原則的目的是保護無辜者免於誣告，同時要求負責的人認真調查。</p><p>5:20 緊接著翻過來：τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε（tous hamartanontas enōpion pantōn elenche）。分詞是現在式，指經查證確實犯罪、而且仍在犯的人；ἐνώπιον πάντων（enōpion pantōn），在眾人面前。長老的身分不給他私下了結的特權，反而讓處理更公開，ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν（hina kai hoi loipoi phobon echōsin）。</p><blockquote><p>5:21 是全章最重的誓詞：διαμαρτύρομαι（diamartyromai），在神、基督耶穌、蒙揀選的天使面前。要守的是兩件事：χωρὶς προκρίματος（chōris prokrimatos），不預先判決；μηδὲν ποιῶν κατὰ πρόσκλισιν（mēden poiōn kata prosklisin），不往一邊傾斜。兩個名詞在新約都只出現這一次。這兩句話是雙向的：不預先判被告有罪，也不因為他是長老、是朋友、是有影響力的人就偏袒他。5:19--21 是一個整體，不能只讀前一節。</p></blockquote>","exp":"<p>「控告長老的呈子，非有兩三個見證就不要收」（5:19）。這一節在教會史上保護過許多無辜的牧者，也被濫用來讓許多受害者閉嘴。所以要非常小心地讀。</p><p>它保護的是甚麼？一位帶領教會的人，必然會得罪人；如果任何一句流言都能讓他下台，教會就會被最不滿的那個人挾持。保羅要提摩太不要憑一張匿名的紙條、一個人的情緒就定一位長老的罪。這是對誣告的保護。</p><p>它不是甚麼？<strong>它不是要求受害者自己先找到兩三個證人，才可以開口。</strong>性侵、性騷擾、屬靈操控，本來就常常發生在沒有旁人的地方。申命記把查證的責任交給審判官；今天收到指控的教會，就是那個要「細細地查究」的人。查證時，幾位彼此不認識的人分別提出相似的經歷、訊息與文件紀錄、旁人觀察到的改變，都是見證。教會收到指控，要有獨立、可信的調查：不由被指控者的親信主導，保護提出的人不受報復，必要時讓被指控者在調查期間暫停職務。<strong>涉及性侵、兒童保護等刑事的，要依法通報主管機關，不以「教會內部處理」為由延誤。</strong>太 18:15--17 處理的是弟兄之間的得罪，不是刑事案件的替代程序。</p><p>然後必須接著讀 5:20：「犯罪的人，當在眾人面前責備他，叫其餘的人也可以懼怕」（5:20）。查證確實有罪的長老，不因為是長老就被保護，反而要公開處理。再接著讀 5:21：「不可存成見，行事也不可有偏心」（5:21）。不預先判他有罪，也不因為他講道好、奉獻多、與我們有交情，就把秤往他那邊壓。</p><p>檢驗這段經文有沒有讀對，只要問一個問題：一位受過傷害、終於鼓起勇氣說出來的姊妹，聽完這段講解，是更敢說，還是更不敢說？5:19--21 讀對了，她會知道：這個家會認真聽她、認真調查，也不會因為對方是長老就放過他。</p>"},{"a":22,"z":22,"star":2,"grk":"<p lang=\"grc\">χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.</p>","lit":"<p>不要急速地把手按在任何人身上，也不要在別人的罪上有分；要保守你自己清潔。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>χεῖρας ταχέως μηδενὶ ἐπιτίθει</td><td>cheiras tacheōs mēdeni epitithei</td><td>不要急速把手按在任何人身上</td><td>ταχέως 放在前面加重</td></tr><tr><td>μηδὲ κοινώνει</td><td>mēde koinōnei</td><td>也不要有分</td><td>κοινωνέω：同夥、共有</td></tr><tr><td>ἁμαρτίαις ἀλλοτρίαις</td><td>hamartiais allotriais</td><td>別人的罪</td><td>不是自己犯的，卻沾上了</td></tr><tr><td>σεαυτὸν ἁγνὸν τήρει</td><td>seauton hagnon tērei</td><td>保守你自己清潔</td><td>與 5:2 ἁγνείᾳ 首尾呼應</td></tr></table>","gram":"<p><strong>按手指的是甚麼？</strong>這裡有兩種讀法。①按立：4:14 提摩太自己是在 τῶν χειρῶν τοῦ πρεσβυτερίου（tōn cheirōn tou presbyteriou） 之下領受恩賜的，3:6、3:10 也要求「不可作監督」的初信者、「先受試驗」的執事——那麼 5:22 是說不要太快按立人作長老。②恢復：後來的教會有為悔改者按手、接納他回到團契的做法，那麼 5:22 是接著 5:20，說不要太快恢復一位犯罪的長老。</p><p>本講義的判斷：取第一種為主。5:24--25 講的是人的罪與善行要時間才顯明，正是按立前「先受試驗」的理由。但第二種讀法也提醒一件事：無論是太快按立，還是太快恢復，都會讓負責的人 κοινώνει ἁμαρτίαις ἀλλοτρίαις（koinōnei hamartiais allotriais）。</p><p>χεῖρας ταχέως μηδενὶ ἐπιτίθει（cheiras tacheōs mēdeni epitithei） 把 ταχέως（tacheōs） 放在動詞前面。最後一句 σεαυτὸν ἁγνὸν τήρει（seauton hagnon tērei），σεαυτὸν（seauton） 放在句首：看守別人以前，先看守自己，這與 4:16「謹慎自己和自己的教訓」同一個次序。</p>","exp":"<p>「給人行按手的禮，不可急促」（5:22）。第 3 章已經說過：「初入教的不可作監督」（3:6），「這等人也要先受試驗」（3:10）。一位口才很好、恩賜很明顯、聚會很熱心的人，最容易被快速推上台。可是恩賜幾個月就看得見，品格要好幾年才看得清。</p><p>為甚麼不可急促？因為「不要在別人的罪上有分」（5:22）。按手不是儀式而已，是負責的人用自己的名字為這個人作保。如果你明知有疑點，卻因為缺人、因為交情、因為不想得罪人就按下去，日後他犯的罪，你也有分。最痛的例子是：一位在別處被指控過的人轉到新教會，很快又被安排帶小組、帶兒童。這正是 5:22 要擋住的事。</p><p>「要保守自己清潔」（5:22）。這一句在全卷有兩層。第一層是品格：提摩太自己要乾淨，才有資格審查別人。第二層，緊接著的 5:23 會說明：清潔不等於苛待自己的身體。保羅不要他把「清潔」做成另一種禁戒。</p><p>今天教會按立同工，可以從這一節學到幾件具體的事：給足觀察的時間；由不只一個人共同察驗；查問過去事奉的紀錄與推薦人；寧可慢一點，也不要讓一個破碎的人太早背上他背不起的擔子。慢，是為了保護會眾，也是為了保護那個人。</p>"},{"a":23,"z":23,"star":2,"grk":"<p lang=\"grc\">μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.</p>","lit":"<p>不要再只喝水，而要用一點點酒，為了你的胃和你屢次的軟弱。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μηκέτι ὑδροπότει</td><td>mēketi hydropotei</td><td>不要再只喝水</td><td>ὑδροποτέω 新約只此一次</td></tr><tr><td>οἴνῳ ὀλίγῳ</td><td>oinō oligō</td><td>一點點酒</td><td>ὀλίγῳ：少量</td></tr><tr><td>χρῶ</td><td>chrō</td><td>要用</td><td>像用藥那樣使用</td></tr><tr><td>διὰ τὸν στόμαχον</td><td>dia ton stomachon</td><td>為了你的胃</td><td>具體的病</td></tr><tr><td>τὰς πυκνάς σου ἀσθενείας</td><td>tas pyknas sou astheneias</td><td>你屢次的軟弱</td><td>πυκνός：頻繁</td></tr></table>","gram":"<p><strong>5:23 像是插進來的一句。</strong>5:22 講按手，5:24 又回到人的罪與審判，中間突然談到提摩太的胃。最合理的連結是 5:22 末尾的 σεαυτὸν ἁγνὸν τήρει（seauton hagnon tērei）：保羅剛說「保守自己清潔」，立刻補一句，免得提摩太把清潔理解成禁戒。</p><p>μηκέτι ὑδροπότει（mēketi hydropotei） 是現在式命令加 μηκέτι（mēketi），「不要再繼續只喝水」，表示提摩太本來是刻意滴酒不沾的。也許是為了與 3:3 μὴ πάροινον（mē paroinon）、3:8 μὴ οἴνῳ πολλῷ προσέχοντας（mē oinō pollō prosechontas） 的要求保持距離，也許是不願被那些「禁戒食物」（4:3）的人批評。保羅的處方很節制：οἴνῳ ὀλίγῳ（oinō oligō），一點點；動詞 χρῶ（chrō） 是「使用」，是當作藥物來用。理由寫得很清楚：διὰ τὸν στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας（dia ton stomachon kai tas pyknas sou astheneias）。</p><blockquote><p>古代城市的水常常不乾淨，少量的酒有殺菌、助消化的作用；好撒馬利亞人也是「用油和酒倒在他的傷處」（路 10:34）。這一節談的是一位病人的處境，不是一般的飲食原則。</p></blockquote>","exp":"<p>處境是：「因你胃口不清，屢次患病」（5:23）。保羅在一封談教會秩序的信裡停下來，關心年輕同工的胃。屬靈的父親不只管提摩太的講台，也管他的身體；4:8 說「操練身體，益處還少」，少，不是沒有。</p><p>這一節常被兩邊拿來用，兩邊都要擋住。<strong>第一，它不是鼓勵飲酒。</strong>保羅說的是「稍微」，原因是病，對象是一位長期滴酒不沾的人。用這一節替應酬、勸酒、喝醉開脫，是違背經文的。保羅在別處說：「不要醉酒，酒能使人放蕩」（弗 5:18）。<strong>第二，它也不把飲酒本身定為罪。</strong>如果喝一口酒就是罪，保羅不會這樣吩咐提摩太；3:3 對監督的要求是「不因酒滋事」（3:3），重點是節制，不是滴酒不沾。滴酒不沾也不是屬靈的資格，不能拿來衡量誰比較屬靈。</p><p>還有一群人要特別顧及：正在戒酒的弟兄姊妹。對他們來說，完全不碰酒是智慧，也是忠心；這一節不是要他們「稍微用點」。教會要尊重他們的選擇，聚會與聚餐不勸酒，必要時就照保羅說的：「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好」（羅 14:21）。今天有醫生、有藥物，身體的問題照醫囑處理，不必拿這一節當處方。這一節要我們學的，是保羅照顧人的那份細心。</p>"},{"a":24,"z":25,"star":1,"grk":"<p lang=\"grc\">Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·</p><p lang=\"grc\">ὡσαύτως καὶ τὰ ἔργα τὰ καλὰ πρόδηλα καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.</p>","lit":"<p>有些人的罪是預先顯明的，走在前頭進入審判；但有些人的罪，則是隨後跟上的；</p><p>同樣，美好的工作也是預先顯明的；那些不是這樣的，也不能被隱藏。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πρόδηλοί εἰσιν</td><td>prodēloi eisin</td><td>是預先顯明的</td><td>兩節各一次 πρόδηλος</td></tr><tr><td>προάγουσαι εἰς κρίσιν</td><td>proagousai eis krisin</td><td>走在前頭進入審判</td><td>罪自己先到</td></tr><tr><td>ἐπακολουθοῦσιν</td><td>epakolouthousin</td><td>隨後跟上</td><td>與 5:10 ἐπηκολούθησεν 同字</td></tr><tr><td>τὰ ἔργα τὰ καλὰ</td><td>ta erga ta kala</td><td>美好的工作</td><td>καλός 追蹤</td></tr><tr><td>κρυβῆναι οὐ δύνανται</td><td>krybēnai ou dynantai</td><td>不能被隱藏</td><td>被動不定詞</td></tr></table>","gram":"<p><strong>兩節是一組對句。</strong>5:24 講罪，5:25 講善行，中間用 ὡσαύτως（hōsautōs）「同樣」連起來。兩節都用 πρόδηλος（prodēlos），都分成「先顯明的」與「後來才顯明的」兩類。τισὶν δὲ καὶ ἐπακολουθοῦσιν（tisin de kai epakolouthousin） 的動詞，與 5:10 寡婦 ἐπηκολούθησεν（epēkolouthēsen）「竭力行各樣善事」同字：有人一生跟隨善事，有人的罪一路跟在後面。</p><p>εἰς κρίσιν（eis krisin） 的「審判」可以指人間的審查（按手之前的察驗），也可以指神最後的審判。放在 5:22 之後，第一層意思最直接；放在全卷，兩層都在。5:25 末句 κρυβῆναι οὐ δύνανται（krybēnai ou dynantai） 用被動，隱藏不住，不是因為人很會查，是因為神不讓它隱藏。</p>","exp":"<p>「有些人的罪是明顯的，如同先到審判案前」（5:24）。這兩節回答 5:22 的「不可急促」：為甚麼要慢？因為有些人的問題一眼就看得出來，有些人的問題要幾年後才浮出來。按立前多給一點時間，不是不信任，是讓真相有機會跟上。</p><p>這兩節也安慰那些默默忠心的人：「那不明顯的也不能隱藏」（5:25）。善行不一定被人看見，卻不會被神忘記；5:10 那位寡婦洗聖徒的腳，就是這樣的善行。</p><p>同時它也是警告：隱藏的罪終究也隱藏不住。一個家若習慣替有地位的人遮蓋，不會因此平安，只會讓那罪「隨後跟了去」，傷到更多的人。所以 5:20--21 的公開與不偏心，最後是在順著神的方式行事：神不讓罪永遠藏著，也不讓善行永遠埋著。人的察驗有限，最後的審判在神手裡；我們只需忠心地慢慢看、誠實地查。</p>"}],"6":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.</p><p lang=\"grc\">οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.</p>","lit":"<p>凡在軛下作奴僕的，要看待自己的主人配得一切的尊敬，免得神的名和那教訓被褻瀆。</p><p>那些有信主之主人的，不要因為他們是弟兄就藐視他們；反倒更要服事，因為那些致力於善行（或：領受這益處）的，是信主的、蒙愛的。這些事你要教導、要勸勉。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑπὸ ζυγὸν δοῦλοι</td><td>hypo zygon douloi</td><td>在軛下的奴僕</td><td>描述一個既有的處境，不是設立一個制度</td></tr><tr><td>τοὺς ἰδίους δεσπότας</td><td>tous idious despotas</td><td>自己的主人</td><td>δεσπότης：法律上的擁有者，不是 κύριος</td></tr><tr><td>πάσης τιμῆς ἀξίους</td><td>pasēs timēs axious</td><td>配得一切尊敬的</td><td>τιμή：接上 5:3、5:17 的「尊敬、敬奉」</td></tr><tr><td>βλασφημῆται</td><td>blasphēmētai</td><td>被褻瀆</td><td>目的子句：關切的是福音在外人眼中的名聲</td></tr><tr><td>καταφρονείτωσαν</td><td>kataphroneitōsan</td><td>藐視</td><td>4:12「小看你年輕」同一個動詞</td></tr><tr><td>οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι</td><td>hoi tēs euergesias antilambanomenoi</td><td>領受益處的／致力於善行的</td><td>兩讀；徒 20:35「扶助」同一個動詞</td></tr></table>","gram":"<p><strong>6:1 的第一個字 Ὅσοι（Hosoi） 是「凡是……的」：保羅不是在設立一個階層，是在對一群已經存在的人說話——ὑπὸ ζυγὸν δοῦλοι（hypo zygon douloi），在軛下作奴僕的。</strong></p><p>ζυγὸν（zygon） 是套在牲口頸上的軛，這個字本身就帶著重量與不自由；保羅用它，等於承認這處境是一副軛，不是一份祝福。主人用的是 δεσπότας（despotas），不是 κύριος（kyrios）；δεσπότης（despotēs） 是法律上的擁有者，保羅在這裡沒有替這種擁有權辯護，只是描述它。命令的動詞 ἡγείσθωσαν（hēgeisthōsan） 是第三人稱命令，「要看待」，要求的是心裡的看法：πάσης τιμῆς ἀξίους（pasēs timēs axious），配受十分的恭敬。同一字根在第 5 章剛出現：5:3 的 τίμα（tima） 是「要尊敬」寡婦，5:17 的 διπλῆς τιμῆς（diplēs timēs） 是「加倍的敬奉」。尊敬在神的家裡是通用的。</p><p>目的子句 ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται（hina mē to onoma tou theou kai hē didaskalia blasphēmētai） 是全段的鑰匙。理由不是「這制度合神心意」，而是福音的名聲，與 3:7 監督「在教外有好名聲」（3:7）、5:14「不給敵人辱罵的把柄」（5:14）是同一個關切；多 2:5、10 也一樣。ἡ διδασκαλία（hē didaskalia） 是本卷追蹤字「教訓」的站點：道理會因為信徒的工作態度被人尊重，也會被人褻瀆。</p><p>6:2 οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι（hoi tēs euergesias antilambanomenoi） 有兩種讀法。一讀以主人為「領受益處的」：奴僕的好服事讓信主的主人得益，和合本「得服事之益處的」照這一讀。另一讀注意到這個動詞通常是「投身、扶助」，徒 20:35 的 ἀντιλαμβάνεσθαι（antilambanesthai） 和合本就譯作「扶助軟弱的人」（徒 20:35）；εὐεργεσίας（euergesias） 又常指施恩者的善舉。照這一讀，是說信主的主人本身就「致力於善待人」。本講義以和合本為主，但第二讀提醒我們：保羅期待信主的主人自己就是行善的人，不是坐享其成的人。</p>","exp":"<p><strong>這兩節最常被拿來問一個問題：聖經是不是支持奴隸制？答案要分兩層——保羅在對誰說話，以及他從福音推出了甚麼。</strong></p><p>第一層是處境。第一世紀的以弗所，奴僕可能占城裡人口很大的比例；教會裡坐著奴僕，也坐著主人。保羅寫信時，沒有一個奴僕能靠一封信改變帝國的法律。他對「在軛下」的人說：在你無法改變的處境裡，不要讓神的名因你被褻瀆。這是對一群軟弱者的牧養，不是對一個制度的背書。</p><p>第二層是原則。同一封信在 1:10 把「搶人口」（1:10）的人列在敵正道的罪人之中，販賣人口正是奴隸貿易的源頭。保羅在別處說，奴僕若能得自由，就去求自由（林前 7:21）；他把阿尼西謀送回去時，要腓利門收他「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 16）；他也吩咐：「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。」（西 4:1）福音的酵已經放進麵裡：主人與奴僕同坐一桌、同稱弟兄，這個制度遲早要從裡面被撐破。所以本講義不把這段讀成聖經支持奴隸制。</p><p>6:2 的危險更細。主人信了主，奴僕就想：我們是弟兄了，我不必再那麼認真。保羅說不可，反倒要更加用心，因為得益處的是「信道蒙愛的」（6:2）弟兄。弟兄的關係不是怠慢的藉口，是更盡心的理由。</p><p>今天沒有人戴軛，但每個星期一都有人走進辦公室。把這段搬到職場，最容易犯的錯是只讀一半：只叫員工順服老闆，卻不讀西 4:1、弗 6:9 對主人的要求。應用不可單向化——員工要盡忠，不因同是基督徒就輕看上司；老闆要公平，不威嚇、不剝削下屬；而這段經文從不要求任何人忍受違法的勞動或虐待。原則只有一條：在你所在的位置上，讓人因你的工作，尊重你所信的神。</p>"},{"a":3,"z":5,"star":2,"grk":"<p lang=\"grc\">εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατʼ εὐσέβειαν διδασκαλίᾳ,</p><p lang=\"grc\">τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,</p><p lang=\"grc\">διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν εὐσέβειαν</p>","lit":"<p>若有人教導別的，又不就近那健康的話語，就是我們主耶穌基督的話，以及那合乎敬虔的教訓，</p><p>他是被煙蒙住了，甚麼也不明白，反倒在問題和字句之爭上害病；從這些生出嫉妒、紛爭、褻瀆、惡的猜疑，</p><p>以及心思敗壞、被奪去真理之人的不斷摩擦，他們以為敬虔是得利的門路。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἑτεροδιδασκαλεῖ</td><td>heterodidaskalei</td><td>教別的</td><td>新約只在 1:3 與此處</td></tr><tr><td>ὑγιαίνουσι λόγοις</td><td>hygiainousi logois</td><td>健康的話語</td><td>ὑγιαίνω：衛生、健康的字根</td></tr><tr><td>τετύφωται</td><td>tetyphōtai</td><td>被煙蒙住了</td><td>τυφόω 的完成式被動；3:6 同字</td></tr><tr><td>νοσῶν</td><td>nosōn</td><td>害病</td><td>與「健康的話語」正面相對</td></tr><tr><td>λογομαχίας</td><td>logomachias</td><td>字句之戰</td><td>話語＋戰鬥；新約僅此一次</td></tr><tr><td>διαπαρατριβαὶ</td><td>diaparatribai</td><td>不斷的摩擦</td><td>兩個前置詞疊在動詞前：磨來磨去</td></tr><tr><td>πορισμὸν</td><td>porismon</td><td>得利的門路</td><td>生財的手段</td></tr></table>","gram":"<p><strong>6:3–5 是一個長長的條件句：εἴ τις ἑτεροδιδασκαλεῖ（ei tis heterodidaskalei）……主句只有一個字 τετύφωται（tetyphōtai）。</strong></p><p>ἑτεροδιδασκαλεῖ（heterodidaskalei） 在新約只出現在 1:3 與這裡，全卷首尾呼應：信一開頭吩咐「不可傳異教」（1:3），信快結束時描寫傳異教的人是甚麼樣子。保羅用一組醫學的對照：ὑγιαίνουσι λόγοις（hygiainousi logois） 是「健康的話語」，而傳異教的人 νοσῶν περὶ ζητήσεις καὶ λογομαχίας（nosōn peri zētēseis kai logomachias），對問題和字句之爭「害了病」。健康的教訓養出健康的人；病態的追問生出 6:4 那一串症狀：嫉妒、紛爭、毀謗、妄疑，最後是 διαπαρατριβαὶ（diaparatribai），彼此不斷地摩擦。這也是追蹤字「純正（健康）」的終點：健康的教訓，是一個人的話——τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ（tois tou kyriou hēmōn Iēsou Christou）。</p><p>τετύφωται（tetyphōtai） 是 τυφόω（typhoō） 的完成式被動。字根 τῦφος（typhos） 是煙：人被自己的煙燻住了，自以為高大，其實甚麼也看不清，所以接著說 μηδὲν ἐπιστάμενος（mēden epistamenos），一無所知。同一個字在 3:6 說初入教的不可作監督，恐怕他 τυφωθεὶς（typhōtheis），自高自大。完成式說的是一個已經定型的狀態：驕傲不是一時的情緒，是一層罩住的霧。</p><p>6:5 νομιζόντων πορισμὸν εἶναι τὴν εὐσέβειαν（nomizontōn porismon einai tēn eusebeian）：τὴν εὐσέβειαν（tēn eusebeian） 帶冠詞，是主語；πορισμὸν（porismon） 不帶冠詞，是述語——「以為敬虔是生財之道」。追蹤字「敬虔」在這裡第二次翻轉：敬虔被拿去賺錢。</p><p>◆ <strong>經文鑑別（6:5）</strong>：SBLGNT 在 εὐσέβειαν（eusebeian） 結束本節；拜占庭多數本（RP）多一句 Ἀφίστασο ἀπὸ τῶν τοιούτων（Aphistaso apo tōn toioutōn），意思是「這等人你要躲開」。和合本（1989 新標點）沒有這一句，與 SBLGNT 同。兩種讀法並陳：RP 的長讀法有大量晚期抄本支持；較早的抄本，如西乃抄本、亞歷山大抄本，都沒有這句。本講義判斷短讀法是原文，長讀法是後來抄寫時補上的，很可能受了「這等人你要躲開」（提後 3:5）的影響。兩讀的意思並不衝突：6:11 保羅自己就說「要逃避這些事」（6:11）。</p>","exp":"<p>〔背景〕徒 20:29--30（使徒行傳講義第 20 章）</p><p><strong>保羅診斷假師傅，不先看他講了甚麼，先看他生出了甚麼。</strong></p><p>本系列使徒行傳講義第 20 章講過，保羅在米利都對以弗所的長老預言：「就是你們中間，也必有人起來說悖謬的話，要引誘門徒跟從他們。」（徒 20:30）幾年之後，預言成真，提摩太正面對這些人。保羅給他的辨認方法很實際：看果子。純正的話叫人健康；異教叫人生病，病的症狀是嫉妒、紛爭、毀謗、妄疑，和沒完沒了的摩擦。</p><p>這不是說基督徒不可以問問題。保羅自己寫信時常常一連發問。毛病在於「專好」：有一種人把問難當成嗜好，把爭辯言詞當成屬靈，在每一個字眼上打仗，卻從來不讓真理改變自己。今天這種病在網路上特別容易傳染，留言串越長，愛心越少。分辨的方法仍是 6:4 這張症狀表：一場討論結束後，大家更像基督了，還是更會懷疑人了？</p><p>病根在哪裡？「他是自高自大」（6:4），字面是被煙燻住。驕傲的人不是看得太多，是被自己的煙遮住了眼睛。3:6 用同一個字警告初入教的人；可見這不只是假師傅的病，也是每一個開始事奉的人都要提防的病。</p><p>最後一句揭開了動機：「他們以敬虔為得利的門路。」（6:5）把信仰當成生財的工具，敬虔就從目的變成了手段。保羅沒有在信裡點出這些人的名字，本講義也不點名任何講員或教會；這面鏡子是拿給每一個講台照的，包括我們自己的。下一節，保羅要用同一個字把這句話整個翻過來。</p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·</p>","lit":"<p>然而敬虔連同知足，確實是大的得利；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἔστιν δὲ</td><td>estin de</td><td>然而確實是</td><td>ἔστιν 提到句首，加重語氣</td></tr><tr><td>πορισμὸς μέγας</td><td>porismos megas</td><td>大的得利</td><td>接過 6:5 的同一個字</td></tr><tr><td>ἡ εὐσέβεια</td><td>hē eusebeia</td><td>那敬虔</td><td>帶冠詞的主語；全卷主追蹤字</td></tr><tr><td>μετὰ αὐταρκείας</td><td>meta autarkeias</td><td>連同知足</td><td>μετά：與……一起</td></tr><tr><td>αὐτάρκεια</td><td>autarkeia</td><td>自足、知足</td><td>「自己」＋「夠了」；斯多亞派的招牌字</td></tr></table>","gram":"<p><strong>6:6 幾乎原封不動地重複 6:5 的字：πορισμὸς（porismos）、εὐσέβεια（eusebeia）。保羅不換字，只換位置，再加三個字 μετὰ αὐταρκείας（meta autarkeias）。</strong></p><p>6:5 是 νομιζόντων πορισμὸν εἶναι τὴν εὐσέβειαν（nomizontōn porismon einai tēn eusebeian），他們「以為」敬虔是得利；6:6 是 ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας（estin de porismos megas hē eusebeia meta autarkeias）——ἔστιν（estin） 提到句首，從「以為」變成「確實是」；πορισμὸς（porismos） 加上 μέγας（megas），從小利變成大利。保羅並不否認敬虔有利，他否認的是對方對「利」的定義。這是保羅常用的修辭：接過對手的字，把它翻轉過來。追蹤字「敬虔」在這裡第三次翻轉：真正的利。</p><p>αὐτάρκεια（autarkeia） 是斯多亞派與犬儒派的招牌字，意思是「自足」：外在的一切都可以失去，人靠自己的理性就夠了。保羅借了這個字，卻換了裡面的東西。腓 4:11 用 αὐτάρκης（autarkēs） 這個字說：「我無論在甚麼景況都可以知足」（腓 4:11），兩節之後就說出這知足的來源是那加給他力量的；林後 9:8 的 αὐτάρκειαν（autarkeian），和合本譯作「凡事常常充足」（林後 9:8），供應的是神。斯多亞派的知足是「我自己就夠」，保羅的知足是「有神就夠」。</p><p>μετὰ（meta） 是「與……同在、連同」，不是「加上一點」。敬虔與知足不是兩樣分開的貨物，而是同行的一對：敬虔若沒有知足同行，很快會被拿去交換別的東西。</p>","exp":"<p><strong>「然而，敬虔加上知足的心便是大利了。」（6:6）這是全卷那一條線在第 6 章的站點：錢在神的家裡的位置。</strong></p><p>假師傅的算盤是：信主，所以發財。保羅不跟他爭「利」字，他把利重新定價。敬虔本身就是利，而且是大利；但這大利有一個同伴，要「加上知足」。少了知足，敬虔很快就會被拿去換別的東西；有了知足，敬虔就不必換任何東西，因為它本身就是寶貝。</p><p>知足不是懶惰，也不是沒有夢想。斯多亞哲學家說的知足，是把需要減到最少，就不會失望，那是一種自我防衛。保羅的知足是另一種：他知道怎樣處卑賤，也知道怎樣處豐富（腓 4:12），兩種處境他都學會了，因為他的「夠」不靠處境，靠神。一個知足的人仍然可以努力工作、可以創業、可以有計畫；他只是不再需要用錢來證明神愛他，也不再需要用錢來證明自己有價值。</p><p>這一節同時擋住兩種錯誤。第一種是成功神學：把敬虔當成投資，期待信心換來財富；保羅說，這樣的人「以敬虔為得利的門路」（6:5），他們把手段和目的弄反了。第二種是清貧主義：以為越窮越屬靈、有錢就是罪；保羅沒有說「敬虔加上貧窮」，他說的是知足。同一封信說「凡神所造的物都是好的」（4:4），本章還要說神「厚賜百物給我們享受」（6:17）。知足的人可以窮，也可以富；不知足的人窮也不安，富也不安。</p><p>4:8 說「惟獨敬虔，凡事都有益處，因有今生和來生的應許」（4:8）。今生的益處，就包括這一顆知足的心：它讓人走進商場時不被廣告牽著走，看著薪水單時不被比較偷走喜樂。321 說「人比事重要，關係比東西重要」；知足，就是把東西放回它該在的位置的那一隻手。</p>"},{"a":7,"z":8,"star":1,"grk":"<p lang=\"grc\">οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·</p><p lang=\"grc\">ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.</p>","lit":"<p>因為我們沒有帶甚麼進入世界，所以也不能帶甚麼出去；</p><p>而有了食物和遮蔽，我們就要以這些為足。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐδὲν γὰρ εἰσηνέγκαμεν</td><td>ouden gar eisēnenkamen</td><td>因為我們甚麼也沒帶進來</td><td>γάρ：為 6:6 提出理由</td></tr><tr><td>οὐδὲ ἐξενεγκεῖν τι δυνάμεθα</td><td>oude exenenkein ti dynametha</td><td>也不能帶甚麼出去</td><td>帶進、帶出：同一個動詞的兩面</td></tr><tr><td>διατροφὰς καὶ σκεπάσματα</td><td>diatrophas kai skepasmata</td><td>食物和遮蔽</td><td>遮蔽：衣服，也可包括住處</td></tr><tr><td>ἀρκεσθησόμεθα</td><td>arkesthēsometha</td><td>我們就要以此為足</td><td>未來式；與 αὐτάρκεια 同字根</td></tr></table>","gram":"<p><strong>6:7 用 γάρ（gar） 接上 6:6，為「知足」提出第一個理由：人生的兩端是空的。</strong></p><p>εἰσηνέγκαμεν（eisēnenkamen） 與 ἐξενεγκεῖν（exenenkein） 是同一個動詞配上兩個方向的前置詞，一個是「帶進」，一個是「帶出」，像一扇門的兩面。中間那個 ὅτι（hoti） 讀來有些突兀：「我們沒有帶甚麼進來，因為也不能帶甚麼出去」。有些抄本因此在前面補上 δῆλον（dēlon），讀成「顯然也不能帶甚麼去」；多數譯本把 ὅτι（hoti） 當成「所以、同樣」來處理，和合本譯作「也」。意思很清楚：進門時兩手空空，出門時也必兩手空空。</p><p>6:8 的 ἀρκεσθησόμεθα（arkesthēsometha） 是未來式，可以讀作直說的「我們會知足」，也可以讀作帶命令意味的「我們就當知足」；和合本取後者。它與 6:6 的 αὐταρκείας（autarkeias） 同字根：知足，就是「夠了」。σκεπάσματα（skepasmata） 是「遮蓋物」，可以指衣服，也可以包括遮風避雨的住處。保羅列的是生存的底線，不是生活的上限。</p>","exp":"<p><strong>「因為我們沒有帶甚麼到世上來，也不能帶甚麼去。」（6:7）這使我們想起約伯在失去一切的那一天所說的話。</strong></p><p>約伯說：「我赤身出於母胎，也必赤身歸回；賞賜的是耶和華，收取的也是耶和華。」（伯 1:21）傳道書也說：「他怎樣從母胎赤身而來，也必照樣赤身而去。」（傳 5:15）華人說生不帶來、死不帶去，道理人人都懂；保羅的意思更深一層：既然生命的兩端都是空的，中間經手的一切，就都是託付，不是擁有。我們不是主人，是管家。這正好接上本章最後的那個命令：「你要保守所託付你的」（6:20）。</p><p>「只要有衣有食，就當知足。」（6:8）這不是說基督徒只能有衣食，不能有別的；而是說衣食之上的部分，都不是我們安全感的來源。有了基本的需要，人就可以停止焦急地追趕，開始問另一個問題：多出來的，神要我拿去做甚麼？6:18 會回答：行善、施捨、樂意供給人。保羅自己就是這樣活的，他對以弗所的長老說：「我未曾貪圖一個人的金、銀、衣服。」（徒 20:33）</p>"},{"a":9,"z":10,"star":3,"grk":"<p lang=\"grc\">οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·</p><p lang=\"grc\">ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.</p>","lit":"<p>但那些想要富足的人，掉進試探和網羅，並許多無知而有害的慾望，這些慾望使人沉入敗壞和滅亡；</p><p>因為一切惡事的根是愛錢；有些人伸手渴求它，就從信仰被引誘迷失，並用許多痛苦把自己刺穿了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἱ δὲ βουλόμενοι πλουτεῖν</td><td>hoi de boulomenoi ploutein</td><td>但那些想要富足的</td><td>重點在「想要」，不在「富足」</td></tr><tr><td>ἐμπίπτουσιν</td><td>empiptousin</td><td>掉進</td><td>3:7「落在魔鬼的網羅」同一個動詞</td></tr><tr><td>βυθίζουσι</td><td>bythizousi</td><td>使下沉</td><td>路 5:7 船要沉下去</td></tr><tr><td>ῥίζα</td><td>rhiza</td><td>根</td><td>不帶冠詞，放在句首</td></tr><tr><td>φιλαργυρία</td><td>philargyria</td><td>愛銀子</td><td>「愛」＋「銀子」；名詞在新約僅此一次</td></tr><tr><td>ὀρεγόμενοι</td><td>oregomenoi</td><td>伸手渴求</td><td>3:1 想要監督職分的同一個動詞</td></tr><tr><td>περιέπειραν</td><td>periepeiran</td><td>四面刺穿</td><td>新約僅此一次</td></tr></table>","gram":"<p><strong>6:9 的主語是 οἱ δὲ βουλόμενοι πλουτεῖν（hoi de boulomenoi ploutein）：不是「富足的人」，是「想要富足的人」。</strong></p><p>這個分別要和 6:17 對讀。6:17 的對象是 Τοῖς πλουσίοις（Tois plousiois），今世富足的人，保羅沒有叫他們變窮，只叫他們別倚靠錢財；6:9 的對象是 βουλόμενοι（boulomenoi），立定心意要發財的人。問題在意志的方向。他們 ἐμπίπτουσιν（empiptousin），掉進試探和網羅；同一個動詞與「網羅」在 3:7 說監督要防備「落在魔鬼的網羅裡」（3:7）。βυθίζουσι（bythizousi） 是把船弄沉的字，路 5:7 魚多得「甚至船要沉下去」（路 5:7）；這使我們想起 1:19 有人在真道上「如同船破壞了一般」（1:19）。</p><p>6:10 ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία（rhiza gar pantōn tōn kakōn estin hē philargyria）：主語是帶冠詞的 ἡ φιλαργυρία（hē philargyria），述語 ῥίζα（rhiza） 不帶冠詞而放在句首。這句有兩種讀法。一說述語名詞放在動詞之前，雖無冠詞仍可是確定的，讀作「萬惡的那個根」；一說無冠詞是強調性質，讀作「各樣惡事的一個根源」，πάντων τῶν κακῶν（pantōn tōn kakōn） 也可以讀成「各種的惡」。本講義取後者：保羅不是說世上每一樁惡都只從貪財而來，而是說各樣的惡都可以從這條根長出來。無論取哪一讀，主語都很清楚——是 φιλαργυρία（philargyria），字面是「愛銀子」，是對錢的愛，不是錢本身。</p><p>ὀρεγόμενοι（oregomenoi） 是「伸手去抓」。3:1 有人 ὀρέγεται（oregetai），想要監督的職分，那是好的伸手；這裡是壞的伸手。結局是 ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς（heautous periepeiran odynais pollais）：περιέπειραν（periepeiran） 是把東西刺穿、串起來的動詞，而主詞與受詞是同一群人——沒有人刺他們，是他們自己刺穿了自己。</p>","exp":"<p><strong>「貪財是萬惡之根。」（6:10）這是聖經裡最常被引錯的句子之一，常被說成錢本身是萬惡的根。保羅說的不是錢，是愛錢。</strong></p><p>這個分別不是咬文嚼字。若錢本身是惡，保羅在 6:17 就該叫富足的人把錢丟掉，他沒有；他也不會在同一章說神「厚賜百物給我們享受」（6:17）。錢是工具，可以買藥，也可以買毒品；可以建學校，也可以收買人。根不在銀子，在心裡對銀子的愛——那個叫人覺得再多一點、我就安全了的愛。</p><p>6:9 描寫這份愛的軌跡，像一條下坡路：先是想要發財，心意定了；然後陷在迷惑，開始替錢找理由；接著落在網羅，被套住了；再來是許多無知有害的私慾，想要的越來越多；最後「叫人沉在敗壞和滅亡中」（6:9），像一條載重過量的船沉了下去。沒有一個人是一天之內沉下去的，每一步都只差一點點。</p><p>6:10 下半節說得更痛：「有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。」（6:10）這是全卷地勢圖在第 6 章的低谷。被引誘離了真道的人，不一定不再來聚會；有時他仍坐在原位，只是心已經住在別處。刺透他的，是他自己：失眠、焦慮、破裂的家、彼此提防的兄弟，許多傷口是自己用貪心刺的。</p><p>所以這一節同樣兩邊都擋。對成功神學，它說：渴望發財不是信心，是危險。對清貧主義，它說：問題不是錢，是貪財；窮人也可能貪財，富人也可能不貪。主耶穌說：「你們要謹慎自守，免去一切的貪心，因為人的生命不在乎家道豐富。」（路 12:15）貪財的反面不是貧窮，是知足；知足的出口不是囤積，是 6:18 的樂意供給人。</p>"},{"a":11,"z":11,"star":2,"grk":"<p lang=\"grc\">Σὺ δέ, ὦ ἄνθρωπε θεοῦ ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, πραϋπαθίαν</p>","lit":"<p>但你，啊，神的人，要逃避這些；要追求公義、敬虔、信心、愛、忍耐、溫柔的情懷。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Σὺ δέ</td><td>Sy de</td><td>但你</td><td>與 6:9–10 那些人鮮明對照</td></tr><tr><td>ὦ ἄνθρωπε θεοῦ</td><td>ō anthrōpe theou</td><td>啊，神的人</td><td>舊約稱摩西、撒母耳、以利亞的稱號</td></tr><tr><td>φεῦγε</td><td>pheuge</td><td>要逃</td><td>現在式命令：一直逃</td></tr><tr><td>δίωκε</td><td>diōke</td><td>要追</td><td>現在式命令；1:13 的「逼迫」同字根</td></tr><tr><td>πραϋπαθίαν</td><td>praypathian</td><td>溫柔的情懷</td><td>新約僅此一次</td></tr></table>","gram":"<p><strong>6:11 以 Σὺ δέ（Sy de） 開頭：前面說的是「有人」，這裡轉向「你」。代名詞在希臘文本來可以省略，寫出來就是強調。</strong></p><p>ὦ ἄνθρωπε θεοῦ（ō anthrōpe theou） 是呼格，加上感嘆的 ὦ（ō），語氣很重。這個稱號來自舊約：「神人摩西」（申 33:1），撒母耳、以利亞、以利沙也被稱為神人。新約只有這裡與提後 3:17 用這個稱號。保羅把先知的頭銜放在一個年輕傳道人身上，不是因為他的成就，是因為他屬於誰：θεοῦ（theou） 是所屬的屬格。</p><p>兩個命令都是現在式：φεῦγε（pheuge）、δίωκε（diōke），逃要一直逃，追要一直追。δίωκε（diōke） 這個字也是「逼迫」，保羅從前就是這樣追趕教會的人（1:13）；如今他叫提摩太用同樣的熱切去追趕美德。保羅不叫提摩太站在原地抵擋貪財，叫他跑開；也不叫他站在原地等美德降臨，叫他追上去。</p><p>追的六樣可以排成三對：公義與敬虔，是對人對神的正直；信心與愛心，是生命的根與果；忍耐與溫柔，是面對壓力與面對人的姿態。最後一個字 πραϋπαθίαν（praypathian） 在新約只出現這一次，字面是「溫和的感受」：在專好爭辯的人中間，神的人要有一顆不容易被點燃的心。</p>","exp":"<p><strong>「但你這屬神的人要逃避這些事，追求公義、敬虔、信心、愛心、忍耐、溫柔。」（6:11）屬神的人不是一個職稱，是一個方向。</strong></p><p>這一節的力量在於對比。6:9–10 那群人在追，追的是錢；6:11 的提摩太也在追，追的是品格。基督徒不是不追求的人，是換了追求對象的人。一個人說「我已經不愛錢了」，這還不夠；他心裡一定要有另一樣更大的東西在吸引他，否則空出來的位置很快又被填回去。</p><p>「逃避」也很實際。有些試探不是用來抵擋的，是用來逃開的。保羅沒有叫提摩太去證明自己多麼不受錢財影響，而是叫他保持距離。今天的傳道人與會友都一樣：遠離那些讓你一直比較、一直焦急的東西，本身就是一種屬靈的智慧。</p><p>保羅稱提摩太為神人，用的是摩西與以利亞的稱號。提摩太大概會覺得這太重了；但這個稱號不是稱讚他有多偉大，是提醒他屬於誰。人怎樣被稱呼，會影響他怎樣走路。這也不只是說給講台上的人聽：提後 3:17 用同一個稱號，指每一個被聖經裝備、「預備行各樣的善事」（提後 3:17）的信徒。全會眾聽見這一句時，都可以抬起頭來：你也是屬神的人。</p>"},{"a":12,"z":12,"star":2,"grk":"<p lang=\"grc\">ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.</p>","lit":"<p>要拚搏那信仰的美好拚搏，要抓住那永遠的生命，你是被召進入它的，並且在許多見證人面前承認了那美好的承認。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀγωνίζου</td><td>agōnizou</td><td>要拚搏</td><td>現在式命令；ἀγωνίζομαι 是競技場的字</td></tr><tr><td>τὸν καλὸν ἀγῶνα</td><td>ton kalon agōna</td><td>那美好的比賽</td><td>同源受詞：拚那一場拚搏</td></tr><tr><td>ἐπιλαβοῦ</td><td>epilabou</td><td>抓住</td><td>不定過去式命令：一把抓住</td></tr><tr><td>τῆς αἰωνίου ζωῆς</td><td>tēs aiōniou zōēs</td><td>那永遠的生命</td><td>6:19 用同一個動詞再抓一次</td></tr><tr><td>ὡμολόγησας τὴν καλὴν ὁμολογίαν</td><td>hōmologēsas tēn kalēn homologian</td><td>承認了那美好的承認</td><td>同字根重複；6:13 主也作了同樣的承認</td></tr></table>","gram":"<p><strong>6:12 是兩個命令：ἀγωνίζου（agōnizou） 是現在式，ἐπιλαβοῦ（epilabou） 是不定過去式。一個說「要一直拚下去」，一個說「現在就一把抓住」。</strong></p><p>ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως（agōnizou ton kalon agōna tēs pisteōs） 是同源受詞的結構，動詞與受詞同一個字根：拚那一場拚搏。這個字根原指運動場或競技場上的比賽，英文的痛苦掙扎一詞就從這裡來。和合本譯作「打那美好的仗」，接上 1:18「打那美好的仗」（1:18）；但 1:18 用的是軍事的字 στρατεύῃ（strateuē） 與 τὴν καλὴν στρατείαν（tēn kalēn strateian），這裡換成了運動場的字。同一封信，保羅用兩個畫面說同一件事：信仰是戰場，也是賽場。τῆς πίστεως（tēs pisteōs） 可讀作「那信仰的」，指為真道而比的那場比賽；也可讀作「信心的」，指靠信心去比。和合本「為真道」取前者。追蹤字 καλός（kalos） 在 6:12–13 連用三次：美好的仗、美好的見證、美好的見證。</p><p>εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων（eis hēn eklēthēs kai hōmologēsas tēn kalēn homologian enōpion pollōn martyrōn）：提摩太在哪裡作了那美好的見證？註釋有三說：一是受洗時在會眾面前承認信仰；二是被按立時，4:14 眾長老按手的那一次；三是某次在官府面前受審。本講義取受洗之說為主，兼容按立之說：被召與承認並列，最自然的場合是一個人公開表明歸主的那一刻。ὁμολογίαν（homologian） 的字面是「說同樣的話」——與神所說的，說同樣的話。</p>","exp":"<p><strong>「你要為真道打那美好的仗，持定永生。」（6:12）信仰不是坐在看台上的事。</strong></p><p>保羅用的是運動場的語言。一位選手在賽場上，肌肉會痛，呼吸會亂，但他知道自己為甚麼在場上。保羅自己到了晚年說：「那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。」（提後 4:7）他在這裡把同一場比賽交給提摩太。拚搏不是說要靠自己賺得永生，而是說信心一定會遇到阻力：疲倦、懷疑、誘惑、反對。這些都不是信心失敗的證據，而是比賽正在進行的證據。</p><p>「持定永生」的動詞是一把抓住。永生不只是死後的事，也是現在就可以握在手裡的生命。抓住生命的人，手是滿的，就不會再空出手去抓 6:10 那些人在抓的東西。6:19 會用同一個動詞說富足的人要「持定那真正的生命」（6:19）；第 6 章兩次叫人伸手，抓的都是生命，不是錢。</p><p>保羅也提醒提摩太記得起點：「你為此被召，也在許多見證人面前，已經作了那美好的見證。」（6:12）一個年輕傳道人在困難中最需要的，往往不是新的激勵，而是想起自己當初在眾人面前說過的話。每一位受過洗的信徒都有這樣一個起點；疲倦的時候，回到那一天去。</p>"},{"a":13,"z":14,"star":1,"grk":"<p lang=\"grc\">παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,</p><p lang=\"grc\">τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,</p>","lit":"<p>我在那使萬物存活的神面前，並在那在本丟彼拉多面前見證了那美好承認的基督耶穌面前，囑咐你：</p><p>要你守這命令，無瑕疵、無可指責，直到我們主耶穌基督的顯現；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>παραγγέλλω σοι</td><td>parangellō soi</td><td>我囑咐你</td><td>追蹤字：命令、囑咐</td></tr><tr><td>τοῦ ζῳογονοῦντος τὰ πάντα</td><td>tou zōogonountos ta panta</td><td>那使萬物存活的</td><td>生命＋生出：賜生命、保全生命</td></tr><tr><td>ἐπὶ Ποντίου Πιλάτου</td><td>epi Pontiou Pilatou</td><td>在本丟彼拉多面前／之時</td><td>ἐπί 加屬格的兩讀</td></tr><tr><td>ἄσπιλον ἀνεπίλημπτον</td><td>aspilon anepilēmpton</td><td>無瑕疵、無可指責</td><td>3:2 監督的第一個資格</td></tr><tr><td>τῆς ἐπιφανείας</td><td>tēs epiphaneias</td><td>顯現</td><td>主再來的顯現</td></tr></table>","gram":"<p><strong>6:13 的 παραγγέλλω σοι（parangellō soi） 是本卷追蹤字「囑咐」的站點：1:3 保羅叫提摩太去囑咐別人，這裡保羅自己在神面前囑咐提摩太。囑咐別人的人，自己先被囑咐。</strong></p><p>兩位見證者。一是 τοῦ θεοῦ τοῦ ζῳογονοῦντος τὰ πάντα（tou theou tou zōogonountos ta panta）：ζῳογονοῦντος（zōogonountos） 的字面是「生出生命」，路 17:33 用同一個動詞說「救活」生命。在要求人冒險作見證的時候，保羅提醒他：神是保全生命的那一位。二是 Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν（Christou Iēsou tou martyrēsantos epi Pontiou Pilatou tēn kalēn homologian）。ἐπί（epi） 加屬格有兩讀：「在彼拉多面前」，指約翰福音第 18 章的受審；或「在彼拉多的時候」，指整個受難，後來的信經說在本丟彼拉多手下受難，就是這個用法。本講義取前者為主：τὴν καλὴν ὁμολογίαν（tēn kalēn homologian） 與 6:12 提摩太所作的 ὁμολογίαν（homologian） 是同一個字，提摩太的見證是照著基督的見證作的。</p><p>6:14 τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον（tērēsai se tēn entolēn aspilon anepilēmpton）：ἀνεπίλημπτον（anepilēmpton） 正是 3:2 監督「必須無可指責」（3:2）的那個字，5:7 也用過。這命令是甚麼？可以是 6:11–12 的勸勉，也可以是整封信的託付；1:5 說「命令的總歸就是愛」（1:5），那裡的命令是同字根的 παραγγελίας（parangelias）。本講義取後者：守這命令，就是守住全卷所交託的。μέχρι τῆς ἐπιφανείας（mechri tēs epiphaneias） 給了期限：直到主顯現。</p>","exp":"<p><strong>保羅把提摩太帶到兩位面前：叫萬物生活的神，和在彼拉多面前作過美好見證的基督。</strong></p><p>美好，本卷的追蹤字，在 6:12–13 連用三次：美好的仗、美好的見證、美好的見證。到了 6:13，美好第一次有了一個人的臉。耶穌站在彼拉多面前，被問「這樣，你是王嗎？」（約 18:37）他沒有否認，也沒有反擊，只說：「我為此而生，也為此來到世間，特為給真理作見證。」（約 18:37）那是一個被綁住的人所作的見證，安靜、清楚、不退讓。提摩太面對以弗所的假師傅與有錢的會友時，要照著這個模子說話。</p><p>「要守這命令，毫不玷污，無可指責，直到我們的主耶穌基督顯現。」（6:14）守命令有一個期限：直到主顯現。這讓守變得有盼望——我們不是無止盡地撐著，是等候一位一定會來的主。而「無可指責」不是完美主義，是 3:2 對監督的同一個要求：讓人找不到把柄去指控福音。</p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,</p><p lang=\"grc\">ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.</p>","lit":"<p>那顯現，他要在自己的時候顯明出來——那可稱頌的、獨一的掌權者，那作王者的王、作主者的主，</p><p>那獨有不死的，住在不可接近的光中，沒有一個人見過他，也不能見；尊貴和永遠的權能歸給他。阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καιροῖς ἰδίοις</td><td>kairois idiois</td><td>在他自己的時候</td><td>2:6「到了時候」同一個片語</td></tr><tr><td>ὁ μακάριος καὶ μόνος δυνάστης</td><td>ho makarios kai monos dynastēs</td><td>那可稱頌而獨一的掌權者</td><td>δυνάστης：有權勢的君主</td></tr><tr><td>ὁ βασιλεὺς τῶν βασιλευόντων</td><td>ho basileus tōn basileuontōn</td><td>作王者的王</td><td>分詞：一切正在作王的</td></tr><tr><td>ὁ μόνος ἔχων ἀθανασίαν</td><td>ho monos echōn athanasian</td><td>那獨有不死的</td><td>不死是神自有的，人是領受的</td></tr><tr><td>φῶς οἰκῶν ἀπρόσιτον</td><td>phōs oikōn aprositon</td><td>住在不可接近的光中</td><td>οἰκῶν：本卷「家」的追蹤終點</td></tr><tr><td>ᾧ τιμὴ καὶ κράτος αἰώνιον</td><td>hō timē kai kratos aiōnion</td><td>尊貴和永遠的權能歸他</td><td>全卷第三處頌讚的收句</td></tr></table>","gram":"<p><strong>6:15–16 是全卷第三處頌讚（1:17；3:16；6:15–16）。它由關係代名詞 ἣν（hēn） 接上 6:14 的「顯現」：主的顯現，是神要 καιροῖς ἰδίοις（kairois idiois），在他自己的時候顯明的。</strong></p><p>頌讚由一連串帶冠詞的頭銜組成，像禮儀中的宣讀。第一個是 ὁ μακάριος καὶ μόνος δυνάστης（ho makarios kai monos dynastēs），μακάριος（makarios） 在 1:11 已經用來稱「可稱頌之神」。接著是 ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων（ho basileus tōn basileuontōn kai kyrios tōn kyrieuontōn）：不用名詞「眾王」，而用分詞「一切正在作王的、一切正在作主的」——凡此刻坐在寶座上的，都在他之下。這話在以弗所說出來分量很重：那城有皇帝崇拜的神廟，羅馬皇帝也被稱為主。啟 17:14、19:16 把同一稱號歸給羔羊。</p><p>ὁ μόνος ἔχων ἀθανασίαν（ho monos echōn athanasian）：「獨一不死」不是說天使與人的靈魂會消滅，而是說只有神本身擁有不死，是自有的；人得著不死，是領受的，林前 15:53 用同一個字說這必死的要變成不死的。φῶς οἰκῶν ἀπρόσιτον（phōs oikōn aprositon）：ἀπρόσιτον（aprositon） 在新約只出現這一次，字面是「無路可近的」；οἰκῶν（oikōn） 是本卷「家」字追蹤的終點翻轉——我們住在神的家裡（3:15），因為神自己住在光裡。</p><p>ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται（hon eiden oudeis anthrōpōn oude idein dynatai） 呼應 1:17 的「不能看見」，也使我們想起出 33:20。最後一句 ᾧ τιμὴ καὶ κράτος αἰώνιον（hō timē kai kratos aiōnion） 沒有動詞，是禮儀的套語，後面緊接著 ἀμήν（amēn），等候會眾一同回應。</p>","exp":"<p><strong>講到守命令，保羅忽然唱起來了。這是全卷地勢圖在第 6 章的山峰：「住在人不能靠近的光裡」（6:16）。</strong></p><p>前面說的是錢、爭辯、品格、見證，都是地上的事；說著說著，保羅抬起頭，看見了寶座。這是本卷的習慣：1:17 保羅想起自己這個罪魁蒙了憐憫，就頌讚「永世的君王」（1:17）；3:16 講完神的家的秩序，就唱「大哉，敬虔的奧祕」（3:16）；這裡吩咐提摩太守住命令直到主顯現，就再一次停下來敬拜。三處頌讚是全卷的三根柱子：個人的得救、教會的根基、末後的盼望。</p><p>這段頌讚放在錢的教導中間，意思很清楚。6:9–10 的人以為錢就是權能；保羅說，獨有權能的只有一位。以弗所的街上有皇帝的神廟，錢幣上印著皇帝的頭像；保羅說，一切正在作王的、一切正在作主的之上，還有一位「萬王之王、萬主之主」（6:15）。富人倚靠財富，是以為它能保護自己；保羅說「獨一不死」（6:16）的只有神。人追求不朽，常用金錢、名聲、建築；真正的不朽只在他手裡。</p><p>「住在人不能靠近的光裡，是人未曾看見、也是不能看見的」（6:16），這是神的超越。我們很容易把神說得太小，好像他只是我們的顧問、我們的資源。這一節把我們帶回敬畏：神不是被我們使用的。然而，那不能看見的神並沒有一直躲在光裡。約翰說：「從來沒有人看見神，只有在父懷裡的獨生子將他表明出來。」（約 1:18）6:14 那位要顯現的主耶穌，就是那光照進人間的面孔。</p><p>「但願尊貴和永遠的權能都歸給他。阿們！」（6:16）保羅寫到這裡，提摩太在會眾面前宣讀到這裡，全會眾要一起說阿們。321 說「讓耶穌得著一切的榮耀」；讀到這一節，最好的回應不是分析，是停下來敬拜。</p>"},{"a":17,"z":17,"star":3,"grk":"<p lang=\"grc\">Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλʼ ἐπὶ θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,</p>","lit":"<p>對那些在現今世代富足的人，你要囑咐他們不要心高，也不要把盼望定在錢財的不確定上，而要定在那把萬物豐富地供給我們、為了享受的神身上；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι</td><td>Tois plousiois en tō nyn aiōni</td><td>對那些在現今世代富足的</td><td>富足是有期限的</td></tr><tr><td>μὴ ὑψηλοφρονεῖν</td><td>mē hypsēlophronein</td><td>不要心高</td><td>錢最容易抬高的是眼睛</td></tr><tr><td>ἠλπικέναι</td><td>ēlpikenai</td><td>把盼望定在</td><td>完成式不定詞：一個定了型的倚靠</td></tr><tr><td>πλούτου ἀδηλότητι</td><td>ploutou adēlotēti</td><td>錢財的不確定</td><td>ἄδηλος：看不清楚的；名詞在新約僅此一次</td></tr><tr><td>πλουσίως</td><td>plousiōs</td><td>豐豐富富地</td><td>與「富足的人」同字根：真正富足的是神</td></tr><tr><td>εἰς ἀπόλαυσιν</td><td>eis apolausin</td><td>為了享受</td><td>來 11:25 用於罪中之樂</td></tr></table>","gram":"<p><strong>6:17 回到錢的話題，但對象換了：Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι（Tois plousiois en tō nyn aiōni），在「現今世代」富足的人。這個時間片語本身就是一句提醒：他們的富足屬於這個世代，有期限。</strong></p><p>παράγγελλε（parangelle） 是追蹤字「囑咐」的又一站，現在式命令：要持續地囑咐。囑咐的內容有一否一肯。否定兩項：μὴ ὑψηλοφρονεῖν（mē hypsēlophronein），不要心高；μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι（mēde ēlpikenai epi ploutou adēlotēti），不要把盼望放在錢財的「不確定」上。ἠλπικέναι（ēlpikenai） 是完成式，說的是一種已經定下來的倚靠。ἀδηλότητι（adēlotēti） 這個名詞在新約只出現一次，字根 ἄδηλος（adēlos） 是「不明顯、看不清」。保羅不只說不要倚靠錢財，他說不要倚靠「錢財的不確定」，用一個抽象名詞把錢財的本質點出來。</p><p>肯定一項：ἀλλʼ ἐπὶ θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν（all' epi theō tō parechonti hēmin panta plousiōs eis apolausin）。這裡有一個字的遊戲：富足的人是 πλουσίοις（plousiois），神給的方式是 πλουσίως（plousiōs）——真正豐富的是那位賜予者。εἰς ἀπόλαυσιν（eis apolausin） 是目的：神給萬物，是「為了」讓我們享受。ἀπόλαυσιν（apolausin） 在新約只再出現一次，摩西「不願暫時享受罪中之樂」（來 11:25）；同一個字，在那裡是罪中的享受，在這裡是神所賜的享受。享受本身不是問題，問題是從誰手裡領受。</p>","exp":"<p><strong>「只要倚靠那厚賜百物給我們享受的神。」（6:17）保羅沒有叫富人變窮，他叫他們換一個倚靠。</strong></p><p>以弗所教會裡有富人。保羅沒有假裝他們不存在，也沒有叫提摩太討好他們或羞辱他們。他給一個年輕傳道人一句清楚的話，去對年紀比他大、錢比他多的人說：不要自高，不要倚靠無定的錢財。年輕的牧者面對有錢的會友，最大的試探有兩個——一個是巴結，一個是嫉妒；保羅兩樣都不給，只給他一份囑咐。</p><p>錢財為甚麼「無定」？因為它看起來很實在，其實像霧。股市一夜之間可以蒸發一半，一場病可以花掉半生的積蓄，一種貨幣可以在幾年內變成廢紙。倚靠錢財，就像倚靠霧：看得見，卻撐不住。錢最常抬高的，是人的眼睛；有了錢，人很容易把自己的成功看作自己的功勞，於是心就高起來。</p><p>這一節最美的地方，是保羅對神的描述：神是「厚賜百物給我們享受」（6:17）的那一位。這句話擋住了清貧主義。神不是吝嗇的主人，他給得豐富，而且目的是讓我們享受。一頓好吃的飯、一次和家人的旅行、一個舒適的家，都不必帶著罪疚感領受。4:4 說「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的」（4:4）。享受不是罪，忘了賜予者才是。</p><p>但這一節同樣擋住了成功神學。神厚賜百物，不是要我們把信仰當成換取財富的工具，而是要我們把盼望放在他身上，而不是放在他的禮物上。禮物可以收回，賜予者不會改變。一個人在錢多的時候仍然倚靠神，在錢少的時候也不會失去神；這就是 6:6 的知足在富人身上的樣子。</p>"},{"a":18,"z":19,"star":2,"grk":"<p lang=\"grc\">ἀγαθοεργεῖν, πλουτεῖν ἐν ἔργοις καλοῖς, εὐμεταδότους εἶναι, κοινωνικούς,</p><p lang=\"grc\">ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ὄντως ζωῆς.</p>","lit":"<p>要行善，在美好的工作上富足，要慷慨施與，樂於分享，</p><p>為自己積存一個美好的根基，以備將來，好叫他們抓住那真正的生命。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀγαθοεργεῖν</td><td>agathoergein</td><td>行善</td><td>複合字：善＋工作</td></tr><tr><td>πλουτεῖν ἐν ἔργοις καλοῖς</td><td>ploutein en ergois kalois</td><td>在美好的工作上富足</td><td>6:9「想要發財」的同一個動詞</td></tr><tr><td>εὐμεταδότους</td><td>eumetadotous</td><td>慷慨施與的</td><td>新約僅此一次</td></tr><tr><td>κοινωνικούς</td><td>koinōnikous</td><td>樂意分享的</td><td>κοινωνία 的形容詞；新約僅此一次</td></tr><tr><td>ἀποθησαυρίζοντας</td><td>apothēsaurizontas</td><td>積存起來</td><td>寶藏的動詞</td></tr><tr><td>τῆς ὄντως ζωῆς</td><td>tēs ontōs zōēs</td><td>那真正的生命</td><td>ὄντως：5:3、5、16「真是寡婦」</td></tr></table>","gram":"<p><strong>6:18 的四項都是 6:17 παράγγελλε（parangelle） 的內容，排成兩對：ἀγαθοεργεῖν（agathoergein） 和 πλουτεῖν ἐν ἔργοις καλοῖς（ploutein en ergois kalois） 說行動，εὐμεταδότους εἶναι（eumetadotous einai） 和 κοινωνικούς（koinōnikous） 說性情。</strong></p><p>πλουτεῖν（ploutein） 是一個刻意的回聲：6:9 那些人 βουλόμενοι πλουτεῖν（boulomenoi ploutein），想要發財；這裡保羅吩咐富人照樣 πλουτεῖν（ploutein），只是換了範圍——ἐν ἔργοις καλοῖς（en ergois kalois），在好事上富足。他不壓抑人想要富足的心，他把它重新導向。κοινωνικούς（koinōnikous） 在新約只出現一次，是 κοινωνία（koinōnia） 的形容詞：樂意與人分享、共有。εὐμεταδότους（eumetadotous） 說的是把東西給出去，κοινωνικούς（koinōnikous） 說的是給出去之後建立起來的關係。</p><p>6:19 ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον（apothēsaurizontas heautois themelion kalon eis to mellon） 把兩個比喻疊在一起：積存寶藏，與一塊根基。積下來的不是會被偷走的財寶，是一塊可以站在上面的地基。這使我們想起「只要積攢財寶在天上」（太 6:20）。追蹤字 καλός（kalos） 在這裡到達終點：θεμέλιον καλὸν（themelion kalon），美好不是外表，是積在將來的根基。</p><p>◆ <strong>經文鑑別（6:19）</strong>：6:19 末尾，SBLGNT 作 τῆς ὄντως ζωῆς（tēs ontōs zōēs），那真正的生命；拜占庭多數本（RP）作 τῆς αἰωνίου ζωῆς（tēs aiōniou zōēs），那永遠的生命。和合本「那真正的生命」與 SBLGNT 同。兩種讀法並陳：αἰωνίου（aiōniou） 有大量晚期抄本支持，也與 6:12 的 τῆς αἰωνίου ζωῆς（tēs aiōniou zōēs） 一致；ὄντως（ontōs） 則見於較早的西乃抄本、亞歷山大抄本等。本講義判斷 ὄντως（ontōs） 是原文：抄寫的人看見 6:12 有同一個動詞 ἐπιλαβοῦ（epilabou） 與 τῆς αἰωνίου ζωῆς（tēs aiōniou zōēs），很容易把較少見的 ὄντως（ontōs） 改成熟悉的 αἰωνίου（aiōniou），反方向的改動則很難解釋。ὄντως（ontōs） 是本卷的字，5:3、5、16 三次說「真是寡婦」：真正的寡婦，真正的生命。兩讀意思相近，永生就是真正的生命；但 ὄντως（ontōs） 多了一層對比——錢買得到生活，買不到真正的生命。</p>","exp":"<p>〔背景〕徒 20:33--35（使徒行傳講義第 20 章）</p><p><strong>「又要囑咐他們行善，在好事上富足，甘心施捨，樂意供給人。」（6:18）富人被吩咐的，不是變窮，是變慷慨。</strong></p><p>保羅在米利都對以弗所的長老說：「我這兩隻手常供給我和同人的需用」（徒 20:34），又引主耶穌的話：「施比受更為有福。」（徒 20:35）同一間教會，幾年後收到這封信；保羅自己活過的，現在要富足的會友也去活。</p><p>「樂意供給人」原文是 κοινωνικούς（koinōnikous），是團契、相交那個字的形容詞。這是全卷立場五最要緊的一個字：錢在神的家裡，是用來建立關係的。一個人把錢給出去，可以只是轉帳；但 κοινωνικούς（koinōnikous） 說的是把自己和對方連在一起，把擁有變成共有。321 說「人比事重要，關係比東西重要」；這一節把那句話落到錢包裡：東西最好的用途，是成為關係的橋。</p><p>「為自己積成美好的根基，預備將來，叫他們持定那真正的生命。」（6:19）這是最聰明的投資。這不是說施捨可以買到永生，那就又回到 6:5 以敬虔為得利的老路；而是說，一個慷慨的人在生活中已經抓住了真正的生命，他活在將來的實際裡。錢買得到生活，買不到真正的生命；但錢可以成為通往生命的路，當它從我們手中流到別人的需要裡。</p>"},{"a":20,"z":21,"star":3,"grk":"<p lang=\"grc\">Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,</p><p lang=\"grc\">ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις μεθʼ ὑμῶν.</p>","lit":"<p>啊，提摩太，要看守那寄存的託付，避開那些褻俗的空談，和那名不副實之知識的反論；</p><p>有些人自稱有它，就在信仰上偏離了靶心。恩典與你們同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὦ Τιμόθεε</td><td>Ō Timothee</td><td>啊，提摩太</td><td>感嘆的呼格；與 6:11 相應</td></tr><tr><td>τὴν παραθήκην φύλαξον</td><td>tēn parathēkēn phylaxon</td><td>看守那寄存物</td><td>不定過去式命令</td></tr><tr><td>παραθήκη</td><td>parathēkē</td><td>寄存物、託付</td><td>法律用語：要原封不動地交還</td></tr><tr><td>τὰς βεβήλους κενοφωνίας</td><td>tas bebēlous kenophōnias</td><td>世俗的空談</td><td>4:7「世俗的言語」同一個形容詞</td></tr><tr><td>τῆς ψευδωνύμου γνώσεως</td><td>tēs pseudōnymou gnōseōs</td><td>冒名的知識</td><td>假的＋名字：名不副實</td></tr><tr><td>ἠστόχησαν</td><td>ēstochēsan</td><td>偏離了靶心</td><td>1:6 同字</td></tr><tr><td>Ἡ χάρις μεθʼ ὑμῶν</td><td>Hē charis meth' hymōn</td><td>恩典與你們同在</td><td>複數的「你們」</td></tr></table>","gram":"<p><strong>6:20 以 Ὦ Τιμόθεε（Ō Timothee） 開頭，與 6:11 的 ὦ ἄνθρωπε θεοῦ（ō anthrōpe theou） 前後呼應。保羅在書信裡很少這樣帶著感嘆直呼人名；這是一位屬靈父親在信的最後，叫著兒子的名字。</strong></p><p>τὴν παραθήκην φύλαξον（tēn parathēkēn phylaxon）：παραθήκη（parathēkē） 是古代的法律用語，指交給別人代為保管的寄存物——錢、文件、貴重物品；受託的人不可挪用、不可改變，要原封不動地交還。φύλαξον（phylaxon） 是不定過去式命令，說的是一個整體的責任。同一句話在提後 1:14 幾乎逐字重複：τὴν καλὴν παραθήκην φύλαξον（tēn kalēn parathēkēn phylaxon）。提後 2:2 又用同字根的動詞 παράθου（parathou） 說：「也要交託那忠心能教導別人的人」（提後 2:2）。看守寄存物的目的，是把它完整地交給下一棒。這也是追蹤字「囑咐、交託」的終點：1:18 保羅說 παρατίθεμαί（paratithemai），把命令交託提摩太；6:20 叫他保守所託付的。囑咐別人的人，自己先被託付。</p><p>ἐκτρεπόμενος（ektrepomenos） 是現在分詞，一面保守，一面避開，兩件事同時進行。避開的有兩樣：τὰς βεβήλους κενοφωνίας（tas bebēlous kenophōnias），以及 ἀντιθέσεις τῆς ψευδωνύμου γνώσεως（antitheseis tēs pseudōnymou gnōseōs）。ἀντιθέσεις（antitheseis） 是「對立的論點」；有人把它讀成二世紀馬吉安的《反論》一書，那是時代錯置，保羅說的只是與真道唱反調的論證。ψευδωνύμου（pseudōnymou） 字面是「名不副實」：問題不在 γνώσεως（gnōseōs） 本身，保羅從不反對知識，而在那冒用了知識之名的東西。</p><p>6:21 ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν（hēn tines epangellomenoi peri tēn pistin ēstochēsan），與 1:19 ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν（hēn tines apōsamenoi peri tēn pistin enauagēsan） 句型相同；ἠστόχησαν（ēstochēsan） 在 1:6 也用過，是射箭偏離靶心。ἐπαγγελλόμενοι（epangellomenoi） 是「自稱」，2:10 用同一個字說「自稱是敬神的」（2:10）。全卷首尾用同樣的字收束：偏離、自稱、在信仰上失落。</p><p>◆ <strong>經文鑑別（6:21）</strong>：6:21 末句，SBLGNT 作 Ἡ χάρις μεθʼ ὑμῶν（Hē charis meth' hymōn），「你們」是複數；拜占庭多數本（RP）作 Ἡ χάρις μετὰ σοῦ（Hē charis meta sou），單數的「與你」，並在後面加上 Ἀμήν（Amēn）。和合本「願恩惠常與你們同在」與 SBLGNT 同，也沒有阿們。兩種讀法並陳：單數的 σοῦ（sou） 看起來更合理，因為全信是寫給提摩太一個人的；但正因為它更順，才更可能是抄寫者改的。複數的 ὑμῶν（hymōn） 有較早的抄本支持，提後 4:22、多 3:15 的結尾也同樣是複數；Ἀμήν（Amēn） 則是在禮儀中宣讀時很自然會添上的。本講義取 SBLGNT：複數本身就是證據，這封寫給一個人的信，是要在全會眾面前宣讀的。</p>","exp":"<p>〔背景〕徒 20:17--38（使徒行傳講義第 20 章）</p><p><strong>「提摩太啊，你要保守所託付你的。」（6:20）全卷最後一個命令，不是開拓，是看守；而看守的目的，是交下去。</strong></p><p>本系列使徒行傳講義第 20 章講過米利都的告別：保羅把以弗所的長老請來，流著淚說：「如今我把你們交託神和他恩惠的道。」（徒 20:32）他也預言了豺狼要進來。幾年後，豺狼真的來了，保羅寫信給留在以弗所的提摩太，最後一句叮嚀幾乎就是那篇告別的回聲：保守所託付的，避開那些話。從米利都到這封信，同一間教會領受了兩次交託，次序也相同——先交託，再提到恩惠。</p><p>所託付的，是寄存物。古時出遠門的人，把一袋銀子交給可靠的朋友保管，回來時要原封不動地取回。福音就是這樣的寄存物：不是提摩太發明的，也不是他可以修改的；他的責任是不挪用、不打折、不加料。但寄存物還有另一面——它最終要交出去。提後 2:2 說得最清楚：「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」（提後 2:2）保守所託付的，是為了交給下一棒，不是關起門來。一間只會守、不會交的教會，守住的只是一個保險箱。</p><p>「躲避世俗的虛談和那敵真道、似是而非的學問」（6:20）也要讀準。保羅反對的不是學問，是似是而非、名不副實、冒用了知識之名的學問。這節經文不能拿來反對讀書，也不是反學術、反科學。神願意萬人「明白真道」（2:4），真理不怕被研究。基督徒要躲避的，是那種把人從真道上引開、只留下爭辯和驕傲的說法，不論它穿的是學術的外衣，還是屬靈的外衣。</p><p>最後一句：「願恩惠常與你們同在！」（6:21）「你們」是複數。這封信寫給一個人，卻在全會眾面前宣讀；最後一句話，保羅轉過身來對每一個人說。次序也很重要：先是保守，再是恩惠；但能夠保守，是因為恩惠先常與我們同在。年輕的提摩太不是靠自己的力量守住寄存物，是在恩惠的覆庇下守住它。守門的人會疲倦，恩惠不會離開。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《在罪人中我是個罪魁》"],["p","弟兄姊妹平安，今天我們一起讀提摩太前書第一章。"],["p","今天開頭，我想請一個人先開口。"],["p","下面這一段，是我替他說的。經文裡沒有這幾句話，可是經文裡有這個人。"],["q","馬其頓，夜裡，一盞油燈。一位老人拿起了筆。"],["p","「我叫保羅。我老了。"],["p","我的兒子提摩太，還留在以弗所。是我勸他留下的。"],["p","他年輕，個性又溫和。那裡有幾個人，很會講，講得很肯定。"],["p","我要寫一封信給他。這封信，他會在全教會面前念出來。"],["p","可是筆一放下去，我先想起的，不是這些。"],["p","我想起三十年前，大馬士革城外的那條路。"],["p","我手上拿著大祭司的文書，要去捆綁信主的人。"],["p","忽然，天上的光把我打倒在地上。"],["q","「掃羅！掃羅！你為甚麼逼迫我？」（徒 9:4）"],["p","三十年了。我建立過許多教會，寫過許多信，也坐過許多次監。"],["p","人家叫我使徒。可是今天晚上，我要寫的是另一句話。」"],["q","「在罪人中我是個罪魁。」（1:15）"],["p","好，保羅先說到這裡。"],["p","弟兄姊妹，請你留意一件事。"],["p","而且，是寫在一封講教會秩序的信裡。"],["p","這是一封託付信。古時候，上司派代表到地方上去，會寫一封授權的信。"],["p","這封信寫給一個人，卻要讓當地所有人都聽見。"],["p","所以這封信的最後一句祝福，用的是複數。"],["q","「願恩惠常與你們同在！」（6:21）"],["p","這就是說，今天這封信有兩層聽眾。"],["p","一層，是站在講台上、被託付的人，傳道人，同工，小組長。"],["p","另一層，是坐在下面聽的你。這封信也是念給你聽的。"],["p","所以今天，我會一邊對傳道人說，一邊對會眾說。"],["p","這一章有三個詞：愛，魁，船。"],["p","我們今天沿著它走三步：命令的總歸就是愛；我是個罪魁；打那美好的仗。"],["q","第一步：命令的總歸就是愛。"],["q","「我往馬其頓去的時候，曾勸你仍住在以弗所」（1:3）"],["p","請你聽那個「勸」字。保羅沒有下命令，他是請求。"],["p","提摩太大概很想跟著走。留下來，就是留在衝突的正中間。"],["p","保羅用一個「勸」字，先承認了這份難。"],["p","傳道人，如果你現在正被留在一個不好待的地方，這一個字是寫給你的。"],["p","留下來做甚麼？"],["q","「好囑咐那幾個人不可傳異教」（1:3）"],["p","「傳異教」，原文是一個字，ἑτεροδιδασκαλεῖν。"],["p","意思很簡單：教別的。"],["p","換成甚麼？保羅說了。"],["q","「也不可聽從荒渺無憑的話語和無窮的家譜；這等事只生辯論」（1:4）"],["p","家譜本身不是壞東西。馬太福音就是從家譜開始的。"],["p","今天換了名目。有人推算末世的日子，有人找聖經裡的隱藏密碼。"],["p","保羅拿甚麼來對照呢？「神在信上所立的章程」。"],["p","「章程」，原文是 οἰκονομίαν。這個字裡面，有一個「家」。"],["p","意思是神的家政，神怎樣治理他的家。"],["p","神在信心裡安排一個家，每一個人有位置，有服事。"],["p","假教訓卻把人從飯桌旁邊，拉到辯論場上去。"],["p","所以會眾也可以用一個簡單的問題，來試驗你聽到的教訓："],["q","它讓這個家更像家，還是讓人更想贏？"],["p","然後，保羅寫下整卷書的第一把鑰匙。"],["q","「但命令的總歸就是愛；這愛是從清潔的心和無虧的良心，無偽的信心生出來的。」（1:5）"],["p","「總歸」，原文是 τέλος，目的，終點，箭要射的那個靶。"],["p","這封信後面有很多規矩：禱告的次序，監督的資格，寡婦的名冊，長老的工價。"],["p","讀到任何一條，都請你回到這一節來問：這一條要成全的愛，在哪裡？"],["p","規矩若不再通向愛，就已經射偏了靶。"],["p","這一節出現在一個很不浪漫的地方。"],["p","保羅剛叫提摩太去囑咐人，不可以再那樣講。"],["p","然後馬上補一句：你下這個命令，目的是愛。"],["p","所以愛不是軟弱，不是甚麼都不管。有時候，愛就是說不可以。"],["p","可是說「不可以」的人，要先問自己一句話。"],["p","我是為了保護這個家，還是為了證明我對？"],["p","同一句話，從清潔的心說出來，是牧養；從爭勝的心說出來，是另一場辯論。"],["p","清潔的心，無虧的良心，無偽的信心。這三個泉源，也是三面鏡子。"],["p","清潔的心問我：我的動機，有沒有夾雜別的東西？"],["p","無虧的良心問我：我要求別人的，自己有沒有做到？"],["p","無偽的信心問我：我在台上的信心，和我在家裡的信心，是不是同一個？"],["p","這三面鏡子，不只是給講台的。坐在下面的你，在家裡也天天用得到。"],["q","「有人偏離這些，反去講虛浮的話」（1:6）"],["p","偏離，是一點一點的。箭差一度射出去，近看沒事，遠了就離靶很遠。"],["q","「想要作教法師，卻不明白自己所講說的所論定的。」（1:7）"],["p","病根在「想要」兩個字。他們要的是教師的位子，不是被真理教導。"],["p","講得肯定，不等於講得對。"],["p","可是保羅馬上補一句，免得人以為他反對律法。"],["q","「我們知道律法原是好的，只要人用得合宜」（1:8）"],["p","一把手術刀是好的。在醫生手裡救人，在別人手裡就會傷人。"],["p","問題從來不在律法，在用律法的那隻手。"],["p","聖經先是照自己的鏡子，然後才是扶別人的手。"],["p","接著，保羅列了一張清單。"],["q","「弒父母和殺人的，行淫和親男色的，搶人口和說謊話的，並起假誓的」（1:9–10）"],["p","請你聽它的次序。孝敬父母，不可殺人，不可姦淫，不可偷盜，不可作假見證。"],["p","這是十誡的第五條到第九條。這使我們想起出埃及記二十章十二到十六節。"],["p","每一項，都是愛的反面。所以這張清單和第五節的「愛」，是一體的。"],["p","讀到「親男色的」，教會常有兩種失誤。"],["p","一種是跳過去不講。一種是只講這一項，講得特別大聲。"],["p","經文兩樣都不容許。它清楚說，這種行為與健康的教訓相抵觸。"],["p","可是它也把這一項，放在「說謊話的」旁邊。坐在這裡的，沒有一個人可以置身事外。"],["p","保羅在哥林多前書說過：你們中間也有人從前是這樣，但如今已經洗淨了。"],["p","同一位神，洗淨了每一種人。所以教會可以清楚說這是罪，卻不可以把任何人當作笑話。"],["p","面對有同性吸引掙扎的弟兄姊妹，我們要陪伴，不要羞辱。"],["p","清單的最後一句，「敵正道的事」。「正道」，原文是健康的教訓。"],["q","「這是照著可稱頌之神交託我榮耀福音說的。」（1:11）"],["p","請你聽最後那三個字：交託我。"],["p","可是這個「我」，本來是最不該被交託的那一個人。"],["q","第二步：我是個罪魁。"],["q","「我感謝那給我力量的我們主基督耶穌，因他以我有忠心，派我服事他。」（1:12）"],["p","保羅講到自己的職分，第一個反應不是介紹資歷，是感謝。"],["q","「我從前是褻瀆神的，逼迫人的，侮慢人的」（1:13）"],["p","三個詞，一個比一個近。先是嘴巴，然後是行動，最後是動手羞辱人。"],["q","「然而我還蒙了憐憫，因我是不信不明白的時候而做的。」（1:13）"],["p","這不是藉口，是誠實。我那時候真的看不見。"],["p","今天也有很多人，還在那個看不見的地方。"],["p","他們反對，不一定是看清楚了，常常是還沒看見。"],["p","保羅的見證，叫我們對這樣的人，多一份耐心。"],["q","「並且我主的恩是格外豐盛」（1:14）"],["p","「格外豐盛」，原文是 ὑπερεπλεόνασεν。整本新約，只在這裡出現一次。"],["p","意思是滿出來，還再滿出來。"],["p","你那本帳，比保羅的厚嗎？恩典的杯，比你的帳本大。"],["p","然後，保羅引了一句當時教會人人會背的話。"],["q","「基督耶穌降世，為要拯救罪人。」（1:15）"],["p","一封講教會秩序的信，第一塊基石不是組織，是福音。"],["p","監督、執事、長老，都要等到第三章、第五章才出場。"],["p","神的家，是一群蒙了憐憫的罪人住的地方。"],["q","「這話是可信的，是十分可佩服的。在罪人中我是個罪魁。」（1:15）"],["p","現在，請你聽原文的時態。πρῶτός εἰμι ἐγώ。"],["p","εἰμι，是現在式。保羅沒有說「我從前是罪魁」，他說「我是」。"],["p","三十年的使徒，越老，越看清自己是誰。"],["p","這不是說他沒有改變。他在別處說得很清楚，在基督裡，他是新造的人。"],["p","現在式的意思是：他從來沒有離開過那個蒙恩的位置。"],["q","越靠近光的人，越看得見自己身上的灰塵。"],["p","傳道人，同工們，這一句對我們特別要緊。"],["p","一個覺得自己已經不太需要恩典的領袖，很快就會用規矩壓人。"],["p","一個每天記得自己是罪魁的領袖，去執行第三節的囑咐時，會帶著第五節的愛。"],["p","所有在神家裡被託付的人，都要從第一章十五節開始，不從第三章第一節開始。"],["p","可是弟兄姊妹，這一句也不可以被用成另一種壓迫。"],["p","有人一聽到「罪魁」，就以為信主多年，還要天天活在自責裡。"],["p","請你看，保羅下一句馬上接的是甚麼。"],["q","「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐」（1:16）"],["p","罪魁和蒙憐憫，要一起念。只念一半，都不是福音。"],["q","「給後來信他得永生的人作榜樣。」（1:16）"],["p","「榜樣」，原文是 ὑποτύπωσιν。是一張草圖，一個打樣的模子。"],["p","可是請你看清楚，這張草圖畫的是誰？"],["p","畫的不是保羅多能幹，是主對保羅多有耐心。"],["p","神把最難的案例，放在櫥窗的最前面。"],["p","好叫每一個經過的人都說：連他都可以，我也可以。"],["p","覺得自己太糟了的弟兄姊妹，你不是例外。你可能正是這張草圖要畫的人。"],["p","然後，一件很奇妙的事發生了。"],["p","保羅寫到這裡，寫不下去了。他沒有接著講道理，他唱了起來。"],["q","「但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！」（1:17）"],["p","弟兄姊妹，我們也在這裡停一下。這一節不是過門，這是全章最高的山峰。"],["p","永世的君王。以弗所城裡有皇帝的神廟，也有亞底米大廟。"],["p","可是皇帝會死，會換人。神廟會倒，會長草。"],["p","這一位王，每一個世代換了誰掌權，他都還在位。"],["p","不能看見的神，在哪裡被人看見了呢？就在上一節：在一個罪魁身上。"],["p","看不見的王，用他的憐憫，讓人看見了他。"],["p","獨一的神。有些古抄本多了「智慧」兩個字，經文的意思都一樣：只有一位。"],["p","所以尊貴和榮耀，也只有一個去處。"],["p","請你和我一起，用心裡的聲音，把這一句念一次。"],["q","永世的君王、獨一的神，尊貴、榮耀都歸給你。阿們！"],["p","一卷講教會秩序的書，在第一章，先教會我們敬拜。"],["p","秩序若不是從敬拜流出來的，就只剩下管理。"],["p","唱完了，保羅放下筆嗎？沒有。"],["p","他轉過頭來，對著那個年輕人，叫了他的名字。"],["q","第三步：打那美好的仗。"],["q","「我兒提摩太啊，我照從前指著你的預言，將這命令交託你，叫你因此可以打那美好的仗」（1:18）"],["p","「交託」，原文是 παρατίθεμαί。像父親把家傳的東西，放在兒子手裡。"],["p","這個字根，到第六章最後還會再出現一次：你要保守所託付你的。"],["p","整封信，就被這兩個「交託」框起來。"],["p","主交給保羅，保羅交給提摩太，提摩太還要交下去。"],["p","弟兄姊妹，這一棒也在你手裡。你是從誰手裡接過信仰的？你又要交給誰？"],["p","「從前指著你的預言」。提摩太被差出來的時候，有人為他禱告，說過話。"],["p","保羅說：在灰心的日子，回頭去記得神曾怎樣呼召你。"],["p","那不是為了誇口，是為了站得住。"],["p","傳道人，你被人小看、想放棄的那一個晚上，請你把當初的呼召拿出來，再讀一次。"],["q","「常存信心和無虧的良心。有人丟棄良心，就在真道上如同船破壞了一般。」（1:19）"],["p","兩樣東西要一起帶上船。信心是方向，良心是船身。"],["p","只有方向，沒有船身，再對的航線也會沉。"],["p","「丟棄」，是用手把它推開。良心不是一次壞掉的。"],["p","是一次又一次把它推開：這一次就算了，下一次也沒關係。"],["p","推久了，那個聲音就小了。終於，聽不見了。"],["p","「船破壞了」，原文是一個字，ἐναυάγησαν。船難。"],["p","保羅自己在海上經過三次船難。他知道船破的那一刻是甚麼光景。"],["p","不是慢慢漏水，是一聲巨響，船身裂開。"],["p","教會裡有些崩塌也是這樣。外面看起來很突然，裡面其實已經推開良心很久了。"],["q","越在前面的船，撞上暗礁時，沉下去的人越多。"],["p","這是給站講台的人的警告。也是給每一個在家裡當父母、在公司帶人的你。"],["q","「其中有許米乃和亞歷山大；我已經把他們交給撒但，使他們受責罰就不再謗瀆了。」（1:20）"],["p","這一句很重。請你一定要把它讀完，因為目的寫在後半句：使他們受責罰就不再謗瀆了。"],["p","「受責罰」，原文是教養孩子的那個字。"],["p","父親管教兒子，不是要他消失，是要他回家。"],["p","所以把人交給撒但，目的是挽回。這使我們想起林前 5:5，保羅也說，是要使他的靈魂可以得救。"],["p","而且，這是保羅最後的一步，不是第一個反應。前面有囑咐，有勸，有等待。"],["p","所以，交給撒但這句話，今天不可以變成三件事，因為它的目的是挽回。"],["p","它不可以變成當眾羞辱，叫人在大家面前難堪。"],["p","它不可以變成逐出以後的冷暴力。見面不打招呼，連他的家人也被孤立。"],["p","它更不可以和趕鬼、咒詛連在一起，好像教會可以咒人。"],["p","哥林多那一次的紀律，後來怎麼樣了？保羅寫信說："],["q","「倒不如赦免他，安慰他，免得他憂愁太過，甚至沉淪了。」（林後 2:7）"],["p","門可以關上，但燈要一直亮著，路也要一直鋪著，讓回頭的人找得到。"],["p","還有一件事，請你聽。"],["p","第二十節的「謗瀆」，和第十三節保羅說自己「褻瀆」，原文是同一個字根。"],["p","主沒有放棄那個褻瀆的掃羅。"],["p","所以他心裡盼望的，是有一天，許米乃和亞歷山大也能說：我蒙了憐憫。"],["p","弟兄姊妹，我們回到那盞油燈下。"],["p","可是整章其實是一條線。"],["p","命令的目的是愛。罪魁蒙了憐憫。連最重的懲戒，也是為了挽回。"],["p","這一條線，是從哪裡來的？"],["p","是從三十年前，大馬士革城外，那一位不肯放棄掃羅的主來的。"],["q","「我就是你所逼迫的耶穌。」（徒 9:5）"],["p","這就是第十六節說的「一切的忍耐」。"],["p","保羅的一生，只是這份忍耐的一張草圖。"],["q","我們不必更佩服保羅。我們要更愛那一位忍耐他、也忍耐我們的主。"],["p","國度321空中團契常說：謙卑，回到本位。"],["p","本位在哪裡？就在這一章。我是罪人，他是救主。"],["p","我們也常說：讓耶穌得著一切的榮耀。"],["p","保羅在第十七節就是這樣做的。他把自己的故事，全部交給了永世的君王。"],["p","這個禮拜，請你做一件小事。"],["p","傳道人、同工，在你預備任何一次聚會、處理任何一件難事以前，先念第十五節。"],["p","我是個罪魁，我蒙了憐憫。帶著這句話，再去囑咐人。"],["p","坐在下面的弟兄姊妹，想一想，有沒有一個人，你已經在心裡把他交出去了。"],["p","這個禮拜，為他禱告一次。主怎樣忍耐了你，也求主忍耐他。"],["p","然後，讓我們一起把尊貴和榮耀，歸給那一位永世的君王。"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《只有一位神，在神和人中間，只有一位中保》"],["p","弟兄姊妹平安，今天我們一起讀提摩太前書第二章。"],["p","請你先跟我走一段路，到一座兩千年前的城裡去。"],["q","以弗所，亞底米大廟前，清晨。"],["p","天剛亮，廟前的石階上已經擠滿了人。"],["p","空氣裡有香的味道，也有燒肉的味道。祭壇上的火，從昨夜燒到現在。"],["p","石階底下，一排攤子已經開張。"],["p","銀匠在叫賣小小的銀龕，裡面坐著女神的像。帶回家，放在床頭，保平安。"],["p","請你看那一位母親。她懷裡抱著一個發燒的孩子。"],["p","她手裡握著幾枚銅錢，先買一隻鴿子，交給祭司。"],["p","祭司接過去，替她獻上，替她開口。"],["p","她還不放心，又走到廊柱旁邊，找占卜的人問一問。"],["p","她很愛她的孩子。她也很怕。"],["p","她不知道女神聽見了沒有。所以她找了一層又一層的人，替她傳話。"],["q","要見神，先找人。找了人，還是不放心。"],["p","就在這一座城裡，有一間一間的家庭教會。"],["p","有一個年輕人在那裡牧養，他的名字叫提摩太。"],["p","這一天，他收到一封信。寫信的人，是他屬靈的父親保羅。"],["p","這封信是寫給一個人的，卻要在全會眾面前念出來。"],["p","所以今天這一章，是說給講台上的人聽的，也是說給坐在下面的你聽的。"],["p","這一章有三個字：禱，保，學。"],["p","我們沿著它走三步：為萬人禱告，一位中保，沉靜學道。"],["q","第一步：為萬人禱告。"],["p","請你記得，第一章是怎麼結束的。"],["q","「有人丟棄良心，就在真道上如同船破壞了一般。」（1:19）"],["p","教會裡有人翻船了，還點了兩個人的名字。"],["p","保羅寫的卻是這一句。"],["q","「我勸你，第一要為萬人懇求、禱告、代求、祝謝；」（2:1）"],["p","「第一」，原文的意思不只是時間上的先，是一切事情裡面的先。"],["q","神的家第一件事不是開會，是禱告。"],["p","保羅一口氣用了四個字：懇求，禱告，代求，祝謝。"],["p","意思是：各樣的禱告，為各樣的人。"],["p","其中最難的，是最後一個字：祝謝。"],["p","為一位難相處的同工感謝，就得先承認，神在他身上也有工作。"],["p","禱告的人先低下來，才看得見別人身上的恩典。"],["p","再聽那個範圍：為萬人。"],["p","以弗所的假教訓喜歡講家譜。家譜是用來分你我的。"],["p","禱告的範圍一放到萬人，那個圈子就破了。"],["p","我們沒有辦法一面為一個人代求，一面在心裡把他畫到恩典外面。"],["p","然後保羅點出一群特別的人。"],["q","「為君王和一切在位的，也該如此，使我們可以敬虔、端正、平安無事地度日。」（2:2）"],["p","保羅寫這封信的時候，坐在寶座上的是羅馬皇帝。"],["p","各省有總督，各城有官長。沒有一位是基督徒。"],["p","保羅沒有先評估他們好不好，才決定要不要為他們禱告。他沒有附帶條件。"],["p","這一節常被兩邊拿去用。有人用它要基督徒擁護某一個政權。"],["p","也有人嫌它太軟，不肯為自己不喜歡的領袖禱告。"],["p","經文兩條路都不走。"],["p","所以今天這個講台，不替任何當代政權背書，也不攻擊任何當代政權。"],["p","我們不在這裡評價任何一個國家的現任領袖。"],["p","我們為那個職分禱告，也為坐在那個職分上的那一個人禱告。"],["p","禱告求的是甚麼？經文寫得很清楚：敬虔、端正、平安無事地度日。"],["p","不是特權，不是影響力，是一個可以安安靜靜過敬虔日子的空間。"],["p","請你記住「平安無事」裡面那個安靜的字。待一會兒，它還會再出現。"],["q","「這是好的，在神我們救主面前可蒙悅納。」（2:3）"],["p","那個時代，城裡的石碑上常稱皇帝為「救主」。"],["p","保羅為皇帝禱告，卻把「救主」這個稱號，留給神。"],["q","為在位者禱告，不等於敬拜在位者。"],["p","可是保羅還有一個更深的理由。請聽下一節。"],["q","「他願意萬人得救，明白真道。」（2:4）"],["p","為在位的人禱告，是因為神也願意他們得救。"],["p","坐在高位上的人，在神眼中，也是一個需要救主的人。"],["p","如果我們只罵不禱告，就忘了這一點。"],["p","如果我們只求他們保護教會，也忘了這一點。"],["p","寫這封信的人，從前就是逼迫教會的罪魁。"],["p","神既然願意救一個罪魁，就沒有一個人在他的心意之外。"],["p","對講台上的人，這是一個很具體的檢查。"],["p","我們的主日禱告裡，為教會以外的人禱告，有幾句？"],["p","你上一次為一位鄰居、一位同事、一位在位的人禱告，是甚麼時候？"],["q","禱告的名單有多寬，這個家的門就有多寬。"],["p","可是我們憑甚麼可以為萬人禱告？"],["p","我們禱告的時候，為甚麼可以放心？"],["p","第五節的第一個字，就是答案：因為。"],["q","第二步：一位中保。"],["q","「因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌；」（2:5）"],["p","原文是兩個平行的「一」：εἷς γὰρ θεός，εἷς καὶ μεσίτης。"],["p","神是一位，中保也是一位。"],["p","一位神，所以他是萬人的神。一位中保，所以他是萬人的中保。"],["p","正因為只有一位，門才向所有的人開。"],["p","「中保」這個字，μεσίτης，意思就是站在中間的人。"],["p","我們華人很懂這個字。做生意要有中間人，從前結婚要有媒人。"],["p","現在請你回到亞底米的廟前。祭司、占卜的、賣銀龕的，都在那裡。"],

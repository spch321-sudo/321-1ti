i</td><td>想要作律法教師</td><td>病根在「想要」</td></tr><tr><td>διαβεβαιοῦνται</td><td>diabebaiountai</td><td>斷言、說得斬釘截鐵</td><td>越不懂，越肯定</td></tr></table>","gram":"<p>ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν（hōn tines astochēsantes exetrapēsan eis mataiologian）。ὧν（hōn） 指 1:5 的三個源頭——他們偏離的不是某條教義，而是清潔的心、無虧的良心、無偽的信心。ἀστοχέω（astocheō） 是沒射中靶心，本卷再用在 6:21「偏離了真道」；ἐκτρέπω（ektrepō） 是轉向岔路，同一個字 5:15、6:20 也用。</p><p>θέλοντες εἶναι νομοδιδάσκαλοι（thelontes einai nomodidaskaloi）：νομοδιδάσκαλος（nomodidaskalos） 在新約只有三次，另外兩次指法利賽人中的律法教師（路 5:17；徒 5:34 的迦瑪列）。μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται（mē noountes mēte ha legousin mēte peri tinōn diabebaiountai） 用兩個 μήτε（mēte） 收緊：自己講的不懂，講的對象也不懂，卻 διαβεβαιοῦνται（diabebaiountai），說得斬釘截鐵。</p>","exp":"<p>「有人偏離這些，反去講虛浮的話」（1:6）。偏離是一點一點的。箭差一度射出去，近看沒事，遠了就離靶很遠。這些人一開始也許只是對家譜有興趣；可是心不再清潔、良心不再無虧，興趣就變成了舞台。</p><p>「想要作教法師，卻不明白自己所講說的所論定的」（1:7）。病根在「想要」兩個字。他們要的是教師的位子，不是被真理教導。所以越不懂，越要講得肯定；肯定的語氣，用來遮蓋裡面的空。</p><p>這一節是給每一個站上講台的人的鏡子，包括寫講義的人。講得肯定不等於講得對；能不能說「這一處我不確定」，常常是一個教師有沒有被真理管住的記號。本講義遇到爭議處先陳列各家，就是要守這一條。</p><p>回頭看 1:5，這兩節其實是一張診斷書：射偏的不是頭腦，是心。所以矯正的方法也不是多讀幾本書，而是回到那三個源頭——讓心再被潔淨，讓良心再被聽見，讓信心不再需要演給人看。</p>"},{"a":8,"z":8,"star":1,"grk":"<p lang=\"grc\">Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,</p>","lit":"<p>而我們知道律法是好的，若有人合乎律法地使用它，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καλὸς ὁ νόμος</td><td>kalos ho nomos</td><td>律法是好的</td><td>「美好」追蹤線第一站</td></tr><tr><td>νομίμως χρῆται</td><td>nomimōs chrētai</td><td>合乎律法地使用</td><td>νόμος 與 νομίμως 的雙關</td></tr></table>","gram":"<p>Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται（Oidamen de hoti kalos ho nomos ean tis autō nomimōs chrētai）。保羅用 Οἴδαμεν（Oidamen）「我們知道」起頭，把讀者拉到同一邊：這是共識，不是新說法。καλός（kalos） 是本卷最愛用的形容詞之一，「美好」的追蹤線從這裡開始，1:18 的「美好的仗」是第二站。</p><p>句子裡有一個字的遊戲：νόμος（nomos） 是律法，νομίμως（nomimōs） 是「合乎律法地」。直譯是「律法是好的，只要人合律法地用律法」。律法本身也規定了它的用途；用錯了，就連律法也違背了。這使我們想起羅 7:12：「律法是聖潔的，誡命也是聖潔、公義、良善的」（羅 7:12）。</p>","exp":"<p>「我們知道律法原是好的，只要人用得合宜」（1:8）。保羅剛批評了想作教法師的人，馬上補一句，免得人以為他反對律法。問題從來不在律法，在用律法的手。</p><p>一把手術刀是好的，在醫生手裡救人，在別人手裡就會傷人。假教師把律法拿來作家譜的材料、辯論的武器，那就是用得不合宜。律法是要叫人知罪、領人到基督面前，不是拿來證明自己比別人懂。</p><p>321 說「聖經是我的準則」。這一節加了一個條件：準則要用得合宜。聖經不是拿來打人的棍子，也不是拿來炫耀的收藏；它先是照自己的鏡子，然後才是扶別人的手。一個人用經文時，若總是指向別人，從不指向自己，就該停下來問：我用得合宜嗎？</p><p>這一節也擋住了另一邊的錯。有人以為恩典來了，律法就作廢了；保羅卻說它「原是好的」。恩典不是取消標準，是給人力量走在標準裡。</p>"},{"a":9,"z":11,"star":3,"grk":"<p lang=\"grc\">εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,</p><p lang=\"grc\">πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,</p><p lang=\"grc\">κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.</p>","lit":"<p>知道這一點：律法不是為義人而設立的，而是為不法的和不服的、不敬虔的和罪人、不聖潔的和褻俗的、打父親的和打母親的、殺人的，</p><p>淫亂的、與男人同寢的男人、拐賣人口的、說謊的、起假誓的，以及若還有別的與健康的教訓相對抗的事，</p><p>照著那可稱頌之神的榮耀的福音，就是我被託付的那福音。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δικαίῳ νόμος οὐ κεῖται</td><td>dikaiō nomos ou keitai</td><td>律法不是為義人而設立</td><td>κεῖται：法律條文「擺在那裡」</td></tr><tr><td>πατρολῴαις καὶ μητρολῴαις</td><td>patrolōais kai mētrolōais</td><td>打父親的和打母親的</td><td>第五誡的反面</td></tr><tr><td>ἀρσενοκοίταις</td><td>arsenokoitais</td><td>與男人同寢的男人</td><td>和合本「親男色的」</td></tr><tr><td>ἀνδραποδισταῖς</td><td>andrapodistais</td><td>拐賣人口的</td><td>第八誡的極端形式</td></tr><tr><td>τῇ ὑγιαινούσῃ διδασκαλίᾳ</td><td>tē hygiainousē didaskalia</td><td>健康的教訓</td><td>和合本「正道」</td></tr><tr><td>ὃ ἐπιστεύθην ἐγώ</td><td>ho episteuthēn egō</td><td>我被託付的</td><td>託付的鏈子從這裡接上</td></tr></table>","gram":"<p><strong>一張照著十誡排的清單。</strong>εἰδὼς τοῦτο（eidōs touto）, ὅτι δικαίῳ νόμος οὐ κεῖται（hoti dikaiō nomos ou keitai）。κεῖται（keitai） 是「被擺放、被設立」，法律條文「立在那裡」的說法。δικαίῳ（dikaiō） 是誰？三種讀法：①已經在基督裡稱義的人——律法不是他稱義的途徑；②一般意義上守法的好人——法律本來就不是為守法的人寫的；③律法不是「針對」義人的。從下文的清單看，保羅說的是律法定罪、約束的功用，它的鋒刃是向著不法的人；本講義取①②合讀：律法的刀口不是對著活在恩典中、按愛行事的人。</p><p>清單的次序很有意思。前三對 ἀνόμοις δὲ καὶ ἀνυποτάκτοις（anomois de kai anypotaktois）, ἀσεβέσι καὶ ἁμαρτωλοῖς（asebesi kai hamartōlois）, ἀνοσίοις καὶ βεβήλοις（anosiois kai bebēlois） 對應十誡的頭一塊版：對神不服、不敬、褻慢聖物。然後換成單項，正好照十誡第五到第九條走：第五條孝敬父母，對應 πατρολῴαις καὶ μητρολῴαις（patrolōais kai mētrolōais），字面是「打父親的、打母親的」，比「殺」更寬；第六條不可殺人，對應 ἀνδροφόνοις（androphonois）；第七條不可姦淫，對應 πόρνοις（pornois） 與 ἀρσενοκοίταις（arsenokoitais）；第八條不可偷盜，對應 ἀνδραποδισταῖς（andrapodistais）——猶太傳統把偷人當作最重的偷，這使我們想起出 21:16；第九條不可作假見證，對應 ψεύσταις（pseustais） 與 ἐπιόρκοις（epiorkois）。這使我們想起出 20:12--16。</p><blockquote><p>ἀρσενοκοίταις（arsenokoitais） 由「男人」與「床、同寢」兩個字根合成，在現存文獻中最早見於林前 6:9（ἀρσενοκοῖται（arsenokoitai））與本節。多數學者認為它是從七十士譯本利未記的用語組成的——利 18:22、20:13 把 ἄρσενος（arsenos） 和 κοίτην（koitēn） 放在一起。另一派主張它只指剝削性的關係（如成人對少年、男妓）。從利未記的字源與十誡第七條的位置看，本講義採前者：它指男性之間的性行為，剝削的形式包括在內，但不止於此。要注意的是：這是一個描述行為的字，不是描述一個人的身分或傾向；它在清單裡和「說謊的」並列。本系列哥林多前書講義第 6 章已有完整處理，本卷沿用。</p></blockquote><p>καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται（kai ei ti heteron tē hygiainousē didaskalia antikeitai）：ὑγιαίνω（hygiainō） 是醫學用語「健康」，教牧書信獨有的說法；6:4 假教師正好相反，是 νοσῶν（nosōn），「害病的」。ἕτερον（heteron） 又是 1:3 那個「別的」。1:11 的 ὃ ἐπιστεύθην ἐγώ（ho episteuthēn egō） 把 ἐγώ（egō） 放在句末強調：這福音「是交託給我的」。</p>","exp":"<p>「因為律法不是為義人設立的，乃是為不法和不服的……弒父母和殺人的」（1:9）。一張清單讀起來令人不安，這正是它的用意。律法像一面照出黑暗的燈：它照的不是想像出來的罪，是家裡、街上真實發生的事——打父母、殺人、拐賣人口、作偽證。</p><p>保羅沒有發明新的道德，他照著十誡走。假教師用律法玩家譜，保羅把律法拿回它原來的位置：照出人怎樣對待神，又怎樣對待人。本系列出埃及記講義第 20 章講過十誡兩塊版的結構，這裡等於把第二塊版倒過來唸了一次。主耶穌說，全律法都掛在愛神愛人兩條上；保羅也說，「愛就完全了律法」（羅 13:10）。所以這張清單和 1:5 的「愛」是一體的：每一項，都是愛的反面。</p><p>「行淫和親男色的，搶人口和說謊話的，並起假誓的」（1:10）。讀到「親男色的」，教會常有兩種失誤：一種是跳過去不講，一種是只講這一項，講得特別大聲。經文兩樣都不容許。它清楚說這種行為與健康的教訓相抵觸，不可迴避；它也把這一項放在「說謊話的」旁邊，沒有任何一個坐在會眾裡的人可以置身事外。哥林多前書接著說「你們中間也有人從前是這樣」（林前 6:11）——同一位神洗淨了每一種人。所以教會可以清楚說這是罪，卻不可以把任何人當作笑話、標籤或敵人；面對有同性吸引掙扎的弟兄姊妹，要陪伴，不要羞辱。</p><p>「或是為別樣敵正道的事設立的」（1:10）。「正道」原文是「健康的教訓」。真理是有營養的，吃了人會健康；假教訓吃起來有味道，卻叫人害病——6:4 說他們「專好問難」，病就在那裡。「這是照著可稱頌之神交託我榮耀福音說的」（1:11）。最後，保羅把律法放進福音裡：判斷是非的標準，終究是「榮耀的福音」。一講到「交託我」，他就停不下來了，下一段要講這個「我」是誰。</p>"},{"a":12,"z":14,"star":2,"grk":"<p lang=\"grc\">Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,</p><p lang=\"grc\">τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,</p><p lang=\"grc\">ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>我向那給我能力的基督耶穌我們的主存著感謝，因為他算我是忠心的，把我放進服事裡，</p><p>我從前是褻瀆的、逼迫的、施暴的；然而我被憐憫了，因為我是在不知道中、在不信裡做的，</p><p>而我們主的恩典滿溢再滿溢，帶著那在基督耶穌裡的信心和愛。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τῷ ἐνδυναμώσαντί με</td><td>tō endynamōsanti me</td><td>那給我能力的</td><td>不定過去式：在一個時刻給了</td></tr><tr><td>πιστόν με ἡγήσατο</td><td>piston me hēgēsato</td><td>他算我是忠心的</td><td>主的判斷，不是保羅的履歷</td></tr><tr><td>βλάσφημον καὶ διώκτην καὶ ὑβριστήν</td><td>blasphēmon kai diōktēn kai hybristēn</td><td>褻瀆的、逼迫的、施暴的</td><td>對神、對人、到暴力</td></tr><tr><td>ἠλεήθην</td><td>ēleēthēn</td><td>我被憐憫了</td><td>被動語態：動手的是神</td></tr><tr><td>ὑπερεπλεόνασεν</td><td>hyperepleonasen</td><td>滿溢再滿溢</td><td>新約僅此一次</td></tr></table>","gram":"<p>Χάριν ἔχω τῷ ἐνδυναμώσαντί με（Charin echō tō endynamōsanti me）：「我存著感謝」，在書信中段而不是開頭，表示感恩是從 1:11「交託我」自然湧出來的。ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν（hoti piston me hēgēsato themenos eis diakonian）：ὅτι（hoti） 交代感謝的理由，不是說主看中保羅的忠心才揀選他，而是主「算」他為可信的，並 θέμενος（themenos）「安放」他到服事裡。這和 1:13 對讀就清楚：被算為忠心的，是一個過去最不忠的人。</p><p>τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν（to proteron onta blasphēmon kai diōktēn kai hybristēn） 三個名詞一層比一層重：βλάσφημος（blasphēmos） 是對神說褻瀆的話，διώκτης（diōktēs） 是逼迫者，ὑβριστής（hybristēs） 是施暴、羞辱人的人。保羅在使徒行傳自己說過：「強逼他們說褻瀆的話，又分外惱恨他們」（徒 26:11）。</p><blockquote><p>ἀλλὰ ἠλεήθην（alla ēleēthēn）, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ（hoti agnoōn epoiēsa en apistia）。ὅτι（hoti） 是不是說「因為我不知道，所以減輕了罪」？一說是：舊約分辨誤犯的罪與擅敢的罪（民 15:27--30），無知的罪有獻祭的路；一說不是：保羅不是在替自己減刑，而是說明他當時的狀態——在不信中，看不見。本講義的判斷：ὅτι（hoti） 交代的是憐憫臨到的處境，不是憐憫的理由；理由在 1:14 的恩典。主在十字架上也說「他們所做的，他們不曉得」（路 23:34）——無知不使人無罪，卻使人仍在赦免可及之處。</p></blockquote><p>ὑπερεπλεόνασεν δὲ ἡ χάρις（hyperepleonasen de hē charis）：ὑπερπλεονάζω（hyperpleonazō） 是「滿溢」再加上「超過」的字首，新約僅此一次。保羅的字典不夠用，只好造一個疊上去的字；這使我們想起羅 5:20 的 ὑπερεπερίσσευσεν（hypereperisseusen）。</p>","exp":"<p>「我感謝那給我力量的我們主基督耶穌，因他以我有忠心，派我服事他」（1:12）。保羅講到自己的職分，第一個反應是感謝。服事對他不是權利，是一份不該落到他頭上的禮物。</p><p>「我從前是褻瀆神的，逼迫人的，侮慢人的」（1:13）。三個詞，一個比一個近：先是嘴巴，然後是行動，最後是動手羞辱。保羅沒有修飾過去，也沒有細說它；他只是把它放在主的恩典旁邊，讓恩典顯得大。一個人能平靜地說出自己的過去，通常是因為他已經被比過去更大的東西接住了。</p><p>「然而我還蒙了憐憫，因我是不信不明白的時候而做的」（1:13）。這不是藉口，是誠實：我那時真的看不見。很多人今天仍在那個看不見的地方——他們反對福音，不是因為看清了，而是還沒看見。保羅的見證叫我們對這樣的人多一份耐心。</p><p>「並且我主的恩是格外豐盛」（1:14）。保羅帶著罪的帳本來，恩典不是剛好抵銷，是滿出來、還再滿出來。恩典也不是空著手來：「使我在基督耶穌裡有信心和愛心」。逼迫者的信心和愛心不是自己長的，是恩典帶進來的。</p><p>這三節放在 1:3--11 之後，是有意的。保羅剛剛嚴厲地講完律法要對付的人，馬上說：我就是那樣的人。定別人罪的人，自己先站在被赦免的行列裡。</p>"},{"a":15,"z":15,"star":3,"grk":"<p lang=\"grc\">πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,</p>","lit":"<p>這話是可信的，配得完全的接納：基督耶穌來到世上，為要拯救罪人——在他們當中，第一個是我。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πιστὸς ὁ λόγος</td><td>pistos ho logos</td><td>這話是可信的</td><td>教牧書信五句可信的話之首</td></tr><tr><td>πάσης ἀποδοχῆς ἄξιος</td><td>pasēs apodochēs axios</td><td>配得完全的接納</td><td>和合本「十分可佩服的」</td></tr><tr><td>ἦλθεν εἰς τὸν κόσμον</td><td>ēlthen eis ton kosmon</td><td>來到世上</td><td>從哪裡來？先存在</td></tr><tr><td>ἁμαρτωλοὺς σῶσαι</td><td>hamartōlous sōsai</td><td>拯救罪人</td><td>目的不定詞：來，是為了救</td></tr><tr><td>πρῶτός εἰμι ἐγώ</td><td>prōtos eimi egō</td><td>第一個是我</td><td>現在式：我是，不是我從前是</td></tr></table>","gram":"<p><strong>πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος（pistos ho logos kai pasēs apodochēs axios）。</strong>「這話是可信的」是教牧書信獨有的引句公式，共五次（1:15；3:1；4:9；提後 2:11；多 3:8），像是初代教會口傳的信仰短句，保羅蓋上印章。本節是第一句，也是最核心的一句：Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι（Christos Iēsous ēlthen eis ton kosmon hamartōlous sōsai）。ἦλθεν εἰς τὸν κόσμον（ēlthen eis ton kosmon） 暗含基督在降世以前已經存在；ἁμαρτωλοὺς σῶσαι（hamartōlous sōsai） 的不定詞說明來的目的。</p><p>ὧν πρῶτός εἰμι ἐγώ（hōn prōtos eimi egō） 有兩個要點。第一，<strong>εἰμι（eimi） 是現在式</strong>。1:13 講過去，用的是 τὸ πρότερον ὄντα（to proteron onta）「從前是」；到這裡保羅沒有寫 ἤμην（ēmēn）「我從前是」，而寫 εἰμι（eimi）「我是」。第二，ἐγώ（egō） 放在句末，與 1:11 ὃ ἐπιστεύθην ἐγώ（ho episteuthēn egō） 呼應：被託付福音的那個「我」，就是罪人中第一個的那個「我」。</p><blockquote><p>πρῶτος（prōtos） 是甚麼意思？三種讀法：①程度——最壞的罪人，誇張的謙卑；②次序——在時間上第一個，但保羅顯然不是第一個得救的人，此讀較弱；③典型——「頭號樣本」，與 1:16 ἐν ἐμοὶ πρώτῳ（en emoi prōtō） 呼應：主在這第一個人身上展示忍耐。本講義採①與③合讀：保羅真心認為自己罪最重（這使我們想起弗 3:8「比眾聖徒中最小的還小」），而正因為最重，他成了恩典的展示樣本。現在式說的是他站立的位置，不是他的身分還停在舊人（林後 5:17）。</p></blockquote>","exp":"<p>「『基督耶穌降世，為要拯救罪人。』這話是可信的，是十分可佩服的」（1:15）。一封談教會秩序的信，第一塊基石不是組織，是福音。監督、執事、寡婦、長老，都要等到第 3、5 章；先放下的，是一句所有人都聽得懂的話：基督來，是為救罪人。神的家是一群蒙了憐憫的罪人住的地方。這是全卷主軸的第二站：恩典先於職分。</p><p>「在罪人中我是個罪魁」（1:15）。保羅寫這話時已經作使徒三十年，建立了半個地中海的教會。他沒有說「我從前是罪魁」，他說「我是」。這不是自我貶低的習慣，也不是說他沒有改變；他在別處說得清楚，在基督裡「他就是新造的人」（林後 5:17）。現在式說的是：他從來沒有離開過那個蒙恩的位置。越靠近光的人，越看得見自己身上的灰塵。</p><p>這一點對帶領的人特別要緊。一個認為自己已經「不太需要恩典」的領袖，很快就會用規矩壓人；一個每天記得自己是罪魁的領袖，執行 1:3 的囑咐時，會帶著 1:5 的愛。321 說的出路是「謙卑，回到本位」——本位就在這裡：我是罪人，他是救主。</p><p>但這一節不可以被用成另一種壓迫。有人聽了「罪魁」，就以為信主多年仍要天天活在自責裡。保羅的現在式不是自我定罪，下一節馬上接「然而，我蒙了憐憫」。罪魁和蒙憐憫要一起唸，缺一半都不是福音。約翰也這樣講：「我們若說自己無罪，便是自欺……我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（約壹 1:8--9）。</p>"},{"a":16,"z":16,"star":2,"grk":"<p lang=\"grc\">ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται Χριστὸς Ἰησοῦς τὴν ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπʼ αὐτῷ εἰς ζωὴν αἰώνιον.</p>","lit":"<p>然而正因為這個緣故我被憐憫，好叫基督耶穌在我這第一個人身上，顯明他全部的忍耐，作為那些將要信靠他、得永生之人的草圖。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὰ τοῦτο ἠλεήθην</td><td>dia touto ēleēthēn</td><td>正因這緣故我被憐憫</td><td>憐憫有目的</td></tr><tr><td>ἐν ἐμοὶ πρώτῳ</td><td>en emoi prōtō</td><td>在我這第一個人身上</td><td>接 1:15 的「第一」</td></tr><tr><td>τὴν ἅπασαν μακροθυμίαν</td><td>tēn hapasan makrothymian</td><td>全部的忍耐</td><td>μακροθυμία：長長的氣</td></tr><tr><td>πρὸς ὑποτύπωσιν</td><td>pros hypotypōsin</td><td>作為草圖</td><td>模子是主的忍耐</td></tr></table>","gram":"<p>ἀλλὰ διὰ τοῦτο ἠλεήθην（alla dia touto ēleēthēn）, ἵνα（hina）……：ἀλλά（alla） 把 1:15 的「罪魁」翻過來，διὰ τοῦτο（dia touto） 與 ἵνα（hina） 指出憐憫的目的。ἠλεήθην（ēleēthēn） 在 1:13 已出現一次，這裡再說，帶出更遠的目標：不只是保羅得救，是為了後來的人。</p><p>ἐνδείξηται Χριστὸς Ἰησοῦς τὴν ἅπασαν μακροθυμίαν（endeixētai Christos Iēsous tēn hapasan makrothymian）：主詞是基督，不是保羅；要顯明的是基督的 μακροθυμία（makrothymia）——「長的氣」，不輕易發怒的忍耐，ἅπασαν（hapasan） 強調「全部的」，一點不保留。</p><blockquote><p>πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπʼ αὐτῷ（pros hypotypōsin tōn mellontōn pisteuein ep' autō）：ὑποτύπωσις（hypotypōsis） 是畫家下筆前的素描、建築的草圖，新約只在這裡和提後 1:13。保羅是一張「樣稿」：後來的人看他，就知道主的忍耐可以伸到多遠。注意草圖畫的是主的忍耐，不是保羅的成就。</p></blockquote>","exp":"<p>「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐」（1:16）。保羅的得救有一個公開的用途：作展示品。神把最難的案例放在櫥窗最前面，好叫每一個經過的人都說：連他都可以，我也可以。</p><p>「給後來信他得永生的人作榜樣」（1:16）。這裡的榜樣是一張草圖，畫的是主的忍耐。所以讀這一段，會眾記得的不該是保羅多麼了不起，而是主對保羅多麼有耐心。我們佩服保羅，卻要更愛那一位。</p><p>321 說「耶穌是我的榜樣」。這一節把這句話接得很準：保羅成為榜樣，不是因為他把耶穌學得很像，而是因為耶穌在他身上忍耐到底。我們向別人作見證，也是同一種樣稿——不是展示我多好，是展示他多能忍。這給每一個覺得自己「太糟了」的人一扇門：你不是例外，你可能正是那張草圖要畫的人。</p><p>「一切的忍耐」也是給教會的功課。神對保羅忍耐了那麼久，教會對還在路上的人也要有同樣長的氣。今天在會堂外面反對福音的人，也許就是明天站在講台上說「我蒙了憐憫」的人。1:20 保羅交出許米乃和亞歷山大的時候，心裡記得的就是這一節。</p>"},{"a":17,"z":17,"star":3,"grk":"<p lang=\"grc\">τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.</p>","lit":"<p>而歸給諸世代的君王、不朽壞的、不可見的、獨一的神：尊貴和榮耀，直到諸世代的世代。阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τῷ βασιλεῖ τῶν αἰώνων</td><td>tō basilei tōn aiōnōn</td><td>諸世代的君王</td><td>和合本「永世的君王」</td></tr><tr><td>ἀφθάρτῳ</td><td>aphthartō</td><td>不朽壞的</td><td>不會老、不會敗壞</td></tr><tr><td>ἀοράτῳ</td><td>aoratō</td><td>不可見的</td><td>人看不見，他卻看見人</td></tr><tr><td>μόνῳ θεῷ</td><td>monō theō</td><td>獨一的神</td><td>RP 作「獨一智慧的神」</td></tr><tr><td>εἰς τοὺς αἰῶνας τῶν αἰώνων</td><td>eis tous aiōnas tōn aiōnōn</td><td>直到諸世代的世代</td><td>希伯來式最高級</td></tr></table>","gram":"<p><strong>一首突然唱出來的頌讚。</strong>τῷ δὲ βασιλεῖ τῶν αἰώνων（tō de basilei tōn aiōnōn）：δέ（de） 輕輕一轉，保羅從自己的見證直接轉向敬拜，中間沒有任何過渡。βασιλεὺς τῶν αἰώνων（basileus tōn aiōnōn）「諸世代的君王」是猶太會堂禱文的用語，意思是統管每一個時代的王。三個形容詞 ἀφθάρτῳ ἀοράτῳ μόνῳ θεῷ（aphthartō aoratō monō theō） 排成一串，全用與格，最後一齊交出 τιμὴ καὶ δόξα（timē kai doxa）。</p><p>◆ <strong>經文鑑別</strong>：SBLGNT、WH、Treg、NA28 都作 μόνῳ θεῷ（monō theō）「獨一的神」，和合本照此譯；拜占庭傳統的 RP 作 μόνῳ σοφῷ θεῷ（monō sophō theō）「獨一智慧的神」。兩種讀法陳列如下：①μόνῳ θεῷ（monō theō） 有最早、最好的抄本支持，也是較短的讀法；②σοφῷ（sophō） 很可能是抄寫者受羅 16:27「獨一全智的神」影響而補上的，把兩處頌讚抄得一致。本講義的判斷：採 μόνῳ θεῷ（monō theō），與和合本相同；兩讀在神學上沒有衝突，增補的「智慧」並不改變這首頌讚的重心——獨一。</p><blockquote><p>這首頌讚與 6:15--16 首尾呼應：那裡也有「獨一」、「不能看見」、「尊貴」、「阿們」。全卷三處頌讚（1:17；3:16；6:15--16），這是第一處。εἰς τοὺς αἰῶνας τῶν αἰώνων（eis tous aiōnas tōn aiōnōn） 用「世代的世代」表達最高級，與開頭的 τῶν αἰώνων（tōn aiōnōn） 前後扣住：他是每一個世代的王，他的榮耀也延到每一個世代。</p></blockquote>","exp":"<p>「但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！」（1:17）保羅講到自己是罪魁、蒙了憐憫，講不下去了，就唱起來。這是全卷地勢圖第一座高峰。神學走到盡頭，自然就是讚美；一個真正明白恩典的人，講著講著就會停下來敬拜。</p><p>「永世的君王」。以弗所城裡有皇帝的神廟，也有亞底米大廟（徒 19:27）；皇帝會死、會換，神廟會倒。保羅給以弗所人的是另一位王：每個世代換了誰掌權，他都還在位。321 說「讓耶穌作王」——這位王不必靠選票，也不怕被取代。</p><p>「不能朽壞、不能看見」。人看不見神，「從來沒有人看見神，只有在父懷裡的獨生子將他表明出來」（約 1:18）。看不見的神，在一個罪魁身上被看見了——1:16 說他的忍耐在保羅身上「顯明」。這首頌讚和前一節是連在一起的：看不見的王，用憐憫讓人看見他。</p><p>「獨一的神」。以弗所有眾神，有人敬拜皇帝，有人敬拜女神，有人在家譜裡找靈界的層級。保羅一句話就收掉：只有一位。所以「尊貴、榮耀」只有一個去處。321 說「讓耶穌得一切榮耀」：保羅在這裡做的，正是把剛才講自己的故事所可能得到的一切稱讚，全數轉交給王。</p><p>這一節不是過門。讀到這裡，講台和會眾都要停下來；一個講教會秩序的書卷，在第一章就先教會我們敬拜。秩序若不是從敬拜流出來的，就只剩下管理。</p><p>頌讚的次序也值得注意：先有 1:15 的「罪魁」，再有 1:17 的「阿們」。人越清楚自己是誰，越清楚神是誰；謙卑和敬拜是同一件事的兩面。</p>"},{"a":18,"z":19,"star":3,"grk":"<p lang=\"grc\">Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,</p><p lang=\"grc\">ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·</p>","lit":"<p>這囑咐，我交託給你，孩子提摩太，照著那些先前指向你的預言，好叫你在其中打那美好的戰役，</p><p>持守信心和良善的良心；這良心，有些人把它推開了，在信心的事上就觸礁沉船了；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ταύτην τὴν παραγγελίαν</td><td>Tautēn tēn parangelian</td><td>這囑咐</td><td>接回 1:3、1:5</td></tr><tr><td>παρατίθεμαί σοι</td><td>paratithemai soi</td><td>我交託給你</td><td>與 6:20 παραθήκην 同字根框住全卷</td></tr><tr><td>τὰς προαγούσας ἐπὶ σὲ προφητείας</td><td>tas proagousas epi se prophēteias</td><td>先前指向你的預言</td><td>這使我們想起 4:14</td></tr><tr><td>τὴν καλὴν στρατείαν</td><td>tēn kalēn strateian</td><td>美好的戰役</td><td>同源受詞：打仗打的是仗</td></tr><tr><td>ἀπωσάμενοι</td><td>apōsamenoi</td><td>推開了</td><td>中間語態：自己動手推開</td></tr><tr><td>ἐναυάγησαν</td><td>enauagēsan</td><td>觸礁沉船了</td><td>全卷地勢最低點</td></tr></table>","gram":"<p>Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι（Tautēn tēn parangelian paratithemai soi）：「這囑咐」放在句首，回到 1:3、1:5 的 παραγγελία（parangelia）——主軸繞了一圈回來。παρατίθημι（paratithēmi） 是把貴重物品存放在別人那裡的字，6:20 的 παραθήκην（parathēkēn）「所託付你的」是同一個字根，把整卷書框成一個交託。τέκνον Τιμόθεε（teknon Timothee） 再一次叫「孩子」，接回 1:2。</p><p>κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας（kata tas proagousas epi se prophēteias）：提摩太被按立時有過預言（4:14「藉著預言、在眾長老按手的時候」），ἵνα στρατεύῃ ἐν αὐταῖς（hina strateuē en autais）——「在那些預言裡」打仗。預言不是讓他驕傲的頭銜，是他在艱難時可以穿上的盔甲。στρατεύῃ（strateuē）……τὴν καλὴν στρατείαν（tēn kalēn strateian） 是同源受詞，「戰役之戰」；這是軍事的圖像，和 6:12 ἀγωνίζου τὸν καλὸν ἀγῶνα（agōnizou ton kalon agōna） 競技場的圖像相映。</p><blockquote><p>ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν（echōn pistin kai agathēn syneidēsin）, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν（hēn tines apōsamenoi peri tēn pistin enauagēsan）。關係代名詞 ἥν（hēn） 是單數陰性，指的是良心：他們推開的是良心。ἀπωσάμενοι（apōsamenoi） 是中間語態，不是不小心掉了，是自己用力推開。περὶ τὴν πίστιν（peri tēn pistin） 的 πίστιν（pistin） 有冠詞，偏重「所信的道」。ναυαγέω（nauageō） 由「船」與「打碎」兩個字根合成；保羅自己就「遇著船壞三次」（林後 11:25），用的正是 ἐναυάγησα（enauagēsa），他知道沉船是甚麼滋味。</p></blockquote><p>這是不是說信徒會失去救恩？各家立場：①真實的離道，救恩可以失去；②這些人從來沒有真正得救；③信仰生命受了重創，但仍在可挽回之處。經文本身說的是警告是真的、船是真的破了；而 1:20 保羅仍以「受責罰」為目的，說明他沒有把這兩個人當作已經沉到海底的。教義上的完整討論留在本章議題頁。</p>","exp":"<p>「我兒提摩太啊，我照從前指著你的預言，將這命令交託你」（1:18）。父親把家傳的東西交到兒子手裡，叮嚀他好好保管。保羅交託的不是財產，是一道命令，命令的目的是愛（1:5）。全卷的接力在這裡開始：主交給保羅（1:11），保羅交給提摩太，提摩太還要交下去。</p><p>「叫你因此可以打那美好的仗」（1:18）。年輕的提摩太在以弗所，對手是一群想作教法師、說話斬釘截鐵的人。保羅提醒他：你被差來時有過預言，那些話是你的裝備。在灰心、被看輕的日子，回頭去記得神曾怎樣呼召你；那不是為了誇口，是為了站得住。這場仗是「美好的」——不是因為打起來輕鬆，是因為為之而打的那一位是美好的。</p><p>「常存信心和無虧的良心」（1:19）。兩樣一起帶上船：信心是方向，良心是船身。只有方向沒有船身，再對的航線也會沉。良心不是一次壞掉的，是一次又一次把它推開：這一次就算了，下一次也沒關係。推久了，聲音就小了，終於聽不見了（4:2）。</p><p>「有人丟棄良心，就在真道上如同船破壞了一般」（1:19）。這是全卷地勢的最低點。保羅自己在海上經過三次船難，知道船破的那一刻是甚麼光景：不是慢慢漏水，是一聲巨響，船身裂開。教會裡有些崩塌也是這樣，外面看來突然，裡面其實已經推開良心很久了。這一節是給所有站在講台上的人的警告，也包括最有恩賜的人；越在前面的船，撞上暗礁時沉得越多人。</p>"},{"a":20,"z":20,"star":3,"grk":"<p lang=\"grc\">ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.</p>","lit":"<p>其中有許米乃和亞歷山大，我已經把他們交給撒但，好叫他們被管教，不再褻瀆。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὑμέναιος καὶ Ἀλέξανδρος</td><td>Hymenaios kai Alexandros</td><td>許米乃和亞歷山大</td><td>1:3 的「某些人」終於有了名字</td></tr><tr><td>παρέδωκα τῷ Σατανᾷ</td><td>paredōka tō Satana</td><td>我交給撒但</td><td>逐出教會的保護</td></tr><tr><td>ἵνα παιδευθῶσι</td><td>hina paideuthōsi</td><td>好叫他們被管教</td><td>παιδεύω：教養孩子</td></tr><tr><td>μὴ βλασφημεῖν</td><td>mē blasphēmein</td><td>不再褻瀆</td><td>目的是回轉，不是毀滅</td></tr></table>","gram":"<p>ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος（hōn estin Hymenaios kai Alexandros）：1:3 的 τισὶν（tisin） 到這裡才點名。許米乃又見於提後 2:17--18，說「復活的事已過」；亞歷山大是常見的名字，提後 4:14 有「銅匠亞歷山大」，徒 19:33 以弗所騷亂中也有一個亞歷山大。三者是否同一人，學者意見不一：同在以弗所是一說，名字太常見、身分線索不足是另一說。本講義並陳，不強作認定。</p><p>οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν（hous paredōka tō Satana hina paideuthōsi mē blasphēmein）：παρέδωκα（paredōka） 是不定過去式，一次的決定；後面的 ἵνα（hina） 子句交代目的，目的是 παιδευθῶσι（paideuthōsi）——παιδεύω（paideuō） 從「孩子」這個字來，是父親管教兒女、老師訓練學生的字，不是刑罰或報復的字。整句的重心在 ἵνα（hina） 之後：交出去，是為了他們不再褻瀆，是為了挽回。</p><blockquote><p>「交給撒但」是甚麼意思？各家：①逐出教會——把人放回教會保護之外、撒但仍在作工的世界，讓他經歷離開神家的後果；②使徒宣告某種身體上的懲罰；③兩者兼有。林前 5:5 的平行最清楚：「要把這樣的人交給撒但，敗壞他的肉體，使他的靈魂在主耶穌的日子可以得救」，那裡的目的也是得救；又見林前 5:13「把那惡人從你們中間趕出去」。本講義採①：這是教會紀律的最後一步，目的是使他回轉，與趕鬼、詛咒無關。</p></blockquote>","exp":"<p>〔林前〕林前 5:1--5（哥林多前書講義第 5 章）</p><p>本系列哥林多前書講義第 5 章講過哥林多那一件事：一個人與繼母同居，教會卻自高自大。保羅說要把這樣的人交給撒但，目的是「使他的靈魂在主耶穌的日子可以得救」。這裡同樣交給撒但，目的同樣是挽回：「使他們受責罰就不再謗瀆了」（1:20）。保羅兩次講到最重的紀律，兩次都把目的寫在同一句話裡；讀這一節，不可以只讀前半句。</p><p>「其中有許米乃和亞歷山大；我已經把他們交給撒但」（1:20）。這是保羅在以弗所最後的手段，不是第一個反應。前面有 1:3 的囑咐、有勸、有等待。教會紀律有次序：先私下指出，再帶人同去，最後才告訴教會（太 18:15--17）；目的始終是「用溫柔的心把他挽回過來」（加 6:1）。直接跳到最後一步，就違背了這一步的精神。</p><p>「使他們受責罰就不再謗瀆了」（1:20）。「受責罰」原文是教養孩子的字。父親管教兒子，不是要他消失，是要他回家。所以交給撒但不可以變成三件事：不可以是當眾羞辱、叫人難堪；不可以是逐出之後的冷暴力，見面不打招呼、家人被孤立；更不可以和趕鬼、咒詛連在一起，好像教會可以咒人。哥林多後書記下了那次紀律的後續：「倒不如赦免他，安慰他，免得他憂愁太過，甚至沉淪了」（林後 2:7）。門是關上了，但燈要一直亮著，路也要一直鋪著，讓回頭的人找得到。</p><p>第 1 章收在一個令人沉重的地方：船破了，有人被交出去。可是整章其實是一條線：命令的目的是愛（1:5），罪魁蒙了憐憫（1:16），連最重的懲戒也是為了挽回（1:20）。保羅能這樣寫，是因為他自己就是那個褻瀆者——他曾是 1:13 的 βλάσφημον（blasphēmon），主沒有放棄他；所以他交出許米乃和亞歷山大的時候，心裡盼望的，是他們也有一天能說「我蒙了憐憫」。</p>"}],"2":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,</p>","lit":"<p>所以我勸，首先要為所有的人作祈求、禱告、代求、感謝，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Παρακαλῶ οὖν</td><td>Parakalō oun</td><td>所以我勸</td><td>οὖν 接回 1:18–20 的託付</td></tr><tr><td>πρῶτον πάντων</td><td>prōton pantōn</td><td>首先、一切之先</td><td>次序上的第一，不是時間上的第一</td></tr><tr><td>δεήσεις</td><td>deēseis</td><td>祈求（複數）</td><td>因缺乏而求</td></tr><tr><td>προσευχάς</td><td>proseuchas</td><td>禱告（複數）</td><td>向神的一般禱告</td></tr><tr><td>ἐντεύξεις</td><td>enteuxeis</td><td>代求（複數）</td><td>替別人到君王面前陳情</td></tr><tr><td>εὐχαριστίας</td><td>eucharistias</td><td>感謝（複數）</td><td>為人感謝，不只為事感謝</td></tr><tr><td>ὑπὲρ πάντων ἀνθρώπων</td><td>hyper pantōn anthrōpōn</td><td>為了所有的人</td><td>本章「萬」字的第一聲</td></tr></table>","gram":"<p><strong>Παρακαλῶ οὖν（Parakalō oun） 的 οὖν（oun） 把第 2 章接在第 1 章的託付後面。</strong>1:18 保羅把命令交託提摩太，叫他「打那美好的仗」；1:20 剛說完許米乃和亞歷山大。仗怎麼打？第一個動作不是開除、不是辯論，是禱告。πρῶτον πάντων（prōton pantōn） 可以讀成時間上的「首先」，也可以讀成重要性的「一切之先」；上下文是神的家該怎樣行（3:15），本講義取後者：禱告在家規的最前面。</p><p>四個名詞都是複數：δεήσεις（deēseis）、προσευχάς（proseuchas）、ἐντεύξεις（enteuxeis）、εὐχαριστίας（eucharistias）。釋經者常想替它們劃清界線：δεήσεις（deēseis） 是因缺乏而求，προσευχάς（proseuchas） 是向神的一般禱告，ἐντεύξεις（enteuxeis） 在蒲草紙文獻裡常指向君王遞的陳情書，εὐχαριστίας（eucharistias） 是感謝。另一派認為這是保羅的累積修辭，四字疊在一起，只是說「各樣的禱告」。本講義的判斷：字義的色彩可以講，卻不要把它做成四步驟的禱告技巧；重點是數量與範圍——各樣的禱告，為各樣的人。</p><blockquote><p>ποιεῖσθαι（poieisthai） 是中間語態，「為自己去作」，禱告是教會自己的事，不是外包的事。句尾 ὑπὲρ πάντων ἀνθρώπων（hyper pantōn anthrōpōn） 是全章的第一個「萬」：2:1 為萬人禱告，2:4 神願意萬人得救，2:6 基督作萬人的贖價。πάντων（pantōn） 這條線，是讀 2:1–7 的鑰匙。</p></blockquote>","exp":"<p>第 1 章的結尾很沉重：有人「在真道上如同船破壞了一般」（1:19）。換作我們，下一章大概要寫整頓、要寫規章。保羅寫的卻是：「我勸你，第一要為萬人懇求、禱告、代求、祝謝」（2:1）。<strong>神的家第一件事不是開會，是禱告。</strong>一個在風浪裡的教會，先跪下，再整理。</p><p>為甚麼是「萬人」？以弗所的假教訓講「無窮的家譜」（1:4），家譜是用來分你我的：誰的血統純、誰有資格、誰在圈內。禱告的範圍一放到萬人，圈子就破了。我們沒辦法一面為一個人代求，一面在心裡把他劃出神的恩典之外。</p><p>最容易漏掉的是最後一個字：祝謝。為人感謝，比為人代求更難。為一位難相處的同工代求還可以，為他感謝，就得先承認神在他身上也有工作。這正是 321 說的「謙卑帶動謙卑」：禱告的人先低下來，才看得見別人身上的恩典。</p><p>2:1 也是寫給全會眾聽的。這封信要在聚會中宣讀，所以這一節不是只對牧者說「你要多禱告」，是對整個家說：我們聚在一起，第一件事是為外面的人禱告。一個只為自己禱告的教會，門會越關越緊。</p><p>所以讀完這一節，可以問一個很具體的問題：我們上一次在聚會裡為教會以外的人禱告，是甚麼時候？為鄰居、為同事、為城裡的官長、為還不認識主的家人。禱告的名單有多寬，這個家的門就有多寬。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.</p><p lang=\"grc\">τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,</p>","lit":"<p>為君王們和一切在高位上的人，好叫我們可以過一個寧靜而安穩的生活，在一切敬虔和端莊之中。</p><p>這是好的，並且在我們的救主神面前是可悅納的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑπὲρ βασιλέων</td><td>hyper basileōn</td><td>為君王們</td><td>複數：皇帝與各地的王</td></tr><tr><td>τῶν ἐν ὑπεροχῇ ὄντων</td><td>tōn en hyperochē ontōn</td><td>那些在高位上的</td><td>總督、官長、一切掌權的</td></tr><tr><td>ἤρεμον καὶ ἡσύχιον βίον</td><td>ēremon kai hēsychion bion</td><td>寧靜而安穩的生活</td><td>ἡσύχιον 與 2:11–12 同字根</td></tr><tr><td>εὐσεβείᾳ</td><td>eusebeia</td><td>敬虔</td><td>全卷主追蹤第二站</td></tr><tr><td>σεμνότητι</td><td>semnotēti</td><td>端莊、可敬</td><td>叫人肅然起敬的樣子</td></tr><tr><td>καλὸν καὶ ἀπόδεκτον</td><td>kalon kai apodekton</td><td>好的、可悅納的</td><td>καλός 追蹤一站</td></tr><tr><td>τοῦ σωτῆρος ἡμῶν θεοῦ</td><td>tou sōtēros hēmōn theou</td><td>我們的救主神</td><td>救主是神，不是皇帝</td></tr></table>","gram":"<p><strong>ὑπὲρ βασιλέων（hyper basileōn） 是複數。</strong>保羅寫信的時候，羅馬只有一位皇帝，複數的「君王們」把皇帝、附庸王、各省總督都包進去；τῶν ἐν ὑπεροχῇ ὄντων（tōn en hyperochē ontōn） 再擴大到一切在高位上的人。當時這些人沒有一位是基督徒，有些後來還逼迫教會。保羅沒有附帶條件。</p><p>ἵνα（hina） 帶出目的：ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν（hina ēremon kai hēsychion bion diagōmen）。這個目的子句有兩讀：一讀是「為他們禱告，好叫他們治理得好，我們就能安居」；一讀是「為他們禱告的那群人，本身就過著安靜的生活」，禱告與生活一體。本講義兩讀合取：禱告求的是社會的平安，也塑造禱告者自己的樣子。目的落在 ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι（en pasē eusebeia kai semnotēti），不是落在政權的榮耀上。</p><blockquote><p>兩個字要記住。第一，ἡσύχιον（hēsychion） 與 2:11–12 的 ἐν ἡσυχίᾳ（en hēsychia） 同一個字根：「安靜」是保羅先向全教會要的，不是先向女人要的。第二，εὐσεβείᾳ（eusebeia） 是全卷主追蹤的第二站（1:9 是反面的「不虔誠」），敬虔先是教會在社會中的樣子，3:16 才翻到敬虔的源頭。2:3 的 τοῦτο（touto） 指為萬人禱告這件事；τοῦ σωτῆρος ἡμῶν θεοῦ（tou sōtēros hēmōn theou） 在羅馬帝國的處境裡很醒目：當時銘文常稱皇帝為「救主」，保羅為皇帝禱告，卻把「救主」這個稱號留給神。為在位者禱告，不等於敬拜在位者。</p></blockquote>","exp":"<p>「為君王和一切在位的，也該如此」（2:2）。這一節常被兩邊拿去用：有人用它要求基督徒擁護某個政權，有人嫌它太軟，不肯為不喜歡的領袖禱告。經文兩條路都不走。保羅寫信時，掌權的都是外邦人；他沒有先評價他們好不好，才決定要不要禱告。<strong>本講義不為任何當代政權背書，也不攻擊任何當代政權，不在講台評價任何國家的現任領袖；我們為職分禱告，也為坐在職分上的那個人禱告。</strong></p><p>禱告的目的寫得很清楚：「使我們可以敬虔、端正、平安無事地度日」（2:2）。教會求的不是特權，不是影響力，是一個能安靜過敬虔生活的空間。這使我們想起先知對被擄之民的吩咐：「你們要為那城求平安，為那城禱告耶和華」（耶 29:7）。神的百姓住在不屬於他們的城裡，仍然為那城的平安求。</p><p>再往下讀一節，理由更深：「他願意萬人得救，明白真道」（2:4）。為在位者禱告，不只是為了我們的安寧，是因為神也願意他們得救。坐在高位上的人，在神眼中也是一個需要救主的人。如果我們只罵不禱告，就忘了這一點；如果我們只求他們保護教會，也忘了這一點。</p><p>「這是好的，在神我們救主面前可蒙悅納」（2:3）。καλός（kalos） 在本卷出現很多次，這是其中一站：好不好，不由輿論決定，由神面前決定。至於政府逼迫教會時還要不要為它禱告，見本章議題頁；經文的方向已經在這裡：照樣禱告，因為救主是神。</p>"},{"a":4,"z":4,"star":2,"grk":"<p lang=\"grc\">ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.</p>","lit":"<p>他願意所有的人得救，並且來到真理的認識裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὃς</td><td>hos</td><td>他（關係代名詞）</td><td>回指 2:3「我們的救主神」</td></tr><tr><td>θέλει</td><td>thelei</td><td>他願意</td><td>現在式：神持續的心意</td></tr><tr><td>πάντας ἀνθρώπους</td><td>pantas anthrōpous</td><td>所有的人</td><td>接續 2:1 的「萬人」</td></tr><tr><td>σωθῆναι</td><td>sōthēnai</td><td>被拯救</td><td>不定過去被動：神的作為</td></tr><tr><td>εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν</td><td>eis epignōsin alētheias elthein</td><td>來到真理的認識裡</td><td>主動：人要來</td></tr></table>","gram":"<p><strong>ὃς πάντας ἀνθρώπους θέλει σωθῆναι（hos pantas anthrōpous thelei sōthēnai） 是全卷一條線上的第三站。</strong>ὃς（hos） 回指 2:3 的「我們的救主神」，θέλει（thelei） 是現在式，說的是神持續的心意。兩個不定詞分工：σωθῆναι（sōthēnai） 是被動，得救是神的作為；ἐλθεῖν（elthein） 是主動，人要「來到」真理的認識裡。神作工，人也要回應。</p><p>「萬人」怎麼讀？讀法有三：一、普世得救論，最後人人都得救——本卷自己擋住了這一讀，4:10 說神「更是信徒的救主」，1:19–20 也有人在真道上船破了；二、「各樣的人」，君王與平民、猶太人與外邦人都在內，πάντας（pantas） 指類別而非每一個人；三、神真實的心意向著每一個人，神學上區分神「所喜悅的」與神「所定的」。本講義沿用以弗所書立場二：取第三讀，並承認第二讀抓住了上下文——2:2 的君王、2:7 的外邦人，正是當時被認為最不可能的人。</p><blockquote><p>εἰς ἐπίγνωσιν ἀληθείας（eis epignōsin alētheias） 與全卷的對手正面相對：假教訓有它的「學問」，6:20 稱為「似是而非的學問」，而神要人來到的是 ἀληθείας（alētheias），真理。3:15 教會是「真理的柱石和根基」，就是為了這一句。</p></blockquote>","exp":"<p>「他願意萬人得救，明白真道」（2:4）。這一句是家的門。全卷講神的家，講秩序、講職分、講規矩；如果沒有這一句，那些規矩很容易變成一道圍牆。保羅把門先打開：這個家是為萬人預備的。</p><p>神的心意是「萬人」，所以我們的禱告也是「萬人」。2:1 與 2:4 是一呼一應：我們為誰禱告，取決於神願意誰得救。一個教會若只為自己人禱告，它的禱告就比神的心窄了。</p><p>既然神願意，為甚麼不是人人都得救？經文沒有在這裡展開這個問題，但它給了兩個線索：得救是神的作為，「明白真道」卻是人要走進去的。4:10 說神「是萬人的救主，更是信徒的救主」——救恩向萬人敞開，信的人進入。更細的討論見本章議題頁，這裡不必勉強把奧祕說盡。</p><p>這一節也安慰人。保羅在 1:15–16 說自己是罪魁，卻蒙了憐憫；神既然願意救一個逼迫教會的人，就沒有一個人在他的心意之外。坐在高位上的、在監牢裡的、坐在我們旁邊卻還不信的家人，都在這個「萬人」裡面。</p><p>「明白真道」也提醒我們：得救不是一次舉手就結束，是走進真理裡面，一生越認識越深。所以第 2 章後面會講到「學」。神願意人得救，也願意人學；一個只想把人帶進門、卻不帶人學真道的教會，只作了神心意的一半。</p>"},{"a":5,"z":6,"star":3,"grk":"<p lang=\"grc\">εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,</p><p lang=\"grc\">ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·</p>","lit":"<p>因為神是一位，神和人之間的中保也是一位，就是人基督耶穌，</p><p>那把自己給出去、作為替所有人的贖價的，這見證在它自己的時候。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἷς γὰρ θεός</td><td>heis gar theos</td><td>因為神是一位</td><td>γὰρ 給 2:4 理由</td></tr><tr><td>εἷς καὶ μεσίτης</td><td>heis kai mesitēs</td><td>中保也是一位</td><td>兩個 εἷς 平行</td></tr><tr><td>θεοῦ καὶ ἀνθρώπων</td><td>theou kai anthrōpōn</td><td>神和人的</td><td>中保站在兩者之間</td></tr><tr><td>ἄνθρωπος Χριστὸς Ἰησοῦς</td><td>anthrōpos Christos Iēsous</td><td>人基督耶穌</td><td>無冠詞，強調「人」</td></tr><tr><td>ὁ δοὺς ἑαυτὸν</td><td>ho dous heauton</td><td>那把自己給出去的</td><td>不定過去分詞</td></tr><tr><td>ἀντίλυτρον</td><td>antilytron</td><td>替代的贖價</td><td>新約僅此一次</td></tr><tr><td>ὑπὲρ πάντων</td><td>hyper pantōn</td><td>為了所有人</td><td>本章第三個「萬」</td></tr><tr><td>τὸ μαρτύριον καιροῖς ἰδίοις</td><td>to martyrion kairois idiois</td><td>那見證，在它自己的時候</td><td>省略句，兩讀</td></tr></table>","gram":"<p><strong>◆ εἷς γὰρ θεός（heis gar theos）, εἷς καὶ μεσίτης（heis kai mesitēs） 是兩個平行的「一」。</strong>γὰρ（gar） 為 2:4 提出理由：神願意萬人得救，因為神只有一位——這是以色列「獨一的主」（申 6:4）的信仰，保羅在羅 3:29–30 用同樣的邏輯說：神既是一位，就不只是猶太人的神。一位神，所以是萬人的神；一位中保，所以是萬人的中保。</p><p>μεσίτης（mesitēs） 在新約還出現在加 3:19–20（摩西作律法的中保）與希伯來書（耶穌是「更美之約的中保」，來 8:6）。這裡的特點是 θεοῦ καὶ ἀνθρώπων（theou kai anthrōpōn）：神和人之間只有一位。接著 ἄνθρωπος Χριστὸς Ἰησοῦς（anthrōpos Christos Iēsous） 沒有冠詞，把「人」推到最前面——中保之所以能代表人，因為他是人；和合本加上「降世」二字，把道成肉身的意思補出來。</p><blockquote><p>ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων（ho dous heauton antilytron hyper pantōn） 回響主耶穌自己的話 λύτρον ἀντὶ πολλῶν（lytron anti pollōn）：「並且要捨命作多人的贖價」（可 10:45）。保羅把 ἀντὶ（anti） 併進名詞，造出 ἀντίλυτρον（新約僅此一次），「替代的贖價」；又把「多人」說成 πάντων（pantōn）——希伯來語的「多人」本來就可以指眾人。ὁ δοὺς ἑαυτὸν（ho dous heauton） 是不定過去分詞：他給出去的不是一樣東西，是自己（加 1:4；2:20 同一個說法）。「為萬人」引起贖罪範圍的爭論：一說基督的死足夠所有人、卻只在選民身上生效；一說基督的死本來就是為所有人。本講義的判斷：保羅這裡的重點是救恩向萬人敞開，與 2:4 同一條線；教義細節見議題頁。</p></blockquote><p>句尾 τὸ μαρτύριον καιροῖς ἰδίοις（to martyrion kairois idiois） 是沒有動詞的同位語，讀法有二：一說基督捨己這件事本身就是神在定好的時候所給的見證（加 4:4「及至時候滿足」）；一說這見證要在各個合適的時候被傳出來，接到 2:7 保羅的奉派。和合本「到了時候，這事必證明出來」偏向後者。兩讀都把 2:5–6 接到宣講。</p>","exp":"<p>〔弗〕弗 4:5--6（以弗所書講義第 4 章）</p><p>「因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌」（2:5）。這是第 2 章的山峰。以弗所書講義第 4 章讀過同一座城的另一個「一」：「一主，一信，一洗，一神」（弗 4:5–6）。那裡是一使教會合一，這裡是一使萬人有路。</p><p>想想提摩太所在的城。以弗所有亞底米的大廟、有祭司、有占卜、有護身符；「平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒」（徒 19:19）。那是一座滿是中介的城：要見神，先找祭司，先買符，先問卜。保羅說：神只有一位，中保也只有一位。<strong>到神面前不需要層層轉介，因為有一位已經站在中間。</strong></p><p>這與 2:1 的代求不衝突。我們彼此代禱，是一起到同一位神面前，靠同一位中保；代禱的人不是另一層中介，是一同敲門的家人。華人敬重祖先，經文也吩咐「孝敬父母」（出 20:12）；孝敬是應當的，但祖先不是我們到神面前的中保。這一句不是用來嘲笑誰，是用來告訴每一個人：路已經開了。</p><p>這位中保怎麼站到中間的？「他捨自己作萬人的贖價」（2:6）。贖價是付給奴隸主、換回奴隸自由的價錢。主耶穌付的不是錢，是自己。321 說「無己」，它的源頭不在我們的意志力，在這一句：無己先是基督的樣子，然後才是我們的操練。一個被這樣贖回來的人，學著不為自己而活，不是因為被要求，是因為先被這樣愛過。</p><p>為甚麼是「降世為人」？因為中保要兩邊都碰得到。他是神，能代表神向人說話；他是人，能代表人站在神面前。我們的軟弱、試探、眼淚，他都從人的那一邊經歷過。所以禱告的時候，我們不是對著一位遙遠的神喊，是靠著一位懂我們的中保開口。</p>"},{"a":7,"z":7,"star":1,"grk":"<p lang=\"grc\">εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν λέγω οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.</p>","lit":"<p>為此我被設立作傳令的和使徒——我說的是真話，我不說謊——作外邦人的教師，在信和真理裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰς ὃ ἐτέθην</td><td>eis ho etethēn</td><td>為此我被設立</td><td>不定過去被動：神設立</td></tr><tr><td>κῆρυξ</td><td>kēryx</td><td>傳令的</td><td>替君王宣告的人</td></tr><tr><td>ἀπόστολος</td><td>apostolos</td><td>使徒</td><td>被差遣的</td></tr><tr><td>ἀλήθειαν λέγω οὐ ψεύδομαι</td><td>alētheian legō ou pseudomai</td><td>我說真話，我不說謊</td><td>插入的誓言</td></tr><tr><td>διδάσκαλος ἐθνῶν</td><td>didaskalos ethnōn</td><td>外邦人的教師</td><td>教訓追蹤一站</td></tr></table>","gram":"<p><strong>εἰς ὃ（eis ho） 回指 2:5–6 的見證：保羅的職分是為這位中保而設的。</strong>ἐτέθην（etethēn） 是不定過去被動，「我被放在這個位置上」——設立的是神，不是保羅自己。三個頭銜 κῆρυξ（kēryx）、ἀπόστολος（apostolos）、διδάσκαλος ἐθνῶν（didaskalos ethnōn） 一層一層：傳令的是替君王把消息喊出去的人，使徒是被差遣的人，教師是把消息講明白的人。</p><p>中間插入 ἀλήθειαν λέγω οὐ ψεύδομαι（alētheian legō ou pseudomai），與羅 9:1 幾乎一樣。寫給自己的屬靈兒子，為甚麼要發誓？因為這封信要當眾宣讀，以弗所有人在挑戰保羅的權柄與教訓（1:3–7），這句話是說給會眾聽的。句尾 ἐν πίστει καὶ ἀληθείᾳ（en pistei kai alētheia） 有兩讀：一讀指教導的內容（和合本「教導他們相信，學習真道」）；一讀指教導的態度（忠信而真實地教）。本講義取前者，因為它接回 2:4 的「明白真道」。</p>","exp":"<p>2:5–6 是見證，2:7 是傳見證的人。「我為此奉派作傳道的，作使徒，作外邦人的師傅」（2:7）。一位中保、一個贖價，需要有人把它喊出去。保羅把自己的整個職分掛在這件事上：他不是為了建立自己的學派，是為了替那位中保傳話。</p><p>「外邦人的師傅」很要緊。保羅曾是最排外的法利賽人，如今被設立去教外邦人——這正是 2:4「萬人」的活樣本。神願意萬人得救，就差遣一個從前最不可能去的人，去最不可能被接納的人那裡。</p><p>「我說的是真話，並不是謊言」（2:7）。這句話提醒我們：傳道人的可信，是福音被聽見的條件之一。以弗所的假教師講的是「虛浮的話」（1:6），保羅用一句誓言把自己綁在真話上。今天講台上的人，不必發誓，但要活得讓人不必懷疑他說的是不是真的。會眾也一樣：我們每一個人都是這個見證的傳話人，在家裡、在職場，說真話就是在替那位中保作見證。</p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ διαλογισμοῦ</p>","lit":"<p>所以我願意男人們在每一個地方禱告，舉起聖潔的手，沒有忿怒和爭論；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Βούλομαι οὖν</td><td>Boulomai oun</td><td>所以我願意</td><td>使徒的意願；5:14 同字</td></tr><tr><td>τοὺς ἄνδρας</td><td>tous andras</td><td>那些男人</td><td>有冠詞：特別點名男人</td></tr><tr><td>ἐν παντὶ τόπῳ</td><td>en panti topō</td><td>在每一個地方</td><td>各處的家庭聚會</td></tr><tr><td>ἐπαίροντας ὁσίους χεῖρας</td><td>epairontas hosious cheiras</td><td>舉起聖潔的手</td><td>當時常見的禱告姿勢</td></tr><tr><td>χωρὶς ὀργῆς καὶ διαλογισμοῦ</td><td>chōris orgēs kai dialogismou</td><td>沒有忿怒和爭論</td><td>這一段的第一條規矩</td></tr></table>","gram":"<p><strong>Βούλομαι οὖν（Boulomai oun） 用 οὖν（oun） 把 2:1 的禱告接回來。</strong>2:2–7 講了禱告的理由，2:8 回到禱告的人。τοὺς ἄνδρας（tous andras） 帶冠詞，是「那些男人」：2:8–15 的規矩，第一句是對男人說的。ἐν παντὶ τόπῳ（en panti topō） 可能指以弗所城裡各處的家庭教會，也呼應瑪 1:11「在各處，人必奉我的名燒香」——外邦人在各處敬拜的應許。</p><p>ἐπαίροντας ὁσίους χεῖρας（epairontas hosious cheiras） 是當時猶太人與希臘人共同的禱告姿勢（詩 141:2「願我舉手祈求」）。但保羅強調的不是手舉多高，是 ὁσίους（hosious）：聖潔的手，指生活，不是洗手的禮儀。</p><blockquote><p>χωρὶς ὀργῆς καὶ διαλογισμοῦ（chōris orgēs kai dialogismou） 的第二個字有兩讀：一讀是心裡的「疑惑」，διαλογισμός（dialogismos） 在別處常指內心翻來覆去的念頭；一讀是彼此的「爭論」，和合本取此。本講義取「爭論」：1:4 的假教訓「只生辯論」，6:4–5 說他們「專好問難，爭辯言詞」，以弗所教會的病正是吵。忿怒與爭論在同一個 χωρὶς（chōris） 底下，一個是心裡的火，一個是口裡的火。</p></blockquote>","exp":"<p>「我願男人無忿怒，無爭論，舉起聖潔的手，隨處禱告」（2:8）。很多人讀 2:8–15，眼睛直接跳到 2:12。可是保羅的第一條規矩是對男人說的，而且說的不是誰可以站講台，是禱告的人心裡不可以有火。</p><p>以弗所的男人怎麼了？第 1 章說有人「想要作教法師」（1:7），第 6 章說有人「專好問難，爭辯言詞」（6:4）。保羅沒有點名，但他把手和心連在一起：一雙剛才還指著弟兄罵的手，舉起來禱告，就不聖潔了。主耶穌也說：「你們站著禱告的時候，若想起有人得罪你們，就當饒恕他」（可 11:25）。</p><p><strong>這一節是讀 2:9–15 的門檻。</strong>不論教會對 2:11–15 採哪一個讀法，2:8「無忿怒、無爭論」都在它前面。為這段經文吵架，就已經違背了這段經文的第一句。321 說「無己才能合一」：在最容易吵的經文上不吵，是合一最實在的操練。</p><p>禱告的姿勢重要嗎？舉手、跪下、站著、低頭，聖經裡都有；姿勢可以幫助心，但不能代替心。神看重的是「聖潔的手」，不是舉得多高的手。今天各教會的禱告方式不同，不必互相評分；彼此和好，才是禱告前要先作的事。</p><p>「聖潔的手」也是一個很日常的檢查：這雙手這個禮拜作了甚麼？簽了甚麼字、打了甚麼字、在網路上回了甚麼話？禱告時舉起來的，就是這一雙手。弟兄們若先在這裡誠實，2:9 以下的經文才讀得下去。</p>"},{"a":9,"z":10,"star":1,"grk":"<p lang=\"grc\">ὡσαύτως καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν καὶ χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,</p><p lang=\"grc\">ἀλλʼ ὃ πρέπει γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν, διʼ ἔργων ἀγαθῶν.</p>","lit":"<p>同樣也願女人們以端正的衣著，帶著廉恥和自守妝飾自己，不在編髮和金子或珍珠或貴重的衣裳裡，</p><p>而是以那與自稱敬神的女人們相稱的，藉著善行。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὡσαύτως</td><td>hōsautōs</td><td>同樣地</td><td>接上 2:8：女人也禱告</td></tr><tr><td>ἐν καταστολῇ κοσμίῳ</td><td>en katastolē kosmiō</td><td>以端正的衣著</td><td>κόσμιος 與 κοσμεῖν 字根相同</td></tr><tr><td>μετὰ αἰδοῦς καὶ σωφροσύνης</td><td>meta aidous kai sōphrosynēs</td><td>帶著廉恥和自守</td><td>σωφροσύνη 在 2:15 再出現</td></tr><tr><td>πλέγμασιν</td><td>plegmasin</td><td>編髮</td><td>當時富家婦女的髮式</td></tr><tr><td>ἱματισμῷ πολυτελεῖ</td><td>himatismō polytelei</td><td>貴重的衣裳</td><td>炫富的衣著</td></tr><tr><td>θεοσέβειαν</td><td>theosebeian</td><td>敬神</td><td>新約僅此一次</td></tr><tr><td>διʼ ἔργων ἀγαθῶν</td><td>di' ergōn agathōn</td><td>藉著善行</td><td>真正的妝飾</td></tr></table>","gram":"<p><strong>ὡσαύτως（hōsautōs） 把 2:9 接在 2:8 後面。</strong>它省略了動詞，要補甚麼？一讀補 προσεύχεσθαι（proseuchesthai），意思是「女人也同樣要禱告，並且要……」；一讀只補 Βούλομαι（Boulomai），「我也同樣願意女人妝飾自己」。保羅在林前 11:5 已經假定女人在聚會中禱告、說預言，所以本講義取第一讀的方向：女人禱告是前提，這裡講的是她們的樣子。</p><p>κοσμίῳ（kosmiō） 與 κοσμεῖν（kosmein） 是同字根的文字遊戲：用「端正的」來「妝飾」。μετὰ αἰδοῦς καὶ σωφροσύνης（meta aidous kai sōphrosynēs） 是希臘倫理常用的一對德行，σωφροσύνης（sōphrosynēs） 在 2:15 收尾時再出現一次，成了 2:9–15 的頭尾呼應。πλέγμασιν（plegmasin）、χρυσίῳ（chrysiō）、μαργαρίταις（margaritais）、ἱματισμῷ πολυτελεῖ（himatismō polytelei） 這一串，是當時羅馬富家婦女炫富的標準配備，希臘羅馬的道德家也這樣批評。θεοσέβειαν（theosebeian） 在新約只出現這一次，與 εὐσέβεια（eusebeia） 同一個家族。真正的妝飾在句尾：διʼ ἔργων ἀγαθῶν（di' ergōn agathōn）。</p>","exp":"<p>「又願女人廉恥、自守，以正派衣裳為妝飾」（2:9）。這一節常被讀成服裝規定，好像戴一枚戒指就違背了經文。可是保羅列的是「編髮、黃金、珍珠，和貴價的衣裳」（2:9），是當時有錢人家炫富的全套。家庭教會裡坐著富人，也坐著奴隸；一位姊妹穿金戴銀進來，別人看見的不是她的敬虔，是她的身價。</p><p>彼得也說：「只要以裡面存著長久溫柔、安靜的心為妝飾」（彼前 3:4）。兩位使徒的重點一樣：妝飾從外面移到裡面。保羅給的是正面的定義：「只要有善行，這才與自稱是敬神的女人相宜」（2:10）。5:10 講到寡婦的資格，也是「有行善的名聲」。</p><p>所以這兩節不是叫姊妹不准打扮，也不是叫弟兄去檢查姊妹的衣著；經文對男人的要求在 2:8，是先管好自己的手和心。今天的應用是：在教會裡，不讓外表的身價分出高低；讓人記得我們的，是我們作了甚麼好事。這對弟兄也一樣成立。</p>"},{"a":11,"z":12,"star":3,"grk":"<p lang=\"grc\">γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·</p><p lang=\"grc\">διδάσκειν δὲ γυναικὶ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλʼ εἶναι ἐν ἡσυχίᾳ.</p>","lit":"<p>女人要在安靜中學習，在一切順服裡；</p><p>但教導，我不准許女人，也不准許轄管男人，而是要在安靜裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>γυνὴ</td><td>gynē</td><td>女人／妻子</td><td>從複數轉為單數</td></tr><tr><td>ἐν ἡσυχίᾳ</td><td>en hēsychia</td><td>在安靜中</td><td>與 2:2 ἡσύχιον 同字根</td></tr><tr><td>μανθανέτω</td><td>manthanetō</td><td>要學習</td><td>第三人稱命令：這一段的第一個命令</td></tr><tr><td>ἐν πάσῃ ὑποταγῇ</td><td>en pasē hypotagē</td><td>在一切順服裡</td><td>順服誰，經文沒有寫出</td></tr><tr><td>διδάσκειν</td><td>didaskein</td><td>教導</td><td>放在句首</td></tr><tr><td>οὐκ ἐπιτρέπω</td><td>ouk epitrepō</td><td>我不准許</td><td>現在式直說語氣</td></tr><tr><td>αὐθεντεῖν</td><td>authentein</td><td>轄管</td><td>新約僅此一次，全卷爭議最大的一個字</td></tr><tr><td>ἀνδρός</td><td>andros</td><td>男人的／丈夫的</td><td>屬格，作 αὐθεντεῖν 的受詞</td></tr><tr><td>εἶναι ἐν ἡσυχίᾳ</td><td>einai en hēsychia</td><td>要在安靜裡</td><td>與 2:11 頭尾呼應</td></tr></table>","gram":"<p><strong>2:11 的第一個命令是 μανθανέτω（manthanetō）：要學。</strong>這是第三人稱現在命令語氣，保羅命令的是「讓她學」。在當時的猶太會堂與希臘羅馬社會，女人通常不被正式教導經典與學問；保羅在這裡先開門。ἐν ἡσυχίᾳ（en hēsychia） 不是「一句話都不准說」，同字根的 ἡσύχιον（hēsychion） 在 2:2 是對全教會說的「安穩」，帖後 3:12 也吩咐人「要安靜做工」；它指的是安靜受教的態度，與 2:8 的忿怒爭論正好相反。ἐν πάσῃ ὑποταγῇ（en pasē hypotagē） 沒有說順服誰：順服神的道、順服教會的秩序、順服丈夫，三讀都有人主張。</p><p>2:11 從 2:9 的複數 γυναῖκας（gynaikas） 轉為單數 γυνὴ（gynē），2:12 的 ἀνδρός（andros） 也是單數。γυνή（gynē） 與 ἀνήρ（anēr） 可以是「女人、男人」，也可以是「妻子、丈夫」；若是後者，這兩節講的是家裡的關係延伸到聚會。2:12 把 διδάσκειν（didaskein） 放在句首強調；οὐκ ἐπιτρέπω（ouk epitrepō） 是現在式直說語氣，一讀是普遍的規定，一讀是「我現在不准許」的處境性指示，單憑文法不能斷定。οὐδὲ（oude） 連起兩個不定詞，學者還在爭論：兩個都是正面的事（教導，以及行使權柄），還是兩個都帶負面色彩（錯誤地教導，以及專橫地轄管）。</p><blockquote><p><strong>◆ αὐθεντεῖν（authentein） 新約僅此一次</strong>，是全卷爭議最大的一個字，和合本譯「轄管」。新約之外的用例很少，字義有三說：一、中性的「行使權柄」；二、帶負面色彩的「擅自掌權、專橫地轄制」；三、少數學者提出的「自稱為始祖、發起者」，證據最弱。由字義延伸出四種讀法，本講義並陳如下：</p><p>一、<strong>互補派（較嚴）</strong>：女性不擔任向全會眾的權威性教導，也不擔任長老、監督；理由是 2:13 的創造次序，不只是當地處境。二、<strong>互補派（較寬）</strong>：限制只在長老、牧師一職；女性可以講道、教導，帶領在長老權柄之下的事工。三、<strong>處境派／平等派</strong>：這是針對以弗所特定處境的禁令——有婦女受假教訓影響（5:13–15；提後 3:6–7），又未受教育；αὐθεντεῖν（authentein） 帶著奪權、專橫的意思；2:11 的重點是「讓她們學」，學成了，情況就不同。四、<strong>中間讀法</strong>：原則是「不可專橫地奪取權柄」，男女都適用；各教會依自己的傳統決定職分。</p><p>各宗派在這事上有真誠的不同，本講義陳列而不裁判。不論採哪一讀，都不可用這兩節貶低女性的價值、智力、屬靈地位或恩賜；也不可用一句「那是當時文化」把經文一筆勾銷——四讀都在認真對待經文。</p></blockquote>","exp":"<p>〔林前〕林前 14:34--35（哥林多前書講義第 14 章）</p><p>「女人要沉靜學道，一味地順服」（2:11）。這一節最常被讀漏的，是第一個動詞：學。在一個女人通常不被教的世界裡，保羅寫給全會眾聽的信，第一個對女人下的命令是「讓她學」。<strong>這一段不是從「閉嘴」開始的，是從「進來學」開始的。</strong>哥林多前書講義第 14 章讀過另一處「婦女在會中要閉口」的經文；兩處都在處理聚會的秩序，也都在同一位使徒手下，他同時讚許在聚會中禱告、說預言的女人（林前 11:5）。</p><p>「我不許女人講道，也不許她轄管男人，只要沉靜」（2:12）。這一節各家讀法不同，gram 已並陳四讀。有三件事是四讀都承認的。第一，「沉靜」不是羞辱，是保羅在 2:2 先向全教會要的樣子。第二，以弗所教會裡，女人一直在服事：就在這座城，「百基拉、亞居拉聽見，就接他來，將神的道給他講解更加詳細」（徒 18:26），百基拉的名字還排在前面；多 2:3 也吩咐年老的婦人「用善道教訓人」。第三，3:11 會再講到女人在職分中的位置。</p><p>那麼今天的教會該怎麼作？本講義不替讀者的教會裁判。有的教會不讓姊妹擔任主任牧師或長老，有的教會按立姊妹，都是在認真讀這兩節之後作的決定。<strong>但有一條底線不分宗派：任何一種讀法，都不可以讓一位在教會服事多年的姊妹覺得自己比較次等。</strong>她的價值、她的恩賜、她在基督裡的地位，與任何一位弟兄一樣。</p><p>再回到 2:8：不論教會採哪一讀，都要「無忿怒，無爭論」。在這兩節上彼此定罪，比讀錯一個字更離經文遠。對傳道人來說，這兩節的功課是謙卑地陳明各家；對會眾來說，是尊重自己的教會、也尊重別的教會的選擇，一起回到「學」。</p>"},{"a":13,"z":14,"star":3,"grk":"<p lang=\"grc\">Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα·</p><p lang=\"grc\">καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.</p>","lit":"<p>因為亞當是先被塑造的，然後是夏娃；</p><p>並且亞當沒有被欺騙，而那女人被徹底欺騙了，就落在過犯裡了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀδὰμ γὰρ πρῶτος ἐπλάσθη</td><td>Adam gar prōtos eplasthē</td><td>因為亞當是先被塑造的</td><td>回到創 2:7</td></tr><tr><td>εἶτα Εὕα</td><td>eita Heua</td><td>然後是夏娃</td><td>創 2:22</td></tr><tr><td>οὐκ ἠπατήθη</td><td>ouk ēpatēthē</td><td>沒有被欺騙</td><td>亞當不是受騙，是明知而犯</td></tr><tr><td>ἐξαπατηθεῖσα</td><td>exapatētheisa</td><td>被徹底欺騙</td><td>加強的複合字</td></tr><tr><td>ἐν παραβάσει γέγονεν</td><td>en parabasei gegonen</td><td>落在過犯裡了</td><td>完成式：至今的光景</td></tr></table>","gram":"<p><strong>2:13 的 γὰρ（gar） 是讀這兩節的第一個分歧。</strong>一讀是因果的「因為」，2:13–14 為 2:12 提出根據；一讀是舉例的「因為」，用創世記的故事說明 2:11–12 要防範的情況。Ἀδὰμ γὰρ πρῶτος ἐπλάσθη（Adam gar prōtos eplasthē）, εἶτα Εὕα（eita Heua） 回到創 2:7 與 2:22，ἐπλάσθη（eplasthē） 是陶匠「塑造」的字。</p><p>2:13 創造次序的讀法有三：一、超越文化的創造次序，是互補派的主要根據；二、針對以弗所的處境——當地亞底米信仰與後來的諾斯底傳說都有「女性先於男性」的故事，保羅把創世記的次序說正；三、敘事的例證，重點不在誰先誰後，在接下來的受騙。四讀各家在 2:12 的分歧，大半就落在這個 γὰρ（gar） 上。</p><blockquote><p>2:14 用了兩個字：亞當 οὐκ ἠπατήθη（ouk ēpatēthē），女人則 ἐξαπατηθεῖσα（exapatētheisa），加強的複合字「被徹底欺騙」，正是七十士譯本創 3:13 夏娃說「那蛇 ἠπάτησέν（ēpatēsen） 我」的同一個字根。ἐν παραβάσει γέγονεν（en parabasei gegonen） 是完成式，指進入過犯之後的光景。2:14 的讀法有四：一、女人天性比較容易受騙——這是部分教父與中世紀的讀法，本講義不接受，理由見下；二、夏娃是一個未經教導就接觸教訓的人的例子，以弗所有些婦女正在被假教師牢籠（5:13–15；提後 3:6–7），所以 2:11 先要她們學；三、有一讀指出神的命令是在夏娃被造以前直接給亞當的（創 2:16–17；2:22），夏娃聽到的是轉述，她在創 3:3 多加了「也不可摸」——此讀只並陳，經文沒有明說，本講義不採為定論；四、夏娃是全教會的警告：保羅在林後 11:3 對整個哥林多教會（男女都在內）說，「就像蛇用詭詐誘惑了夏娃一樣」。</p></blockquote><p>判斷第一讀的理由在本卷自己：偏離真道、被引誘的人有男也有女——1:20 的許米乃、亞歷山大是男人，1:6 與 6:21 的 ἐξετράπησαν（exetrapēsan） 不分男女，5:15 年輕的寡婦也 ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ（exetrapēsan opisō tou Satana）。若 2:14 是說女人天生容易受騙，保羅自己的信就不支持。所以第一讀不是經文的意思。</p>","exp":"<p>「因為先造的是亞當，後造的是夏娃，且不是亞當被引誘，乃是女人被引誘，陷在罪裡」（2:13–14）。這使我們想起創世記講義第 2、3 章：神用塵土造人（創 2:7），又用肋骨造女人（創 2:22），然後是那棵樹。</p><p>先說這兩節不是甚麼：它不是說女人比較笨、比較容易受騙。這種讀法在教會歷史上傷過很多姊妹，但本卷自己就不支持它——第 1 章點名的許米乃和亞歷山大是男人，「交給撒但」的是他們（1:20）；第 5 章「轉去隨從撒但」的是年輕寡婦（5:15）。偏離真道的有男也有女，被騙不分性別。</p><p>再看亞當。「不是亞當被引誘」（2:14）不是在誇亞當。他沒有被騙，卻吃了，那是明知而犯。保羅在羅馬書說「罪是從一人入了世界」（羅 5:12），那一人是亞當。夏娃至少誠實：「那蛇引誘我，我就吃了」（創 3:13）。兩個人都落在罪裡，兩個人都需要同一位中保（2:5）。</p><p>那麼保羅為甚麼舉夏娃？最貼近上下文的讀法是：以弗所正有人在騙人，而受騙的危險，在沒有好好學過真道的人身上最大。所以 2:11 的解藥是「學」。保羅在林後 11:3 也用同一個夏娃提醒整個教會，男女都在內。至於「夏娃聽的是轉述的命令」一說，可以幫助我們想像那個處境，但經文沒有明說，講義只並陳，不據此立論。</p><p>這兩節對弟兄姊妹都是同一個功課：被騙的危險不在性別，在不學、不查、只聽轉述。一個不讀經、只聽別人說的弟兄，和一個不讀經的姊妹，處境一樣危險。</p><p>這兩節在全卷地勢圖上是低谷：「陷在罪裡」。但下一節馬上說「得救」。低谷不是終點，讀到 2:14 停下來的人，就讀錯了這一段。</p>"},{"a":15,"z":15,"star":3,"grk":"<p lang=\"grc\">σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.</p>","lit":"<p>但她將藉著那生產得救，如果她們持守在信和愛和聖潔裡，帶著自守。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σωθήσεται</td><td>sōthēsetai</td><td>她將得救</td><td>與 2:4 σωθῆναι 同一個字</td></tr><tr><td>διὰ τῆς τεκνογονίας</td><td>dia tēs teknogonias</td><td>藉著那生產</td><td>有冠詞；名詞新約僅此一次</td></tr><tr><td>ἐὰν μείνωσιν</td><td>ean meinōsin</td><td>如果她們持守</td><td>主詞從單數轉為複數</td></tr><tr><td>ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ</td><td>en pistei kai agapē kai hagiasmō</td><td>在信、愛、聖潔裡</td><td>得救的條件是這三樣</td></tr><tr><td>μετὰ σωφροσύνης</td><td>meta sōphrosynēs</td><td>帶著自守</td><td>回到 2:9：頭尾呼應</td></tr></table>","gram":"<p><strong>σωθήσεται（sōthēsetai） 是將來式被動，與 2:4 的 σωθῆναι（sōthēnai） 同一個字。</strong>2:4 神願意萬人得救，2:15 用同一個字收尾——這一段從「萬人得救」走到「她將得救」，救恩的框架沒有變。主詞是單數「她」，沒有寫出來：可能是 2:14 的那個女人（夏娃），也可能是泛指的女人。到條件子句 ἐὰν μείνωσιν（ean meinōsin） 又變成複數「她們」：一讀指教會的女人們，一讀指她們的兒女，一讀指夫妻二人。本講義取第一讀：從夏娃轉到教會裡的每一位姊妹。</p><p>διὰ τῆς τεκνογονίας（dia tēs teknogonias） 有冠詞，τεκνογονία（teknogonia） 這個名詞新約僅此一次（動詞 τεκνογονεῖν（teknogonein） 見 5:14）。διὰ（dia） 加屬格可以是工具「藉著」，也可以是處境「在……之中、經過」。由此產生四讀：</p><blockquote><p>一、<strong>藉著那生產——基督的降生</strong>：冠詞指「那一次」生產，就是女人的後裔（創 3:15）；夏娃帶進了過犯，一位女子卻生出救主（加 4:4「為女子所生」）。二、<strong>在生產中被保全</strong>：σῴζω（sōzō） 也可以指身體的保全，創 3:16 說生產必多受苦楚，保羅說信的姊妹在其中有神的保守。三、<strong>藉著履行母職而成聖</strong>：生產代表女人在家中的呼召，「得救」指救恩在生活中的作成，不是指稱義的根據。四、<strong>對抗禁止嫁娶的假教訓</strong>：4:3 假教師 κωλυόντων γαμεῖν（kōlyontōn gamein），5:14 保羅反過來願年輕寡婦嫁人、生養；2:15 是說嫁娶生養不會使女人失去救恩。</p><p>四讀並陳，本講義不定於一讀。但有一個文法事實四讀都必須面對：條件子句列出的是 ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης（en pistei kai agapē kai hagiasmō meta sōphrosynēs）——信、愛、聖潔、自守，沒有一樣是生育。σωφροσύνης（sōphrosynēs） 又回到 2:9，把 2:9–15 收成一個整段。</p></blockquote>","exp":"<p>「然而，女人若常存信心、愛心，又聖潔自守，就必在生產上得救」（2:15）。這是全卷最難讀的一句，也是最容易傷人的一句。四讀已經並陳；這裡先講四讀都同意的事。</p><p>第一，救恩不是靠生產換來的。本卷開頭就說：「基督耶穌降世，為要拯救罪人」（1:15）；本章剛說：「他捨自己作萬人的贖價」（2:6）。得救的根據是那一位中保，不是任何人的身體能不能生。第二，這一節自己寫出的條件是「信心、愛心，又聖潔自守」——那正是第 1 章說的「命令的總歸就是愛」（1:5）的同一組字。</p><p><strong>所以，一位不孕的姊妹、一位經歷過流產的姊妹、一位單身的姊妹，讀到這一節，不必覺得自己被排除在救恩之外。</strong>寫這封信的保羅自己沒有結婚；他在哥林多前書勸未婚的人可以守住單身（林前 7:8）。如果生育是得救的條件，寫這封信的人第一個不合格。神願意萬人得救（2:4），「萬人」裡面沒有少掉她們。</p><p>那麼為甚麼提生產？若取第一讀，是說女人沒有被咒詛定住：帶進過犯的是一個女人，帶來救主的也是一個女人。若取第四讀，是說嫁娶生養不是屬靈的次等選擇，假教師禁止嫁娶（4:3），保羅要姊妹們安心。不論哪一讀，2:14 的低谷都沒有成為終點：從「陷在罪裡」到「必得救」，中間站著 2:5 那一位中保。</p><p>對傳道人，這一節的功課是講的時候想到台下坐著誰；對會眾，是記得救恩是一個人站在中間，不是一份我們交得出的成績單。第 2 章從為萬人禱告開始，在「得救」結束；家的門，始終是開著的。</p>"}],"3":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.</p>","lit":"<p>可信的是這話：若有人伸手追求監督的職分，他是渴慕一件美好的工作。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πιστὸς ὁ λόγος</td><td>Pistos ho logos</td><td>可信的是這話</td><td>教牧書信的公式；本卷三次（1:15；3:1；4:9）</td></tr><tr><td>ἐπισκοπῆς</td><td>episkopēs</td><td>監督的職分</td><td>字典形 ἐπισκοπή：一件「看顧」的事，不是頭銜</td></tr><tr><td>ὀρέγεται</td><td>oregetai</td><td>伸手去夠</td><td>現在式：一直伸長了手</td></tr><tr><td>καλοῦ ἔργου</td><td>kalou ergou</td><td>美好的工作</td><td>καλός 本章第一站：重點在「工」</td></tr><tr><td>ἐπιθυμεῖ</td><td>epithymei</td><td>渴慕</td><td>新約多半是「私慾」，這裡是正面的</td></tr></table>","gram":"<p><strong>3:1 的「這話是可信的」，原文其實在句首。</strong>Πιστὸς ὁ λόγος（Pistos ho logos） 是教牧書信獨有的公式，本卷出現三次（1:15；3:1；4:9）。原文先說「可信的是這話」，再說內容；和合本把那句話放進引號擺在前面，把公式移到句末，與 1:15 的排法一致——兩處都是先讓那句話被聽見，再蓋上「可信」的印。</p><p>這個公式指向前還是指向後，有兩讀：一說回指 2:15「就必在生產上得救」（2:15），因為 3:1 的話題太平常，不像需要「可信」擔保的格言；一說指向後面這句話，和合本與多數譯本都這樣讀。本講義從和合本：這句話在以弗所正需要擔保，因為有人把職分當作地位來爭，也有人因為教會被自己的領袖傷過（徒 20:30），而對職分心灰意冷。</p><blockquote><p>兩個動詞都很強：ὀρέγεται（oregetai） 是伸出手去夠，ἐπιθυμεῖ（epithymei） 是渴慕；後者在新約多半譯作「私慾」，這裡卻是正面的。但被渴慕的不是 ἐπισκοπῆς（episkopēs） 的權柄，而是 καλοῦ ἔργου（kalou ergou）——一件美好的「工」。屬格 ἐπισκοπῆς（episkopēs） 是動作名詞，意思是「看顧」。保羅讓人想要的，是一份工作，不是一個座位。</p></blockquote>","exp":"<p>以弗所教會到提摩太的時候，大約已經十年。保羅在米利都對以弗所的長老說過：「就是你們中間，也必有人起來說悖謬的話」（徒 20:30）。這句話應驗了：1:3 那幾個傳異教的人，看來有的就出在教會的領袖之中。教會被自己的領袖傷過以後，最容易出現兩種反應：一種是把職分當作權位，爭著上去；一種是對職分灰心，誰也不想再碰。</p><p>3:1 對兩種人都說話。對灰心的人，保羅說：想要這個職分不是虛榮，是「羨慕善工」（3:1）。對爭位的人，保羅說：你要的是「工」，不是「位」。同一句話，一面鼓勵，一面校正。</p><p>「善工」的「善」，就是本卷最愛用的那個「好」字。它不只是道德上的好，也是美、是合宜。監督的工作是美好的，因為它照看的是神的家；但它仍然是工作——要守夜、要扛擔子、要為人交帳。主耶穌說：「誰願為大，就必作你們的用人」（可 10:43）。教會的職分若讓人覺得是在往上爬，方向就已經錯了。</p><p>這也說明為甚麼 3:2 以下的條件那樣寫。若職分是地位，條件就會是學歷、口才、資歷；職分既然是看顧人的工作，條件就幾乎全是品格。下一節開始的那一串字，先問的不是「你會甚麼」，而是「你是誰」。</p>"},{"a":2,"z":2,"star":3,"grk":"<p lang=\"grc\">δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,</p>","lit":"<p>所以那監督必須是無可指摘的，是一個女人的男人，清醒的，自守的，有規矩的，愛客旅的，善於教導的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δεῖ οὖν</td><td>dei oun</td><td>所以必須</td><td>οὖν 接回 3:1：既是善工，就有條件</td></tr><tr><td>ἀνεπίλημπτον</td><td>anepilēmpton</td><td>抓不到把柄的</td><td>總綱：以下各項都在解釋它</td></tr><tr><td>μιᾶς γυναικὸς ἄνδρα</td><td>mias gynaikos andra</td><td>一個女人的男人</td><td>μιᾶς 放在最前面；四讀見 gram</td></tr><tr><td>νηφάλιον</td><td>nēphalion</td><td>清醒的</td><td>原指不醉，引申為頭腦清明</td></tr><tr><td>σώφρονα</td><td>sōphrona</td><td>自守的</td><td>心思健全、有分寸</td></tr><tr><td>κόσμιον</td><td>kosmion</td><td>有規矩的</td><td>與 κόσμος 同字根：生活有秩序</td></tr><tr><td>φιλόξενον</td><td>philoxenon</td><td>愛陌生人的</td><td>家門向外打開</td></tr><tr><td>διδακτικόν</td><td>didaktikon</td><td>善於教導的</td><td>十五項中唯一的能力</td></tr></table>","gram":"<p><strong>3:2 是一串沒有連接詞的形容詞。</strong>δεῖ οὖν（dei oun） 起頭，「所以必須」：既然是善工，就有條件。第一個字 ἀνεπίλημπτον（anepilēmpton） 是總綱，字面是「抓不到把柄」——不是完美無罪，是沒有一個明顯的破口，可以讓人抓住、拿來羞辱福音。後面的各項，都在拆解這個總綱。</p><p>最受爭議的是第二項 μιᾶς γυναικὸς ἄνδρα（mias gynaikos andra），直譯「一個女人的男人」；μιᾶς（mias） 放在最前面，重音落在「一個」。歷來有四讀：</p><blockquote><p>①<strong>禁止多妻</strong>：監督不可同時有兩個妻子。難處：當時希臘羅馬社會在法律上是一夫一妻，猶太人中多妻也已罕見；而且 5:9 寡婦的條件 ἑνὸς ἀνδρὸς γυνή（henos andros gynē） 是同一個句型，女人並沒有「一妻多夫」的問題，可見這個句型說的不只是多妻。<br>②<strong>禁止離婚再婚</strong>：離過婚又再娶的，不作監督。難處：經文沒有說「從未離婚」；主耶穌和保羅都談過離婚的例外（太 19:9；林前 7:15），這一讀要把這些問題全都塞進一個片語裡。<br>③<strong>禁止任何再婚</strong>，連喪偶再娶也算：早期教會有人這樣讀，要求聖職人員一生只結一次婚。難處：保羅在同一封信裡說「我願意年輕的寡婦嫁人」（5:14），也說妻子在丈夫死後就自由了（林前 7:39）；若再婚本身有虧，這些話就難以並立。<br>④<strong>一個對妻子專一忠誠的人</strong>：這是一句品格的描述，不是婚姻史的履歷——他是一心只屬一個女人的男人。理由：清單上其餘各項都是現在的品格，「有節制」「自守」「端正」沒有一項在查過去的紀錄。難處：用詞仍是婚姻的語言，預設的是一般的已婚男子；但它不是要求監督必須結婚，否則單身的保羅（林前 7:7–8）連自己定的條件都不合。</p></blockquote><p>本講義以第四讀為主軸，並陳其餘三讀。各地教會若在按立上有自己的規定，那是教會治理的判斷，應照程序、私下、溫柔地處理；但這一節本身的焦點，是一個人此刻的忠誠。</p>","exp":"<p>3:2–7 列了十五項條件：無可指責、一個婦人的丈夫、有節制、自守、端正、樂意接待遠人、善於教導；不因酒滋事、不打人、溫和、不爭競、不貪財；好好管理自己的家；不是初入教的；在教外有好名聲。十五項裡，只有「善於教導」是一種能力，其餘十四項都是生命。保羅沒有問監督會不會講道、會不會管帳、會不會帶活動，他先問這個人在家裡、在街上、在酒桌旁是甚麼樣子。</p><p>「只作一個婦人的丈夫」（3:2）放在第二項，緊接著總綱。以弗所城裡有神廟的祭儀、有宴席上的放縱，假教師又在各家之間走動（提後 3:6）。在這樣的城裡，一個領袖的性道德不是私事，是福音的招牌。第四讀抓住的正是這一點：他的心有沒有一個方向？他對妻子的忠誠，是不是別人可以信任的？</p><p>這一節最常被誤用的方式，是拿來審查人的過去。但保羅寫這封信，剛剛在第 1 章說過：「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（1:13）。神親手揀選了一個過去最不合格的人，把福音託付給他。所以讀 3:2，不可以把離婚、再婚或單身的弟兄姊妹當成「不合格的例子」，更不可以在講台上討論任何人的婚姻史。有些人的婚姻破裂，是被背叛、被遺棄；有些人一生單身，是神的帶領。這一節要守護的是忠誠，不是給受過傷的人再加一道傷。</p><p>其餘幾項也都是日常的樣子。「有節制」原是清醒、不醉；「自守」是心思健全、有分寸；「端正」是生活有秩序；「樂意接待遠人」是家門向陌生人打開——在旅店少又不安全的年代，傳道的人靠信徒的家落腳，監督的家就是教會的第一個客廳。至於「善於教導」，它被放在品格中間，提醒我們：教導本身也是生命的流露，一個人怎樣活，就怎樣教。</p>"},{"a":3,"z":3,"star":1,"grk":"<p lang=\"grc\">μὴ πάροινον, μὴ πλήκτην ἀλλὰ ἐπιεικῆ, ἄμαχον, ἀφιλάργυρον,</p>","lit":"<p>不是在酒旁邊的，不是打人的，乃是溫和的，不爭鬥的，不愛銀子的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ πάροινον</td><td>mē paroinon</td><td>不在酒旁邊的</td><td>字首「旁邊」加上「酒」：賴在酒邊、因酒鬧事</td></tr><tr><td>μὴ πλήκτην</td><td>mē plēktēn</td><td>不打人的</td><td>酒之後就是拳頭</td></tr><tr><td>ἀλλὰ ἐπιεικῆ</td><td>alla epieikē</td><td>乃是溫和的</td><td>肯讓步、不咬住自己的權利</td></tr><tr><td>ἄμαχον</td><td>amachon</td><td>不爭鬥的</td><td>否定字首：沒有戰鬥</td></tr><tr><td>ἀφιλάργυρον</td><td>aphilargyron</td><td>不愛銀子的</td><td>預告 6:10 的 φιλαργυρία</td></tr></table>","gram":"<p><strong>3:3 的五項排成兩組。</strong>先是兩個 μὴ（mē）：μὴ πάροινον（mē paroinon）、μὴ πλήκτην（mē plēktēn）；接著一個轉折 ἀλλὰ ἐπιεικῆ（alla epieikē）；再接兩個帶否定字首的字 ἄμαχον（amachon）、ἀφιλάργυρον（aphilargyron）。兩個「不」說的是失控的身體，酒和拳頭；一個「乃是」說的是溫和的心；兩個「沒有」說的是不爭、不貪。πάροινον（paroinon） 字面是「在酒旁邊」，指賴在酒席上、因酒失態鬧事的人，焦點在醉與失控，不在杯中有沒有酒。</p><p>ἐπιεικῆ（epieikē） 是肯讓步、不咬住自己權利的溫和；ἄμαχον（amachon） 與 3:2 的 νηφάλιον（nēphalion） 相呼應：清醒的人不必靠爭吵證明自己。ἀφιλάργυρον（aphilargyron） 是「不愛銀子」，字根正是 6:10「貪財是萬惡之根」的 φιλαργυρία（philargyria）——第 3 章先埋下一條線，第 6 章才收。提多書的清單同樣寫「不因酒滋事，不打人」（多 1:7），可見這是教牧書信共同的底線。</p>","exp":"<p>「不因酒滋事」（3:3）的重點是節制，不是禁酒。保羅擋的是醉酒失控、因酒傷人的人；他在同一封信裡還勸提摩太「可以稍微用點酒」（5:23），那是因為「胃口不清，屢次患病」（5:23），是藥用的處境，不是鼓勵飲酒。所以這一節不能拿來把喝酒本身定罪，也不能把滴酒不沾當成屬靈的資格；兩邊都越過了經文。</p><p>但節制也有它的溫度。保羅在別處說：「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好」（羅 14:21）。會眾裡可能有人正在戒酒，有人的家曾被酒毀過。一位監督的節制，不只是自己不醉，也包括為了軟弱的人甘心不用自己的自由。教會的聚會、聚餐怎樣安排，是很實際的愛。</p><p>酒、拳頭、爭競、貪財，四樣都是一個人失去自我約束的樣子。溫和放在中間：一個不靠酒壯膽、不靠拳頭服人、不靠錢安心的人，才溫和得起來。</p>"},{"a":4,"z":5,"star":2,"grk":"<p lang=\"grc\">τοῦ ἰδίου οἴκου καλῶς προϊστάμενον, τέκνα ἔχοντα ἐν ὑποταγῇ μετὰ πάσης σεμνότητος·</p><p lang=\"grc\">(εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)</p>","lit":"<p>把自己的家好好地帶領在前，有兒女在順服之中，帶著一切的端莊；</p><p>（人若不知道帶領自己的家，他怎能照料神的教會呢？）</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τοῦ ἰδίου οἴκου</td><td>tou idiou oikou</td><td>自己的家</td><td>οἶκος 本章第一站</td></tr><tr><td>καλῶς προϊστάμενον</td><td>kalōs proistamenon</td><td>好好地帶領在前</td><td>站在前面：帶領，也照顧</td></tr><tr><td>ἐν ὑποταγῇ</td><td>en hypotagē</td><td>在順服之中</td><td>家中有秩序</td></tr><tr><td>μετὰ πάσης σεμνότητος</td><td>meta pasēs semnotētos</td><td>帶著一切的端莊</td><td>屬兒女，還是屬父親？</td></tr><tr><td>ἐπιμελήσεται</td><td>epimelēsetai</td><td>他要照料</td><td>好撒馬利亞人「照應他」的字</td></tr></table>","gram":"<p><strong>3:4 的動詞 προϊστάμενον（proistamenon） 字面是「站在前面」。</strong>它可以是帶領、治理，也可以是保護、照顧；καλῶς（kalōs） 說的是好好地帶，不是嚴厲地管。3:5 是插入的括號，用修辭問句推論：「人若不知道管理自己的家，焉能照管神的教會呢？」（3:5）。兩個動詞不同：家用 προστῆναι（prostēnai），教會用 ἐπιμελήσεται（epimelēsetai）。後者正是好撒馬利亞人把傷者「帶到店裡去照應他」（路 10:34）的那個字——照管神的教會，是包紮傷口的那種照顧。</p><p>μετὰ πάσης σεμνότητος（meta pasēs semnotētos） 可以掛在兒女身上，如和合本正文的「使兒女凡事端莊順服」；也可以掛在父親身上——和合本的小註就作「端端莊莊地使兒女順服」。若是後者，經文要求的是父親帶家的方式要莊重，不暴躁、不羞辱。</p><blockquote><p>另一個問題是「兒女」指誰。一讀是兒女年幼時家中的秩序；一讀是成年兒女的信仰，常引「兒女也是信主的」（多 1:6）為證。本講義採前一讀：ἐν ὑποταγῇ（en hypotagē） 說的是家中的秩序，是父親帶得到、也該帶好的範圍；而提多書那裡的 πιστά（pista） 也可譯為「忠實可靠的」，未必是「已經信主」。</p></blockquote>","exp":"<p>保羅從教會轉回家裡：「好好管理自己的家」（3:4）。這是全卷「家」這條線第一次落地。1:4 說的是神在信上所立的章程，原文是神的「家政」；3:15 要說「神的家」；夾在中間的，是一個人自己的家。這個次序很清楚：家是教會的試金石。一個人在講台上溫和，在家裡暴躁；在會眾面前謙卑，在妻兒面前專橫——那個家裡的人最先知道真相。</p><p>「焉能照管神的教會呢」（3:5）是從小推到大：連自己的家都帶不好，怎能帶神的家？但這句話不是成功學。保羅要的不是一個完美的家，而是一個「好好帶領」的父親：有秩序、有尊重、有照顧。</p><p>這裡必須說清楚：成年兒女不信主，不自動使父親失去資格。成年人要為自己的選擇向神交帳；「兒子必不擔當父親的罪孽」（結 18:20）這句話使我們想起，信仰不能由父母代替決定。許多忠心的父母，兒女仍然走了遠路；那是他們的眼淚，不是他們的罪狀。教會不可用這兩節去羞辱任何一位兒女尚未信主的弟兄姊妹。</p><p>經文問的是父親怎樣帶家：有沒有用愛和端莊建立秩序？這也落在 321 的次序上——先生命，再關係，後事工。家是關係的第一個現場。</p>"},{"a":6,"z":7,"star":2,"grk":"<p lang=\"grc\">μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.</p><p lang=\"grc\">δεῖ δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.</p>","lit":"<p>不是新栽種的，免得他被煙燻得自高起來，掉進魔鬼的審判裡。</p><p>並且他也必須從外面的人那裡有美好的見證，免得他掉進羞辱和魔鬼的網羅裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ νεόφυτον</td><td>mē neophyton</td><td>不是新栽的</td><td>剛種下的苗：根還淺</td></tr><tr><td>τυφωθεὶς</td><td>typhōtheis</td><td>被煙燻昏了</td><td>字典形 τυφόω；6:4 τετύφωται 同字</td></tr><tr><td>εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου</td><td>eis krima empesē tou diabolou</td><td>掉進魔鬼的審判裡</td><td>屬格兩讀：魔鬼受的，或魔鬼帶來的</td></tr><tr><td>μαρτυρίαν καλὴν</td><td>martyrian kalēn</td><td>美好的見證</td><td>καλός 本章第二站</td></tr><tr><td>τῶν ἔξωθεν</td><td>tōn exōthen</td><td>外面的人</td><td>教外的鄰舍也是評審</td></tr><tr><td>παγίδα τοῦ διαβόλου</td><td>pagida tou diabolou</td><td>魔鬼的網羅</td><td>與 3:6 平行</td></tr></table>","gram":"<p><strong>νεόφυτον（neophyton） 是農夫的字，「新栽種的」。</strong>剛種下的苗，枝葉也許很快長出來，根卻還淺，一陣風就倒。提多書的監督條件沒有這一項（多 1:5–9），因為革哩底的教會才剛建立，人人都是新的；以弗所教會已經十年，就可以、也應該等。</p><p>τυφωθεὶς（typhōtheis） 是不定過去式被動分詞，字根是「煙」：被煙燻得頭昏眼花，看不清自己。同一個字在 6:4 寫作 τετύφωται（tetyphōtai），描寫假教師「自高自大，一無所知」（6:4）——驕傲的人以為自己看得最清楚，其實是被自己的煙燻瞎了。</p><blockquote><p>3:6 的 κρίμα τοῦ διαβόλου（krima tou diabolou） 與 3:7 的 παγίδα τοῦ διαβόλου（pagida tou diabolou） 是平行句，兩個屬格都可以兩讀。3:6 若是受詞屬格，就是「魔鬼所受的刑罰」，和合本加了「所受」二字：驕傲的人落在魔鬼當初因驕傲而受的審判裡。若是主詞屬格，就是魔鬼帶來的控告。3:7 的「網羅」明顯是魔鬼設下的，所以有人主張 3:6 也照此讀。本講義從和合本讀 3:6，因為驕傲正是那條路；但兩讀說的是同一件事：驕傲讓人站在魔鬼可以下手的地方。διαβόλου（diabolou） 本義是「毀謗者」，3:7 的 ὀνειδισμὸν（oneidismon） 就是他的手段。</p></blockquote>","exp":"<p>3:6 是本章地勢圖的谷底：「恐怕他自高自大，就落在魔鬼所受的刑罰裡」（3:6）。十五項條件裡，只有這一項附了理由，而且理由那樣重。保羅不是怕新信徒能力不夠，是怕他上去得太快。一個人信主不久就被推上台前，掌聲比根長得快，最容易被這股煙燻昏。</p><p>以弗所的假教師正是這樣的人：「他是自高自大，一無所知，專好問難，爭辯言詞」（6:4）。驕傲不是外面來的試探，是從裡面冒出的煙。這也是保羅說「給人行按手的禮，不可急促」（5:22）的原因：按立要慢，要觀察，要讓時間顯出一個人的根。這不是看輕年輕人，保羅同樣說「不可叫人小看你年輕」（4:12）——問題不在年紀，在根的深淺。</p><p>3:7 把評審從教會裡擴大到教會外：「監督也必須在教外有好名聲」（3:7）。鄰居、同事、生意上往來的人，都是監督的見證人。若一個人在教會裡受尊敬，在外面卻人人搖頭，他就給了毀謗者一張網。教會的領袖站在牆上，牆內牆外的人都看得見他。</p><p>兩節都用同一個動詞「落在」，一次落在刑罰裡，一次落在網羅裡。保羅擔心的不只是一個人跌倒，是他跌倒時把整個家的名聲一起拖下去。所以按立的慢，不是對人的不信任，是對羊群的愛；而一個領袖在外面的好名聲，也不是公關，是讓毀謗者找不到下手的地方。</p>"},{"a":8,"z":10,"star":2,"grk":"<p lang=\"grc\">Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,</p><p lang=\"grc\">ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.</p><p lang=\"grc\">καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.</p>","lit":"<p>執事們同樣要端莊，不是說兩樣話的，不是專注於許多酒的，不是貪可恥之利的，</p><p>在清潔的良心裡持守那信仰的奧祕。</p><p>並且這些人也要先被試驗，然後，既是無可控告的，就讓他們服事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Διακόνους ὡσαύτως</td><td>Diakonous hōsautōs</td><td>執事們同樣</td><td>沒有動詞，借用 3:2 的 δεῖ</td></tr><tr><td>μὴ διλόγους</td><td>mē dilogous</td><td>不說兩樣話的</td><td>挨家走動的人最大的試探</td></tr><tr><td>μὴ οἴνῳ πολλῷ προσέχοντας</td><td>mē oinō pollō prosechontas</td><td>不專注於許多酒的</td><td>「許多」：重點仍是節制</td></tr><tr><td>μὴ αἰσχροκερδεῖς</td><td>mē aischrokerdeis</td><td>不貪可恥之利的</td><td>經手錢的人</td></tr><tr><td>τὸ μυστήριον τῆς πίστεως</td><td>to mystērion tēs pisteōs</td><td>那信仰的奧祕</td><td>3:16 的伏筆</td></tr><tr><td>δοκιμαζέσθωσαν πρῶτον</td><td>dokimazesthōsan prōton</td><td>要先被試驗</td><td>現在式命令語氣，被動</td></tr></table>","gram":"<p><strong>3:8 的 Διακόνους ὡσαύτως（Diakonous hōsautōs） 沒有自己的動詞。</strong>它借用 3:2 的 δεῖ（dei），「同樣必須」；ὡσαύτως（hōsautōs） 把執事放在監督旁邊，兩組人同受品格的檢驗。διάκονος（diakonos） 的本義是僕人、跑腿的、伺候飯桌的人。主耶穌說：「人子來，並不是要受人的服事，乃是要服事人」（可 10:45）。這個職分的名字，就是它的內容。</p><p>四個條件裡，三個是 μὴ（mē） 起頭的否定。μὴ διλόγους（mē dilogous） 是「說兩樣話」，對這家說一套、對那家說一套；執事要挨家照顧、傳話、送東西，口最容易歪。μὴ οἴνῳ πολλῷ προσέχοντας（mē oinō pollō prosechontas） 多了一個 πολλῷ（pollō），「許多的酒」，焦點仍是沉溺與失控。μὴ αἰσχροκερδεῖς（mē aischrokerdeis） 是貪「可恥的利」，執事經手教會的錢與救濟，這一條特別要緊。</p><blockquote><p>3:9 把信仰與良心綁在一起：τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει（to mystērion tēs pisteōs en kathara syneidēsei）。這呼應 1:5 的「清潔的心和無虧的良心」，也對照 1:19 那些丟棄良心的人。μυστήριον（mystērion） 在本章出現兩次，3:16 就要揭開它。3:10 的 καὶ οὗτοι δὲ（kai houtoi de） 是「這些人也要」——「也」字暗示監督同樣要經過試驗。δοκιμαζέσθωσαν（dokimazesthōsan） 是現在式被動命令，πρῶτον（prōton） 與 εἶτα（eita） 定下次序：先試驗，然後服事。</p></blockquote>","exp":"<p>監督之後是執事。保羅在腓立比書開頭就問候過「諸位監督，諸位執事」（腓 1:1），可見這兩種職分在保羅的教會裡已經並列。執事的條件裡沒有「善於教導」，也沒有「樂意接待遠人」；他們的工作更偏向實際的服事。但品格的門檻一點也沒有降低：端莊、不一口兩舌、不好喝酒、不貪不義之財。</p><p>「要存清潔的良心，固守真道的奧祕」（3:9）是執事條件的中心。執事不一定站講台，卻必須知道自己相信甚麼，並且活得與所信相符。以弗所的假教師有很多理論，卻丟棄了良心；執事正好相反——道理不必多花巧，良心卻要乾淨。端湯送飯的手，和持守真道的心，是同一個人。</p><p>「這等人也要先受試驗」（3:10）。這句話說的是次序：先試驗，再服事；先看見生命，再交付職分。試驗不一定是一場考試，常常就是時間——讓他先在小事上服事，看他在沒人看見的地方是否忠心。教會常犯的錯，是缺人的時候抓到誰就是誰，按立了才發現問題。3:6 的「初入教的」與這裡的「先受試驗」連起來讀，意思一致：按立要慢。慢，是對這個人的保護，也是對整個家的保護。</p>"},{"a":11,"z":11,"star":2,"grk":"<p lang=\"grc\">γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.</p>","lit":"<p>女人們同樣要端莊，不是毀謗人的，清醒的，在一切事上忠信的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>γυναῖκας ὡσαύτως</td><td>gynaikas hōsautōs</td><td>女人們同樣</td><td>ὡσαύτως 又開一組，與 3:8 同</td></tr><tr><td>σεμνάς</td><td>semnas</td><td>端莊的</td><td>與 3:8 σεμνούς 同一個字</td></tr><tr><td>μὴ διαβόλους</td><td>mē diabolous</td><td>不是毀謗人的</td><td>與「魔鬼」同一個字</td></tr><tr><td>νηφαλίους</td><td>nēphalious</td><td>清醒的</td><td>與 3:2 監督的條件同字</td></tr><tr><td>πιστὰς ἐν πᾶσιν</td><td>pistas en pasin</td><td>在一切事上忠信的</td><td>可託付的人</td></tr></table>","gram":"<p><strong>3:11 的 γυναῖκας（gynaikas） 可以譯「女人」，也可以譯「妻子」。</strong>和合本正文作「女執事」，小註說「原文是女人」。歷來兩讀：</p><blockquote><p>①<strong>女執事</strong>：理由有四。其一，γυναῖκας ὡσαύτως（gynaikas hōsautōs） 的 ὡσαύτως（hōsautōs） 與 3:8 的 Διακόνους ὡσαύτως（Diakonous hōsautōs） 一樣，是開新的一組人；其二，若指執事的妻子，通常會加「他們的」，原文沒有；其三，四項條件與 3:8 逐條平行——σεμνάς（semnas） 對 σεμνούς（semnous），μὴ διαβόλους（mē diabolous） 對 μὴ διλόγους（mē dilogous），νηφαλίους（nēphalious） 對酒，πιστὰς ἐν πᾶσιν（pistas en pasin） 對良心；其四，當時希臘文的 διάκονος（diakonos） 不分陰陽性，保羅稱非比為 διάκονον（diakonon），不另造陰性字；要指女性的執事，最自然的說法就是「女人」。<br>②<strong>執事的妻子</strong>：理由是這一節夾在執事的條件中間，3:12 立刻又回到執事「只要作一個婦人的丈夫」；若是另一個職分，為何只有一節、又沒有自己的婚姻條件？而且執事的服事常需夫妻同工，妻子的品格自然相關。</p></blockquote><p>本講義兩讀並陳，不作裁判。但有兩件事是經文本身清楚的：這一節夾在執事的條件中間，與執事的工作緊緊相連；而監督的條件裡，並沒有相應的一節提到監督的妻子。μὴ διαβόλους（mē diabolous） 用的正是 3:6–7「魔鬼」那個字——毀謗人的舌頭，做的是魔鬼的工。</p>","exp":"<p>和合本的翻譯者在正文寫「女執事」，又誠實地加註「原文是女人」。這是一個好榜樣：把選擇攤在讀者面前。保羅在羅馬書說：「我對你們舉薦我們的姊妹非比；她是堅革哩教會中的女執事」（羅 16:1）。至少在堅革哩，有一位姊妹被保羅這樣稱呼；很可能就是她，把那封最重要的信帶到羅馬。</p><p>不論讀成女執事或執事的妻子，這一節都說明：在神的家裡服事的姊妹，與弟兄受同樣的看重，也受同樣的品格要求。「必須端莊，不說讒言，有節制，凡事忠心」（3:11），四項條件和 3:8 的執事幾乎逐條對應。保羅沒有為姊妹另定一套比較低、或比較苛的標準。</p><p>「不說讒言」值得停一下。服事的人常常進出各家，知道許多事；最大的誘惑，是把聽來的帶到下一家。原文用的是「魔鬼」的同一個字。教會的傷害，很多不是從講台來的，是從客廳、廚房、電話裡來的。「凡事忠心」是這一節的收尾：可以把一個人的軟弱、一個家的難處交給她，她不會拿去傳。這樣的人，是神的家最寶貴的人。</p><p>這一節在今天的教會體制裡該怎樣落實，各宗派的判斷不同，本講義回到全卷立場二、三，不在這裡定案；但任何一個讀法，都不可以拿來貶低姊妹的恩賜與服事。</p>"},{"a":12,"z":13,"star":1,"grk":"<p lang=\"grc\">διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·</p><p lang=\"grc\">οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>執事們要是一個女人的男人，把兒女和自己的家好好地帶領在前；</p><p>因為那些已經好好服事過的人，為自己取得一個美好的台階，並在那在基督耶穌裡的信上有許多的坦然無懼。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μιᾶς γυναικὸς ἄνδρες</td><td>mias gynaikos andres</td><td>一個女人的男人們</td><td>與 3:2 同一片語，複數</td></tr><tr><td>οἱ γὰρ καλῶς διακονήσαντες</td><td>hoi gar kalōs diakonēsantes</td><td>那些已經好好服事過的</td><td>不定過去式：回頭看一段服事</td></tr><tr><td>βαθμὸν ἑαυτοῖς καλὸν</td><td>bathmon heautois kalon</td><td>為自己一個美好的台階</td><td>καλός 本章第三站</td></tr><tr><td>περιποιοῦνται</td><td>peripoiountai</td><td>取得</td><td>關身語態：為自己得著</td></tr><tr><td>πολλὴν παρρησίαν</td><td>pollēn parrēsian</td><td>許多的坦然</td><td>對人、對神都敢開口</td></tr></table>","gram":"<p><strong>3:12 把 3:2 的片語原樣搬來。</strong>διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες（diakonoi estōsan mias gynaikos andres），只把單數改成複數。所以 3:2 的四讀在這裡同樣適用，本講義仍以「對妻子專一忠誠」為主軸。τέκνων καλῶς προϊστάμενοι（teknōn kalōs proistamenoi） 也與 3:4 同一個動詞——監督與執事，都從家開始。</p><p>3:13 的 γὰρ（gar） 給出理由，也給出賞賜。οἱ γὰρ καλῶς διακονήσαντες（hoi gar kalōs diakonēsantes） 是不定過去式分詞，像是在一段服事結束時回頭看。βαθμὸν（bathmon） 原意是台階、梯級，歷來三讀：一說是升到更高職分的台階，由執事升監督；一說是在會眾中的好名望；一說是在神面前的地位。第一讀把服事變成梯子，與 3:1「善工」的精神不合；本講義採後兩讀的合併：好好服事的人，在人面前得著尊重，在神面前得著坦然。περιποιοῦνται（peripoiountai） 是關身語態，「為自己取得」；πολλὴν παρρησίαν（pollēn parrēsian） 是能開口、不必低頭的膽量。</p>","exp":"<p>「因為善作執事的，自己就得到美好的地步」（3:13）。這是本章唯一的應許，給的是最不起眼的那群人。監督有講台、有名分，執事搬椅子、送餐、探望病人。保羅說：好好做這些事的人，自己就得著美好的地步。賞賜不在下一個職位，就在服事本身裡面。</p><p>「並且在基督耶穌裡的真道上大有膽量」（3:13）。一個在小事上忠心多年的人，說話有分量；他不必提高聲音，會眾自然聽。這種膽量不是口才訓練出來的，是一年一年的忠心累積出來的。</p><p>這兩節也提醒教會：不要把執事當成「升長老之前的實習」。服事不是梯子。一位一生作執事、從沒有站上講台的弟兄姊妹，若是好好地服事了，他在神面前的地步一點也不比誰低。</p><p>3:12 也把執事帶回家裡：「好好管理兒女和自己的家」（3:12）。監督與執事的條件，在這一點上完全一樣。服事從家門口開始，也在家門口被看見。</p>"},{"a":14,"z":15,"star":3,"grk":"<p lang=\"grc\">Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ἐν τάχει,</p><p lang=\"grc\">ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·</p>","lit":"<p>這些事我寫給你，盼望很快到你那裡去；</p><p>但若我遲延，好叫你知道在神的家裡人應當怎樣生活；這家就是永生神的教會，真理的柱子和根基。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ταῦτά σοι γράφω</td><td>Tauta soi graphō</td><td>這些事我寫給你</td><td>回顧第 1–3 章</td></tr><tr><td>ἐὰν δὲ βραδύνω</td><td>ean de bradynō</td><td>但若我遲延</td><td>保羅沒有把握能來</td></tr><tr><td>πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι</td><td>pōs dei en oikō theou anastrephesthai</td><td>在神的家裡人應當怎樣生活</td><td>全卷目的句；οἶκος 的樞紐站</td></tr><tr><td>ἐκκλησία θεοῦ ζῶντος</td><td>ekklēsia theou zōntos</td><td>永生神的教會</td><td>活的神，對照亞底米的像</td></tr><tr><td>στῦλος</td><td>stylos</td><td>柱子</td><td>把屋頂高舉出來</td></tr><tr><td>ἑδραίωμα</td><td>hedraiōma</td><td>根基、底座</td><td>新約僅此一次</td></tr><tr><td>τῆς ἀληθείας</td><td>tēs alētheias</td><td>真理的</td><td>教會撐住真理，不是製造真理</td></tr></table>","gram":"<p><strong>3:14–15 是全卷的目的句。</strong>Ταῦτά σοι γράφω（Tauta soi graphō） 回頭總結第 1–3 章，ἐλπίζων ἐλθεῖν πρὸς σὲ ἐν τάχει（elpizōn elthein pros se en tachei） 說保羅盼望快來；ἐὰν δὲ βραδύνω（ean de bradynō） 卻承認他可能來不了。這封信因此不只是暫時的便條，而是使徒缺席時，神的家要照著行的準則。</p><p>ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι（hina eidēs pōs dei en oikō theou anastrephesthai）：不定詞 ἀναστρέφεσθαι（anastrephesthai） 沒有明寫主詞，可以是「你（提摩太）應當怎樣行」，也可以是「人應當怎樣行」。前者把信讀成給傳道人的手冊；後者把它讀成全家的家規。本講義採後一讀：前文從禱告（2:1）、男人女人（2:8–15）到監督執事，牽涉的是全會眾；這正是一封要在會眾面前宣讀的信。</p><blockquote><p>ἥτις（hētis） 是帶性質的關係代名詞：「這家，正是……」。ἐκκλησία θεοῦ ζῶντος（ekklēsia theou zōntos） 加了 ζῶντος（zōntos），「活的神」，在一座以神像聞名的城裡，這是尖銳的對照。στῦλος καὶ ἑδραίωμα τῆς ἀληθείας（stylos kai hedraiōma tēs alētheias） 兩個名詞：στῦλος（stylos） 是柱子，加 2:9 稱雅各、磯法、約翰為教會的柱石，用的就是這個字；ἑδραίωμα（hedraiōma） 新約僅此一次，與林前 15:58 的 ἑδραῖοι（hedraioi） 同字根，和合本那裡譯作「堅固」，指底座、根基、穩固的支撐。<br>這個同位語修飾誰，也有讀法：多數讀作修飾「教會」；少數讀作修飾提摩太，「你作真理的柱石」；也有人把它接到 3:16 的句首。從文法看，它最自然是緊接在前的 ἐκκλησία（ekklēsia） 的同位語，本講義從之。</p></blockquote>","exp":"<p>〔背景〕徒 19:23--41（使徒行傳講義第 19 章）</p><p>〔弗〕弗 2:19--22（以弗所書講義第 2 章）</p><p>「倘若我耽延日久，你也可以知道在神的家中當怎樣行」（3:15）。這是全卷的鑰匙。第 2–3 章的禱告、男女、監督、執事，不是一堆零散的規定，它們都在回答同一個問題：在神的家裡，該怎樣生活？保羅說的是「家」，不是「機構」。家有父親，有弟兄姊妹，有餐桌，也有秩序；第 5 章還要說「如同父親」「如同姊妹」。家規的目的不是控制，是讓一家人能一起活下去。</p><p>「這家就是永生神的教會」（3:15）。以弗所人聽到這一句，一定想起城裡的亞底米大廟。那是古代世界的奇觀之一，據說有一百多根大理石柱；城裡的書記曾驕傲地說，誰不知道以弗所人的城「是看守大亞底米的廟」（徒 19:35）。銀匠底米丟鬧事的時候，群眾喊著「大哉，以弗所人的亞底米啊！」（徒 19:28），一直喊了約有兩小時（徒 19:34）。保羅在這座城裡住了將近三年，親眼見過那些柱子。現在他對以弗所的信徒說：真正的殿不在城外的山坡上，在你們中間；那殿的神不是一座像，是「永生神」。</p><p>以弗所書已經用同樣的圖畫說過：信徒是神家裡的人，「並且被建造在使徒和先知的根基上」（弗 2:20）。這裡把圖畫翻過來：教會不只被建造在根基上，教會自己也成了真理的「柱石和根基」。柱子把屋頂高舉起來，讓遠處的人看得見；底座把房子穩住，讓風吹不倒。教會的工作，一是高舉真理，二是守住真理。</p><p>但這一句不是說教會在真理之上。柱子不製造屋頂，底座也不發明房子。真理是神的道——「你的道就是真理」（約 17:17）；教會是被託付來撐住它的。所以庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），連使徒的話都要對照經文。一個教會若把自己的傳統放在神的話之上，它就不再是柱子，而成了另一座亞底米廟。</p>"},{"a":16,"z":16,"star":3,"grk":"<p lang=\"grc\">καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.</p>","lit":"<p>並且公認地，那敬虔的奧祕是大的：那一位在肉身裡被顯明，在靈裡被稱義，被天使們看見，在列國中被傳揚，在世界裡被相信，在榮耀裡被接上去。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁμολογουμένως</td><td>homologoumenōs</td><td>公認地</td><td>眾人同聲承認；和合本「無人不以為然」</td></tr><tr><td>μέγα</td><td>mega</td><td>大的</td><td>對照徒 19:28 的 Μεγάλη ἡ Ἄρτεμις Ἐφεσίων</td></tr><tr><td>τὸ τῆς εὐσεβείας μυστήριον</td><td>to tēs eusebeias mystērion</td><td>那敬虔的奧祕</td><td>εὐσέβεια 追蹤的翻轉一：敬虔的源頭是基督</td></tr><tr><td>Ὃς ἐφανερώθη ἐν σαρκί</td><td>Hos ephanerōthē en sarki</td><td>那一位在肉身顯現</td><td>SBLGNT 作 Ὃς；和合本照 θεὸς</td></tr><tr><td>ἐδικαιώθη ἐν πνεύματι</td><td>edikaiōthē en pneumati</td><td>在靈裡被稱義</td><td>復活是神的宣判</td></tr><tr><td>ἀνελήμφθη ἐν δόξῃ</td><td>anelēmphthē en doxē</td><td>在榮耀裡被接上去</td><td>與徒 1:2「被接上升」同字</td></tr></table>","gram":"<p><strong>3:16 是本卷第二處頌讚，也是全卷的最高點。</strong>καὶ ὁμολογουμένως μέγα ἐστὶν（kai homologoumenōs mega estin）：ὁμολογουμένως（homologoumenōs） 是「眾口同聲地」，與「認信」同字根，和合本譯「無人不以為然」。μέγα（mega） 這個字在以弗所特別響亮：群眾喊的正是 Μεγάλη ἡ Ἄρτεμις Ἐφεσίων（Megalē hē Artemis Ephesiōn）。保羅回答：真正「大」的，是 τὸ τῆς εὐσεβείας μυστήριον（to tēs eusebeias mystērion）。</p><p>接下來是六行詩。六個不定過去式被動動詞，各帶一個場景，兩兩成對，在地與天之間來回：</p><blockquote><p>Ὃς ἐφανερώθη ἐν σαρκί（Hos ephanerōthē en sarki）——在肉身顯現（地）<br>ἐδικαιώθη ἐν πνεύματι（edikaiōthē en pneumati）——被聖靈稱義（天）<br>ὤφθη ἀγγέλοις（ōphthē angelois）——被天使看見（天）<br>ἐκηρύχθη ἐν ἔθνεσιν（ekērychthē en ethnesin）——被傳於外邦（地）<br>ἐπιστεύθη ἐν κόσμῳ（episteuthē en kosmō）——被世人信服（地）<br>ἀνελήμφθη ἐν δόξῃ（anelēmphthē en doxē）——被接在榮耀裡（天）</p></blockquote><p>排列是地天、天地、地天：三組對句交錯往返，從道成肉身到升天，把基督的一生唱成一首歌。六個動詞都是被動語態——行動的是神：神顯明他、稱他為義、使他被傳揚、接他回去。「被聖靈稱義」和合本另有小註「或譯：在靈性稱義」；一般讀作復活時神為他伸冤、宣告他為義（這使我們想起「因從死裡復活，以大能顯明是神的兒子」（羅 1:4））。</p><p><strong>經文鑑別：全卷最重要的異文。</strong>第一行的開頭，古卷有三種讀法：</p><blockquote><p>①<strong>Ὃς（Hos）</strong>，「那一位」：西乃抄本原筆與幾份最早的大寫抄本、多數古譯本與教父引文；SBLGNT、WH、Tregelles、NA28 都採這一讀。<br>②<strong>θεὸς（theos）</strong>，「神」：後來的抄本校正與大多數拜占庭抄本；RP（多數本）與 TR 採這一讀，和合本「神在肉身顯現」照此翻譯。<br>③<strong>ὃ（ho）</strong>，「那事」：少數西方抄本與拉丁譯本，使關係代名詞與中性的 μυστήριον（mystērion） 一致。</p></blockquote><p>為甚麼多數學者判斷 Ὃς（Hos） 是原文？其一，最早的見證支持它。其二，大寫抄本裡，「那一位」與縮寫的「神」只差中間一橫和頂上一條縮寫線，抄寫時容易加上，不容易漏去。其三，Ὃς（Hos） 是「較難的讀法」：陽性代名詞前面沒有先行詞，文法上突兀；抄寫者若要修順，改成 ὃ（ho） 配合 μυστήριον（mystērion），或改成 θεὸς（theos） 補上主詞，都很自然；反過來把順的改成難的，就很難解釋。而這個突兀正好說明：保羅在這裡引了一首早期教會的詩，詩一開口就是「那一位」——腓 2:6、西 1:15 的基督頌，也都以「他」起頭。</p><p>本講義的判斷：Ὃς（Hos） 很可能是原文；和合本照 θεὸς（theos） 翻譯，也有它的抄本根據。但兩種讀法說的都是同一位基督。「那一位在肉身顯現」本身就預設了他在顯現以前已經存在；而基督的神性也不靠這一節成立——「道就是神」（約 1:1），「道成了肉身」（約 1:14），「神本性一切的豐盛都有形有體地居住在基督裡面」（西 2:9）。異文改變的是這一節的措辭，不是這一位的身分。</p>","exp":"<p>「大哉，敬虔的奧祕，無人不以為然」（3:16）。保羅剛講完教會的秩序——誰可以作監督、誰可以作執事、家該怎樣帶——忽然停下來唱歌。這是本卷的第二處頌讚。規條講到最後，保羅不讓讀者停在規條上，他抬起頭，指向一個人。</p><p>這首詩回答了 3:15 留下的問題：柱石撐起的「真理」是甚麼？不是一套家規，不是一份組織章程，是一位基督。「敬虔」在本卷是一條主線：2:2 說要「敬虔、端正、平安無事地度日」（2:2），4:7 要「在敬虔上操練自己」（4:7）。但 3:16 先把敬虔的源頭說清楚：敬虔不是從我們的努力開始的，是從「神在肉身顯現」（3:16）開始的。人能敬虔，是因為神先向人顯明了自己。這是「敬虔」這個字在全卷的第一次翻轉。</p><p>六行詩從肉身寫到榮耀，從馬槽寫到升天。中間兩行最值得以弗所人細聽：「被傳於外邦，被世人信服」（3:16）。2:4 說神願意萬人得救，這裡說這件事已經在發生：外邦人聽見了，世人信服了。以弗所城裡那些燒掉法術書的人（徒 19:19），就是這兩行詩的活見證。</p><p>群眾曾經喊「大哉，以弗所人的亞底米啊！」（徒 19:28），保羅回答「大哉，敬虔的奧祕」（3:16）。一個是人手所造、要靠柱子撐住的女神；一個是自己顯現、被接在榮耀裡的主。亞底米需要廟來保護她，基督卻反過來撐住他的家。教會是真理的柱石，但柱石撐起的不是教會自己的榮耀，是他。</p><p>讀到這裡，第 3 章的條件也有了新的光。監督要無可指責，執事要先受試驗，不是因為教會要一群完美的人，而是因為這群人站在一位完美的主旁邊。321 說「讓耶穌得著一切的榮耀」，在這一章，這句話落在最具體的地方：一個在家中專一、在酒桌旁節制、在教外有好名聲的人，就是在自己的肉身裡，讓人看見那一位曾經在肉身顯現的主。</p>"}],"4":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων</p><p lang=\"grc\">ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν,</p>","lit":"<p>但那靈明明地說：在後來的時期裡，有些人要離開那信仰，專注於迷惑人的靈和鬼魔的教訓，</p><p>在說謊話之人的假冒裡，他們是那些自己的良心已經被烙鐵烙過的人，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τὸ δὲ πνεῦμα ῥητῶς λέγει</td><td>To de pneuma rhētōs legei</td><td>但那靈明明地說</td><td>ῥητῶς 新約僅此一次：清清楚楚、說出口的</td></tr><tr><td>ἐν ὑστέροις καιροῖς</td><td>en hysterois kairois</td><td>在後來的時期</td><td>καιρός 是時機、時期，不是日曆上的某一天</td></tr><tr><td>ἀποστήσονταί</td><td>apostēsontai</td><td>他們要離開</td><td>未來式；字根「站開」，與「背道」同源</td></tr><tr><td>πνεύμασι πλάνοις</td><td>pneumasi planois</td><td>迷惑人的靈</td><td>πλάνος：使人走岔路的；與「行星」同字根</td></tr><tr><td>ψευδολόγων</td><td>pseudologōn</td><td>說謊話的人</td><td>長複合字：「假」＋λόγος 話；新約僅此一次</td></tr><tr><td>κεκαυστηριασμένων</td><td>kekaustēriasmenōn</td><td>已被烙鐵烙過的</td><td>字典形 καυστηριάζω；完成式被動分詞：烙印已成，至今還在</td></tr><tr><td>συνείδησιν</td><td>syneidēsin</td><td>良心</td><td>1:5、1:19「無虧的良心」在這裡跌到谷底</td></tr></table>","gram":"<p><strong>3:16 以頌讚收住「敬虔的奧祕」，4:1 用一個 δὲ（de） 轉身：柱石撐起的是基督，但同一個家裡，已經有人站開了。</strong></p><p>Τὸ δὲ πνεῦμα ῥητῶς λέγει（To de pneuma rhētōs legei） 的動詞 λέγει（legei） 是現在式：聖靈「正在說」。保羅沒有說是哪一次說的，可能是舊約、主耶穌的話（太 24:11），也可能是教會中的先知（徒 20:29–30 保羅自己就對以弗所長老預言過）。重點是 ῥητῶς（rhētōs）：不是暗示，是說得明明白白。</p><p>ἐν ὑστέροις καιροῖς（en hysterois kairois） 用的是 καιρός（kairos），不是 χρόνος（chronos）。前者是「時期、時機」，後者是可以計算的時間長度。新約把基督第一次來到第二次來之間整段日子都叫作末後：「就在這末世藉著他兒子曉諭我們」（來 1:2）。所以保羅說的「後來的時候」，正是提摩太在以弗所當下面對的處境——4:6 立刻要他把「這些事」提醒弟兄。</p><p>4:2 的主詞換了：4:1 是「有些人」離棄，4:2 是 ἐν ὑποκρίσει ψευδολόγων（en hypokrisei pseudologōn），在說謊之人的假冒裡。被迷惑的人與迷惑人的人分開說，前者需要提醒，後者已經烙了印。κεκαυστηριασμένων（kekaustēriasmenōn） 是完成式被動分詞，可以讀作「被烙麻木了」（燒灼過的皮肉不再有感覺），也可以讀作「被烙上記號」（奴隸、罪犯身上的烙印，標明他屬誰）。兩讀可以並存：良心被烙到不痛，也被烙上了另一個主人的印。</p>","exp":"<p><strong>「聖靈明說，在後來的時候，必有人離棄真道」（4:1）——這不是一張預測末日的時間表，是一張給當下的警示牌。</strong></p><p>許多人讀到「後來的時候」，第一個反應是對照新聞，推算世界還剩多少年。保羅的寫法不容許這樣用。他沒有給任何年份，也沒有給任何徵兆的清單；他說的是一種現象：有人要離開，而且離開的方式很屬靈——他們聽的是「靈」，信的是「道理」，只是那靈是引誘人的，那道理是鬼魔的。本講義不在這裡算日子，也不把哪一年、哪一個事件放進這一節；這一節的用處，是叫每一個世代的教會都醒著。</p><p>更值得注意的是 4:2 的那一幅畫：「這等人的良心如同被熱鐵烙慣了一般。」（4:2）燒傷過的皮膚會結成硬疤，摸上去沒有感覺。良心起初是會痛的：說第一次謊會心跳，說第十次就順口了。保羅在 1:19 說有人「丟棄良心」，就在真道上如同船破壞了；到這裡，良心不是被丟掉，而是被燒到不再發聲。這是全卷的一個谷底。</p><p>為甚麼說謊的人能教出「屬靈」的道理？因為假冒最擅長穿上敬虔的外衣。這一點要記住，下一節的「禁止」看起來非常嚴格、非常聖潔，正因為如此才危險。</p><p>對今天的讀者，這兩節的提醒很簡單：一顆還會痛的良心是恩典。當聖靈在你裡面說「這樣不對」，那份不舒服不是敵人；真正可怕的是不再不舒服。保護良心的柔軟，比計算末日的日期重要得多。</p>"},{"a":3,"z":3,"star":3,"grk":"<p lang=\"grc\">κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.</p>","lit":"<p>禁止嫁娶，要人遠離食物——就是神所造、為了讓那些信而且認識真理的人帶著感謝領受的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κωλυόντων</td><td>kōlyontōn</td><td>禁止的</td><td>現在分詞：一直在攔阻、不准</td></tr><tr><td>γαμεῖν</td><td>gamein</td><td>嫁娶</td><td>現在不定詞：結婚這件事本身</td></tr><tr><td>ἀπέχεσθαι βρωμάτων</td><td>apechesthai brōmatōn</td><td>遠離食物</td><td>βρῶμα：食物，不只是肉</td></tr><tr><td>ἔκτισεν</td><td>ektisen</td><td>他創造了</td><td>不定過去式：主詞是 ὁ θεὸς</td></tr><tr><td>εἰς μετάλημψιν</td><td>eis metalēmpsin</td><td>為了領受</td><td>新約僅此一次：分享、有份</td></tr><tr><td>μετὰ εὐχαριστίας</td><td>meta eucharistias</td><td>帶著感謝</td><td>與「聖餐」的字同根：感恩</td></tr></table>","gram":"<p><strong>4:3 有兩個不定詞：γαμεῖν（gamein） 與 ἀπέχεσθαι（apechesthai），前一個由 κωλυόντων（kōlyontōn）「禁止」直接帶出，後一個在文法上要補一個「吩咐」——這是修辭學的軛式省略：一個動詞管兩件事，後一件要讀者自己補上。</strong></p><p>κωλυόντων（kōlyontōn） 是現在分詞，和 4:2 的 ψευδολόγων（pseudologōn） 同格，描寫同一群人：他們的特徵是「禁止」。這一節的關鍵字就是這個動詞，不是「嫁娶」也不是「食物」。保羅反對的不是有人不結婚、有人不吃肉，而是有人把「不准」立成規條，叫信徒以為守了禁戒才夠屬靈、才能得救。</p><p>關係子句 ἃ ὁ θεὸς ἔκτισεν（ha ho theos ektisen） 把食物（在文法上也把整件事）放回創造：這些東西是神造的。εἰς μετάλημψιν μετὰ εὐχαριστίας（eis metalēmpsin meta eucharistias） 說出神造它的目的：為了讓人帶著感謝領受。受詞落在 τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν（tois pistois kai epegnōkosi tēn alētheian）：信而且認識真理的人。這不是說不信的人不能吃，而是說，真正明白神是創造主的人，才知道怎樣吃——帶著感謝吃。</p><p>以弗所的假教訓可能混合了猶太潔淨條例（1:7「想要作教法師」）與某種輕看身體、輕看物質的思想；西 2:20–23 那一串「規條」是同一類。學者對其來源意見不一，本講義只依經文自己說的判斷：問題在禁止。</p>","exp":"<p>〔林前〕林前 8:1--13（哥林多前書講義第 8 章）</p><p><strong>「他們禁止嫁娶，又禁戒食物」（4:3）——錯不在婚姻或飲食的選擇，錯在那個「禁止」。</strong></p><p>這一節必須讀準，否則很容易誤傷人。保羅自己沒有結婚，主耶穌也稱許為天國的緣故不娶的人；初期教會有禁食禱告的傳統（徒 13:3「於是禁食禱告」）。所以 4:3 不是說凡選擇獨身、選擇吃素、選擇禁食的人都中了鬼魔的道理。一位為了健康吃素的弟兄，一位為了專心禱告而禁食三天的姊妹，一位甘心單身服事的同工，都不在這一節所責備的範圍裡。</p><p>保羅責備的，是把禁戒立為「條件」：不守就不夠屬靈，不守就不能得救，不守就要被定罪。羅馬書說得最清楚：「吃的人不可輕看不吃的人；不吃的人不可論斷吃的人」（羅 14:3）。選擇是自由，強加才是捆綁。哥林多前書講義第 8 章談祭偶像之物時已立下同樣的原則：食物本身不能叫神看中我們，但愛心叫我們為軟弱的弟兄調整自己——那是出於愛的自願，不是出於恐懼的禁令。</p><p>同樣的分寸也適用於別的宗教。佛教、道教的素食與齋戒，有它們自己的傳統與誠意，本講義不拿來嘲笑，也不拿這一節作攻擊別人信仰的工具。4:3 處理的是教會裡面的事：有人在基督的福音上加了一條「禁止」，叫恩典變成條件。</p><p>這一節的鑰匙在後半句：這些都是神所造的，要「感謝著領受」。健康的信仰不是一份越來越長的禁止清單，而是一顆越來越會感謝的心。</p>"},{"a":4,"z":5,"star":2,"grk":"<p lang=\"grc\">ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,</p><p lang=\"grc\">ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.</p>","lit":"<p>因為神所造的一切都是好的，沒有一樣是可丟棄的，只要帶著感謝被領受；</p><p>因為它藉著神的話和祈求被分別為聖。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πᾶν κτίσμα θεοῦ καλόν</td><td>pan ktisma theou kalon</td><td>神的一切受造之物都是好的</td><td>追蹤字 καλός：呼應創 1:31「甚好」</td></tr><tr><td>ἀπόβλητον</td><td>apoblēton</td><td>可丟棄的</td><td>新約僅此一次：可以扔掉的</td></tr><tr><td>λαμβανόμενον</td><td>lambanomenon</td><td>被領受</td><td>現在被動分詞；條件：帶著感謝</td></tr><tr><td>ἁγιάζεται</td><td>hagiazetai</td><td>被分別為聖</td><td>現在式被動：每一次都是</td></tr><tr><td>ἐντεύξεως</td><td>enteuxeōs</td><td>祈求</td><td>與 2:1「祈求」同字：近前來向神說話</td></tr></table>","gram":"<p><strong>4:4 用 ὅτι（hoti） 開頭，4:5 用 γὰρ（gar） 開頭：兩個理由疊在一起，回答 4:3「為甚麼不可禁止」。</strong></p><p>第一個理由是創造：πᾶν κτίσμα θεοῦ καλόν（pan ktisma theou kalon）。句中沒有動詞，名詞句的語氣像一句宣告。καλόν（kalon） 是本卷追蹤字 καλός（kalos） 的一站，回到創世記第一章那一句反覆的評語。和合本「神看著一切所造的都甚好」（創 1:31），七十士譯本那裡正是用 καλὰ λίαν（kala lian）；保羅的話是從創世記長出來的。</p><p>第二個理由是成聖：ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως（hagiazetai gar dia logou theou kai enteuxeōs）。現在式被動，主詞是 4:4 那「一切受造之物」。兩個媒介並列：λόγου θεοῦ（logou theou） 與 ἐντεύξεως（enteuxeōs）。「神的道」多數註釋讀作神在創造中所說「甚好」的話，或飯前禱告常用的經文；「祈求」就是感謝的禱告。神先說話，人回應以禱告，食物就從「普通」被放回「屬神」的位置。</p><p>條件分詞 μετὰ εὐχαριστίας λαμβανόμενον（meta eucharistias lambanomenon） 要注意：不是任何吃法都可以，是「帶著感謝」被領受。感謝把受造之物和創造主重新接上。</p>","exp":"<p>〔林前〕林前 8:4--8（哥林多前書講義第 8 章）</p><p><strong>「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的」（4:4）——禁慾主義說世界是陷阱，保羅說世界是禮物。</strong></p><p>禁止嫁娶、禁戒食物的人，背後常有一種看法：身體與物質是低等的，越遠離越屬靈。保羅用創世記第一章拆掉這個看法。神造天地，每一天都說好；婚姻是神在伊甸園親自設立的，食物是神親手給人的。拒絕這些禮物，不是比神更聖潔，而是在說神的作品有瑕疵。</p><p>那麼，「都因神的道和人的祈求成為聖潔了」（4:5）是甚麼意思？這不是說食物本來不潔，要禱告去「消毒」；也不是說飯前禱告有一種魔法，可以把任何東西變成可吃的。它的意思是：一頓飯，經過神的話（神說這是好的）與人的感謝（我承認這是從你來的），就被分別出來，成為敬拜的一部分。飯前禱告的真正作用，是把一張普通的餐桌，變成一個想起創造主的地方。</p><p>哥林多前書講義第 8 章處理過一個相近的問題：祭過偶像的肉能不能吃。保羅在那裡說偶像算不得甚麼，食物本身不能使人與神更近或更遠；但他也提醒，若我的自由叫軟弱的弟兄跌倒，我寧可不吃。兩處放在一起，原則就清楚了：受造之物本身是好的，要感謝著領受；而愛心可以叫我自願放下某些自由——自願，而不是被禁止。</p><p>華人家庭常有「吃飯皇帝大」的說法。這兩節給了一個更美的次序：吃飯之前，先向那位真正的王說謝謝。</p>"},{"a":6,"z":6,"star":1,"grk":"<p lang=\"grc\">Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος Χριστοῦ Ἰησοῦ, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,</p>","lit":"<p>你把這些事擺在弟兄們面前，就會是基督耶穌的好僕役，一直在那信仰的話語和你一路跟隨的那美好教訓上被餵養。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑποτιθέμενος</td><td>hypotithemenos</td><td>擺在面前、提醒</td><td>不是下命令，是把東西放到人腳前</td></tr><tr><td>καλὸς ἔσῃ διάκονος</td><td>kalos esē diakonos</td><td>你就會是好僕役</td><td>追蹤字 καλός；διάκονος 這裡指一般的服事者</td></tr><tr><td>ἐντρεφόμενος</td><td>entrephomenos</td><td>一直被餵養</td><td>現在分詞：從小吃到大</td></tr><tr><td>παρηκολούθηκας</td><td>parēkolouthēkas</td><td>你一路跟隨的</td><td>完成式：一直跟到如今</td></tr></table>","gram":"<p><strong>4:6 把 4:1–5 收成一個字 Ταῦτα（Tauta）「這些事」，再交給提摩太：他的工作不是自己發明新的道理，而是把已經說明白的擺在弟兄面前。</strong></p><p>ὑποτιθέμενος（hypotithemenos） 字面是「放在底下」，引申為建議、提醒，語氣溫和。保羅沒有用 4:11 那個較強的 Παράγγελλε（Parangelle），這裡先用軟的字：好的服事者先是提醒的人。主要動詞 καλὸς ἔσῃ διάκονος（kalos esē diakonos） 是未來式：你若這樣做，就會是。διάκονος（diakonos） 在 3:8–13 是執事的職分，在這裡沒有冠詞、後接 Χριστοῦ Ἰησοῦ（Christou Iēsou），指的是廣義的「基督的僕人」。</p><p>ἐντρεφόμενος（entrephomenos） 是現在分詞，字面是「在其中被養大」，與 παρηκολούθηκας（parēkolouthēkas） 的完成式配成一對：提摩太從小被餵養（提後 3:15 說他從小明白聖經），也一路跟從到現在。教別人之前，先是一個一直在吃的人。</p>","exp":"<p><strong>「你若將這些事提醒弟兄們，便是基督耶穌的好執事」（4:6）——好的服事者，先是一個好的學生。</strong></p><p>這一節把「好執事」的標準放得出人意料地樸素。保羅沒有說好執事是口才好、點子多、會帶活動的人；他說，好執事是把真道提醒弟兄的人，而他自己也一直在「真道的話語」和「善道」上「得了教育」。換句話說，他口中說出來的，是他自己天天在吃的東西。</p><p>和合本「得了教育」原文是被餵養。屬靈生命像身體一樣，不是一次吃飽就夠，要天天吃。一位傳道人若只在預備講章時才讀經，他講出來的就像一盤從冰箱拿出來的剩菜；若他自己先每天被神的話餵養，他擺上桌的就是熱的。</p><p>這一節也提醒會眾：提摩太的工作是「提醒」，不是製造新鮮感。一個健康的講台，常常重複那些已經知道的真理。我們不是不知道，而是容易忘記。好的服事者，就是那個不厭其煩幫大家記住的人。</p>"},{"a":7,"z":7,"star":3,"grk":"<p lang=\"grc\">τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·</p>","lit":"<p>但那些褻俗的、老婦式的神話，你要推辭。卻要操練你自己，朝向敬虔；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>βεβήλους</td><td>bebēlous</td><td>褻俗的</td><td>字根「門檻」：在聖所門外的、平常的</td></tr><tr><td>γραώδεις μύθους</td><td>graōdeis mythous</td><td>老婦式的神話</td><td>新約僅此一次；當時的諷刺語，指荒誕故事</td></tr><tr><td>παραιτοῦ</td><td>paraitou</td><td>推辭、拒絕</td><td>現在式命令：一再推掉</td></tr><tr><td>γύμναζε</td><td>gymnaze</td><td>要操練</td><td>字典形 γυμνάζω；現在式命令：天天練</td></tr><tr><td>πρὸς εὐσέβειαν</td><td>pros eusebeian</td><td>朝向敬虔</td><td>全卷主追蹤字 εὐσέβεια：操練的方向</td></tr></table>","gram":"<p><strong>4:7 是兩個命令的對照：τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ（tous de bebēlous kai graōdeis mythous paraitou），γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν（gymnaze de seauton pros eusebeian）。一個推開，一個拿起；兩個 δὲ（de） 把它們並排。</strong></p><p>μύθους（mythous） 呼應 1:4「荒渺無憑的話語」，是假教師愛講的那些神話與家譜。γραώδεις（graōdeis） 是當時哲學家罵人的慣用語，意思是「只配老太太在爐邊講的故事」，重點是荒誕、無益，不是貶低年長的婦女——5:2 保羅要提摩太待老年婦女「如同母親」。</p><p>γύμναζε（gymnaze） 的字根就是 γυμνάσιον（體育場），英文 gymnasium 由此而來。希臘城市都有體育場，青年在那裡赤身（γυμνός（gymnos））長年訓練。現在式命令表示持續的動作：不是參加一次營會，而是天天上場。受詞 σεαυτὸν（seauton） 是反身代名詞：操練的對象是你自己，不是你的會眾。</p><p>介系詞 πρὸς（pros） 標出方向：朝向 εὐσέβεια（eusebeia）。這個字在 2:2 是教會在社會中的樣子，在 3:16 是「敬虔的奧祕」——那裡已經說明，敬虔的源頭是基督自己。所以 4:7 的操練不是靠意志把自己練成聖人，而是天天朝向那一位已經顯現在肉身的基督。追蹤字在這裡從「奧祕」轉向「操練」：被恩典啟示的，要在生活裡練出來。</p>","exp":"<p><strong>「只是要棄絕那世俗的言語和老婦荒渺的話，在敬虔上操練自己。」（4:7）——敬虔不是一種氣質，是一門要天天練的功課。</strong></p><p>許多人以為敬虔是天生的：有些人個性安靜、說話溫柔，看起來就很屬靈。保羅用的字推翻了這個印象。他借用的是體育場的語言。一個運動員不會因為穿上球衣就會打球，他要每天跑、每天練，在重複中把動作練進身體裡。敬虔也一樣：禱告、讀經、認罪、饒恕、守住口舌，都要在一次又一次的重複中，成為一個人的第二天性。</p><p>但操練有兩面。第一面是「棄絕」：推開那些荒誕無益的話。時間是有限的，一個人若把精神花在追逐新奇的說法、無休止的爭論，就沒有力氣上場練真功夫。第二面才是「操練」。先放下，才拿得起。</p><p>還要注意：保羅說操練的方向是敬虔，而敬虔的根是 3:16 那位「在肉身顯現」的基督。操練不是叫我們靠自己的努力爬上神那裡，而是在恩典裡回應恩典。運動員練習，是因為他已經是隊上的一員；信徒操練，是因為他已經屬於基督。</p><p>321 講「操練」時，會談到每天在神、人、己三方面的功課。這是很好的應用，但次序要清楚：4:7 先說的是操練敬虔本身，經文的重點是方向（朝向敬虔）與方式（天天、持續、對自己）。任何一套操練的方法，都只是幫助我們走這一條路的工具，不是這一節經文要證明的對象。先讓保羅說完：你要在敬虔上操練自己。</p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.</p>","lit":"<p>因為身體的操練，對少許的事是有益的；但敬虔對一切的事都是有益的，帶著今生和那將來之生命的應許。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σωματικὴ γυμνασία</td><td>sōmatikē gymnasia</td><td>身體的操練</td><td>名詞 γυμνασία 新約僅此一次</td></tr><tr><td>πρὸς ὀλίγον</td><td>pros oligon</td><td>對少許的事</td><td>可讀作「範圍小」或「時間短」</td></tr><tr><td>ὠφέλιμος</td><td>ōphelimos</td><td>有益處的</td><td>教牧書信特有的字；兩次出現在這一節</td></tr><tr><td>πρὸς πάντα</td><td>pros panta</td><td>對一切的事</td><td>與 πρὸς ὀλίγον 對仗</td></tr><tr><td>ζωῆς τῆς νῦν καὶ τῆς μελλούσης</td><td>zōēs tēs nyn kai tēs mellousēs</td><td>今生和將來的生命</td><td>一個 ζωή 跨兩個時代</td></tr></table>","gram":"<p><strong>4:8 是一組工整的對句：ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος（hē gar sōmatikē gymnasia pros oligon estin ōphelimos），ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν（hē de eusebeia pros panta ōphelimos estin）。主詞對主詞，πρὸς ὀλίγον（pros oligon） 對 πρὸς πάντα（pros panta），同一個形容詞 ὠφέλιμος（ōphelimos） 出現兩次。</strong></p><p>和合本把這一節加上引號，因為 4:9 說「這話是可信的」，多數學者認為 4:8 可能是當時流傳的一句格言，保羅引來加以發揮。πρὸς ὀλίγον（pros oligon） 有兩種讀法：範圍上「對少數的事」，或時間上「短暫地」（雅 4:14 用 πρὸς ὀλίγον（pros oligon） 說人生如雲霧「出現少時」）。兩讀都通，而且互相補足：身體的操練幫到的範圍有限，也只幫到今生。</p><p>關鍵是比較，不是否定。ὠφέλιμος（ōphelimos） 用在兩邊，表示身體的操練「也是有益的」，只是程度與範圍不同。後半句的分詞 ἔχουσα（echousa） 說明理由：敬虔帶著應許，橫跨 ζωῆς τῆς νῦν καὶ τῆς μελλούσης（zōēs tēs nyn kai tēs mellousēs）——一個生命，兩個時代。</p>","exp":"<p><strong>「操練身體，益處還少；惟獨敬虔，凡事都有益處，因有今生和來生的應許。」（4:8）——少，不是沒有。</strong></p><p>這一節常被兩種人誤用。第一種人拿它當不運動的理由：「聖經說操練身體益處還少。」但保羅說的是「少」，不是「沒有」，更不是「有害」。他在這裡承認身體操練的價值，只是把它放在一個比較的天平上。照顧身體、規律運動、好好睡覺，都是對神所造的身體負責任；4:4 才說過，凡神所造的物都是好的。</p><p>第二種人把它倒過來，把健身當成一種信仰。現代人很能為了身材早起，為了數據節食，卻很難為了禱告早起。保羅的提醒正是在這裡：身體操練的果效，最多陪我們走完今生；敬虔的果效，從今生一直延伸到來生。一位每天上健身房卻從不打開聖經的人，就像一個把大部分錢存在明年就會倒閉的銀行裡的人。</p><p>「凡事都有益處」也要讀準。敬虔不保證發財、升官、萬事順利；6:5 保羅會責備那些「以敬虔為得利的門路」的人。敬虔的益處是應許的益處：今生有神同在，來生有永遠的生命。這是最實際的投資觀：把時間與心力，放在一個不會在死亡那一天歸零的帳戶裡。</p>"},{"a":9,"z":10,"star":3,"grk":"<p lang=\"grc\">πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος,</p><p lang=\"grc\">εἰς τοῦτο γὰρ κοπιῶμεν καὶ ὀνειδιζόμεθα ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.</p>","lit":"<p>這話是可信的，配得一切的接納。</p><p>因為我們正是為此勞苦並且受辱罵（另有抄本：努力奮鬥），因為我們已經把指望放在永活的神身上，他是一切人的救主，尤其是信的人的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πιστὸς ὁ λόγος</td><td>pistos ho logos</td><td>這話是可信的</td><td>教牧書信五句可信的話之一（1:15；3:1）</td></tr><tr><td>κοπιῶμεν</td><td>kopiōmen</td><td>我們勞苦</td><td>勞累到筋疲力竭</td></tr><tr><td>ὀνειδιζόμεθα</td><td>oneidizometha</td><td>我們受辱罵</td><td>SBLGNT 讀法；另一讀法是「努力奮鬥」</td></tr><tr><td>ἠλπίκαμεν</td><td>ēlpikamen</td><td>我們已經寄望</td><td>完成式：指望早已放下，至今不改<

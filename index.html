["p","每一個都說，我可以替你傳話。每一個都要收一點錢。"],["p","保羅說：不必了。神和人中間，只有一位。"],["q","到神面前，不需要層層轉介。因為已經有一位，站在中間。"],["p","請你再聽一個小地方：「降世為人的基督耶穌」。"],["p","原文的次序，是把「人」這個字放在最前面。"],["p","中保要兩邊都碰得到。他是神，能代表神向人說話。"],["p","他是人，能代表人站在神面前。"],["p","所以你禱告的時候，不是對著一片遙遠的天喊。"],["p","你是靠著一位懂你的人開口。"],["p","那第一節的代求呢？並不衝突。我們彼此代禱，是一起到同一位神面前，靠同一位中保。"],["p","代禱的人不是另一層中介，是一起敲門的家人。"],["p","華人敬重祖先，經文也吩咐我們孝敬父母。孝敬是應當的。"],["p","這一句不是用來嘲笑誰的，是用來告訴每一個人：路已經開了。"],["p","講台上的同工，這一節也對我們說話。"],["p","我們不是會眾和神之間的那一層。我們只是指路的人。"],["p","坐在下面的弟兄姊妹，你也不必覺得，要牧師替你禱告才比較有效。"],["p","牧師的禱告，不比你的禱告更靠近神一點。"],["q","同一位中保，同一扇門，同樣近。"],["p","這一位中保，是怎麼站到中間去的？"],["q","「他捨自己作萬人的贖價，到了時候，這事必證明出來。」（2:6）"],["p","「贖價」，ἀντίλυτρον，整本新約只在這裡出現一次。"],["p","贖價，就是付給主人、換回一個奴隸自由的那一筆錢。"],["q","「並且要捨命作多人的贖價。」（可 10:45）"],["p","請你聽那個動詞：他捨了自己。"],["p","他付出去的，不是一筆錢，不是一隻鴿子，是他自己。"],["p","那位母親買了一隻鴿子，還是不知道女神收了沒有。"],["p","這一位中保把自己交出去，神說：我收了。"],["p","國度321常說無己。它的源頭不在我們的意志力。"],["p","在這一句：他捨自己。無己，先是基督的樣子，然後才是我們的操練。"],["q","「我為此奉派作傳道的，作使徒，作外邦人的師傅，教導他們相信，學習真道。我說的是真話，並不是謊言。」（2:7）"],["p","這個從前最排外的法利賽人，如今被派去教外邦人。"],["p","他自己，就是「萬人」的一個活樣本。"],["p","今天站講台的人，不必發誓，可是要活得讓人不必懷疑。"],["p","坐在下面的你，也是這個見證的傳話人。"],["p","在家裡、在公司說真話，就是在替那一位中保作見證。"],["p","請你留意第七節最後的那兩個字：學習。"],["p","神願意人得救，也願意人學。等一下，這個「學」字還要回來。"],["p","弟兄姊妹，接下來這幾節，我知道，有人一聽到就繃緊了。"],["p","有人曾經被它傷過，也有人已經準備好要在這幾節上吵一架。"],["p","所以請你先別急著跳到第十二節。先聽第八節。"],["q","第三步：沉靜學道。"],["q","「我願男人無忿怒，無爭論，舉起聖潔的手，隨處禱告；」（2:8）"],["p","這一段的第一條規矩，是對男人說的。"],["p","而且說的不是誰可以站講台，是禱告的人心裡，不可以有火。"],["p","一雙剛才還指著弟兄罵的手，舉起來禱告，就不聖潔了。"],["p","這雙手這個禮拜簽了甚麼字？在網路上打了甚麼話？"],["p","禱告時舉起來的，就是這一雙手。"],["q","為這段經文吵架，就已經違背了這段經文的第一句。"],["p","不論你的教會怎麼讀第十二節，第八節都站在它前面。"],["p","在最容易吵的經文上不吵，就是無己才能合一最實在的操練。"],["p","然後保羅轉向姊妹，講到妝飾。"],["q","「只要有善行，這才與自稱是敬神的女人相宜。」（2:10）"],["p","他列的是編髮、黃金、珍珠、貴價的衣裳。那是當時富家炫富的全套。"],["p","所以這兩節不是服裝規定。也不是叫弟兄去檢查姊妹的穿著。"],["p","弟兄的功課，第八節已經給了：先管好自己的手和心。"],["p","讓人記得我們的，是我們作了甚麼好事。這一句，弟兄也一樣。"],["p","現在，我們來到最敏感的那兩節。"],["q","「女人要沉靜學道，一味地順服。」（2:11）"],["p","這一節最常被讀漏的，是第一個動詞。"],["q","μανθανέτω。讓她學。"],["p","在那個時代，女人通常是不被教的。"],["p","保羅在一封要當眾念出來的信裡，對女人下的第一個命令，是學。"],["q","這一段不是從「閉嘴」開始的，是從「進來學」開始的。"],["p","再聽「沉靜」這個字。它和第二節「平安無事」裡的安靜，是同一個字根。"],["p","保羅先向全教會要安靜，不是先向姊妹要的。"],["p","安靜，是學生的樣子。在真道面前，我們每一個人都是學生。"],["q","「我不許女人講道，也不許她轄管男人，只要沉靜。」（2:12）"],["p","「轄管」，αὐθεντεῖν，整本新約只出現這一次。"],["p","所以，各家對這一節的讀法不一樣。我把它們並排放在這裡。"],["p","有一讀說，姊妹不擔任向全會眾的權威性教導，也不擔任長老、監督。"],["p","有一讀說，限制只在長老、牧師這一個職分，姊妹可以講道、教導。"],["p","有一讀說，這是針對以弗所當時的處境，有些婦女受了假教訓影響，又還沒有學過。"],["p","還有一讀說，原則是任何人都不可專橫地奪取權柄，男女都一樣。"],["p","各宗派在這件事上，有真誠的不同。這個講台陳列，不裁判。"],["p","所以我們不能用一句「那只是當時的文化」，就把這兩節一筆勾銷。"],["p","我們也不能拿這兩節，看低任何一位姊妹的價值、頭腦、恩賜和屬靈地位。"],["p","還有幾件事，是四種讀法都承認的。"],["p","就在以弗所這一座城，有一對夫妻，把一位很有口才的傳道人接回家裡。"],["q","「百基拉、亞居拉聽見，就接他來，將神的道給他講解更加詳細。」（徒 18:26）"],["p","百基拉的名字，還排在前面。"],["q","不論採哪一讀，都不可以讓一位服事多年的姊妹，覺得自己比較次等。"],["p","她在基督裡的地位，和任何一位弟兄一樣。"],["p","講台上的同工，這兩節給我們的功課，是謙卑地把各家擺出來。"],["p","坐在下面的你，功課是尊重自己的教會，也尊重別的教會的選擇。"],["p","然後，一起回到那一個字：學。"],["q","「因為先造的是亞當，後造的是夏娃，且不是亞當被引誘，乃是女人被引誘，陷在罪裡。」（2:13–14）"],["p","第十三節的創造次序，有人讀成超越文化的原則，有人讀成針對以弗所處境的提醒。"],["p","有人把第十四節，讀成在評估姊妹的頭腦。經文不是這個意思。"],["p","這種讀法在教會歷史上，傷過很多姊妹。可是這一卷書自己就不支持它。"],["p","第一章點名的許米乃和亞歷山大，都是男人。管教他們，是要他們回轉。"],["p","第五章轉去隨從撒但的，是幾位年輕的寡婦。"],["p","偏離真道的，有男也有女。被騙這件事，不分性別。"],["p","再看亞當。「不是亞當被引誘」，不是在誇亞當。"],["p","他沒有被騙，卻吃了。那是明知故犯。"],["q","「這就如罪是從一人入了世界」（羅 5:12）"],["p","那一人，是亞當。兩個人都落在罪裡，兩個人都需要同一位中保。"],["p","保羅舉夏娃，是因為以弗所正有人在騙人。受騙的危險，在沒有好好學過真道的人身上最大。"],["p","保羅在哥林多後書，也用同一個夏娃，提醒整個教會。"],["q","「就像蛇用詭詐誘惑了夏娃一樣。」（林後 11:3）"],["p","那一封信，是寫給全教會的，男男女女都在裡面。"],["p","所以這兩節的解藥，又是那一個字：學。"],["q","被騙的危險不在性別，在不學、不查、只聽轉述。"],["p","「陷在罪裡」，是這一章的最低處。"],["p","可是請你不要停在這裡。下一節馬上說：得救。"],["q","「然而，女人若常存信心、愛心，又聖潔自守，就必在生產上得救。」（2:15）"],["p","「得救」這個字，和第四節「他願意萬人得救」，是同一個字。"],["p","「藉著生產」，各家也有幾種讀法。"],["p","有人讀成那一次生產，就是救主的降生。"],["p","帶進過犯的是一個女人，帶來救主的，也是一個女人。"],["q","「為女子所生」（加 4:4）"],["p","有人讀成神在生產的苦楚裡保全她。"],["p","有人讀成在妻子和母親的呼召裡，活出救恩。"],["p","也有人讀成，這是在回應那些禁止嫁娶的假教師。"],["q","「他們禁止嫁娶」（4:3）"],["p","保羅要姊妹們安心：嫁娶生養，不是屬靈上的次等選擇。"],["p","這一節寫出來的條件，是信心、愛心、聖潔、自守。"],["p","四樣裡面，沒有一樣是生育。"],["p","得救的根據，是第六節那一位捨己的中保，不是任何人的身體能不能生。"],["p","所以我要對你說話——盼望了很多年，懷裡仍然空著的你。"],["p","曾經失去過一個還沒有見面的孩子的你。"],["p","一個人走著單身的路，忠心服事的你。"],["p","這一節沒有把你排除在救恩之外。一點點都沒有。"],["p","寫這封信的保羅，自己也沒有成家。他從來不把成家當成得救的條件。"],["q","神願意萬人得救。「萬人」裡面，沒有少掉你。"],["p","講台上的同工，講這一節的時候，請想一想台下坐著誰。"],["p","坐在下面的你，請記得救恩是一個人站在中間，不是一張要交出去的成績單。"],["p","弟兄姊妹，我們回到那一座廟的石階前。"],["p","那位母親抱著孩子，握著銅錢，找了一層又一層的人。"],["p","她需要有人告訴她："],["q","只有一位神。在神和人中間，只有一位中保。"],["p","這一位中保，不收你的鴿子，也不賣你銀龕。"],["p","他自己就是那一份贖價。他已經付了。"],["p","所以這一章從禱告開始：我們可以為萬人禱告，因為有一條路。"],["p","這一章在得救結束：家的門始終開著，因為有一位站在門口。"],["p","中間那一段難讀的經文，第一句是不吵，第一個命令是學。"],["p","你不必更佩服誰。你只要更認識這一位中保。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，寫下三個名字：一位鄰居，一位同事，一位在位的人。"],["p","不評論他，不替他打分數。只是每天為他說一句：主啊，願他得救，明白真道。"],["p","第二件，下一次你想找人替你傳話給神的時候，自己開口。"],["p","直接說：主耶穌，我靠著你來。"],["p","那一扇門，兩千年前在以弗所開了，今天在這裡也一樣開著。"],["p","我們一起低頭禱告。"]]},"3":{"min":19,"blocks":[["h","《這家就是永生神的教會，真理的柱石和根基》"],["p","弟兄姊妹平安，今天我們一起讀提摩太前書第三章。"],["p","請你和我一起，看一張照片。不要急著翻過去，我們在這張照片上停一會兒。"],["q","土耳其西岸，塞爾丘克城外，一片低窪的沼澤。"],["p","四周長滿了蘆葦，地上積著水，幾隻白鷺站在水邊。"],["p","沼澤中間，立著一根石柱。"],["q","只有一根。"],["p","它是後人把散落的石塊撿回來，一段一段疊起來的。"],["p","請你再看久一點。這根柱子，曾經屬於古代世界的七大奇觀之一。"],["q","以弗所的亞底米大廟。"],["p","據說，它有一百二十七根大理石柱，每一根都比四層樓還高。"],["p","保羅在這座城裡住了將近三年，每天都看得見它。"],["q","「大哉，以弗所人的亞底米啊！」（徒 19:28）"],["p","今天，一百二十七根，只剩一根。站在水裡，撐著空氣。"],["p","可是就在那座大廟還金碧輝煌的時候，保羅寫信給以弗所的一個年輕人，說了一句很大膽的話。"],["q","「這家就是永生神的教會，真理的柱石和根基。」（3:15）"],["p","神的家也有柱子。可是神的家的柱石，不是大理石。"],["q","是活的人。"],["p","這一章有三個詞：工，柱，奧。"],["p","我們今天沿著它走三步：羨慕善工，先受試驗，敬虔的奧祕。"],["p","可是我要先說一件事。這一章常常被當成「選長老、選執事的手冊」。"],["p","請你留意，這封信是寫給提摩太一個人的，卻是要在全會眾面前念出來的。"],["p","當提摩太聽見「作監督的，必須無可指責」，坐在他後面的整個會眾也都聽見了。"],["p","所以今天這篇道，有兩層。一層對站在前面服事的人，一層對坐在這裡的每一位。"],["q","第一步：羨慕善工。"],["q","「人若想要得監督的職分，就是羨慕善工。」這話是可信的。（3:1）"],["p","為甚麼這句話需要擔保？"],["p","因為以弗所教會被自己的領袖傷過。"],["p","保羅當年在米利都的海邊，流著淚對這些長老說過一句話。"],["q","「就是你們中間，也必有人起來說悖謬的話」（徒 20:30）"],["p","一個被領袖傷過的教會，最容易出兩種人。"],["p","一種人把職分當成位子，爭著往上擠。"],["p","另一種人心灰意冷，說：這種事，我再也不碰了。"],["p","保羅對灰心的人說：想要服事不是虛榮。這是一件美好的事。"],["p","對爭位的人，他說：你要的是「工」，不是「位」。"],["p","「監督的職分」，原文 ἐπισκοπῆς，意思是一件看顧人的事。"],["p","它不是一個頭銜，是一份工作。要守夜，要扛擔子，要為人的靈魂交帳。"],["p","「善工」的「善」，καλοῦ，是本卷最愛用的一個字：好，美，合宜。"],["p","這份工作是美的。可是請記住，它仍然是工作。"],["p","坐在台下的弟兄姊妹，也請你聽：你若一直覺得「上面那些人」高你一等，你也把方向看錯了。"],["p","職分既然是工作，不是地位，條件就會不一樣。"],["q","「作監督的，必須無可指責，只作一個婦人的丈夫，有節制，自守，端正，樂意接待遠人，善於教導」（3:2）"],["p","從第二節到第七節，一共十五項。"],["p","十五項裡面，只有一項是能力：善於教導。"],["p","其餘十四項，全部是品格。"],["q","保羅先問的不是「你會甚麼」，而是「你是誰」。"],["p","連那一項能力，也夾在品格的中間。一個人怎麼活，就怎麼教。"],["p","現在我們要在第二項停一下，因為這幾個字很重。"],["q","「只作一個婦人的丈夫」（3:2）"],["p","原文是 μιᾶς γυναικὸς ἄνδρα，直譯是：一個女人的男人。"],["p","歷代對這幾個字，有四種讀法。"],["p","有人說，這是禁止多妻。有人說，這是禁止離婚再婚。"],["p","有人說，連喪偶以後再婚都不可以。"],["p","還有一種讀法說：這是一個對妻子專一、忠誠的人。一心一意的人。"],["p","本講義以最後一讀為主軸，其餘三讀並陳，詳細的討論留在議題頁。"],["p","為甚麼採這一讀？因為清單上其他各項，有節制、自守、端正、溫和，全部都是現在的品格。"],["p","保羅問的是這個人今天的樣子，不是替他翻舊帳。"],["p","一個領袖對妻子忠不忠誠，不是私事。是福音掛在門口的招牌。"],["q","他的心有沒有一個方向？這是這幾個字真正在問的。"],["p","可是弟兄姊妹，我也要很清楚地說另一件事。"],["p","這一節最常被誤用的方式，就是拿來審查人的過去。"],["p","今天在座有人的婚姻破碎過。有人是被背叛、被遺棄的那一方。"],["p","有人再婚了，有人一生單身，那是神親自的帶領。"],["p","這一節不是寫來羞辱你的。講台也不是討論任何一個人婚姻史的地方。"],["p","請你記得，寫這封信的人，剛剛在第一章說過自己是誰。"],["q","「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（1:13）"],["q","「在罪人中我是個罪魁。」（1:15）"],["p","神親手揀選了一個過去最不合格的人，把福音託付給他。"],["p","所以這一節要守護的是忠誠，不是給受過傷的人，再加一道傷。"],["p","再聽第三節開頭：不因酒滋事。"],["p","這一項的重點，是節制。"],["p","保羅在同一封信裡，還勸提摩太因胃病可以稍微用點酒；那是藥用，不是鼓勵。"],["p","所以，不要拿這一節把喝一杯酒的人定罪，也不要把滴酒不沾，當成屬靈的資格。兩邊都越過了經文。"],["p","可是節制也有它的溫度。"],["p","今天這裡，可能有人正在戒酒。也可能有人的家，曾經被酒毀過。"],["p","如果你是這樣的人，我想對你說：你在這個家裡，是被保護的人。"],["q","「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好。」（羅 14:21）"],["p","一位監督的節制，不只是自己不醉，也是為了軟弱的人，甘心不用自己的自由。"],["p","然後，保羅從教會轉回家裡。"],["q","「人若不知道管理自己的家，焉能照管神的教會呢？」（3:5）"],["p","第十五節要說「神的家」。在那之前，保羅先停在一個人自己的家。"],["q","家，是教會的試金石。"],["p","保羅要的不是一個完美的家，是一個好好帶領的父親。有秩序，有尊重，有照顧。"],["p","本講義讀「使兒女凡事端莊順服」，指的是兒女年幼的時候，家裡的秩序。"],["p","成年的兒女若還沒有信主，那不自動使父親失去資格。"],["q","「兒子必不擔當父親的罪孽」（結 18:20）"],["p","有許多忠心的父母，兒女仍然走了遠路。那是他們的眼淚，不是他們的罪狀。"],["p","教會裡若有這樣的爸爸媽媽，請我們用禱告陪他們，不要用眼光審判他們。"],["p","第六節，是這一章最低的地方。"],["q","「初入教的不可作監督，恐怕他自高自大，就落在魔鬼所受的刑罰裡。」（3:6）"],["p","「自高自大」，原文 τυφωθεὶς，字根是煙。"],["p","請你想像一個人站在煙霧裡，自己覺得很高，其實甚麼也看不清楚。"],["p","保羅不是怕新信徒能力不夠。他怕的是，一個人上去得太快。"],["p","掌聲長得比根快。一陣風來，人就倒了。"],["q","驕傲不是從外面來的試探，是從裡面冒出來的煙。"],["p","所以對服事的人，這是一個警告：越被看見，越要回到根上。"],["p","對會眾，這也是一個提醒：不要急著把一個剛信主、很有恩賜的人捧上台。"],["p","第七節，保羅把評審的範圍，擴大到教會外面。"],["q","「監督也必須在教外有好名聲，恐怕被人毀謗，落在魔鬼的網羅裡。」（3:7）"],["p","一個人在教會裡受尊敬，在外面卻人人搖頭，他就給了毀謗的人一張網。"],["p","教會的柱子站在高處，牆內牆外的人，都看得見。"],["p","監督講完了。可是保羅沒有停，他接著說：作執事的，也是如此。"],["p","神的家，不只有大柱子，也有一根一根支撐著地板的小樑。"],["q","第二步：先受試驗。"],["q","「作執事的，也是如此：必須端莊，不一口兩舌，不好喝酒，不貪不義之財」（3:8）"],["p","請你留意，執事的清單裡，沒有「善於教導」。"],["p","可是品格的門檻，一點也沒有降低。"],["p","「不一口兩舌」，就是對這一家說一套，對那一家說另一套。"],["q","「要存清潔的良心，固守真道的奧祕。」（3:9）"],["p","這是執事條件的中心。"],["p","執事不一定站講台，卻必須知道自己相信甚麼，並且活得跟所信的相符。"],["p","以弗所的假教師理論很多，卻把良心丟了。執事正好相反。道理不必花巧，良心卻要乾淨。"],["q","端湯送飯的手，和固守真道的心，是同一個人。"],["p","然後是這一段的鑰匙句。"],["q","「這等人也要先受試驗，若沒有可責之處，然後叫他們作執事。」（3:10）"],["p","「先受試驗」，原文 δοκιμαζέσθωσαν πρῶτον。"],["p","請你聽那個次序：先試驗，再服事。先看見生命，再交付職分。"],["p","試驗不一定是一場考試。很多時候，試驗就是時間。"],["p","讓他先在小事上服事，看他在沒有人看見的地方，是不是一樣忠心。"],["p","教會常犯的一個錯，就是缺人的時候，抓到誰就是誰。"],["q","按立要慢。慢，是對這個人的保護，也是對羊群的愛。"],["p","坐在台下的弟兄姊妹，這一句也是對你說的。"],["p","你今天在做的小事，沒有人掌聲的小事，也許就是神在試驗你，預備你。"],["p","第十一節，有一個翻譯上的問題，我們要誠實地面對。"],["q","「女執事也是如此：必須端莊，不說讒言，有節制，凡事忠心。」（3:11）"],["p","和合本正文寫「女執事」，又在旁邊加註：原文是「女人」。"],["p","所以這一節有兩種讀法。一種是女執事，一種是執事的妻子。"],["q","「我對你們舉薦我們的姊妹非比；她是堅革哩教會中的女執事。」（羅 16:1）"],["p","主張執事妻子的人說：這一節夾在執事的條件中間，下一節又回到執事本人。"],["p","可是也有人留意到，前面講監督的時候，並沒有提到監督的妻子。"],["p","兩邊都有真誠的理由。本講義兩讀並陳，不在講台上裁判。"],["p","這四項條件，和第八節執事的條件，幾乎一條一條對應。"],["p","保羅沒有為姊妹另訂一套比較低，或者比較苛的標準。"],["q","在神的家裡服事的姊妹，與弟兄受同樣的看重。"],["p","「不說讒言」，這四個字值得停一下。"],["p","原文 μὴ διαβόλους，這個字，就是「魔鬼」那個字。"],["p","教會的傷害，很多不是從講台來的。是從客廳、廚房、電話、群組裡來的。"],["p","你可以把一個人的軟弱、一個家的難處交給她，她不會拿去傳。"],["p","這樣的人，不論弟兄還是姊妹，是神的家裡最寶貴的人。"],["q","「因為善作執事的，自己就得到美好的地步，並且在基督耶穌裡的真道上大有膽量。」（3:13）"],["p","這是本章唯一的應許，而且是給最不起眼的那一群人。"],["p","「美好的地步」，原文 βαθμὸν，本來是台階的一級。"],["p","可是保羅說，這一級台階，是「自己」就得到的。"],["p","賞賜不在下一個職位，就在服事本身裡面。"],["q","服事不是梯子。"],["p","一位一生作執事、從來沒有站上講台的弟兄姊妹，"],["p","若是好好地服事了，他在神面前的地步，一點也不比誰低。"],["p","而且他會「大有膽量」。不是口才訓練出來的，是一年一年的忠心累積出來的。"],["p","講到這裡，你可能覺得這一章很沉重。"],["p","保羅好像也知道。所以他放下清單，說了他為甚麼要寫這封信。"],["q","第三步：敬虔的奧祕。"],["q","「我指望快到你那裡去，所以先將這些事寫給你。」（3:14）"],["q","「倘若我耽延日久，你也可以知道在神的家中當怎樣行。」（3:15）"],["p","這是全卷的鑰匙。"],["p","第二、三章的禱告、男女、監督、執事，都在回答同一個問題：在神的家裡，該怎樣生活？"],["p","請你聽，保羅說的是「家」。不是公司，不是機構。"],["q","家規的目的不是控制，是讓一家人能一起活下去。"],["p","然後保羅說：這家就是永生神的教會。"],["p","以弗所人聽到這一句，一定會想起城外山坡上那座大廟。"],["p","保羅說：真正的殿不在城外，就在你們中間。"],["q","「是與聖徒同國，是神家裡的人了；並且被建造在使徒和先知的根基上」（弗 2:19–20）"],["p","在那裡，教會被建造在根基上。在這裡，教會自己成了柱石和根基。"],["p","「柱石」是 στῦλος，把屋頂高高舉起來，讓遠處的人看得見。"],["p","「根基」是 ἑδραίωμα。整本新約，這個字只出現在這裡。"],["p","它是底座。把房子穩住，風吹不倒。"],["p","所以教會的工作有兩件：一件是高舉真理，一件是守住真理。"],["p","可是請你小心，這一句不是說教會在真理之上。"],["p","柱子不製造屋頂，底座也不發明房子。"],["q","「你的道就是真理。」（約 17:17）"],["p","教會是被託付來撐住真理的，不是來改寫真理的。"],["p","一個教會若把自己的傳統放在神的話之上，它就不再是柱子，"],["p","而成了另一座亞底米廟。"],["p","那麼，這些柱子到底撐起了甚麼？"],["p","保羅的回答，不是一段解釋。他停下來，開始唱歌。"],["p","弟兄姊妹，我們在這裡也停下來。"],["q","「大哉，敬虔的奧祕，無人不以為然！就是神在肉身顯現，被聖靈稱義，被天使看見，被傳於外邦，被世人信服，被接在榮耀裡。」（3:16）"],["p","這是這封信的第二處頌讚，也是全卷的最高點。"],["p","保羅忽然不講規條了。他抬起頭，指向一個人。"],["q","柱石撐起的，不是一套規條。是一個人。"],["p","請你聽這一節的頭兩個字：大哉。"],["p","以弗所的群眾喊過：大哉，以弗所人的亞底米啊！"],["p","保羅在這裡回答：大哉，敬虔的奧祕。"],["p","一個是人手所造、要靠一百二十七根柱子撐住的女神。"],["p","另一位，是自己在肉身顯現，又被接在榮耀裡的主。"],["q","亞底米需要廟來保護她。基督卻反過來，撐住他的家。"],["p","這首詩一共六行，從肉身寫到榮耀，從馬槽寫到升天。"],["p","第一行最要緊：神在肉身顯現。"],["p","我要誠實地告訴你，古卷在這裡有兩種寫法。"],["p","多數早期抄本寫「那一位」，Ὃς，就是：那一位在肉身顯現。"],["p","另一系古卷寫「神」，θεὸς，和合本就是照這一系翻的。"],["p","兩種讀法，說的都是同一位基督。而且基督的神性，不是靠這一節才成立的。"],["q","「道成了肉身，住在我們中間」（約 1:14）"],["p","敬虔不是從我們的努力開始的。是從他來開始的。"],["p","再聽中間兩行：被傳於外邦，被世人信服。"],["p","第二章說神願意萬人得救；在這裡，這件事已經在發生了。"],["p","以弗所城裡，那些把法術書搬出來當眾燒掉的人，就是這兩行詩活生生的見證。"],["p","然後是最後一行：被接在榮耀裡。"],["p","弟兄姊妹，現在請你回頭，再看一次那張照片。"],["q","沼澤裡，一根孤零零的石柱。"],["p","神的家的柱子，卻是活的。"],["p","是一個在家裡對妻子專一的丈夫。"],["p","是一個在酒桌旁邊知道節制的人。"],["p","是一個搬了二十年椅子，從來沒有人叫得出名字的執事。"],["p","這些人撐起的，不是自己的名聲，也不是教會的榮耀。"],["q","是那一位在肉身顯現、被接在榮耀裡的主。"],["p","條件那麼高，不是因為教會要一群完美的人，是因為這群人站在一位完美的主旁邊。"],["p","所以，對在前面服事的同工：請你回到第一節。你羨慕的是工，不是位。"],["p","請你在沒有人看見的地方，先受試驗。你的家，是你第一個講台。"],["p","對坐在這裡的每一位：你也是這個家的一根柱子。"],["p","而如果你今天心裡想：我的過去，太不合格了。"],["p","請你記得，寫這封信的人，是一個罪魁。"],["p","神最喜歡用的柱子，常常是從廢墟裡撿回來，再一塊一塊疊起來的。"],["p","國度321空中團契常說：讓耶穌得著一切的榮耀。"],["p","在這一章，這句話落在最具體的地方：你在自己的肉身裡，讓人看見那一位曾經在肉身顯現的主。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，每天早上，把第十六節慢慢念一遍。"],["p","念到「被接在榮耀裡」的時候停一下，對主說：主啊，我這根柱子，是為你站的。"],["p","第二件，想一想教會裡，有沒有一位默默服事很多年的人。"],["p","這個主日散會的時候，走過去，對他說一聲：謝謝你。"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《在敬虔上操練自己》"],["p","弟兄姊妹平安，今天我們一起讀提摩太前書第四章。"],["p","今天我想請你帶一個希臘字回家。只有一個字。"],["q","γύμναζε。"],["p","這個字的意思是：你要操練。"],["p","對，gymnasium，體育場，健身房。就是從這個字來的。"],["p","我們很多人的皮夾裡，都有一張健身房的會員卡。"],["q","清晨六點，健身房的燈亮了。"],["p","有一個人，每天這個時間推門進去。汗水滴在地上，一天也沒有斷過。"],["p","另外一個人，也有一張會員卡。辦卡那一天很興奮，拍了照，發了朋友圈。"],["p","然後那張卡，一直躺在皮夾裡。"],["p","可是半年以後，你一眼就看得出來誰是誰。"],["q","會員卡不會讓人變強壯。上場才會。"],["p","保羅寫信給提摩太，說的正是這個字。"],["q","「在敬虔上操練自己。」（4:7）"],["p","弟兄姊妹，我們受了洗，有了會籍，名字寫在教會的名冊上。"],["p","這些都很寶貴。可是我想輕輕地問一句："],["q","我是天天上場的人，還是皮夾裡只有一張卡的人？"],["p","這封信是寫給一個人的，就是年輕的提摩太。"],["p","可是它要在以弗所全會眾面前，一句一句念出來。"],["p","所以今天這篇信，台上的人要聽，台下的人也要聽。"],["p","這一章有三個字：感，練，樣。"],["p","我們沿著它走三步：感謝著領受，操練敬虔，作信徒的榜樣。"],["q","第一步：感謝著領受。"],["p","第三章剛剛結束在一首詩歌上。"],["q","「大哉，敬虔的奧祕，無人不以為然！」（3:16）"],["p","歌聲還沒有停，第四章第一個字，原文是「但是」。"],["p","柱石撐起的是基督。但是，同一個家裡，已經有人站開了。"],["q","「聖靈明說，在後來的時候，必有人離棄真道，聽從那引誘人的邪靈和鬼魔的道理。」（4:1）"],["p","「明說」，就是說得清清楚楚，不是暗示。"],["p","聖靈的引導，不只是安慰，也包括警告。"],["p","「後來的時候」，很多人一聽，就開始對照新聞，算世界還剩幾年。"],["p","新約把主第一次來到第二次來之間，整段日子都叫作末後。"],["q","所以這不是一張時間表，是一塊警示牌。"],["p","警示牌不是叫你恐慌，是叫你看路。"],["p","再看第二節，這是全卷最低的谷底之一。"],["q","「這等人的良心如同被熱鐵烙慣了一般。」（4:2）"],["p","「烙慣了」，原文 κεκαυστηριασμένων，是被烙鐵燒過，烙印已成，到今天還在。"],["p","良心起初是會痛的。第一次說謊，心會跳。第十次，就順口了。"],["p","弟兄姊妹，一顆還會痛的良心，是恩典。"],["q","真正可怕的，不是會痛，是不再痛了。"],["p","這些良心被烙過的人，教的是甚麼？很奇怪，教的是一套非常嚴格的東西。"],["q","「他們禁止嫁娶，又禁戒食物，就是神所造、叫那信而明白真道的人感謝著領受的。」（4:3）"],["p","這一節，我要讀得很小心。因為它很容易被拿來傷人。"],["p","請你聽清楚這一節的動詞。是「禁止」。"],["p","保羅反對的，不是有人不結婚，也不是有人不吃肉。"],["p","一位為了健康吃素的弟兄，沒有錯。"],["p","一位為了專心禱告，禁食三天的姊妹，沒有錯。"],["p","一位甘心為主守獨身、全心服事的人，更沒有錯。"],["q","錯不在選擇。錯在「禁止」。"],["p","錯在有人把禁戒立成條件：不守，就不夠屬靈；不守，就不能得救。"],["p","羅馬書說得最清楚。"],["q","「吃的人不可輕看不吃的人；不吃的人不可論斷吃的人」（羅 14:3）"],["p","選擇是自由。強加在別人身上，才是捆綁。"],["p","還有一件事。佛教、道教的素食和齋戒，有它們自己的傳統，也有人真誠的心。"],["p","我們不拿這一節去嘲笑任何人的信仰，也不拿它作攻擊別人的工具。"],["p","第四章第三節處理的，是教會裡面的事：有人在恩典上，加了一條「不准」。"],["p","那麼，保羅怎樣回答？他沒有寫一份新的清單，他回到創世記第一章。"],["q","「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的，」（4:4）"],["p","「好的」，原文 καλόν。創世記第一章，神每造一天，就說一次好。"],["q","「神看著一切所造的都甚好。」（創 1:31）"],["p","婚姻，是神在伊甸園親自設立的。食物，是神親手放在人面前的。"],["p","保羅說：世界是禮物。拒絕禮物，不是比送禮的人更聖潔。"],["p","可是請你留意，中間有一個條件：「若感謝著領受」。"],["p","「感謝」，原文 εὐχαριστίας，和教會「聖餐」那個字同一個字根。"],["p","感謝，就是把手上的東西，重新接回到那一位送的人身上。"],["q","「都因神的道和人的祈求成為聖潔了。」（4:5）"],["p","意思是：神先說了，這是好的。我再說，主啊，這是從你來的。"],["p","神的話，加上人的感謝，一頓飯就被分別出來，成了敬拜的一部分。"],["p","我們華人常說：吃飯皇帝大。"],["q","這兩節給我們一個更美的次序：吃飯以前，先向那一位真正的王說謝謝。"],["p","哥林多前書講義第八章講過：食物本身不能叫我們與神更近，也不能更遠；為愛甘心不吃，是愛心，不是禁止。"],["p","所以，健康的信仰，不是一份越來越長的禁止清單。"],["q","是一顆越來越會感謝的心。"],["p","對講台上的人，這是一個提醒：不要把自己的喜好，講成全教會的規條。"],["p","對坐在台下的我們，這也是一個提醒。"],["p","今天中午那一碗飯，那一個陪你吃飯的人，都是神造的，都是好的。"],["p","你上一次真心為它們說謝謝，是甚麼時候？"],["p","可是，一顆會感謝的心，不是一夜之間長出來的。"],["p","保羅下一段話，就把我們帶進了體育場。"],["q","第二步：操練敬虔。"],["q","「你若將這些事提醒弟兄們，便是基督耶穌的好執事，」（4:6）"],["p","「提醒」，原文是把東西輕輕放在人的腳前。不是下命令，是擺上桌。"],["p","好的服事者，不是天天發明新鮮的道理。是把大家已經知道、卻常常忘記的，再擺出來。"],["p","後面還有一句：「得了教育」。原文是被餵養，從小吃到大。"],["q","教別人吃以前，自己先是一個天天在吃的人。"],["p","然後，就是我們開場的那一個字。"],["q","「只是要棄絕那世俗的言語和老婦荒渺的話，在敬虔上操練自己。」（4:7）"],["p","這一節有兩個命令，並排站著。一個推開，一個拿起。"],["p","先推開「荒渺的話」，就是假師傅愛講的那些神話和家譜。"],["p","我們今天的「荒渺的話」，可能是手機裡一條又一條的影片，滑到半夜。"],["q","先放下，才拿得起。"],["p","然後是 γύμναζε。"],["p","這個字是現在式的命令，意思是一直練，天天練。"],["p","不是參加一次營會，不是一個感動的晚上。是明天早上，再推門進去一次。"],["p","受詞是「自己」。不是操練你的會眾，不是操練你的配偶。是你自己。"],["q","敬虔不是一種氣質，是一門要天天練的功課。"],["p","禱告，讀經，認罪，饒恕，管住舌頭，都要在一次又一次的重複裡，練進生命裡。"],["p","可是我要立刻補一句，免得我們聽歪了。"],["p","操練的方向，是「敬虔」。原文是朝向敬虔。"],["p","而敬虔的根，是第三章那一位「在肉身顯現」的基督。"],["p","所以操練，不是靠自己的力氣，一級一級爬到神那裡。"],["p","運動員天天練，是因為他已經是隊上的一員，不是為了換一件球衣。"],["q","信徒操練，不是為了屬於基督。是因為已經屬於基督。"],["p","接著，保羅引了一句當時流傳的話。"],["q","「操練身體，益處還少；惟獨敬虔，凡事都有益處，因有今生和來生的應許。」（4:8）"],["p","有人說：你看，聖經說操練身體益處還少，所以我不必運動。"],["p","請你聽清楚。保羅說的是「少」，不是「沒有」。"],["q","少，不是沒有。"],["p","原文 πρὸς ὀλίγον，兩邊用的都是「有益處」這個字。身體的操練，也有益處。"],["p","好好睡覺，規律運動，按時看醫生，都是對神託付的身體負責任。"],["p","也有人剛好倒過來，把健身當成了信仰。"],["p","我們很會為了身材早起，為了數據節食，卻很難為了禱告早起。"],["p","身體操練的果效，最多陪我們走完今生。"],["p","敬虔的果效，從今生，一直走進來生。一個生命，跨兩個時代。"],["p","可是「凡事都有益處」，不是保證發財、升官、萬事順利。"],["p","它的益處是應許：今生有神同在，來生有永遠的生命。"],["q","「我們勞苦努力，正是為此，因我們的指望在乎永生的神；他是萬人的救主，更是信徒的救主。」（4:10）"],["p","「勞苦」，是累到筋疲力竭的那種累。"],["p","「努力」這個字，有些古卷作「受辱罵」，和合本跟的是另一種抄本，兩種讀法都說得通，我們不在這裡久留。"],["p","保羅和提摩太又累又被罵，為甚麼還做下去？因為指望不在人的掌聲上，在「永生的神」身上。"],["p","「萬人的救主」，不是說所有的人最後都會得救。第一節才說，有人離棄真道。"],["p","意思是：門是向萬人開的。第二章說，他願意萬人得救。"],["p","門開著，人仍要進來。所以傳福音的人有勇氣，也有迫切。"],["p","坐在台下的弟兄姊妹，你在職場上為信仰受的冷眼，在家裡默默的忍耐，"],["p","都不是白費的。因為你的指望，在一位永遠活著的神身上。"],["p","體育場裡練出來的東西，最後一定會被人看見。"],["p","保羅接著就說：要讓人看見。"],["q","第三步：作信徒的榜樣。"],["q","「這些事，你要吩咐人，也要教導人。」（4:11）"],["p","第六節是輕輕地提醒。到了第十一節，換成了一個比較重的字：吩咐。"],["p","然後，保羅忽然轉過頭，對提摩太本人說話。"],["q","「不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。」（4:12）"],["p","提摩太大概三十多歲。在當時，四十歲以下都還算年輕。"],["p","你想，他一開口，台下有沒有人在心裡說：這麼年輕，懂甚麼？"],["p","保羅怎麼幫他？保羅沒有給他一個頭銜。"],["q","保羅沒有給他一個頭銜叫人尊敬他，給他五個範圍叫他活出來。"],["p","別人怎麼想，提摩太管不了。他能負責的，是自己成為甚麼樣的人。"],["p","「榜樣」，原文 τύπος。"],["p","這個字原來是敲打留下的痕跡。多馬說要看主手上的「釘痕」，就是這個字。"],["p","後來它也指鑄造用的模子。"],["q","一個模子壓在蠟上，蠟上就有了形狀。"],["p","人怎樣看一位年輕的傳道人，不看他的年紀，看他留下的印子。"],["p","保羅給了五個範圍。我們一個一個慢慢看。"],["p","言語：說話誠實，帶著恩典，背後說的和當面說的一樣。"],["p","行為：原文是日常的來來往往。怎樣開車，怎樣排隊，怎樣對待餐廳的服務員。"],["p","愛心：不是對有用的人好，是對每一個人真心。"],["p","信心：在難處裡仍然信靠神，也可以譯作忠信，答應的事做到。"],["p","清潔：在男女的關係上，在心思意念裡，都是乾淨的。"],["q","這五樣，沒有一樣需要年紀才做得到。"],["p","年輕人可能缺少經驗，但不必缺少品格。經驗要靠歲月，品格今天就可以開始。"],["p","這一節，也是念給會眾聽的。"],["p","教會裡年輕的傳道人，年輕的小組長，請不要只看他們的年紀。"],["p","給他們犯錯的空間，也給他們長進的時間。"],["p","而且，弟兄姊妹，我們每一個人，都正在某一個人的眼前，作一個模子。"],["p","父母在兒女眼前，老同事在新同事眼前，先信主的在剛信主的人眼前。"],["q","問題不是你有沒有留下印子，是你留下的是甚麼樣的印子。"],["q","「你要以宣讀、勸勉、教導為念，直等到我來。」（4:13）"],["p","「宣讀」，就是在聚會裡，把聖經大聲讀出來。"],["p","「為念」這個字很有意思。第一節說有人「聽從」邪靈，原文是同一個字。"],["q","人總是專注於某樣東西。問題是哪一樣。"],["p","大聲讀經，是在提醒全場的人：今天的權威不是講員，是神的話。"],["q","「你不要輕忽所得的恩賜，就是從前藉著預言、在眾長老按手的時候賜給你的。」（4:14）"],["p","保羅說：想起那一天。神藉著預言說了話，眾長老把手放在你頭上，為你禱告。"],["p","恩賜是神給的。按手，是教會在神面前一同承認，一同交託。"],["p","按手禮到底傳遞甚麼，議題頁有整理。我只說一句：你不是自己封自己的。"],["p","對會眾來說，按手不只是儀式的那一刻。被按手的人往後的路，也需要眾人的代禱。"],["p","然後，全章走到最後兩節。"],["q","「這些事你要殷勤去做，並要在此專心，使眾人看出你的長進來。」（4:15）"],["p","「殷勤去做」，原文 μελέτα，是反覆揣摩、下功夫。和第七節的「操練」，正好呼應。"],["p","請你聽那個詞：「長進」。保羅沒有要提摩太完美，他要人看見他在往前走。"],["p","會眾不需要一位完美的牧者。會眾需要一位誠實地在長進的牧者。"],["q","「你要謹慎自己和自己的教訓，要在這些事上恆心；因為這樣行，又能救自己，又能救聽你的人。」（4:16）"],["p","請你看次序。原文 ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ。"],["q","先看守自己，再看守教訓。"],["p","我們很容易倒過來。花很多時間檢查別人講得對不對，卻很少檢查自己的生命。"],["p","看守自己，不是只顧自己。是為了別人，先把自己看守好。"],["p","「又能救聽你的人」，不是說傳道人可以作別人的救主。救主只有一位，第十節剛說過。"],["p","意思是：在真道上恆心到底，自己和聽眾，都不被第一節那些引誘人的道理拖走。"],["p","坐在台下的我們也一樣：在家裡帶兒女的父母，在小組裡陪伴人的組長，都在同一個責任裡。"],["p","看守好你自己，就是對你身邊的人，最好的保護。"],["p","你看，第四章走了一整圈。"],["p","從有人離棄真道，到提摩太在真道上恆心。"],["p","從一顆被烙到沒有感覺的良心，到一個天天操練、天天看守自己的生命。"],["p","經文說完了它自己的話，我們國度321空中團契才接上來。"],["p","我們常說「操練920」。"],["p","每一個和我有關係的人，是我的「2」。我在他面前操練無己的「0」，結出聖靈的「9」。"],["p","這不是第七節要證明的東西。第七節要我們操練的，是敬虔。"],["p","可是當你天天朝向敬虔上場，那個場地，常常就是你身邊那一個人。"],["p","你的配偶，你的同事，你那個讓你最難忍耐的家人。"],["q","體育場，不在別的地方，就在今天和你同桌吃飯的那一個人面前。"],["p","弟兄姊妹，最後，我們回到那一間清晨六點的健身房。"],["p","我想告訴你一件事。上場的人，不是比較厲害的人。"],["p","保羅說他自己是罪魁。他知道，他能上場，是因為先蒙了憐憫。"],["q","「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐，給後來信他得永生的人作榜樣。」（1:16）"],["p","「作榜樣」，和第十二節的「榜樣」，是同一個字根。"],["p","保羅是一個模子。壓出這個模子的，是耶穌基督一切的忍耐。所有的模子，最後都照著那一位。"],["p","那一位在肉身顯現，在本丟‧彼拉多面前，作過那美好見證的基督耶穌。"],["q","我們不是靠操練進入隊伍。是他先把我們接進來，然後陪我們天天上場。"],["p","你不必更佩服台上的人。台上的人，也還在長進。"],["p","你只要更認識這一位，對罪魁滿有忍耐的主。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，每一頓飯以前，停三秒鐘，真心對主說一句謝謝。"],["p","第二件，挑一個小小的操練，每天早上同一個時間，打開聖經讀一章。"],["p","不必很多，只要天天。讓那張會員卡，從皮夾裡拿出來。"],["p","然後對主說：主啊，我不是因為練得好才屬於你；我屬於你，所以我要天天上場。"],["p","我們一起低頭禱告。"]]},"5":{"min":18,"blocks":[["h","《勸他如同父親；勸少年人如同弟兄》"],["p","弟兄姊妹平安，今天我們一起讀提摩太前書第五章。"],["p","今天我想請你記住一個數字。六十。"],["q","「寡婦記在冊子上，必須年紀到六十歲，」（5:9）"],["p","兩千年前的以弗所，教會手上有一本冊子。"],["p","冊子上寫著一些名字。每一個名字，都是一位上了年紀、身邊沒有人的婦人。"],["p","教會記得她們。記在冊子上，就是說：她的生活，這個家負責。"],["q","今天，我們華人教會裡，獨自一個人住的長輩，有多少？"],["p","有幾位長輩，每天晚上一個人吃飯，一個人看電視，一個人關燈？"],["p","我們是一個空中團契。很多長輩是在螢幕的另一頭，聽我們講道的。"],["q","再問一個更難的問題：誰記得他們的名字？"],["p","保羅寫這一章，就是要提摩太記得這些名字。"],["p","這一章有三個字：家，寡，老。"],["p","我們沿著它走三步：如同家人，真為寡婦的，不可有偏心。"],["p","這封信是寫給一個人的，寫給年輕的提摩太。"],["p","可是它要在以弗所全會眾面前念出來。"],["p","今天也一樣。這篇講章有一半是對傳道人說的，有一半是對你說的。"],["q","第一步：如同家人。"],["q","「不可嚴責老年人，只要勸他如同父親；勸少年人如同弟兄；勸老年婦女如同母親；勸少年婦女如同姊妹；總要清清潔潔的。」（5:1–2）"],["p","請你想像提摩太的處境。他年輕，保羅前一章才說："],["q","「不可叫人小看你年輕，」（4:12）"],["p","年輕的領袖面對長輩，最容易犯兩種錯。不是怕，就是硬。"],["p","保羅說：不可嚴責。"],["p","「嚴責」這個字，原文 ἐπιπλήξῃς，在新約只出現這一次。字根是「打」，打上去。"],["p","你有沒有被這樣的話打過？在會議裡，在小組裡，當著大家的面。"],["p","保羅說：不要打，要勸。"],["p","「勸」是現在式，不是偶爾勸一下，是一直用勸的態度。"],["p","再聽四個稱呼：父親，弟兄，母親，姊妹。"],["p","他用的全是家裡的稱呼。"],["q","這是家事，不是人事。"],["p","公司處理一位出錯的資深員工，照人事規章辦。"],["p","家裡處理一位做錯事的父親，你會先記得：他是我父親。"],["p","規矩可以一樣，口氣不會一樣。"],["p","耶穌早就這樣定義祂的家："],["q","「凡遵行我天父旨意的人，就是我的弟兄姊妹和母親了。」（太 12:50）"],["p","教會所有的規矩，都從家人的稱呼開始。稱呼對了，很多事就不會走到需要規矩那一步。"],["p","對少年婦女，保羅多加了一句：「總要清清潔潔的」。"],["p","年輕的傳道人和姊妹之間，最好的保護不是冷淡，是清楚。"],["p","像對待自己的親姊妹：沒有曖昧，沒有私下的特權，沒有只有兩個人知道的訊息。"],["p","可是我要馬上關上一扇門。"],["p","家的溫度，不等於「家醜不可外揚」。"],["p","同一章再往下讀，保羅就會說，確實犯罪的長老，要在眾人面前責備。"],["q","家人的稱呼管的是口氣，不是用來遮蓋罪。"],["p","這兩節是對提摩太說的，可是會眾也在聽。"],["p","對傳道人，它說：台下那位脾氣很硬的長輩，是你的父親。勸，不要打。"],["p","對會眾，它也說：台上那個年輕的傳道人，是你的弟兄，甚至是你的孩子。"],["p","你批評他的時候，是用拳頭，還是用父親的口氣？"],["p","家裡有父親、有弟兄。可是保羅接下來用了最長的篇幅，講家裡最容易被忘記的一群人。"],["q","第二步：真為寡婦的。"],["q","「要尊敬那真為寡婦的。」（5:3）"],["p","「尊敬」這個字，在希臘文裡不只是心裡敬重，常常包括實際的供養。"],["p","再聽一個字：「真」，原文 ὄντως。不是教會小氣，是把有限的照顧，給真正沒有倚靠的人。"],["p","那麼，有家人的寡婦怎麼辦？"],["q","「若寡婦有兒女，或有孫子孫女，便叫他們先在自己家中學著行孝，報答親恩，因為這在神面前是可悅納的。」（5:4）"],["p","可是請你聽「行孝」這個字的原文：εὐσεβεῖν。"],["p","它就是「敬虔」的動詞。和第三章「大哉，敬虔的奧祕」，同一個字根。"],["q","照顧年老的父母，是你的敬虔在家裡的樣子。"],["p","神也看見：這個週末，你有沒有打一通電話回家，有沒有回去看看父母。"],["p","請你留意「先」這個字。不是教會不管，是家人先管。"],["p","然後，保羅說了全章最重的一句。"],["q","「人若不看顧親屬，就是背了真道，比不信的人還不好，不看顧自己家裡的人，更是如此。」（5:8）"],["p","請你聽清楚動詞。和合本譯作「看顧」，原文字面是「先想」：先想到你，先替你預備。"],["q","這個字是看顧，不是順從。"],["p","先關第一扇門。"],["p","有一位姊妹，從小被打，被羞辱，被控制。她長大了，終於搬了出來。"],["p","然後有人拿這一節對她說：你不回家，就是背了真道。"],["p","弟兄姊妹，那不是提摩太前書第五章。"],["p","這一節說的看顧，是供應、照顧、報答，沒有說要你繼續承受虐待，也沒有說要你放下判斷。"],["p","看顧可以有很多樣子。負擔生活費，安排醫療和長照，和兄弟姊妹分工。"],["p","如果有身體、性或金錢上的虐待，先顧安全，必要時尋求專業和法律的保護。"],["p","再關第二扇門，方向剛好相反。"],["p","今天也有人說：我有界線，所以我對父母沒有虧欠。"],["p","保羅不接受這一句。耶穌也責備過那些用宗教理由，逃避奉養父母的人。"],["q","界線決定怎樣看顧，不決定要不要看顧。"],["p","界線可以保護我不再受傷，卻不給我理由，讓一位年老無靠的母親無人照料。"],["p","華人的孝道，常常把「孝」和「順」綁在一起。保羅的字，卻是「敬虔」和「看顧」。"],["p","這讓一個受過傷的孩子，也能在神面前，找到一條盡孝的路。"],["p","現在保羅轉過來，描寫那一位真為寡婦的人。"],["q","「那獨居無靠、真為寡婦的，是仰賴神，晝夜不住地祈求禱告。」（5:5）"],["p","「獨居無靠」，原文是完成式：被留下，只剩她一個。孤單不是心情，是已經成形的處境。"],["p","可是請你看，她在做甚麼。她在禱告，晝夜不住。"],["p","真為寡婦的，不只是被照顧的人。她自己也在服事。她是這個家的禱告者。"],["q","一間教會若記得這些獨居的長輩，就多了一群晝夜為它禱告的人。"],["p","現在我們回到開場那個數字。"],["q","「寡婦記在冊子上，必須年紀到六十歲，」（5:9）"],["p","在古代，六十歲大概已經是再嫁不容易、謀生也不容易的年紀。"],["p","教會在這裡作的，是一個長期的承諾：她把餘生交給禱告和服事，這個家負責她的生活。"],["p","然後保羅列出這位姊妹一生做過的事。"],["q","「就如養育兒女，接待遠人，洗聖徒的腳，救濟遭難的人，竭力行各樣善事。」（5:10）"],["p","全是在廚房裡、在門口、在別人看不見的地方做的。"],["p","「洗聖徒的腳」，是最卑微的服事。主耶穌在最後的晚餐，親自做過。"],["q","神的家記得的，正是這些沒有人鼓掌的事。"],["p","接著保羅說，年輕的寡婦，不要急著記在冊子上。"],["p","一位三十出頭、剛失去丈夫的姊妹，在最痛的時候，很可能說：我以後只服事主。"],["p","保羅知道，人在哀傷裡許的願，未必是幾年後的心。"],["q","「所以我願意年輕的寡婦嫁人，生養兒女，治理家務，」（5:14）"],["p","保羅不是勉強允許再婚。他是正面地「願意」。"],["p","所以，不要用屬靈的話，把一位年輕的姊妹推進一個不屬於她的誓言。"],["p","也不要用眼光，讓她為再婚感到羞愧。"],["p","這一段最後一句，是一個分工。"],["q","「不可累著教會，好使教會能救濟那真無倚靠的寡婦。」（5:16）"],["p","家人和身邊的人能接住的，先接住。教會的錢與人，才留得給那身邊一個人都沒有的。"],["p","所以這一段，也是兩層。"],["p","對傳道人：你手上有沒有那本冊子？那些獨居的長輩，你叫得出他們的名字嗎？"],["p","對會眾：在找教會以前，你先問自己，我家裡那一位，我看顧了沒有？"],["q","誰記得他們的名字？在神的家裡，答案應該是：我們都記得。"],["p","保羅講完家裡最需要被看顧的人，筆鋒一轉，講到家裡站在最前面的人。"],["q","第三步：不可有偏心。"],["q","「那善於管理教會的長老，當以為配受加倍的敬奉；那勞苦傳道教導人的，更當如此。」（5:17）"],["p","「敬奉」，和第三節寡婦的「尊敬」是同一個字根。有尊敬，也有實際的供應。"],["q","「牛在場上踹穀的時候，不可籠住牠的嘴」（申 25:4）"],["p","本系列申命記講義第二十五章講過：神連替人工作的牛都顧念，讓牠邊走邊吃。"],["p","第二句，和主耶穌差遣門徒時說的話，一字不差："],["q","「工人得工價是應當的。」（5:18）"],["p","先對會眾說。華人教會有一種很深的想法：傳道人愈窮愈屬靈。"],["p","讓一位全時間教導的人，每個月為房租和孩子的學費焦慮，是教會沒有盡本分。"],["q","供應傳道人，不是施捨，是本分。"],["p","再對傳道人說。同一封信，保羅也講到一種人："],["q","「他們以敬虔為得利的門路。」（6:5）"],["p","加倍的敬奉，是教會給出的尊重，不是傳道人可以伸手要的權利。"],["p","誰把第十七節當成向會眾要錢的條文，誰就站到了第六章那一邊。"],["p","教會有責任合理供應，傳道人有責任不貪。財務透明，是兩邊共同的保護。"],["p","尊榮跟著勞苦和品格走，不跟著頭銜走。"],["p","所以，一位長老的生命出了問題，他的尊榮就不能拿來作擋箭牌。這就帶到下一節。"],["q","「控告長老的呈子，非有兩三個見證就不要收。」（5:19）「犯罪的人，當在眾人面前責備他，」（5:20）"],["p","我刻意把這兩節放在一起念。第十九節保護過被誣告的牧者，也被濫用來讓受害的人閉嘴，所以絕對不可以單獨讀。"],["p","它保護的是甚麼？"],["p","帶領的人一定會得罪人。若一句流言就能讓他下台，教會就被最不滿的人綁架了。"],["p","保羅說，不要憑一張匿名紙條、一個人的情緒，就定一位長老的罪。這是對誣告的保護。"],["p","這條原則出自申命記第十九章。可是請你聽同一段緊接著說："],["q","「審判官要細細地查究，」（申 19:18）"],["q","查證的責任，在審判的人身上，不在說出來的人身上。"],["p","所以它不是甚麼？"],["p","它不是說，受害的人要自己先找到兩三個證人，才可以開口。"],["p","性侵、性騷擾、屬靈的操控，本來就常常發生在沒有旁人的地方。"],["p","原文的「收」，是受理、定案的意思。保羅講的是定案的門檻，不是開口的門檻。"],["p","教會收到指控，就是那個要細細查究的人。要有獨立、可信的調查。"],["p","調查不由被指控者的親信主導；要保護說出來的人不受報復。"],["q","涉及性侵、兒童保護等刑事的，要依法通報。"],["p","不可以用「教會內部處理」作理由，延誤依法通報。教會的程序，不能代替國家的法律。"],["p","然後，查證確實犯罪的呢？第二十節說，當在眾人面前責備他。"],["p","長老的身分，不給他私下了結的特權。反而要公開處理，叫其餘的人也可以懼怕。"],["p","再聽第二十一節，這是全章最重的一句誓詞。"],["q","「我在神和基督耶穌並蒙揀選的天使面前囑咐你：要遵守這些話，不可存成見，行事也不可有偏心。」（5:21）"],["p","「偏心」，原文 πρόσκλισιν，在新約也只出現這一次。意思是秤桿往一邊傾斜。"],["p","這把秤是雙向的：不預先判他有罪，也不因為他講道好、跟我們有交情，就往他那邊壓。"],["q","程序是為了真相，不是為了掩蓋。"],["p","弟兄姊妹，要檢驗我們有沒有讀對這三節，只要問一個問題。"],["p","如果今天，在螢幕前面，有一位受過傷害的姊妹，或是一位弟兄。"],["p","她等了很多年，終於鼓起勇氣，想把那件事說出來。"],["q","她聽完這篇講章，是更敢說，還是更不敢說？"],["p","如果你就是那一位，我要對你說：你可以說。你不必自己先湊齊兩三個證人。"],["p","這個家應該認真聽你，認真調查。不會因為對方是長老，就放過他。"],["p","如果受傷的是孩子，請直接告訴一個信得過的大人，也可以報警。"],["p","對會眾，這三節是囑咐：不要只因為喜歡一位牧者，就不肯聽另一個人的眼淚。"],["p","所以保羅接著說，從源頭就要慢。"],["q","「給人行按手的禮，不可急促；不要在別人的罪上有分，要保守自己清潔。」（5:22）"],["p","一位口才好、恩賜明顯、聚會熱心的人，最容易被快速推上台。"],["p","可是恩賜幾個月就看得見，品格要好幾年才看得清。"],["p","明知有疑點，卻因為缺人、因為交情就按下去，日後他犯的罪，你也有分。"],["p","這正是第二十二節要擋住的事。慢，是保護會眾，也是保護那個人。"],["q","「因你胃口不清，屢次患病，再不要照常喝水，可以稍微用點酒。」（5:23）"],["p","保羅剛說「要保守自己清潔」，馬上補一句，好像怕提摩太把清潔做成了另一種禁戒。"],["p","請你先聽處境：胃口不清，屢次患病。這是一位病人，不是一場飯局。"],["p","這一節常被兩邊拿來用，兩邊都要擋住。"],["p","它不是鼓勵飲酒。保羅說的是「稍微」，原因是病。用這一節替勸酒、喝醉開脫，是違背經文的。"],["p","它也不把飲酒本身定為罪。第三章對監督的要求，是「不因酒滋事」（3:3），重點是節制。"],["p","還有一群人，我要特別對你們說：正在戒酒的弟兄姊妹。"],["p","對你來說，完全不碰酒是智慧，也是忠心。這一節不是要你「稍微用點」。"],["p","我們的聚會和聚餐，不勸酒。保羅在羅馬書說得很清楚："],["q","「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好。」（羅 14:21）"],["p","這一節要我們學的，是一位屬靈的父親，連年輕同工的胃都放在心上。"],["q","「有些人的罪是明顯的，如同先到審判案前；有些人的罪是隨後跟了去的。」（5:24）"],["p","有些人的問題一眼就看得出來。有些人的問題，要好幾年才浮出來。"],["p","一個家若習慣替有地位的人遮蓋，不會因此平安，只會讓那罪隨後跟了去，傷到更多人。"],["q","「這樣，善行也有明顯的，那不明顯的也不能隱藏。」（5:25）"],["p","那位六十歲、洗聖徒的腳的姊妹，她做的事沒有人鼓掌。可是它不能隱藏。"],["p","弟兄姊妹，最後，我們回到那本冊子。"],["p","保羅在第二十一節，把整件事放在一個地方：在神和基督耶穌面前。"],["p","而這一位基督，自己就走過這一章。"],["p","請你看各各他。"],["q","十字架下，站著一位婦人。她的長子，正在上面死去。"],["p","掛在上面的耶穌，痛到極處，還記得一件事：我母親以後怎麼辦？"],["q","「從此，那門徒就接她到自己家裡去了。」（約 19:27）"],["p","第五章第四節的行孝，耶穌是在十字架上做的。"],["p","祂沒有讓母親成為一個沒有人記得名字的寡婦。祂把她交給一個門徒，從那天起，神的家裡就有人叫她母親了。"],["q","如同母親，如同弟兄。這個家的稱呼，是從十字架上傳下來的。"],["p","你不必更佩服今天站在台上的人。台上的人，也只是這個家裡的一個弟兄。"],["p","你只要更愛這一位，連死的時候都記得母親的主。"],["p","這個禮拜，請你做幾件小事。"],["p","想一位獨自住的長輩，也許是父母，也許是小組裡好久沒出現的那一位。"],["p","打一通電話，叫她一聲：阿姨，伯母，媽媽。"],["p","傳道人和同工，請你拿出名單，把名字一個一個念出來禱告。"],["p","如果你心裡有一件一直不敢說的事，請你這個禮拜，找一個信得過的人說出來。"],["p","然後對主說：主啊，謝謝你把我放進你的家。求你教我像家人一樣愛人。"],["p","我們一起低頭禱告。"]]},"6":{"min":18,"blocks":[["h","《你要保守所託付你的》"],["p","弟兄姊妹平安，今天我們一起讀提摩太前書第六章，這封信的最後一章。"],["p","我想先請你聽一段對話。"],["q","米利都，一個海邊的港口。船還沒有開，風從海上吹過來。"],["p","一群從以弗所趕來的長老，圍著一個頭髮已經花白的人。"],["p","那個人是保羅。他開口說："],["q","「聖靈立你們作全群的監督，你們就當為自己謹慎，也為全群謹慎，牧養神的教會，就是他用自己血所買來的。」（徒 20:28）"],["p","他接著說了一句叫人心裡發冷的話："],["q","「我知道，我去之後必有兇暴的豺狼進入你們中間，不愛惜羊群。」（徒 20:29）"],["p","然後他說："],["q","「如今我把你們交託神和他恩惠的道；」（徒 20:32）"],["p","長老們沒有回答甚麼。路加只記下他們的反應。"],["q","「眾人痛哭，抱著保羅的頸項，和他親嘴。」（徒 20:37）"],["p","叫他們最傷心的，是保羅說，以後不能再見他的面。"],["p","這是一段對話。一邊是囑咐，一邊是眼淚。"],["p","那一天，跟著保羅的同工裡，有一個年輕人，名叫提摩太（徒 20:4）。"],["p","他很可能就站在旁邊，看著這些長輩哭。"],["p","幾年過去了。豺狼真的來了。"],["p","現在，看守以弗所這群羊的，換成了這個年輕人。"],["p","保羅又寫信來了。信寫到最後，他像當年在海邊一樣，叫了一個名字："],["q","「提摩太啊，你要保守所託付你的，」（6:20）"],["p","這一句，就是米利都那段對話的下半場。"],["p","請你記得，這封信不是私下塞給提摩太的紙條。"],["p","它要在以弗所的聚會裡，當著全會眾的面念出來。"],["p","所以今天這篇信，是說給站講台的人聽，也是說給坐在座位上的你聽。"],["p","這一章有三個字：足，仗，託。我們沿著它走三步。"],["p","第六章開頭兩節，先講到在軛下作僕人的。"],["p","「軛」這個字，保羅沒有把它說成祝福。他承認那是一副重擔。"],["p","這兩節不是在替奴隸制度背書，保羅只是對一群已經在軛下的人說話。"],["p","他的理由只有一個：「免得神的名和道理被人褻瀆。」（6:1）"],["p","今天在職場上，這句話也不是單向的。西 4:1 同樣吩咐作主人的，要公公平平地待人。"],["q","第一步：敬虔加上知足。"],["p","保羅先描寫了一種人。"],["q","「他是自高自大，一無所知，專好問難，爭辯言詞，」（6:4）"],["p","「自高自大」，原文 τετύφωται，字根是煙。"],["p","一個被自己的煙燻住的人，以為自己很高大，其實甚麼也看不清。"],["p","所以這不只是假師傅的病，也是每一個開始服事的人要提防的病。"],["p","再看他生出甚麼：嫉妒，紛爭，毀謗，妄疑。"],["p","我們今天的網路上，留言串越長，愛心越少，常常就是這張症狀表。"],["p","然後，保羅揭開了動機。"],["q","「他們以敬虔為得利的門路。」（6:5）"],["p","把信仰當成生財的工具。敬虔，從目的變成了手段。"],["p","保羅沒有在信裡點出這些人的名字。我今天也不點名任何人、任何教會。"],["p","這面鏡子，是拿給每一個講台照的，包括我自己站的這一個。"],["p","也拿給每一顆心照：我來到神面前，是要他，還是要他手裡的東西？"],["p","下一節，保羅用同一個字，把這句話整個翻過來。"],["q","「然而，敬虔加上知足的心便是大利了；」（6:6）"],["p","請你留意，保羅沒有說敬虔沒有利。他說，那是大利。"],["p","他不跟假師傅爭那個「利」字，他是把「利」重新定價。"],["p","「知足」，原文 αὐταρκείας，意思是「夠了」。"],["p","當時的哲學家也講知足：把需要減到最少，就不會失望。"],["p","那是一種自我防衛。保羅的知足不一樣，他的「夠」不靠處境，靠神。"],["p","所以知足的人仍然可以努力工作，可以創業，可以有計畫。"],["q","他只是不再需要用錢來證明神愛他，也不再需要用錢來證明自己有價值。"],["p","保羅接著說出理由。"],["q","「因為我們沒有帶甚麼到世上來，也不能帶甚麼去。」（6:7）"],["p","這使我們想起約伯，在失去一切的那一天說的話。"],["q","「我赤身出於母胎，也必赤身歸回；」（伯 1:21）"],["p","保羅的意思更深一層：生命兩端都是空的，中間經手的一切，都是託付。"],["p","請你先記住「託付」這兩個字。這一章最後，我們會再遇見它。"],["q","「只要有衣有食，就當知足。」（6:8）"],["p","這不是說基督徒只能有衣食。保羅列的是生存的底線，不是生活的上限。"],["p","他是說：衣食之上的，不是我們安全感的來源。"],["p","有了衣食，人就可以停下焦急的追趕，開始問另一個問題："],["q","多出來的，神要我拿去做甚麼？"],["p","然後，經文往下走，走到這一章的谷底。"],["q","「但那些想要發財的人，就陷在迷惑、落在網羅和許多無知有害的私慾裡，叫人沉在敗壞和滅亡中。」（6:9）"],["p","這是一條下坡路。先是想要，心意定了。然後替它找理由，然後被套住。"],["p","「沉」這個字，是把船弄沉的字。一條船，貨一箱一箱往上堆。"],["p","沒有一條船是一天之內沉下去的。每一步，都只差一點點。"],["p","接著，就是聖經裡最常被引錯的一句話。"],["q","「貪財是萬惡之根。有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。」（6:10）"],["p","請你看清楚這一句的主語。是「貪財」，原文 φιλαργυρία，就是愛錢。"],["q","保羅說的根，不在銀子上，在心裡對銀子的那份愛。"],["p","錢是工具。可以買藥，也可以買毒品；可以建學校，也可以收買人。"],["p","貪財，是那種「再多一點，我就安全了」的愛。"],["p","最痛的是後半句：「把自己刺透了」。沒有人刺他，是他自己刺的。"],["p","失眠，焦慮，破裂的家，彼此提防的兄弟。許多傷口，是自己的貪心刺的。"],["p","所以這一段經文，兩邊都擋住了。"],["p","對一邊，它說：渴望發財不是信心，是危險。"],["p","信主不保證發財，奉獻也不是拿來換祝福的。那正是「以敬虔為得利的門路」。"],["p","對另一邊，它也說：問題不是錢，是貪財。"],["p","保羅沒有說「敬虔加上貧窮」，他說的是知足。越窮不等於越屬靈。"],["q","窮人也可能貪財，富人也可能不貪。"],["p","站在講台上的人，要先拿這一段照自己：我講道，有沒有一點點是為了得利？"],["p","坐在座位上的你，也照一照：我焦急的，是缺少，還是怕不夠多？"],["p","貪財的反面不是貧窮，是知足。而知足的出口，不是囤積，是給出去。"],["p","看完了那些在追錢的人，保羅忽然轉過身，對著提摩太。"],["q","第二步：持定永生。"],["q","「但你這屬神的人要逃避這些事，追求公義、敬虔、信心、愛心、忍耐、溫柔。」（6:11）"],["p","「屬神的人」，是舊約稱呼摩西、以利亞的頭銜。神人。"],["p","保羅把先知的稱號，放在一個年輕傳道人身上。"],["p","不是因為他做了多少，是因為他屬於誰。"],["p","提後 3:17 用同一個稱號，指每一個被聖經裝備的信徒。"],["p","所以全會眾聽見這一句時，都可以抬起頭來：你也是屬神的人。"],["p","再看兩個動詞：逃避，追求。"],["p","前面那群人在追，追的是錢。提摩太也要追，追的是品格。"],["q","基督徒不是不追求的人，是換了追求對象的人。"],["p","「逃避」也很實際。有些試探不是用來抵擋的，是用來跑開的。"],["p","遠離那些讓你一直比較、一直焦急的東西，本身就是屬靈的智慧。"],["q","「你要為真道打那美好的仗，持定永生。」（6:12）"],["p","「打仗」，原文是運動場上的拚搏。肌肉會痛，呼吸會亂。"],["p","疲倦、懷疑、反對，都不是信心失敗的證據，是比賽正在進行的證據。"],["p","「持定」，是一把抓住。抓住生命的人，手是滿的。"],["q","手裡握著永生的人，就空不出手去抓那些人在抓的東西。"],["p","保羅也叫他記得起點：「已經作了那美好的見證」。"],["p","也許是他受洗的那一天，在許多見證人面前，開口承認耶穌。"],["p","每一個受過洗的人，都有這樣一個起點。疲倦的時候，回到那一天去。"],["p","然後，保羅把提摩太帶到兩位面前。"],["q","「我在叫萬物生活的神面前，並在向本丟‧彼拉多作過那美好見證的基督耶穌面前囑咐你：」（6:13）"],["p","這一章一直在說「美好」：美好的仗，美好的見證。"],["p","到了這一節，「美好」第一次有了一個人的臉。"],["q","羅馬巡撫的衙門。一個被綁著的人，站在彼拉多面前。"],["p","彼拉多問他：「這樣，你是王嗎？」"],["q","「我為此而生，也為此來到世間，特為給真理作見證。」（約 18:37）"],["p","沒有否認，沒有反擊。安靜，清楚，不退讓。"],["p","提摩太面對假師傅，面對比他有錢有地位的會友，就要照這個模子說話。"],["q","「要守這命令，毫不玷污，無可指責，直到我們的主耶穌基督顯現。」（6:14）"],["p","守，有一個期限：直到主顯現。我們不是無止盡地撐著，是等候一位一定會來的主。"],["p","講到這裡，保羅停不住了。他唱了起來。"],["p","弟兄姊妹，我們也在這裡停下來。"],["q","「到了日期，那可稱頌、獨有權能的萬王之王、萬主之主，」（6:15）"],["q","「就是那獨一不死、住在人不能靠近的光裡，是人未曾看見、也是不能看見的，要將他顯明出來。但願尊貴和永遠的權能都歸給他。阿們！」（6:16）"],["p","這是這封信的第三處頌讚。"],["p","第一章，罪魁想起自己蒙了憐憫，就頌讚永世的君王。"],["p","第三章，講完神的家，就唱「大哉，敬虔的奧祕」。"],["p","現在第六章，講到守住命令直到主顯現，他第三次抬起頭來。"],["p","請你留意，這首詩歌是放在錢的教導中間的。"],["p","以弗所的錢幣上，印著皇帝的頭像。人以為，有錢就有權能。"],["p","保羅說：獨有權能的，只有一位。"],["p","「萬王之王」，原文是一切正在作王的王。此刻坐在任何寶座上的，都在他以下。"],["q","他住在人不能靠近的光裡。神不是我們的資源，也不是我們的顧問。"],["p","可是那不能看見的神，沒有一直躲在光裡。"],["p","第十四節那位要顯現的主耶穌，就是那光照進人間的臉。"],["p","提摩太在會眾面前念到這裡，全會眾要一起回答：阿們。"],["p","我們說「讓耶穌得著一切的榮耀」。讀到這裡，最好的回應不是分析，是敬拜。"],["p","唱完了，保羅低下頭，又回到以弗所的教會裡。回到錢上。"],["q","第三步：保守所託付的。"],["q","「你要囑咐那些今世富足的人，不要自高，也不要倚靠無定的錢財；只要倚靠那厚賜百物給我們享受的神。」（6:17）"],["p","以弗所教會裡有富人。保羅沒有假裝他們不存在。"],["p","他叫一個年輕人，去對年紀比他大、錢比他多的人說話。"],["p","年輕的牧者面對有錢的會友，有兩個試探：一個是巴結，一個是嫉妒。"],["p","保羅兩樣都不給他，只給他一份囑咐。"],["p","「無定的」，原文 ἀδηλότητι，是看不清楚的。"],["q","倚靠錢財，就像倚靠一片霧。看得見，卻撐不住。"],["p","可是請你聽這一節最美的那一句：神是「厚賜百物給我們享受」的。"],["p","神不是吝嗇的主人。他給得豐富，而且目的就是叫我們享受。"],["p","一頓好吃的飯，一次和家人的旅行，一個舒適的家，不必帶著罪疚感領受。"],["q","享受不是罪。忘了那位賜予者，才是。"],["p","所以這一節，又把兩邊都擋住了。富足的人，保羅沒有叫他變窮。"],["p","他只叫他換一個倚靠：從禮物，換到賜禮物的那一位。"],["q","「又要囑咐他們行善，在好事上富足，甘心施捨，樂意供給人，」（6:18）"],["p","第九節的人「想要發財」。這裡，保羅也叫富人「富足」。"],["p","只是換了地方：在好事上富足。"],["p","「樂意供給人」，原文 κοινωνικούς，就是「團契」那個字。"],["p","錢在神的家裡，是用來建立關係的。"],["p","經文說完了它的話，我們國度321空中團契才接上去。"],["p","我們常說：人比事重要，關係比東西重要。"],["q","這一節，把那句話放進了錢包裡：東西最好的用途，是成為關係的橋。"],["q","「為自己積成美好的根基，預備將來，叫他們持定那真正的生命。」（6:19）"],["p","又是「持定」。第六章兩次叫人伸手，抓的都是生命，不是錢。"],["p","這不是說施捨可以買永生。那就又回到「以敬虔為得利」的老路了。"],["p","是說一個慷慨的人，已經抓住了那真正的生命。錢買得到生活，買不到這個。"],["p","然後，我們走到全信的最後一個命令。"],["q","「提摩太啊，你要保守所託付你的，躲避世俗的虛談和那敵真道、似是而非的學問。」（6:20）"],["p","「所託付的」，原文 παραθήκην，是一個法律用語：寄存物。"],["q","古時出遠門的人，把一袋銀子交給可靠的朋友。回來時，要原封不動地取回。"],["p","福音就是這樣的寄存物。不是提摩太發明的，也不是他可以修改的。"],["p","不挪用，不打折，不加料。"],["p","可是寄存物還有另一面：它總有一天要交出去。"],["q","「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」（提後 2:2）"],["q","保守所託付的，是為了交給下一棒，不是關起門來。"],["p","一間只會守、不會交的教會，守住的，最後只是一個空箱子。"],["p","保羅交給以弗所的長老，長老交給提摩太，提摩太再交給忠心的人。"],["p","一棒一棒，交到了今天坐在這裡的我們手上。"],["p","「似是而非的學問」，也要讀準。原文是名不副實、冒用了知識之名的。"],["p","這不是叫我們反對讀書，也不是反學術、反科學。真理不怕被研究。"],["p","要躲開的，是把人從真道引開、只留下爭辯和驕傲的說法。"],["p","對站講台的人，這一節是說：你不是福音的主人，你是看守寄存物的人。"],["p","你的成績，不是你守了多久，是你交給了誰。"],["p","對坐在座位上的你，這一節同樣是說給你聽的。"],["p","你帶大的孩子，你陪讀經的那位新朋友，你小組裡那個年輕人，就是你的下一棒。"],["p","弟兄姊妹，這封信的最後一句，只有短短幾個字。"],["q","「願恩惠常與你們同在！」（6:21）"],["p","請你留意，「你們」是複數。"],["p","這封信是寫給一個人的。可是最後一句，保羅轉過身來，對全會眾說話。"],["p","我們回到米利都的海邊。"],["p","那一天，保羅說「你們就當為自己謹慎」，接著說「我把你們交託神和他恩惠的道」。"],["p","幾年後，在這封信裡，次序一樣：先是「你要保守」，然後是「願恩惠常與你們同在」。"],["p","先保守，再恩惠。這個次序不能顛倒。"],["p","可是請你聽清楚：我們能夠保守，是因為恩惠先常與我們同在。"],["p","第一章，保羅說自己是罪魁，卻蒙了憐憫。恩典在職分之前，也在看守之前。"],["p","年輕的提摩太，不是靠自己的力氣守住寄存物，是在恩惠的覆庇下守住它。"],["q","守門的人會疲倦。恩惠不會離開。"],["p","為甚麼不會離開？因為那位在彼拉多面前作過美好見證的，自己就守住了。"],["p","他守住了真理，一直守到十字架上，把他自己交了出去。"],["p","他從死裡復活，是那獨一不死的；他要再來，是萬王之王。"],["q","我們守的，不是一套道理。是一位為我們把自己交出來的主。"],["p","你不必更佩服台上的人。台上的人，也只是接過一棒的人。"],["p","你只要更愛這一位，把恩惠先放在我們手裡的主。"],["p","這個禮拜，請你做兩件事。"],["p","第一件，在錢上，問自己一句：衣食之上多出來的，神要我給誰？然後給一次。"],["p","第二件，想一個你的下一棒。這個禮拜，把你從神那裡領受的一句話，交給他。"],["p","守住，然後交下去。在恩惠裡守住，在恩惠裡交下去。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——一封寫給一個人的信，為甚麼要在全會眾面前宣讀？","r":"1:3；3:14--15；6:21","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前 ISS00_1）；本卷補述託付信的文體，並把以弗所的亞底米廟、假教訓與米利都的預言放回信裡。提摩太前書是新約裡最常被當成「教會規章」來用的一卷：講性別、講職分、講寡婦、講長老、講錢，條條都像可以直接貼在牆上的條文。於是有人把它讀成一本不分古今、逐字照辦的手冊，有人又因為讀不下去，乾脆一句「那是當時的文化」把它放回抽屜。這封信到底是寫給誰的、為甚麼一封寫給一個人的信要在全會眾面前宣讀，必須在開卷講定，全卷六章的落點才有根。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：保羅寫信給特定地區、特定年代、遇到特定問題的教會；讀信的人要先找出他的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：以弗所教會遇到甚麼？保羅從福音推出甚麼原則？今天這原則落在哪裡？</p><p>本卷要補的是一個文體上的問題。這封信的抬頭只有一個人：「寫信給那因信主作我真兒子的提摩太」（1:2）；信裡一再出現單數的「你」：「好囑咐那幾個人不可傳異教」（1:3），「我兒提摩太啊」（1:18），「不可叫人小看你年輕」（4:12），連胃口不好要喝點酒都寫進去了（5:23）。可是到了最後一句，代名詞忽然變成複數：<strong>「願恩惠常與你們同在」（6:21）</strong>。保羅又說他寫信的理由是：「我指望快到你那裡去，所以先將這些事寫給你」（3:14），「倘若我耽延日久，你也可以知道在神的家中當怎樣行」（3:15）。</p><p><strong>經文問的是：這是一封私人信，還是一份全教會的規章？保羅的吩咐是只給以弗所的，還是給每一間教會的？今天的讀者要怎樣分辨哪些是原則、哪些是落點？</strong></p>"],["私人教牧信說（這是寫給一位傳道人的私信，主要對象是牧者，不是會眾）","","<p>認為提摩太前書、提摩太後書與提多書是一組「教牧書信」——這個名稱是十八世紀才普遍使用的——內容是一位老使徒傳給年輕同工的經驗：怎樣選同工、怎樣對付假師傅、怎樣照顧寡婦、怎樣看守自己。所以讀這封信最合適的地方是神學院和同工會，講台上不必多講。這派抓住了一件真實的事：信裡確實有許多只有提摩太自己用得上的話，例如「你不要輕忽所得的恩賜」（4:14）、「可以稍微用點酒」（5:23），保羅也真的像父親一樣跟他說話。</p><p><strong>難處：</strong>它解釋不了最後那個複數「你們」（6:21），也解釋不了 1:3 的處境——保羅把提摩太留在以弗所，是要他去「囑咐那幾個人」，提摩太手上若沒有一份可以公開宣讀的書面授權，一個被人「小看你年輕」（4:12）的同工，憑甚麼去囑咐那些自以為是「教法師」（1:7）的人？而且信裡大部分的吩咐，對象其實是全會眾：男人、女人、監督、執事、寡婦、兒女、長老、僕人、富足的人。把它只留給牧者讀，等於讓會眾不知道自己在神家中「當怎樣行」（3:15）。</p>"],["教會手冊說（這是一份不分古今的教會規章，每一條都要逐字照辦）","","<p>認為 3:15 已經把全信的性質講明了：這是「在神的家中當怎樣行」的說明書。既然是神家的說明書，每一條就都是永久的規範：男人要舉手禱告、女人不可編髮戴金、寡婦要滿六十歲才可記在冊上、長老要拿加倍的敬奉，一條一條照做就是忠心。這派的優點是認真對待經文的權威，不肯讓「處境」兩個字變成刪經的剪刀。</p><p><strong>難處：</strong>實際上沒有一間教會真的逐字照辦全部條文。很少有教會設「寡婦名冊」、照 5:9–10 審查「洗聖徒的腳」；也很少有教會禁止姊妹戴珍珠（2:9）。於是手冊說往往變成「選擇性的逐字」：對自己方便的照字面，不方便的就悄悄跳過，而挑選的理由從來沒有講出來。更大的問題是，它把一封有開頭、有結尾的信拆成了條文，忘了全信的第一句吩咐是「但命令的總歸就是愛」（1:5）——條文讀得再精，失去了這一句，就讀錯了全信。</p>"],["純處境說（這些吩咐全是針對以弗所的處境，今天不再適用）","","<p>認為提摩太前書的每一條規範，都是回應第一世紀以弗所的特殊情況：城裡有亞底米大廟，女祭司與廟妓的文化影響婦女的裝扮與角色；教會裡有傳異教的人，專找「無知的婦女」下手（這使我們想起提後 3:6）；寡婦沒有社會保障，只能靠教會。處境變了，規範就自然失效，今天的教會不必再受它約束。這派的優點是認真重建背景，許多細節確實讓經文活過來。</p><p><strong>難處：</strong>保羅自己的論證不只用處境，也用創造與福音。2:13 引的是創世記的次序，2:5 講的是「只有一位中保」，3:16 唱的是基督的一生；這些理由不會因為亞底米廟倒了就失效。而且這封信自己說它的目的是讓人知道「這家就是永生神的教會，真理的柱石和根基」（3:15）——說的是神的教會，不只是以弗所的教會。把一切都歸到處境，讀的人就不必被經文挑戰了；這和逐字照辦一樣，都沒有真的聽見保羅在說甚麼。</p>"],["託付信說（這是一封上級交給代表的書面授權，寫給一個人，要在全會眾面前宣讀）","","<p>認為提摩太前書的文體最接近古代的「託付信」（mandate letter）：君王或總督派一位代表到某地辦事，會交給他一封寫給他本人的信，信裡交代他的任務、權限與當守的品格；這封信會在當地公開宣讀，讓眾人知道這位代表的權柄從哪裡來，也讓眾人可以拿信裡的標準來檢驗他。所以信寫給一個人，卻是要被全會眾聽見的。這正好解釋了 6:21 的「你們」、1:3 的「囑咐」（παραγγέλλω，帶著命令權柄的字），也解釋了為甚麼保羅在信裡反覆要求提摩太自己先作榜樣（4:12、4:16）——全會眾都在聽，也都在看。</p><p><strong>難處：</strong>古代的託付信多半是官方文書，口氣冷硬，提摩太前書卻充滿父子之情和私人的叮嚀，文體並不完全吻合；所以「託付信」只能說是最接近的類比，不是一個可以把全信套進去的模子。而且即使承認它是託付信，仍然要一條一條分辨：哪些是只給提摩太的（5:23），哪些是給以弗所的，哪些是給每一間教會的。文體只回答了「誰在聽」，沒有替讀者省下分辨的工夫。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補一段：提摩太前書是一封託付信，寫給一個人，卻是要在全會眾面前宣讀的；所以全卷每一章都要兩層講：對提摩太（今天的傳道人與同工），也對以弗所教會（今天的會眾）。講台不要只講給牧者聽，也不要只拿來管會眾。</strong></p><p>這封信的處境，要放回以弗所的歷史線上讀。保羅在這城住了將近三年（〔背景〕徒 19:10；20:31），城裡有亞底米大廟，全城的人可以為她喊兩個小時：「大哉！以弗所人的亞底米啊」（徒 19:34）；信主的人把行邪術的書公開焚燒（〔背景〕徒 19:19）。保羅離開前在米利都對長老們說過一個預言：「我知道，我去之後必有兇暴的豺狼進入你們中間，不愛惜羊群」（徒 20:29），「就是你們中間，也必有人起來說悖謬的話，要引誘門徒跟從他們」（徒 20:30）。<strong>提摩太前書寫的時候，這個預言已經應驗了</strong>——傳異教的人不是從外面來的，是從長老群裡起來的。</p><p>所以讀每一條吩咐都要問三件事：<strong>這一條的「因為」是甚麼？</strong>（創造的次序、福音的本質、還是以弗所的特殊情況？）<strong>這個「因為」今天還在不在？</strong><strong>今天的落點在哪裡？</strong>判斷的理由在每一章的議題頁講出來，不在講台上一句帶過。321 在末端接上去：這封信讓我們看見，「建立屬神的體系」從來不是一份組織章程，是一群在神家中彼此看得見的人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，知道這是一封要在全會眾面前宣讀的信，是一種保護。保羅沒有私下塞給提摩太一張「怎樣管人」的紙條；他把對傳道人的要求、對長老的標準、對假師傅的警告，全部攤在會眾面前。今天的會眾也有權利讀這封信，也有權利拿信裡的標準問：我們的教會是照這封信在行嗎？</p><p>它也告訴我們：神的家不是在一個乾淨的地方蓋起來的。以弗所城裡有大廟、有邪術、有暴動，教會裡有傳異教的人，保羅卻說，這家就是「永生神的教會，真理的柱石和根基」（3:15）。<strong>你的教會再不完美、你的處境再複雜，也不會比以弗所更難；而這封信的第一句吩咐仍然是：「但命令的總歸就是愛」（1:5）。</strong></p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。提摩太前書是一封託付信，寫給一個人，卻要在全會眾面前宣讀（6:21「你們」是複數）；所以全卷都要兩層講：對傳道人，也對會眾。它的處境是應驗了米利都預言的以弗所教會。","care":"牧養底線：講「這封信要在全會眾面前宣讀」時，不要讓它變成會眾審判同工的武器，也不要讓它變成同工管轄會眾的手冊。席上會有兩種人特別敏感：一種是曾經被人拿這卷書的條文定罪過的人——離過婚的、守寡的、被拒絕服事的姊妹、被當眾責備過的人；另一種是正在服事、心裡已經很累的年輕同工，他每天都覺得有人「小看你年輕」。對前者，先讓他聽見 1:5 與 1:15——這封信的地基是愛與憐憫，不是條文；對後者，讓他聽見保羅是像父親一樣對兒子說話的。講完，會眾帶走的應該是「這家是我的家」，而不是「這家有很多規矩」。"},{"id":"ISS00_2","t":"性別與事奉——2:8--15「沉靜學道」「不許女人講道」與 3:11「女執事」該怎樣讀？","r":"2:8--15；3:11","ch":[],"why":"二、四讀並陳（互補派較嚴、互補派較寬、處境派／平等派、中間讀法），講義不裁判——沿用哥林多前書立場二、加拉太書立場四，本卷補 2:11–15 的四讀、3:11 的兩讀與牧養底線。2:8–15 是全新約在性別與事奉上爭議最大的一段，華人教會從講台到長執會都受它影響。這段經文最常被兩種方式讀錯：一種是拿來貶低姊妹的價值、智力與恩賜，說「女人比較容易受騙」；另一種是一句「那只是當時的文化」把它一筆勾銷。兩種都沒有認真讀經文。2:15「在生產上得救」又常常讓不孕、流產、單身的姊妹坐在席上暗暗流淚。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>這段經文的第一句不是說女人，是說男人：「我願男人無忿怒，無爭論，舉起聖潔的手，隨處禱告」（2:8）。接著是女人的妝飾與善行（2:9–10），然後是全段最受爭議的兩節：「女人要沉靜學道，一味地順服」（2:11），「我不許女人講道，也不許她轄管男人，只要沉靜」（2:12）；保羅給的理由是：「因為先造的是亞當，後造的是夏娃」（2:13），「且不是亞當被引誘，乃是女人被引誘，陷在罪裡」（2:14）；最後是一句至今沒有定論的話：「然而，女人若常存信心、愛心，又聖潔自守，就必在生產上得救」（2:15）。下一章又有一節：「女執事也是如此：必須端莊，不說讒言，有節制，凡事忠心」（3:11）。</p><p><strong>先說「學」。</strong>2:11 的主要動詞是命令式的 μανθανέτω（讓她學）。在一個女人通常不被教導經典的文化裡，保羅開口的第一件事，是要她們學道。這是起點，不是附帶。「沉靜」（ἡσυχία）的同根形容詞（ἡσύχιος）在 2:2 也用過，說的是全教會「平安無事地度日」，是安靜受教的態度，不是不准出聲。</p><p><strong>經文問的是：2:12 的「講道」與「轄管」限制的是甚麼？只限以弗所，還是每一間教會？2:13–14 的理由是創造次序，還是以弗所的處境？2:15 的「得救」是甚麼意思？3:11 說的是女執事，還是執事的妻子？</strong></p>"],["互補派（較嚴）：女性不擔任向全會眾的權威性教導，也不擔任長老、監督","","<p>認為 2:12 的「講道」（διδάσκειν）指的是在全會眾面前帶權柄地教導，「轄管」（αὐθεντεῖν）指的是在教會中行使屬靈權柄；保羅的理由是 2:13 的創造次序——在墮落以前就有的次序，所以不是文化，是每一間教會都要守的。女性可以教導婦女與兒童（這使我們想起多 2:3–5），可以在許多事工上服事，但不在主日講台上講道，也不任長老。許多改革宗、浸信會與華人保守教會採這個讀法。這派的優點是認真對待 2:13 的論證，不肯讓經文被處境吞掉；他們也常常強調男女在神面前同樣尊貴，限制的只是職分，不是價值。</p><p><strong>難處：</strong>同一段經文裡，2:8 的「舉手」與 2:9 的「編髮、黃金、珍珠」很少有教會照字面要求，為甚麼 2:12 一定要照字面而它們不必，理由需要講清楚。新約也記載了姊妹說預言（這使我們想起林前 11:5），百基拉與亞居拉一同「將神的道給他講解更加詳細」（徒 18:26），「說預言」與「教導」的界線並不容易劃。而且在實際執行上，這個讀法若不小心，很容易從「職分的限制」滑向「價值的貶低」。</p>"],["互補派（較寬）：限制只在長老、牧師一職；女性可以講道、教導、帶領在長老權柄之下的事工","","<p>同樣接受 2:13 的創造次序，但認為 2:12 的「教導」與「轄管」合起來說的是長老的職分——也就是下一章 3:2 那位「善於教導」又要「照管神的教會」（3:5）的監督。所以保羅限制的是長老、監督這一個職位，不是一切講道與教導；姊妹可以在長老會的授權與看顧之下講道、教導、帶領小組與事工。許多福音派教會採這個讀法。這派的優點是既尊重 2:13 的論證，又能解釋新約裡姊妹實際參與事奉的例子，例如保羅稱友阿蝶與循都基「在福音上曾與我一同勞苦」（腓 4:3）。</p><p><strong>難處：</strong>把 2:12 和 3:1–7 連起來，是一個合理但不是唯一的讀法；經文本身沒有說「只限長老」。而且「在長老權柄之下講道」到底和「帶權柄地教導」差在哪裡，各教會的界線並不一致，同一位姊妹在甲教會可以講主日，在乙教會只能分享見證——連持這個立場的人彼此也不同。</p>"],["處境派／平等派：這是針對以弗所特定處境的禁令；2:11 的重點是「讓她們學」","","<p>認為 2:11–12 要放在以弗所的處境裡讀：傳異教的人在婦女當中特別活躍（這使我們想起提後 3:6–7），5:13 也說有年輕寡婦「挨家閒遊……說些不當說的話」；這些婦女還沒有受過教導，卻已經在散布錯誤的道理。所以保羅說：先讓她們學（2:11），在學成以前不要讓她們教。2:12 的「轄管」αὐθεντέω 在新約只出現這一次，在當時的用法中常帶有奪權、專橫的意思，所以禁止的不是一般的教導，是專橫地奪取權柄。2:13–14 是用夏娃作例子：先被造的亞當受過神直接的吩咐，夏娃沒有受過完整的教導就被引誘了——正像以弗所那些還沒學成就開口的婦女。許多循道衛理、五旬宗與部分福音派學者採這個讀法，並且引加 3:28「或男或女，因為你們在基督耶穌裡都成為一了」為總原則。</p><p><strong>難處：</strong>αὐθεντέω 是否一定帶負面的意思，學者之間仍有爭論，不能當成定論；2:13 引的是創造的次序（「先造的是亞當」），不只是夏娃受教多少，這一點處境派需要更有力的解釋。而且若處理不好，這個讀法很容易被簡化成一句「那是當時的文化」，結果整段經文對今天甚麼也沒有說——這是處境派自己的優秀學者也反對的。</p>"],["中間讀法：原則是「不可專橫地奪取權柄」，男女都適用；各教會依自己的傳統決定職分","","<p>認為這段經文最清楚、最不受爭議的部分，是它禁止的那一種態度：在神的家裡奪權、專橫、爭吵。2:8 要男人「無忿怒，無爭論」，2:12 不許「轄管」，3:3 要監督「不爭競」，彼前 5:3 要長老「不是轄制」——這是男女都要守的原則。至於姊妹可以擔任哪些職分，經文的細節有真誠的不同讀法，所以各教會依自己的傳統與良心決定，彼此尊重，不互相定罪。這是許多華人教會實際上的做法。</p><p><strong>難處：</strong>它容易被批評為迴避問題——每一間教會總要決定姊妹能不能講主日、能不能作長老，「各教會自己決定」並沒有替長執會省下讀經的工夫。而且「不可專橫」雖然是真的原則，卻不能取代 2:12–13 本身的論證；把一段具體的經文完全化成一個抽象原則，同樣是沒有認真讀它。</p>"],["2:13–14 與 2:15 的幾種讀法（創造次序、受騙的例子、「在生產上得救」的四讀）","","<p><strong>2:13–14 不是「女人比較笨、比較容易受騙」。</strong>不論採哪一派，這一點各派的嚴肅學者都同意。假如 2:14 的意思是女人天性容易受騙，那麼本卷點名「偏離真道」的人就說不通了：「有人丟棄良心，就在真道上如同船破壞了一般」（1:19），「其中有許米乃和亞歷山大」（1:20）——這兩個人都是男人；5:15 又說年輕寡婦中「因為已經有轉去隨從撒但的」（5:15）——<strong>偏離真道的有男也有女。</strong>受騙不是哪一個性別的天性，是每一個不受教、不警醒的人的危險。保羅自己在別處也說，他怕整個哥林多教會「像蛇用詭詐誘惑了夏娃一樣」被引誘（這使我們想起林後 11:3）——那裡指的是全會眾。</p><p><strong>2:15「就必在生產上得救」四讀並陳。</strong>①<strong>藉著那生產</strong>：原文「生產」帶冠詞（τῆς τεκνογονίας），可以指那一次特別的生產——基督由女人所生，應驗了女人的後裔要傷蛇的頭（這使我們想起創 3:15）；女人是藉著那一位所生的救主得救。難處是「生產」這個字本身不常這樣用。②<strong>在生產中被保全</strong>：「得救」指身體的平安，姊妹在分娩的危險中蒙神保守。難處是本卷其他地方的「得救」都是屬靈的意思（1:15；2:4）。③<strong>藉著履行蒙召而活出得救</strong>：以「生產」代表婦女在家中的呼召，配上「常存信心、愛心，又聖潔自守」，說的是得救的人怎樣活出來，不是靠生育得救。難處是若講得不好，會讓沒有生育的姊妹覺得自己少了甚麼。④<strong>對抗假教訓</strong>：以弗所的假師傅「禁止嫁娶」（4:3），保羅說：婚姻與生育不會攔阻一個女人得救。難處是這需要先接受假教訓的重建。</p><p><strong>3:11 兩讀並陳。</strong>原文只是 γυναῖκας（女人們）：①<strong>女執事</strong>——這一節夾在執事的條件中間，「也是如此」與 3:8 同一個句型，而且只提執事的妻子、不提監督的妻子並不合理；保羅也說「我們的姊妹非比；她是堅革哩教會中的女執事」（羅 16:1）。和合本正文就作「女執事」，並加註「原文是女人」。②<strong>執事的妻子</strong>——這一節夾在 3:10 與 3:12 之間，3:12 又回到「執事只要作一個婦人的丈夫」，所以很可能是說執事的家人也要合乎品格。本講義兩讀並陳，不裁判。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場二、加拉太書立場四——各宗派在這事上有真誠的不同；講義陳列四讀而不裁判；不論採哪一讀，都不可用這段經文貶低姊妹的價值、智力、恩賜或屬靈地位，也不可用一句「那是當時的文化」把它一筆勾銷。</strong></p><p>本卷補四點：<strong>一、2:11 先說「學」</strong>——不論你的教會採哪一讀，姊妹都要被好好地教、被認真地栽培；一間不讓姊妹講道、也不讓姊妹讀神學的教會，兩頭都沒有守住 2:11。<strong>二、2:13–14 不是「女人比較容易受騙」</strong>——偏離真道的有男也有女（1:20；5:15）。<strong>三、2:15 四讀並陳，牧養底線是：不孕、流產、單身的姊妹聽完，不可以覺得自己被排除在救恩之外。</strong>本卷自己就說得很清楚：得救是因為「基督耶穌降世，為要拯救罪人」（1:15），不是因為生了幾個孩子。<strong>四、3:11 兩讀並陳</strong>，教會設不設女執事，照自己的傳統與良心決定。</p><p>還有一句比四讀更先的話：<strong>2:8「無忿怒，無爭論」先於 2:9–15。</strong>為這段經文吵架，就已經違背了這段經文的第一句。321「無己才能合一」在這裡落地：要放下的不是自己的讀法，是想贏過對方的那個「己」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。愛主的學者、愛主的教會，在這一題上已經真誠地討論了很多年，仍然站在不同的位置上；他們讀的是同一本聖經、拜的是同一位主、靠的是同一位「降世為人的基督耶穌」（2:5）。你的教會採哪一讀，不決定你得救與否，也不決定神有沒有在你身上放恩賜。</p><p>如果你是一位姊妹，請記得這段經文開頭那個命令：「讓她學」。神要你認識他、明白真道（2:4），神也把恩賜放在你身上，叫你在神的家中服事。<strong>不論你今天站在講台上、坐在詩班裡、在兒童主日學教課、在病床邊禱告，你都是神家裡的人，不是神家的客人。</strong>如果你是一位弟兄，這段經文要你先做的，是放下忿怒與爭論，舉起聖潔的手禱告。</p>"]],"con":[],"say":"本講義的全卷立場：性別與事奉，沿用哥林多前書立場二、加拉太書立場四——四讀並陳、講義不裁判；2:11 先說「學」；2:13–14 不是女人比較容易受騙，偏離真道的有男也有女；2:15 不可使不孕、流產、單身的姊妹覺得被排除在救恩之外；3:11 兩讀並陳。2:8「無忿怒，無爭論」先於這一切。","care":"牧養底線：席上一定有在教會服事了幾十年的姊妹，有被拒絕過、或被當眾說過「女人不可以」的姊妹，也有不孕、流產、正在等候孩子、或決定單身的姊妹；講 2:15 時要特別想到她們。不要在講台上開性別的玩笑，不要說「女人就是比較情緒化、比較好騙」，也不要說「你們不生孩子是不順服」。提到流產與不孕，不追問細節，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。也要顧到另一邊：堅持較嚴讀法的弟兄姊妹不是在壓迫人，不要在講台上把他們講成落伍的人。"},{"id":"ISS00_3","t":"神的家的秩序——誰可以被託付監督、執事、長老的職分？按立該怎樣做？","r":"3:1--13；5:17--22","ch":[],"why":"三、職分的資格幾乎全是品格；品格先於恩賜、生命先於事工；按立要慢；不以本卷裁判主教制、長老制、會眾制；3:2 四讀並陳、以「專一忠誠」為主軸——本講義的全卷立場之三（本卷新立）。提摩太前書第 3 章與第 5 章是新約對教會職分最完整的一份記錄，各宗派都從這裡找自己的體制根據。在華人教會，這一段又牽動許多人的傷口：離過婚、再婚、單身的弟兄被告知「你不能服事」，兒女不信主的父親被暗示「你家都管不好」。這一題必須在開卷講定，第 3、5 章才不會變成一份審查表。","pos":[["【一】經文問的是甚麼","","<p>教會要有哪些職分？誰有資格？監督和長老是不是同一職？今天的「主任牧師」「執事會」「長老會」在經文裡找得到嗎？3:1–13 列出監督與執事的條件，5:17–22 講長老的敬奉、控告與按立。</p><p>在進入各家之前，先讓經文自己說四件事。<strong>一、職分的資格幾乎全是品格。</strong>3:2–7 的十幾項條件中，只有「善於教導」是能力，其餘都是生命：無可指責、有節制、自守、端正、樂意接待遠人、不因酒滋事、溫和、不爭競、不貪財、在教外有好名聲。<strong>二、資格從家開始</strong>：「人若不知道管理自己的家，焉能照管神的教會呢」（3:5）。<strong>三、職分是「善工」，不是地位</strong>：「人若想要得監督的職分，就是羨慕善工」（3:1）。<strong>四、服事本身就是賞賜</strong>：「因為善作執事的，自己就得到美好的地步」（3:13）。</p><p>3:2 有一個爭議特別大的條件：「作監督的，必須無可指責，只作一個婦人的丈夫」（3:2），原文 μιᾶς γυναικὸς ἄνδρα 直譯是「一個女人的男人」。<strong>經文問的是：這些職分今天應該怎樣設立？「一個婦人的丈夫」到底排除了誰？按立應該怎樣做？</strong></p>"],["主教制（監督是長老之上的一個職分，承接使徒的託付）","","<p>認為提摩太與提多本身就是一種「使徒代表」，在長老之上治理一個地區的眾教會；第二世紀初的伊格那丟書信已經清楚區分了主教、長老與執事三級，這是從使徒時代自然發展出來的。天主教、東正教、聖公會與部分循道會採這種體制。這派的優點是重視傳承與秩序，提摩太前書確實在講「交託」——福音從保羅交到提摩太，再交下去（這使我們想起提後 2:2）。</p><p><strong>難處：</strong>提摩太前書本身沒有單一主教制。保羅從米利都「請教會的長老來」（徒 20:17），接著對同一群人說「聖靈立你們作全群的監督」（徒 20:28）；提多書也是先說「在各城設立長老」（多 1:5），兩節後改稱「監督既是神的管家，必須無可指責」（多 1:7）——在使徒時代，監督和長老看來是同一群人的兩個稱呼。三級制是後來的發展，不是本卷的內容。</p>"],["長老制（由一群長老共同治理教會，監督就是長老）","","<p>認為新約的監督與長老是同一職分：「長老」說的是成熟與尊重，「監督」說的是看顧與照管；保羅與巴拿巴「在各教會中選立了長老」（徒 14:23），用的是複數，可見是一群人共同治理。5:17 又區分「善於管理教會的長老」與「勞苦傳道教導人的」，改革宗由此發展出「治理長老」與「教導長老」的分別。長老會與許多改革宗、獨立教會採這種體制。這派的優點是最貼近徒 20 章與多 1 章的用詞，又能防止一人獨大。</p><p><strong>難處：</strong>5:17 的區分是否真的是兩種職分，還是同一職分中有人特別勞苦，學者仍有爭論。而且長老會若成了一個封閉的小圈子，彼此保護、不受會眾監督，同樣違背了本卷的精神——5:20–21 就是寫給長老群的：犯罪的人要被責備，不可存成見，也不可有偏心。</p>"],["會眾制（最終權柄在全體會眾，長老與執事由會眾選立並向會眾負責）","","<p>認為新約教會的重大決定是全會眾一起做的（這使我們想起徒 6:3–5 選立七人、徒 15:22 全教會一同定意），長老與執事是會眾所選的僕人，不是在會眾之上的權柄；提摩太前書要在全會眾面前宣讀（6:21「你們」），會眾也有責任認得誰合乎 3:2–13 的品格。浸信會、許多獨立教會與華人自立教會採這種體制。這派的優點是保護了「信徒皆祭司」，也使教會的權柄有人監督。</p><p><strong>難處：</strong>本卷把很大的責任放在提摩太與長老身上：「這些事，你要吩咐人，也要教導人」（4:11），按手的禮「不可急促」（5:22）是對提摩太說的；全由會眾投票，容易變成人氣與派系的比賽。而且會眾制若沒有成熟的長老，教會在假教訓來的時候反而最容易被「引誘門徒跟從他們」（徒 20:30）。</p>"],["3:2「只作一個婦人的丈夫」四讀並陳","","<p>①<strong>禁止多妻</strong>：一個男人不可同時有兩個以上的妻子。難處是多妻在當時的希臘羅馬社會並不普遍，而且 5:9 寡婦要「從來只作一個丈夫的妻子」——女人多夫幾乎不存在，可見這不只是講多妻。②<strong>禁止離婚再婚</strong>：離過婚又再婚的人不可作監督。難處是聖經本身承認某些情況下的離婚（這使我們想起太 19:9；林前 7:15），一律排除，會把無辜被遺棄的一方也算進去。③<strong>禁止任何再婚，連喪偶再婚也包括在內</strong>：早期教會一部分教父這樣讀。難處是保羅自己說年輕的寡婦可以再嫁（5:14），也說配偶死了就可以自由嫁娶（這使我們想起羅 7:2–3），很難說喪偶再婚使人失去品格。④<strong>一個對妻子專一忠誠的人</strong>：這是一句性道德的品格描述——不拈花惹草、不在婚姻以外有曖昧，不是一份婚姻史的履歷。</p><p><strong>本講義以④為主軸</strong>，並陳其餘三讀。理由有二：其一，清單中其他每一項都是現在的品格（「有節制」「自守」「溫和」），不是過去的紀錄；其二，<strong>保羅自己在 1:13–16 說明：神用了一個過去最不合格的人</strong>——「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（1:13）。依同樣的理由，「使兒女凡事端莊順服」（3:4）本講義讀作兒女年幼時家中的秩序，<strong>成年兒女不信主，不自動使父親失去資格</strong>（這使我們想起結 18:20「兒子必不擔當父親的罪孽」）。難處是④的讀法也可能被濫用成「甚麼都可以」——所以教會若在按立上有自己的規定，照著程序、私下、溫柔地處理。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：一、不以本卷裁判主教制、長老制、會眾制——三者都可以從新約找到支持，也都可能違背本卷的精神。二、品格先於恩賜、生命先於事工。三、按立要慢，要觀察。四、職分不是頭銜。</strong></p><p>品格先於恩賜：3:2–7 列的不是一份能力表，是一份生命的畫像；一個人講道再好、會再多，若在家中不溫和、在錢上不乾淨、在教外沒有好名聲，就不該被按立。這正是 321「先生命，再關係，後事工」最直接的經文依據——不是拿經文來印證 321，是 321 本來就從這種經文長出來的。</p><p>按立要慢：「初入教的不可作監督，恐怕他自高自大」（3:6），「這等人也要先受試驗，若沒有可責之處，然後叫他們作執事」（3:10），「給人行按手的禮，不可急促」（5:22）。教會缺人的時候最容易急，急的時候最容易看恩賜不看生命。</p><p>職分不是頭銜：不把 321 的「五重職份」當作在地方教會發放頭銜的根據（沿用以弗所書立場五），也不把監督、執事、長老硬套進五重職份的格子裡——先讓經文自己說話。3:2 以「專一忠誠」為主軸，四讀並陳；不在講台上把離婚、再婚、單身或兒女尚未信主的弟兄姊妹當成「不合格的例子」。321 落點：建立屬神的體系，<strong>體系的第一層不是組織圖，是一群在自己家中先活出基督的人。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的教會是主教制、長老制還是會眾制，都不決定你是不是神家裡的人；三種體制裡都有忠心的僕人，也都出過失敗的領袖。決定一間教會健不健康的，不是組織圖，是那些被託付職分的人有沒有生命。</p><p>如果你曾經因為婚姻的過去、單身的現在、或兒女的光景被告知「你不能服事」，請你聽見這封信的作者怎樣介紹自己：他說神「派我服事他」（1:12），而他自己從前是褻瀆、逼迫、侮慢人的。<strong>神揀選僕人，看的從來不是一份沒有污點的履歷，是一個被憐憫改變的生命。</strong>教會的按立有它的程序，但神家的門沒有因此對你關上——「善工」（3:1）在神的家裡到處都有。</p>"]],"con":[],"say":"本講義的全卷立場：職分的資格幾乎全是品格；品格先於恩賜、生命先於事工；按立要慢（3:6；3:10；5:22）；不以本卷裁判主教制、長老制、會眾制；3:2 四讀並陳，以「一個對妻子專一忠誠的人」為主軸；成年兒女不信主不自動使父親失去資格；職分不是頭銜。","care":"牧養底線：不在講台上逐條「審查」任何一位在職同工，也不用 3:2–12 羞辱離婚、再婚、單身或兒女尚未信主的弟兄姊妹；不在會眾面前討論任何個人的婚姻史。席上會有被配偶遺棄的人、喪偶後再婚的人、為叛逆的兒女流淚多年的父母，他們聽 3:2–5 時心裡是發抖的；講完這一段，要讓他們聽見 1:13–16 的恩典。教會若在按立上有自己的規定，照著程序、私下、溫柔地處理，並且把理由說清楚，不讓人在走廊上從別人口中聽到自己「不合格」。"},{"id":"ISS00_4","t":"長老、權柄、控告與屬靈虐待——5:19 是保護，還是封口？","r":"5:17--25","ch":[],"why":"四、5:19 保護無辜者免於誣告；5:20–21 犯罪的長老不因職分被保護，不可有偏心；收到指控要有獨立、可信的調查，涉及刑事、兒童保護依法通報——沿用彼得前書立場五（彼前 ISS00_5），本卷補 5:17–25。近年各地華人教會都有牧者性侵、屬靈虐待、財務不清的事件被揭露，其中最常被拿出來的一句經文就是 5:19「控告長老的呈子，非有兩三個見證就不要收」——被拿來叫受害者閉嘴、叫知情的人不要說話、叫教會「內部處理」。這是全卷最需要在開卷就講定的一題。","pos":[["【一】經文問的是甚麼","","<p>5:17–25 是一段連續的教導。先是敬奉：「那善於管理教會的長老，當以為配受加倍的敬奉」（5:17），理由是「工人得工價是應當的」（5:18）。接著是控告：「控告長老的呈子，非有兩三個見證就不要收」（5:19），<strong>緊接著是</strong>：「犯罪的人，當在眾人面前責備他，叫其餘的人也可以懼怕」（5:20），以及一句極重的囑咐：保羅在「神和基督耶穌並蒙揀選的天使面前」要提摩太「不可存成見，行事也不可有偏心」（5:21）。然後是預防：「給人行按手的禮，不可急促；不要在別人的罪上有分，要保守自己清潔」（5:22）；最後是一個提醒：「有些人的罪是明顯的，如同先到審判案前；有些人的罪是隨後跟了去的」（5:24）。</p><p>「兩三個見證」出自申命記：「不可憑一個人的口作見證，總要憑兩三個人的口作見證才可定案」（申 19:15）；耶穌在太 18:16 也引用這個原則。<strong>經文問的是：5:19 是為了保護誰？受害的人若沒有其他證人，是不是就不能說？長老真的犯了罪，教會應該怎樣處理？教會內部處理和依法通報是甚麼關係？</strong></p>"],["封口讀法（沒有兩三個見證的指控，教會不必理會；指控牧者就是攻擊神的僕人）","","<p>這是實際上最常見、卻很少被公開承認的讀法：只要指控的人拿不出兩三個證人，教會就可以不收、不查、不回應；常常再加上「不可摸我受膏者」（這使我們想起詩 105:15）、「不要論斷」，把提出指控的人當成破壞合一的人。持這種讀法的人，有時是真心想保護一位他們信任的牧者，也記得確實有牧者被惡意中傷、事工被毀的例子。</p><p><strong>難處：</strong>它把 5:19 和 5:20–21 拆開了。保羅在同一口氣裡說：犯罪的長老要「在眾人面前責備」，而且「不可有偏心」——5:19 是為了把真的與假的分開，不是為了讓真的也被蓋住。更嚴重的是，性侵與屬靈虐待幾乎都發生在沒有第三者的地方；要求受害者自己先找到兩三個證人才可以開口，等於讓加害者永遠安全。申 19:15 的「兩三個見證」是審判定案的標準，不是受理說話的門檻。這種讀法最後保護的，不是無辜的牧者，是有罪的人。</p>"],["程序保護讀法（5:19 是保護無辜者免於誣告的程序門檻；但教會必須主動查證）","","<p>認為 5:19 的重點是保護：長老站在前面，比一般人更容易成為不滿、嫉妒或惡意的對象；一個人的一句話，不足以定一位長老的罪，也不應該立刻公開。但「兩三個見證」的意思不是叫指控的人自己去找證人，而是教會在採取處分之前，必須有足夠的、獨立的證據——所以收到指控時，教會有責任主動查證：找出其他受害者、其他知情者、文件、訊息與紀錄。許多案例中，正是在認真調查之後，第二、第三位受害者才出來說話。</p><p><strong>難處：</strong>教會常常沒有能力、也沒有立場作公正的調查——調查的人與被指控的人是多年同工、甚至由被指控的人自己挑選調查小組。程序保護若沒有獨立性，就會在不知不覺中滑回封口讀法。而且一般會眾並不懂這些程序，若沒有清楚的說明，他們只會聽見「沒有兩三個見證就不要收」。</p>"],["受害者優先讀法（在權勢不對等的指控中，要先相信、先保護說出來的人）","","<p>認為 5:19 寫在一個長老被惡意攻擊的處境裡，今天的處境往往反過來：權勢在牧者那一邊，說出來的人是信徒、女性、未成年人或下屬，他們要冒極大的代價才敢開口。所以在權勢不對等的指控中，教會要先接住說出來的人、先保護他的安全，再進行調查；5:20「在眾人面前責備」也說明，罪若是真的，就不能私下了事。</p><p><strong>難處：</strong>「先相信」若變成「先定罪」，同樣違背了 5:21「不可存成見」——不可存成見是對兩邊說的。確實也有被誣告的同工，事後雖然澄清，家庭與事工已經毀了。所以「先保護」說的是保護人身安全與說話的空間，不是在調查以前就公開判決。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用彼得前書立場五（彼前 ISS00_5），本卷補 5:17–25。5:19 是保護無辜者免於誣告，不是封口；5:20–21 犯罪的長老不因職分被保護，不可存成見，也不可有偏心。</strong></p><p>具體落實為四點。<strong>一、收到指控，要有獨立、可信的調查。</strong>不由被指控的人或與他利益相關的人主持；必要時請教會外的專業人士或上級組織協助。<strong>二、涉及刑事、性侵、兒童保護，依法通報。</strong>不以「教會內部處理」為由延誤，也不勸受害者「為了主的名不要報警」；依法通報與教會的屬靈處理並行，不互相取代。<strong>三、兩三個見證是定案的標準，不是說話的門檻。</strong>受害者不必自己先找到證人才可以說話；查證是教會的責任。<strong>四、確實犯罪的長老，不因職分被保護。</strong>「在眾人面前責備」（5:20）的目的是「叫其餘的人也可以懼怕」——讓權柄有敬畏，不是讓人難堪；處理過程仍要保護受害者的隱私。</p><p>5:22 說預防比事後處理更重要：按立要慢，教會要有清楚的同工守則、兒童事工的雙人制度、財務的雙人簽核。5:24–25 給一個盼望：「有些人的罪是隨後跟了去的」，「那不明顯的也不能隱藏」（5:25）——<strong>神看得見；但教會不可以拿「神看得見」當作自己不必作為的理由。</strong>也要同時講 5:17：善於管理、勞苦教導的長老，配受加倍的敬奉——敬重與問責是同一個家的兩根柱子。</p>"],["【四】這件事該不該影響你的信心","","<p>會影響，而且應該讓人難過——但不該讓人離開神。教會裡有領袖犯罪，從新約的時代就開始了；保羅在米利都流著淚預言過，傳悖謬之道的人會從長老中間起來（徒 20:30）。提摩太前書正是為這樣的教會寫的。<strong>一位領袖的失敗，證明的是人需要恩典，不是神不可信。</strong></p><p>如果你是那位受過傷的人，請你知道：保羅在神和天使面前囑咐提摩太「不可有偏心」，神沒有站在有權勢的那一邊。傷害你的是一個濫用權柄的人，不是那位說「只有一位中保」（2:5）、捨己作贖價的主。你說出來不是破壞合一；把罪光照出來，正是讓神的家重新成為「真理的柱石和根基」（3:15）。</p>"]],"con":[],"say":"本講義的全卷立場：沿用彼得前書立場五。5:19 保護無辜者免於誣告，不是封口；5:20–21 犯罪的長老不因職分被保護，不可存成見、不可有偏心；收到指控要有獨立、可信的調查，涉及刑事、性侵、兒童保護依法通報，不以「教會內部處理」為由延誤。","care":"牧養底線：講 5:19 時，想像席上坐著一位終於鼓起勇氣說出來的姊妹，或一位小時候在教會受過傷、至今不敢踏進牧師室的弟兄——他聽完，是更敢說，還是更不敢說？不追問細節，不要求原諒，不說「你也有責任」「為了教會的見證不要張揚」，不對正在流淚的人說「你要有信心」；會後單獨關心，協助他找到安全的人、專業的輔導與法律的協助。也要顧到被誣告的同工與他的家人：不在調查結束前公開判決，讓保護與問責兩邊都被認真對待。"},{"id":"ISS00_5","t":"錢、知足與敬虔——基督徒可以有錢嗎？成功神學與清貧主義錯在哪裡？","r":"6:3--10；6:17--19；5:17--18","ch":[],"why":"五、6:10 是貪財，不是錢；拒絕成功神學，也拒絕清貧主義；神厚賜百物給我們享受；錢在神的家裡是用來建立關係的（κοινωνικούς）——本講義的全卷立場之五（本卷新立）。提摩太前書是新約把錢講得最清楚的一卷：傳道人的工價、以敬虔得利的假師傅、想要發財的人、今世富足的人，全在裡面。華人教會在錢上有兩種很深的傷：一種是「奉獻就蒙福」「信主就發財」的講台，一種是「有錢就是不屬靈」的暗示，讓做生意的弟兄在教會裡抬不起頭。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>基督徒可以有錢嗎？可以投資、創業嗎？信主會發財嗎？窮是不是比較屬靈？奉獻多少才對？6:3–10 先講假師傅：「他們以敬虔為得利的門路」（6:5）；保羅回答：「然而，敬虔加上知足的心便是大利了」（6:6）。6:17–19 再對富足的人說話；5:17–18 則講傳道人的供應。</p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、錢不是萬惡之根，「貪財」才是</strong>：「貪財是萬惡之根」（6:10），原文 φιλαργυρία 是「愛錢」。<strong>二、知足不是放棄</strong>：「只要有衣有食，就當知足」（6:8）——基本需要之上的，是可以給出去的。<strong>三、錢是「無定的」</strong>（6:17，ἀδηλότητι，看不清楚的）——倚靠它，就像倚靠霧。<strong>四、神是「厚賜百物給我們享受的」</strong>（6:17）——享受不是罪。<strong>五、有錢的人被吩咐的，不是變窮</strong>，是「又要囑咐他們行善，在好事上富足，甘心施捨，樂意供給人」（6:18）。</p><p><strong>經文問的是：基督徒對錢的心，應該站在哪裡？</strong></p>"],["成功神學（敬虔與奉獻帶來財富與健康；貧窮是信心不足）","","<p>認為神願意祂的兒女在物質上興盛，信心與奉獻是打開祝福的鑰匙：撒下多少，就收回多少，甚至收回百倍；財富與健康是蒙福的證明，貧窮與疾病是信心不足或有罪未認。這派抓住了幾件真實的事：神確實是賜福的神，6:17 說神「厚賜百物給我們享受」；也確實有人信主以後戒了賭、戒了酒、勤奮工作，生活改善了。對許多在貧窮裡掙扎的人來說，這樣的信息聽起來像好消息。</p><p><strong>難處：</strong>它正是 6:5 所說的「以敬虔為得利的門路」。保羅說這種人是「壞了心術、失喪真理」（6:5），又說「但那些想要發財的人，就陷在迷惑、落在網羅」（6:9）。把奉獻講成投資，就把神變成了提款機，把信心變成了交易。它還把窮人與病人推進雙重的痛苦：除了窮與病，還要被說是信心不夠。提摩太自己「胃口不清，屢次患病」（5:23），保羅沒有說他信心不足，只叫他稍微用點酒。</p>"],["清貧主義（有錢本身就是屬靈的危險，越貧窮越接近神）","","<p>認為 6:10 已經說明錢是罪惡的根源，基督徒應該盡量遠離財富：不追求升遷、不投資、不創業，收入越少越單純，越貧窮越屬靈；富有的基督徒即使沒有犯罪，也總是比較不屬靈。這派的心志常常是真誠的：他們看見了錢對人心的捆綁，也看見了教會被錢敗壞的歷史，許多修道與敬虔運動都從這份警覺而來。</p><p><strong>難處：</strong>6:10 說的是「貪財」，不是錢；保羅沒有叫富足的人變窮，只叫他們「不要自高，也不要倚靠無定的錢財」（6:17）。本卷還有一條很少人注意的線：以弗所的假師傅有兩個方向——一邊「禁止嫁娶，又禁戒食物」（4:3），一邊「以敬虔為得利」（6:5）；保羅兩邊都擋，說「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的」（4:4）。清貧主義若把貧窮當成屬靈的證明，就落進了另一種驕傲；而且它讓在職場上忠心賺錢、樂意供給人的弟兄姊妹，在教會裡抬不起頭。</p>"],["管家讀法（錢是託付；知足是心的位置，慷慨是錢的方向）","","<p>認為提摩太前書對錢的教導，核心是「託付」——全卷以「交託」開始（1:18），以「保守所託付你的」結束（6:20），錢也是神託付的東西之一。知足是心的位置：「因為我們沒有帶甚麼到世上來，也不能帶甚麼去」（6:7），有衣有食，心就安定；慷慨是錢的方向：在好事上富足，「為自己積成美好的根基，預備將來」（6:19）。這派可以同時接住 6:10 的警告與 6:17 的享受，也可以同時講 5:18「工人得工價」與 6:5「不可以敬虔得利」。</p><p><strong>難處：</strong>「管家」兩個字很容易變成一句漂亮的口號，讓人心安理得地繼續累積；「我只是在管理神的錢」可能是忠心，也可能是藉口。所以這個讀法需要具體的落點：多少是「有衣有食」、多少可以給出去，每個人要在神面前誠實地回答，教會也要在自己的財務上先作榜樣。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：一、拒絕成功神學</strong>（6:5「以敬虔為得利的門路」）——不保證信主就發財，不以奉獻換取祝福。<strong>二、拒絕清貧主義</strong>（4:3–4「凡神所造的物都是好的」；6:17「享受」）——不以貧窮為屬靈的證明。<strong>三、教會的財務要透明</strong>——這是對 5:17–18 與 6:5 最好的共同回應：教會有責任合理供應傳道人，「工人得工價是應當的」（5:18）；傳道人也有責任不以敬虔為得利。收支公開、雙人簽核、定期向會眾報告，兩邊都受保護。<strong>四、不點名任何當代講員或教會</strong>——講台批評的是一種教導，不是一個人。</p><p>本卷給錢的落點是一個字：<strong>6:18「樂意供給人」的「供給」κοινωνικούς，是「團契」κοινωνία 的形容詞。錢在神的家裡，是用來建立關係的。</strong>321「人比事重要，關係比東西重要」在這裡有了最具體的經文：不是叫人不要有東西，是叫人用東西去愛人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——但應該影響你的錢包，也影響你的心。如果你曾經在一間教會裡被教導「奉獻越多越蒙福」，後來奉獻了、卻沒有蒙福，甚至因此負債，請你知道：神沒有失信，是那套教導本身就不是神的應許。神應許的是祂自己的同在，不是銀行帳戶的數字。</p><p>如果你是一位有錢的弟兄姊妹，這封信沒有叫你羞愧，叫你的是「不要自高」，然後「行善，在好事上富足」。如果你正在缺乏中，這封信說「有衣有食，就當知足」不是要你認命，是要你知道：你的價值從來不在你有多少。<strong>貧富都在同一個家裡，同一位「厚賜百物給我們享受」的神面前，彼此供給。</strong></p>"]],"con":[],"say":"本講義的全卷立場：6:10 是貪財，不是錢；拒絕成功神學（6:5），也拒絕清貧主義（4:4；6:17）；神厚賜百物給我們享受；教會的財務要透明，合理供應傳道人，傳道人也不以敬虔為得利；6:18「樂意供給人」——錢在神的家裡，是用來建立關係的。不點名任何講員或教會。","care":"牧養底線：席上有負債的人、失業的人、因為聽信「奉獻蒙福」而傾家蕩產的人，也有做生意成功、卻在教會裡被暗示不屬靈的人。講這一段不要點名任何講員、教會或會友，不要在講台上公布誰奉獻了多少，也不要用「神看你的心」去暗示誰奉獻得不夠。對經濟困難的人，教會先在實際上幫助，不先講道理；對被成功神學傷過的人，讓他知道錯的是那套教導，不是他的信心。教會自己的財務若還不透明，講這一段之前先把帳打開。"},{"id":"ISS00_6","t":"作者是使徒保羅嗎？教牧書信的真實性與託名說該怎樣看？","r":"1:1；1:12--16","ch":[],"why":"六、本講義採使徒保羅；託名說的四個理由（字彙、體制、神學、時間線）與回應並陳。提摩太前書、提摩太後書與提多書是新約中作者問題爭議最大的一組書信；十九世紀以來，許多學者認為它們是保羅過世後，由他的門生以他的名義寫成的。會眾在網路上、大學課堂裡一定會碰到這個說法；講台若從來不提，信徒第一次聽到時會以為教會在隱瞞；講台若講得太多，又會把一封叫人敬虔的信變成一場學術辯論。這一題必須在開卷交代清楚，並且定好講台上只講一句。","pos":[["【一】經文問的是甚麼","","<p>這封信的第一句話就說了作者是誰：「奉我們救主神和我們的盼望基督耶穌之命，作基督耶穌使徒的保羅」（1:1）。信裡還有全新約最個人化的一段自述：「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（1:13），「在罪人中我是個罪魁」（1:15），「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐」（1:16）。2:7 還特別加了一句：「我說的是真話，並不是謊言」（2:7）。</p><p>早期教會的接受史也很清楚：第二世紀後期起，教牧書信被普遍接受為保羅的書信——愛任紐（約主後 180 年）在《駁異端》的序言就引用了 1:4 與 6:20；穆拉多利經目、特土良、亞歷山大的革利免都把它們列為保羅書信。例外有兩個：<strong>馬吉安</strong>（約主後 140 年）的正典不收教牧書信，但他本來就刪去了所有他認為太「猶太」的經卷，連路加福音也刪改過；<strong>他泰安</strong>據耶柔米記載，拒絕提摩太前後書，卻接受提多書。<strong>經文問的是：今天學者提出的託名說有哪些理由？那些理由站得住嗎？</strong></p>"],["保羅親筆說（保羅本人寫成，與其他書信的差異來自主題、對象與晚年的處境）","","<p>認為信裡自稱是保羅，早期教會一致接受，內容又和保羅的生平、神學緊密相連，就應當照它自己所說的讀。1:12–17 的恩典神學是純正的保羅：神憐憫逼迫教會的人，叫他作「後來信他得永生的人作榜樣」（1:16）；2:5–6 的「一位中保」「捨自己作萬人的贖價」，正是羅馬書與加拉太書的福音。差異可以解釋：寫給同工的信，本來就和寫給教會的信不同；晚年的人重點自然轉向傳承。</p><p><strong>難處：</strong>字彙與文風的差異是真實的，不能用「主題不同」一句話全部打發；一些常見於保羅書信的字（例如「身體」作為教會的比喻、「聖靈」的大量使用）在教牧書信中相對少見。親筆說需要把這些差異誠實地列出來，而不是假裝它們不存在。</p>"],["代筆說（保羅授意、由同工執筆，所以字彙與文風不同）","","<p>認為保羅的書信常有代筆人：「我這代筆寫信的德提，在主裡面問你們安」（羅 16:22）；保羅也常在信末親筆問安（這使我們想起加 6:11；帖後 3:17），表示其餘部分不是他親手寫的。若教牧書信是保羅晚年授意、由一位同工按他的意思寫成，字彙的差異就很自然。有學者猜這位同工是路加——提摩太後書說「獨有路加在我這裡」（這使我們想起提後 4:11），而教牧書信的一些用字確實接近路加的文風。</p><p><strong>難處：</strong>代筆人是誰，經文沒有說，「路加」只是一個推測。而且代筆說若講過頭，會讓人以為信的內容不是保羅的意思——其實代筆說的主張正是：內容與權柄是保羅的，只是筆不是他拿的。</p>"],["託名說（保羅過世後，他的門生以他的名義寫成，約主後 80–120 年）","","<p>十九世紀起由施萊爾馬赫、包珥等學者提出，今天許多批判學者採用。四個主要理由與回應如下。<strong>①字彙</strong>：約三分之一的字不見於其他保羅書信。回應：主題不同（教會秩序、假教訓），字彙就不同；可能用了代筆人；三封信加起來篇幅不長，統計樣本太小，不可靠。<strong>②體制</strong>：監督、執事、長老的體制太成熟，像第二世紀。回應：保羅早就寫信給「和諸位監督，諸位執事」（腓 1:1）；保羅在各教會「選立了長老」（徒 14:23）；本卷的體制其實很簡單，監督和長老還是同一群人，<strong>還沒有單一主教制</strong>——第二世紀初的伊格那丟書信才有。<strong>③神學</strong>：「敬虔」「純正的教訓」「可信的話」這些重點不像保羅。回應：晚年的人重點本來就會轉向傳承與守護；而 1:12–17 的恩典神學完全是保羅的。<strong>④時間線</strong>：書信裡的行程與使徒行傳接不上。回應：最自然的解法是保羅第一次羅馬監禁後獲釋（徒 28:30–31 之後），再次旅行，見 ISS00_7。</p><p><strong>難處：</strong>託名說要解釋一件很難解釋的事：一位冒用保羅名字的作者，為甚麼要特別寫上「我說的是真話，並不是謊言」（2:7）？為甚麼要編出「我在特羅亞留於加布的那件外衣」（提後 4:13）這種細節？早期教會對託名的書是有警覺的——第二世紀有一位長老承認自己以保羅之名寫了《保羅與特克拉行傳》，結果被革除職分（特土良記載）。一個會為託名革除長老的教會，很難無聲無息地接受三封託名書信。</p>"],["殘篇說（託名作者使用了保羅親筆的書信殘篇）","","<p>二十世紀初由哈里遜（P. N. Harrison）等學者提出：教牧書信整體是後人寫的，但其中保存了幾段保羅親筆的私人字條，特別是提摩太後書第 4 章那些人名、行程與外衣、書卷的細節。這派想同時解釋字彙的差異和那些「太真實、不像編的」個人細節，是在親筆說與託名說之間的一種折衷。</p><p><strong>難處：</strong>殘篇從哪裡開始、到哪裡結束，主張的學者彼此差很多，看起來更像是為了解決問題而設的假設；而且提摩太前書幾乎沒有這種殘篇可以切出來——1:12–16 那段最個人的自述，偏偏是神學上最濃的一段，切不開。今天主張殘篇說的學者已經不多。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是使徒保羅</strong>（可能用了代筆的同工），寫於他第一次羅馬監禁獲釋之後（見 ISS00_7）。理由有四：信自己這樣說（1:1；2:7）；第二世紀後期起教會普遍接受，例外的馬吉安與他泰安各有自己的理由；託名說的四個理由都有合理的回應；而 1:12–17 的恩典神學與保羅的生平嵌合得無法分開。</p><p>議題頁把託名說的理由與回應照實陳列，不嘲笑持不同看法的學者——他們當中有很認真讀經的人。<strong>講台只講一句：</strong>寫這封信的人，在 1:12–16 用自己的名字擔保福音；<strong>一封說「在罪人中我是個罪魁」的信，最不像是冒名的人會寫的。</strong>冒名的人要借保羅的權威，會把保羅寫得更高；這封信卻把保羅寫到最低，把基督寫到最高。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。作者的爭論是真實的學術問題，值得認真面對；但你的信心從來不是建立在學者投票的結果上，而是建立在這封信所宣告的那一位身上：「基督耶穌降世，為要拯救罪人」（1:15）。這句話是教會在提摩太前書寫成以前就已經在傳的「可信的話」，不論這封信的筆是誰拿的，這句話都一樣可信。</p><p>反過來，這封信的作者給了我們一個最好的榜樣：<strong>他不用自己的成就來證明自己的權威，用的是自己被憐憫的經歷。</strong>如果有人問你「你憑甚麼信」，你也可以這樣回答：不是因為我讀過所有的辯論，是因為我也是一個蒙了憐憫的人。</p>"]],"con":[],"say":"本講義的全卷立場：作者是使徒保羅（可能用了代筆的同工）；託名說的四個理由（字彙、體制、神學、時間線）與回應在議題頁並陳；第二世紀後期起教會普遍接受，馬吉安與他泰安是例外。講台只講一句：一封說「在罪人中我是個罪魁」的信，最不像是冒名的人會寫的。","care":"牧養底線：席上可能有在大學或神學院第一次聽到託名說、心裡正在動搖的年輕人；不要在講台上嘲笑學者，也不要說「懷疑作者就是不信神」——那樣會讓他以後有問題不敢問。會後單獨陪他讀 1:12–17，讓他看見這封信的信息本身；必要時推薦一兩本立場清楚、態度誠實的導論書。也不要讓作者問題佔掉講台的時間：一句帶過，把力氣留給 1:15 那句「可信的話」。"},{"id":"ISS00_7","t":"寫作年代與保羅的晚年——教牧書信怎樣接在使徒行傳之後？","r":"1:3；3:14","ch":[],"why":"七、約主後 62–64 年，保羅第一次羅馬監禁獲釋之後（徒 28:30–31 之後）再次旅行；並陳其他排法。使徒行傳停在保羅在羅馬租屋住了兩年，沒有交代他的結局；提摩太前書卻說保羅「往馬其頓去」，把提摩太留在以弗所——這一段行程在使徒行傳裡找不到。年代的排法直接影響讀法：若是保羅晚年，這封信就是一位老使徒的傳承之書；若排在使徒行傳之內，它就是宣教途中的一封指示；若是託名晚出，它就是第二代教會的規章。這一題要在開卷交代，第 1、3、6 章的「保羅的晚年」才有位置。","pos":[["【一】經文問的是甚麼","","<p>信裡給了兩個時間線索。第一個是行程：「我往馬其頓去的時候，曾勸你仍住在以弗所」（1:3）——保羅離開以弗所往北，提摩太留下來。第二個是計畫：「我指望快到你那裡去，所以先將這些事寫給你」（3:14），可見保羅寫信時不在監裡，可以自由行動。</p><p>使徒行傳的結尾是：「保羅在自己所租的房子裡住了足足兩年」（徒 28:30），「放膽傳講神國的道……並沒有人禁止」（徒 28:31）。然後就沒有了。保羅在監中寫的腓立比書與腓利門書，都表達了他盼望獲釋、再去探望教會（這使我們想起腓 2:24；門 22）。提摩太後書則是在另一次監禁中，而且已經知道「我離世的時候到了」（這使我們想起提後 4:6）。<strong>經文問的是：1:3 的行程放在保羅一生的哪一段？提摩太前書與使徒行傳怎樣接起來？</strong></p>"],["獲釋後再次旅行說（約主後 62–64 年，保羅第一次羅馬監禁獲釋之後）","","<p>認為保羅在使徒行傳結尾的兩年之後獲釋，再次在東方各地旅行：到過克里特（這使我們想起多 1:5），到過以弗所，往馬其頓去，打算在尼哥坡里過冬（這使我們想起多 3:12）；這段時間寫了提摩太前書與提多書。之後他再次被捕，第二次在羅馬坐監，寫下提摩太後書，約在主後 64–67 年間於尼祿的逼迫中殉道。早期的旁證有：羅馬的革利免（約主後 96 年）說保羅「到了西方的盡頭」（《革利免一書》5:7），穆拉多利經目提到保羅往西班牙去，優西比烏也記載保羅獲釋後再次傳道、第二次被囚而殉道。使徒行傳所記的那次監禁，羅馬官方從頭到尾找不到保羅該死的罪（這使我們想起徒 26:31–32），獲釋本是合理的結果。</p><p><strong>難處：</strong>這段「第二次旅行」完全沒有使徒行傳的記錄，只能從教牧書信本身與教會傳統重建；革利免的「西方的盡頭」是指西班牙還是羅馬，也有不同理解。所以這是一個合理的重建，不是一份有完整文件的年表。</p>"],["使徒行傳之內說（約主後 54–57 年，保羅在以弗所的三年事工期間或剛結束時）","","<p>認為不必假設一次不見於使徒行傳的獲釋：保羅在以弗所住了三年，期間可能有短程的旅行；使徒行傳 20:1 也說保羅離開以弗所「往馬其頓去」，1:3 可以放在這裡。少數學者（如羅賓遜 J. A. T. Robinson）主張新約各卷都寫於主後 70 年以前，教牧書信也在其中。這派的優點是不需要額外的假設，完全在已知的年表內。</p><p><strong>難處：</strong>使徒行傳 19:22 說，保羅在離開以弗所以前，已經先打發提摩太往馬其頓去了，而 1:3 卻說保羅往馬其頓時，提摩太「仍住在以弗所」——兩者不吻合。而且以弗所的假教訓在徒 20 章還只是預言（「我去之後」），提摩太前書裡已經是事實，有人已經「船破壞了」（1:19）——這需要一段時間。把這封信放在保羅剛離開以弗所的時候，太早了。</p>"],["託名晚出說（約主後 80–120 年，保羅過世後的第二、三代教會）","","<p>持託名說的學者，把教牧書信放在第一世紀末或第二世紀初；他們認為書中的行程是作者為了讓信看起來真實而設的框架，並不對應保羅真實的行程。這個排法和作者問題綁在一起（見 ISS00_6），它的長處是把書信裡比較成熟的教會秩序與第二代教會的處境連起來看。</p><p><strong>難處：</strong>它的根據主要來自作者問題，而不是年代本身的證據；若作者是保羅，這個排法就自動不成立。而且信中的教會秩序其實很簡單，比第二世紀初伊格那丟所描寫的「一位主教、一群長老、一群執事」早得多。愛任紐在第二世紀後期已經引用這封信，留給它被寫成、流傳、被普遍接受的時間其實不多。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約主後 62–64 年，保羅第一次羅馬監禁獲釋之後（徒 28:30–31 之後）再次旅行時所寫；提多書約同時；提摩太後書在第二次羅馬監禁中，是保羅最後的一封信。</strong></p><p>這樣排，全卷的口氣就清楚了。<strong>這是一位六十歲上下的老使徒，寫給一位三十多歲的同工。</strong>他經歷了三十年的宣教、兩年的監禁，知道自己的日子不多；他在米利都對以弗所的長老們說過的預言，如今應驗了。他不再像寫加拉太書那樣為福音的本質爭辯，而是關心福音怎樣「交託那忠心能教導別人的人」（這使我們想起提後 2:2）。所以 1:15 的自述、3:16 的詩、6:20 的「保守所託付你的」，都要聽成一位老人的聲音。</p><p>其餘兩種排法在議題頁並陳；講台不必細講年代，只要讓會眾知道：<strong>這是保羅晚年的信，是一場接力的交棒。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>不該。年代是幫助我們讀懂經文的背景，不是信心的根基；不論這封信寫於哪一年，「只有一位神，在神和人中間，只有一位中保」（2:5）都一樣真實。</p><p>但知道這是保羅的晚年，會改變你讀它的心情。一個寫過羅馬書、去過三次宣教旅程、為福音坐過監的人，到了晚年最想交代的，不是自己的成就，而是「我是個罪魁」，是神的家要怎樣行，是年輕的同工要怎樣看守自己。<strong>信心走到最後，不是越來越覺得自己了不起，是越來越清楚自己蒙了多大的憐憫，也越來越想把所領受的交給下一代。</strong></p>"]],"con":[],"say":"本講義的全卷立場：提摩太前書約寫於主後 62–64 年，保羅第一次羅馬監禁獲釋之後（徒 28:30–31 之後）再次旅行時；提多書約同時，提摩太後書在第二次羅馬監禁中。使徒行傳之內說與託名晚出說在議題頁並陳。這是一位老使徒交棒的信。","care":"牧養底線：年代的問題對多數會眾不是信心的問題，不必在講台上細講；但要顧到席上那些正在「交棒」或「接棒」的人：年長的同工可能正在擔心沒有人接續，年輕的同工可能正被人小看。講保羅的晚年，不要講成「老了就該退下」，也不要講成「年輕人還不夠格」，而是講成一場接力：老的把所託付的交好，年輕的把所領受的守好。對面對病痛、退休或喪偶、覺得自己已經沒有用處的長者，讓他們知道：保羅最重要的幾封信，是在晚年寫的。"},{"id":"ISS00_8","t":"以弗所的假教訓是甚麼？家譜、禁戒、以敬虔為得利是怎麼回事？","r":"1:3--7；4:1--5；6:3--5；6:20--21","ch":[],"why":"八、猶太神祕主義、早期諾斯底、禁慾苦修三種成分並陳；本講義不把它簡化成任何一個今天的宗派，也不對號入座。提摩太前書每一章都有一段假教訓：無窮的家譜（1:4）、禁止嫁娶與禁戒食物（4:3）、以敬虔為得利（6:5）、似是而非的學問（6:20）。保羅沒有給它取名字，也沒有完整描述它；讀的人很容易憑自己的經驗去填空——把它說成今天某一個教派、某一種靈恩運動、某一個宗教，於是講台變成了點名大會。這一題要在開卷講定，各章碰到假教訓時才不會每章都講成同一件事，也不會對號入座。","pos":[["【一】經文問的是甚麼","","<p>保羅留下的線索散在全卷。第 1 章：「也不可聽從荒渺無憑的話語和無窮的家譜」（1:4），「這等事只生辯論，並不發明神在信上所立的章程」（1:4），有人「想要作教法師，卻不明白自己所講說的所論定的」（1:7）。第 4 章：「他們禁止嫁娶，又禁戒食物」（4:3），還有「老婦荒渺的話」（4:7）。第 6 章：「他是自高自大，一無所知，專好問難，爭辯言詞」（6:4），「他們以敬虔為得利的門路」（6:5），以及全卷最後的警告：「躲避世俗的虛談和那敵真道、似是而非的學問」（6:20），「已經有人自稱有這學問，就偏離了真道」（6:21）。提摩太後書再補一條：有人「說復活的事已過」（提後 2:18）。</p><p>這些線索有猶太的成分（律法、家譜、教法師），有知識的成分（γνῶσις，「學問」），有苦修的成分（禁嫁娶、禁食物），也有貪婪的成分（以敬虔得利）。<strong>經文問的是：這是一種甚麼樣的教訓？它為甚麼能在以弗所教會裡流行？今天的讀者要怎樣用這些經文？</strong></p>"],["猶太神祕主義成分（以律法、家譜與舊約人物的傳說為中心的玄想）","","<p>認為假師傅的核心是猶太的：他們想作「教法師」（νομοδιδάσκαλοι，律法教師，1:7），所以保羅緊接著說「律法原是好的，只要人用得合宜」（1:8）；「無窮的家譜」可能是對創世記人物的家譜與傳說作無止境的推演，這類玄想在當時的猶太文獻中確實存在（如《禧年書》對創世記的擴寫）；提多書也提到「猶太人荒渺的言語」（這使我們想起多 1:14）。這派的優點是緊貼第 1 章的用字。</p><p><strong>難處：</strong>典型的猶太律法主義會強調割禮，這封信卻完全沒有提割禮；「禁止嫁娶」也不是主流猶太教的教導——猶太教是非常重視婚姻與生育的。所以單用猶太的成分，解釋不了第 4 章。</p>"],["早期諾斯底成分（看輕物質與身體、以秘傳的「知識」為得救之道）","","<p>認為 6:20「似是而非的學問」原文是 ψευδωνύμου γνώσεως，「冒名的知識」——γνῶσις 正是第二世紀諾斯底派（「知識派」）的名稱來源；他們看輕物質與身體，認為得救在於得著秘傳的知識，所以有人禁嫁娶、禁食物（看輕身體），也有人「說復活的事已過」（提後 2:18，看輕身體的復活）。第二世紀的愛任紐寫書駁斥諾斯底派，書名就取自 6:20，可見早期教會就是這樣讀這節的。保羅回應時特別強調「凡神所造的物都是好的」（4:4），又唱「神在肉身顯現」（3:16）——正是對準看輕物質的思想。</p><p><strong>難處：</strong>完整成形的諾斯底體系是第二世紀的事，第一世紀只能說是「早期的」或「前諾斯底」的傾向；若把提摩太前書的假教訓直接等同於第二世紀的某一派，就會落入年代錯置，也會被託名說拿來作為晚出的證據。</p>"],["禁慾苦修成分（以禁戒與苦待己身作為屬靈的證明）","","<p>認為最清楚、最具體的線索是 4:3「禁止嫁娶，又禁戒食物」，這是一種把禁戒當作屬靈等級的苦修主義；保羅在寫給以弗所附近的歌羅西教會時也面對過類似的東西：「這些規條使人徒有智慧之名，用私意崇拜，自表謙卑，苦待己身」（西 2:23）。在以弗所，這種思想可能還結合了一種「已經實現」的末世觀：既然復活已經發生了（提後 2:18），我們已經像天使一樣，就不必嫁娶。這也可以解釋 2:15 為甚麼特別提到生產，5:14 為甚麼要年輕的寡婦嫁人。</p><p><strong>難處：</strong>苦修解釋得了第 4 章，卻解釋不了 6:5 的「以敬虔為得利」——苦修的人通常不貪財。所以假教訓很可能是一個混合體：一邊苦待，一邊貪婪；一邊講高深的知識，一邊爭辯言詞。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：以弗所的假教訓是一種混合的教訓，猶太神祕主義、早期諾斯底的傾向與禁慾苦修三種成分並陳；保羅沒有給它命名，本講義也不替它命名。本講義不把它簡化成任何一個今天的宗派，也不對號入座。</strong></p><p>保羅沒有花力氣描述假教訓的細節，他花力氣描述的是假教訓的<strong>果子</strong>：「這等事只生辯論」（1:4），生出「嫉妒、紛爭、毀謗、妄疑」（6:4）；良心「如同被熱鐵烙慣了一般」（4:2）；最後「在真道上如同船破壞了一般」（1:19）。對照之下，純正的教訓生出的是愛：「但命令的總歸就是愛；這愛是從清潔的心和無虧的良心，無偽的信心生出來的」（1:5）。<strong>所以今天的分辨，不是先問「這是哪一派」，是先問「這生出甚麼果子」。</strong></p><p>本卷還有一條很少人注意的線：假教訓有兩個方向——一邊是苦待（4:3），一邊是貪婪（6:5）。保羅兩邊都擋：對受造之物要「感謝著領受」（4:4），對錢要「知足」（6:6）。321 在末端接上去：有己可以長成禁慾的驕傲，也可以長成貪婪的驕傲——一個想靠自己的苦修抓住神，一個想靠神抓住錢。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——但應該讓你警醒，而且警醒的對象首先是自己。以弗所的假師傅不是從外面來的，是從教會裡面起來的；他們不是一開始就想害人，是從「偏離」開始的（1:6）。保羅給提摩太的對策不是去獵巫，是「你要謹慎自己和自己的教訓」（4:16），是「在敬虔上操練自己」（4:7）。</p><p>今天你也會碰到各種似是而非的教導：在網路上、在書架上、在別人熱情的邀請裡。你不必先背熟每一種異端的名字，只要記得問：這個教導，讓我更愛神、更愛人，還是讓我更驕傲、更愛爭辯、更看不起別人？<strong>結出愛的，是純正的；結出驕傲的，再高深也要躲開。</strong></p>"]],"con":[],"say":"本講義的全卷立場：以弗所的假教訓是一種混合的教訓，猶太神祕主義、早期諾斯底的傾向與禁慾苦修三種成分並陳；保羅沒有給它命名，本講義也不替它命名，不把它簡化成任何一個今天的宗派，也不對號入座。分辨的標準是果子：生出愛，還是生出辯論（1:4–5）。","care":"牧養底線：講假教訓時不點名任何今天的教派、教會或講員，也不嘲笑佛教、道教或任何宗教的素食與齋戒——4:3 的問題是「禁止」，是把禁戒當成得救或屬靈的條件，不是批評自願的選擇。席上可能有剛從某個團體出來、心裡還很害怕的人，也有家人仍在那樣的團體裡的人；不要把他們的經歷當作講台上的反面教材，會後單獨關心，陪他慢慢重新認識那位不用規條捆綁人的主。也提醒會眾：分辨是為了保護人，不是為了給別人貼標籤。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:5；3:15--16；6:20--21","ch":[],"why":"九、派別之爭不該；但「我守真道，是為了愛，還是為了贏」該——以弗所教會後來守住了真道，卻離棄了起初的愛（這使我們想起啟 2:2–4）。這一卷的議題頁要陳列許多爭論：女性能不能講道、3:2 該怎樣讀、教會體制、長老與控告、成功神學、作者、年代、假教訓。有些讀者會因此鬆一口氣，有些讀者卻會開始不安：連這麼基本的事都有爭論，我信的到底可不可靠？另有一些讀者會從此變得很會爭：每一題都要分出對錯、站好隊。提摩太前書本身正是一封叫人「守真道」又叫人「無爭論」的信，甚麼該守、怎樣守，必須在開卷講清楚。","pos":[["【一】經文問的是甚麼","","<p>提摩太前書同時給了兩幅圖。一幅是守：「提摩太啊，你要保守所託付你的」（6:20），「你要為真道打那美好的仗，持定永生」（6:12），「你要謹慎自己和自己的教訓」（4:16）。另一幅是愛：「但命令的總歸就是愛」（1:5），男人禱告要「無忿怒，無爭論」（2:8），傳異教的人卻「專好問難，爭辯言詞」（6:4）。守不是甚麼都要爭；愛也不是甚麼都可以。</p><p>這兩幅圖中間站著一首詩：「大哉，敬虔的奧祕，無人不以為然」（3:16）——神在肉身顯現，被聖靈稱義，被天使看見，被傳於外邦，被世人信服，被接在榮耀裡。<strong>經文問的是：甚麼是「所託付的」，不能讓？甚麼是可以有不同看法的事？一個人知道了這麼多爭議以後，信心該建立在哪裡？守真道的人，要守住甚麼樣的心？</strong></p>"],["標準答案說（每一題都必須有唯一的答案，信心才站得住）","","<p>認為一位忠心的信徒，在每一個議題上都應當有清楚而唯一的答案；承認有爭議，就是承認聖經不清楚，信心就會動搖。所以教會應當在性別、職分、體制、錢等每一題上都立好標準答案，要信徒照著相信，才不會被「似是而非的學問」帶走。這派的心志是保護信徒、守住所託付的，這份心是好的。</p><p><strong>難處：</strong>它把 6:20 的「所託付的」和教會內部敬虔的人之間的不同看法混在一起了。把每一題都升格成「真道」，結果是教會分裂成許多只和自己意見完全相同的小圈子，而這正是 6:4「嫉妒、紛爭、毀謗、妄疑」的溫床。而且信心若建立在每一題都答對上，任何一題的答案一動，整個信仰就跟著倒。</p>"],["爭議即不可靠說（既然甚麼都有爭論，信仰就只剩個人意見）","","<p>認為既然學者們連女性事奉、教會體制、作者都意見分歧，那就表示聖經沒有確定的教導，每個人照自己的感覺讀就好；愛就是不談真理、彼此不說對錯。這派誠實地面對了爭議的存在，也提醒教會不要假裝一切都很簡單、不要用自己的答案壓人。</p><p><strong>難處：</strong>它把爭議的「細節」與爭議的「範圍」混在一起了。互補派與平等派爭的是姊妹的職分，卻沒有人否認「只有一位中保」（2:5）；主教制、長老制、會眾制爭的是體制，卻沒有人否認監督要「無可指責」；親筆說與託名說爭的是作者，卻沒有人否認「基督耶穌降世，為要拯救罪人」（1:15）。而且這封信明說有「似是而非的學問」，有人因此「偏離了真道」（6:21）——真理不是可有可無的。</p>"],["守住中心、為愛而守（「所託付的」不能讓，其餘的事可以有不同看法；守的方式要合乎愛）","","<p>認為提摩太前書本身就劃出了中心。<strong>不能讓的</strong>，是本卷三處頌讚與幾句「可信的話」所標出的：「基督耶穌降世，為要拯救罪人」（1:15）；「只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌」（2:5），「他捨自己作萬人的贖價」（2:6）；3:16 那首六行的詩；以及那「永世的君王、獨一的神」（1:17）、「萬王之王、萬主之主」（6:15）。<strong>可以有不同看法的</strong>，是在這中心之外的解釋、歷史與實踐的問題。而且守的方式本身要合乎「命令的總歸」（1:5）：用愛心說誠實話，這使我們想起弗 4:15。</p><p><strong>難處：</strong>中心與邊緣的界線本身有時也會被爭論——有人會說性別或體制就是中心。所以劃線的時候，要以經文自己最清楚、最反覆強調的事為中心，而不是以某一個宗派最在意的事為中心；而且「為愛而守」不能變成「為了和氣就不守」，以弗所教會的歷史正好兩邊都提醒我們。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：派別之爭不該影響一個人的信心；但「我守真道，是為了愛，還是為了贏」該。</strong>中心是 1:15、2:5–6、3:16 與三處頌讚；其餘的事，照鐵律三先陳列各家、說出各自的難處、再給判斷，講台與教學場上一句帶過，指向議題頁與 ISS00_1–8。</p><p>以弗所教會的歷史線，給了這一題最有力的答案。保羅在米利都預言假師傅會起來（徒 20:29–30）；提摩太被留下來守住純正的教訓；大約三十年後，主對以弗所教會說：「你也曾試驗那自稱為使徒卻不是使徒的，看出他們是假的來」（啟 2:2）——他們守住了。可是主接著說：「然而有一件事我要責備你，就是你把起初的愛心離棄了」（啟 2:4）。<strong>這使我們想起 1:5：命令的總歸就是愛。守住了真道、卻失去了愛的教會，等於守住了柱子，卻讓家裡沒有人。</strong></p><p>所以全卷每一章都要守住 1:5。<strong>守真道是為了愛，不是為了贏。</strong>6:20 的「保守所託付你的」，目的是交給下一棒（這使我們想起提後 2:2），不是關起門來。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這些爭議可以讓你的信心更清楚。你會發現，所有爭論的人，都站在同一個地基上：一位蒙了憐憫的罪魁，一位降世為人的中保，一首「大哉，敬虔的奧祕」。你可以對 2:12 有一個看法，對 3:2 有另一個看法，卻和弟兄姊妹一起唱 3:16。</p><p>真正該問的，是另一個問題：<strong>我讀這些議題，是為了更愛主、更愛人，還是為了更會贏？</strong>如果讀完以後，你更想知道誰「沒資格」、誰「讀錯了」，那就回到 1:5 重讀一遍。如果讀完以後，你更清楚自己是一個蒙了憐憫的人，更願意在神的家中盡自己的本分，更溫柔地對待和你看法不同的人——<strong>那你就守住了所託付你的，也守住了起初的愛。</strong>「願恩惠常與你們同在」（6:21）——這封信最後一句話是恩惠，不是規條。</p>"]],"con":[],"say":"本講義的全卷立場：派別之爭不該影響一個人的信心；但「我守真道，是為了愛，還是為了贏」該。中心是 1:15、2:5–6、3:16 與三處頌讚，其餘的事陳列各家、說出理由。以弗所教會守住了真道，卻離棄了起初的愛（這使我們想起啟 2:2–4）——守真道是為了愛，不是為了贏。","care":"牧養底線：席上會有三種人。一種是讀了議題頁以後開始覺得甚麼都不確定的人；一種是很會爭、在每一題都站好隊、常常在網路上和人論戰的人；還有曾經在某一題上——性別、離婚、長老、錢——被教會傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，先陪他，指給他看 1:15 與 3:16；對第二種人，溫柔地陪他重讀 1:5 與 2:8，不在講台上羞辱他；對第三種人，讓他知道傷他的是人錯用了經文，不是那位捨己作贖價的基督（2:6）。疑惑若伴隨長期的失眠、無望感或輕生念頭，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:4「荒渺無憑的話語和無窮的家譜」——以弗所的假教訓到底是甚麼？","r":"1:3--7；4:1--3；6:3--5；6:20","ch":[1],"why":"保羅一開頭就叫提摩太去囑咐「那幾個人不可傳異教」（1:3），卻沒有把假教訓的內容完整寫出來，只留下幾個線索：荒渺的話、無窮的家譜、想作教法師、禁止嫁娶、以敬虔為得利、似是而非的學問。弄清楚它大概是甚麼，才不會把今天任何一位不同意見的人都當成許米乃，也才認得出這種教訓今天換了甚麼樣子。","pos":[["【一】經文問的是甚麼","","<p>「也不可聽從荒渺無憑的話語和無窮的家譜；這等事只生辯論，並不發明神在信上所立的章程」（1:4）。<strong>μύθοις καὶ γενεαλογίαις ἀπεράντοις</strong>（mythois kai genealogiais aperantois）直譯是「神話和沒有盡頭的家譜」。同一卷書又說他們「想要作教法師」（1:7）、「禁止嫁娶，又禁戒食物」（4:3）、「以敬虔為得利的門路」（6:5）。問題是：這些線索拼起來，是猶太式的律法揣測，是後來諾斯底主義的前身，還是兩者的混合？</p>"],["猶太揣測說：以舊約家譜與傳說為材料的律法辯論","","<p>許多學者認為，這是猶太會堂邊緣流行的一種讀經方式：拿舊約人物的家譜大做文章，編出各種補充傳說，再用來推論誰比較屬靈、哪些規條必須守。理由很直接：1:7 說他們想作「教法師」，提多書也說「不聽猶太人荒渺的言語」（多 1:14），又說要遠避「家譜的空談」與「因律法而起的爭競」（多 3:9）。</p><p><strong>難處：</strong>這一說解釋得了家譜與律法，卻不太解釋得了 4:3 禁止嫁娶的禁慾色彩，也不容易解釋 6:20「似是而非的學問」那種自稱有特殊知識的味道。</p>"],["早期諾斯底說：靈界譜系與「真知識」的雛形","","<p>另一些學者認為，「無窮的家譜」指的是靈界一層一層發出來的階梯，二世紀的諾斯底派正有這樣的體系；他們輕看物質與身體，所以禁止嫁娶、禁戒食物（4:3），又自稱有隱祕的知識，6:20 所說的「學問」原文就是 γνῶσις（gnōsis）。提後 2:18「說復活的事已過」，也像是把身體的復活靈意化。</p><p><strong>難處：</strong>完整的諾斯底體系要到二世紀才出現，把後來的系統讀回一世紀的以弗所，有時代錯置的危險；而且經文裡律法與「教法師」的色彩，諾斯底說不太解釋得了。</p>"],["混合說：猶太材料加上希臘式的禁慾與靈意化","","<p>也有學者主張，以弗所的假教訓是混合的：用的是猶太的材料（家譜、律法），帶著希臘世界輕看身體的傾向（禁嫁娶、禁食物），又有一種「我們已經到了」的屬靈優越感（復活已過），最後落在名利上（以敬虔得利）。這樣的拼盤正符合一個大港口城市的處境。</p><p><strong>難處：</strong>混合說最能照顧所有線索，卻也最難驗證；說得太細，就是我們自己在編另一套「無窮的家譜」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採猶太揣測說為主，保留它已帶著禁慾與靈意化色彩的可能</strong>（與逐節解經 1:4 同）。本卷與提多書的內證最直接指向猶太律法與家譜的揣測；4:3 與 6:20 則提醒我們，它已開始往輕看身體、自稱有知識的方向走。這一題的全卷立場見 ISS00_8，本章不另立說法。</p><p>比確認它的名字更重要的，是保羅給的試金石：它「只生辯論」，不帶出神的家政；它不是從清潔的心、無虧的良心、無偽的信心生出來的愛（1:5）。今天的末世時間表推算、聖經密碼、數字奧祕，名目不同，果子卻很像。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。學者對假教訓的標籤有不同意見，但對保羅的判斷沒有爭議：真理的果子是愛，假教訓的果子是辯論。你不必先成為異端史的專家，才能分辨一個教導。</p><p>可以問三個簡單的問題：它讓我更愛神、更愛人，還是更愛贏？它讓教會更像一個家，還是更像一個辯論場？它把我帶到基督面前，還是把我帶到某一位老師的書房裡？</p>"]],"con":[],"say":"本講義的立場：以弗所的假教訓以猶太式的家譜與律法揣測為主，已帶著禁慾與自稱有知識的色彩；本講義的全卷立場見 ISS00_8。分辨的試金石是 1:5——它生出的是愛，還是辯論？","care":"會眾席上可能有曾經陷在某個「更深真理」團體裡多年、後來才離開的人，他們對自己當年的熱心感到羞愧，也怕再被騙；也可能有家人正沉迷末世推算、天天轉貼的人。不要在講台上嘲笑這些人「笨」或「被騙」，那只會讓他們更不敢回來。牧者可以私下陪他們重讀 1:5，告訴他們：渴慕真理不是錯，只是被帶到了錯的地方；神的家仍然歡迎他們回來，帶著問題也可以。"},{"id":"ISS01_2","t":"1:8--11 律法還有用嗎？「律法不是為義人設立的」，那張清單又為甚麼照著十誡的次序？","r":"1:8--11；出 20:12--16；羅 7:12","ch":[1],"why":"這一段同時說了兩句看似相反的話：「律法原是好的」（1:8），又說「律法不是為義人設立的」（1:9）。信徒常在兩端擺盪：一端以為恩典來了，道德要求就不必管；另一端把律法當成得救或屬靈等級的條件。而清單照著十誡第五到第九條的次序排列，正好幫助我們看見律法在新約裡仍然在做甚麼。","pos":[["【一】經文問的是甚麼","","<p>「我們知道律法原是好的，只要人用得合宜；因為律法不是為義人設立的，乃是為不法和不服的……」（1:8--9）。<strong>δικαίῳ νόμος οὐ κεῖται</strong>（dikaiō nomos ou keitai）直譯是「律法不是為義人而擺設的」。問題有三：「義人」是誰？律法對已經在基督裡的人還有甚麼用？清單從孝敬父母一路到作假見證，正好對著十誡第五到第九條（這使我們想起出 20:12--16），保羅為甚麼這樣排？</p>"],["律法定罪說：律法的功用是叫人知罪、約束惡人","","<p>路德傳統強調律法的頭兩種用處：在社會上約束惡行，在人心裡叫人知罪、領人到基督面前。保羅說「律法本是叫人知罪」（羅 3:20），又說律法是「訓蒙的師傅，引我們到基督那裡」（加 3:24）。照這一說，1:9 的「義人」是在基督裡被稱義的人，律法的刀口已經不是對著他。</p><p><strong>難處：</strong>若只講定罪與約束，容易讓人以為信主以後律法就與我無關；可是保羅剛說「律法原是好的」，而清單上的每一項，信徒今天仍然不可以做。</p>"],["律法第三用說：律法仍是信徒生活的指引","","<p>加爾文與改革宗傳統另外強調「第三用」：律法不再定信徒的罪，卻仍然照出神的心意，指引蒙恩的人怎樣生活。保羅說「律法是聖潔的，誡命也是聖潔、公義、良善的」（羅 7:12）；耶穌也說「我來不是要廢掉，乃是要成全」（太 5:17）。清單照十誡排列，正說明十誡的道德內容在新約仍然有效。</p><p><strong>難處：</strong>講得不小心，容易又回到一張要守的清單，忘了 1:5 說一切命令的總歸是愛，也忘了 1:9 說律法「不是為義人設立的」那一份自由。</p>"],["基督律法說：摩西律法已經成全，信徒活在基督的律法之下","","<p>一些新約學者主張，摩西律法作為一個約的整體已經在基督裡成全，「律法的總結就是基督」（羅 10:4）；信徒的道德生活是在「基督的律法」之下，也就是愛的律法。十誡的道德內容之所以仍然有效，是因為它在新約裡被重新說出來，而保羅這張清單正是一個例子：他把十誡的第二塊版用「健康的教訓」重說了一次。</p><p><strong>難處：</strong>這一說在學術上細緻，講台上卻不容易說清楚，會眾可能只聽見「舊約律法已經不算了」，反而走到另一頭。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：律法原是好的，問題在用律法的手。</strong>對已經在基督裡的人，律法不再是稱義的途徑，它的刀口不是對著活在恩典中、按愛行事的人；但它所照出的罪仍然是罪，清單照十誡排列，正說明神要人怎樣對待父母、生命、婚姻、自由與真話的心意沒有改變。</p><p>三說各有所長：定罪說守住了福音，第三用說守住了聖潔，基督律法說守住了新約的次序。共同的落點是 1:5 與羅 13:10：「愛就完全了律法」（羅 13:10）。清單的每一項，都是愛的反面。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：人不能靠守律法稱義，蒙恩的人要活出聖潔，而聖潔的中心是愛。分歧在於怎樣描述律法在新約的位置，不在於福音本身。</p><p>對你今天最重要的，是 1:8 那個條件：「只要人用得合宜」。你讀經的時候，經文多半指向自己，還是多半指向別人？律法是先照自己的鏡子，然後才是扶別人的手。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：律法原是好的，只要人用得合宜；它不再是信徒稱義的途徑，卻仍照出神的心意，清單照十誡排列就是證據。一切命令的總歸是愛，愛就完全了律法。","care":"會眾席上可能有從小在嚴厲家庭或教會長大的人，一聽到「律法」就想起被責打、被羞辱的經驗；也可能有人剛信主，以為信了就可以不管從前的老毛病。對前者，不要再用律法壓他，先讓他聽見 1:15 的憐憫；對後者，溫柔而清楚地說明恩典不是放縱。清單上的「弒父母」「搶人口」也可能勾起家暴、人口販運受害者的傷痛，講到這裡不追問、不舉聳動的例子，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_3","t":"1:10「親男色的」——這個字是甚麼意思？教會今天怎樣牧養？","r":"1:10；林前 6:9--11；利 18:22；利 20:13","ch":[1],"why":"這是今天教會內外最敏感的經文之一。教會常有兩種失誤：一種是跳過不講，把真正需要牧養的人留給網路去回答；一種是只講這一項、講得特別大聲，把有同性吸引掙扎的弟兄姊妹與他們的父母推出門外。經文兩樣都不容許：它清楚說這行為與健康的教訓相抵觸，也把它放在「說謊話的」旁邊，沒有人可以置身事外。","pos":[["【一】經文問的是甚麼","","<p>「行淫和親男色的，搶人口和說謊話的，並起假誓的，或是為別樣敵正道的事設立的」（1:10）。<strong>ἀρσενοκοίταις</strong>（arsenokoitais）由「男人」與「床、同寢」兩個字根合成，現存文獻最早見於林前 6:9 與本節。問題是：這個字指的是男性之間一切的性行為，還是只指某一種剝削性的關係？今天的教會又該怎樣面對有同性吸引的人？</p>"],["利未記字源說：指男性之間的性行為","","<p>多數學者認為，保羅（或他之前的猶太基督徒）是從七十士譯本利未記組出這個字的：利 18:22 與 20:13 都把「男人」和「同寢」放在一起，和合本譯作「不可與男人苟合，像與女人一樣」（利 18:22）。本節又把它放在十誡第七條「不可姦淫」的位置上，緊接著「行淫的」。照這一說，它指男性之間的性行為，剝削的形式包括在內，但不止於此。</p><p><strong>難處：</strong>這個字在保羅以前沒有用例，字義只能從字源與上下文推論；而且講台若只講字義、不講牧養，很容易被聽成是在定一群人的罪，而不是在描述一種行為。</p>"],["剝削關係說：只指成人對少年、男妓或性剝削","","<p>另一派學者主張，希羅世界最常見的男性同性關係是成年男子與少年（pederasty）、主人與奴隸、嫖客與男妓，都有權力不對等的剝削；保羅禁止的是這些剝削，不是今天彼此委身的同性關係。他們也指出，清單下一項正是「搶人口的」，性剝削與人口買賣常常連在一起。</p><p><strong>難處：</strong>希臘文已經有專指與少年發生關係的字，保羅沒有用；他組出來的字直接呼應利未記的一般禁令，而利未記並沒有限定年齡或權力關係。把字義收窄到只剩剝削，與字源並不吻合。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採利未記字源說，並沿用本系列哥林多前書講義第 6 章的處理：</strong>這個字指男性之間的性行為，經文清楚說它與健康的教訓相抵觸，教會不迴避。同時守住三件事：第一，這是一個描述行為的字，不是描述一個人的身分或傾向；有同性吸引而選擇守貞的弟兄姊妹，在神面前並不比任何人更有罪。第二，它和「說謊話的」「起假誓的」並列，教會不可以只把這一項挑出來大聲講。第三，林前 6:11 接著說「你們中間也有人從前是這樣」——同一位神洗淨了每一種人。</p><p>教會的責任，是成為 5:1--2 說的那個家：讓選擇單身守貞的弟兄姊妹在教會裡有父母、有兄弟姊妹，不必獨自走這條路。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題對有些人來說不是學術問題，是自己、孩子或好朋友的生命。若你正在掙扎，請先聽見 1:15：基督耶穌降世，是為要拯救罪人，而保羅說他自己是罪人中的第一個。你不是教會裡最糟的人，你也不是一個議題，你是神所愛、正在路上的人。</p><p>若你和教會的立場不同，也請不要因為一節經文就把整個信仰丟掉；帶著問題留在神的家裡，和弟兄姊妹誠實地談，比一個人在網上找答案更安全。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:10「親男色的」指男性之間的性行為，經文清楚說它與健康的教訓相抵觸，教會不迴避；它描述的是行為，不是身分，和說謊、起假誓並列，教會也不羞辱任何人（沿用哥林多前書第 6 章的處理）。","care":"會眾席上可能有正在與同性吸引掙扎、從來不敢對任何人說的青少年；有剛知道孩子出櫃、心裡又痛又怕的父母；也有曾經在教會被嘲笑、被趕走的人。講台上絕不拿這件事開玩笑、不貼標籤、不用「那些人」稱呼他們，也不在會眾面前要人公開自己的性傾向。牧者要讓人知道可以私下來談，談的時候先聽、不追問細節、不急著給答案；若有人有自傷念頭或長期憂鬱，要陪他尋求專業協助。對父母，先陪他們哀哭，再陪他們繼續愛孩子。"},{"id":"ISS01_4","t":"1:13「因我是不信不明白的時候而做的」——無知可以減輕罪嗎？","r":"1:13；路 23:34；徒 3:17；羅 1:20","ch":[1],"why":"保羅說他從前褻瀆、逼迫、侮慢人，「然而我還蒙了憐憫，因我是不信不明白的時候而做的」（1:13）。這一個「因」字，好像在說無知是蒙憐憫的理由。這關係到我們怎樣看自己信主以前做過的事，怎樣看還在反對福音的家人，也關係到那些「我那時候不知道」能不能成為不認錯的理由。","pos":[["【一】經文問的是甚麼","","<p>「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫，因我是不信不明白的時候而做的」（1:13）。<strong>ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ</strong>（hoti agnoōn epoiēsa en apistia）的 ὅτι（hoti）可以讀成「因為」。問題是：保羅是說「因為我無知，所以我的罪比較輕，神就憐憫我」，還是在描寫憐憫臨到時他所在的光景？另一方面，羅 1:20 說人「無可推諉」，兩處要怎樣一起讀？</p>"],["減輕說：無知的罪與擅敢的罪有分別","","<p>舊約確實分辨兩種罪：「若有一個人誤犯了罪，他就要獻一歲的母山羊作贖罪祭」（民 15:27），「但那擅敢行事的……必從民中剪除」（民 15:30）。耶穌也說，知道主人意思卻不去行的「必多受責打」，「惟有那不知道的，做了當受責打的事，必少受責打」（路 12:48）。照這一說，保羅在說他的罪屬於前一類，所以仍有獻祭與赦免的路。</p><p><strong>難處：</strong>保羅的罪一點都不輕，他自己說是「罪魁」；而且下一節明說憐憫的來源是「主的恩是格外豐盛」（1:14），若無知是理由，恩典就不必格外豐盛了。</p>"],["處境說：「因」交代的是光景，不是理由","","<p>另一些學者認為，ὅτι（hoti）在這裡交代的是憐憫臨到時他所在的處境：他那時在不信裡，真的看不見。他在使徒行傳說「從前我自己以為應當多方攻擊拿撒勒人耶穌的名」（徒 26:9），他是真心以為自己在事奉神，正像耶穌說的「凡殺你們的就以為是事奉神」（約 16:2）。這不是減刑的申請，是誠實的描述。</p><p><strong>難處：</strong>這一說把「因」字讀得很弱，有些讀者會覺得不夠自然；而且它仍需要解釋，為甚麼保羅特別把這句話寫出來。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採處境說，並吸收減輕說的一個真理：</strong>「因」交代的是憐憫臨到的處境，不是憐憫的理由；理由在 1:14 的恩典。無知不使人無罪——羅 1:20 說人「無可推諉」；但無知使人仍在赦免可及之處。主在十字架上說：「父啊！赦免他們；因為他們所做的，他們不曉得」（路 23:34）；彼得也對釘死主的人說「我曉得你們做這事是出於不知」（徒 3:17），然後勸他們悔改。</p><p>所以這一節的方向是向外的：它叫我們對還在反對福音的人多一份耐心，而不是叫我們對自己的過去少一份責任。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論「因」字怎麼讀，各家都同意：保羅得救全是恩典，而神的憐憫可以伸到一個逼迫者身上。</p><p>若你為信主以前做過的事一直放不下，請記得：保羅沒有修飾他的過去，也沒有被它定住。若你為家裡那位一直反對信仰的人灰心，請記得：今天在會堂外面褻瀆的人，也許就是明天說「我蒙了憐憫」的人。</p>"]],"con":[],"say":"本講義的立場：1:13 的「因」交代的是憐憫臨到時的處境，不是憐憫的理由；理由是主格外豐盛的恩典。無知不使人無罪，卻使人仍在赦免可及之處——所以我們對還在反對福音的人要有長的忍耐。","care":"會眾席上可能有信主以前傷害過人的人——打過孩子、背叛過伴侶、在職場上做過不誠實的事——一直不敢面對；也可能有被傷害的人，聽到「他那時候不知道」會覺得自己的痛被輕看。不要用這一節叫受害者「體諒對方不懂事」，也不要用它叫加害者覺得不必認錯。牧者可以陪前者在主面前誠實認罪、在安全的情況下修補；陪後者先承認傷害是真的，饒恕的路可以慢慢走，不必在講台上被催逼。"},{"id":"ISS01_5","t":"1:15「我是個罪魁」——信主多年的人還是罪人嗎？","r":"1:15--16；林後 5:17；約壹 1:8--9","ch":[1],"why":"保羅寫這封信時已經作使徒三十年，卻用現在式說「我是」罪魁，不是「我從前是」。可是他在別處又說「若有人在基督裡，他就是新造的人」（林後 5:17）。信徒到底該怎樣看自己？這一題處理不好，一邊會叫人活在沒完沒了的自責裡，另一邊會叫領袖以為自己已經不需要恩典。","pos":[["【一】經文問的是甚麼","","<p>「『基督耶穌降世，為要拯救罪人。』這話是可信的，是十分可佩服的。在罪人中我是個罪魁」（1:15）。<strong>ὧν πρῶτός εἰμι ἐγώ</strong>（hōn prōtos eimi egō）的 εἰμι（eimi）是現在式；1:13 講過去時，保羅用的是「從前是」。問題有二：πρῶτος（prōtos）是「最壞的」，還是「第一個樣本」？現在式是說他仍然是罪人，還是說他仍然站在蒙恩罪人的位置上？</p>"],["蒙恩罪人說：既是義人，又是罪人","","<p>路德說，基督徒「同時是義人，也是罪人」：在神面前因基督被稱為義，在自己身上仍有罪的殘餘，一生都需要恩典。約翰也說：「我們若說自己無罪，便是自欺，真理不在我們心裡了」（約壹 1:8）。照這一說，保羅的現在式是真實的：越靠近光的人，越看得見自己身上的灰塵。</p><p><strong>難處：</strong>講得不平衡，容易叫人把身分停在「罪人」，忽略了新約更常稱信徒為「聖徒」；對本來就自責、自卑的人，這一說可能變成另一副重擔。</p>"],["新造身分說：信徒的身分是聖徒，現在式是謙卑的修辭","","<p>另一些解經家強調，新約稱信徒為聖徒、神的兒女、新造的人；保羅的「我是罪魁」是面對恩典時的謙卑說法，不是在定義他的身分。他在同一封信裡說主「以我有忠心」（1:12），在別處說「舊事已過，都變成新的了」（林後 5:17）。</p><p><strong>難處：</strong>這一說保護了信徒的身分，卻可能把保羅的現在式讀得太輕；若現在式只是修辭，就削弱了這一節對領袖的提醒：沒有人會長大到不再需要恩典。</p>"],["典型樣本說：「第一個」是恩典的展示品","","<p>還有一讀從 1:16 回頭看：「要在我這罪魁身上顯明他一切的忍耐」，原文是「在我這第一個人身上」。照這一說，πρῶτος（prōtos）的重點是「頭號樣本」：主把最難的案例放在櫥窗最前面，給後來的人看。保羅現在仍是那個樣本，因為主的忍耐仍在他身上被看見。</p><p><strong>難處：</strong>這一說很能接上 1:16，卻不能完全取代「最壞的」那層意思；保羅在別處也說自己「比眾聖徒中最小的還小」，他的確是真心這樣看自己。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採程度與典型合讀，並把「罪魁」與「蒙了憐憫」綁在一起讀</strong>（與逐節解經 1:15 同）。保羅真心認為自己罪最重，也正因為最重，他成了恩典的展示樣本。現在式說的是他站立的位置——他從來沒有離開過蒙恩的地方；不是說他的身分還停在舊人，因為在基督裡「他就是新造的人」（林後 5:17）。</p><p>所以兩句話要一起唸：我是罪人，他是救主；我是罪魁，我蒙了憐憫。缺一半，都不是福音。約翰也是兩句一起說：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義」（約壹 1:9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而應該叫你安心。如果連保羅到了晚年都還需要恩典，你今天還需要，並不表示你失敗了，只表示你仍然站在對的地方。</p><p>但也請不要把「我是罪人」變成每天鞭打自己的鞭子。保羅說完「我是罪魁」，下一句就停下來讚美（1:17）。記得自己是誰，是為了更記得他是誰。</p>"]],"con":[],"say":"本講義的立場：保羅的現在式說的是他站立的位置——一生都是蒙恩的罪人，從來沒有離開過恩典；不是說他的身分停在舊人，在基督裡他是新造的人。「罪魁」與「蒙了憐憫」要一起唸，缺一半都不是福音。","care":"會眾席上可能有長期憂鬱、強迫性自責、或從小被罵「你就是沒用」的人，聽到「我是罪魁」會更往下沉；也可能有剛跌倒、覺得自己不配再進教會的人。對這些人，不要只講前半句，要陪他把 1:16 讀完；不要說「你就是信心不夠才會這樣想」。若自責已經影響睡眠、飲食或出現自傷念頭，會後單獨關心，協助尋求專業協助。對帶領的人，則要溫柔地提醒：沒有人會長大到不再需要恩典。"},{"id":"ISS01_6","t":"1:17「永世的君王」——神為甚麼「不能看見」？舊約有人看見神，又怎麼說？","r":"1:17；6:16；約 1:18；西 1:15","ch":[1],"why":"1:17 與 6:16 兩處都說神是「不能看見的」，約翰也說「從來沒有人看見神」（約 1:18）；可是舊約說摩西、亞倫和長老「看見以色列的神」（出 24:10），以賽亞說「我眼見大君王」（賽 6:5）。這看起來像矛盾。這一題也牽涉到今天有人宣稱「看見神」的異象經驗，以及許多信徒「感覺不到神」的掙扎。","pos":[["【一】經文問的是甚麼","","<p>「但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！」（1:17）<strong>ἀοράτῳ</strong>（aoratō）是「不可見的」。6:16 更說他「住在人不能靠近的光裡，是人未曾看見、也是不能看見的」（6:16）。可是神對摩西說「你不能看見我的面，因為人見我的面不能存活」（出 33:20），同一章又說「耶和華與摩西面對面說話」（出 33:11）。問題是：「不能看見」是甚麼意思？</p>"],["顯現說：人看見的是神的顯現，不是神的本體","","<p>多數解經家認為，舊約那些「看見神」的經驗，看見的是神為了人而取的形像、他的榮光、他的使者，或異象中的景象，不是神的本體。出 24:10 看見的，經文只描寫到「他腳下彷彿有平鋪的藍寶石」；「面對面」是形容親密的交通，不是形容視覺。照這一說，「不能看見」指的是神的本質超越受造的眼睛。</p><p><strong>難處：</strong>這一說解釋了矛盾，卻可能讓人覺得神很遙遠；它也需要再回答：這些顯現與神自己是甚麼關係？</p>"],["基督顯現說：舊約的顯現是道成肉身以前的子","","<p>從初代教父起就有一個讀法：舊約裡人所看見的那一位，是還沒有成為肉身的子。約翰說「從來沒有人看見神，只有在父懷裡的獨生子將他表明出來」（約 1:18），又說以賽亞「看見他的榮耀，就指著他說這話」（約 12:41），上下文指的是耶穌。保羅也說「愛子是那不能看見之神的像」（西 1:15）。</p><p><strong>難處：</strong>這一說神學上很有力，但未必每一處舊約顯現都能確定就是子；說得太肯定，就是在經文沒有說明的地方替它說明。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採顯現說為基礎，並以基督顯現說為它的高峰：</strong>神的本體是受造的眼睛不能看見的，這是他的超越，也是 1:17 要我們敬拜的；舊約的顯現是神俯就人，而這俯就最完全的形式，是那位「將他表明出來」的子。哪一次舊約顯現確定是子，本講義不強作認定。</p><p>本章自己就給了一個美麗的答案：1:17 的「不能看見」緊跟在 1:16 的「顯明」後面——看不見的王，在一個罪魁身上把他一切的忍耐顯明出來。人看不見神，卻在基督身上、在蒙憐憫的人身上，看見他是怎樣的神。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：神的本體超越人的眼睛，神卻願意叫人認識他，而最清楚的啟示在耶穌基督。「人看見了我，就是看見了父」（約 14:9）。</p><p>若你常常「感覺不到神」，這不代表你信得不夠；連摩西也沒有看見神的面。若有人告訴你一定要有某種看見的經驗才算屬靈，請記得：主說「清心的人有福了！因為他們必得見神」（太 5:8）——那是應許，是將來的事，也是清心的人一路上的盼望。</p>"]],"con":[],"say":"本講義的立場：神的本體是人不能看見的，這是他的超越；舊約的顯現是神俯就人，最完全的顯明是基督。看不見的王，在一個罪魁身上顯明了他的忍耐——我們在基督身上看見神是怎樣的神。","care":"會眾席上可能有長期覺得神沉默、禱告像對著天花板說話的人，也可能有因為別人都說「看見異象」「聽見神說話」而覺得自己是二等信徒的人。不要在講台上把屬靈經驗當成標準，也不要對正在乾旱中的人說「你要有信心就會感覺到神」。陪他讀 1:16--17，告訴他：神被看見的方式，常常是他在一個人身上長久的忍耐；他的沉默不等於他的缺席。"},{"id":"ISS01_7","t":"1:18「從前指著你的預言」——今天還有個人預言嗎？怎樣分辨？","r":"1:18；4:14；林前 14:29；帖前 5:20--21","ch":[1],"why":"保羅提醒提摩太要憑著「從前指著你的預言」打那美好的仗（1:18），4:14 又說他的恩賜是「藉著預言、在眾長老按手的時候」賜的。今天有些教會常常有人對人說「神給我一句關於你的話」，有些教會則認為預言早已停止。這一題處理不好，一邊會讓人被所謂的預言操控婚姻、工作與去留，另一邊會讓人對聖靈的工作完全關上門。","pos":[["【一】經文問的是甚麼","","<p>「我兒提摩太啊，我照從前指著你的預言，將這命令交託你，叫你因此可以打那美好的仗」（1:18）。<strong>κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας</strong>（kata tas proagousas epi se prophēteias）是「照著那些先前指向你的預言」。4:14 說那是「從前藉著預言、在眾長老按手的時候賜給你的」（4:14）。問題是：這種針對個人的預言，是使徒時代特有的，還是今天仍然有？若有，怎樣分辨？</p>"],["停止說：預言隨著使徒時代與正典完成而停止","","<p>不少改革宗與基要派的學者認為，新約的預言和使徒一樣，是教會打根基時期的恩賜；正典完成以後，神的話已經完整地交給教會，不再需要新的啟示。提摩太的預言發生在使徒在場、眾長老按手的特殊時刻，不是今天可以照搬的模式。</p><p><strong>難處：</strong>新約沒有一處明說預言會在正典完成時停止；保羅吩咐「不要藐視先知的講論」（帖前 5:20），停止說需要從經文以外的推論才能成立，也可能讓教會對聖靈今天的引導過度謹慎。</p>"],["延續說：預言的恩賜今天仍然運行","","<p>五旬宗、靈恩派與許多福音派認為，聖靈的恩賜沒有停止，預言今天仍然是造就教會的恩賜；保羅說「作先知講道的，是對人說，要造就、安慰、勸勉人」，提摩太的經歷正好說明預言可以在按立、差派時堅固一個人的呼召，也可以像亞迦布那樣預先提醒（徒 21:10--11）。</p><p><strong>難處：</strong>實際運作上，「個人預言」常常被濫用：被用來決定別人的婚姻、事業，替領袖的權柄加持，預言落空時又沒有人負責；若沒有察驗，延續說很容易變成操控。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義不在本章裁判停止說與延續說</strong>（回指本系列哥林多前書講義第 14 章的處理），但不論採哪一說，都守住本節自己給的三條界線：第一，提摩太的預言是在群體中、在眾長老按手時說出來的，不是私下塞給他的一句話；第二，預言要被察驗，保羅說「至於作先知講道的，只好兩個人或是三個人，其餘的就當慎思明辨」，又說「但要凡事察驗」（帖前 5:21）；第三，預言在提摩太身上的功用是盔甲，叫他在灰心時站得住，不是頭銜，也不是操控人的工具。</p><p>任何預言都不高過聖經，也不能取代當事人自己在神面前的決定。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。教會在恩賜是否延續上有真誠的不同，但都同意聖靈今天仍在引導教會，而一切引導都要對齊聖經。</p><p>若你曾經在某個時刻被神清楚地呼召，在灰心的日子回頭記得它，那正是 1:18 的用意。若你曾經被一句「預言」綁住、嚇住，請知道：神的話不會要你離開聖經、離開群體、離開你自己的良心；你可以帶著它到成熟的同工面前一同察驗。</p>"]],"con":[],"say":"本講義的立場：本章不裁判預言是否延續；但不論採哪一說，預言都要在群體中被察驗、與聖經相合，它是提摩太打仗時的盔甲，不是頭銜，也不能用來決定別人的婚姻、工作與去留。","care":"會眾席上可能有人曾經被一句「神說你要嫁給他」「神說你要離開這間教

會」改變了一生，後來才發現那是操控，心裡又羞愧又憤怒；也可能有年輕人被說過一句美好的預言，卻在服事中被看輕，懷疑神是不是騙了他。不要嘲笑前者「太好騙」，也不要叫後者「不要相信那些」。陪前者承認受傷是真的、神並沒有騙他；陪後者回到 4:14 與 1:18，記得神的呼召是要他站得住，而不是要他證明給誰看。"},{"id":"ISS01_8","t":"1:19「在真道上如同船破壞了一般」——信主的人會失去救恩嗎？","r":"1:19；1:20；4:1；6:10；6:21；約 10:28","ch":[1],"why":"本卷一再說有人「偏離」（1:6）、「離棄真道」（4:1）、「被引誘離了真道」（6:10）、「偏離了真道」（6:21），1:19 更說他們「如同船破壞了一般」。這些人是真正信過主的嗎？他們的救恩失去了嗎？這是教會歷史上最古老的爭論之一，也牽動許多人深夜的懼怕：我會不會也這樣？","pos":[["【一】經文問的是甚麼","","<p>「常存信心和無虧的良心。有人丟棄良心，就在真道上如同船破壞了一般」（1:19）。<strong>ἐναυάγησαν</strong>（enauagēsan）是「觸礁沉船」；「丟棄」是自己用力推開。下一節保羅又說，他把其中兩個人交給撒但，「使他們受責罰就不再謗瀆了」（1:20）。問題是：船破的人原本在船上嗎？船破了，人還能被救上來嗎？這和主所說「誰也不能從我手裡把他們奪去」（約 10:28）怎樣一起讀？</p>"],["可失去說：真實的信徒可以離道而失去救恩","","<p>阿米念傳統與衛斯理宗認為，這些人是真實信過主的：他們有過信心，也有過良心，後來自己推開；新約的警告若對真信徒不可能發生，就失去了警告的意義。來 6:4 也描寫「已經蒙了光照、嘗過天恩的滋味」的人。照這一說，救恩是在持續的信心中保有的，人可以自己離開。</p><p><strong>難處：</strong>這一說很難與約 10:28--29 主自己的保證、腓 1:6「必成全這工」一起讀；講不好，會叫敏感的信徒天天懷疑自己是否已經失去救恩，活在恐慌裡。</p>"],["從未得救說：真正得救的人必蒙保守到底","","<p>改革宗的「聖徒蒙保守」認為，神所揀選、重生的人，必被神保守到底；那些最後離道的人，顯明他們從來沒有真正屬主。約翰說：「他們從我們中間出去，卻不是屬我們的；若是屬我們的，就必仍舊與我們同在」（約壹 2:19）。照這一說，1:19 的船破，是外在的信仰告白破了，不是神的工作失敗了。</p><p><strong>難處：</strong>1:19 說他們有過信心、有過良心，而且是在「真道上」破了船，讀起來不像是從來不在船上；講不好，又會叫人回頭懷疑自己當初是不是「真的」信了。</p>"],["警告作為保守說：警告是神保守人的方法","","<p>還有一些學者主張，新約的警告是真的、指向的危險是真的，而神正是用這些警告來保守他的百姓；警告與保證不是互相取消，而是同一個牧人的兩隻手。本章的例子正好如此：保羅嚴厲地警告船破，卻仍然把許米乃和亞歷山大的懲戒寫成「受責罰」，盼望他們回來。</p><p><strong>難處：</strong>這一說在牧養上很平衡，卻沒有直接回答「那些最後沒有回來的人，到底失去了甚麼」，在教義上仍要回到前兩說之一。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義不在本章裁判這一題的教義體系，但守住經文同時說的兩件事：</strong>警告是真的，船是真的破了，推開良心的人不可以自以為安全；而保羅接著以「受責罰就不再謗瀆了」（1:20）為目的，說明他沒有把這兩個人當作已經沉到海底的。</p><p>所以本講義採「警告作為保守」作為講台與牧養的落點：不替任何人宣判他的永恆結局，也不叫任何人拿「一次得救」當作推開良心的保險。對正在懼怕的人，說約 10:28 的保證；對正在推開良心的人，說 1:19 的警告。爭議與信心的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三說都同意：得救是神的恩典，信徒要持守信心與無虧的良心，而離道是真實的危險。分歧在於怎樣解釋這危險，不在於福音本身。</p><p>如果你正在害怕「我會不會已經失去救恩」，這份害怕本身常常就是良心還沒有被推開的記號。真正船破的人，多半不再為這件事失眠了。把你的懼怕帶到主面前，他是那位「能保守你們不失腳」的神。</p>"]],"con":[],"say":"本講義的立場：本章不裁判救恩能否失去的教義體系，但同時守住兩件事——船破的警告是真的，推開良心不可自以為安全；保羅仍以挽回為目的，所以我們不替任何人宣判結局。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有正在離開信仰的人的父母、配偶，日夜為他擔心；也可能有信心很敏感、常常懷疑自己是否真的得救的人。不要在講台上用「你會失去救恩」嚇人，也不要對家人離道的人說「他大概從來沒有信過」——那等於替神宣判，也在傷口上撒鹽。陪擔心的家人一起為那人禱告，告訴他們：保羅交出許米乃時，盼望的仍是他們回來。對被懼怕纏住的人，陪他讀約 10:28，必要時協助尋求專業協助。"},{"id":"ISS01_9","t":"1:20「交給撒但」——教會紀律是甚麼？目的是甚麼？","r":"1:20；林前 5:1--5；林後 2:6--8；太 18:15--17；加 6:1","ch":[1],"why":"「我已經把他們交給撒但」是新約最嚴厲的一句話之一。教會歷史上，它被用來施行過合乎聖經的紀律，也被用來合理化羞辱、冷暴力，甚至和趕鬼、咒詛連在一起。今天有些教會完全不再施行紀律，有些則拿紀律對付提出問題的人。弄清楚它的意思與目的——保羅自己說，是為了挽回——是保護被懲戒的人，也保護整個家。","pos":[["【一】經文問的是甚麼","","<p>「其中有許米乃和亞歷山大；我已經把他們交給撒但，使他們受責罰就不再謗瀆了」（1:20）。<strong>παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι</strong>（paredōka tō Satana hina paideuthōsi）的 παιδεύω（paideuō）是父親管教兒女、老師訓練學生的字。問題是：「交給撒但」實際上是做甚麼？是逐出教會，還是使徒宣告某種身體的懲罰？今天的教會該不該、又該怎樣施行紀律？</p>"],["逐出說：把人放回教會保護之外的世界","","<p>多數解經家認為，「交給撒但」就是逐出教會：把人放回撒但仍在作工的世界，讓他經歷離開神家的後果，好叫他醒悟回轉。林前 5 是最清楚的平行：「要把這樣的人交給撒但，敗壞他的肉體，使他的靈魂在主耶穌的日子可以得救」，同一章又說「把那惡人從你們中間趕出去」。兩處都把目的寫在同一句話裡：得救、受管教、不再謗瀆，都是為了挽回。</p><p><strong>難處：</strong>「逐出」在今天的教會很容易被執行成關門、冷落、斷絕一切往來，而林前 5 的「敗壞他的肉體」到底指甚麼，各家也不一致。</p>"],["使徒懲罰說：使徒宣告某種身體上的懲罰","","<p>另一些學者指出，使徒行傳裡有使徒權柄帶來身體後果的例子：亞拿尼亞仆倒斷氣（徒 5:5），行邪術的以呂馬暫時瞎眼（徒 13:11）。照這一說，「交給撒但」是保羅以使徒權柄宣告，讓撒但在他們身上帶來疾病或災禍，藉此管教。</p><p><strong>難處：</strong>這一說很容易被今天的人拿來咒詛人、或說某人生病是因為「被交給撒但」；而且本節的動詞重心在 ἵνα（hina）之後的「受責罰」，焦點是管教的目的，不是懲罰的方式。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採逐出說：這是教會紀律的最後一步，目的是使人回轉，與趕鬼、咒詛無關</strong>（紅線五；與逐節解經 1:20 同）。紀律有次序：先私下指出，「他若不聽，你就另外帶一兩個人同去」，最後才告訴教會（太 18:15--17）；每一步的精神都是「用溫柔的心把他挽回過來」（加 6:1）。哥林多的那一次紀律，結局是「倒不如赦免他，安慰他，免得他憂愁太過，甚至沉淪了」（林後 2:7）。</p><p>所以本講義明確拒絕三件事：當眾羞辱、逐出後的冷暴力（連家人都被孤立）、把懲戒和咒詛或趕鬼連在一起。也拒絕把 1:20 的「謗瀆」等同於批評領袖；涉及屬靈權柄被濫用的部分，本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。教會紀律的存在，不是說神的家很冷酷，而是說神看重聖潔，也看重每一個人；「凡管教的事，當時不覺得快樂，反覺得愁苦；後來卻為那經練過的人結出平安的果子，就是義」（來 12:11）。</p><p>若你曾經被教會懲戒、或被不公平地「處理」過，請把兩件事分開：教會的作法可能有錯，那是人的錯；但神對你的心意，始終和保羅對許米乃的盼望一樣——要你回家。</p>"]],"con":[],"say":"本講義的立場：「交給撒但」是教會紀律的最後一步，就是把人放到教會保護之外；目的寫在同一句話裡——「使他們受責罰就不再謗瀆了」，是為了挽回，不是羞辱、冷暴力或咒詛。涉及屬靈權柄濫用的部分，本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有曾被教會公開點名、被逐出後在街上遇見弟兄姊妹沒人打招呼的人，那份羞辱可能比當初的罪更難忘；也可能有家人被懲戒、自己也跟著被冷落的配偶與孩子。講這一題時不舉任何可辨認的真實案例，不要說「他是活該」。牧者要讓人知道，被懲戒的人仍然可以被探望、被禱告、被邀請回來；若有人在紀律過程中受了屬靈虐待，要先承認傷害、陪他尋求安全的協助，不要叫他「為了教會的合一」閉嘴。"},{"id":"ISS02_1","t":"2:1--2 為君王和一切在位的禱告——包括逼迫教會的政府嗎？","r":"2:1--2；2:4；耶 29:7","ch":[2],"why":"保羅吩咐教會「為君王和一切在位的」禱告，可是當時的掌權者沒有一位是基督徒，有些後來還逼迫教會。今天世界各地的華人教會，處在很不一樣的政治處境裡：有的享有自由，有的受限制，有的弟兄姊妹正在受苦。這一題講不好，講台很容易變成替某一個政權背書，或變成攻擊某一個政權的地方，會眾也會因此被撕成兩邊。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「為君王和一切在位的，也該如此，使我們可以敬虔、端正、平安無事地度日」（2:2）。<strong>ὑπὲρ βασιλέων</strong>（hyper basileōn）是複數，把皇帝、附庸王、各省總督都包進去；τῶν ἐν ὑπεροχῇ ὄντων（tōn en hyperochē ontōn）再擴大到一切在高位上的人。保羅沒有附帶條件。問題是：當在位者限制、甚至逼迫教會時，這個吩咐還成立嗎？禱告是不是就等於順服、等於支持？</p>"],["無條件禱告說：照樣禱告，因為神願意他們得救","","<p>多數教父與改教家都這樣讀：保羅寫這封信時，尼祿已經在位；主耶穌也說「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44）。禱告的理由不是在位者好不好，而是 2:4「他願意萬人得救」；先知也吩咐被擄的百姓「你們要為那城求平安，為那城禱告耶和華」（耶 29:7）。</p><p><strong>難處：</strong>講得不小心，容易把「為他禱告」聽成「支持他所作的一切」，叫正在受苦的弟兄姊妹覺得自己的苦被輕看了；也可能被掌權者拿來要求教會在不義面前沉默。</p>"],["禱告與順從分開說：為人禱告，不等於順從一切命令","","<p>另一些解經者強調：2:1–2 吩咐的是禱告，不是無條件的順從。使徒們在公會面前說「聽從你們，不聽從神，這在神面前合理不合理，你們自己酌量吧」（徒 4:19）；但以理知道禁令蓋了玉璽，照常禱告。為在位者禱告，與在良心的事上順從神而不順從人，可以同時成立。</p><p><strong>難處：</strong>這一讀若講過頭，會讓教會把「順從神」變成拒絕一切公民責任的理由，或把禱告講成一種政治表態；也容易讓會眾自己去判斷哪一個政府「值得」禱告，又回到保羅沒有設的條件。</p>"],["處境說：2:2 求的是教會生存的空間","","<p>有學者從處境讀：以弗所教會在城中受人注目，保羅要教會為官長禱告，是為了讓教會不被當作危險的團體，能夠「平安無事地度日」，福音也能繼續傳開。照這一讀，禱告的重點是社會的安定與傳福音的空間。</p><p><strong>難處：</strong>這一讀抓住了 2:2 的目的子句，卻可能把禱告講成一種求自保的策略；保羅的理由不只是教會的安寧，更是 2:4 神願意那些在位者自己也得救——禱告是愛，不只是策略。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採無條件禱告的讀法，並同時保留良心的自由。</strong>為在位者禱告，不論他善待或逼迫教會；禱告的目的是「使我們可以敬虔、端正、平安無事地度日」，禱告的理由是神「願意萬人得救」（2:4）。</p><p>同時守住兩條線：講台不為任何當代政權、政黨或領袖背書，也不攻擊任何當代政權，不評價任何國家的現任領袖；我們為職分禱告，也為坐在職分上的那個人得救禱告。為在位者禱告，不等於敬拜在位者——救主是神（2:3）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意要為在位者禱告；爭的是禱告之外，教會在不義面前該怎樣說話、怎樣行動，這在不同的處境裡有不同的智慧。</p><p>對你今天最重要的，不是先決定你對哪一個政府的看法，而是在名單上寫下一個掌權者的名字，為他禱告。神既然救了一個從前逼迫教會的保羅（1:13），就沒有一個在高位上的人在他的心意之外。</p>"]],"con":[],"say":"本講義的立場：為君王和一切在位的禱告，不論他善待或逼迫教會，因為神願意萬人得救（2:4）；禱告不等於背書，也不等於在良心的事上放棄順從神。講台不為任何當代政權背書或攻擊，不評價任何國家的現任領袖。","care":"會眾席上可能有因信仰而被約談、失去工作、家人被威脅的弟兄姊妹，也可能有政治立場彼此相反、在家裡已經吵到不說話的親人。不要對正在受苦的人說「你要為逼迫你的人禱告就好了」，先聽他說完、承認他的苦是真的；也不要在小組裡讓政治討論壓過禱告。涉及人身安全的處境，私下關心、協助他找到可靠的支援，不在公開場合追問細節。"},{"id":"ISS02_2","t":"2:4「他願意萬人得救」——既然神願意，為甚麼不是人人都得救？","r":"2:3--4；4:10；1:19","ch":[2],"why":"2:4 說神「願意萬人得救，明白真道」，這是全卷最寬的一句話；可是同一卷書也說有人「在真道上如同船破壞了一般」（1:19）。神願意的事，為甚麼沒有全部發生？這一題牽涉到揀選、人的回應與神的主權，也牽涉到一位為不信的家人流淚多年的信徒，怎樣理解神對他家人的心意。","pos":[["【一】經文問的是甚麼","","<p>「他願意萬人得救，明白真道」（2:4）。<strong>θέλει</strong>（thelei）是現在式，說的是神持續的心意；σωθῆναι（sōthēnai）是被動，得救是神的作為；ἐλθεῖν（elthein）是主動，人要「來到」真理的認識裡。問題是：「萬人」是每一個人，還是各樣的人？神「願意」，是他一定會作成的旨意，還是他真實的心願？</p>"],["普世得救說：最後人人都會得救","","<p>從俄利根到近代一些神學家，有人主張：神既然願意萬人得救，他的旨意最終必定成就，最後所有人都會得救。他們也引 4:10 神「是萬人的救主」，認為神的愛最終會勝過一切的抵擋。</p><p><strong>難處：</strong>本卷自己擋住了這一讀：4:10 下半句說神「更是信徒的救主」，1:19–20 也有人在真道上船破了；保羅在 2:7 緊接著說自己「為此奉派作傳道的」，若人人都必得救，傳道的急迫就消失了。歷代教會的主流都沒有採這一讀。</p>"],["各樣的人說：πάντας 指類別，不是每一個人","","<p>許多改革宗解經者認為：「萬人」指各樣的人——君王與平民、猶太人與外邦人；上下文 2:2 提到君王，2:7 提到外邦人，正是當時被認為最不可能得救的人。神的救恩不分族群、階級，但神有效的揀選落在選民身上。</p><p><strong>難處：</strong>這一讀抓住了上下文，卻容易把 2:4 的溫度講冷；θέλει（thelei）這個字讀起來是一份真實的心願，若只講成「各類中的某些人」，一位為家人禱告的人可能會問：神到底願不願意救我的父親？</p>"],["兩重旨意說：神真實地願意，也容許人拒絕","","<p>另一些傳統（包括許多阿米念派與部分改革宗學者）區分神「所喜悅的」與神「所定的」：神真實地願意每一個人得救，這心意不是假的；但他在主權中容許人拒絕，救恩向萬人敞開，信的人進入。這也接上 4:10「萬人的救主，更是信徒的救主」。</p><p><strong>難處：</strong>這一讀要承認神的旨意有不同的層次，聽起來比較複雜；也必須回答一個古老的追問——若神願意卻沒有發生，神的主權在哪裡？各派在這裡都承認有奧祕。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義沿用以弗所書立場二：取兩重旨意說，並承認「各樣的人說」抓住了上下文。</strong>神真實地願意每一個人得救，他的心比我們的禱告名單寬；2:2 的君王、2:7 的外邦人，正是這份心意最醒目的例子。</p><p>同時拒絕普世得救說：本卷明說有人偏離、有人船破，所以要傳道、要禱告。揀選與人的回應怎樣相合，本講義不勉強把奧祕說盡，但講台的方向很清楚：神願意，所以我們為萬人禱告，也向萬人傳。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：神是救主，救恩向萬人傳開，人要悔改相信；爭的是神的主權與人的回應怎樣在神心裡相合。</p><p>對你今天最重要的，是記得一個罪魁蒙了憐憫（1:15–16）。神既然願意救一個逼迫教會的人，你為那位還不信的家人禱告，就不是在求神作一件他不想作的事。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：沿用以弗所書立場二——神真實地願意萬人得救，救恩向萬人敞開，信的人進入；拒絕普世得救說，因為本卷明說有人在真道上船破了。神願意，所以我們為萬人禱告、向萬人傳。","care":"會眾席上可能有為不信的父母、配偶、孩子禱告了幾十年的人，也可能有至親已經離世、不知道他有沒有信主的人。不要在講台上用這一題斷定任何一位已經過世的人的永恆去處，也不要對哀傷的家屬展開揀選的辯論。先陪伴他、為他的思念禱告，把那位親人交託在那位「願意萬人得救」的神手中；必要時協助他尋求哀傷輔導。"},{"id":"ISS02_3","t":"2:5「只有一位中保」——聖徒代求、向馬利亞祈求、祭祖怎麼看？","r":"2:5；2:1；出 20:12","ch":[2],"why":"2:5 是更正教「唯獨基督」最常引用的經文之一，常被拿來批評向馬利亞與聖徒祈求；華人信徒也常拿它來談祭祖。可是同一章的 2:1 又吩咐我們彼此代求，十誡也說「當孝敬父母」（出 20:12）。這一題若講得粗糙，會叫人嘲笑天主教的朋友、和拜祖先的長輩起衝突，反而把那一位中保講成了一道牆。","pos":[["【一】經文問的是甚麼","","<p>「因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌」（2:5）。<strong>εἷς καὶ μεσίτης</strong>（heis kai mesitēs）與 εἷς γὰρ θεός（heis gar theos）平行：神是一位，中保也是一位。問題是：既然中保只有一位，我們請別人為我們代求、請已經離世的聖徒為我們代求、向祖先上香，各是甚麼性質？</p>"],["天主教與東方教會：唯一中保，聖徒是一同代求的家人","","<p>天主教與東方正教都承認基督是唯一的中保，並說向馬利亞與聖徒祈求，是請天上的家人一同代禱，就像我們請地上的弟兄姊妹代禱一樣；他們引 2:1 的「代求」，認為聖徒在基督裡的代求不取代基督，而是分享他的中保工作。</p><p><strong>難處：</strong>新約沒有教導人向已經離世的聖徒祈求，也沒有例子；在實際的敬虔生活裡，向聖徒祈求很容易變成另一層門路，讓人覺得直接到神面前不夠，正是 2:5 要拆掉的那一套。</p>"],["更正教：只彼此代禱，不向離世的聖徒祈求","","<p>更正教各宗派依據 2:5 與「我們只管坦然無懼地來到施恩的寶座前」（來 4:16）：活著的信徒可以彼此代禱，那是一同到同一位神面前；但不向離世的聖徒或馬利亞祈求，因為信徒可以直接藉著基督到父面前。</p><p><strong>難處：</strong>這一讀若講得不謹慎，容易變成嘲笑天主教的信徒，忘了他們也承認基督是唯一的中保；也可能讓一些更正教會眾矯枉過正，連彼此代禱都不敢請，好像請人代禱就是不信靠基督。</p>"],["祭祖的兩種讀法：孝道的紀念，或敬拜的對象","","<p>華人教會在祭祖上大致有兩種看法：一種認為上香、跪拜、燒紙錢是把祖先當作可以保佑、需要供奉的靈，等於在神和人中間另立中介，基督徒不參與；另一種區分紀念與敬拜，主張可以用獻花、追思、默禱、鞠躬等方式表達孝思。</p><p><strong>難處：</strong>第一種若講得生硬，會讓信徒在家族中被看成不孝，甚至與長輩決裂；第二種若界線不清，紀念與祈求很容易混在一起。兩種都需要在孝敬父母（出 20:12）與唯一中保之間找到誠實的路。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在 2:5 的字面上：神和人中間只有一位中保，就是人基督耶穌。</strong>活著的信徒彼此代禱，是同一個家的人一同敲門，不是另一層中介；本講義不教導向離世的聖徒或祖先祈求。</p><p>在祭祖上，本講義取「紀念不祈求」：孝敬是應當的，追思、獻花、敬禮、照顧長輩的心意都可以表達；但祖先不是我們到神面前的中保，也不是保佑我們的靈。這一句是告訴每一個人「路已經開了」，不是用來嘲笑任何人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。天主教、東方教會與更正教都承認基督是唯一的中保；爭的是聖徒的代求怎樣理解，以及華人的孝道怎樣表達。</p><p>對你今天最重要的，是你自己有沒有直接走到神面前。這位中保是「降世為人」的，他懂你的軟弱；你不必先找一層又一層的門路，今天就可以靠著他開口。</p>"]],"con":[],"say":"本講義的立場：神和人中間只有一位中保，就是人基督耶穌；彼此代禱是一同到神面前的家人，不是另一層中介。祭祖取「紀念不祈求」——孝敬父母是應當的，祖先卻不是我們的中保。不嘲笑天主教的信徒，也不嘲笑拜祖先的長輩。","care":"會眾席上可能有剛信主、正在為清明節或長輩的喪禮怎麼辦而煩惱的人，也可能有因為不肯拿香而被家族責罵、被說不孝的人。不要在講台上教人和家人決裂，也不要嘲笑他的父母；陪他想一想在喪禮與節日裡可以怎樣表達孝心，例如陪伴、守靈、獻花、照顧長輩，必要時由牧者陪他與家人溝通。"},{"id":"ISS02_4","t":"2:6「他捨自己作萬人的贖價」——基督為所有人死了嗎？","r":"2:6；4:10；可 10:45","ch":[2],"why":"主耶穌說自己「要捨命作多人的贖價」（可 10:45），保羅在 2:6 說「作萬人的贖價」。基督的死是為每一個人，還是只為選民？這是改革宗與阿米念派爭論了幾百年的「有限救贖」與「普遍救贖」之爭。這一題關係到傳福音時可不可以對每一個人說「基督為你死了」，也關係到一位懷疑自己是否被揀選的信徒的平安。","pos":[["【一】經文問的是甚麼","","<p>「他捨自己作萬人的贖價，到了時候，這事必證明出來」（2:6）。<strong>ἀντίλυτρον</strong>（antilytron）新約僅此一次，是「替代的贖價」；ὁ δοὺς ἑαυτὸν（ho dous heauton）是「把自己給出去」；ὑπὲρ πάντων（hyper pantōn）是「為了所有人」。問題是：「萬人」是每一個人，還是各樣的人？基督的死為誰付了代價、在誰身上生效？</p>"],["有限救贖說（特定救贖）：為選民付上贖價","","<p>多特會議以來的改革宗傳統：基督的死足夠所有人，卻是特意為選民付上的，並且必定在他們身上生效；2:6 的「萬人」與 2:4 一樣，指各樣的人，不分族群與地位。這一讀強調基督的死真實地成就了救贖，不只是開了一個可能。</p><p><strong>難處：</strong>2:6 的字面「為萬人」與 4:10「萬人的救主」讀起來很寬，這一讀要多作解釋；在傳福音時，也容易讓人不敢對每一個人說「基督愛你、為你捨命」，而福音的邀請本來是向萬人發出的。</p>"],["普遍救贖說：為每一個人付上贖價","","<p>阿米念派與許多福音派學者：基督的死是為每一個人付上的，救恩真實地向每一個人提供，人藉著信領受；他們也引「他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪」（約壹 2:2）。2:6 的「萬人」照字面讀。</p><p><strong>難處：</strong>若基督為每一個人付了贖價，而有人仍然滅亡，這贖價在那些人身上算不算「付了卻沒有贖回」？這一讀要說明贖價與實際得贖之間的關係，各派在這裡同樣碰到奧祕。</p>"],["足夠與有效說：為萬人足夠，在信的人身上有效","","<p>從中世紀的倫巴都到許多溫和改革宗學者（有人稱為「四點加爾文」），常用一句話調和：基督的死「為萬人足夠，為選民有效」。這一讀既保留 2:6 的「萬人」，也保留救恩必定成就的確據；4:10「萬人的救主，更是信徒的救主」正可以這樣讀。</p><p><strong>難處：</strong>兩邊的嚴格派都覺得這句話把問題講得太圓了：一邊認為它削弱了特定救贖，一邊認為它仍然保留了揀選的限制；它比較像一個牧養上的平衡，而不是把奧祕解開。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「為萬人足夠，在信的人身上有效」的說法，並並陳兩邊的理由。</strong>保羅這裡的重點是救恩向萬人敞開，與 2:4 同一條線；2:6 回響主耶穌自己的話，代價是他自己，不是一樣東西。</p><p>所以講台可以、也應當向每一個人說：基督捨了自己，你可以來。贖罪範圍的細節，各宗派有真誠的不同，本講義不以此劃界。321 說「無己」，它的源頭就在這一句：無己先是基督的樣子，然後才是我們的操練。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督的死是真實的替代，救恩唯獨藉著他，福音要向萬人傳；爭的是神在永恆裡的計劃怎樣安排。</p><p>對你今天最重要的，不是先弄清楚自己在不在某一張名單上，而是聽見 2:6 的動詞：他「捨自己」。你若今天信靠他，這贖價就是為你付的。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：基督捨自己作萬人的贖價，為萬人足夠，在信的人身上有效；救恩向萬人敞開，講台可以向每一個人說「你可以來」。贖罪範圍的細節各宗派有真誠的不同，本講義不以此劃界。","care":"會眾席上可能有一位反覆懷疑「我是不是被揀選的」、因此失眠、焦慮的人，也可能有在神學辯論裡被同伴嘲笑過的人。不要用這一題去考驗人的信心，也不要在小組裡讓辯論壓過敬拜。對焦慮的人，陪他讀 2:5–6 與 1:15，讓他把眼光從自己身上移到那一位捨己的中保；長期的焦慮與失眠，協助他尋求專業協助。"},{"id":"ISS02_5","t":"2:8「舉起聖潔的手」——禱告的姿勢重要嗎？","r":"2:8；詩 141:2；可 11:25","ch":[2],"why":"有的教會禱告時舉手，有的跪下，有的站立，有的低頭合掌；有人覺得不舉手就不夠火熱，有人覺得舉手太情緒化。2:8 說「舉起聖潔的手，隨處禱告」，是在規定禱告的姿勢嗎？這一題常在教會合併、跨宗派聚會、不同世代之間引起不必要的批評，也關係到身體有障礙、不能舉手或跪下的弟兄姊妹。","pos":[["【一】經文問的是甚麼","","<p>「我願男人無忿怒，無爭論，舉起聖潔的手，隨處禱告」（2:8）。<strong>ἐπαίροντας ὁσίους χεῖρας</strong>（epairontas hosious cheiras）是當時猶太人與希臘人共同的禱告姿勢，詩人也說「願我舉手祈求，如獻晚祭」（詩 141:2）。問題是：保羅在規定姿勢，還是在用當時的姿勢講一件更深的事？今天的教會該不該統一禱告的姿勢？</p>"],["姿勢有意義說：身體參與敬拜","","<p>不少靈恩派與禮儀傳統都強調：人是身體與靈魂一體的，舉手、跪下、俯伏，本身就是敬拜的語言；聖經裡舉手、跪下、俯伏的例子很多，但以理也是「雙膝跪在他神面前，禱告感謝」。姿勢可以幫助心專注，也可以表達順服與渴慕。</p><p><strong>難處：</strong>這一讀若講過頭，容易把姿勢當成屬靈程度的標記，讓不習慣舉手的人覺得自己不夠屬靈；也會讓身體有障礙、不能舉手或跪下的人覺得被排除在敬拜之外。</p>"],["重點在心說：「聖潔」與「無忿怒」才是重點","","<p>多數解經者認為：保羅強調的不是手舉多高，而是 ὁσίους（hosious）——聖潔的手，指生活；以及 χωρὶς ὀργῆς καὶ διαλογισμοῦ（chōris orgēs kai dialogismou）——沒有忿怒和爭論。主耶穌也說：「你們站著禱告的時候，若想起有人得罪你們，就當饒恕他」（可 11:25）。姿勢是當時的習慣，心才是神看重的。</p><p><strong>難處：</strong>這一讀若講過頭，容易讓人覺得身體怎樣都無所謂，甚至嘲笑舉手、跪下的弟兄姊妹太情緒化；聖經確實重視身體的敬拜，完全忽略姿勢也不是經文的意思。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「重點在心」的讀法，同時尊重姿勢的意義。</strong>2:8 要的是「聖潔的手」和「無忿怒，無爭論」的心；舉手、跪下、站立、低頭，聖經裡都有，都可以用，但沒有一種是必須的，也沒有一種代表屬靈程度。</p><p>這一節的真正門檻在後半句：不論教會對 2:11–15 採哪一個讀法，2:8 都在它前面——一雙剛才還指著弟兄罵的手，舉起來禱告，就不聖潔了。禱告前先和好，比手的高度要緊。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各教會的禱告方式不同，是歷史與文化的差異，不是信仰的差異；彼此不必評分。</p><p>對你今天最重要的，是看一看這一雙要舉起來的手：這個禮拜它簽了甚麼字、打了甚麼字、在網路上回了甚麼話？若有需要和好的人，先去和好，再舉手。</p>"]],"con":[],"say":"本講義的立場：2:8 的重點是「聖潔的手」與「無忿怒，無爭論」的心，不是姿勢；舉手、跪下、站立都可以，沒有一種代表屬靈程度。禱告前先和好，比手舉多高要緊。","care":"會眾席上可能有坐輪椅、關節退化、中風後不能舉手或跪下的弟兄姊妹，也可能有從很保守或很熱烈的教會轉來、正在適應的新朋友。不要在聚會中要求所有人舉手或跪下，也不要用「舉手的人比較有信心」這一類的話；帶領禱告時說一句「用你方便的姿勢」，讓每一個人都可以安心地禱告。"},{"id":"ISS02_6","t":"2:9--10「不以編髮、黃金、珍珠……為妝飾」——姊妹可以化妝、戴首飾嗎？","r":"2:9--10；彼前 3:3--4","ch":[2],"why":"有些教會曾經規定姊妹不可燙髮、不可戴首飾、不可化妝，甚至以此判斷一個人屬不屬靈；也有教會完全不提這兩節。2:9–10 到底是服裝規定，還是另有重點？這一題常被拿來檢查姊妹，卻很少被拿來檢查弟兄；講不好，會叫姊妹在教會裡被打量外表，也會把經文真正要的善行講丟了。","pos":[["【一】經文問的是甚麼","","<p>「又願女人廉恥、自守，以正派衣裳為妝飾，不以編髮、黃金、珍珠，和貴價的衣裳為妝飾，只要有善行，這才與自稱是敬神的女人相宜」（2:9–10）。<strong>θεοσέβειαν</strong>（theosebeian，敬神）新約僅此一次。問題是：這兩節是在禁止某些髮式和首飾，還是在講一件超越服裝的事？今天的姊妹可以化妝、戴婚戒、穿好看的衣服嗎？</p>"],["字面規定說：照字面不戴首飾、不編髮","","<p>教會歷史上有些傳統（如部分早期教父、某些聖潔運動與重浸派的群體）照字面守這兩節：姊妹不戴金飾珍珠、不作華麗的髮式、穿著樸素，以此表明與世界分別；他們也引彼得說「你們不要以外面的辮頭髮，戴金飾，穿美衣為妝飾」（彼前 3:3）。</p><p><strong>難處：</strong>若照字面，彼前 3:3 連「穿美衣」也一併禁止，幾乎沒有教會真的這樣守；而且這一讀容易把外表變成屬靈的標準，讓姊妹被檢查、被論斷，正好違背了 2:10「只要有善行」的重點。</p>"],["原則說：反對炫富與誘人，重點是善行","","<p>多數解經者認為：保羅列的「編髮、黃金、珍珠，和貴價的衣裳」是當時羅馬富家婦女炫富的全套，希臘羅馬的道德家也這樣批評；家庭教會裡坐著富人，也坐著奴隸。重點是不要以外表的身價引人注目，要以善行為妝飾；彼得同樣說「只要以裡面存著長久溫柔、安靜的心為妝飾」（彼前 3:4）。</p><p><strong>難處：</strong>這一讀若講得太鬆，容易把經文講成「怎麼穿都可以」，忽略了保羅確實在意外表所傳遞的信息；「炫富」的界線在不同的文化與收入裡也不一樣，需要每一位信徒誠實地自省，而不是由別人代為裁判。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採原則說：這兩節的重點是妝飾從外面移到裡面，不是服裝規定。</strong>姊妹可以化妝、戴婚戒、穿合宜好看的衣服；要避免的是用外表的身價在教會裡分出高低，讓人記得我們的是作了甚麼好事。</p><p>同時要說清楚：這兩節不是叫弟兄去檢查姊妹的衣著——經文對男人的要求在 2:8，是先管好自己的手和心；這個原則對弟兄一樣成立：名錶、名車、名牌在教會裡也會分出高低。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：神看重的是內心與善行，不是外表；爭的是外在的分別要守到甚麼程度。</p><p>對你今天最重要的，不是你今天戴了甚麼，而是你這一週作了甚麼善事。2:10 說這才與「自稱是敬神的」人相宜——這是一句寫給每一位弟兄姊妹的話。</p>"]],"con":[],"say":"本講義的立場：2:9–10 的重點是不以外表的身價分出高低，以善行為妝飾，不是服裝規定；姊妹可以合宜地打扮。這兩節不是給弟兄檢查姊妹衣著的根據，原則對弟兄一樣成立。性別與事奉的全卷立場見 ISS00_2。","care":"會眾席上可能有從小在「不可打扮」的規矩下長大、至今對自己的外表充滿羞恥的姊妹，也可能有曾被人說「你穿成這樣難怪會出事」而受過傷害的人。不要在講台上評論任何一位姊妹的衣著，絕不把任何人受到的侵犯歸咎於她的穿著。對受過傷害的人，不追問細節，會後單獨關心，必要時協助她尋求專業協助。"},{"id":"ISS02_7","t":"2:11--12「不許女人講道，也不許她轄管男人」——女性可以講道、當牧師、當長老嗎？","r":"2:11--12；林前 14:34--35；3:11","ch":[2],"why":"這是全卷、也是全套講義最敏感的一題。各宗派在姊妹能不能講道、能不能按立為牧師或長老上，有真誠而深刻的不同；αὐθεντεῖν（authentein）新約僅此一次，字義至今仍在爭論。這一題講不好，會讓在教會服事多年的姊妹覺得自己次等，也會讓持不同讀法的教會彼此定罪——而 2:8 剛剛說過「無忿怒，無爭論」。","pos":[["【一】經文問的是甚麼","","<p>「女人要沉靜學道，一味地順服。我不許女人講道，也不許她轄管男人，只要沉靜」（2:11–12）。2:11 的第一個命令是 <strong>μανθανέτω</strong>（manthanetō）：要學——在女人通常不被教的世界裡，保羅先開門。2:12 的 οὐκ ἐπιτρέπω（ouk epitrepō）可以是普遍規定，也可以是「我現在不准許」；αὐθεντεῖν（authentein）可以是中性的「行使權柄」，也可以是帶負面色彩的「擅自掌權、專橫地轄制」。問題是：這兩節今天怎樣落在教會的職分上？</p>"],["互補派（較嚴）","","<p>許多改革宗、浸信會與部分華人保守教會：女性不擔任向全會眾的權威性教導，也不擔任長老、監督；理由是 2:13 的「因為先造的是亞當」——保羅訴諸創造，不只是當地處境。他們也強調這不是價值的高低，而是角色的不同。</p><p><strong>難處：</strong>新約裡有女人在聚會中禱告、說預言（林前 11:5），百基拉在以弗所把神的道給亞波羅「講解更加詳細」（徒 18:26），嚴格的讀法要解釋這些例子；在實際的教會生活裡，也要小心「角色不同」不知不覺變成「價值不同」。</p>"],["互補派（較寬）","","<p>許多福音派教會：2:12 的限制只在長老、牧師這個帶權柄的職分；姊妹可以講道、教導、帶領查經、主持事工，只要在長老團的權柄底下。他們把 διδάσκειν（didaskein）與 αὐθεντεῖν（authentein）合讀為「帶權柄地教導」，也把 3:11 讀成可能是「女執事」。</p><p><strong>難處：</strong>這一讀要劃一條線：同一篇道，由姊妹在主日講就不行、在特別聚會講就可以，界線在哪裡？嚴格派認為它讓步太多，平等派認為這條線本身是人為的。</p>"],["處境派／平等派","","<p>許多循道衛理、五旬宗與部分福音派學者：這是針對以弗所特定處境的禁令——有婦女受假教訓影響（5:13–15；提後 3:6–7），又還沒有受過教導；αὐθεντεῖν（authentein）帶著奪權、專橫的意思；2:11 的重點是「讓她們學」，學成了，情況就不同。他們也引「並不分……或男或女，因為你們在基督耶穌裡都成為一了」（加 3:28）。</p><p><strong>難處：</strong>2:13 的「因為」訴諸創世記，不容易只當成地方性的理由；這一讀也要說明為甚麼保羅在別處沒有明說「等她們學成了就可以」，否則容易被聽成用處境把經文擱在一邊。</p>"],["中間讀法","","<p>部分華人教會的實際做法：2:12 的原則是「不可專橫地奪取權柄」，這對男女都適用；至於姊妹能不能擔任某一個職分，由各教會依自己的傳統與對經文的理解決定，彼此尊重。</p><p><strong>難處：</strong>這一讀在牧養上很溫和，但在解經上可能被兩邊都認為迴避了問題；一間教會總要作出決定，「各自決定」本身並沒有回答經文到底要求甚麼。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義沿用哥林多前書立場二：各宗派在這事上有真誠的不同，講義陳列四讀而不裁判。</strong>有的教會不讓姊妹擔任主任牧師或長老，有的教會按立姊妹，都是在認真讀這兩節之後作的決定；四讀都在認真對待經文。</p><p>但有三條底線不分宗派：一、2:11 先說「學」，姊妹要被有系統地教導；二、任何一種讀法，都不可以用這段經文貶低姊妹的價值、智力、屬靈地位或恩賜；三、不可用一句「那是當時文化」把經文一筆勾銷，也不可為這段經文彼此定罪——2:8「無忿怒，無爭論」寫在它前面。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：姊妹與弟兄同樣是按神形像造的，同樣蒙恩得救，同樣領受聖靈的恩賜；爭的是在地方教會的職分上怎樣安排。</p><p>對你今天最重要的，是回到 2:11 的「學」。不論你是弟兄或姊妹，不論你的教會採哪一讀，這一週你有沒有好好學一段真道？爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：各宗派在這事上有真誠的不同，講義並陳四讀而不裁判；但 2:11 先說「學」，任何讀法都不可貶低姊妹的價值、恩賜與屬靈地位，也不可用「當時文化」一筆勾銷。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有一位服事多年、教過主日學、帶過小組，卻曾被人當面說「女人不配講道」的姊妹；也可能有一位感到被呼召、卻不知道自己的教會能不能接納她的年輕姊妹；還可能有因為教會在這事上的決定而離開或受傷的人。不要在講台上點名任何一位姊妹的服事，也不要在她面前辯論她「夠不夠資格」；先肯定她的恩賜與擺上，清楚說明你的教會採哪一讀、理由是甚麼，並且讓她知道她在神家裡被看重。"},{"id":"ISS02_8","t":"2:13--14「先造的是亞當」「女人被引誘」——是創造次序，還是以弗所的處境？","r":"2:13--14；創 2:7；創 3:13；林後 11:3","ch":[2],"why":"2:13–14 是 2:12 的理由，也是各家讀法分歧的關鍵：保羅訴諸創造次序，是要立下超越文化的原則，還是針對以弗所的處境？教會歷史上曾有人用 2:14 說被騙是女人的天性，這種讀法傷過很多姊妹。這一題要問清楚保羅在說甚麼，也要問清楚他沒有說甚麼。","pos":[["【一】經文問的是甚麼","","<p>「因為先造的是亞當，後造的是夏娃，且不是亞當被引誘，乃是女人被引誘，陷在罪裡」（2:13–14）。2:13 的 <strong>γὰρ</strong>（gar）可以是因果的「因為」，也可以是舉例的「因為」；2:14 用了加強的 ἐξαπατηθεῖσα（exapatētheisa，被徹底欺騙），正是夏娃說「那蛇引誘我，我就吃了」（創 3:13）的同一個字根。問題是：先後次序是原則還是處境？夏娃被引誘，說的是女人的本性，還是一個未受教導就接觸教訓的人的處境？</p>"],["創造次序說：超越文化的原則","","<p>互補派的主要根據：保羅不是訴諸以弗所的風俗，而是回到創造（創 2:7；2:22），所以 2:12 的限制超越文化；先後次序不是價值的高低，而是神在家中與神家中所設的角色。保羅在林前 11:8–9 也用同樣的創造次序論證。</p><p><strong>難處：</strong>若「先造」就代表帶領的角色，創世記裡動物比人先造，這個推論需要更多說明；而且這一讀必須小心解釋 2:14，否則很容易滑到把被騙歸給性別的讀法，那是本卷自己不支持的。</p>"],["以弗所處境說：保羅把當地的傳說說正","","<p>處境派認為：以弗所是亞底米信仰的中心，當地的宗教與後來的諾斯底傳說都有「女性先於男性」「夏娃是啟蒙者」的故事；有些婦女正在被假教師牢籠（5:13–15；提後 3:6–7）。保羅回到創世記，是把被假教訓扭曲的次序說正，並用夏娃作例子：一個還沒有好好學過真道的人，最容易被騙——所以 2:11 的解藥是「學」。</p><p><strong>難處：</strong>關於一世紀以弗所有沒有這樣成形的傳說，學者證據不一，有些材料年代較晚；保羅的論證在字面上是回到創世記，不是回到以弗所，這一讀要說明為甚麼 γὰρ（gar）只是舉例。</p>"],["全教會的警告說：夏娃是男女都要聽的例子","","<p>另一些學者指出：保羅在林後 11:3 對整個哥林多教會（男女都在內）說，「就像蛇用詭詐誘惑了夏娃一樣」；夏娃是全教會的警告，不是某一性別的標記。也有一讀說神的命令是在夏娃被造以前直接給亞當的（創 2:16–17），夏娃聽到的是轉述——此讀可以幫助我們想像那個處境，但經文沒有明說，只並陳，不採為定論。</p><p><strong>難處：</strong>這一讀解釋了 2:14 不是在講女人的天性，卻還沒有完全說明保羅為甚麼在 2:12 的上下文裡特別舉夏娃；它比較是幫助我們排除錯誤的讀法，而不是解決 2:12 怎樣落實的爭論。</p>"],["【三】本講義站在哪裡","","<p><strong>在 2:13 是原則還是處境上，本講義並陳而不裁判，沿用 ISS02_7 的四讀。</strong>但在 2:14 上，本講義明確拒絕一種讀法：說被騙是女人的天性、女人的判斷比較不可靠。</p><p>理由在本卷自己：1:20 被交給撒但的許米乃、亞歷山大是男人；1:6 與 6:21 那些「偏離」的人不分男女；5:15 轉去隨從撒但的是年輕寡婦。偏離真道的有男也有女，被騙不分性別。「不是亞當被引誘」也不是在誇亞當——他沒有被騙卻吃了，是明知而犯；兩個人都落在罪裡，兩個人都需要同一位中保（2:5）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：男女同樣按神形像被造，同樣落在罪裡，同樣靠一位中保得救；爭的是創造次序在教會職分上的意義。</p><p>對你今天最重要的，是 2:14 給每一個人的同一個功課：被騙的危險不在性別，在不學、不查、只聽轉述。這兩節在地勢圖上是低谷，但下一節馬上說「得救」——讀到 2:14 停下來，就讀錯了這一段。</p>"]],"con":[],"say":"本講義的立場：2:13 是創造次序還是以弗所處境，並陳而不裁判；但拒絕把 2:14 讀成被騙是女人的天性——本卷偏離真道的有男也有女。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有從小被長輩說「女孩子頭腦簡單、容易被騙」而一直不敢相信自己判斷的姊妹，也可能有曾經被騙、被利用、至今深深自責的人。不要在講台上用夏娃開任何玩笑，也不要對受騙受害的人說「是你自己不小心」。陪她讀到 2:15 與 2:5，讓她知道低谷不是終點；若涉及詐騙、控制或其他傷害，不追問細節，協助她尋求專業與法律上的協助。"},{"id":"ISS02_9","t":"2:15「就必在生產上得救」——不能生育的姊妹怎麼辦？","r":"2:15；4:3；5:14；創 3:15","ch":[2],"why":"2:15 是全卷最難讀的一句，也是最容易傷人的一句。若照表面讀成「女人要靠生孩子得救」，不孕、流產、單身、喪子的姊妹會覺得自己被排除在救恩之外。這一題必須把四種讀法誠實地陳列出來，也必須說清楚四讀都同意的那一件事：救恩不是靠任何人的身體換來的。","pos":[["【一】經文問的是甚麼","","<p>「然而，女人若常存信心、愛心，又聖潔自守，就必在生產上得救」（2:15）。<strong>σωθήσεται</strong>（sōthēsetai）與 2:4 的 σωθῆναι（sōthēnai）是同一個字；διὰ τῆς τεκνογονίας（dia tēs teknogonias）有冠詞，τεκνογονία（teknogonia）新約僅此一次。διὰ（dia）可以是「藉著」，也可以是「經過、在……之中」。問題是：這裡的「得救」指永遠的救恩，還是身體的保全？「生產」指每一位女人的生育，還是特定的那一次生產？主詞從單數的「她」轉成複數的「她們」，又指的是誰？</p>"],["藉著那生產——基督的降生","","<p>不少教父與近代學者：冠詞指「那一次」生產，就是「女人的後裔要傷你的頭」（創 3:15）的應驗；神「差遣他的兒子，為女子所生」（加 4:4）。夏娃帶進了過犯，一位女子卻生出救主——女人沒有被咒詛定住。</p><p><strong>難處：</strong>這一讀神學上很美，但「那生產」若指基督降生，保羅的說法相當隱晦，而且後半句「若常存信心、愛心」是複數的「她們」，與基督降生的連結需要多一步推論。</p>"],["在生產中被保全","","<p>σῴζω（sōzō）在新約也可以指身體的保全。創 3:16 說生產必多受苦楚，這一讀認為保羅是說：信的姊妹在生產的危險中有神的保守。在古代，生產是婦女最常面對的生死關口。</p><p><strong>難處：</strong>許多敬虔的姊妹在生產中受了重傷，甚至離世，這一讀若講成應許，會讓她們的家人覺得是信心不夠；而且 2:4 與本卷其他地方的「得救」都是指救恩，不是指身體的平安。</p>"],["藉著履行母職而成聖","","<p>另一些解經者認為：生產代表女人在家中的呼召，「得救」指救恩在生活中的作成，不是稱義的根據；意思是姊妹在神所給她的處境裡，常存信心、愛心、聖潔，救恩就在她的生活中顯明出來。</p><p><strong>難處：</strong>這一讀若講得不小心，會把母職講成每一位姊妹都必須走的路，讓不孕、單身的姊妹覺得自己沒有走在神的呼召裡；「生產」也很難直接擴大為一切的家庭責任。</p>"],["對抗禁止嫁娶的假教訓","","<p>從本卷的處境讀：假教師「禁止嫁娶」（4:3），保羅反過來在 5:14 說「我願意年輕的寡婦嫁人，生養兒女」。照這一讀，2:15 是說：嫁娶生養不會使女人失去救恩，也不是屬靈的次等選擇——假教師說錯了。</p><p><strong>難處：</strong>這一讀很合本卷的上下文，但 2:15 本身沒有提到假教訓，需要從 4:3 與 5:14 回推；它解釋了為甚麼提生產，卻不太能解釋「得救」這個重字為甚麼放在這裡。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義四讀並陳，不定於一讀；但四讀都同意一件事：救恩不是靠生產換來的。</strong>得救的根據是那一位「捨自己作萬人的贖價」的中保（2:6）；這一節自己寫出的條件是「信心、愛心，又聖潔自守」，沒有一樣是生育。</p><p>所以，一位不孕的姊妹、一位經歷過流產的姊妹、一位單身的姊妹，讀到這一節，不必覺得自己被排除在救恩之外。寫這封信的保羅自己沒有結婚；如果生育是得救的條件，寫信的人第一個不合格。神願意萬人得救（2:4），「萬人」裡面沒有少掉她們。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：得救唯獨本乎恩、藉著信，靠著基督；爭的是保羅為甚麼在這裡提到生產。</p><p>對你今天最重要的，是記得第 2 章從為萬人禱告開始，在「得救」結束。從 2:14 的「陷在罪裡」到 2:15 的「必得救」，中間站著 2:5 那一位中保——家的門，始終是開著的。</p>"]],"con":[],"say":"本講義的立場：2:15 四讀並陳，不定於一讀；但救恩不是靠生產換來的，得救的根據是那一位中保，不孕、流產、單身的姊妹不被排除在救恩之外。本講義的全卷立場見 ISS00_2。","care":"會眾席上幾乎一定坐著一位正在為不孕治療掙扎的姊妹、一位剛經歷流產還不敢對人說的姊妹、一位單身多年常被親友追問的姊妹，也可能有失去孩子的母親。講這一節前先想到她們。不追問細節，不要求她「要有信心就會懷孕」，不對正在流淚的人說「你要有信心」，也不說「神一定另有美意」來催她不哭。會後單獨關心，陪她哀哭；必要時協助她尋求專業的醫療與心理協助。"},{"id":"ISS03_1","t":"3:1「監督」與 5:17「長老」是同一個職分嗎？教會體制怎麼看？","r":"3:1；5:17；徒 20:17--28；多 1:5--7","ch":[3],"why":"今天的教會有主教制、長老制、會眾制，也有「主任牧師」「長老會」「執事會」各種名稱，三方都說自己最合乎新約。3:1 的「監督」和 5:17 的「長老」若是同一群人，若是兩層職分，會直接影響一間教會怎樣設立領袖、怎樣問責。這一題也常常變成宗派之間的爭吵，需要先把經文自己說的與後來的發展分開。","pos":[["【一】經文問的是甚麼","","<p>3:1 說「人若想要得監督的職分，就是羨慕善工」（3:1），用的是 ἐπισκοπῆς（episkopēs），一件「看顧」的事；5:17 說「那善於管理教會的長老，當以為配受加倍的敬奉」（5:17），用的是 πρεσβύτεροι（presbyteroi），年長的人。問題是：這兩個字指的是同一群人的兩個名稱，還是兩個不同的層級？保羅在米利都請的是以弗所教會的「長老」（徒 20:17），卻對他們說「聖靈立你們作全群的監督」（徒 20:28）。</p>"],["同一職分說：一個職分，兩個名稱","","<p>多數新約學者與改革宗、長老會傳統：在新約裡，「長老」說的是這個人的身分與成熟，「監督」說的是他的工作——看顧。徒 20:17、28 用兩個字稱呼同一群人；多 1:5–7 先說「在各城設立長老」，接著就說「監督既是神的管家」，同一段話裡兩字交替；腓 1:1 只問候「諸位監督，諸位執事」，沒有另列長老。而且本卷的監督總是複數的群體帶領。</p><p><strong>難處：</strong>3:1–7 的監督用單數，5:17 又區分「善於管理的」與「勞苦傳道教導的」長老，似乎在長老群體裡已有分工；同一說若講得太死，難以解釋二世紀很快出現的單一監督。</p>"],["區分說：監督是長老群中的帶領者","","<p>主教制傳統（天主教、東正教、聖公會）與部分學者：新約裡兩字雖有重疊，但已出現分化的種子——提摩太、提多本人就站在長老之上，負責設立長老、處理對長老的控告（5:19–22）；到了二世紀初，伊格那丟的書信已清楚區分一位監督、一群長老與執事。這被看作使徒時代自然延續下來的秩序。</p><p><strong>難處：</strong>提摩太、提多是使徒的代表，不是地方教會的常任監督，用他們證明單一主教制是從後來倒推；伊格那丟反映的是一個地區的發展，不一定是使徒的設計；本卷自己也還沒有單一主教的痕跡。</p>"],["會眾制的讀法：權柄在全會眾","","<p>浸信會、許多獨立教會：新約的長老、監督固然存在，但最終的決定在全會眾——使徒行傳中揀選七人是「眾門徒」選出（徒 6:3–5），教會紀律也是當著全教會（太 18:17；林前 5:4）。監督與長老是會眾所認可的僕人，不是會眾之上的另一層。</p><p><strong>難處：</strong>本卷把很大的責任交給長老與提摩太，「善於管理」的長老配受加倍的敬奉（5:17），若一切都由投票決定，「管理」二字就很難落實；會眾制在實際運作上也可能變成少數人的操縱。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的讀法是：在本卷與使徒行傳裡，監督與長老大體是同一群人的兩個名稱</strong>——「長老」說他是誰，「監督」說他做甚麼；這一群人是複數的，彼此同工、彼此問責。但本講義不以本卷裁判主教制、長老制、會眾制：三者都可以從新約找到支持，也都可能違背本卷的精神。</p><p>本卷真正在意的不是名稱，是 3:1 的那個字：「善工」。任何體制，只要讓職分變成地位、讓領袖不必向任何人交帳，就已經偏離了經文；任何體制，只要讓品格可信的人以看顧的心照管神的家，就站在經文那一邊。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。歷代的聖徒在不同的體制裡忠心事主，也在不同的體制裡受過傷。體制是器皿，不是福音。你可以在一間主教制、長老制或會眾制的教會裡，同樣經歷「這家就是永生神的教會」（3:15）。</p><p>真正該問的是：我所在的教會，領袖是否被看顧、也被問責？我自己，是否用看顧的心在這個家裡做一份善工？</p>"]],"con":[],"say":"本講義的立場：在本卷與使徒行傳裡，監督與長老大體是同一群人的兩個名稱；本講義不以本卷裁判主教制、長老制、會眾制，只堅持職分是善工不是地位、領袖要被看顧也要被問責。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有從別的宗派轉來、對原來教會的體制心存傷痕的人，也可能有因為教會體制之爭而分裂、至今不願再參加任何會議的人。不要嘲笑別的宗派，也不要把「我們的體制最合聖經」當作福音來傳。若有人曾在某種體制裡被權力傷害，先聽他說完，肯定他受的傷是真的；涉及屬靈或其他方面的傷害，協助他找到安全的管道與專業協助。"},{"id":"ISS03_2","t":"3:2「只作一個婦人的丈夫」——離婚、再婚、喪偶再婚、單身的人可以作監督嗎？","r":"3:2；3:12；5:9；1:13--16","ch":[3],"why":"這是本章最容易傷人的一節。許多教會用它把離婚、再婚、甚至喪偶再婚的弟兄排除在職分之外，也有人用它暗示單身的人不夠成熟；會眾席上被背叛、被遺棄而離婚的人，聽到這一節常常抬不起頭。這一題必須把四種讀法和各自的難處攤開，並且守住一條底線：不在講台討論任何個人的婚姻史。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「作監督的，必須無可指責，只作一個婦人的丈夫」（3:2），執事也是「只要作一個婦人的丈夫」（3:12）。原文 <strong>μιᾶς γυναικὸς ἄνδρα</strong>（mias gynaikos andra），直譯「一個女人的男人」，μιᾶς（mias）放在最前面。5:9 寡婦的條件用的是同一個句型：「從來只作一個丈夫的妻子」（5:9）。問題是：這句話查的是一個人的婚姻紀錄，還是描寫他現在的品格？</p>"],["第一讀：禁止多妻","","<p>監督不可同時有兩個以上的妻子。這是字面上最直接的讀法，在多妻仍然存在的地區（例如部分非洲、亞洲的文化）也有很實際的意義，許多宣教處境的教會就是這樣應用的。</p><p><strong>難處：</strong>當時希臘羅馬社會在法律上是一夫一妻，猶太人中多妻也已罕見；而 5:9 寡婦的條件是同一個句型，女人並沒有「一妻多夫」的問題，可見這個句型說的不只是多妻。</p>"],["第二讀：禁止離婚再婚","","<p>離過婚又再娶的人，不作監督或執事。許多保守的福音派教會這樣執行，理由是領袖的婚姻要成為會眾的榜樣，離婚再婚會讓人在見證上有可指摘之處。</p><p><strong>難處：</strong>經文沒有說「從未離婚」；主耶穌和保羅都談過離婚的例外（太 19:9；林前 7:15），這一讀要把被背叛、被遺棄的人和背約的人放在同一欄，也要把那些複雜的問題全都塞進一個片語裡。而且它查的是過去，與清單上其餘各項都是現在的品格不一致。</p>"],["第三讀：禁止任何再婚，包括喪偶再婚","","<p>早期教會有人這樣讀，要求聖職人員一生只結一次婚；東正教至今對聖職人員的再婚仍有嚴格的規定。這一讀把「一個」讀得最徹底：一生只屬一個女人。</p><p><strong>難處：</strong>保羅在同一封信裡說「我願意年輕的寡婦嫁人」（5:14），也說妻子在丈夫死後就自由了（林前 7:39）；若再婚本身有虧，這些話就難以並立。這一讀也容易把一位喪偶後再婚的弟兄，在會眾眼中變成次等的人。</p>"],["第四讀：一個對妻子專一忠誠的人","","<p>這是一句品格的描述，不是婚姻史的履歷——他是「一心只屬一個女人的男人」。理由：清單上其餘各項，「有節制」「自守」「端正」，沒有一項在查過去的紀錄；在以弗所的神廟祭儀與宴席放縱中間，領袖的性道德是福音的招牌。這一讀也不要求監督必須結婚，否則單身的保羅連自己定的條件都不合。</p><p><strong>難處：</strong>用詞仍是婚姻的語言，預設的是一般的已婚男子；若只讀成「現在忠誠」，教會仍需要另外判斷一個人過去的婚姻破裂在今天是否影響他的見證，這一讀本身不替教會作這個判斷。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義以第四讀為主軸：一個對妻子專一忠誠的人</strong>，並陳其餘三讀。理由有二：清單其他各項都是現在的品格；而且寫這張清單的人在第 1 章剛說過：「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（1:13）——神親手用了一個過去最不合格的人。</p><p>各地教會若在按立上有自己的規定，那是教會治理的判斷，應照著程序、私下、溫柔地處理；但講台不把離婚、再婚、單身的弟兄姊妹當成「不合格的例子」，也不在會眾面前討論任何個人的婚姻史。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一節講的是職分的條件，不是救恩的條件，更不是一個人在神家裡的身分。不論你離過婚、再婚、喪偶或單身，你在基督裡都是「神家裡的人」（弗 2:19）。</p><p>如果你曾經因為這一節被羞辱，請記得：寫這一節的人，是一個自稱罪魁、卻被託付福音的人。神家的門，是恩典開的。</p>"]],"con":[],"say":"本講義的立場：3:2 以「一個對妻子專一忠誠的人」為主軸，並陳禁止多妻、禁止離婚再婚、禁止任何再婚三讀；講台不羞辱離婚、再婚、單身的弟兄姊妹，不討論任何個人的婚姻史。本講義的全卷立場見 ISS00_3。","care":"會眾席上一定有人離過婚——有的是被背叛、被遺棄、甚至是從家暴中逃出來的；也有人喪偶後再婚，有人一生單身。這一節講完，他們最可能的反應是散會就走。不要追問他們的婚姻細節，不要說「你要接受神的標準」，更不要在任何場合拿某個人的婚姻史當例子。會後單獨關心，告訴他：你在這個家裡是被接納的；若涉及家暴或安全問題，協助他尋求專業協助。教會若有按立的規定，由負責的同工私下、溫柔地說明。"},{"id":"ISS03_3","t":"3:2「善於教導」——每一位長老都要會講道嗎？","r":"3:2；5:17；多 1:9；提後 2:2","ch":[3],"why":"「善於教導」是十五項條件裡唯一的能力。有的教會因此只讓會講道的人作長老，結果長老會變成講員會；有的教會乾脆忽略這一項，長老只管行政與財務。這一題關係到一間教會怎樣揀選領袖，也關係到那些不擅長站講台、卻很會在個別談話中教導人的弟兄姊妹。","pos":[["【一】經文問的是甚麼","","<p>3:2 的 διδακτικόν（didaktikon）是「善於教導的」，被放在一串品格中間。5:17 卻說「那善於管理教會的長老，當以為配受加倍的敬奉；那勞苦傳道教導人的，更當如此」（5:17）——似乎在長老之中，有些人特別投入傳道教導。問題是：「善於教導」是每一位長老的條件，還是只有部分長老需要？「教導」一定是指在講台上講道嗎？</p>"],["全體說：每一位長老都要能教導","","<p>許多改革宗與浸信會傳統：3:2 對每一位監督都說「必須」，所以每一位長老都要能夠教導聖經；多 1:9 也說他要「堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了」（多 1:9）。在假教訓四起的以弗所，長老若不能教導，就守不住羊群。</p><p><strong>難處：</strong>若把「教導」只等同於公開講道，許多有屬靈智慧、卻不擅長站台的人就被排除；5:17 的區分也顯示，並不是每一位長老都同樣「勞苦傳道教導」。</p>"],["分工說：部分長老專職傳道教導","","<p>部分長老會傳統區分「治理長老」與「教導長老」：5:17 說有些長老特別「勞苦傳道教導」，可見長老之中有分工；有人負責治理與牧養，有人專職講道。這也符合今天許多教會「牧師」與「長老」並列的實際做法。</p><p><strong>難處：</strong>3:2 的「善於教導」是寫給所有監督的，不是只給一部分人；分工說若講得太寬，治理長老就可能完全不碰聖經，把屬靈的事全交給受薪的牧師，長老會變成董事會。</p>"],["廣義教導說：教導不只是講道","","<p>不少學者指出，διδακτικόν（didaktikon）的重點是「能教」，包括一對一的勸勉、在家中帶查經、在爭論中用聖經分辨是非，不一定是在講台上公開講道。提後 2:2 說要把所聽見的「交託那忠心能教導別人的人」（提後 2:2），講的正是一種傳承，不是一種表演。</p><p><strong>難處：</strong>這一讀容易讓教會降低標準，以為「會分享」就是「善於教導」；多 1:9 所說的「把爭辯的人駁倒」需要相當的聖經功夫，不是只靠熱心。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的讀法是：每一位長老都要「能教導」，但教導不只等於講道。</strong>他要明白純正的道理，能在個別的談話、家中的聚會、教會的決策裡，用聖經分辨是非、勸勉人；其中有些人特別「勞苦傳道教導」（5:17），教會要格外看重他們，也要合理供應。</p><p>而且「善於教導」被放在品格中間，本身就是一個提醒：一個人怎樣活，就怎樣教。會講不會活的人，不合 3:2；會活卻從不打開聖經的人，也不合 3:2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各教會在長老分工上的安排不同，但都同意：神的家需要明白真理、又活出真理的人來照管。</p><p>你若不擅長站講台，不必因此覺得自己在神的家裡沒有用處；你在餐桌旁、病床邊、手機訊息裡用一節經文安慰人，也是教導。你若很會講，請記得十五項裡有十四項是生命。</p>"]],"con":[],"say":"本講義的立場：每一位長老都要能教導，但教導不只等於公開講道，也包括個別勸勉、帶查經與用聖經分辨是非；部分長老特別勞苦傳道教導，教會當格外看重。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有很有屬靈智慧、卻因為口才不好而從來不被考慮服事的弟兄姊妹，也可能有被推上講台、其實很害怕、卻不敢推辭的人。不要用「會不會講」來評價一個人的屬靈生命，也不要在公開場合比較同工的講道。會後主動肯定那些在暗處教導人的弟兄姊妹；對害怕上台的人，給他們其他教導與陪伴的管道。"},{"id":"ISS03_4","t":"3:3「不因酒滋事」——基督徒可以喝酒嗎？","r":"3:3；3:8；5:23；羅 14:21","ch":[3],"why":"華人教會對酒的看法差異很大：有的教會要求會友滴酒不沾，有的教會的聚餐有葡萄酒；有的家庭因為酒而破碎，有的弟兄在應酬文化裡天天面對一杯酒。這一題處理不好，一邊會讓人用一杯酒論斷弟兄，一邊會讓正在戒酒的人再一次跌倒。","pos":[["【一】經文問的是甚麼","","<p>監督要「不因酒滋事」（3:3），原文 μὴ πάροινον（mē paroinon），字面是「不在酒旁邊的」——賴在酒席上、因酒失態鬧事的人；執事要「不好喝酒」（3:8），原文特別說 οἴνῳ πολλῷ（oinō pollō），「許多的酒」。同一封信卻又勸提摩太：「因你胃口不清，屢次患病，再不要照常喝水，可以稍微用點酒」（5:23）。問題是：經文擋的是酒本身，還是醉與失控？</p>"],["禁酒說：為了見證與軟弱的人，滴酒不沾","","<p>十九世紀以來的許多福音派、循道衛理與華人保守教會：今天的酒精濃度遠高於古代的葡萄酒，酗酒造成的家庭悲劇極多；保羅說「叫弟兄跌倒，一概不做才好」（羅 14:21），為了見證和軟弱的人，最好完全不喝。有些教會把它定為會友或同工的規範。</p><p><strong>難處：</strong>經文本身沒有禁酒——主耶穌在迦拿把水變成酒，保羅勸提摩太用酒；若把禁酒講成聖經的命令，就是把人的守則加在神的話上，也容易讓人用一杯酒論斷弟兄。</p>"],["節制說：可以喝，但不可醉、不可失控","","<p>多數解經家：3:3、3:8 的焦點是「醉」與「沉溺」，不是杯中有沒有酒；以弗所書也說「不要醉酒，酒能使人放蕩」（弗 5:18）。基督徒在這事上有自由，但自由受愛的約束——在戒酒的人面前、在可能跌倒的人面前，甘心不用自己的自由。</p><p><strong>難處：</strong>「節制」的界線因人而異，容易被當成放鬆的藉口；在應酬文化盛行的地方，「我只喝一點」常常是滑坡的第一步，也可能讓旁觀的年輕信徒誤會。</p>"],["藥用說：5:23 只是醫療上的例外","","<p>一些讀者認為，5:23 是因為「胃口不清，屢次患病」的特殊處境，當時的水不潔淨，酒有藥用；這顯示提摩太原本是不喝酒的，保羅才特別勸他。所以這一節不能被當作一般飲酒的許可。</p><p><strong>難處：</strong>這一讀說對了 5:23 的處境，卻不能推出「飲酒本身有罪」；提摩太不喝，可能是他自己的選擇，也可能受了 4:3 禁戒之風的影響，保羅正是在糾正這種過頭的禁戒。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場是節制：3:3「不因酒滋事」的重點是不醉、不失控，不是禁酒。</strong>不把飲酒本身定為罪，不把滴酒不沾當成屬靈的資格；也不用 5:23 鼓勵飲酒——那是藥用的處境。</p><p>教會若為了見證與保護軟弱的人，訂立同工不飲酒的規範，那是愛的選擇，可以尊重，但要說明那是教會的守則，不是經文的命令。聚會、聚餐的安排要顧及在場正在戒酒、或家庭曾被酒傷害的人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。在這件事上，真誠的基督徒有不同的良心，羅馬書 14 章的原則就是為這種事寫的：不要論斷，也不要叫人跌倒。</p><p>真正該問的不是「我可不可以喝」，而是「我在酒杯旁邊是甚麼樣子」「我身邊有沒有人會因為我跌倒」。如果酒已經在你的生活裡失控，那不是信心不夠，是需要幫助——請開口求助。</p>"]],"con":[],"say":"本講義的立場：3:3「不因酒滋事」的重點是節制——不醉、不失控；不把飲酒本身定為罪，不把滴酒不沾當成屬靈資格，也不用 5:23 鼓勵飲酒；在戒酒的人面前，甘心不用自己的自由。","care":"會眾席上可能有正在戒酒、或戒了很多年仍在掙扎的人；也可能有從小看著父親醉酒打人、至今聞到酒味就發抖的姊妹。不要在講台上拿喝酒開玩笑，不要說「喝一點沒關係」，也不要對正在掙扎的人說「你要有信心就戒得掉」。會後單獨關心，陪他找到戒癮團體或專業協助；對受過酒害的家庭，先聽他們的故事，不急著談饒恕。"},{"id":"ISS03_5","t":"3:4--5「使兒女凡事端莊順服」——兒女不信主或叛逆，父親還可以服事嗎？","r":"3:4--5；3:12；多 1:6；結 18:20","ch":[3],"why":"許多忠心的父母，兒女長大後離開了信仰，有的甚至公開反對。他們讀到 3:4–5，常常默默辭去服事，覺得自己「家都管不好」。另一方面，經文確實把家當作服事的試金石。這一題要分清楚經文查的是甚麼，也要保護那些正在為兒女流淚的父母。","pos":[["【一】經文問的是甚麼","","<p>監督要「好好管理自己的家，使兒女凡事端莊順服」（3:4），因為「人若不知道管理自己的家，焉能照管神的教會呢？」（3:5）；提多書更說「兒女也是信主的，沒有人告他們是放蕩不服約束的」（多 1:6）。問題是：「兒女」指年幼、仍在家中的孩子，還是包括已經成年的兒女？「順服」是家中的秩序，還是兒女的信仰？</p>"],["成年兒女說：兒女的信仰是父親的資格","","<p>部分保守的讀法：多 1:6 的 πιστά（pista）譯作「信主的」，所以監督的兒女必須都已經信主；兒女若離開信仰或公開放蕩，父親就應當退下職分。理由是：一個人的屬靈影響力，最先在自己家中顯明。</p><p><strong>難處：</strong>這一讀等於要父親為成年人的選擇負責，與「兒子必不擔當父親的罪孽」（結 18:20）的原則有張力；πιστά（pista）也可以譯作「忠實可靠的」；而且神自己作以色列的父，以色列仍然悖逆（賽 1:2）。</p>"],["年幼秩序說：父親帶家的方式","","<p>多數解經家：3:4 的 ἐν ὑποταγῇ（en hypotagē）說的是家中的秩序，是父親帶得到、也該帶好的範圍——孩子還在家中的時候，父親有沒有用愛和端莊建立秩序？和合本小註也作「端端莊莊地使兒女順服」，焦點是父親帶家的方式要莊重，不暴躁、不羞辱。</p><p><strong>難處：</strong>這一讀若講得太寬，可能讓人忽略家庭真實的混亂——一個在家中長期失職、暴躁的父親，不能用「孩子已經長大」來迴避經文的檢驗；多 1:6 的「放蕩不服約束」也確實是一種可見的光景。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「兒女年幼時的家中秩序」一讀，並明說：成年兒女不信主，不自動使父親失去資格。</strong>經文查的是父親怎樣帶家——有沒有用愛和端莊建立秩序，而不是成年兒女最後的選擇；信仰不能由父母代替決定，成年人要為自己向神交帳。</p><p>但這不是說家庭的光景無關緊要。一個在家中專橫、暴躁、失職的人，即使兒女年幼，也不合 3:4；教會在揀選同工時，可以私下、溫柔地了解家庭的情況，卻不可在會眾面前討論任何一個家。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兒女的路，最終是他們和神之間的事；你的眼淚，神都記得。許多後來回頭的浪子，都有一位沒有停止禱告的父母。</p><p>你若因為兒女的光景覺得自己不配服事，請記得：神自己也是一位等候浪子回家的父親。他沒有因此不再作父。</p>"]],"con":[],"say":"本講義的立場：3:4--5 查的是父親怎樣帶家——兒女年幼時，有沒有用愛和端莊建立秩序；成年兒女不信主，不自動使父親失去資格。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有兒女已經離開信仰、正在叛逆、甚至與家裡斷絕來往的父母，他們每個主日都帶著一份說不出口的羞恥。不要問「你孩子現在還有沒有來教會」，不要說「是不是你們當年沒有好好教」，也不要對他們說「你要有信心，他一定會回來」。會後單獨陪他們禱告，讓他們知道教會願意和他們一起等。若家中涉及暴力、成癮或安全問題，協助他們尋求專業協助。"},{"id":"ISS03_6","t":"3:6「初入教的不可作監督」——年資、成熟與按立該怎樣看？","r":"3:6；5:22；4:12；徒 14:23","ch":[3],"why":"教會缺人的時候，常常把剛信主、很有恩賜的人推上台；也有教會反過來，用「年資不夠」長期壓住年輕人。3:6 說初入教的不可作監督，4:12 卻說不可叫人小看你年輕；保羅自己在使徒行傳裡，又在短短幾個月後就為新教會選立長老。這一題要分清楚年資、年紀與成熟。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「初入教的不可作監督，恐怕他自高自大，就落在魔鬼所受的刑罰裡」（3:6）。νεόφυτον（neophyton）是「新栽種的」，τυφωθεὶς（typhōtheis）是被煙燻昏。同一封信說「不可叫人小看你年輕」（4:12），又說「給人行按手的禮，不可急促」（5:22）。問題是：多久才不算「初入教」？這是年資的門檻，還是成熟的判斷？</p>"],["年資門檻說：要有一定的信主年數","","<p>許多教會在章程裡訂下明確的年限，例如信主滿五年、受洗滿三年、在本會聚會滿兩年，才能被選為執事或長老。理由是：時間是最好的試驗，客觀的年限可以避免人情與偏私，也保護新信徒不被過早推上台。</p><p><strong>難處：</strong>經文沒有給年數；保羅和巴拿巴在第一次宣教旅程中，回程就「在各教會中選立了長老」（徒 14:23），那些教會建立不過幾個月。死板的年限也可能讓一位信主很久、卻一直沒有長進的人，比一位真正成熟的年輕人更早被按立。</p>"],["成熟判斷說：看根，不看年數","","<p>多數解經家：νεόφυτον（neophyton）是相對的，重點是「根的深淺」；以弗所教會已經十年，可以、也應該等，而提多書的監督條件裡就沒有這一項（多 1:5–9），因為革哩底的教會才剛建立。教會要觀察的是一個人的品格是否經過時間的試驗，是否在掌聲中仍然謙卑。</p><p><strong>難處：</strong>「成熟」比「年數」更難衡量，容易受主觀印象左右；若沒有任何程序，「他很成熟」可能只是「他和領袖關係很好」的另一種說法。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採成熟判斷說，並主張：按立要慢，要觀察。</strong>3:6 的問題不在年紀，在根；3:10「先受試驗」與 5:22「不可急促」連起來讀，意思一致：讓時間顯出一個人的根。教會可以訂立合理的年限作為輔助，但年限不能取代對品格的觀察。</p><p>同時要守住 4:12：不可因為年輕而輕看人。年輕人可以在言語、行為、愛心、信心、清潔上作榜樣，教會的責任是陪他扎根，而不是長期壓住他，也不是急著把他推上台。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。按立的慢，不是對人的不信任，是對羊群的愛，也是對那個人的保護。你若剛信主、很想服事，請珍惜這段扎根的時間；根扎得深的人，才站得久。</p><p>你若信主很久、卻覺得自己一直沒有被看見，也不必苦毒：3:13 說好好服事的人，自己就得著美好的地步——不論有沒有頭銜。</p>"]],"con":[],"say":"本講義的立場：3:6 的問題不在年紀，在根的深淺；按立要慢，要觀察（3:10；5:22），合理的年限可以輔助，卻不能取代對品格的觀察；也不可因為年輕而輕看人（4:12）。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有信主不久就被推上台、後來跌倒、至今不敢再碰服事的人；也可能有被長期以「年資不夠」擋住、心裡受傷的年輕人。不要在講台上舉例說「某某就是太早上台才跌倒」，也不要對年輕人說「你還不夠格，等著吧」。會後單獨關心那些曾經跌倒的服事者，陪他們重新扎根；對年輕人，具體告訴他們可以從哪一件小事開始服事。"},{"id":"ISS03_7","t":"3:11「女執事」——是女執事，還是執事的妻子？","r":"3:11；3:8；羅 16:1","ch":[3],"why":"和合本正文作「女執事」，小註卻說「原文是女人」。這一節牽涉到姊妹在教會裡能否擔任執事的職分，也常常被捲進更大的性別與事奉之爭。不同的讀法都有真誠的理由；這一題要把兩讀攤開，並且守住一條底線：不論採哪一讀，都不可用這一節貶低姊妹的恩賜與服事。","pos":[["【一】經文問的是甚麼","","<p>3:11 說：「女執事也是如此：必須端莊，不說讒言，有節制，凡事忠心」（3:11）。原文 <strong>γυναῖκας</strong>（gynaikas）可以譯「女人」，也可以譯「妻子」。這一節夾在執事的條件中間：前面 3:8–10 講執事，後面 3:12 又回到執事「只要作一個婦人的丈夫」（3:12）。問題是：這是另一組服事的女性，還是執事的妻子？</p>"],["女執事說：另一組服事的姊妹","","<p>理由有四：其一，γυναῖκας ὡσαύτως（gynaikas hōsautōs）的 ὡσαύτως（hōsautōs）和 3:8 一樣，是開新的一組人；其二，若指執事的妻子，通常會加「他們的」，原文沒有；其三，四項條件與 3:8 逐條平行；其四，當時的 διάκονος（diakonos）不分陰陽性，保羅稱非比是「堅革哩教會中的女執事」（羅 16:1），要指女性的執事，最自然的說法就是「女人」。二世紀初小普林尼的書信也提到兩位被稱為「女執事」的基督徒婢女。</p><p><strong>難處：</strong>若是另一個職分，為甚麼只有一節，又沒有自己的婚姻與家庭條件？保羅為甚麼不乾脆用 διάκονος（diakonos）加冠詞來指明？</p>"],["執事妻子說：執事的服事常需夫妻同工","","<p>理由是：這一節夾在執事的條件中間，3:12 立刻又回到執事的婚姻與家庭；若是另一個職分，結構顯得突兀。執事要挨家照顧、探望婦女，常常需要妻子一同服事，妻子的品格自然與執事的工作相關；所以保羅在執事的條件裡，順帶提到他們的妻子。</p><p><strong>難處：</strong>監督的工作更重，條件裡卻沒有相應的一節提到監督的妻子；原文沒有「他們的」，而且四項條件逐條對應 3:8，像是一組獨立的服事者，而不只是附帶的家屬。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩讀並陳，不作裁判。</strong>但指出經文本身清楚的兩件事：這一節夾在執事的條件中間，與執事的工作緊緊相連；而監督的條件裡，並沒有相應的一節提到監督的妻子。和合本把「女執事」放在正文、又誠實地加註「原文是女人」，是一個好榜樣。</p><p>這一節在今天的教會體制裡該怎樣落實，各宗派的判斷不同；但不論採哪一讀，經文都說明：在神的家裡服事的姊妹，與弟兄受同樣的看重，也受同樣的品格要求——保羅沒有為姊妹另定一套比較低、或比較苛的標準。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一題是教會怎樣安排職分的問題，不是姊妹在神面前的價值問題。不論你的教會怎樣讀這一節，非比把羅馬書送到羅馬，堅革哩的教會因她得幫助，這些都是聖經自己記下的。</p><p>你若是一位姊妹，你的端莊、你守口如瓶的忠心、你在病床邊和廚房裡的服事，在神的家裡都被看見。</p>"]],"con":[],"say":"本講義的立場：3:11「女執事」與「執事的妻子」兩讀並陳，不作裁判；但指出這一節夾在執事的條件中間，而且監督的條件沒有提監督的妻子；不論採哪一讀，都不可貶低姊妹的服事。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有在教會服事多年、卻一直被當作「幫手」的姊妹，也可能有因為性別之爭而離開過教會的人。不要在講台上替另一派貼標籤，不要說「姊妹做好本分就好」，也不要拿這一節來證明自己的教會比別人進步或保守。會後具體肯定姊妹們的服事；若有姊妹曾因性別在教會裡受過羞辱或傷害，先聽她說完，承認她的傷是真的。"},{"id":"ISS03_8","t":"3:15「真理的柱石和根基」——教會在聖經之上嗎？","r":"3:15；徒 17:11；約 17:17；弗 2:20","ch":[3],"why":"3:15 說教會是「真理的柱石和根基」，天主教與更正教對這一句的讀法很不一樣：一邊用它說明教會的權威與傳統，一邊擔心這會把教會放在聖經之上。今天也有一些教會或領袖，用這一句要求會眾不可質疑他們的教導。這一題關係到聖經與教會的關係，也關係到會眾是否還敢打開聖經查考。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「這家就是永生神的教會，真理的柱石和根基」（3:15）。στῦλος（stylos）是柱子，ἑδραίωμα（hedraiōma）新約僅此一次，是底座、根基。以弗所人聽到這一句，一定想起城外的亞底米大廟。問題是：教會是真理的來源與最終的裁判，還是真理的支撐與守護者？教會的傳統與聖經的關係是甚麼？</p>"],["天主教的讀法：教會是真理的保證","","<p>天主教傳統：3:15 說明教會由基督設立，在聖靈帶領下保守並解釋真理；聖經是在教會中寫成、由教會確認正典的，所以聖經、聖傳與教會的訓導彼此不可分。教會作為「柱石和根基」，在信仰與道德的事上有正確解釋聖經的權柄。</p><p><strong>難處：</strong>保羅在提摩太後書也說「聖經都是神所默示的」（提後 3:16），主耶穌也曾責備人「藉著遺傳廢了神的誡命」（太 15:6）；若教會的訓導最終不受聖經校正，歷史上教會的錯誤就難以被糾正。</p>"],["更正教的讀法：教會撐住真理，不製造真理","","<p>宗教改革以來的更正教：柱子不製造屋頂，底座也不發明房子。真理是神的道——「你的道就是真理」（約 17:17）；教會被建造在「使徒和先知的根基上」（弗 2:20），是被託付來高舉真理、守住真理的。所以庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），連使徒的話都要對照經文。這就是「唯獨聖經」的原則。</p><p><strong>難處：</strong>更正教若只講「唯獨聖經」，容易忽略教會在保守、傳遞、解釋真理上的真實角色，變成人人各自解經、教會四分五裂；歷代信經與教會的共識，也是聖靈在教會中工作的果子。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在更正教的讀法上：教會是真理的柱石和根基，不是真理的來源；教會在聖經之下，不在聖經之上。</strong>柱子把屋頂高舉起來，讓遠處的人看得見；底座把房子穩住，讓風吹不倒——教會的工作，一是高舉真理，二是守住真理。</p><p>同時尊重歷代教會的信經與共識，承認聖靈在教會中的工作；但一切傳統與領袖的教導，都要被聖經校正。一個教會若把自己的傳統放在神的話之上，它就不再是柱子，而成了另一座亞底米廟。而 3:16 告訴我們，柱石撐起的真理，是一位基督。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論天主教或更正教，都同意真理是從神來的，教會是被託付的。爭的是教會怎樣領受與解釋真理。</p><p>你可以安心地打開聖經查考，也可以感謝教會把這本書傳到你手中。若有人用這一節叫你不可再問、不可再查，請記得庇哩亞人：考查聖經，正是對真理最大的尊重。</p>"]],"con":[],"say":"本講義的立場：教會是真理的柱石和根基——高舉真理、守住真理，但不是真理的來源；教會在聖經之下，一切傳統與領袖的教導都要被聖經校正；柱石撐起的真理，是 3:16 那一位基督。","care":"會眾席上可能有從天主教家庭出來、家人仍在天主教會的人，也可能有曾經在某個教會被要求「不可質疑領袖」、因此受過屬靈控制的人。不要在講台上嘲笑天主教，也不要叫曾受控制的人「順服就好」。先聽他說完，肯定他願意查考聖經的心；涉及屬靈控制或其他傷害，協助他找到安全的管道與專業協助。"},{"id":"ISS03_9","t":"3:16「神在肉身顯現」——古卷不同，會影響基督的神性嗎？","r":"3:16；約 1:1--14；西 2:9","ch":[3],"why":"3:16 是全卷最重要的異文：和合本作「神在肉身顯現」，許多現代譯本與希臘文校勘本作「他在肉身顯現」。有人因此指控現代譯本「刪掉了基督的神性」，也有信徒第一次發現聖經古卷有差異，信心大受震動。這一題要說明異文的來龍去脈，也要說清楚：基督的神性不靠這一節成立。","pos":[["【一】經文問的是甚麼","","<p>3:16 說：「大哉，敬虔的奧祕，無人不以為然！就是神在肉身顯現，被聖靈稱義，被天使看見，被傳於外邦，被世人信服，被接在榮耀裡」（3:16）。第一行的開頭，古卷有三種讀法：<strong>Ὃς</strong>（Hos，「那一位」）、<strong>θεὸς</strong>（theos，「神」）、<strong>ὃ</strong>（ho，「那事」）。SBLGNT、WH、Tregelles、NA28 作 Ὃς；RP 與 TR 作 θεὸς，和合本照此翻譯。問題是：哪一個是原文？這會改變我們對基督的認識嗎？</p>"],["θεὸς 原文說：「神」才是原來的讀法","","<p>多數本（拜占庭傳統）與部分 TR 擁護者：大多數抄本都作 θεὸς（theos），教會在千年以上的時間裡都這樣讀；某些早期抄本的 Ὃς（Hos）可能是抄寫時漏掉了中間一橫與頂上的縮寫線。有人更認為，現代校勘本採 Ὃς 是有意削弱基督的神性。</p><p><strong>難處：</strong>最早的見證——西乃抄本原筆、幾份最早的大寫抄本、多數古譯本與教父引文——支持 Ὃς（Hos）；θεὸς（theos）的抄本多半較晚，有些還是後來的校正。指控現代譯本「否認神性」也不公平：同樣的譯本在約 1:1、西 2:9 都清楚地說基督是神。</p>"],["Ὃς 原文說：「那一位」才是原來的讀法","","<p>多數經文鑑別學者：其一，最早的見證支持它；其二，在大寫抄本裡，「那一位」與縮寫的「神」只差中間一橫和頂上一條線，抄寫時容易加上，不容易漏去；其三，Ὃς（Hos）是「較難的讀法」——陽性代名詞前面沒有先行詞，文法突兀，抄寫者若要修順，改成 ὃ（ho）配合中性的 μυστήριον（mystērion），或改成 θεὸς（theos），都很自然。而這個突兀正說明保羅在引一首早期教會的詩，詩一開口就是「那一位」，如同腓 2:6、西 1:15 的基督頌。</p><p><strong>難處：</strong>這是根據抄本年代與內證所作的判斷，不是絕對的證明；θεὸς（theos）的讀法在教會中流傳極久，也有它真實的抄本根據，不能被輕易貶為「錯誤」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：Ὃς（Hos）很可能是原文；和合本照 θεὸς（theos）翻譯，也有它的抄本根據。</strong>但兩種讀法說的都是同一位基督。「那一位在肉身顯現」本身就預設了他在顯現以前已經存在——沒有人會說一個普通人「在肉身顯現」。</p><p>而且基督的神性不靠這一節成立：「太初有道，道與神同在，道就是神」（約 1:1），「道成了肉身，住在我們中間」（約 1:14），「因為神本性一切的豐盛都有形有體地居住在基督裡面」（西 2:9）。異文改變的是這一節的措辭，不是這一位的身分。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約的抄本數量遠多於任何古代文獻，絕大多數異文是拼字與詞序；像 3:16 這樣有份量的異文，學者會公開陳列、仔細討論，正說明聖經經得起查驗。沒有任何一項基督教的核心信仰，是靠一處有異文的經文單獨支撐的。</p><p>你手上的和合本是可以信靠的聖經；用其他譯本的弟兄姊妹，讀到的也是同一位主。這些爭議怎樣看待，本講義的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：3:16 的 Ὃς（那一位）很可能是原文，和合本「神在肉身顯現」照 θεὸς 翻譯，也有抄本根據；兩種讀法說的都是同一位基督，基督的神性不靠這一節成立（約 1:1、14；西 2:9）。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有第一次聽到「聖經古卷有差異」而信心動搖的人，也可能有在網路上讀到「現代譯本是陰謀」而恐慌的長輩。不要嘲笑他們的擔心，也不要用艱深的術語把人壓下去。用簡單的話說明：異文是公開的、被仔細研究的，而基督是神，整本新約都在作見證。會後單獨陪他們讀約 1:1–14，讓他們的信心重新落在那一位身上，而不是落在一個字上。"},{"id":"ISS04_1","t":"4:1「在後來的時候」——是指今天嗎？","r":"4:1--2；來 1:2；提後 3:1","ch":[4],"why":"華人教會很容易把「後來的時候」「末世」直接對上新聞：戰爭、疫情、科技、政局，於是有人急著推算還剩幾年，也有人因此活在恐慌裡。這一題要分清楚：經文說的是一個時期，還是一張時間表？它要人警醒，還是要人猜日期？","pos":[["【一】經文問的是甚麼","","<p>「聖靈明說，在後來的時候，必有人離棄真道」（4:1）。<strong>ἐν ὑστέροις καιροῖς</strong>（en hysterois kairois）用的是 καιρός（kairos）——時期、時機，不是可以計算長度的 χρόνος（chronos）。問題是：保羅說的「後來的時候」，是指遙遠的將來（世界末了前最後幾年），還是指提摩太當下就在其中的時代？這會決定我們讀這一節，是去對照新聞，還是去看守教會。</p>"],["遙遠將來說（世界末了前的最後階段）","","<p>認為「後來的時候」是基督再來之前的最後一段時期，那時離棄真道的事會特別顯著；提後 3:1「末世必有危險的日子來到」也被讀成同一段末期。所以每一代都可以問：我們是不是已經到了那個時候？</p><p><strong>難處：</strong>保羅在 4:6 立刻要提摩太把「這些事」提醒當時的弟兄，1:3--7 與 1:19--20 也說以弗所已經有人偏離；若只指遙遠的將來，這封信對提摩太就失去了當下的用處。這個讀法也最容易滑向算日子，把每一則新聞都當成應驗。</p>"],["已經開始說（基督兩次降臨之間的整段時期）","","<p>認為新約把基督第一次來到第二次來之間整段日子都叫作末後：「就在這末世藉著他兒子曉諭我們」（來 1:2）。保羅說的現象，提摩太在以弗所已經看見，也會在每一個世代反覆出現；所以「後來的時候」就是教會所活的時代。</p><p><strong>難處：</strong>若一切都是末後，有人會覺得這個詞失去了緊迫感，好像兩千年都一樣，不必警醒。這個讀法也要回答：經文是否容許在末了時這些現象更加猛烈？</p>"],["已然未然說（已經開始，末了更甚）","","<p>結合前兩說：末後從基督第一次降臨已經開始，提摩太當下就在其中；同時，這段時期朝著主再來推進，離棄真道的現象可能越演越烈。所以每一世代都真實地在「後來的時候」裡，卻沒有一個世代可以宣告「就是現在這幾年」。</p><p><strong>難處：</strong>這個讀法比較平衡，卻不能給人想要的答案——到底還有多久。對喜歡具體預測的人，它顯得含糊；它要求的是長期的忍耐與警醒，而不是一次性的緊張。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已然未然說，不算日子（鐵律四）。</strong>「後來的時候」是提摩太已經活在其中、我們今天也活在其中的時期；這一節不是一張末日時間表，是一塊給每一個世代的警示牌。</p><p>經文的重點不是「何時」，而是「怎樣」：有人離棄真道的方式很屬靈——聽的是「靈」，信的是「道理」；他們的良心被烙慣了（4:2）。所以這一節的用處，是叫教會分辨教導、保護良心的柔軟，而不是把哪一年、哪一個事件放進這一節。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若有人因為「末世」的預測一次次落空而懷疑聖經，要知道：落空的是人的時間表，不是神的話。保羅自己沒有給任何年份。你今天能做的，不是猜日期，而是留意自己的良心還會不會痛，留意自己聽的道理是不是把你帶回基督。果效是忍耐，不是恐慌（鐵律六）。</p>"]],"con":[],"say":"本講義的立場：「後來的時候」是從基督第一次來到再來之間的整段時期，提摩太已在其中，我們也在其中；這一節是警示牌，不是時間表，本講義不算日子。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有人曾經跟著某位講員的末日預測變賣家產、辭去工作、放棄升學，預測落空之後又羞愧又憤怒；也可能有孩子聽了末世講道，晚上不敢睡覺。講台上不要嘲笑這些人「太容易受騙」，也不要再加一個新的預測。會後可以單獨陪伴他們，先承認那份失望是真的，再慢慢幫他們把指望從日期移回「永生的神」（4:10）身上。"},{"id":"ISS04_2","t":"4:3「禁止嫁娶，又禁戒食物」——基督徒吃素、守齋、獨身錯了嗎？","r":"4:3；西 2:20--23；林前 7:7；羅 14:3","ch":[4],"why":"華人教會裡有吃素的弟兄姊妹，有每年禁食禱告的傳統，有甘心單身服事的同工；許多人也來自佛教、道教家庭，家人初一十五吃素。若把 4:3 讀錯，講台會同時傷到三種人：自願禁戒的信徒、單身的同工，以及還沒有信主的家人。這一題要把「禁止」與「選擇」分清楚。","pos":[["【一】經文問的是甚麼","","<p>「他們禁止嫁娶，又禁戒食物，就是神所造、叫那信而明白真道的人感謝著領受的。」（4:3）主要動詞是 <strong>κωλυόντων</strong>（kōlyontōn）——禁止、攔阻；它描寫的是 4:2 那一群說謊的人。問題是：保羅反對的是婚姻與飲食的「選擇」本身，還是把禁戒立為得救或屬靈條件的「禁止」？今天自願吃素、禁食或獨身的基督徒，在不在這一節所責備的範圍裡？</p>"],["一律反對說（凡禁戒都可疑）","","<p>認為 4:3--5 已經宣告受造之物都是好的，所以基督徒任何形式的禁戒——長期吃素、定期禁食、立志獨身——都有禁慾主義的影子，容易滑向律法主義，應當避免；吃與嫁娶正是領受神恩典的方式。</p><p><strong>難處：</strong>這個讀法與新約衝突。保羅自己沒有結婚，並說「我願意眾人像我一樣」（林前 7:7），主耶穌稱許為天國的緣故不娶的人；初期教會有禁食禱告的傳統（徒 13:3）。羅 14:3 也明說不吃的人不可被輕看。把自願的選擇也定罪，本身就成了另一條禁止。</p>"],["只反對強制說（問題在「禁止」）","","<p>認為 4:3 的關鍵字是「禁止」：假師傅把禁戒立為規條，叫人以為不守就不夠屬靈、不能得救。西 2:20--23 那一串「不可拿、不可嘗、不可摸」的規條是同一類，保羅說它們「在克制肉體的情慾上是毫無功效」。所以自願的吃素、禁食、獨身，只要不當成功勞、不強加給人，就是信徒的自由。</p><p><strong>難處：</strong>界線在實際生活裡不總是清楚：一個自願的操練，若在群體裡變成「屬靈的人都這樣做」的風氣，沒有明文禁止，卻有無形的壓力；這個讀法需要群體常常自我檢查。</p>"],["背景限定說（只針對以弗所特定的異端）","","<p>認為 4:3 只是在處理以弗所某種混合了猶太潔淨條例與輕看物質的早期異端，與今天基督徒的飲食、婚姻選擇無關，也不宜延伸到教會的規條上。</p><p><strong>難處：</strong>4:4 的理由是普遍的——「凡神所造的物都是好的」——它是從創造推出的原則，不只是對付一個地方的問題。若只停在背景，今天教會裡隱形的禁止清單（不可這樣穿、不可那樣吃才算屬靈）就逃過了這一節的光照。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採只反對強制說（紅線六）。</strong>4:3 的問題是「禁止」——把禁戒當成得救或屬靈的條件；不是自願的吃素、禁食或獨身。自願的選擇是獻給主的自由，強加才是捆綁：「吃的人不可輕看不吃的人；不吃的人不可論斷吃的人」（羅 14:3）。</p><p>同樣的分寸也用在其他宗教：4:3 處理的是教會裡面有人在福音上加禁令，本講義不拿這一節嘲笑佛教、道教或任何宗教的素食與齋戒，也不拿它作攻擊別人信仰的工具。原則從背景出來，落點是今天教會自己的規條。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你是吃素的、正在禁食的、或單身的弟兄姊妹，這一節沒有責備你；它責備的是那些想替你加條件的人。若你一直以為守得越多越屬靈，這一節是好消息：神接納你，不在你禁了甚麼，而在基督為你做了甚麼。健康的信仰不是一張越來越長的禁止清單，而是一顆越來越會感謝的心。</p>"]],"con":[],"say":"本講義的立場：4:3 的問題是「禁止」，把禁戒當成得救或屬靈的條件；自願的吃素、禁食、獨身是信徒的自由，不可輕看，也不可強加；本講義不嘲笑任何宗教的素食與齋戒。本講義的全卷立場見 ISS00_8。","care":"會眾席上可能有一位單身多年的姊妹，常被長輩追問「怎麼還不結婚」，聽到「禁止嫁娶」又以為講台在暗示她；也可能有一位剛信主的弟兄，母親是虔誠的佛教徒，他最怕聽到講台把家人的吃素當成笑話。講台上不要用任何宗教的齋戒當例子取笑，不要在台上追問誰為甚麼單身。會後可以單獨關心單身的同工與來自他宗教家庭的新朋友，問他們需要怎樣的陪伴，而不是給他們建議。"},{"id":"ISS04_3","t":"4:4--5「都因神的道和人的祈求成為聖潔了」——飯前禱告有甚麼作用？拜過偶像的食物可以吃嗎？","r":"4:4--5；林前 8:4--13；林前 10:25--31；創 1:31","ch":[4],"why":"這是華人信徒最日常的兩個問題：一個是每天的餐桌——飯前禱告是不是一種「消毒」？忘了禱告吃了會怎樣？一個是年節的餐桌——家裡拜過祖先、拜過神明的祭品端上來，吃還是不吃？處理不好，前者變成迷信，後者變成家裡的衝突。","pos":[["【一】經文問的是甚麼","","<p>「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的，都因神的道和人的祈求成為聖潔了。」（4:4--5）<strong>ἁγιάζεται</strong>（hagiazetai）是現在式被動：被分別為聖；媒介是 λόγου θεοῦ（logou theou）與 ἐντεύξεως（enteuxeōs）。問題是：「成為聖潔」是說食物本來不潔、要禱告去潔淨它嗎？「神的道」是指甚麼？這一節與哥林多前書處理祭偶像之物的原則，怎樣合起來用在今天的祭品上？</p>"],["潔淨說（禱告使不潔之物變潔淨）","","<p>認為食物可能被不潔的力量沾染，特別是祭過偶像的；飯前禱告是奉主名把它潔淨、使它無害。所以吃之前一定要禱告，祭品更要奉主名禱告過才能吃。</p><p><strong>難處：</strong>4:4 說受造之物本來就是「好的」，問題不在食物本身；保羅在林前 8:4 說「偶像在世上算不得甚麼」。把禱告當成消毒，會讓禱告變成護身的儀式，也會讓人更怕食物、更怕偶像，正好與這一節的感恩方向相反。</p>"],["感恩歸屬說（神的道宣告、人的感謝承認）","","<p>認為「神的道」是神在創造中宣告「甚好」的話（呼應創 1:31），或飯前禱告中所用的經文；「祈求」就是感謝的禱告。神先說它是好的，人回應以感謝，一頓飯就從「普通」被分別出來，成為敬拜的一部分。至於祭品，林前 10:25--31 說市場上買的可以吃、不必為良心的緣故問；有人特別說明是祭物，就為那人的良心不吃。</p><p><strong>難處：</strong>這個讀法需要成熟的分辨：同一盤祭品，自己吃不吃、在誰面前吃、對家人怎樣解釋，都要看愛心與別人的良心，沒有一條簡單的規則，初信的人會覺得難以掌握。</p>"],["一律避免說（凡祭過的一概不吃）","","<p>認為在拜祖先、拜神明盛行的華人處境裡，吃祭品容易被看成參與祭拜，也容易絆倒初信者與家人；所以凡確知是祭物的一概不吃，以表明信仰的立場。林前 10:21「不能喝主的杯，又喝鬼的杯」常被引用。</p><p><strong>難處：</strong>林前 10:21 說的是在偶像的席上一同祭拜，不是事後的食物本身；若把「一律不吃」立成每一位信徒的規條，就回到 4:3 那種把禁戒當屬靈的方向，也可能在年節的餐桌上與家人起不必要的衝突，關上福音的門。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採感恩歸屬說。</strong>飯前禱告不是消毒，也不是魔法；它是在神的話面前承認「這是你造的、你賜的」，把一張普通的餐桌，變成一個想起創造主的地方。忘了禱告，食物沒有變髒，只是錯過了一次感謝。</p><p>祭品的問題回到哥林多前書講義第 8、10 章的原則：參與祭拜不可以，食物本身算不得甚麼；是否吃，看愛心與別人的良心——為軟弱的弟兄、為正在觀察你的家人，可以自願不吃，但不把它立成別人的規條。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你曾經不小心吃了祭品，之後一直害怕自己被沾染，可以放心：凡神所造的物都是好的，你屬於基督，偶像算不得甚麼。若你在家人面前掙扎要不要吃，那不是信心不夠，是愛心在思考；可以帶著溫柔向家人說明，也可以為家人的感受調整自己。</p>"]],"con":[],"say":"本講義的立場：飯前禱告不是消毒，是在神的話面前感謝著領受，使餐桌成為敬拜；祭品本身算不得甚麼，不參與祭拜，吃與不吃看愛心與別人的良心，不立成規條。本講義的全卷立場見 ISS00_8；祭物原則見哥林多前書講義第 8、10 章。","care":"會眾席上可能有一位剛信主的弟兄，年節回家要面對整桌祭品和長輩期待的眼神，夾在信仰與孝道中間；也可能有人因為小時候吃過祭品，一直擔心自己身上有不潔的東西。講台上不要用恐嚇的語氣講祭品，也不要嘲笑長輩的祭拜。會後可以單獨陪這位弟兄預備年節，一起想怎樣以尊重的態度表明信仰，並提醒他：孝敬父母與敬拜獨一的神並不對立。"},{"id":"ISS04_4","t":"4:8「操練身體，益處還少」——基督徒怎樣看運動與健康？","r":"4:8；林前 9:25--27；林前 6:19--20","ch":[4],"why":"今天的城市裡，健身、跑步、養生、體態管理幾乎成了一種新的信仰；同時也有信徒拿 4:8 當作不運動的理由。教會裡還有長期病痛、身心障礙、正在復健的人，聽到「身體」兩個字的感受完全不同。這一題要問：保羅是在貶低身體，還是在排出先後？","pos":[["【一】經文問的是甚麼","","<p>「操練身體，益處還少；惟獨敬虔，凡事都有益處，因有今生和來生的應許。」（4:8）<strong>σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος</strong>（sōmatikē gymnasia pros oligon estin ōphelimos）：πρὸς ὀλίγον 可以讀作「益處少」，也可以讀作「益處短暫」（只在少許時候）。問題是：保羅說的「操練身體」是指體育運動，還是指 4:3 那種禁慾式的苦修？他是在否定身體，還是在比較？</p>"],["體育運動說（指一般的鍛鍊）","","<p>認為 γυμνασία 就是體育場上的鍛鍊，以弗所有大型的體育場與競技；保羅承認它有益，只是益處有限，而且只限今生。所以基督徒可以、也應該照顧身體，只是不可讓它取代敬虔。林前 9:25--27 保羅也用運動員比喻自己。</p><p><strong>難處：</strong>這個讀法容易被聽成「運動是次要的，可有可無」，而忽略林前 6:19--20 說身體是聖靈的殿，要在身子上榮耀神；對一個長期忽視健康的人，它可能變成藉口。</p>"],["禁慾苦修說（指 4:3 的身體克苦）","","<p>認為上下文是 4:3 的禁戒，所以「操練身體」是指假師傅那種克苦己身、禁戒飲食的修行；保羅說這種操練益處很少，真正有益的是敬虔。西 2:23 說那些規條「苦待己身」，「在克制肉體的情慾上是毫無功效」。</p><p><strong>難處：</strong>4:8 用的是體育場的字，與 4:7 的 γύμναζε 同根，比喻的是運動員；而且保羅說它「有益」，若指假教訓的苦修，很難說它還有一點益處。這個讀法與用字不太相合。</p>"],["比較排序說（承認身體，排出先後）","","<p>認為保羅借用體育場的語言，重點是比較：身體的操練是好的，但它的果效有限、短暫；敬虔的果效延伸到「今生和來生」。保羅沒有否定身體，4:4 才說神所造的都是好的；他只是排出先後，也間接回應了以弗所輕看身體的禁慾風氣。</p><p><strong>難處：</strong>這個讀法平衡，卻需要具體的落點，否則只剩一句「兩樣都重要」；現代人時間有限，它要求每個人誠實地檢查自己給身體與給敬虔的時間比例。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採比較排序說。</strong>4:8 說「少」，不是「沒有」，更不是「有害」：照顧身體、規律運動、好好睡覺，都是對神所造之身體的負責。同時，身體操練的果效最多陪我們走完今生，敬虔的果效延伸到來生。</p><p>所以兩種偏差都要擋：一種拿 4:8 當不運動的理由，一種把健身與養生當成新的信仰。「凡事都有益處」也不是成功神學——敬虔的益處是應許的益處：今生有神同在，來生有永生。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你的身體有長期的病痛、障礙，不能像別人一樣運動，你的敬虔一點都不打折扣：4:8 把最大的益處放在敬虔，而敬虔不需要強壯的身體。若你很會運動，那是好的，只要記得也給禱告與神的話同樣的紀律。身體會衰老，敬虔的應許不會。</p>"]],"con":[],"say":"本講義的立場：4:8 是比較，不是否定——操練身體有益，只是益處有限、短暫；敬虔凡事有益，有今生和來生的應許。不拿它當不運動的理由，也不把健身當成新的信仰；敬虔的益處不是發財（全卷立場見 ISS00_5）。","care":"會眾席上可能有一位長期臥病、坐輪椅或正在復健的弟兄姊妹，聽到講台用健身房、跑馬拉松當例子，心裡會覺得自己被排除在外；也可能有人正為飲食與體重掙扎。講台上不要拿體型開玩笑，也不要說「生病是因為不敬虔」。會後可以單獨關心身體有限制的肢體，讓他知道他的敬虔在神眼中一樣完整；若有人的飲食與身體困擾已影響生活，要陪他尋求專業協助。"},{"id":"ISS04_5","t":"4:10「他是萬人的救主，更是信徒的救主」——所有人最後都會得救嗎？","r":"4:10；2:4--6；6:9；太 5:45","ch":[4],"why":"這一節常被兩邊拿來用：一邊說「萬人的救主」證明所有人最後都會得救，信不信沒有差別；另一邊為了反對普救論，把「萬人」講成「萬種人」，好像神並不真心看顧每一個人。華人信徒最常帶著的問題是：我沒有信主就過世的父母、祖先，怎麼辦？這一題要讀準，也要溫柔。","pos":[["【一】經文問的是甚麼","","<p>「因我們的指望在乎永生的神；他是萬人的救主，更是信徒的救主。」（4:10）<strong>σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν</strong>（sōtēr pantōn anthrōpōn, malista pistōn）。μάλιστα 可以讀作「特別是」，也有學者讀作「就是」。問題是：神是萬人的救主，是甚麼意思？是萬人最後都得救，還是救恩向萬人敞開？「更是信徒的」又把甚麼分了出來？</p>"],["普救說（萬人最後都會得救）","","<p>認為「萬人的救主」字面就是神最終要拯救每一個人；配合 2:4「他願意萬人得救」，神的心意不會落空，所以所有人最後都會得救，「更是信徒的」只是說信徒先經歷到。</p><p><strong>難處：</strong>同一卷書說有人「離棄真道」（4:1），6:9 說貪財的人「沉在敗壞和滅亡中」；4:16 說持守真道「又能救自己，又能救聽你的人」——若萬人無論如何都得救，這些話就失去意義。保羅在 4:10 為此勞苦，也說明人仍需要回應。</p>"],["普遍看顧說（今生的保守與供應）","","<p>認為 σωτήρ 在希臘文也有「保守者」的意思：神在今生普遍地保守、供應萬人，叫「日頭照好人，也照歹人」（太 5:45）；對信徒，他更是永遠救恩的救主。所以前半句講普遍恩典，後半句講特殊恩典。</p><p><strong>難處：</strong>這個讀法守住了不普救，但若只講今生的供應，可能沖淡了「救主」在本卷的分量——1:15「基督耶穌降世，為要拯救罪人」、2:6「捨自己作萬人的贖價」都說的是救恩本身，不只是保守。</p>"],["救恩敞開說（唯一救主，藉信落實）","","<p>認為神是萬人「唯一的」救主：救恩只有一個源頭，向萬人敞開，基督捨自己作萬人的贖價（2:5--6）；這救恩藉著信落實在一個人身上，所以說「更是信徒的救主」。這個讀法常與普遍看顧說合在一起：神今生看顧萬人，救恩的門也向萬人開著。</p><p><strong>難處：</strong>它要說清楚「敞開」與「落實」的分別，否則會被聽成兩種救恩；也無法直接回答那些從未聽過福音的人最終如何——這是聖經沒有詳細交代的地方。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採救恩敞開說，兼含普遍看顧。不講成普救論。</strong>神是萬人唯一的救主，救恩的門向每一個人敞開，他也在今生看顧萬人；這救恩藉著信落實，所以「更是信徒的救主」。</p><p>這一節給傳福音的人兩樣東西：一是勇氣——沒有一個人在神的救恩範圍之外；二是迫切——門雖然開著，人仍要進來。保羅「勞苦努力，正是為此」。至於未曾聽聞福音的人，本講義不替神下判語，把他們交在公義又慈愛的神手中。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必為了確定別人的結局，才能信靠神；你只需要知道他是怎樣的救主——他願意萬人得救，也捨了自己作萬人的贖價。若你為某一位已過世的親人心痛，可以把這份心痛帶到神面前；他比你更愛那個人，他的審判絕不會比你的愛更不公道。</p>"]],"con":[],"say":"本講義的立場：神是萬人唯一的救主，救恩向每一個人敞開，他也在今生看顧萬人；救恩藉信落實，所以更是信徒的救主。不講成普救論，也不把「萬人」縮小；未曾聽聞的人交在神手中，本講義不替神下判語。","care":"會眾席上很可能有人的父母、祖父母、配偶到離世都沒有信主，每次聽到救恩的講道都心如刀割；也可能有人在喪禮上被人說「你家人下地獄了」。講台上絕不點名任何過世的人的結局，不說「沒信的都在地獄裡」這種話去刺痛人，也不為了安慰人而說「大家最後都會得救」。會後可以單獨陪伴哀傷的人，聽他說說那位親人，與他一同把那人交託給公義又慈愛的神，必要時轉介哀傷輔導。"},{"id":"ISS04_6","t":"4:14「眾長老按手」——按手禮傳遞甚麼？","r":"4:14；5:22；提後 1:6；徒 13:3","ch":[4],"why":"華人教會對按手有兩種極端：一種把它看成能力或恩膏的傳輸，到處找名人按手，甚至有人把「被誰按手」當成服事的資歷；另一種把它看成可有可無的形式。這一題關乎恩賜從哪裡來、教會怎樣差派人，也關乎被按立的人往後怎樣被扶持。","pos":[["【一】經文問的是甚麼","","<p>「你不要輕忽所得的恩賜，就是從前藉著預言、在眾長老按手的時候賜給你的。」（4:14）<strong>μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου</strong>（meta epitheseōs tōn cheirōn tou presbyteriou）：介系詞是 μετὰ（伴隨），不是 διὰ（藉著）；提後 1:6 卻說「藉我按手所給你的恩賜」，用的是 διὰ。問題是：按手是恩賜傳遞的管道，還是伴隨的確認？長老團的按手與保羅個人的按手是同一次嗎？</p>"],["傳遞說（按手傳遞恩賜或能力）","","<p>認為按手是恩賜與聖靈能力傳遞的實際管道，提後 1:6 的「藉我按手」最為明顯；使徒行傳也記載使徒按手，人就受了聖靈。所以按手本身帶著屬靈的效力。</p><p><strong>難處：</strong>4:14 明說恩賜是「賜給你的」，主詞是神，而且用的是「伴隨」的 μετὰ；若按手本身就是能力的來源，容易讓人把焦點從賜恩的神轉到按手的人身上，甚至發展成「被誰按手就得誰的恩膏」，與 3:6 自高自大的危險相連。</p>"],["確認差派說（教會公開的確認與交託）","","<p>認為恩賜是神賜的，預言把它指明出來，長老團的按手是教會在神面前公開承認、交託與代禱，如同安提阿教會「禁食禱告，按手在他們頭上，就打發他們去了」（徒 13:3）。按手不是魔法，是一份公開的託付。</p><p><strong>難處：</strong>若只講「確認」，可能把按手講得太輕，好像只是一個典禮；提後 1:6 的「藉著」也要有一個交代——神確實可以在這個時刻真實地作工。</p>"],["神在禮中作工說（神賜，人確認，二者同時）","","<p>認為兩節合看：恩賜的源頭是神（4:14「賜給你的」），保羅與長老團一同按手，是神選擇作工的場合；提後 1:6 的「藉著」說的是神使用這個禮，4:14 的「伴隨」說的是教會一同參與。按手既是確認，也是神真實施恩的時刻，卻不是人可以操控的管道。</p><p><strong>難處：</strong>這個讀法要小心不被聽成「凡按手都必有恩賜傳下」；它也需要配合 5:22「按手的禮，不可急促」——神作工的時刻，不等於教會可以隨意按手。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採神在禮中作工說，偏重確認差派。</strong>恩賜從神來；預言指明，長老們按手，是教會在神面前公開確認、交託與代禱。神可以在這個時刻真實作工，但按手的人不是恩賜的源頭，按手也不是權力或恩膏的轉移。</p><p>所以本講義不鼓勵追逐名人按手，也不把按手當成可有可無；按立要慢（5:22），被按手的人往後的成長，需要眾人持續的代禱與扶持。保羅提醒提摩太「不要輕忽」，就是要他在被小看時回想那一天：他是被神與教會一同差派的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你從來沒有被誰按手，你的恩賜一點也不少：恩賜是神賜的。若你曾經被按手，卻沒有感覺到甚麼特別，也不必懷疑：按手是一份託付，它的果效常在往後的忠心裡顯出來。要緊的是「不要輕忽」——把神給你的那一份拿出來用，讓眾人看出你的長進。</p>"]],"con":[],"say":"本講義的立場：恩賜從神來；預言指明，眾長老按手是教會公開的確認、交託與代禱，神可以在其中作工，但按手的人不是恩賜的源頭，按手也不是權力或恩膏的轉移；按立要慢。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有人曾在某些聚會被人強行按手、推倒，事後覺得被冒犯或害怕；也可能有一位服事多年卻從未被按立的同工，覺得自己「不被承認」。講台上不要嘲笑別的教會的按手方式，也不要暗示沒有被按手的服事不算數。會後可以單獨關心那些對按手有不好經驗的人，尊重他們的界線；也要記得為被按立的同工持續代禱，不讓按立成為一次性的典禮。"},{"id":"ISS05_1","t":"5:1--2「如同父親……如同姊妹」——教會可以像家嗎？會不會變成人情包袱？","r":"5:1--2；3:15；太 12:50","ch":[5],"why":"華人教會很喜歡說「我們是一家人」。有人因此第一次嘗到被接納的溫暖；也有人因此喘不過氣：不好意思拒絕服事、不敢指出問題、長輩說了算、有事就「家醜不可外揚」。5:1--2 正是把教會稱為家的經文。這一題關乎神的家怎樣有家的溫度，又不變成人情與輩分的包袱。","pos":[["【一】經文問的是甚麼","","<p>「不可嚴責老年人，只要勸他如同父親；勸少年人如同弟兄；」（5:1）兩節經文只有一個動詞 <strong>παρακάλει</strong>（parakalei），帶出四組人，每一組都用 <strong>ὡς</strong>（hōs）接一個家人的稱呼。前一章保羅才說教會是「神的家」（3:15）。問題是：「家」是一個比喻，還是教會的本質？如果教會真的是家，怎樣避免華人家庭裡常見的輩分壓力、人情綁架與「家醜不外揚」？</p>"],["家庭本質說（教會本質上就是一個家）","","<p>認為新約最常用的教會稱呼就是「弟兄姊妹」，耶穌親自定義了這個家：「凡遵行我天父旨意的人，就是我的弟兄姊妹和母親了」（太 12:50）。所以教會的關係不是會員關係，是家人關係；彼此的責任與親密，都應當像家一樣。</p><p><strong>難處：</strong>家的稱呼若沒有骨架，很容易被華人文化裡的輩分與人情接管：長輩的話不能質疑，問題關起門來處理。對來自暴力或冷漠家庭的人，「教會就是你的家」有時聽起來不是安慰，而是另一種壓力。</p>"],["機構秩序說（教會是有職分與規章的群體，家只是比喻）","","<p>認為本卷用了很大的篇幅講監督、執事、長老的資格（3:1--13），講名冊、供應、控告與按手（5:9--22），可見教會需要清楚的職分與程序；與其強調家的親密，不如用制度保護每一個人，避免人情干擾公義。</p><p><strong>難處：</strong>保羅的次序是先寫 5:1--2，再寫 5:17--22：先定稱呼，再定程序。只剩制度的教會，人就變成了人事，出錯的長輩是一個「案子」，獨居的老姊妹是一筆「支出」，這正是保羅不要提摩太走的路。</p>"],["溫度與骨架並存說（家人的口氣，加上公義的程序）","","<p>認為 5:1--2 定的是口氣，5:9、5:16、5:19--22 定的是骨架，兩者在同一章裡並存。家人的稱呼決定我們怎樣說話，程序決定我們怎樣公正地處理；所以同一章裡，保羅可以說「勸他如同父親」，也可以說犯罪的「當在眾人面前責備他」（5:20）。</p><p><strong>難處：</strong>實際的教會生活常常偏向一邊：重感情的教會不敢建立程序，重程序的教會失去溫度。兩者並存需要長時間培養群體文化，不是寫一份章程就能做到。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採溫度與骨架並存說。</strong>神的家裡處理事情，是「家事」，不是「人事」：你會先記得對方是父親、是姊妹，再說真話。可是家人的稱呼管的是口氣，不是遮蓋；同一章緊接著要求查究、責備、不偏心。</p><p>所以人情包袱不是神的家的本質，而是家生病了的樣子。健康的神的家，允許人說「不」、允許人提問題、允許人慢慢靠近；長輩被尊重，卻不是不能被勸的人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經在某一間教會被「一家人」三個字綁住，甚至受了傷，那是那個家生病了，不是神設計的家錯了。耶穌定義的家，是遵行天父旨意的人——你可以慢慢地、安全地，再一次被帶進這個家。</p>"]],"con":[],"say":"本講義的立場：教會是神的家（3:15），家人的稱呼決定我們說話的口氣，卻不遮蓋罪、不取消程序；家的溫度和家的骨架要同時有。這一章的處境與原則怎樣落到今天，全卷立場見 ISS00_1。","care":"會眾席上有人來自破碎或暴力的原生家庭，「家」對他不是溫暖的字；也有人在教會被「一家人」的人情綁住，不敢拒絕服事、不敢說出問題。講台上不要說「教會就是你的家，你要更投入」去逼人親密。給人選擇距離與節奏的自由；會後單獨關心，不追問他家裡的細節，必要時協助尋求專業協談。"},{"id":"ISS05_2","t":"5:3--16「真為寡婦的」——今天的教會怎樣照顧寡婦、單親與獨居長者？","r":"5:3--16；徒 6:1；雅 1:27","ch":[5],"why":"許多華人教會正在快速變老：獨居長者愈來愈多，喪偶的弟兄姊妹、單親家長常常在主日一散會就回到一個人的家。5:3--16 是新約談教會照顧責任最長的一段，裡面有名冊、有分工、也有界線。這一題關乎教會怎樣記得最孤單的人，又不讓家人推卸本分、不讓教會力竭。","pos":[["【一】經文問的是甚麼","","<p>「要尊敬那真為寡婦的。」（5:3）<strong>ὄντως</strong>（ontōs）「真正的」在本段出現三次（5:3、5、16），把整段釘住。保羅的次序很清楚：有兒女、孫子孫女的，家人先行孝（5:4）；符合條件的寡婦記在冊子上（5:9--10）；信主的婦女家中有寡婦，自己就當救濟，好使教會能救濟那真無倚靠的（5:16）。問題是：今天誰是「真為寡婦的」？教會的責任到哪裡為止？</p>"],["家庭優先說（家人先負責，教會補位）","","<p>認為 5:4、5:8、5:16 一再把第一線的責任交給家人：兒女、孫子孫女、家中有能力的信主婦女。教會的資源有限，應當留給身邊一個人都沒有的；家人先接住，是敬虔，也是分工。</p><p><strong>難處：</strong>有些人有家人等於沒有：兒女在國外、早已疏離、不信主而反對，甚至本身就是加害者。若教會一聽到「你有兒女」就退開，最孤單的人反而會從名單上被漏掉。</p>"],["教會直接承擔說（教會是第一線的照顧者）","","<p>認為初代教會從一開始就天天供給寡婦，甚至為此設立專人（徒 6:1）；雅各說「那清潔沒有玷污的虔誠，就是看顧在患難中的孤兒寡婦」（雅 1:27）。所以照顧寡婦、單親與長者，是教會本身的使命，不應先問有沒有家人。</p><p><strong>難處：</strong>5:16 明說「不可累著教會」；若教會把一切都扛下來，不但力竭，也可能讓本來有能力的家人卸下本分，反而失去在自己家中操練敬虔的機會。</p>"],["社會資源轉介說（交給政府與專業機構）","","<p>認為今天的處境與第一世紀不同：許多地方有退休金、長照制度、社福機構與單親補助，教會的角色是轉介、協助申請，讓專業的人做專業的事，而不必自己設立救濟名冊。</p><p><strong>難處：</strong>政府能給錢與服務，給不了「被記得」。5:5 那位寡婦晝夜禱告，5:10 她接待遠人、洗聖徒的腳——她不只是被照顧的案主，也是神家裡服事的同工。只轉介不陪伴，會讓人有了補助，卻失去了家。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義照經文的次序：先問誰在她身邊，再問教會補上甚麼，同時善用社會資源。</strong>判斷「真無倚靠」，看的是實際處境，不是形式上有沒有兒女；有兒女卻沒有人來看的長者，教會不可以裝作看不見。</p><p>名冊的精神今天可以落在一張關懷名單上：誰獨居、誰喪偶、誰單親、誰長期患病，上一次有人去看是哪一天。也要記得 5:5、5:10：這些弟兄姊妹不只是需要被照顧的人，他們的禱告與服事，是神家裡的寶貝。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你正是那位獨居、喪偶或單親的人，覺得教會忽略了你，那是教會要悔改的地方，不是神忘記了你。「那獨居無靠、真為寡婦的，是仰賴神」（5:5）——保羅寫這一句的時候，是要整個教會記得：神一直看著這樣的人。</p>"]],"con":[],"say":"本講義的立場：照 5:3--16 的次序，家人先盡本分，教會補上那真無倚靠的，也善用社會資源；判斷「真無倚靠」看實際處境，不看形式上有沒有兒女。這段原則今天怎樣落地，全卷立場見 ISS00_1。","care":"喪偶、單親、獨居的人，常常覺得自己是教會的負擔，或在家庭式的聚會裡格格不入。講台上不要把他們講成「需要被救濟的問題」，也不要隨口問單親的媽媽「孩子的爸爸呢」。探訪時先聽，尊重他的自尊與選擇；若有長期的憂鬱、無望感或失智的跡象，協助家人與他就醫、尋求專業協助。"},{"id":"ISS05_3","t":"5:8「人若不看顧親屬」——成年兒女對父母的責任是甚麼？孝道與界線怎樣並存？","r":"5:4；5:8；出 20:12；可 7:11--12","ch":[5],"why":"華人教會的會眾，一邊背著「百善孝為先」的文化，一邊有不少人在原生家庭裡受過打罵、羞辱、控制，甚至性與經濟上的虐待；另一邊，也有人用「界線」兩個字讓年老的父母無人照料。5:4、5:8 常被兩邊拿來用。這一題關乎怎樣分清「看顧」與「順從」，既不捆綁受傷的人，也不取消孝道。","pos":[["【一】經文問的是甚麼","","<p>5:4 的「行孝」原文是 <strong>εὐσεβεῖν</strong>（eusebein），就是「敬虔」的動詞；「報答親恩」是 <strong>ἀμοιβὰς ἀποδιδόναι</strong>（amoibas apodidonai），把受過的恩回報出去。5:8 的「看顧」是 <strong>προνοεῖ</strong>（pronoei），字面是「先想」，意思是預先想到、供應安排，上下文講的是寡婦的生活所需。問題是：成年兒女要「順從」父母嗎？受過虐待的人也要回家嗎？界線與孝道衝突嗎？</p>"],["傳統孝順說（孝就是順）","","<p>認為「當孝敬父母」（出 20:12）是帶著應許的誡命，華人說「孝順」，孝與順分不開；耶穌責備用宗教理由逃避奉養父母的人（可 7:11--12），保羅更說不看顧親屬「比不信的人還不好」。所以成年兒女應當尊重並順從父母的安排。</p><p><strong>難處：</strong>經文用的是 προνοέω（pronoeō）供應照顧，不是「聽從」；新約談兒女聽從，對象是還在家中受養育的兒女，同一段也吩咐作父親的「不要惹兒女的氣」（弗 6:4）。把孝讀成順，會把受虐的人推回傷害裡，也讓父母的錯誤得到屬靈的保護。</p>"],["界線優先說（成年以後，先保護自己）","","<p>認為成年兒女在神面前是獨立的人，「人要離開父母」（創 2:24）；面對控制或傷害的父母，設立界線是健康與成熟的表現，必要時可以減少甚至停止往來，先保護自己與自己的家庭。</p><p><strong>難處：</strong>這個說法保護了受傷的人，卻很容易滑向另一端：以「我有界線」為由，對年老、無靠的父母不聞不問。5:4 說行孝「在神面前是可悅納的」，耶穌也不接受各耳板式的推託。界線若成了取消孝道的理由，就違背了經文。</p>"],["看顧與順從分別說（界線決定怎樣看顧，不決定要不要看顧）","","<p>認為 5:4、5:8 要的是看顧：經濟、醫療、生活上的供應與安排，而不是順從父母的一切要求。看顧可以有很多樣子：負擔生活費、安排醫療與長照、兄弟姊妹分工、透過第三方聯絡、在有人陪同的安全場合探望。若有虐待，先顧安全，看顧的方式隨之調整。</p><p><strong>難處：</strong>實際的處境千差萬別：甚麼程度的傷害可以減少往來？經濟供應要到多少？這沒有公式，需要個別的陪伴、專業的協助與長時間的禱告，教會也要承認自己的判斷有限。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採看顧與順從分別說。</strong>5:4、5:8 的重點是看顧，不是順從；不可用這兩節捆綁成年兒女繼續承受原生家庭的虐待，也不可以「界線」為由取消孝道。<strong>界線決定怎樣看顧，不決定要不要看顧。</strong></p><p>有人身、性或經濟上的虐待時，教會的第一件事是保護人的安全，必要時協助尋求專業協助與法律保護；這和 5:8 不衝突，反而是在保護一個同樣屬於神家的人。同時也記得 5:1--2：對長輩的尊重是口氣，不是無條件的服從。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你因為保護自己而與父母保持距離，不表示你背了真道；若你一直在照顧父母、筋疲力盡，神也看見你那一份「報答親恩」。在神面前，你可以誠實地說出你的傷和你的難，求他指教你，此刻能盡的是哪一份看顧。</p>"]],"con":[],"say":"本講義的立場：5:4、5:8 要的是「看顧」（προνοέω，供應照顧），不是「順從」；不用這兩節捆綁成年兒女承受虐待，也不以界線為由取消孝道——界線決定怎樣看顧，不決定要不要看顧。處境與原則的判斷，全卷立場見 ISS00_1。","care":"會眾席上有人在原生家庭受過身體、性、言語或經濟上的虐待，一聽到「孝順」就發抖。不追問細節，不要求他原諒或和好，不說「父母都是為你好」「天下無不是的父母」；先確認他現在是否安全，協助尋求專業協談，必要時協助報案與法律保護。另一群是長期照顧失智或重病父母的照顧者，他們需要的不是更多的責任，而是喘息與陪伴。"},{"id":"ISS05_4","t":"5:11--14「我願意年輕的寡婦嫁人」——保羅怎樣看再婚？","r":"5:11--14；5:9；林前 7:39","ch":[5],"why":"喪偶的弟兄姊妹考慮再婚時，常常要面對兒女的反對、親友的眼光，甚至教會裡「守寡比較屬靈」的暗示；5:9「從來只作一個丈夫的妻子」也被拿來排除再婚的人。5:11--12 的語氣聽起來又很重。這一題關乎保羅對再婚的真實態度，以及怎樣不讓任何一種婚姻選擇被羞辱。","pos":[["【一】經文問的是甚麼","","<p>「至於年輕的寡婦，就可以辭她」（5:11）：<strong>παραιτοῦ</strong>（paraitou）推辭的是入冊的申請，不是人。理由是她們「違背基督的時候就想要嫁人」，被定罪是因「廢棄了當初所許的願」（5:12）。可是 5:14 保羅又說「我願意年輕的寡婦嫁人」，<strong>βούλομαι</strong>（boulomai）是正面的意願。問題是：被定罪的是再婚，還是別的事？5:9 的條件是否排除再婚的人？</p>"],["入冊誓約說（被定罪的是背棄入冊時的誓約）","","<p>認為記在冊子上的寡婦，入冊時承諾以餘生專心禱告、服事基督；年輕的寡婦在哀傷中許下這個願，日後想再嫁，就等於廢棄了 τὴν πρώτην πίστιν（tēn prōtēn pistin）「當初的信諾」。所以保羅寧可一開始就不讓她們入冊，而是鼓勵她們嫁人、建立家庭。</p><p><strong>難處：</strong>經文沒有詳細描寫入冊的誓約內容，這個說法是從上下文推論出來的；早期教會關於寡婦團體的記載，也多半比保羅的時代晚，不能直接套回以弗所。</p>"],["離開信仰說（再嫁給不信的人，以致離開起初的信仰）","","<p>認為 τὴν πρώτην πίστιν（tēn prōtēn pistin）就是「起初的信仰」：問題不在再婚，而在再婚的對象與方向——被情慾牽引而嫁給不信的人，以致離開基督；5:15「已經有轉去隨從撒但的」支持這種嚴重性。這與保羅說寡婦可以隨意再嫁、只是要嫁在主裡的人（林前 7:39）相合。</p><p><strong>難處：</strong>5:14 保羅說「我願意年輕的寡婦嫁人」時，沒有再加上對象的條件；若 5:12 的重點是嫁給不信的人，這個轉折就顯得突然。而且這個讀法不容易解釋 5:11 為甚麼要「辭」她們入冊。</p>"],["再婚次等說（守寡較屬靈，再婚是軟弱的讓步）","","<p>部分教會傳統認為，喪偶後不再婚是更高的委身；保羅允許年輕的寡婦再嫁，是對軟弱的人的讓步，而 5:9「從來只作一個丈夫的妻子」顯示再婚的人在教會的服事上次一等。</p><p><strong>難處：</strong>5:14 的 βούλομαι 是正面的「願意」，不是勉強的允許；本卷 4:3 正是把「禁止嫁娶」列為假教訓。5:9 的條件也應與 3:2 一起讀，重點是專一忠誠的品格，而不是婚姻史的履歷。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義以入冊誓約說為主，並採離開信仰說的提醒。</strong>被定罪的不是婚姻本身，而是一個在哀傷中太早許下、許了又守不住的誓約；保羅的牧養智慧是：不要讓人在最痛的時候背上她背不起的擔子。</p><p>本講義不接受再婚次等說：喪偶再婚不是次等的選擇，守寡或單身也不是。5:9「從來只作一個丈夫的妻子」與 3:2 同一個讀法，指專一忠誠，不用它羞辱再婚的人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你喪偶後再婚，或正在考慮，不必因為這段經文覺得自己背叛了基督；如果你決定不再婚，也不必因為 5:14 覺得自己不正常。兩種生命，都可以在神的家裡尊貴地活著，也都可以服事。</p>"]],"con":[],"say":"本講義的立場：保羅正面地「願意」年輕的寡婦嫁人（5:14），被定罪的是許了又守不住的入冊誓約，不是婚姻本身；喪偶再婚不是次等的選擇，守寡或單身也不是。5:9 的讀法與 3:2 一致，全卷立場見 ISS00_3。","care":"喪偶的人常帶著兩種重擔：考慮再婚時，覺得對不起過世的配偶，又要面對兒女與教會的眼光；選擇不再婚的，又常被人催。講台上不評論任何個人的婚姻選擇。哀傷中的人不要催他做決定——不催他許願，也不催他再婚；若哀傷長期影響生活，協助他尋求哀傷輔導與專業協助。"},{"id":"ISS05_5","t":"5:17--18「加倍的敬奉」——傳道人該不該拿薪水？該拿多少？","r":"5:17--18；申 25:4；路 10:7；6:5","ch":[5],"why":"華人教會常有一種很深的想法：傳道人愈窮愈屬靈，談錢就不屬靈；許多傳道人的家庭因此長期拮据，不敢開口。另一邊，也有講員過著奢華的生活，用經文向會眾要錢。也有人主張帶職事奉才是正路。這一題關乎教會怎樣合理供應勞苦的同工，又不讓供應變成貪財的門路。","pos":[["【一】經文問的是甚麼","","<p>「那善於管理教會的長老，當以為配受加倍的敬奉」（5:17）。<strong>διπλῆς τιμῆς</strong>（diplēs timēs），τιμή 在希臘文裡兼有「尊敬」與「價錢、酬金」的意思。保羅隨即引兩句經文：「牛在場上踹穀的時候，不可籠住牠的嘴」（申 25:4），與「工人得工價是應當的」（路 10:7）。問題是：「敬奉」包括錢嗎？「加倍」是多少？帶職事奉的人呢？</p>"],["尊敬說（τιμή 主要是尊重，不一定是錢）","","<p>認為「加倍的敬奉」主要指加倍的尊重：善於管理、勞苦教導的長老，應當受到會眾特別的敬重與聽從；經濟供應可以有，但不是這一節的重點，免得把服事變成職業。</p><p><strong>難處：</strong>5:18 的兩句引文都明明講到經濟：牛要邊走邊吃，工人要得工價。同一章 5:3「尊敬」寡婦，用的就是同一個字根的動詞 τίμα，上下文正是生活的救濟。把錢拿掉，是削弱了經文。</p>"],["酬金說（加倍＝合理甚至優厚的薪資）","","<p>認為 τιμή 在這裡就是報酬，「加倍」表示勞苦教導的長老應當得到比一般更優厚的供應，使他們可以全心投入話語與教導，不必為生計分心；教會吝嗇，是違背了經文。</p><p><strong>難處：</strong>「加倍」若讀成精確的數字（兩倍薪水），就超出了經文；這個讀法也容易被濫用成傳道人向會眾索取的權利，而同一封信正警告有人「以敬虔為得利的門路」（6:5）。</p>"],["帶職說（保羅自己織帳棚，傳道人最好不拿錢）","","<p>認為保羅在哥林多與帖撒羅尼迦都親手做工，不願累著任何人（徒 18:3；帖後 3:8）；為了福音不被誤會，傳道人最好帶職事奉，不從教會支薪。</p><p><strong>難處：</strong>保羅放棄的是「權利」，他明說主命定傳福音的可以靠福音養生（林前 9:14），在本章更明說工人得工價是應當的。帶職事奉可以是美好的選擇，卻不能變成所有傳道人的標準。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的落點是兩邊同時講。</strong>τιμή 兼有尊敬與酬金：教會有責任合理地供應勞苦的同工——參照當地的生活水準、家庭的需要、醫療、保險與退休；讓一位全時間教導的人為生活焦慮，是教會沒有盡本分。</p><p>傳道人有責任不貪，不把 5:17 當作向會眾要錢的條文；尊榮跟著勞苦與品格走，不跟著頭銜走。<strong>財務透明</strong>是兩邊共同的保護。帶職事奉是自由，不是標準。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。看見有人用福音斂財，你可以憤怒，但不必因此懷疑福音；看見傳道人清苦，你可以心疼，也可以行動。主連踹穀的牛都顧念，他也顧念每一位為他勞苦的人，和每一份出於甘心的奉獻。</p>"]],"con":[],"say":"本講義的立場：5:17--18 的「加倍的敬奉」兼有尊敬與酬金，教會有責任合理、透明地供應勞苦的同工；傳道人有責任不「以敬虔為得利的門路」（6:5）——兩邊同時講。全卷立場見 ISS00_5。","care":"會眾席上可能有一位傳道人和他的家人，長期經濟拮据卻不敢說；也可能有人曾被要錢的講道傷害，對奉獻充滿戒心。講台上不談任何一位同工的具體薪水，供應的事由執事會私下、透明地處理；不用罪惡感催奉獻，也不讓傳道人的孩子因為家裡清苦而覺得被教會虧待。"},{"id":"ISS05_6","t":"5:19「控告長老……非有兩三個見證就不要收」——教會怎樣處理對牧者的指控？","r":"5:19；5:20--21；申 19:15；太 18:15--17","ch":[5],"why":"近年許多教會與機構爆出牧者性侵、性騷擾、屬靈操控的事件；不少受害者說出來時，聽到的第一句話是：「你有兩三個見證嗎？」另一面，帶領的人也確實可能被誣告。5:19 在教會史上保護過無辜的牧者，也被濫用來讓受害者閉嘴。這一題關乎神的家怎樣同時保護無辜者與受害者。","pos":[["【一】經文問的是甚麼","","<p>「控告長老的呈子，非有兩三個見證就不要收。」（5:19）<strong>ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων</strong>（ektos ei mē epi dyo ē triōn martyrōn）出自申命記：「總要憑兩三個人的口作見證才可定案」（申 19:15）；同一段又說「審判官要細細地查究」（申 19:18）。緊接著是 5:20 犯罪的要責備、5:21 不可有偏心。問題是：兩三個見證，是「開口」的門檻，還是「定案」的門檻？查證的責任在誰身上？</p>"],["受理門檻說（沒有兩三個見證，連受理都不受理）","","<p>認為 <strong>μὴ παραδέχου</strong>（mē paradechou）就是「不要接受」：一個人的指控，連聽都不必聽，以保護長老免於流言與誣告。帶領教會的人必然得罪人，若任何一句話都能讓他下台，教會就會被最不滿的人挾持。</p><p><strong>難處：</strong>性侵、性騷擾、屬靈操控本來就常常發生在沒有旁人的地方；這樣讀，等於讓所有沒有目擊者的受害者閉嘴。申命記把查證的責任交給審判官，不是交給提出控訴的人；而且這個讀法完全跳過了 5:20--21。</p>"],["定案門檻說（可以受理、必須查證，定罪需要多重見證）","","<p>認為 5:19 是「定案」的門檻：教會收到指控，要受理、要認真調查，但不憑單一、未經查證的說法就定一位長老的罪。今天的「見證」可以包括幾位彼此不認識的人分別提出相似的經歷、訊息與文件紀錄、旁人觀察到的改變、專業的評估。</p><p><strong>難處：</strong>怎樣認定「見證」，需要專業與謹慎；多數教會沒有調查的能力，也很難不受人情影響，所以常常需要外部、獨立的專業協助，這對小教會是真實的挑戰。</p>"],["全交司法說（教會不處理，一切交給法律）","","<p>認為教會沒有調查的能力，也容易偏袒，所以凡是對牧者的指控，都應當直接交給警方與法院，教會不另行處理，以免越權或掩蓋。</p><p><strong>難處：</strong>涉及刑事的確要交給司法，可是許多屬靈操控、權力濫用、不當關係並不構成刑事，法律管不到；教會仍有牧養與紀律的責任，5:20--21 正是要神的家自己公正地處理，而不是把責任推出去。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採定案門檻說，並明定刑事通報。</strong>5:19 保護無辜者免於誣告，<strong>不是要求受害者自己先找到兩三個證人才可以說話</strong>；它一定要連著 5:20「當在眾人面前責備他」與 5:21「不可有偏心」讀。</p><p>收到指控時，教會要有獨立、可信的調查：不由被指控者的親信主導，保護提出的人不受報復，必要時讓被指控者在調查期間暫停職務。<strong>涉及性侵、兒童保護等刑事的，要依法通報主管機關，不以「教會內部處理」為由延誤。</strong>太 18:15--17 處理的是弟兄之間的得罪，不是刑事案件的替代程序。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。看見牧者跌倒、教會掩蓋，信心會受重創；可是 5:21 告訴你，保羅是在神、基督耶穌和蒙揀選的天使面前囑咐的——神比你更在乎公義，也比你更在乎那個受傷的人。人的領袖會失敗，那位不偏心的主不會。</p>"]],"con":[],"say":"本講義的立場：5:19 的「兩三個見證」是定案的門檻，不是開口的門檻，目的是保護無辜者免於誣告，不是叫受害者閉嘴；必須連著 5:20--21 讀。收到指控要有獨立、可信的調查，涉及性侵、兒童保護等刑事要依法通報，不以「教會內部處理」為由延誤。全卷立場見 ISS00_4。","care":"會眾席上可能就坐著一位受害者，或一位曾經說出來卻沒有被相信的人。不追問細節，不叫她在多人面前重述經過，不說「你確定嗎」「要顧全大局」「你要饒恕他」；先確認她現在是否安全，相信說出來需要很大的勇氣，協助她尋求專業協助與報案，涉及兒童的立即依法通報。不可用「順服權柄」叫任何人留在屬靈虐待的傷害裡。"},{"id":"ISS05_7","t":"5:20「當在眾人面前責備他」——公開處理與私下處理的界線在哪裡？","r":"5:20--21；太 18:15--17；加 6:1","ch":[5],"why":"有些教會習慣在講台上公開點名、要人當眾認罪，留下許多被羞辱的人；另一些教會凡事私下處理，犯罪的同工悄悄離職、換到別的教會又重犯。5:20 說要在眾人面前責備，太 18 與加 6:1 又講私下與溫柔。這一題關乎怎樣分辨何時公開、公開到甚麼程度。","pos":[["【一】經文問的是甚麼","","<p>「犯罪的人，當在眾人面前責備他，叫其餘的人也可以懼怕。」（5:20）<strong>τοὺς ἁμαρτάνοντας</strong>（tous hamartanontas）是現在分詞，指經查證確實犯罪、而且仍在犯的人；<strong>ἐνώπιον πάντων</strong>（enōpion pantōn）在眾人面前。5:21 接著說「不可存成見，行事也不可有偏心」。問題是：「眾人」是全會眾還是長老團？甚麼樣的罪要公開？公開到甚麼程度？</p>"],["全會眾公開說","","<p>認為「眾人」就是全會眾：犯罪的長老是公眾人物，他的罪影響全群，就應當在全會眾面前處理，使會眾知道真相，也使其他人有所警惕；這是對領袖更高的要求。</p><p><strong>難處：</strong>若沒有分寸，很容易變成公審：細數細節、要人當眾痛哭，甚至讓受害者的身分曝光，造成第二次傷害；犯罪者的家人也在會眾中承受羞辱。公開的應當是事實與處理，而不是傷口。</p>"],["長老團內部說（「眾人」指其他長老）","","<p>認為上下文講的是長老，「其餘的人」最自然是指其他長老：在長老團中公開責備，叫其餘的長老懼怕，不必讓全會眾知道，以保護教會的見證與當事人的家庭。</p><p><strong>難處：</strong>若只在長老團內部處理，會眾不知情，被處理者可能換一個地方再犯；封閉的處理也最容易被人情影響，這正是 5:21「不可有偏心」要擋住的事。</p>"],["漸進說（照馬太福音十八章由私而公）","","<p>認為主耶穌給了清楚的步驟：先私下指出，再帶一兩個人同去，最後才告訴教會（太 18:15--17）；保羅也說「用溫柔的心把他挽回過來」（加 6:1）。所以任何處理都應從私下開始，不聽勸才逐步公開。</p><p><strong>難處：</strong>太 18 處理的是弟兄之間的得罪；當一方是有權力的長老，另一方是受害者，要受害者先「私下去找他」常常是二次傷害。刑事案件也不能等走完這些步驟才通報。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義主張看罪的性質與影響。</strong>個人之間輕微的得罪，照太 18 與加 6:1 私下、溫柔地挽回；長老濫用權力、經查證確實犯罪而且仍在犯、影響群體的，不因身分而私下了結，要在適當的群體面前公開事實與處理結果。</p><p>公開時保護受害者的身分與隱私，不公開細節；照顧被處理者的家人；涉及刑事的依法通報。目的是三件事：保護受害者與群體、叫犯罪的人有悔改的路、叫其餘的人敬畏神——不是羞辱。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾在教會被公開羞辱過，那不是 5:20 的本意；如果你看見教會把罪悄悄壓下去，那也不是。神的家要在真理與慈愛之間學習，人會失手，可是那位「不可有偏心」的主，仍然在他的家中作王。</p>"]],"con":[],"say":"本講義的立場：私下或公開，看罪的性質與影響；確實犯罪、仍在犯的長老不因身分而私下了結，要在適當的群體面前公開事實與處理，但不公開受害者的身分與細節。目的是保護、挽回與敬畏，不是羞辱。全卷立場見 ISS00_4。","care":"會眾席上可能有曾被公開羞辱、至今不敢再進教會的人；有擔心自己被曝光的受害者；也有犯罪者的配偶與孩子，在眾人眼光下獨自承受。處理時先保護受害者的隱私，不讓會眾的議論成為第二次傷害；派專人陪伴被處理者的家人；犯罪的人若真實悔改，也要有人陪他走回頭的長路。"},{"id":"ISS05_8","t":"5:22「給人行按手的禮，不可急促」——按立牧者的程序應該是怎樣？","r":"5:22；5:24--25；3:6；3:10；4:14","ch":[5],"why":"許多華人教會缺人，口才好、恩賜明顯、聚會熱心的人常常很快被推上台；也有人在別處被指控過，轉到新教會不久就帶小組、帶兒童。等到問題爆發，傷害已經擴大。這一題關乎「不可急促」在今天的按立與託付上，應當落成怎樣的程序。","pos":[["【一】經文問的是甚麼","","<p>「給人行按手的禮，不可急促；不要在別人的罪上有分，要保守自己清潔。」（5:22）<strong>χεῖρας ταχέως μηδενὶ ἐπιτίθει</strong>（cheiras tacheōs mēdeni epitithei）把「急速」放在動詞前加重。前面已經說過「初入教的不可作監督」（3:6）、「這等人也要先受試驗」（3:10），提摩太自己也是「在眾長老按手的時候」領受恩賜（4:14）。問題是：這裡的按手指甚麼？不急促要慢到甚麼程度？</p>"],["按立說（按手指設立長老）","","<p>認為上下文從 5:17 起都在講長老，4:14 的按手也是設立與差派；所以 5:22 是說不要太快按立人作長老。5:24--25 說有些人的罪與善行要隨後才顯明，正是按立前要「先受試驗」的理由。</p><p><strong>難處：</strong>經文沒有給出具體的時程與程序，多久才算「不急促」、由誰察驗，各教會只能從原則推論；若變成僵化的年資制度，也可能埋沒真正被神預備的年輕人（4:12）。</p>"],["恢復說（為悔改的犯罪者按手，接納他回來）","","<p>認為 5:22 緊接在 5:20 處理犯罪的長老之後，按手是指接納悔改的人回到團契與職分；保羅提醒不要太快恢復，否則就在他的罪上有分。</p><p><strong>難處：</strong>為悔改者按手的做法，明確的記載多出現在較晚的教會，不一定是保羅時代的用法；而 3:6、3:10、4:14 的上下文，更直接指向設立。</p>"],["兼含說（設立與恢復都不可急促）","","<p>認為不論是哪一種按手，原則都一樣：負責的人用自己的名字為一個人作保，太快按立與太快恢復，都會讓負責的人「在別人的罪上有分」；所以兩者都要慢、要察驗。</p><p><strong>難處：</strong>這個說法在應用上很有用，但在解經上避開了選擇；讀者仍需要知道經文最直接的意思是哪一個，才不會把兩件不同的事混成一套程序。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義以按立說為主，並採恢復說的提醒。</strong>恩賜幾個月就看得見，品格要好幾年才看得清；慢，是為了保護會眾，也是為了保護那個人，不讓他太早背上背不起的擔子。</p><p>具體的程序可以包括：給足觀察的時間；由不只一個人共同察驗；查問過去事奉的紀錄與推薦人；凡涉及兒童與青少年的事工，做背景查核。犯錯的同工若要恢復事奉，也同樣不可急促。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你正在等候被按立、覺得被拖延，這段經文不是不信任你，是在保護你；若你因為某位太快被按立的人受了傷，那是人的失職，不是神的心意。5:25 說善行「那不明顯的也不能隱藏」，神看得見每一個人。</p>"]],"con":[],"say":"本講義的立場：5:22 的按手以按立為主，也提醒恢復犯錯的同工同樣不可急促；按立要給足觀察的時間、由多人共同察驗、查問過去事奉的紀錄，涉及兒童事工須做背景查核。全卷立場見 ISS00_3。","care":"等候按立很久的人，可能覺得自己不被信任；被暫停或沒有被按立的人，可能覺得被羞辱。講台上不評論任何一位同工的資格。不按立或延後按立時，私下、溫柔、具體地說明原因與成長的路徑；也要告訴他：慢，不是拒絕，是神的家在保護他，也在保護他將來要牧養的人。"},{"id":"ISS05_9","t":"5:23「可以稍微用點酒」——基督徒可以喝酒嗎？","r":"5:23；3:3；3:8；弗 5:18；羅 14:21","ch":[5],"why":"華人教會對酒的態度差很遠：有的教會要求滴酒不沾，有的聚餐照樣舉杯；職場與宴席上又有很重的勸酒文化。有人拿 5:23 替應酬開脫，也有人覺得喝一口就是不屬靈；會眾裡還有正在戒酒的人，和被酗酒的家人傷過的人。這一題關乎怎樣讀 5:23 的處境，並在節制與愛心中作判斷。","pos":[["【一】經文問的是甚麼","","<p>「因你胃口不清，屢次患病，再不要照常喝水，可以稍微用點酒。」（5:23）<strong>μηκέτι ὑδροπότει</strong>（mēketi hydropotei）是「不要再只喝水」，表示提摩太本來刻意不喝酒；<strong>οἴνῳ ὀλίγῳ χρῶ</strong>（oinō oligō chrō）是「用一點點酒」，當藥來用。3:3 對監督的要求是「不因酒滋事」（3:3），3:8 說執事「不好喝酒」。問題是：基督徒可以喝酒嗎？這一節是鼓勵、允許，還是只是醫囑？</p>"],["禁酒說（基督徒應當完全不喝）","","<p>認為酒精帶來的成癮、家暴、酒駕等傷害太大，為了見證與弟兄的緣故，基督徒應當完全不喝；保羅自己說「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好」（羅 14:21）。</p><p><strong>難處：</strong>5:23 保羅明明吩咐提摩太用一點酒；若把禁酒定為信仰的條件，就接近本卷 4:3 所擋的「禁戒」，也會把滴酒不沾變成衡量誰比較屬靈的尺。羅 14:21 是出於愛的自願，不是普遍的禁令。</p>"],["自由說（只要不醉，就可以喝）","","<p>認為聖經禁止的是醉酒：「不要醉酒，酒能使人放蕩」（弗 5:18），不是喝酒本身；主耶穌在迦拿的婚筵上也變水為酒。所以基督徒在節制中飲酒是自由。</p><p><strong>難處：</strong>自由可能成為別人的絆腳石；在勸酒成風的應酬文化裡，「只喝一點」常常守不住；對有成癮傾向或家族酗酒史的人，「不醉就好」的界線特別危險。而且 5:23 是一位病人的處境，不能拿來當一般飲食的鼓勵。</p>"],["節制與愛心說（不定罪，不鼓勵，為人的緣故可以不喝）","","<p>認為 5:23 告訴我們飲酒本身不是罪，3:3、3:8 告訴我們重點是節制，羅 14:21 告訴我們要為弟兄的緣故調整自由。所以教會不把飲酒定為罪，也不鼓勵飲酒；每一個人在自己的處境中，以節制與愛心作判斷。</p><p><strong>難處：</strong>這個說法需要每個人在處境裡判斷，教會群體裡可能出現不同的做法；若沒有清楚的牧養，也可能變成各說各話，讓正在掙扎的人得不到保護。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採節制與愛心說。</strong>5:23 的處境是「胃口不清，屢次患病」，分量是「稍微」，用法是當藥用——<strong>不是鼓勵飲酒</strong>；同時保羅這樣吩咐，表示<strong>飲酒本身不被定為罪</strong>，滴酒不沾也不是屬靈的資格。</p><p>對正在戒酒的弟兄姊妹，完全不碰酒是智慧，也是忠心，這一節不是要他們「稍微用點」。教會聚會與聚餐不勸酒，提供不含酒精的選擇；今天身體的問題照醫囑處理，不拿這一節當處方。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你喝或不喝，都不必用這件事量自己或別人的信心。這一節最動人的，其實不是酒，而是一位屬靈的父親，在一封談教會秩序的信裡停下來，關心一位年輕同工的胃——神也這樣細心地顧念你的身體。</p>"]],"con":[],"say":"本講義的立場：5:23 的處境是一位屢次患病的人，用一點酒當藥，不是鼓勵飲酒；聖經也不把飲酒本身定為罪，或把滴酒不沾當成屬靈資格，重點是節制與愛心。正在戒酒的人完全不碰酒，是智慧也是忠心。","care":"會眾席上可能有正在戒酒的人、成癮者的配偶與孩子，也可能有在酗酒的父親或丈夫手下受過家暴的人。講台上不拿喝酒開玩笑，不說「保羅都叫人喝」。聚餐時不勸酒，尊重不喝的人不必解釋；遇到酗酒伴隨暴力的家庭，先確認安全，協助尋求戒癮門診、互助團體與專業協助，必要時協助報案。"},{"id":"ISS06_1","t":"6:1--2 僕人要恭敬主人——聖經支持奴隸制嗎？今天的職場怎麼讀？","r":"6:1--2；1:10；林前 7:21；門 16；西 4:1","ch":[6],"why":"歷史上確實有人拿這幾節經文替奴隸制辯護，今天也有人因此說聖經不道德；另一方面，教會裡常有人把這兩節直接搬進辦公室，只叫員工順服老闆，卻從不對老闆說話。這一題關乎聖經的可信，也關乎一位正在職場受委屈的會友，會不會被經文再壓一次。","pos":[["【一】經文問的是甚麼","","<p>「凡在軛下作僕人的，當以自己主人配受十分的恭敬，免得神的名和道理被人褻瀆。」（6:1）ὑπὸ ζυγὸν δοῦλοι 是「在軛下的奴僕」：保羅用「軛」這個字，承認這是一副重擔，不是一份祝福。問題有兩層：保羅吩咐奴僕恭敬主人，是不是等於認可奴隸制度？今天沒有人戴軛，這段經文落在僱傭關係裡，又該怎樣讀？</p>"],["制度認可說（經文接受奴隸制為合理秩序）","","<p>認為保羅既然沒有要求廢除奴隸制，反而吩咐奴僕恭敬主人、加意服事，就表示他把這制度看作可以接受的社會秩序；歷史上一些替奴隸制辯護的講道，正是這樣讀的。</p><p><strong>難處：</strong>同一封信把「搶人口」列在敵正道的罪人之中（1:10），販賣人口正是奴隸貿易的源頭；保羅說奴僕能得自由就去求（這使我們想起林前 7:21），又要腓利門收阿尼西謀「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 16）。經文的理由是福音的名聲，不是這制度合神心意。</p>"],["純文化說（只是第一世紀的事，與今天無關）","","<p>認為這兩節完全屬於羅馬帝國的奴隸社會，今天既然沒有奴隸，這段經文就沒有甚麼可以應用的；讀它只是為了了解歷史。</p><p><strong>難處：</strong>這樣讀守住了反對奴隸制的立場，卻把經文的原則一起丟掉了。保羅關心的是：一個信徒在自己無法立刻改變的位置上，怎樣叫人因他尊重所信的神；弟兄關係不可成為怠慢的藉口（6:2）。這個原則今天每一個星期一都用得著。</p>"],["福音之酵說（牧養當下的軟弱者，福音從裡面瓦解制度）","","<p>認為保羅在對一群沒有能力改變帝國法律的人說話，這是牧養，不是立法；同時，他把主人與奴僕放在同一桌、同稱弟兄，又吩咐「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上」（西 4:1），福音的酵已經放進麵裡。</p><p><strong>難處：</strong>這個讀法要誠實承認，教會在歷史上花了很長的時間才把這酵活出來，有時甚至站在錯的一邊；它也不能變成「慢慢來就好」的藉口，今天遇到剝削與人口販賣，教會不可等。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採福音之酵說。</strong>6:1--2 不是聖經支持奴隸制，是保羅在一個無法立刻改變的處境裡牧養軟弱的人，而他從福音推出的原則，最終要瓦解這個制度。今天的應用不可單向化：員工要盡忠，不因同是基督徒就輕看上司；老闆和主管要公平，不剝削、不威嚇；這段經文從不要求任何人忍受違法的勞動、欠薪或虐待。書信的處境與原則，全卷立場見 ISS00_1。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經記錄了一個破碎的世界，也把改變它的種子放進了那個世界。真正改變奴隸與主人關係的，不是一場革命，是一位「捨自己作萬人的贖價」（2:6）的主；在他面前，奴僕和主人都是蒙贖的人。</p>"]],"con":[],"say":"本講義的立場：6:1--2 不是聖經支持奴隸制，是在無法改變的處境裡牧養軟弱的人，同一封信把搶人口定為罪；今天職場的應用不可單向化，員工與老闆都要聽。書信的處境與原則，全卷立場見 ISS00_1。","care":"會眾席上可能有正在被欠薪、超時、羞辱的員工，也可能有外籍移工、家庭幫傭，或祖先曾被販賣、被壓迫的弟兄姊妹。講台上不要說「聖經叫你順服，就忍一忍」；要清楚說出：遇到違法與虐待，可以求助，也應當求助。會後單獨關心，必要時協助他尋求法律或勞工單位的協助；同時也要溫柔地對身為老闆的會友說話，不羞辱，只邀請。"},{"id":"ISS06_2","t":"6:3--5「專好問難，爭辯言詞」——網路論戰與真理之爭，該怎樣分辨？","r":"6:3--5；2:8；6:11；6:20","ch":[6],"why":"網路讓每一個人都可以參與神學辯論：留言串、群組、影片底下的回應，常常越辯越長、越辯越兇。有人因此說「不要爭論，愛就好」，有人說「為真理必須寸步不讓」。這一題要幫助會眾分辨：哪一種爭論是守護真道，哪一種是 6:4 說的病。","pos":[["【一】經文問的是甚麼","","<p>「他是自高自大，一無所知，專好問難，爭辯言詞，從此就生出嫉妒、紛爭、毀謗、妄疑」（6:4）。νοσῶν 是「害病」，與 6:3「純正的話」（健康的話語）正面相對；λογομαχίας 是「字句之戰」。問題是：基督徒可以辯論嗎？在網路上為真理說話，算不算「專好問難，爭辯言詞」？</p>"],["避戰說（一切爭論都不屬靈，基督徒不要辯論）","","<p>認為 6:4 與 2:8「無忿怒，無爭論」清楚禁止爭辯；網路上的神學討論只會傷害見證，基督徒應該一概保持沉默，只要彼此相愛。</p><p><strong>難處：</strong>同一章叫提摩太「為真道打那美好的仗」（6:12），全卷也一再要他囑咐人不可傳異教（1:3）。完全不說，等於把會眾交給最大聲的人；保羅自己在信裡常常發問、常常論證。</p>"],["真理之戰說（真理面前不可讓步，辯論越清楚越好）","","<p>認為異端正在網路上大量流傳，基督徒必須挺身而出、逐條反駁；為真理爭辯就是 6:12 的「打那美好的仗」，語氣強硬一點也是為了保護羊群。</p><p><strong>難處：</strong>這個說法常把每一個次要的看法都升格成真理的底線，而且忽略了 6:4 的症狀表：若一場辯論結束後，留下的是嫉妒、紛爭、毀謗、妄疑，那麼不論論點多正確，這已經是那種病了。6:11 要屬神的人追求的，包括「溫柔」。</p>"],["看果子說（分辨在動機與果子，不在有沒有爭論）","","<p>認為保羅診斷的是「專好」：把問難當嗜好、把爭辯當屬靈、從不讓真理改變自己；病根是 τετύφωται，被自己的煙燻住的驕傲。所以分辨的方法不是禁止討論，是看它生出了甚麼：大家是更像基督了，還是更會懷疑人了？</p><p><strong>難處：</strong>動機難以從外面看清，也容易被拿來指控對方「你就是驕傲」。這個標準首先要拿來照自己，不是照別人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採看果子說。</strong>基督徒可以、也應該為真道說話，但要用 6:4 的症狀表檢查自己：我是為了真理，還是為了贏？核心的福音不讓，次要的看法容讓；在網路上，能私下說的不公開說，能少說一句就少說一句，說的時候帶著溫柔。以弗所的假教訓是甚麼，全卷立場見 ISS00_8。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。看見基督徒在網路上吵成一團，不等於基督信仰站不住；那只說明 6:4 的病到今天還在。真理不需要靠我們吵贏來證明，它需要我們活得像那位在彼拉多面前安靜作見證的主。</p>"]],"con":[],"say":"本講義的立場：基督徒可以為真道說話，但分辨在果子——生出的是更像基督，還是嫉妒、紛爭、毀謗、妄疑；6:4 的症狀表先照自己，不拿來照別人。以弗所的假教訓，全卷立場見 ISS00_8。","care":"會眾席上可能有在網路論戰中被圍攻、被貼標籤的人，也可能有因為看見基督徒彼此攻擊而對信仰失望的年輕人。講台上不要點名任何網路講員或教會，也不要把真誠提問的人說成驕傲；會後可以單獨陪那位受傷的人聊聊，幫助他暫時離開那些讓他焦慮的群組與留言，回到面對面的小組與團契裡。"},{"id":"ISS06_3","t":"6:5「以敬虔為得利的門路」——成功神學錯在哪裡？","r":"6:5；6:6；6:9；5:17--18","ch":[6],"why":"華人教會在錢的事上常常跌倒兩次，第一次就是成功神學：把信主、奉獻、禱告說成發財的保證。有人因此奉獻到負債，有人生意失敗後被說成信心不夠，最後連信仰也離開了。這一題要把 6:5 讀準，也要保護那些被這條路傷過的人。","pos":[["【一】經文問的是甚麼","","<p>「他們以敬虔為得利的門路。」（6:5）原文 νομιζόντων πορισμὸν εἶναι τὴν εὐσέβειαν，敬虔帶冠詞，是主語；πορισμὸν 不帶冠詞，是述語：他們以為敬虔是生財之道。下一節保羅用同一個字翻過來：「然而，敬虔加上知足的心便是大利了」（6:6）。問題是：神會不會因為人的敬虔與奉獻，就保證他在物質上興旺？</p>"],["興旺應許說（敬虔與奉獻帶來物質祝福）","","<p>認為神是賜福的神，舊約多處應許順服的人倉房充滿；基督徒既是神的兒女，就應當在財富、健康、事業上興旺，奉獻是撒種，必有加倍的收成；生活不興旺，表示信心或奉獻還不夠。</p><p><strong>難處：</strong>這正是 6:5 描寫的那條路：把敬虔當成手段，把錢當成目的。6:9 說「那些想要發財的人，就陷在迷惑、落在網羅」（6:9）；保羅自己在監獄裡、在缺乏中仍然知足。這說法也把一切苦難都講成罪或不信，壓碎了正在受苦的人。</p>"],["敬虔有益說（敬虔有今生的益處，但不保證財富）","","<p>認為 4:8 說敬虔「有今生和來生的應許」，敬虔確實有今生的益處：誠實、勤勞、節制的生活常常帶來穩定，神也確實供應他兒女的需要；但這些益處不是交易，也不保證富足。</p><p><strong>難處：</strong>這個說法要小心不滑回成功神學的語言，例如把「勤勞節制就會富足」當成定律；許多敬虔的人一生清苦，這不是他們的失敗。</p>"],["重新定價說（保羅不否認利，他把利重新定義）","","<p>認為 6:6 幾乎原封不動地重複 6:5 的字，只是換了位置，再加上「知足」：保羅不和對方爭有沒有利，他說敬虔本身就是大利，而這大利要和知足同行。真正的利是不再需要用錢證明神愛我，也不再需要用錢證明自己的價值。</p><p><strong>難處：</strong>這個讀法容易被講得太屬靈，好像物質的需要不重要；保羅在 6:8 仍然說有衣有食，5:17--18 也說工人得工價是應當的，生活的實際需要是真實的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採重新定價說，並吸收敬虔有益說的平衡。</strong>本講義拒絕成功神學：不保證信主就會發財，也不以奉獻換取祝福；神確實供應他的兒女，但他的愛不靠存摺證明。教會的財務要透明，傳道人的供養要合宜（5:17--18），這是對 6:5 最好的回應。本講義不點名任何當代講員或教會。錢、知足與敬虔，全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，而且你可以因此更自由。如果你曾經聽過「你不興旺是因為信心不夠」，那句話不是福音。神沒有在你生意失敗的時候離開你，他是那位「厚賜百物給我們享受的神」（6:17），也是在你缺乏時與你同在的父。</p>"]],"con":[],"say":"本講義的立場：本講義拒絕成功神學，敬虔不是發財的手段，奉獻不是換取祝福的交易；敬虔加上知足本身就是大利。不點名任何當代講員或教會。錢、知足與敬虔，全卷立場見 ISS00_5。","care":"會眾席上可能有因為「撒種奉獻」而負債的人，有生意失敗後被說成信心不夠的人，也有因此離開教會多年又回來的人。講台上不要嘲笑他們「太天真」，也不要點名任何教會；要說清楚：受騙不是你的罪，神沒有離開你。會後單獨關心，必要時協助他尋求債務、法律或心理的專業協助，並讓教會成為他重新站起來的家。"},{"id":"ISS06_4","t":"6:6--8「只要有衣有食，就當知足」——基督徒可以追求財富、投資、創業嗎？","r":"6:6--9；6:17--19","ch":[6],"why":"許多年輕的基督徒在職涯十字路口上問：我可以拚事業、可以投資、可以創業嗎？讀到「有衣有食，就當知足」，有人覺得一切進取都不屬靈，有人乾脆不讀這一節。這一題要說清楚知足與努力的關係，也分辨 6:9「想要發財」是指甚麼。","pos":[["【一】經文問的是甚麼","","<p>「只要有衣有食，就當知足。」（6:8）緊接著說：「但那些想要發財的人，就陷在迷惑、落在網羅」（6:9）。οἱ δὲ βουλόμενοι πλουτεῖν 的重點是「想要」——立定心意要富足；6:17 卻另外對「今世富足的人」說話，沒有叫他們變窮。問題是：知足是不是表示不可以追求更多？投資、創業、升遷，算不算「想要發財」？</p>"],["最低需要說（知足就是只求衣食，其餘都該放下）","","<p>認為 6:8 劃下了基督徒生活的界線：衣食之外的追求都是危險的，基督徒應該簡樸過活，不積蓄、不投資，多出來的全部給出去，這才是真正的知足。</p><p><strong>難處：</strong>σκεπάσματα（遮蔽）可以包括住處，保羅列的是生存的底線，不是生活的上限；6:17 對富足的人說話，沒有叫他們放棄財產，而且說神厚賜百物給我們「享受」；這樣讀，容易滑向清貧主義。</p>"],["自由追求說（只要心態正確，追求財富沒有問題）","","<p>認為 6:9 只是在講心態：只要不貪心、有奉獻，基督徒可以盡情追求財富與成功；財富越多，能為神做的事越多。</p><p><strong>難處：</strong>這個說法低估了 6:9--10 的警告：人很少知道自己什麼時候從「努力」滑進了「想要發財」；「為神賺錢」也常是一張好看的包裝紙。保羅說那網羅會「叫人沉在敗壞和滅亡中」（6:9），不是一句輕描淡寫的提醒。</p>"],["方向與用途說（可以努力、可以創業，但方向要對、用途要清楚）","","<p>認為經文要問的不是「賺多少」，而是「為甚麼賺、倚靠甚麼、賺了做甚麼」。基督徒可以勤奮工作、投資、創業，這也是管家的職責；但衣食之上的部分，不是安全感的來源，而是可以給出去的資源：「行善，在好事上富足，甘心施捨，樂意供給人」（6:18）。</p><p><strong>難處：</strong>這個說法需要不斷的自我檢查，也需要群體的提醒；沒有具體的節制與分享，「方向對」很容易只是一句口號。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採方向與用途說。</strong>基督徒可以追求卓越、投資、創業，也可以為家人預備；知足不是懶惰，也不是沒有夢想。要警醒的是三件事：不讓追求取代敬虔、不倚靠無定的錢財、不讓賺來的停在自己手上。可以用三個問題自我檢查：我為了它犧牲了哪些關係？我怎樣用多出來的？失去它，我還有平安嗎？錢、知足與敬虔，全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕。神不是要你在拚事業和愛主之間二選一；他是要你在每一份工作、每一筆投資裡，記得自己是管家。「我們沒有帶甚麼到世上來，也不能帶甚麼去」（6:7），所以手上的一切都可以輕輕地拿著。</p>"]],"con":[],"say":"本講義的立場：基督徒可以努力工作、投資、創業，知足不是放棄；要警醒的是方向與用途——不倚靠錢財，不讓多出來的停在自己手上。錢、知足與敬虔，全卷立場見 ISS00_5。","care":"會眾席上可能有剛創業失敗、背著債務的人，也有因為選擇一份收入較少的工作而被家人責怪的人，還有正在拚升遷、心裡很累的年輕人。講台上不要把收入高低和屬靈程度連在一起，也不要用知足叫缺乏的人不敢說出需要；會後可以陪他具體談談財務與生涯，必要時介紹可信的財務或職涯輔導。"},{"id":"ISS06_5","t":"6:10「貪財是萬惡之根」——錢本身是惡的嗎？","r":"6:10；6:17--18","ch":[6],"why":"6:10 是全卷最常被誤引的一句，民間常把它講成「錢是萬惡之根」，這是誤讀，卻讓有些基督徒對錢充滿罪疚，連正常的收入與享受都心虛；也有人反過來說「錢是中性的工具」，好像它對人心沒有任何拉力。這一題要把主語讀準。","pos":[["【一】經文問的是甚麼","","<p>「貪財是萬惡之根。有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。」（6:10）原文 ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία：主語是帶冠詞的 φιλαργυρία，「愛銀子」；ῥίζα（根）不帶冠詞而放在句首。問題有兩個：惡的是錢，還是愛錢的心？「萬惡之根」是說一切的惡都從這裡來，還是說各樣的惡都可能從這裡長出來？</p>"],["錢本身有害說（財富本身就帶著敗壞的力量）","","<p>認為錢與「瑪門」相連（這使我們想起路 16:13），有一種屬靈的拉力，基督徒越少碰越好；6:10 雖然說的是貪財，但錢本身就是試探的源頭，所以甘願貧窮才最安全。</p><p><strong>難處：</strong>這不是經文的主語。6:10 說的是 φιλαργυρία，心裡的愛；6:17 說神「厚賜百物給我們享受」，4:4 說「凡神所造的物都是好的」（4:4）。把錢本身當作惡，會滑向清貧主義，也讓人以為只要沒錢就沒有貪財的問題——其實窮人一樣會愛錢。</p>"],["唯一根源說（一切的罪都從貪財而來）","","<p>把「萬惡之根」讀成「萬惡的那一個根」：人間所有的惡，追到底都是愛錢；這是一句嚴格的、全稱的定律。</p><p><strong>難處：</strong>ῥίζα 沒有冠詞，πάντων τῶν κακῶν 也可以讀成「各種的惡」；保羅別處也說驕傲（3:6；6:4）是墮落的病根。把貪財講成唯一的根，與全卷對驕傲的診斷不合，也讓這句經文變成一句過度簡化的口號。</p>"],["一個根源說（愛錢是可以長出各樣惡事的一個根）","","<p>認為 ῥίζα 不帶冠詞是強調性質：愛錢是一個根，從它可以長出各式各樣的惡——說謊、剝削、背叛、離開信仰。錢本身不是惡，愛錢的心才是；結局是「用許多愁苦把自己刺透了」（6:10），沒有人刺他，是他自己刺穿了自己。</p><p><strong>難處：</strong>這個讀法要小心不把警告講輕了：「一個根」不是「小問題」，6:9 說它叫人沉在敗壞和滅亡中。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採一個根源說。</strong>6:10 的主語是「貪財」，不是錢；錢可以是好僕人，貪財卻要作主人。本講義拒絕成功神學，也拒絕清貧主義：神厚賜百物給我們享受，享受不是罪；把盼望放在禮物上而忘了賜禮物的神，才是罪。錢在神的家裡最好的位置，是 6:18 的 κοινωνικούς——用來建立關係。錢、知足與敬虔，全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你對錢充滿罪疚，也不該讓你對錢掉以輕心。你可以感謝著領受神給你的，同時常常問自己：我最近最常想的是甚麼？若答案是錢，回到 6:11：逃避這些事，追求公義、敬虔、信心、愛心、忍耐、溫柔。</p>"]],"con":[],"say":"本講義的立場：6:10 的主語是「貪財」，不是錢；愛錢是可以長出各樣惡事的一個根。本講義拒絕成功神學，也拒絕清貧主義，神厚賜百物給我們享受，享受不是罪。錢、知足與敬虔，全卷立場見 ISS00_5。","care":"會眾席上可能有從小在貧窮與罪疚中長大、一花錢就心慌的人，也有被家人指責「信了耶穌就不顧家計」的人，還有正被債務壓得喘不過氣的人。講台上不要用這節羞辱富人，也不要用它指責窮人「一定是貪心才欠債」；會後單獨關心財務上掙扎的人，必要時協助他尋求債務與財務的專業協助，教會也可以實際地分擔。"},{"id":"ISS06_6","t":"6:13「向本丟‧彼拉多作過那美好見證」——指的是甚麼？","r":"6:12--13；約 18:36--37","ch":[6],"why":"「美好的見證」在 6:12--13 連著出現：提摩太作過，基督也作過。這是新約書信裡少數直接提到彼拉多審判的地方，也是本卷 321「耶穌是我的榜樣」的原型經文。讀準它，會影響我們怎樣在壓力下為信仰說話——是大聲爭辯，還是安靜地不退讓。","pos":[["【一】經文問的是甚麼","","<p>「我在叫萬物生活的神面前，並在向本丟‧彼拉多作過那美好見證的基督耶穌面前囑咐你」（6:13）。τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν：ἐπί 可以讀作「在彼拉多面前」，也可以讀作「在彼拉多的時候」。問題是：這「美好的見證」是指耶穌在審判時說的話，還是指他在彼拉多任內的受死？它和 6:12 提摩太的見證有甚麼關係？</p>"],["審判時的話語說（指耶穌在彼拉多面前的認信）","","<p>認為 ἐπί 配屬格是「在某人面前」，指耶穌受審時所說的話：「我為此而生，也為此來到世間，特為給真理作見證。」（約 18:37）他承認自己是王，卻說他的國不屬這世界；這就是那美好的見證。</p><p><strong>難處：</strong>福音書記載耶穌在彼拉多面前多半沉默；若只指幾句話，可能把「見證」講得太窄，μαρτυρέω 在新約後期也帶著以生命、以受苦作見證的意味。</p>"],["受難全程說（指耶穌在彼拉多任內的受死）","","<p>認為 ἐπί 配屬格也可以表示時間，「在本丟‧彼拉多的時候」，如同後來的信經說基督「在本丟‧彼拉多手下受難」；美好的見證就是他整個受苦、被釘、至死忠心的生命。</p><p><strong>難處：</strong>6:13 的動詞與 6:12 提摩太「作了那美好的見證」平行，提摩太的見證顯然是在眾人面前的認信；完全排除話語的層面，會失去這個平行。</p>"],["話語與生命並讀說（安靜而清楚的認信，連同至死的忠心）","","<p>認為兩讀可以合在一起：耶穌在彼拉多面前所說的話不多，卻清楚、不退讓；這話語連著他接下來的受死，構成一個完整的見證。提摩太的見證要照著這一次：可能是受洗或按立時在眾人面前的認信，也要用一生去兌現。</p><p><strong>難處：</strong>這是綜合的讀法，要誠實承認文法上兩讀都有支持，不能說得太肯定；提摩太在甚麼場合作了見證，經文也沒有明說。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採話語與生命並讀說。</strong>6:13 的「美好」第一次有了一個人的臉：一位被綁著的人，安靜、清楚、不退讓地為真理作見證，並且以受死兌現了他的話。提摩太的見證、我們每一個受過洗的人的見證，模子都是他。這不是叫人在壓力下大聲爭辯，而是叫人不否認、不報復、不退讓。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題不必讓你不安，反而可以給你力量。當你在家人、同事面前為信仰作見證而說不出漂亮的話時，記得主在彼拉多面前也沒有說很多；見證的美好，不在口才，在忠心；一句安靜而清楚的「我是屬主的」，就已經是照著他的模子作的見證。</p>"]],"con":[],"say":"本講義的立場：「那美好見證」是基督在彼拉多面前安靜清楚的認信，連同他至死的忠心；提摩太和每一個信徒的見證都照著這個模子——不否認、不報復、不退讓。","care":"會眾席上可能有因信主而在家中受壓、被逼拜祖先或被斷絕關係的人，也有因為不敢承認信仰而一直自責的人。講台上不要說「你不敢講就是不愛主」；要讓他知道，主在彼拉多面前也是一位被綁住、受苦的人，他明白這種壓力。會後陪他想一想，在他的處境裡，一個安靜而清楚的見證可以是甚麼樣子，並為他持續代禱。"},{"id":"ISS06_7","t":"6:16「獨一不死」——那天使和人的靈魂呢？","r":"6:15--16；林前 15:53；太 10:28","ch":[6],"why":"讀到神是「那獨一不死」的，細心的會眾會問：天使不會死嗎？人的靈魂不是不滅的嗎？有些團體甚至用這一節主張人死後靈魂就消失，或主張地獄只是滅絕。這一題關乎我們怎樣理解神的超越，也關乎喪親的人怎樣面對死亡。","pos":[["【一】經文問的是甚麼","","<p>「就是那獨一不死、住在人不能靠近的光裡，是人未曾看見、也是不能看見的」（6:16）。ὁ μόνος ἔχων ἀθανασίαν，「唯一擁有不死的」；ἀθανασία 這個字在新約另外只出現在林前 15:53--54，說這必死的要變成不死的。問題是：若只有神不死，天使和人的靈魂算甚麼？這節經文是否表示人沒有永存的靈魂？</p>"],["靈魂消滅說（人本身沒有不死，死後靈魂不存）","","<p>認為既然只有神「不死」，人就沒有天生不滅的靈魂；人死了就是完全停止存在，直到復活。有些人進一步主張，不得救的人最後只是被滅絕，不會有永遠的刑罰。</p><p><strong>難處：</strong>這個說法從一節頌讚推出了一整套人觀，負擔太重；主耶穌說「那殺身體、不能殺靈魂的，不要怕他們」（太 10:28），又應許十字架上的強盜當日就在樂園裡，都指向身體死後仍有存在。</p>"],["本體與賦予說（神本身擁有不死，受造者的存在是領受的）","","<p>認為 ἔχων 的重點是「擁有」：只有神是自有、本有的不死，祂的生命不從任何來源領受；天使與人的靈魂若存續，是神所賜、靠神維持的。所以「獨一不死」說的是本源，不是說沒有任何受造物能存續。</p><p><strong>難處：</strong>這個讀法要小心不把哲學上的「靈魂不滅」直接讀進經文；新約的盼望重點在身體的復活，林前 15:53 說不死是將來「穿上」的，不是人原本就有的。</p>"],["復活盼望說（不死是神將來賜給屬他的人的禮物）","","<p>認為新約把 ἀθανασία 放在復活的盼望裡：這必死的，總要「變成」不死的。神是唯一本有不死的，而他要把這不死賜給屬他的人；人的盼望不是靠自己的靈魂不滅，而是靠那位獨一不死者的應許。</p><p><strong>難處：</strong>這個讀法回答了盼望的問題，卻沒有完全回答死後到復活之間的狀態；對此新約說得不多，需要謙卑地承認有些事我們只知道一部分。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採本體與賦予說，並以復活盼望說為落點。</strong>6:16 是一首頌讚，重點是神的超越：只有他本來就擁有不死，一切受造者的存在都是領受的；本講義不從這一節推出靈魂消滅或地獄滅絕的教義。我們的盼望不在自己的靈魂有多堅強，在那位獨一不死的主要叫屬他的人穿上不死。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一節不是要我們解答所有關於死後的問題，而是要我們抬頭敬拜。保羅寫到這裡，說的是「但願尊貴和永遠的權能都歸給他。阿們！」（6:16）——在死亡面前，我們的安慰是：那位不死的，是我們的主。</p>"]],"con":[],"say":"本講義的立場：「獨一不死」說的是只有神本來就擁有不死，一切受造者的存在都是領受的；本講義不從這節推出靈魂消滅說，我們的盼望在那位獨一不死的主要叫屬他的人穿上不死。爭議與信心，全卷立場見 ISS00_9。","care":"會眾席上可能有剛失去家人的人，聽到「人沒有不死」會非常害怕；也有家人未信而過世、一直擔心的人。講台上不追問細節，不在喪親的人面前討論誰在哪裡，不對正在流淚的人說「你要有信心」；會後單獨關心，陪他哀傷，必要時協助他尋求哀傷輔導，並把他交託給那位住在光中的神。"},{"id":"ISS06_8","t":"6:17--19「今世富足的人」——教會怎樣對待有錢的會友？","r":"6:17--19；5:17--18；雅 2:1--4","ch":[6],"why":"幾乎每一間教會都有經濟能力較好的會友，他們的奉獻常常撐起教會的預算。牧者容易巴結，也容易嫉妒；會眾可能把他們捧上職分，也可能在背後議論。這一題要問：一位年輕的傳道人，怎樣照 6:17--19 對錢比他多、年紀比他大的人說話？","pos":[["【一】經文問的是甚麼","","<p>「你要囑咐那些今世富足的人，不要自高，也不要倚靠無定的錢財；只要倚靠那厚賜百物給我們享受的神。」（6:17）τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι 是「在今世富足的」，保羅承認他們的富足，也標出它的期限；ἀδηλότητι 是「看不清楚的」，倚靠它像倚靠霧。問題是：教會應該怎樣對待這些會友——特別尊重、刻意保持距離，還是另有一條路？</p>"],["資源倚重說（有錢的會友是教會的重要支柱，應當特別看重）","","<p>認為富足的會友承擔了教會很大部分的開支，讓他們參與決策、擔任職分、受到特別的關顧是合理的；這樣也能鼓勵他們繼續奉獻。</p><p><strong>難處：</strong>這正是雅各書警告的偏心：「請坐在這好位上」，又對那窮人說「你站在那裏」（雅 2:3）。職分的資格是品格（3:1--13），不是奉獻額；讓錢換取發言權，等於讓錢在神的家裡作主。</p>"],["先知批判說（富人是需要被責備的對象，講台要常常挑戰他們）","","<p>認為聖經處處站在窮人一邊，雅各書甚至說「你們這些富足人哪，應當哭泣」（雅 5:1）；講台應該常常挑戰有錢人的生活方式，呼籲他們放下財富，才不會被錢財腐化。</p><p><strong>難處：</strong>6:17--19 的語氣不是羞辱，而是囑咐：保羅沒有叫他們變窮，只叫他們不自高、不倚靠，並且在好事上富足。講台上的影射與冷言冷語，往往不是先知的勇氣，而是嫉妒，也讓富足的弟兄姊妹在神的家裡找不到家。</p>"],["家人託付說（富足的人和每一位會友一樣是家人，被託付更多）","","<p>認為 6:17--19 給了一條清楚的路：不巴結，也不嫉妒，把他們當作被神託付較多的家人，具體地囑咐他們「行善，在好事上富足，甘心施捨，樂意供給人」（6:18）；κοινωνικούς 叫他們用錢與弟兄姊妹建立關係，而不是用錢買到位置。</p><p><strong>難處：</strong>這需要牧者自己先在錢的事上自由；若教會的財務不透明，或傳道人的生計依賴少數幾位大額奉獻者，這條路很難走得穩。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採家人託付說。</strong>富足的會友不是教會的提款機，也不是講台的靶子，是被神託付較多的家人。教會的財務要透明，奉獻不換取座位、職分或發言權；傳道人的供養要合宜（5:17--18），使他不必看任何人的臉色講道。錢、知足與敬虔，全卷立場見 ISS00_5；神的家的職分與秩序，全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你是富足的人，你在神的家裡不是因為錢才被愛；若你是缺乏的人，你在神的家裡也不是因為缺乏而矮一截。保羅叫富足的人「持定那真正的生命」（6:19）——那生命，錢買不到，也不會因為沒錢就失去。</p>"]],"con":[],"say":"本講義的立場：教會對富足的會友不巴結也不嫉妒，把他們當作被託付較多的家人，囑咐他們不倚靠錢財、樂意供給人；財務要透明，奉獻不換取職分與發言權。全卷立場見 ISS00_5、ISS00_3。","care":"會眾席上可能有因為有錢而被疏遠、被議論、只被當成奉獻來源的弟兄姊妹，也有因為窮而一直覺得在教會抬不起頭的人。講台上不要影射任何一位會友的財富或奉獻，也不公開比較奉獻；牧者要在私下真實地關心每一個人的生命，不論他的錢包厚薄，讓每一個人都知道自己在這個家裡被看見。"},{"id":"ISS06_9","t":"6:20「那敵真道、似是而非的學問」——信仰與學術、科學是敵人嗎？","r":"6:20--21；1:3--4；西 2:3","ch":[6],"why":"許多基督徒青年進了大學就面對一個問題：信仰與學術、科學是不是敵對的？有些講台用 6:20 說「學問會讓人失去信心」，結果在大學、實驗室、醫院工作的會友覺得自己的專業是信仰的威脅。這一題要把 6:20 的「學問」讀準。","pos":[["【一】經文問的是甚麼","","<p>「提摩太啊，你要保守所託付你的，躲避世俗的虛談和那敵真道、似是而非的學問。」（6:20）原文 ἀντιθέσεις τῆς ψευδωνύμου γνώσεως：ψευδωνύμου 是「名不副實、冒用其名的」，γνώσεως 是「知識」。問題是：保羅反對的是學問與知識本身，還是某一種冒用知識之名的說法？這和今天的大學、科學有甚麼關係？</p>"],["反知識說（學問與信仰本質上衝突，要保持距離）","","<p>認為 6:20 清楚警告基督徒要躲避「學問」，世上的哲學與科學常常否認神，所以信徒應該對高等教育與學術研究保持戒心，最安全的是單純地信。</p><p><strong>難處：</strong>經文說的是「似是而非」的學問，ψευδωνύμου 這個形容詞正是重點；保羅自己引用希臘詩人，與雅典的哲學家辯論，而且說基督裡「所積蓄的一切智慧知識，都在他裡面藏著」（西 2:3）。神願意萬人「明白真道」（2:4），真理不怕被研究。</p>"],["早期諾斯底說（6:20 專指某一種特定的異端運動）","","<p>認為 γνῶσις 這個字讓人想到二世紀的諾斯底主義，以「祕傳的知識」為

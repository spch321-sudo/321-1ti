<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321提摩太前書講義">
<meta name="application-name" content="321提摩太前書講義">
<meta name="description" content="321提摩太前書講義：全書六章逐節原文解經、講章逐字稿與321生命應用。">
<title>321提摩太前書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"在罪人中我是個罪魁","sub":"愛、魁、船","lv":"A","arc":"託","sec":[["1:1--2","寫信給那因信主作我真兒子的提摩太：真兒子"],["1:3--7","但命令的總歸就是愛：異教、家譜與愛"],["1:8--11","我們知道律法原是好的：只要人用得合宜"],["1:12--17","在罪人中我是個罪魁：蒙憐憫的人與永世的君王"],["1:18--20","叫你因此可以打那美好的仗：信心、良心與破了的船"]],"serm":{"pts":[["命令的總歸就是愛","1:3--11","「但命令的總歸就是愛」——以弗所有人傳異教，拿家譜和律法互相辯論；保羅說一切囑咐的目的只有一個，就是從清潔的心、無虧的良心、無偽的信心生出來的愛"],["我是個罪魁","1:12--17","「在罪人中我是個罪魁」——一封講教會秩序的信，第一塊基石是一個承認自己不夠格的人；他蒙憐憫，是要給後來的人作榜樣；一想起恩典，他就停下來讚美"],["打那美好的仗","1:18--20","「叫你因此可以打那美好的仗」——父親把命令交託兒子：常存信心和無虧的良心；丟棄良心的人，在真道上如同船破壞了一般；連懲戒也是為了挽回"]]},"q":"如果下個月教會要選一位新同工，候選人的履歷上寫著：從前褻瀆神、逼迫信徒、動手侮辱人——你會投他一票嗎？保羅說，主就是挑了這樣一個人，還把一整封講教會秩序的信，建在他這一句自白上：「在罪人中我是個罪魁」（1:15）。\n再問近一點：你在教會裡，比較常記得的是自己的資歷、服事的年數、在群組裡說對過幾次話，還是自己蒙了多少憐憫？你最近一次為了一件事爭到面紅耳赤，爭完之後，你和那個人是更相愛了，還是只剩下誰對誰錯？\n這一章要問的是：一切的規矩、一切的對錯，最後要歸到哪裡？如果「命令的總歸就是愛」，那我守住的是愛，還是只守住了自己？而那個一次又一次被我推開的良心，現在還聽得見嗎？","truth":"神交託給教會的一切命令，目的只有一個，就是從清潔的心、無虧的良心、無偽的信心生出來的愛（1:5）；而這個家的第一塊基石不是職分，是一個蒙了憐憫的罪魁（1:15--16）。\n恩典先於職分，敬拜先於秩序：記得自己是罪魁的人，才守得住命令而不失去愛；推開良心的人，再大的船也會破；連最重的懲戒，也是為了把人挽回。","mv":{"t":"「基督耶穌降世，為要拯救罪人。」這話是可信的，是十分可佩服的。在罪人中我是個罪魁。","r":"提前1:15"},"card":["這一章是一封託付信的開頭：保羅把提摩太留在一間正在出問題的教會，交給他一道命令——叫那幾個人不可傳異教。可是保羅馬上說，這命令的總歸就是愛；律法是好的，只要用得合宜。接著他把自己擺上桌：我從前是褻瀆神的，如今是蒙了憐憫的罪魁，說著說著就停下來讚美永世的君王。最後他把命令交到兒子手裡：常存信心和無虧的良心，因為有人推開良心，船就破了。對傳道人，這是一份授權書；對會眾，這是一封當眾宣讀、人人都在聽的家書。","這一章裡，真正動手的是神。是神「給我力量」，是主「以我有忠心，派我服事他」（1:12）——被算為忠心的，是一個最不忠的人。是主的恩「格外豐盛」，滿出來又再滿出來，還把信心和愛心一起帶進來（1:14）。是基督耶穌降世拯救罪人，是他在一個罪魁身上「顯明他一切的忍耐」（1:16）。連最後交出許米乃和亞歷山大，神要的也不是他們消失，是他們回來。保羅在這一章做的事，幾乎只有兩件：領受，然後讚美。","1:19 說「有人丟棄良心」，「丟棄」原文是 ἀπωσάμενοι（apōsamenoi），中間語態：不是不小心掉了，是自己用力把它推開。良心很少是一夜之間壞掉的；它是在一次又一次「這次就算了」「大家都這樣」裡被推遠的。推到後來，它不再大聲說話，船卻還在航行，直到觸礁那一刻。這改變今天的讀法：船破不是一場意外，是很多次小小的推開。對站在台前的人，它是警鐘——越在前面的船，沉的時候帶下去的人越多；對坐在台下的人，它是邀請——今晚良心若還在敲門，就是神的憐憫還在。","這一章照出來的我，常在兩個地方不對勁。一個是爭：我很會分辨誰的教導有問題、誰的立場不對，說話越來越肯定，心卻越來越硬，像 1:7 那些想作教法師的人，不明白自己所講說的，卻講得斬釘截鐵。另一個是藏：我把那張罪的清單（1:9--10）拿去量別人，卻悄悄把自己從清單上劃掉。保羅剛講完清單，就說「我是個罪魁」；我卻常常講完清單，就去找別人的名字。","「但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！」（1:17）全章最該被記住的一個動作，是保羅講著自己的故事，忽然停下來讚美。他把一個罪魁變成使徒的故事可能換來的所有掌聲，全數轉交給那位永世的君王。以弗所城裡的皇帝會死、會換，這位王不換。對傳道人：講完見證，要把會眾的眼光交還給王；對會眾：想起自己蒙的憐憫時，不要急著往下走，先說一聲「阿們」。","這一週，選一個晚上，把手機裡那一段你「吵贏了」卻冷掉的對話找出來——群組裡的一場爭論、家裡的一次頂嘴、同工會上的一句重話。先在主面前讀一遍 1:5，問自己：那天我守住的是愛，還是只守住了我是對的？然後在那一週之內，主動傳一句話或打一通電話給那個人，不重新辯論，只說：「那天我說話的心不夠清潔，對不起。」傳道人可以從一位同工開始，會眾可以從一位家人開始。","最終整合：以弗所，一個主日的傍晚，一間借來的大屋子。\n長老們坐在前排，幾位寡婦坐在牆邊，幾個做銀器的工匠站在門口；屋子中間空了兩個位子，大家都知道那是誰常坐的。\n提摩太站起來，手上是一卷信。他還年輕，前排有人皺眉。\n他讀到「命令的總歸就是愛」，屋裡有人點頭；讀到律法那張清單，有人偷偷看向那兩個空位子。\n然後他停了一下，聲音放低：\n「『基督耶穌降世，為要拯救罪人。』這話是可信的，是十分可佩服的。在罪人中我是個罪魁」（1:15）\n不是「我從前是」，是「我是」。寫這封信的人，是當年在耶路撒冷看守衣裳、後來一路追到大馬士革的那一位。\n屋子靜了下來。那些剛才看向空位子的眼睛，一雙一雙垂了下去。\n提摩太讀下去：「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐」（1:16）。\n門口一個工匠抬起頭——那年燒法術書的火堆旁，也有他。\n最後讀到許米乃和亞歷山大的名字。有人想說「早該如此」，卻聽見信上寫著：「使他們受責罰就不再謗瀆了」（1:20）。\n那兩個位子沒有人搬走。\n聚會散了，提摩太把信捲起來，留下一盞燈在窗邊。\n如果你今天站在講台上，請先記得你是誰；如果你今天坐在台下，請記得他對誰忍耐過。\n這個家的地基，就是一個蒙了憐憫的罪魁；空著的位子，燈還亮著。"],"self":"這一章照出來的「有己」，第一個樣子是要贏：我把真理當成一場辯論，把家譜、時間表、某個原文字的冷知識當成資本，想作教師多過想被教導；我守住了對錯，卻失去了愛，還以為那就是忠心。\n第二個樣子是要乾淨的履歷：我願意承認「我從前是罪人」，卻不肯承認「我是」；我把良心一次一次推開，還用服事的年數當作救生圈——兩種樣子的中心都是我，一個不肯輸，一個不肯低頭。","t321":{"k":"耶穌是我的榜樣：法利賽人和文士私下議論主耶穌，說：「這個人接待罪人，又同他們吃飯」（路 15:2）。他對彼得的作法，正是這一章的次序：彼得三次不認主，主復活以後在海邊預備了早飯，三次問他「你愛我嗎」，然後才說「你餵養我的小羊」（約 21:15）——先有憐憫，後有託付；先恢復愛，後交給職分。他在十字架上為釘他的人禱告，說他們所做的他們不曉得，那就是 1:16「一切的忍耐」最深的樣子。學他，是在要求別人以前，先記得自己被怎樣接待過；在交託別人以前，先問一句「你愛我嗎」。","g":"讓耶穌作王：這一章要人讓出來的第一個位置，是「教法師」的位置——那個一定要講得對、一定要贏、說話斬釘截鐵的我（1:7）。第二個位置，是「站在清單外面的人」——讀到 1:9--10，以為自己是審判者，其實保羅一講完清單就站進去說「我是個罪魁」。第三個位置，是故事的主角：1:17 保羅把自己的見證所能換來的一切尊貴、榮耀，都交給永世的君王、獨一的神。讓耶穌作王，就是讓他作那個唯一的王、唯一的義者、唯一配得榮耀的那一位。可以自己檢查：我上一次講完自己的見證，大家記得的是我，還是他？","p":"建立屬神的體系：第 1 章給教會的不是一套管理制度，是一個家的地基——一群蒙了憐憫的罪人，被交託一道以愛為目標的命令。第一，讓教導有靶心：教會開課、查經、處理爭議，都先問「這會讓我們更相愛嗎」，而不只是「這樣說對不對」。第二，讓見證成為日常：常常請弟兄姊妹說自己「蒙了憐憫」的故事，同工會和長執會也從認罪與感恩開始，免得領袖忘了自己是誰。第三，讓紀律有回家的路：私下勸、帶人同去、最後才告訴教會，每一步都有人陪、有禱告、有寫清楚的回轉之路。第四，讓交託有接力：像保羅把命令交給提摩太，每一位同工都要找一位年輕的人，一同禱告、一同服事，把託付交下去。"},"grp":["【一、破冰】說一次你「吵贏了」卻覺得不太開心的經驗：家裡的一次爭執、群組裡的一場筆戰、公司會議上的一次據理力爭……吵完之後，你和那個人的關係變得怎樣？","【二、扎心】經文說：「但命令的總歸就是愛；這愛是從清潔的心和無虧的良心，無偽的信心生出來的」（1:5）。清潔的心、無虧的良心、無偽的信心，這三個源頭，你最近哪一個被堵住了？說出一件具體的事：在哪裡、對誰，你守住了自己的對，卻沒有流出愛來？","【三、福音】保羅說：「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐」（1:16）。說一個你覺得「連神也該對我失去耐心了」的地方——一個改不掉的習慣、一段放不下的過去。如果主的忍耐正是要在這裡顯明，你今天可以怎樣換一個方式來到他面前？","【四、行動】說出一位這一週你要去修補關係的人（名字或關係），說出哪一天、用甚麼方式（一通電話、一則訊息、一頓飯），你要對他說的那一句話是甚麼。也說出你的良心最近一直提醒你、你卻一直推開的一件小事，這一週你打算在哪一天把它處理掉。","【五、代禱】為三種人指名禱告：一位正被放在衝突中間、想走卻被留下來服事的年輕傳道人或同工，求主讓他記得自己是被差來的；一位曾經被教會「處理」過、如今離開了的人，求主讓他知道門沒有關死、燈還亮著；一位今天還在反對福音、像從前的保羅一樣的家人或同事，求主在他身上也顯明一切的忍耐。"],"prac":{"main":"這一週，從爭對錯回到愛——因為我自己，也是一個蒙了憐憫的罪魁。","items":["對神：每天早上慢慢讀一次 1:15--17，先說「在罪人中我是個罪魁」，再說「然而，我蒙了憐憫」，然後用 1:17 的話讚美：「但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！」（1:17）兩半要一起唸，不只唸前一半，也不只唸後一半。","對自己：這七天，每晚睡前用 1:5 的三面鏡子各問一句——今天我的動機清潔嗎？我要求別人的，自己做到了嗎？我在人前的信心和在家裡的信心是同一個嗎？把良心今天輕輕提醒你、你卻推開的那一件事寫下來，第二天就去處理它，不要讓它累積成一次觸礁。","對人：找出一位你曾經在爭論中傷到的人，這一週主動聯絡他，不重新辯論，只承認自己說話的心不夠清潔；若你是帶領的人，也想一想那位被你「處理」過、或自己離開了的弟兄姊妹，為他禱告，在合宜、安全的情況下，傳一則問候，讓他知道門還開著。","對生活：檢查你這一週在網上轉貼、留言的內容——那些關於末世時間表、隱藏密碼、某位講員的爭議，是讓你更會愛，還是更會爭？刪掉一則只生辯論的轉貼，換成一句為某個人的祝福；也把讀經時間至少留一天，只讀經文、只禱告，不查任何爭議。","對使命：這一週向一位還不認識主、甚至反對福音的人，用三分鐘說出「我蒙了憐憫」的故事，重點不放在自己從前多糟或如今多好，而是主對你多有忍耐；也找一位比你年輕的弟兄姊妹，約他一起禱告一次，開始把你領受的託付交下去。"]},"safe":["① 把 1:15「我是個罪魁」講成「信主多年仍要天天活在自責與自我貶低裡，越覺得自己爛越屬靈」。","保羅的現在式說的是他站立的位置，不是他的身分還停在舊人；下一節馬上接「然而，我蒙了憐憫」（1:16），他在別處也說「若有人在基督裡，他就是新造的人」（林後 5:17）。只講前一半，會叫敏感、自卑、正在憂鬱中的人更絕望。","檢驗標準：你講「罪魁」的時候，有沒有在同一口氣裡講出「蒙了憐憫」？台下一位天天自責的人聽完，是更想躲起來，還是更想來到主面前？","② 反過來，領袖拿「我也是罪魁」當作擋箭牌：被指出錯誤時說「我本來就是罪人，你們要饒恕我」，然後甚麼都不改、甚麼都不交代。","保羅說「我是罪魁」，是把自己放在恩典底下，不是把自己放在問責之外；同一卷書說犯罪的長老要被責備（5:20），還要「謹慎自己和自己的教訓」（4:16）。把謙卑的話變成免責的話，就是另一種推開良心。","檢驗標準：講「我也是罪人」的人，接下來有沒有具體的認錯、修正與交代？會眾聽完，是更信任問責，還是更懷疑謙卑？","③ 把 1:20「交給撒但」講成可以當眾羞辱人、逐出以後全教會不打招呼、連他的家人都被孤立；或把它和趕鬼、咒詛連在一起，好像教會可以咒人。","保羅把目的寫在同一句話裡：「使他們受責罰就不再謗瀆了」（1:20）；「受責罰」原文是父親管教孩子的字，懲戒的目的是挽回，就像林前 5:5 說的「使他的靈魂在主耶穌的日子可以得救」，哥林多後書也說「倒不如赦免他，安慰他，免得他憂愁太過，甚至沉淪了」（林後 2:7）（紅線五）。","檢驗標準：你講懲戒的時候，有沒有講到它的目的是挽回、有沒有講到回轉之後的接納？一位曾被教會懲戒過的人聽完，是看見回家的路，還是只看見關上的門？","④ 把 1:20 的「謗瀆」講成「批評牧者、質疑長老、說出教會裡的傷害」，拿許米乃和亞歷山大來嚇唬提出問題的人。","原文 βλασφημεῖν（blasphēmein）是褻瀆神、抵擋真道；提後 2:17--18 說許米乃的問題是講「復活的事已過」，是推翻信仰的教訓，不是向領袖提出異議。用這一節叫人閉嘴，正好落入本卷要擋的屬靈權柄濫用（全卷立場見 ISS00_4）。","檢驗標準：你有沒有分清楚「抵擋福音」和「指出錯誤」？一位鼓起勇氣說出教會問題的人聽完，是更敢說，還是更害怕被「交出去」？","⑤ 讀到 1:10「親男色的」就特別放大聲量，講成全場只有這一項是罪，甚至拿同性戀者開玩笑、貼標籤、當作敵人。","經文把它和「說謊話的」並列在同一張清單裡，沒有一個坐在會眾席上的人可以置身事外；林前 6:11 說「你們中間也有人從前是這樣」，同一位神洗淨了每一種人。羞辱只會把正在掙扎的弟兄姊妹、他們的父母推離教會。","檢驗標準：一位有同性吸引掙扎、正在尋求主的年輕人坐在台下，聽完是覺得被看見、被陪伴，還是覺得自己是全場的笑話？","⑥ 反過來，讀到 1:10 就跳過不講，或一句「那是古代剝削性的關係，和今天無關」帶過，免得有人不舒服。","ἀρσενοκοίταις（arsenokoitais）的字根來自七十士譯本利未記的用語（這使我們想起利 18:22），放在十誡第七條的位置上；它描述的是行為，不是一個人的身分或傾向。迴避不是愛，只是把真正需要牧養的人留給網路去回答（沿用哥林多前書第 6 章的處理）。","檢驗標準：你有沒有清楚說出經文的立場，同時清楚說出「行為不等於身分」「教會要陪伴，不要羞辱」？兩樣有沒有都講到？","⑦ 把 1:9--10 那張清單講成「那些壞人」的名單：殺人的、拐賣人口的、外面世界的人，拿來指著社會、指著不信的人罵。","保羅剛講完清單就說「我從前是褻瀆神的，逼迫人的，侮慢人的」（1:13），然後說「我是個罪魁」（1:15）；律法要「用得合宜」（1:8），它先照的是自己。清單的每一項都是愛的反面，也照出教會裡的說謊與起假誓。","檢驗標準：你講清單的時候，主詞是「他們」還是「我們」？會眾聽完，是更想認自己的罪，還是更確定自己是好人？","⑧ 把 1:9「律法不是為義人設立的」講成「信主的人不必再管道德，律法跟我們已經無關」。","保羅在前一節才說「我們知道律法原是好的，只要人用得合宜」（1:8）；律法的刀口不是對著活在恩典中、按愛行事的人，但它照出的罪仍然是罪，「愛就完全了律法」（羅 13:10）。講成道德作廢，就把恩典講成了放縱。","檢驗標準：你有沒有說清楚律法對信徒「不再是甚麼」、「仍然是甚麼」？會眾聽完，是更自由地去愛，還是更自由地放過自己？","⑨ 把 1:4「無窮的家譜」換成今天的版本當作屬靈：推算末世時間表、找聖經隱藏密碼、算數字的奧祕，說這是「更深的真理」。","保羅說這等事「只生辯論」，不帶出神的家政；它的果子是人更會爭、更會怕，卻沒有更會愛（鐵律四）。反過來，也不可把一切認真的研讀、原文與歷史的查考都打成「家譜」，那是把 1:4 講成反對讀書。","檢驗標準：一個教導聽完之後，會眾是更相愛、更敬虔，還是更焦慮、更想轉貼給別人辯論？","⑩ 用 1:5「命令的總歸就是愛」取消 1:3 的囑咐：「愛就是包容一切，不可以說誰的教導錯了，指出錯誤就是不愛。」","保羅剛叫提摩太去「囑咐那幾個人不可傳異教」（1:3），緊接著說命令的目的是愛——愛不是甚麼都不管，有時候愛就是禁止。但同一節也擋住另一頭：禁止的人要從清潔的心出發，不是為了證明自己對。","檢驗標準：你有沒有同時講到「愛有時要說不」和「說不的人要先省察自己的心」？會眾聽完，是更會分辨，還是更會攻擊？","⑪ 把 1:19「船破壞了」講成恐嚇：「你一旦跌倒、一旦懷疑，就失去救恩了，再也沒有希望」；或反過來說「反正一次得救永遠得救，良心推開一點沒關係」。","警告是真的，船也真的破了；可是保羅下一節仍以「受責罰就不再謗瀆了」為目的，說明他沒有把那兩個人當作已經沉到海底。講成恐嚇會叫人活在恐慌裡（鐵律六），講成無所謂會叫人更放心地推開良心。","檢驗標準：會眾聽完，是更珍惜、更願意聽良心的聲音，還是更害怕神、或更不在乎？","⑫ 把 1:18「從前指著你的預言」講成今天可以隨口對人說「神給我一句關於你的話」，用來決定別人的婚姻、工作、去留，或替自己的職位加持。","提摩太的預言是在眾長老按手時、在群體中說出來、被察驗過的（4:14），而且是他「打那美好的仗」時的盔甲，不是誇口的頭銜；保羅自己說要「凡事察驗」。拿預言操控人，正是把盔甲變成了鎖鍊。","檢驗標準：你有沒有講到預言要在群體中被察驗、要與聖經相合、不能取代當事人自己在神面前的決定？","⑬ 用處境取消原則：「這是保羅寫給提摩太個人的信，講的是牧者怎樣管教會，和坐在台下的會眾無關」；或把處境硬搬，把今天某一位同工、某一個宗派直接貼上「傳異教」的標籤。","書信三問要走完：處境是以弗所有人教別的、拿家譜爭辯；原則是一切命令都要歸到愛，罪魁蒙憐憫是全家的地基；這封信寫給一個人，卻要在全會眾面前宣讀（6:21「你們」是複數），所以落點同時在講台與會眾席（全卷立場見 ISS00_1、ISS00_8）。","檢驗標準：你講完，坐在台下的一位普通會友，知道這一章要他這一週做甚麼嗎？你有沒有把任何今天的人直接等同於許米乃？","⑭ 把 1:13「因我是不信不明白的時候而做的」講成「不知者無罪」，或拿來說「我那時候不知道，所以不必認錯、不必賠償」。","保羅不是在替自己減刑，他說的是憐憫臨到時他的光景；憐憫的理由是 1:14「主的恩是格外豐盛」。無知不使人無罪，卻使人仍在赦免可及之處——這叫我們對還在反對福音的人多一份耐心，不是叫自己少一份責任。","檢驗標準：會眾聽完，是更願意為自己從前不知道時傷害的人去修補，還是更理直氣壯地說「我那時不知道」？","⑮ 把保羅講成英雄：講他從逼迫者變成大使徒的戲劇性，講到會眾佩服保羅、羨慕他的恩賜與成就；或先講 321 的口號，再拿 1:15、1:2 來印證。","1:16 的榜樣是一張草圖，畫的是「他一切的忍耐」，主詞是基督；1:2「真兒子」也不是 235 的定義（鐵律五）。會眾若記得的是保羅多了不起，就讀反了這一章（鐵律七）。","檢驗標準：講完之後，會眾更佩服保羅，還是更愛那位忍耐保羅的主？321 是在經文講完之後才接上去的嗎？"]},{"n":2,"t":"只有一位神，在神和人中間，只有一位中保","sub":"禱、保、學","lv":"A","arc":"家","sec":[["2:1--3","第一要為萬人懇求、禱告、代求、祝謝：為君王和一切在位的"],["2:4--7","只有一位中保，乃是降世為人的基督耶穌：萬人的贖價"],["2:8--10","舉起聖潔的手，隨處禱告：無忿怒、無爭論"],["2:11--15","女人要沉靜學道：創造、引誘與在生產上得救"]],"serm":{"pts":[["為萬人禱告","2:1--3","「第一要為萬人懇求、禱告、代求、祝謝」——神的家第一件事不是開會，是禱告；為君王和一切在位的禱告，好叫我們可以敬虔、端正、平安無事地度日"],["一位中保","2:4--7","「只有一位中保，乃是降世為人的基督耶穌」——在一座滿是神像、祭司與中介的城裡，保羅說：神只有一位，中保也只有一位；他願意萬人得救，所以他捨自己作萬人的贖價"],["沉靜學道","2:8--15","「女人要沉靜學道」——無忿怒、無爭論的禱告在一切規矩之前；保羅先叫女人「學」；這一段各家讀法不同，講義陳列而不裁判，但不許任何讀法貶低姊妹"]]},"q":"你上一次在聚會裡為教會以外的人禱告，是甚麼時候？不是為自己的病、自己的工作、自己的孩子，是為樓下那位常常大聲講電話的鄰居、為你不喜歡的那位上司、為你在新聞裡看了就生氣的那個人。\n再問一個更難的：你到神面前，是直接走進去，還是總覺得要先找一個比你屬靈的人替你開口？在一座滿是神像、祭司、護身符的城裡，保羅只說了一句話：神只有一位，中保也只有一位。\n這一章也是全卷最容易吵起來的一章。可是它要問的是：一個被那位中保用自己贖回來的家，為甚麼還在門口吵誰可以進來、誰可以開口，卻忘了先跪下來，為萬人禱告？","truth":"神的家第一件事是禱告，因為神願意萬人得救；神只有一位，在神和人中間也只有一位中保，就是那捨自己作萬人贖價的人基督耶穌（2:1–6）。\n所以在這個家裡，沒有人需要另找門路，也沒有人可以作別人的門檻；男人先放下忿怒與爭論，女人被請進來學，每一個人都站在同一位中保面前。","mv":{"t":"因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌；","r":"提前2:5"},"card":["這一章講神的家先作甚麼、靠誰站立、怎樣學。開頭是禱告：為萬人、為君王和一切在位的；中間是理由：神願意萬人得救，因為神只有一位，中保也只有一位，他捨自己作萬人的贖價；最後是聚會裡的人：男人無忿怒、無爭論地舉手禱告，女人被請進來沉靜學道。對傳道人，這是一份家規的次序；對會眾，這是一道向萬人敞開的門。","這一章的主詞，先是神，後是基督。是神「願意萬人得救，明白真道」（2:4）——他的心比我們的禱告名單寬；是基督站到神和人中間，降世為人，「捨自己作萬人的贖價」（2:6）；是神把一個從前逼迫教會的人「奉派作傳道的」（2:7）。人在這一章裡作的事，都是回應：跪下來為人禱告、學、把手洗乾淨。傳道人要先看見這一點才開口；會眾要先看見這一點才舉手。","2:1 的「代求」原文是 ἐντεύξεις（enteuxeis），在當時的蒲草紙文件裡，常指老百姓向君王遞上去的陳情書。一個小人物替另一個人寫一張狀子，送進宮裡，求王垂聽。保羅說：教會要為萬人遞這樣的狀子，連君王本人也在名單上。這改變今天的讀法：代禱不是一句「願主祝福他」就結束，是替一個具體的人寫一張具體的陳情。對傳道人，這是講台上該帶的禱告；對會眾，你今天為一個人遞上去的那一張，神收得到。","這一章照出來的我，常在兩個地方不對勁。一是禱告的名單太短：我為自己人禱告，卻不為掌權的、不為得罪我的、不為不信的家人禱告，我的禱告比神的心窄。二是我想當中間人：當傳道人的，暗暗喜歡會眾說「要先問過牧師，神才會聽」；坐在會眾席的，寧可把禱告外包給別人，也不肯自己走到神面前。兩種樣子，都在把那一位中保擠到旁邊。","「他捨自己作萬人的贖價」（2:6）。全章最該被記住的，是「捨自己」這三個字。中保不是靠地位站到中間的，是靠把自己給出去；這個家的秩序，是從一位捨己的人開始的。翻過來，這一句也是一把尺：傳道人在講台上爭的若是自己的位子，會眾在會議裡爭的若是自己的聲音，我們就站到了這一句的反面。在最容易吵的經文上先不吵，是捨己最實在的樣子。","這一週，寫一張你的「陳情名單」：一位在位的人（市長、校長、你的主管，只寫職分與名字，不寫評語）、一位得罪過你的人、一位還不信的家人。每天早上用 2:1 的四個字各為他們禱告一句：懇求、禱告、代求、祝謝——最後那一句「祝謝」，要找出一件可以為他感謝的事。傳道人把這張名單帶上主日講台；會眾把它帶到小組。","最終整合：以弗所，城裡一戶人家的大廳，主日的晚上。\n燈不多，人很擠。有一位從前天天去亞底米廟獻祭求平安的婦人，脖子上還掛著一個小小的護身符；有一位做銀龕的工匠，手上還有洗不掉的銀粉；有一位在總督府抄寫文書的書記，靠門站著；還有幾個姊妹坐在後面，她們這一生，從來沒有人教過她們讀書。\n年輕的提摩太站起來，手上的信紙在抖。他知道台下有人比他年長，有人比他有錢，有人在等著看他說錯話。\n他念到為君王禱告，書記抬起頭來；念到「他願意萬人得救」，工匠停下了搓手的動作。\n然後他放慢了聲音：\n「因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌」（2:5）\n那位婦人伸手摸了摸脖子上的護身符。這一生她找過祭司、找過卜者、買過一層又一層的門路，從來沒有人告訴她，有一位已經站在中間，而且是一個人，懂得她的眼淚。\n提摩太再往下念：「女人要沉靜學道」（2:11）。後面那幾位姊妹互相看了一眼——學？有人要教我們？\n那一晚，沒有人為下一段經文吵架。弟兄們舉起手來，先為門外的城禱告。\n婦人把護身符解下來，放在桌上。旁邊一位姊妹把自己手上的經卷，往她那邊推了一點。\n傳道人啊，你站上去的時候，你不是那一位中保，你只是替他念信的人。\n弟兄姊妹啊，你不必再找門路了。路已經開了，開路的那一位，是用自己鋪的。"],"self":"這一章照出來的「有己」，第一個樣子是窄：我的禱告只繞著自己的家、自己的教會、自己的立場打轉，掌權的人我只會罵，得罪我的人我不肯提，好像神的救恩也該照著我的好惡來分配。\n第二個樣子是搶位置：我想站到神和人中間——作傳道人的，喜歡被當成門路；作弟兄姊妹的，在 2:11–15 上非要吵贏不可，把自己的讀法當成那一位中保的話。兩種樣子的中心都是我，忘了站在中間的那一位，是捨了自己才站上去的。","t321":{"k":"耶穌是我的榜樣：主耶穌被掛在十字架上，釘他的是羅馬的兵丁，判他的是羅馬的巡撫，他卻說：「父啊！赦免他們；因為他們所做的，他們不曉得。」（路 23:34）他為在位的人禱告，沒有先等他們變好；他也沒有向彼拉多求情，他在彼拉多面前作了那美好的見證（6:13）。他不是靠地位作中保，是「捨自己」作贖價（2:6）。他在井邊和一位撒馬利亞婦人談道，讓馬利亞坐在腳前聽道——在一個不教女人的世界裡，他先教她們。學他，是為掌權的禱告卻不向掌權的屈膝，為人捨己卻不搶人的位置，也把被擋在門外的人請進來學。","g":"讓耶穌作王：這一章要人讓出來的，是「中間人」的位置。在神和人中間只有一位中保（2:5），所以傳道人要讓出來：我不是會眾通往神的門路，我只是指路的人；會眾也要讓出來：我不再把禱告外包，也不再把某一位屬靈長輩當成第二位中保。第二個要讓出來的，是「贏」的位置——在 2:11–15 上，讓耶穌作王，就是承認我的讀法不是他的寶座，「無忿怒，無爭論」（2:8）比吵贏更要緊。可以自己檢查：這一週，我最後一次非要別人照我的意思不可，是在甚麼事上？那時坐在中間的是誰？","p":"建立屬神的體系：第 2 章給神的家的第一張圖，不是組織圖，是一張禱告名單。第一，讓公禱回到聚會的最前面：每一次主日，為城裡的官長、為鄰舍、為還不信的家人指名禱告，而且只為職分與人禱告、不在禱告裡發表政見。第二，讓每一個人都被教：新來的、年長的、從沒讀過書的、從前沒有機會學的姊妹，都有人陪著讀經，因為神願意人「明白真道」（2:4）。第三，讓爭議有一個安全的桌子：教會在性別與事奉上採哪一種讀法，都要明白說出來、說出理由，也要說出底線——任何一位姊妹都不因此被看低。這樣建起來的，才是一個門向萬人敞開、人人都在學的家。"},"grp":["【一、破冰】你有沒有替別人寫過一封求情的信、打過一通拜託的電話、在一個有分量的人面前替別人說過一句話？那一次是為了誰、在甚麼場合、結果怎麼樣？","【二、扎心】經文說：「我勸你，第一要為萬人懇求、禱告、代求、祝謝；為君王和一切在位的，也該如此」（2:1–2）。說出一位你最不想為他禱告的人——可以是一個職分（主管、校長、某個機構的負責人），不必說政治立場。你上一次想到他的時候，心裡的第一個字是甚麼？","【三、福音】「因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌」（2:5）。說一次你覺得自己不夠格直接到神面前、要先找人替你開口的經驗——是在甚麼時候、為了甚麼事？如果那位中保是「捨自己」站到中間的，那一刻你其實可以怎麼禱告？","【四、行動】寫下你這一週的「陳情名單」三個名字：一位在位的人、一位得罪你的人、一位還不信的家人；說出你要在每天的甚麼時間、在甚麼地方為他們禱告，並說出你要為其中哪一位「祝謝」的一件事。若你是同工或小組長，也說出你這週要陪哪一位弟兄或姊妹讀一段經文。","【五、代禱】為三種人指名禱告：一位在本地掌權的人（只提職分與名字），求神使他得救、明白真道，也使城裡的人可以平安度日；一位在教會裡曾經因為性別、學歷或背景而覺得自己不配學、不配服事的人，求主讓他知道自己在神家裡被看重；一位正在為不能生育、流產或單身而流淚的姊妹，求主親自安慰她，讓她知道她在「萬人」裡面。"],"prac":{"main":"這一週，為萬人遞一張陳情——因為神願意他們得救，而為我們站在中間的那一位，是捨了自己的。","items":["對神：每天早上用 2:1 的四個字禱告——懇求、禱告、代求、祝謝；然後讀一次 2:5，對主說：「我今天不必找門路，你已經在中間。」每晚回想：今天有沒有哪一刻，我想找一個人替我到神面前，而沒有自己開口？","對自己：這七天，每當你發現自己在心裡罵一位掌權的人、一位得罪你的人，就停下來把那一句罵改成一句禱告，記下時間和對象；週末數一數，罵的多，還是禱告的多。若你是傳道人或同工，也記下你有沒有在哪一次希望別人「先來問我」，把那一次帶到主面前。","對人：找一位從來沒有被好好教過聖經的人——一位新朋友、一位年長的長輩、一位覺得自己讀不懂的姊妹或弟兄，約定一個時間，陪他讀 2:1–7 這一段；不急著講你的看法，先問他讀到了甚麼。若你和別人曾為 2:11–15 爭吵過，這一週先為那一位禱告，再考慮怎樣和好。","對生活：檢查這一週你在網路上、在飯桌上、在群組裡談到政治與公共議題的話：是在為人禱告，還是只在評論人？選一則讓你生氣的新聞，不轉發、不留言，先為新聞裡的人禱告一次。也檢查你的衣櫃和行事曆：讓人記得你的，是你的身價，還是你作的善事（2:10）？","對使命：在小組或事工團隊裡提出一個具體安排——把「為城禱告」放進每一次聚會的開頭，為一位官長、一個社區、一個還沒有教會的地方指名禱告；並為一位還不信的家人或同事每天禱告，求那位願意萬人得救的神，也把他帶到真道裡。"]},"safe":["① 拿 2:1–2「為君王和一切在位的」禱告，在講台上替某一個當代政權、政黨或領袖背書，暗示「為他禱告就是支持他」。","保羅寫信時，掌權的沒有一位是基督徒，他要教會禱告的目的是「使我們可以敬虔、端正、平安無事地度日」（2:2），理由是神「願意萬人得救」（2:4）；為在位者禱告不等於擁護他，更不等於敬拜他，「救主」這個稱號保羅留給了神（紅線九）。","檢驗標準：你的禱告裡有沒有出現政見、政黨或對某一位領袖的讚美？一位政治立場和你相反的弟兄姊妹聽完，是被帶到神面前，還是被推到門外？","② 反過來，在講台上評價、嘲諷、咒詛某一國的現任領袖或政府，或用「為他禱告」的名義說出攻擊他的話。","2:4 說神願意萬人得救——坐在高位上的人，在神眼中也是一個需要救主的人；講台一旦變成評論台，就把會眾分成兩邊，也把禱告變成另一種表態（紅線九；議題見 ISS02_1）。","檢驗標準：你有沒有只為職分與那個人的得救禱告，而不評價他的政績？會眾走出去，是更想為掌權的人禱告，還是更想在網上罵他？","③ 把 2:2「平安無事地度日」講成「基督徒只要安分、不要惹事，面對任何不義都不可以說話」；或講成「教會禱告，就是要求政府給我們特權」。","保羅求的是一個能安靜過敬虔生活的空間，不是特權，也不是要人對一切不義閉口；為在位者禱告，與在神面前順從神、不順從人並不衝突。把這一節講成政治順從的口號，或講成爭取影響力的手段，都偏離了 2:2 的目的。","檢驗標準：你有沒有講清楚 2:2 的目的是「敬虔、端正」，不是安全感，也不是影響力？","④ 把 2:1「懇求、禱告、代求、祝謝」做成四步驟的禱告公式，說少了一步禱告就不蒙垂聽。","四個名詞都是複數，重點是「各樣的禱告，為各樣的人」——範圍與數量，不是技巧；做成公式，會叫人把禱告當作一套要交出的作業。","檢驗標準：你講完，會眾是更想為一個具體的人禱告，還是更在意自己的禱告順序對不對？","⑤ 把 2:4「他願意萬人得救」講成「反正最後人人都會得救，不必傳福音、不必悔改」；或反過來，講成「神只是嘴上說說，其實他不在乎某些人」。","本卷自己擋住了第一讀：神「是萬人的救主，更是信徒的救主」（4:10），也有人在真道上如同船破壞了；第二讀則把 2:4 的心意講冷了。保羅接著說「我為此奉派作傳道的」（2:7）——神願意，所以要有人去傳（沿用以弗所書立場二）。","檢驗標準：會眾聽完，是更想把福音帶給一個還不信的人，還是覺得傳不傳都一樣？","⑥ 用 2:5「只有一位中保」在講台上嘲笑天主教徒向馬利亞祈求，或嘲笑還在拜祖先的長輩「拜的都是假的」。","這一句是在告訴每一個人「路已經開了」，不是一根指著別人的手指；華人信徒的父母多半在拜祖先的家裡長大，經文也吩咐「當孝敬父母」（出 20:12）——孝敬是應當的，只是祖先不是我們到神面前的中保。","檢驗標準：一位家人還在拜祖先的弟兄姊妹聽完，是更想回家愛他的父母，還是更想回家和他們爭辯？","⑦ 傳道人把自己講成會眾和神中間的一層：「你要在我的遮蓋底下」「沒有經過牧師的禱告，神不會聽」；或叫會眾凡事先問屬靈長輩，再去問神。","在神和人中間只有一位中保，是降世為人的基督耶穌；彼此代禱是一同到同一位神面前的家人，不是另一層門路。傳道人一旦變成門路，就從替中保念信的人，變成了擋在門口的人。","檢驗標準：你的會眾離開你，還知道怎樣自己到神面前禱告嗎？他們更依靠你，還是更依靠那一位中保？","⑧ 先講 321 的「無己」，再拿 2:6「他捨自己」來印證；或把無己講成「你要更努力壓抑自己」的道德要求。","經文的主詞是基督：他「捨自己作萬人的贖價」——無己的源頭在他身上，不在我們的意志力；先講口號再引經文，就把經文當成 321 理念的插圖（鐵律五），也會叫會眾更佩服會捨己的人，而不是更愛那一位捨己的主。","檢驗標準：你講到 321 之前，會眾有沒有先看見那一位付上贖價的中保？","⑨ 用 2:8「我願男人……隨處禱告」說姊妹不可以在聚會中禱告；或把「舉起聖潔的手」講成姿勢比賽：手不舉、不跪就是不夠屬靈。","2:9 用「又願」接下去，同一位使徒在林前 11:5 已經假定女人在聚會中禱告；2:8 要的不是手舉多高，是「聖潔的手」和「無忿怒，無爭論」的心。","檢驗標準：你講完，弟兄們是更在意自己的手這一週作了甚麼，還是更在意姊妹能不能開口、別人的手舉得夠不夠高？","⑩ 拿 2:9–10 公開評論某位姊妹的衣著、化妝、首飾，或暗示「弟兄跌倒是姊妹穿得不得體」。","保羅列的「編髮、黃金、珍珠，和貴價的衣裳」，是當時炫富的全套，重點是「只要有善行」；經文對男人的要求在 2:8，是先管好自己的手和心。把弟兄的試探歸到姊妹身上，是把責任推錯了人，也會叫受過傷害的姊妹再受一次傷。","檢驗標準：你講這兩節時，有沒有同時對弟兄說「在教會裡，不讓外表的身價分出高低」？一位穿著樸素或打扮講究的姊妹聽完，是被看見善行，還是被打量外表？","⑪ 用 2:11–12 的任何一種讀法，貶低姊妹的價值、智力、屬靈地位或恩賜，說「姊妹天生就只適合在後面幫忙」「女人講的道比較淺」。","不論教會採互補派較嚴、較寬，還是處境派、中間讀法，四讀都同意姊妹在基督裡的地位與弟兄一樣；用這段經文看低姊妹，比讀錯一個字更離經文遠（紅線一；全卷立場見 ISS00_2）。","檢驗標準：一位在教會服事多年的姊妹聽完，是覺得被尊重地帶進經文，還是覺得自己比較次等？","⑫ 用一句「那是當時的文化，今天不適用」把 2:11–15 一筆勾銷；或反過來，不分處境與原則，把以弗所的具體指示原封不動套在今天每一個場合。","書信三問要走完：處境是以弗所有假教訓、有未受教育就被牢籠的婦女；原則是神的家要有秩序、要學真道、不可專橫地奪取權柄；今天的落點要寫出判斷理由。四讀都在認真對待經文，處境派也不是在勾銷經文（紅線一；全卷立場見 ISS00_2）。","檢驗標準：你有沒有說出你的教會採哪一讀、理由是甚麼，也說出別的讀法的理由？會眾聽完，是更認真讀經文，還是覺得這段可以跳過？","⑬ 只講 2:11–12 的「沉靜」「不許」，不講 2:11 的第一個命令是「學」。","在一個女人通常不被教的世界裡，保羅寫給全會眾聽的信，第一個對女人下的命令是「讓她學」；「沉靜」也是 2:2 先向全教會要的樣子。只講禁令不講學，就把一扇保羅打開的門講成了一道關上的門（紅線一）。","檢驗標準：你的教會裡，姊妹有沒有被有系統地教導聖經與神學？你講完，她們是更想學，還是更不敢問？","⑭ 把 2:13–14 講成被騙是姊妹的天性、姊妹的判斷不可靠，所以屬靈的事要由弟兄替她們決定。","本卷自己就不支持這種讀法：1:20 被交給撒但的許米乃、亞歷山大是男人，5:15 轉去隨從撒但的是年輕寡婦——偏離真道的有男也有女，被騙的危險不在性別，在不學、不查、只聽轉述；保羅在林後 11:3 也用夏娃提醒整個教會。","檢驗標準：你講完，會眾記住的是「每一個人都要學真道」，還是「姊妹比較需要被看管」？","⑮ 把 2:15「就必在生產上得救」講成生兒育女是姊妹得救的條件，或暗示不孕、流產、單身的姊妹在神面前比較次等。","這一節自己寫出的條件是「信心、愛心，又聖潔自守」，沒有一樣是生育；得救的根據是那捨自己作萬人贖價的中保（2:6）。寫這封信的保羅自己沒有結婚，如果生育是得救的條件，寫信的人第一個不合格。四讀並陳，講義不定於一讀（全卷立場見 ISS00_2）。","檢驗標準：一位剛經歷流產、或多年不孕、或一直單身的姊妹坐在台下，聽完是覺得自己在「萬人」裡面，還是覺得自己被排除在外？","⑯ 在講台上為 2:11–15 和別的宗派、別的教會打筆戰，定罪按立姊妹的教會，或嘲笑不按立姊妹的教會；或把這一段只講給牧者聽，當作同工會的內部規章。","2:8「無忿怒，無爭論」寫在 2:9–15 前面——為這段經文吵架，就已經違背了這段經文的第一句；這封信是在全會眾面前宣讀的，對傳道人是謙卑地陳明各家，對會眾是尊重自己的教會、也尊重別的教會的選擇。","檢驗標準：你講完，會眾是更願意和持不同讀法的弟兄姊妹一起禱告，還是更確定對方錯了？"]},{"n":3,"t":"這家就是永生神的教會，真理的柱石和根基","sub":"工、柱、奧","lv":"A","arc":"家","sec":[["3:1--7","人若想要得監督的職分，就是羨慕善工：監督的資格"],["3:8--13","作執事的，也是如此：執事的資格"],["3:14--15","在神的家中當怎樣行：真理的柱石和根基"],["3:16--16","大哉，敬虔的奧祕：神在肉身顯現"]],"serm":{"pts":[["羨慕善工","3:1--7","「人若想要得監督的職分，就是羨慕善工」——監督的資格幾乎全是品格，只有一項是能力；照管神的教會，從好好管理自己的家開始；自高自大是魔鬼落下去的那條路"],["先受試驗","3:8--13","「這等人也要先受試驗」——執事要端莊、存清潔的良心、固守真道的奧祕；按立要慢；善作執事的，自己就得到美好的地步"],["敬虔的奧祕","3:14--16","「這家就是永生神的教會，真理的柱石和根基」——全卷的目的句；柱石撐起的不是一套規條，是一個人：神在肉身顯現，被接在榮耀裡"]]},"q":"如果有一天，你要把家裡的鑰匙交給一個人，請他在你出遠門的時候照顧你年邁的母親、你還小的孩子，你會看甚麼？你大概不會先看他的學歷、口才、職位，你會想知道：他在自己家裡是甚麼樣子？他喝了酒以後是甚麼樣子？他的鄰居怎麼說他？\n保羅寫第 3 章，就是在交一把鑰匙——神的家的鑰匙。十五項條件裡，只有一項是能力，其餘全是生命。\n這一章要問兩種人：在台上的你，那把鑰匙你是當作一份要扛的工，還是一個可以坐的位？在台下的你，你在自己的家裡、自己的街上，是不是一個別人敢把鑰匙交給你的人？","truth":"神的家要由在自己家中先活出基督的人來照管：職分是善工不是地位，條件幾乎全是品格，按立要慢，因為這家就是永生神的教會，真理的柱石和根基（3:1–15）。\n柱石撐起的不是一套規條，也不是教會自己的榮耀，是一個人——神在肉身顯現，被接在榮耀裡；敬虔的源頭不是我們的努力，是他先向我們顯明了自己（3:16）。","mv":{"t":"倘若我耽延日久，你也可以知道在神的家中當怎樣行。這家就是永生神的教會，真理的柱石和根基。","r":"提前3:15"},"card":["這一章是神的家的家規，最後卻停在一首詩上。前半章列出監督與執事的條件：羨慕的是「善工」不是座位，十五項裡只有「善於教導」是能力，其餘都是在家裡、在酒桌旁、在街坊口中看得見的生命；執事要先受試驗，好好服事的人自己就得著美好的地步。後半章說出寫這些的目的：叫人知道在神的家中當怎樣行；然後保羅抬起頭來唱：「大哉，敬虔的奧祕」——這個家撐起的，是那一位在肉身顯現的主。","這一章看起來全是人要達到的條件，其實主詞一直是神。教會是「神的教會」（3:5），家是「神的家」（3:15），神是「永生神」——不是城外那座要靠柱子撐著、要靠工匠打造的像。到了 3:16，六個動詞全是被動：他被顯明、被稱義、被看見、被傳揚、被信服、被接上去，每一個動作背後都是神親自在做。對傳道人，這是安慰：家不是你撐起來的。對會眾，這是邀請：你被接進的是活神的家，不是誰的事業。","3:6 說初入教的人「恐怕他自高自大」，原文是 τυφωθεὶς（typhōtheis），字根是「煙」：被煙燻得頭昏眼花，看不清自己。驕傲不是從外面撲過來的，是從裡面冒出來的煙；被燻的人往往以為自己看得最清楚。這改變今天的讀法——對傳道人：掌聲、按立、被人稱為「師母」「牧師」那一天，正是煙最濃的時候，要開窗；對會眾：不要急著把一位剛信主、很有恩賜的人推上台，你的熱情可能正在替他點火。","這一章照出來的我，常常把兩套標準分開來用。在台上量別人，我記得十五項；回到家裡，我忘了第四項——在會眾面前溫和，在妻兒面前暴躁；在小組裡謙卑，在群組裡說讒言。另一種樣子是拿這張清單當放大鏡：對傳道人，我挑他家裡的毛病；對受過傷的弟兄姊妹，我翻他婚姻的舊帳。清單沒有錯，錯的是我只把它對準別人，從沒有對準自己。","「你也可以知道在神的家中當怎樣行。」（3:15）全章最該被記住的是「家」這個字。保羅沒有說「在神的機構裡當怎樣辦事」，他說的是一個有父親、有弟兄姊妹、有餐桌的家。翻過來，監督、執事的條件就不再是一張考核表，而是一家人彼此照顧的樣子；對傳道人，你不是這個家的主人，是被託付照管的管家；對會眾，你不是這個家的客人，是有份的家人。","這一週，挑一天晚上，問一位與你同住的家人一個問題：「這一個月，我在家裡哪一件事讓你最累？」只聽，不辯解，把答案寫下來，選一件在七天之內改。對傳道人或同工：在週間挑一件沒有人會看見的小服事——收椅子、洗杯子、探望一位很久沒來的人——安靜地做完。對會眾：為你教會的一位執事或同工寫一張卡片，具體謝謝他做過的一件小事。","最終整合：以弗所，城外的山坡上，亞底米的大廟在夕陽裡發亮。\n一百多根大理石柱，一根比一根高；朝聖的人從亞細亞各地湧來，銀匠的作坊一直開到天黑。幾年前，這城裡的人曾經喊了兩個小時：「大哉，以弗所人的亞底米啊！」（徒 19:28）\n城裡另一頭，一間普通的屋子，晚上。\n沒有柱子，沒有神像，只有一張長桌，幾盞油燈。有人從作坊下工趕來，手上還沾著銀屑；有一位姊妹剛從一戶病人家裡回來，腰間還繫著圍裙；有一位頭髮花白的弟兄，安靜地把最後一張板凳搬好。\n提摩太打開保羅的信，讀到監督的條件，屋裡有幾個人低下頭；讀到「先受試驗」，有人輕輕點頭。\n然後他讀到這一句：「這家就是永生神的教會，真理的柱石和根基」（3:15）。\n屋裡的人看看彼此——搬板凳的、繫圍裙的、手上有銀屑的。原來柱子是我們。\n可是信還沒有讀完。提摩太停了一下，聲音變了，像是在唱：\n「大哉，敬虔的奧祕，無人不以為然！就是神在肉身顯現，被聖靈稱義，被天使看見，被傳於外邦，被世人信服，被接在榮耀裡」（3:16）。\n城外那座廟，要靠一百根柱子撐住一尊像；這間屋子裡的人，卻是被一位活著的主撐住的。\n柱子不製造屋頂，柱子只是把他高高舉起來，好叫遠處的人看得見。\n如果你今夜覺得自己不夠格——想起 3:2，想起家裡的難處，想起從前——請記得，寫這封信的人，是一個自稱罪魁的人。\n然後抬起頭來，和這一家人一起唱完那六行。"],"self":"這一章照出來的「有己」，第一個樣子是想坐位子：我說我羨慕服事，其實羨慕的是被看見、被稱呼、被請上台；τυφωθεὶς（typhōtheis）的煙，最先燻的是我自己的眼睛，我以為自己看得最清楚。\n第二個樣子是拿清單審人：把十五項條件對準牧者、對準別人的家、對準某位弟兄姊妹的婚姻史，卻從不問自己在家裡、在酒桌旁、在鄰居眼中是甚麼樣子。兩種樣子的中心都是我——一個想被高舉，一個想當裁判；而這一章要高舉的，只有那一位在肉身顯現的主。","t321":{"k":"耶穌是我的榜樣：3:16 唱的那一位，正是這張清單最完整的樣子。他「在肉身顯現」，在拿撒勒的木匠家裡住了三十年，才走出去公開服事——先受試驗，不是初入教的人急著上台。他說「人子來，並不是要受人的服事，乃是要服事人」（可 10:45），在最後的晚餐束上手巾，說「我給你們作了榜樣，叫你們照著我向你們所做的去做」（約 13:15）。他溫和、不爭競，被罵不還口；他有能力，卻從不用能力換座位。學他，是先在沒人看見的家裡、桌邊、腳盆旁邊，活出一個別人敢把鑰匙交給你的生命。","g":"讓耶穌作王：這一章要人讓出來的位置，是「這個家的主人」。對傳道人，3:5 說你照管的是「神的教會」，不是你的教會；你是被託付的管家，不是開山的老闆。對會眾，3:15 說這是「神的家」，不是某個家族、某位創辦人、某個委員會的家；你不能因為奉獻多、資歷久，就替神決定誰可以服事。讓耶穌作王，也包括讓出「裁判」的位置：審判人過去的權柄在他手上，他在 1:13–15 已經親手用了一個過去最不合格的人。可以自己檢查：這一週我在教會裡為一件事據理力爭時，我在爭的是神的家的好處，還是我在這個家裡的位置？","p":"建立屬神的體系：經文自己先說得很清楚——品格先於恩賜，生命先於事工，資格從家開始，按立要慢；這正是 321「先生命，再關係，後事工」最直接的經文依據。所以這一群人的建造，第一層不是組織圖，是一群在自己家中先活出基督的人。具體地說：同工的揀選先看生命與關係，再看恩賜與能力；新的服事者先在小事上服事一段時間，有人陪伴、有人觀察，不在缺人時抓到誰就是誰；教會真心尊重一生作執事、從沒站上講台的人，不把服事變成往上爬的梯子。但要留意：3:1–13 的監督與執事是地方教會的職分，不是 321 五重職份的插圖，也不是發放頭銜的根據；321 只在末端接上——這個家，是為了高舉 3:16 那一位而建的。"},"grp":["【一、破冰】說一位你小時候覺得「把事交給他最放心」的人——可能是一位鄰居、老師、親戚或教會的長輩。他做了甚麼，讓你這樣信任他？那件事是能力，還是品格？","【二、扎心】經文說：「人若不知道管理自己的家，焉能照管神的教會呢？」（3:5）不論你是否有職分，說出一件你在外面做得到、回到家裡卻做不到的事——在外面溫和、在家裡暴躁，在小組裡耐心、在孩子面前沒有耐心。最近一次是甚麼時候、在家裡的哪一個角落？","【三、福音】寫這張清單的人，在第 1 章說自己是「罪魁」，又說「我還蒙了憐憫」（1:13）。說出一件你覺得讓自己「不夠格」服事神的事（可以只說類別，不必說細節）。如果神曾經揀選一個逼迫教會的人來寫這封信，你今天站在恩典的哪一邊？","【四、行動】說出這一週你要為神的家做的一件「沒有人看見的善工」：在哪一天、哪一個地方、為哪一個人（聚會後留下來收拾、去探望一位很久沒來的人、為一位執事或同工煮一頓飯）。也說出你家裡的一位成員，你這一週要怎樣具體地「好好管理」——是多聽他十分鐘，還是少說一句重話？","【五、代禱】為三種人指名禱告：一位在教會裡默默服事多年、很少被感謝的執事或同工，求主讓他得著「美好的地步」；一位因為婚姻、家庭或兒女的光景，覺得自己在教會裡抬不起頭的弟兄姊妹，求主讓他知道自己是神家裡的人；一位剛信主不久、很有熱心的人，求主讓他的根扎得比枝葉更快。"],"prac":{"main":"這一週，在自己的家裡先活出神的家——因為柱石撐起的，是那一位在肉身顯現的主。","items":["對神：每天早上慢慢讀一遍 3:16 的六行詩，每天停在其中一行，用它向主說一句感謝；第七天把六行連起來唱或念出來，然後求他：「主啊，今天在我的肉身裡，也讓人看見你。」","對自己：用 3:2–3 當作一面鏡子，不是一把尺——每晚選其中一項（有節制、自守、溫和、不爭競、不貪財），誠實記下今天在哪一刻做得到、在哪一刻做不到；週末把這張單子帶到主面前，只認自己的，不替任何人填。","對人：在家裡問一位家人：「這個月我哪一件事讓你最累？」只聽不辯，選一件改；在教會裡為一位執事、同工或司事寫一張卡片，具體謝謝他做過的一件小事。若你知道某位弟兄姊妹正因婚姻或兒女的難處而退縮，這一週約他喝一杯茶，只陪伴，不打聽。","對生活：檢查你在「教外」的名聲（3:7）——這一週在公司、社區、網路上，有沒有一句話、一筆帳、一次失約，會讓旁人對你的信仰搖頭？找出一件，具體補上。聚會、聚餐的時候，若有人正在戒酒，主動為他留一個不尷尬的位子。","對使命：在你的小組或事工團隊裡，提出一個具體安排——讓新來的服事者先有一位同伴陪他服事三個月，而不是一來就把擔子交給他；並為一位還在「教外」的鄰居或同事每天指名禱告，求主讓他從你們這群人的生命裡，看見那一位被傳於外邦、被世人信服的主。"]},"safe":["① 用 3:2「只作一個婦人的丈夫」把離婚、再婚的弟兄姊妹講成「不合格的例子」，或暗示他們在神的家裡永遠矮一截。","3:2 有四種讀法，本講義以「一個對妻子專一忠誠的人」為主軸——清單上其餘各項都是現在的品格，不是過去的履歷；而寫這張清單的人在 1:13–15 才說過，神用了一個過去最不合格的人。有些人的婚姻破裂是被背叛、被遺棄，講台不可再給他們加一道傷（紅線二；全卷立場見 ISS00_3）。","檢驗標準：你有沒有並陳四讀、並講到 1:13–16？一位離婚或再婚的弟兄姊妹聽完，是更敢回到神的家，還是更想坐到最後一排、散會就走？","② 在講台上舉某位同工、某位會友，甚至某位知名牧者的婚姻史作例子，或逐條「審查」任何一位在職的監督、執事。","不在講台討論任何個人的婚姻史，是本卷的牧養底線；教會若在按立上有自己的規定，要照著程序、私下、溫柔地處理。在會眾面前點名，等於把 3:2 從品格的鏡子變成公開的刑台。","檢驗標準：你講稿裡有沒有任何一個人，被聽眾認得出來？如果那人就坐在台下，你還敢照稿講嗎？","③ 把 3:2 講成「監督一定要結婚」，或暗示單身、喪偶再婚的人比較不屬靈、不成熟、不適合服事。","片語預設的是一般的已婚男子，卻不是要求監督必須結婚——否則單身的保羅連自己定的條件都不合；保羅在同一封信裡也說「我願意年輕的寡婦嫁人」（5:14），可見再婚本身不是虧欠。拿婚姻狀態排序屬靈的高低，就越過了經文（紅線二）。","檢驗標準：一位單身多年、或喪偶後再婚的弟兄姊妹聽完，是覺得自己在神的家裡被看重，還是覺得自己「還差一步」？","④ 用 3:4–5「使兒女凡事端莊順服」責怪兒女尚未信主、或正在叛逆的父母：「你家都管不好，還服事甚麼？」","本講義採「兒女年幼時的家中秩序」一讀；成年兒女不信主，不自動使父親失去資格——「兒子必不擔當父親的罪孽」（結 18:20），信仰不能由父母代替決定。許多忠心的父母，兒女仍然走了遠路；那是他們的眼淚，不是他們的罪狀。","檢驗標準：一位正在為成年兒女流淚禱告的母親聽完，是更想繼續禱告，還是更想辭掉服事、躲起來？","⑤ 用 3:3「不因酒滋事」、3:8「不好喝酒」把飲酒本身定為罪，或把滴酒不沾當成屬靈的資格、按立的門檻。","πάροινον（paroinon）是「賴在酒旁邊」、因酒失態鬧事，3:8 也特別說「許多的酒」，重點是節制與失控；同一封信還勸提摩太「可以稍微用點酒」（5:23）。把文化或教會的守則講成聖經的命令，會讓人用一杯酒論斷弟兄（紅線八）。","檢驗標準：你有沒有說清楚 3:3 擋的是「醉與失控」？一位有不同習慣的弟兄姊妹聽完，是被提醒節制，還是被定罪？","⑥ 反過來，用 5:23「可以稍微用點酒」或「聖經沒有禁酒」替飲酒說好話，卻忘了在場正在戒酒、或家庭曾被酒毀掉的人。","5:23 的處境是「胃口不清，屢次患病」（5:23），是藥用，不是鼓勵；保羅也說「叫弟兄跌倒，一概不做才好」（羅 14:21）。節制包括為軟弱的人甘心不用自己的自由；一句輕鬆的玩笑，可能就是某人重新拿起酒杯的那一刻（紅線八）。","檢驗標準：一位正在戒酒的弟兄，或一位從小看著父親醉酒打人的姊妹聽完，是覺得被保護，還是覺得被忽略？","⑦ 用 3:11 貶低女性的服事——把女執事講成「端茶倒水的陪襯」，或說姊妹只能當執事的太太、不必談品格與恩賜。","不論讀成「女執事」或「執事的妻子」，3:11 的四項條件都和 3:8 逐條平行：保羅沒有為姊妹另定一套比較低、或比較苛的標準；非比被保羅稱為「堅革哩教會中的女執事」（羅 16:1），很可能就是她把羅馬書送到羅馬（紅線一；全卷立場見 ISS00_2）。","檢驗標準：一位在教會服事多年的姊妹聽完，是覺得被尊重地帶進經文，還是覺得自己的服事又被輕看了一次？","⑧ 在 3:11 替會眾作終審判決：「這一節就是女執事，反對的都是守舊」，或「這一節就是執事的妻子，主張女執事的都是跟從世俗」。","和合本正文作「女執事」，又誠實地加註「原文是女人」；兩讀都有真誠的理由。本講義兩讀並陳、不作裁判，只指出經文本身清楚的兩件事：這一節夾在執事的條件中間，而且監督的條件裡沒有相應的一節提到監督的妻子（全卷立場見 ISS00_2）。","檢驗標準：你講完，會眾是更清楚兩讀各自的理由與難處，還是更確定對方那一派的人錯了？","⑨ 把 3:1–13 的監督、執事講成 321「五重職份」的插圖，或用這幾節替教會發放「使徒」「先知」之類的頭銜。","監督、執事是地方教會照管與服事的職分，經文的重點是品格與家；先讓經文自己說完，321 才在末端接上。把職分講成頭銜，正好走回 3:1 要校正的那條路——把「善工」當成「地位」（鐵律五）。","檢驗標準：你講到 321 之前，會眾有沒有先聽見十五項裡十四項是生命？你有沒有用「就是」「正是」把監督、執事和五重職份接在一起？","⑩ 把職分講成往上爬的梯子：執事是「升長老之前的實習」，3:13「美好的地步」就是升遷的台階。","3:1 說羨慕的是「善工」，不是座位；βαθμὸν（bathmon）讀成升官的台階，與「善工」的精神不合——本講義採在人面前得尊重、在神面前得坦然的讀法。把服事講成梯子，會讓一生作執事的人覺得自己沒有出息。","檢驗標準：一位作了三十年執事、從沒站上講台的弟兄聽完，是覺得自己的服事在神面前已經是美好的，還是覺得自己被留級了？","⑪ 用 3:6「初入教的不可作監督」輕看年輕人或新信徒；或反過來，因為缺人、因為對方有恩賜，就急著把剛信主的人按立上台。","問題不在年紀，在根的深淺——同一封信也說「不可叫人小看你年輕」（4:12），又說「給人行按手的禮，不可急促」（5:22）。τυφωθεὶς（typhōtheis）是被煙燻昏：上去得太快的人，最容易被掌聲的煙燻瞎，跌倒時把整個家的名聲一起拖下去。","檢驗標準：你有沒有同時講到 3:6 與 4:12？一位熱心的新信徒聽完，是更願意先扎根，還是覺得自己被排除在服事之外？","⑫ 把 3:15「真理的柱石和根基」講成「教會在聖經之上」「我們教會說的就是真理，不必再查考」，或用它要求會眾不可質疑任何領袖。","柱子不製造屋頂，底座也不發明房子；真理是神的道——「你的道就是真理」（約 17:17）——教會是被託付來高舉它、守住它的。庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），連使徒的話都要對照經文。把傳統放在神的話之上，就成了另一座亞底米廟。","檢驗標準：會眾聽完，是更想打開聖經查考，還是更覺得只要聽教會的就好？","⑬ 在 3:16 的異文上製造恐慌：「新譯本把『神』拿掉了，是要否認基督的神性」；或反過來說「基督是神，主要就靠這一節」。","SBLGNT 作 Ὃς（那一位），和合本「神在肉身顯現」照 θεὸς 翻譯，兩種讀法說的都是同一位基督；「那一位在肉身顯現」本身就預設他先前已經存在。基督的神性也不靠這一節成立——「道就是神」（約 1:1），「神本性一切的豐盛都有形有體地居住在基督裡面」（西 2:9）。","檢驗標準：會眾聽完，是更確信那一位是誰，還是開始懷疑自己手上的聖經、或懷疑用別的譯本的弟兄姊妹？","⑭ 把第 3 章講成一份職分手冊，講完 3:13 就散會，跳過 3:16；或只在最後念一下頌讚，當作結束禱告前的過場。","保羅講完家規，忽然停下來唱歌——柱石撐起的不是一套規條，是一個人。不停在 3:16，整章就成了考核表；會眾記得的是條件，忘了那位使條件有意義的主，走出去只會更佩服合格的人，而不是更愛那一位被接在榮耀裡的主。","檢驗標準：你的講章與卡片有沒有至少一處在 3:16 停下來？會眾走出去，最後記得的是十五項條件，還是那六行詩唱的那一位？","⑮ 用處境取消原則：「那是一世紀以弗所的教會組織，今天不適用」；或把處境硬搬：「經文寫監督、執事，所以今天的教會只能有這兩種職稱。」","書信三問要走完：處境是以弗所教會被自己的領袖傷過（徒 20:30），有人爭位、有人灰心；原則是神的家要由品格可信、在家中先活出基督的人來照管；今天的落點是各教會怎樣揀選、試驗、按立同工——體制可以不同，原則不可以丟（全卷立場見 ISS00_1、ISS00_3）。","檢驗標準：你有沒有把「處境—原則—今天」三步都講出來？會眾聽完，是更清楚自己教會該守住甚麼，還是只學會說「那是當時的事」？","⑯ 把第 3 章只講給台上的人聽，讓會眾覺得「這是長老執事的事，與我無關」；或讓會眾拿著這張清單回家審判自己的牧者。","這是一封寫給提摩太、卻要在全會眾面前宣讀的信；3:15「當怎樣行」的對象是神家裡的每一個人。對傳道人，這是一面照自己的鏡子；對會眾，這也是自己在家中、在街上的樣子——不是一把用來量別人的尺。","檢驗標準：你的應用有沒有同時對傳道人、也對會眾說話？一位沒有任何職分的姊妹聽完，知道她這一週在家裡要怎樣活嗎？"]},{"n":4,"t":"在敬虔上操練自己","sub":"感、練、樣","lv":"A","arc":"守","sec":[["4:1--5","凡神所造的物都是好的：後來的時候與感謝著領受"],["4:6--10","在敬虔上操練自己：今生和來生的應許"],["4:11--16","都作信徒的榜樣：謹慎自己和自己的教訓"]],"serm":{"pts":[["感謝著領受","4:1--5","「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的」——假教訓禁止嫁娶、禁戒食物，把禁戒當成屬靈；神造的世界要感謝著領受"],["操練敬虔","4:6--10","「在敬虔上操練自己」——敬虔不是氣質，是在體育場裡天天練出來的；操練身體益處還少，敬虔凡事都有益處，因為我們的指望在乎永生的神"],["作信徒的榜樣","4:11--16","「不可叫人小看你年輕」——不是靠頭銜，是在言語、行為、愛心、信心、清潔上留下印子；謹慎自己和自己的教訓，又能救自己，又能救聽你的人"]]},"q":"你的信仰生活裡，有沒有一張沒有寫出來的禁止清單？不可以這樣吃、不可以那樣穿、不可以去那種地方——守得越多，好像越屬靈；可是守著守著，餐桌上的感謝不見了，只剩下戰戰兢兢。\n另一面，你也許很會操練身體：步數、體重、睡眠都有數字；可是要你說出這一週在哪裡操練過敬虔，你答不出來。\n你也可能是一位年輕的服事者，或坐在一位年輕傳道人底下的會友。這一章要問：一個人被看重，是靠年紀和頭銜，還是靠他在別人身上留下的那個印子？","truth":"神所造的一切都是好的，要感謝著領受；把禁戒當成屬靈的條件，是在恩典上加了一條鬼魔的禁令。\n敬虔不是氣質，是在永生神面前天天練出來的；一個人看守好自己，就在言語、行為、愛心、信心、清潔上，成了別人可以照著走的模子。","mv":{"t":"不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。","r":"提前4:12"},"card":["這一章是全卷的轉身：3:16 唱完敬虔的奧祕，4:1 一轉，就看見有人站開了。保羅先拆掉一張假的敬虔——禁止嫁娶、禁戒食物，把神的禮物當成陷阱；再立起一張真的敬虔——在敬虔上操練自己，因為指望在乎永生的神；最後把這敬虔落在一個年輕人身上：作信徒的榜樣，謹慎自己和自己的教訓。對傳道人，這是一份工作守則；對會眾，這是一面照見自己怎樣過日子的鏡子。","這一章的主詞常常是神。聖靈「明說」，先把警告說在前頭；神「所造」的食物與婚姻，原是要人感謝著領受；神的道宣告受造之物是好的，使一張餐桌成為聖潔；神是「永生的神」，所以操練有指望；他是萬人的救主，救恩的門向每一個人敞開；恩賜是他「賜給」提摩太的，眾長老只是一同按手確認。人在這一章的每一個動作——感謝、操練、作榜樣、謹慎——都接在神先說、先造、先救、先賜的後面。","4:12「榜樣」原文 τύπος（typos），字根是「打、壓」：印章壓在蠟上，模子壓在泥上，留下的那個形狀。保羅沒有叫提摩太「要求別人尊重你」，而是叫他「成為模子」。這改變今天的讀法：榜樣不是站在台上給人看的一張海報，是一次一次壓在別人生命上的印子——傳道人怎樣說話、怎樣對待人，會眾就照著長；父母怎樣在壓力下回應，兒女就照著長。問題從來不是我有沒有在別人身上留下印子，而是留下的是甚麼形狀。","這一章照出來的我，常常把敬虔換成了禁止：我守的規矩越多，越容易看不起不守的人，好像屬靈是靠「不做甚麼」量出來的。另一面，我很會為身體早起，卻很難為禱告早起；我能說出這個月跑了幾公里，說不出這個月在哪一件事上練過饒恕。若我是服事的人，我也常倒過來：花很多力氣檢查別人的教訓，很少檢查自己的生命——我要人尊重我的位子，卻不先讓人看見我的樣子。","「你要謹慎自己和自己的教訓」（4:16）。全章最大的翻轉在這個次序：先「自己」，再「教訓」。我們以為最重要的是講得對；保羅說，講的人先要站得住。教訓的偏差常常從生命的偏差開始，被烙慣的良心（4:2）不是一天形成的。對傳道人，這一句是每週預備講章以前的第一個功課；對會眾，這一句是每一位帶小組、帶兒女的人每天出門前的一面鏡子：先看守自己，就是保護聽你的人。","這一週做一件事：每一餐飯前，停十秒，用自己的話說出一樣這一餐裡你要感謝的東西——不是背一句固定的禱詞，是說出那碗湯是誰煮的、那份工資是怎樣來的。再選一個你最常在人前出現的場合——公司的會議、家裡的晚餐、小組的群組——在那裡只操練一個範圍：言語。這七天，在那個場合說出口的每一句話，都問自己：這句話留下的是甚麼印子？","最終整合：以弗所，一間家庭教會，清晨。\n一封從遠方來的信，交到一個年輕人手上。他三十多歲，屋裡坐著的長老，有幾位的頭髮已經全白了。\n他站起來，照著信上說的，先宣讀聖經。聲音有一點抖。\n念到「不可叫人小看你年輕」，他停了一下，沒有抬頭。\n接著念：「總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。」\n屋裡沒有人說話。\n坐在第一排的老長老想起來：上個月他病倒，是這個年輕人每天來替他讀經；\n角落那位寡婦想起來：她的孩子跟他學會了飯前感謝；\n那位做皮革生意的弟兄想起來：有人在市場上罵他，他沒有罵回去。\n原來印子早就壓下去了，比這封信先到。\n散會的時候，老長老走過來，伸手替他把外袍拉正，\n像那一年，眾長老把手放在他頭上的時候一樣。\n桌上擺著餅和魚，有人開口感謝；\n沒有一樣是可棄的。\n那一位萬人的救主，永遠活著，\n他才是真正的模子——\n一個年輕人在別人身上留下的每一個印子，都是先從他那裡壓下來的。"],"self":"這一章照出來的「有己」，第一個樣子是用禁止來量屬靈：我守得比別人嚴，就覺得自己比別人近神；我不敢享受神給的好東西，也不讓別人享受，好像越窮、越苦、越不吃，越能證明自己。那其實是在神的恩典上，加了一條我自己的功勞。\n第二個樣子是要位子不要樣子：被人小看就受傷，急著用頭銜、資歷、口才讓人服氣；檢查別人的教訓很勤，看守自己的生命很懶。或者反過來，我是會眾，只看傳道人的年紀與口才打分數，卻從不問自己在家人、同事身上留下了甚麼印子。","t321":{"k":"耶穌是我的榜樣：耶穌自己就是感謝著領受的那一位。他拿起五個餅、兩條魚，「望著天祝福」，也與稅吏、罪人一同坐席，被人說成貪食好酒；他禁食四十晝夜，卻從不把禁食立成門徒的條件。他年輕——三十歲出來傳道，在會堂裡被人說「這不是木匠的兒子嗎？」——卻沒有拿頭銜壓人，而是在言語上滿有恩典，在行為上走遍各處行善，在愛心上為仇敵禱告，在信心上把自己交給父，在清潔上一生沒有罪。他先謹慎自己，到十字架上也沒有離開父的話；所以他是萬人的救主，也是一切榜樣的模子。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是「立規條的人」的位置：在神所造、神說好的東西上，我不再替神加一條禁止，也不拿自己的禁戒去量別人；自願的禁食、吃素、獨身，是獻給主的，不是拿來管人的。第二個是「要人尊重我」的位置：年輕的不靠頭銜贏得尊重，年長的不靠資歷壓住年輕人；傳道人讓神的話先被宣讀（4:13），自己退到話語後面。可以自己檢查：這一週，我在哪一件事上，還在替神立規矩，或還在替自己爭位子？","p":"建立屬神的體系：經文先說完它自己的話——操練敬虔，作信徒的榜樣，謹慎自己和教訓——321 才在末端接上。4:12 五個範圍都在別人眼前發生，這正是「920」的原型：每一個與我有關係的人是我的「2」，我在他面前學習無己的「0」，聖靈結出「9」；操練不是一個人關起門的修行，是在關係裡天天上場。一個屬神的體系不是一份禁止清單，而是一群互相作模子的人：年長的扶持年輕的，年輕的在五個範圍上留下印子，眾長老一同按手、一同代禱。量這個體系的尺在 4:16：聽的人有沒有一同站穩？"},"grp":["【一、破冰】你有沒有一個從小到大一直保持的運動、樂器或手藝？說一說你是怎樣練起來的，最想放棄的是哪一個階段？是誰陪你撐過去的？","【二、扎心】「這等人的良心如同被熱鐵烙慣了一般。」（4:2）說一件具體的事：有沒有一件事，你第一次做的時候良心很不安，後來做多了就不痛了？那是從哪一年、在哪一個場合開始的？今天想起來，它在你裡面留下了甚麼？","【三、福音】「因我們的指望在乎永生的神；他是萬人的救主，更是信徒的救主。」（4:10）說一個時刻：哪一年、在哪裡，你發現神接納你，不是因為你守了多少規矩，而是因為他是救主？那份接納後來怎樣改變了你看待自己的禁止清單？","【四、行動】從言語、行為、愛心、信心、清潔五個範圍裡，挑一個你這一週要操練的，說出一個具體的場合（哪一天、在哪裡、對著誰）和一個具體的動作；若你是帶領者或父母，說出你這一週要在誰身上留下一個好印子，以及你要怎樣做。","【五、代禱】為三種人指名禱告：一位年輕的傳道人或小組長，求主叫他在五個範圍上站穩，也求教會給他成長的空間；一位因為守不住某些規矩、覺得自己不夠屬靈而遠離教會的人，求主讓他重新聽見恩典；一位正在服事卻已經疲憊、很久沒有看守自己的人，求主讓他停下來，先被主餵養。"],"prac":{"main":"這一週，在餐桌上感謝，在一個範圍上操練，先看守自己，再看守教訓。","items":["對神：每天早上慢慢讀一次 4:7–10，用一句話告訴主：「我的指望在乎你，永生的神。」每一餐飯前，用自己的話說出一樣具體要感謝的東西，承認它是你所造、你所賜的。","對自己：寫下你心裡那張沒有寫出來的禁止清單，逐條問：這一條是我獻給主的自願，還是我拿來證明自己、量別人的條件？再寫下這一週你給身體的時間與給禱告讀經的時間，誠實地比一比，調整一件事。","對人：選一位比你年輕、正在學著服事的人——新來的小組長、兒童主日學的老師、剛畢業的同事——這一週當面對他說一句具體的肯定，或請他吃一頓飯、聽他說話；若你自己是年輕的，去向一位長輩請教一件事，以尊重代替辯解。","對生活：在你最常說話的一個場合（家裡晚餐、公司群組、社群媒體）操練「言語」這個範圍七天：不發一句帶刺的話、不轉一則未經查證的消息，每天睡前回想一次今天說出口的話留下了甚麼印子。","對使命：在你的小組或服事團隊裡，留意聚會的次序：這一週讓神的話先被宣讀出來，由一位平常不太開口的組員朗讀一段經文；並為團隊裡一位年輕的同工具體代禱，也問他：「我可以怎樣扶持你？」"]},"safe":["① 用 4:3「禁止嫁娶，又禁戒食物」批評基督徒自願的吃素、禁食或獨身：「吃素的人中了鬼魔的道理」「禁食是律法主義」「不結婚就是不順服神」。","4:3 的關鍵字是「禁止」——把禁戒立成得救或屬靈的條件；保羅自己獨身，初期教會禁食禱告（徒 13:3），羅 14:3 叫吃的與不吃的彼此不論斷。自願是獻給主的自由，強加才是捆綁（紅線六；全卷立場見 ISS00_8）。","檢驗標準：一位為健康吃素、為禱告禁食或甘心單身服事的弟兄姊妹聽完，是被尊重，還是覺得自己被這一節點名？","② 拿 4:1--5 嘲笑佛教、道教或任何宗教的素食與齋戒，在講台上把別人的齋戒當笑料，或用「鬼魔的道理」去標籤別的宗教。","4:3 處理的是教會裡面有人在福音上加禁令，不是對其他宗教的飲食習慣下判語；嘲笑別人的誠意，只會關上福音的門，也違背 2:4 神願意萬人得救的心（紅線六）。","檢驗標準：若一位來自佛教家庭、家人每月初一十五吃素的慕道朋友坐在台下，他聽完是覺得被羞辱，還是第一次聽懂了感恩領受的福音？","③ 反過來，把 4:4「凡神所造的物都是好的」講成「基督徒甚麼都可以，暴飲暴食、放縱也沒關係」。","同一節有條件：「若感謝著領受」；感謝把受造之物交還創造主，也讓人懂得節制。林前 8 章的原則同樣適用：食物本身不叫神看中我們，愛心卻會為軟弱的弟兄調整自己。","檢驗標準：會眾聽完，是更放縱，還是更懂得在餐桌上感謝、也更懂得為別人節制？","④ 把 4:5「都因神的道和人的祈求成為聖潔了」講成飯前禱告是一種消毒或護身的儀式：「不禱告就吃，會吃出問題」「禱告過就甚麼都能吃」。","ἁγιάζεται 是分別為聖：神的話宣告它是好的，人的感謝承認它是從神來的，一頓飯就成了敬拜；這不是魔法，也不是恐懼的保險（議題見 ISS04_3）。","檢驗標準：會眾聽完，飯前禱告是更像一句咒語，還是更像一次真心的感謝？","⑤ 拿 4:1「在後來的時候」對照新聞算日子：「現在就是末後，某某事件應驗了這一節」「還剩幾年」。","καιρός 是時期，不是日曆上的一天；新約把基督兩次降臨之間都稱為末後（來 1:2），4:6 立刻要提摩太把這些事提醒當時的弟兄。算日子只會帶來恐慌，不帶來警醒（鐵律四、六）。","檢驗標準：會眾聽完，是更怕世界、更想猜日期，還是更警醒地保護自己良心的柔軟？","⑥ 把 4:7「在敬虔上操練自己」講成 321 的插圖：把它當作操練 920 的經文證明，先講 920 的口訣，再拿這一節來印證。","4:7 操練的對象是「敬虔」，方向是 3:16 那位在肉身顯現的基督；先讓經文說完棄絕荒渺的話、天天上體育場，321 的操練才在末端當作一個工具接上（鐵律五）。","檢驗標準：會眾聽完，記住的是一套操練的口訣，還是那位使人能夠敬虔的基督？","⑦ 把「操練敬虔」講成靠自己的努力爬上神那裡：「你操練得不夠，神就不喜悅你」「每天沒有靈修一小時就不是好基督徒」。","運動員練習，是因為他已經是隊上的一員；信徒操練，是因為他已經屬於基督。指望在乎永生的神（4:10），不在自己的紀錄表；把操練變成新的律法，正是 4:3 那一條禁止換了一件衣服。","檢驗標準：一位這個月幾乎沒有讀經、很自責的人聽完，是想放棄，還是想明天早上再回到主面前？","⑧ 用 4:8「操練身體，益處還少」叫人不必運動、不必照顧健康，或嘲笑上健身房的人「屬肉體」。","保羅說「少」，不是「沒有」；4:4 才說神所造的都是好的，身體也是。反過來，也不可把健身、養生講成另一種信仰（議題見 ISS04_4）。","檢驗標準：一位正在復健、或剛開始規律運動的人聽完，是覺得被否定，還是更清楚身體與敬虔的先後？","⑨ 用 4:8「凡事都有益處」講成成功神學：「敬虔就會發財、升遷、萬事順利」。","敬虔的益處是「今生和來生的應許」——今生有神同在，來生有永生；6:5 正是責備「以敬虔為得利的門路」的人。把應許換成財富，會讓正在受苦的敬虔人懷疑自己（全卷立場見 ISS00_5）。","檢驗標準：一位很敬虔卻剛失業的弟兄聽完，是懷疑自己不夠敬虔，還是更確定他的指望在乎永生的神？","⑩ 把 4:10「他是萬人的救主」講成普救論：「所有人最後都會得救，信不信沒有差別」；或反過來，把「萬人」縮成「萬種人」，好像神並不真心看顧每一個人。","同一卷書說神「願意萬人得救」（2:4），也說有人「離棄真道」（4:1）、沉在滅亡中（6:9）；「更是信徒的救主」說出救恩要藉著信落實。門向萬人敞開，人仍要進來（議題見 ISS04_5）。","檢驗標準：會眾聽完，是更不急著傳福音，還是既更有勇氣（門向每一個人敞開）、也更迫切（人仍要進來）？","⑪ 用 4:12「不可叫人小看你年輕」替年輕領袖的驕傲開門：「誰質疑我，就是小看我」，或拿這一節壓住長輩的提醒。","保羅給提摩太的方法不是要求尊重，是「作榜樣」；5:1 立刻教他「不可嚴責老年人，只要勸他如同父親」。這一節要年輕人用生命說話，不是用經文封口。","檢驗標準：一位年輕同工聽完，是更想爭辯自己的權柄，還是更願意在五個範圍上讓人看見？","⑫ 只對講台上的人講 4:12--16，或反過來用這一段要求傳道人完美無缺：「牧師不能有一點軟弱」。","這封信是在全會眾面前宣讀的：五個範圍是每一位父母、小組長、同事都在別人眼前活的；4:15 要的是「長進」，不是完美——會眾也有責任給年輕的傳道人成長的空間。","檢驗標準：你有沒有同時對傳道人和會眾說話？會眾聽完，是只會替牧者打分數，還是也看見自己在別人身上留下的印子？","⑬ 把 4:14「眾長老按手」講成能力的傳輸或屬靈遮蓋：「被某某人按手，就得到他的恩膏」「沒有被按手的服事不算數」。","恩賜是神賜的，預言指明，長老們的按手是教會在神面前公開的確認、交託與代禱；把按手變成權力的來源，正是 3:6 自高自大的入口（全卷立場見 ISS00_3）。","檢驗標準：會眾聽完，是更想找名人按手，還是更清楚恩賜從神來、也更願意為被差派的人持續代禱？","⑭ 把 4:16「又能救自己，又能救聽你的人」講成傳道人是別人的救主：「跟著我才能得救」。","救恩只屬於「萬人的救主」（4:10）；這裡的「救」是在真道上持守到底，使自己和聽眾不被 4:1 的引誘拖走。傳道人有真實的責任，卻沒有救主的位子。","檢驗標準：會眾聽完，是更依賴某一位傳道人，還是更清楚自己和講員都要一同站在真道上？","⑮ 用處境取消原則：「禁戒食物是以弗所的特殊問題，與今天無關」「提摩太年輕是他個人的處境」；或反過來，把 4:13 的宣讀、勸勉、教導當成每週聚會不可更動的程序表。","書信三問的第三問要走完：原則是神所造的都要感謝著領受，敬虔要天天操練，領袖要用生命作模子、先看守自己；處境是以弗所教會裡加禁令的假教師與一位年輕的同工。今天它落在我們的教會規條、餐桌、同工培育裡——判斷的理由要說出來（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，這一章的原則今天在你的教會落在哪裡，並且說出判斷的理由？"]},{"n":5,"t":"勸他如同父親；勸少年人如同弟兄","sub":"家、寡、老","lv":"A","arc":"守","sec":[["5:1--2","只要勸他如同父親：神家裡的稱呼"],["5:3--8","要尊敬那真為寡婦的：家人先學著行孝"],["5:9--16","寡婦記在冊子上：年老與年輕的寡婦"],["5:17--21","當以為配受加倍的敬奉：長老的供應與控告"],["5:22--25","給人行按手的禮，不可急促：按手、清潔與用點酒"]],"serm":{"pts":[["如同家人","5:1--2","「勸他如同父親」——教會所有的規矩，都從家人的稱呼開始；年輕的傳道人面對長輩是勸，不是嚴責；面對姊妹，總要清清潔潔的"],["真為寡婦的","5:3--16","「要尊敬那真為寡婦的」——家人先在自己家中學著行孝，教會才去救濟那真無倚靠的；神的家記得獨居無靠的人"],["不可有偏心","5:17--25","「不可存成見，行事也不可有偏心」——善於管理的長老配受加倍的敬奉；控告要有見證，犯罪的也要在眾人面前責備；按手的禮不可急促"]]},"q":"你上一次對一位長輩說重話，是在哪裡？教會的會議桌上、家裡的飯桌上，還是家族的群組裡？也許你是那位年輕的同工，被資深的人頂撞，拳頭已經握緊；也許你是那位長輩，覺得年輕人不尊重你。\n有人一聽到「孝順」就喘不過氣，因為家曾經是他受傷最深的地方；也有人家裡有一位年老的母親獨自住在三樓，已經一個禮拜沒有人去看她。\n還有人坐在會眾席上，心裡藏著一件關於某位領袖的事，不知道說出來以後，這個「家」會接住他，還是把他推出門外。這一章要問：神的家，是講人情的地方，還是講真理的地方？保羅的回答是：它是一個家——所以兩樣都不能少。","truth":"神的家裡沒有「人事」，只有「家事」：老年人是父母，少年人是弟兄姊妹，獨居無靠的寡婦被記得，勞苦的長老被供應。\n可是家的溫度不是遮蓋罪的毯子：控告要細細查究，犯罪的要責備，行事不可有偏心——因為這家真正的主人，一直在場。","mv":{"t":"不可嚴責老年人，只要勸他如同父親；勸少年人如同弟兄；","r":"提前5:1"},"card":["這一章是保羅交給年輕的提摩太的一份「家規」。他先定稱呼：老年人如同父母，少年人如同弟兄姊妹；再講家裡最容易被漏掉的人——那真為寡婦的；最後講家裡最容易被偏袒的人——長老。對傳道人，這一章教你怎樣說話、怎樣查究、怎樣不偏心；對會眾，這一章教你怎樣孝敬、怎樣照顧，怎樣不讓任何一個人在神的家裡被遺忘，或被犧牲。","這一章的神，是記得人的神。獨居無靠的寡婦「是仰賴神，晝夜不住地祈求禱告」（5:5），神聽著；一位兒女在自己家中行孝、報答親恩，保羅說「這在神面前是可悅納的」（5:4），神看著；連在場上踹穀的牛，神都不許人籠住牠的嘴（5:18）。這也是審判的神：保羅在神、基督耶穌和蒙揀選的天使面前囑咐提摩太（5:21），因為這家的每一次查究，旁邊都坐著一位不偏心的主。到了 5:25，善行連不明顯的也不能隱藏——神不讓罪永遠藏著，也不讓善行永遠埋著。對傳道人，這是警告；對默默忠心的會眾，這是安慰。","第 4 節「行孝」，原文是 εὐσεβεῖν（eusebein）——就是全卷那個「敬虔」的動詞。保羅在第 4 章叫提摩太在敬虔上操練自己；到了這裡，敬虔的操練場不是禱告室，是自己的家：「便叫他們先在自己家中學著行孝，報答親恩」（5:4）。這改變今天的讀法：一個在教會很屬靈、卻一年不回家看父母的人，他的敬虔還沒有回家。對傳道人，這個字提醒你，講台上的敬虔要經得起家人的檢驗；對會眾，它告訴你，替父母繳一張醫藥費、陪他看一次門診，在神面前也是敬虔。看顧的樣子可以不同——家裡若不安全，先顧安全，再找出你能盡的那一份。","這一章照出來的我，常常手上拿著兩把尺。對有地位的人，我說話小心，替他找理由；對沒有聲音的人——獨居的老姊妹、剛守寡的年輕媽媽、坐在角落的少年人——我總是沒有時間。在家裡，我也許對外人很有禮貌，對自己的父母最沒有耐性；或者反過來，我用「孝順」兩個字壓住自己的孩子。5:21 的「偏心」，原來不只是長老會議的事，是我每天怎樣分配我的口氣、我的時間、我的同情。","「不可嚴責老年人，只要勸他如同父親」（5:1）。全章最大的翻轉在一個稱呼上：保羅沒有先給提摩太一套程序，先給他一張家人的名單。你怎樣稱呼一個人，就決定你怎樣對他說話。對傳道人：面對頂撞你的長輩，你要說真話，卻不揮拳；面對姊妹，你要清清潔潔，沒有曖昧，也沒有私下的特權。對會眾：你在教會叫出的每一聲「弟兄」「姊妹」，都是一個承諾——我不把你當外人，也不把你當工具。","這一週做一件事：打開手機通訊錄，找出一位教會裡獨居的長輩，或一位獨自帶孩子的家長，打一通電話，約一個時間去看他——帶一袋水果，陪他吃一頓飯，問他最近身體怎樣、要不要幫忙換燈泡或網路掛號。若你是傳道人或小組長，同一週把名單拿出來，標出所有獨居、喪偶、單親、長期患病的人，在每個名字旁邊寫上：上一次有人去看他，是哪一天？","最終整合：以弗所，一間家庭教會的長桌，油燈下。\n提摩太站在桌頭，比桌邊一半的人都年輕。\n左邊一位白髮的老弟兄打斷他的話，聲音很大；提摩太的手，已經在桌下握成了拳頭。\n他想起信上那一句：「不可嚴責老年人，只要勸他如同父親」。\n他把手鬆開，走過去，蹲在老人身邊，叫了一聲：父親。然後，把真話一句一句、慢慢地說完。\n長桌另一頭，一位守寡多年的老姊妹，名字寫在一本小小的冊子上，她每天清早都在為這張桌子禱告；\n她身邊，一個剛失去丈夫的年輕母親抱著孩子，沒有人催她許甚麼願，只有人問她：明天的米夠不夠？\n門邊，一位姊妹那天鼓起勇氣，說出了一位長老的事。沒有人叫她閉嘴，也沒有人把事情悄悄壓下去；\n大家說：我們要細細地查，照著真相去做，不偏向任何一邊。\n角落裡，一個少年人給提摩太倒了一杯水。提摩太說：謝謝你，弟兄。\n這張桌子旁邊沒有職員，沒有上司，沒有外人，\n只有父親、母親、弟兄、姊妹。\n還有一位，坐在看不見的上座。他不偏心，他記得每一個名字——\n連那個從來沒有被寫進任何冊子裡的人，他也記得。"],"self":"這一章照出來的「有己」，第一個樣子是偏心：我按著人的地位決定自己的口氣——對有影響力的人寬容，對沒有聲音的人冷淡；聽到一位領袖被指控，我的第一個念頭不是「真相是甚麼」，而是「這樣會不會丟教會的臉」。\n第二個樣子是拿一個好字去壓人：用「孝順」逼一個受過傷的人回到傷害裡，用「界線」替自己的冷漠找理由，用「家醜不可外揚」叫說真話的人閉嘴。偏心的我和拿好字壓人的我，保護的都是自己的位子，不是神家裡的人。","t321":{"k":"耶穌是我的榜樣：耶穌自己先活出這一章。他指著門徒說：「凡遵行我天父旨意的人，就是我的弟兄姊妹和母親了」（太 12:50）——他先定義了這個家。在拿因城門口，他看見一個寡婦送獨生子出殯，就停下來，叫她不要哭（路 7:13）；在十字架上，他連喘一口氣都痛，還把母親託給所愛的門徒：「看，你的母親！」（約 19:27）從此那門徒接她到自己家裡去。他看顧母親，卻從不讓任何人的期待取代父的旨意；他對假冒為善和偏袒權勢的人最嚴厲，對被定罪、被遺忘的人最溫柔。看顧而不被捆綁，溫柔而不偏心——這是神家裡長子的樣子。","g":"讓耶穌作王：這一章要人讓出兩個位子。第一個是審判台：保羅是在神、基督耶穌和蒙揀選的天使面前囑咐提摩太的（5:21），真正坐在審判台上的不是我們；所以我們不能存成見，先替喜歡的人判無罪、替不喜歡的人判有罪，也不能為了保護教會的名聲，替主決定哪些事可以不查。第二個是家長的位子：「只有一位是你們的父，就是在天上的父」（太 23:9）——長輩不能拿「父親」的稱呼要求絕對順服，父母也不能拿孝道取代神在成年兒女身上的主權。可以自己檢查：這一週，我在哪一件事上，還坐在只屬於他的位子上？","p":"建立屬神的體系：經文先說完，321 才接上來。「人比事重要」最直接的經文就在 5:1--2——教會的規矩從家人的稱呼開始。可是一個家要活得像家，也需要骨架：5:9 有一份名冊，記得誰需要照顧；5:16 有分工，家人先接住，教會補上那真無倚靠的；5:17--18 有供應，勞苦的人不被籠住嘴；5:19--21 有程序，控告要細細查究，犯罪的要責備，行事不可有偏心；5:22 有門檻，按手不可急促。所以團契的檢討，不只問聚會多熱鬧，也要問：我們有沒有一份獨居者的名單？財務是否透明？收到指控時，有沒有獨立調查、依法通報的流程？按立同工有沒有給足觀察的時間？有溫度又有骨架的家，才保護得了最軟弱的人。"},"grp":["【一、破冰】你在家族裡是怎樣被稱呼的——小名、排行，還是「阿弟」「大姊」？有沒有一個稱呼，一聽到就讓你覺得自己是被疼愛的？是誰這樣叫你？","【二、扎心】「便叫他們先在自己家中學著行孝，報答親恩」（5:4）。說一件具體的事：你上一次為父母或家中的長輩做一件實際的事，是哪一天、做了甚麼？若你和原生家庭之間有傷，不必說細節，只說：在安全的前提下，你現在能為他們做的最小一件事是甚麼？","【三、福音】「凡遵行我天父旨意的人，就是我的弟兄姊妹和母親了」（太 12:50）。說一個時刻：哪一年、在哪一間教會或哪一個小組，你第一次覺得自己被當成家人？是誰、做了甚麼？那份不必先配得、就被接納的經驗，讓你看見神怎樣的心？","【四、行動】說出一位你認識的獨居長輩、寡居的姊妹或單親家長的名字，這一週你要在哪一天、用甚麼方式關心他（電話、探訪、送一餐、陪看診）；再說出你要邀哪一位組員和你一起去。","【五、代禱】為三種人指名禱告：一位獨居無靠、晝夜禱告的長輩，求主讓教會記得他的名字；一位在原生家庭受過傷、一聽到「孝順」就發抖的弟兄姊妹，求主醫治、保護他，也賜他智慧知道怎樣看顧而不被捆綁；一位曾經在教會說出自己被傷害、卻沒有被認真對待的人，求主安慰他，也求教會配得他的信任。"],"prac":{"main":"這一週，把教會當成家：用家人的口氣說話，記得一個最容易被遺忘的人。","items":["對神：每天讀一次 5:1--2 和 5:5，把家裡、教會裡長輩與弟兄姊妹的名字一個一個帶到神面前；特別為一位獨居的人禱告，學 5:5 那位寡婦，把盼望放在神身上，晝夜不住地為人代求。","對自己：回想這一週說話的口氣：對哪一位長輩我曾經嚴責，對哪一位年輕人我曾經不耐煩？寫下一個名字，問自己：如果他是我的父親、我的弟弟，我會怎樣說？也誠實地看：這一週我在哪一件事上偏心了？","對人：為父母或家中的長輩做一件具體的事——一通電話、一次陪診、一筆生活費、一頓飯。若家裡曾有虐待、至今仍不安全，不必獨自回去面對；可以和兄弟姊妹分工、透過第三方聯絡，或在有人陪同的安全場合，找出你現在能盡的那一份看顧。","對生活：學 5:23 保羅的細心，照顧自己的身體：這一週按時吃飯、睡覺，生病就去看醫生，不把過勞當成屬靈；若你正在戒酒，請一位信得過的同伴知道你的努力，聚餐時不必勉強自己，也不必向任何人解釋。","對使命：和小組或團契一起列一張關懷名單——獨居長者、寡居、單親、長期患病的人，排好這一個月每週由誰去探訪；若你在同工團隊裡，也問一句：我們收到指控時，有沒有清楚的獨立調查與依法通報流程？"]},"safe":["① 把 5:1--2「如同家人」講成「家醜不可外揚」：教會是一家人，所以有事關起門來說，不要張揚、不要報警、不要讓外人知道。","這兩節管的是口氣，不是遮蓋；同一章 5:20 說確實犯罪的「當在眾人面前責備他」，5:21 說不可有偏心。把「家」當成不准說真話的理由，等於把家的溫度變成傷害的保護傘（全卷立場見 ISS00_4）。","檢驗標準：一位在教會裡受過傷的人聽完，是更相信這個家會為他說話，還是更覺得要為了「家」把事情吞下去？","② 反過來，用「勸他如同父親」要年輕的同工對長輩絕對順服：資深的人說了算，年輕人提出意見就是「不敬」。","5:1 的動詞是提摩太「勸」老年人，被吩咐不可嚴責的是年輕的一方，可是勸本身就是說真話；「如同父親」定的是口氣與尊重，不是一個不能被勸、不能被問的地位（太 23:9）。","檢驗標準：一位年輕的傳道人聽完，是學會溫和地把真話說完，還是學會在長輩面前把真話吞回去？","③ 把 5:2「總要清清潔潔的」講成姊妹的責任：要姊妹注意穿著、少接近傳道人，免得「絆倒」同工。","這一句是對提摩太說的：清潔是傳道人自己要守的，不是把姊妹當成誘惑的來源；最好的保護是清楚——像對自己的姊妹一樣，沒有曖昧，也沒有私下的特權、獨處與祕密。","檢驗標準：你講完這一節，責任落在傳道人自己的界線上，還是落在姊妹的衣服上？","④ 用 5:4、5:8 捆綁成年兒女：「你不回家就是背了真道」「父母打你也是為你好，你要孝順」，叫受虐的人回到施暴的家裡、交出全部收入或任父母安排婚姻工作。","5:8 的動詞是 προνοεῖ（pronoei），預先想到、供應照顧，不是「順從」；經文沒有要人承受虐待。照顧可以有很多樣子：分擔費用、安排醫療長照、兄弟姊妹分工、透過第三方聯絡；有人身、性或經濟虐待時，先顧安全，必要時尋求專業協助與法律保護（紅線七）。","檢驗標準：一位從小被父母打罵、至今仍不安全的成年兒女聽完，是知道自己可以先安全、再找出能盡的那一份看顧，還是覺得要回到傷害裡才算孝順？","⑤ 反過來，用「界線」取消孝道：「我有界線，所以我對父母沒有虧欠」，讓一位年老無靠的父母無人照料。","「當孝敬父母」（出 20:12）是帶應許的誡命，耶穌也責備用「各耳板」逃避奉養父母的人（可 7:11--12）；5:4 說行孝、報答親恩「在神面前是可悅納的」。界線決定怎樣看顧，不決定要不要看顧（紅線七）。","檢驗標準：你有沒有同時講出「看顧不等於順從」和「界線不等於不管」？一位設了界線的人聽完，是更自在地冷漠，還是更清楚自己還能盡哪一份責任？","⑥ 用 5:8「比不信的人還不好」恐嚇正在照顧失智或重病父母、力有未逮的人：「把媽媽送去安養院就是不孝」。","保羅講的是不肯看顧，不是看顧的方式；把長輩交給專業照護、和兄弟姊妹分工輪流，都可以是 προνοέω（pronoeō）的看顧。照顧者自己的崩潰，不是敬虔的證明（紅線七）。","檢驗標準：一位已經照顧父母三年、筋疲力盡的照顧者聽完，是更有罪惡感，還是更知道可以求助、也知道教會會陪他一起扛？","⑦ 把 5:13「說長道短，好管閒事」講成「女人就是愛講閒話」，或拿寡婦一段來說女人比較容易被引誘。","保羅描寫的是一個具體處境：沒有家、沒有工作、被教會供養的年輕人，在各家之間流動，成了傳話與傳異教的管道；5:15「轉去隨從撒但」的動詞，與 1:6 那些偏離的人同一個字——偏離真道的，有男也有女。","檢驗標準：一位在教會服事多年的姊妹聽完，是覺得被尊重地帶進經文，還是覺得自己又被當成問題的來源？","⑧ 用 5:11--14 羞辱再婚的寡婦，說她「違背基督」「廢棄了當初所許的願」；或反過來，逼每一位喪偶、單親的姊妹趕快再嫁才算正常。","被定罪的是守不住的入冊誓約，不是婚姻本身；5:14 保羅正面地「願意」年輕的寡婦嫁人，可是那是對以弗所處境的牧養安排，不是要每一位喪偶的人都再婚，單身與守寡也不是次等的生命。","檢驗標準：一位喪偶多年、正在考慮再婚的姊妹，和一位決定不再婚的姊妹，聽完是不是都覺得自己在神的家裡被尊重？","⑨ 用 5:17--18「加倍的敬奉」向會眾要錢：「供應傳道人就是供應神，奉獻愈多福氣愈大」；或反過來，說傳道人愈窮愈屬靈，刻意讓傳道人的家庭為生活焦慮。","τιμή 兼有尊敬與酬金，教會有責任合理供應；可是同一封信也說有人「以敬虔為得利的門路」（6:5），加倍的敬奉是教會給出的尊重，不是傳道人可以索取的權利。兩邊同時講，財務透明是共同的保護（全卷立場見 ISS00_5）。","檢驗標準：會眾聽完，是更願意合理、透明地供應勞苦的同工，還是覺得被要錢？傳道人聽完，是更感恩，還是更理直氣壯地要求？","⑩ 用 5:19 叫控告的人閉嘴：「你有兩三個見證嗎？沒有就不要亂說」，要受害者自己先找齊證人才可以開口。","申 19:15 的「兩三個見證」是定案的門檻，不是開口的門檻；同一段說「審判官要細細地查究」（申 19:18），查證的責任在負責的人身上。而且一定要接著讀 5:20「當在眾人面前責備」與 5:21「不可有偏心」——這三節保護無辜者免於誣告，也不保護犯罪的長老（紅線三，全卷立場見 ISS00_4）。","檢驗標準：一位受過傷害、終於鼓起勇氣說出來的姊妹聽完，是更敢說，還是更不敢說？","⑪ 以「教會內部處理」「先照馬太福音十八章私下去勸」為由，延誤對性侵、兒童保護等刑事案件的通報，或讓被指控者自己的親信主導調查。","太 18:15--17 處理的是弟兄之間的得罪，不是刑事案件的替代程序；涉及性侵、兒童保護等刑事，要依法通報主管機關，教會要有獨立、可信的調查，保護提出的人不受報復，必要時讓被指控者在調查期間暫停職務（紅線三）。","檢驗標準：你有沒有在講台上清楚說出「要依法通報」這幾個字？會眾知不知道，在這間教會說出來以後，下一步會發生甚麼？","⑫ 把 5:20「在眾人面前責備」講成公開羞辱：在主日講台上點名、細數細節、要人當眾痛哭認罪；或反過來，說長老的罪只能私下處理、不必讓會眾知道。","5:20 的對象是經查證確實犯罪、仍在犯的人，目的是「叫其餘的人也可以懼怕」，不是羞辱；公開的是事實與處理，不是受害者的身分與傷口。長老的身分不給他私下了結的特權。","檢驗標準：處理完以後，受害者的隱私有沒有被保護？會眾是更敬畏神，還是只多了一場可以議論的熱鬧？","⑬ 用 5:22「不可急促」替拖延辯護：「我們要慢慢來」，讓一位在別處已經被指控過的人很快轉到新教會帶小組、帶兒童，卻不查問過去事奉的紀錄。","5:22 要人慢的是按手與託付，不是查究與保護；「不要在別人的罪上有分」——明知有疑點還按手，日後的罪我們也有分；5:24--25 說有些人的罪是隨後跟了去的，所以要給足觀察的時間、查問推薦人與紀錄。","檢驗標準：你的教會按立同工、安排兒童事工的人選時，有沒有一個不只一個人參與、查問過去紀錄的流程？","⑭ 用 5:23「稍微用點酒」鼓勵飲酒、替應酬勸酒開脫；或反過來，把飲酒本身定為罪、把滴酒不沾當成屬靈的資格。","5:23 的處境是「胃口不清，屢次患病」，對象是一位長期只喝水的人，分量是「稍微」，用法是當藥用；3:3 對監督的要求是「不因酒滋事」，重點是節制。同時要顧及正在戒酒的人：對他們，完全不碰酒是智慧，也是忠心（紅線八）。","檢驗標準：一位正在戒酒的弟兄聽完，是更有力量繼續戒，還是覺得「保羅都說可以喝一點」？一位滴酒不沾的人聽完，有沒有因此覺得自己比別人屬靈？","⑮ 把這一章講成 321 的插圖：先講「人比事重要」「建立屬神的體系」，再拿 5:1--2 和寡婦名冊來印證，或把 5:17 的長老直接套成 321 的某一種職份。","次序是經文先講：家人的稱呼、真為寡婦的、家人先行孝、長老的供應與控告、按手不可急促，然後 321 才在末端接上；5:17 的長老不等於五重職份的任何一格（鐵律五，全卷立場見 ISS00_3）。","檢驗標準：會眾聽完，記住的是一套理念的口號，還是那位記得寡婦、不偏心、坐在神家上座的主？","⑯ 用處境取消原則：「寡婦名冊、六十歲、按手，都是第一世紀的事，與今天無關」；或反過來，照抄經文的細節：教會只照顧滿六十歲的寡婦，年輕的寡婦一律推辭。","書信三問的第三問要走完：處境是以弗所教會資源有限、有人被假教訓帶走、年輕的提摩太面對長輩與長老；原則是神的家記得無靠的人、家人先盡本分、尊榮跟著勞苦與品格、控告要公正查究、託付要慢。今天落在長者關懷、單親支援、同工供應與指控處理流程上——判斷的理由要說出來（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，這一章的原則今天在你的教會落在哪裡，並且說出判斷的理由？"]},{"n":6,"t":"你要保守所託付你的","sub":"足、仗、託","lv":"A","arc":"守","sec":[["6:1--2","凡在軛下作僕人的：僕人與主人"],["6:3--10","然而，敬虔加上知足的心便是大利了：貪財是萬惡之根"],["6:11--16","你要為真道打那美好的仗，持定永生：萬王之王"],["6:17--19","你要囑咐那些今世富足的人：那真正的生命"],["6:20--21","你要保守所託付你的：願恩惠常與你們同在"]],"serm":{"pts":[["敬虔加上知足","6:3--10","「然而，敬虔加上知足的心便是大利了」——假師傅以敬虔為得利的門路；保羅說貪財才是萬惡之根，不是錢；有衣有食，就當知足"],["持定永生","6:11--16","「你要為真道打那美好的仗，持定永生」——屬神的人要逃避、要追求；照著在本丟‧彼拉多面前作過美好見證的基督；直到萬王之王、萬主之主顯現"],["保守所託付的","6:17--21","「你要保守所託付你的」——富足的人樂意供給人，持定那真正的生命；年輕的守門人守住所託付的，好交給下一棒"]]},"q":"你銀行裡的數字，和你心裡的平安，是一起漲、一起跌的嗎？有人每天看三次股價，有人每個月底算著帳單睡不著；有人在教會裡聽過「信主就會蒙福發財」，後來生意垮了，連信仰也一起垮了；也有人一直覺得有錢是罪，連一頓好飯都吃得心虛。\n這一章，保羅最後一次對年輕的提摩太說話：錢、爭辯、見證、富人、學問，一件一件交代；說著說著，他抬起頭唱起歌來。\n這一章要問的是：神交到你手上的東西——福音、家人、時間、錢——你是緊緊抓著不放，還是守好了，準備交下去？","truth":"敬虔加上知足便是大利：叫人沉淪的不是錢，是貪財；那厚賜百物給我們享受的神，叫富足的人樂意供給人，叫屬神的人持定永生，直到萬王之王顯現。\n「你要保守所託付你的」，不是關起門來看守，是守好了交給下一棒；先保守，再恩惠——但我們能保守，是因為「願恩惠常與你們同在」的恩惠，早已先與我們同在。","mv":{"t":"提摩太啊，你要保守所託付你的，","r":"提前6:20"},"card":["這一章是一封託付信的最後一頁。保羅一口氣交代了五件事：在軛下的僕人怎樣讓神的名不被褻瀆；以敬虔為得利的人錯在哪裡，敬虔加上知足才是大利；屬神的人要逃避、要追求、要打那美好的仗；今世富足的人不要倚靠無定的錢財；最後是一句收束——「提摩太啊，你要保守所託付你的」（6:20）。足、仗、託三個字，說的是同一件事：手上拿著的，都不是自己的。","這一章的神，是「叫萬物生活的神」（6:13），是「厚賜百物給我們享受的神」（6:17）。講到守命令，保羅停了下來，唱出全卷第三首頌讚：神是「那可稱頌、獨有權能的萬王之王、萬主之主」（6:15），「就是那獨一不死、住在人不能靠近的光裡」（6:16）的那一位。以弗所人以為錢就是權能，保羅說獨有權能的只有一位；人用錢買不到不朽，獨一不死的只有神。他到了日期，要將主耶穌顯明出來——守的人不是撐到沒有盡頭，是等一位一定會來的主。","6:18「樂意供給人」，原文是 κοινωνικούς（koinōnikous），字根就是 κοινωνία（koinōnia）——團契、相交、彼此有分。保羅沒有叫富足的人變窮，他叫他們把錢變成關係。轉帳只要一秒鐘，κοινωνικούς 卻是把自己和對方連在一起：知道他的名字，知道他的難處，坐到他的桌邊。這改變今天的讀法：奉獻不是付清一筆會費，好讓自己心安；錢在神的家裡，是用來建立關係的。問題不是「我給了多少」，是「我因此和誰連在一起了」。","這一章照出來的我，手總是握著的。坐在台下的我，嘴上說知足，眼睛卻一直在比較：同學換了車，同事升了職，我就覺得神虧待我；或者反過來，把貪心藏在「為家人打算」的話裡。站在台上的我，更細：面對有錢的會友，我會不自覺地多笑一點；講到奉獻，我心裡算的是預算，不是會眾；我守著自己的講台、自己的同工、自己的見解，怕被人取代，捨不得交出去。握緊的手，抓不住永生。","「貪財是萬惡之根。」（6:10）全章最該被讀準的一句，主語是「貪財」，不是錢。φιλαργυρία（philargyria）是「愛銀子」——問題在心裡的那份愛，不在手裡的那張鈔票。這一句翻轉了兩種人：以為錢能帶來平安、拚命去追的人，聽見了警告；以為錢本身骯髒、連享受都心虛的人，也被釋放了。錢可以是僕人，貪財卻要作主人；神「厚賜百物給我們享受」（6:17），享受不是罪，把盼望放在禮物上而忘了賜禮物的神，才是。","這一週做一件事：把一筆錢變成一段關係。選一位你知道正在缺乏的人——一位剛失業的組員、一位獨自帶孩子的姊妹、一位在外地讀書的學生——這個星期約他吃一頓飯，你請客，聽他說話，不急著給建議。若你是傳道人或同工，再多做一件：把你手上一件只有你會做的事，挑一個年輕人，這週坐下來教他一次。樂意供給人，給的不只是錢；保守所託付的，也包括把它交下去。","最終整合：以弗所城裡，一間家庭教會，主日的黃昏。\n信已經念了很久。念到僕人那一段，角落裡一個奴僕抬起頭，坐在前面的主人沒有轉身，卻輕輕點了一下頭。\n念到「貪財是萬惡之根」，一個布商把手從錢袋上拿開了；念到「厚賜百物給我們享受」，他身旁的妻子笑了，那天晚上的餅，大家吃得很安心。\n念到「萬王之王、萬主之主」，屋裡沒有人說話，只有一聲又一聲的「阿們」。\n然後，念信的人停下來，看著站在桌邊的提摩太，念出最後的兩句：\n「提摩太啊，你要保守所託付你的。」\n年輕的提摩太低下頭，手裡握著那卷信，好像握著一袋別人寄存的銀子——不是他的，不能挪用，不能打折，也不能鎖起來。\n散會前，他把一份抄好的蠟版，交到一個剛受洗的年輕人手上：「下個主日，換你念給新來的人聽。」\n門口的燈還亮著。念信的人念出最後一句：「願恩惠常與你們同在！」——不是「你」，是「你們」。\n原來守門的人並不孤單：先是保守，再是恩惠；\n但他之所以守得住，是因為那恩惠，在他接過這封信以前，就已經守著他了。"],"self":"這一章照出來的「有己」，第一個樣子是握緊：錢握緊，位置握緊，見解握緊。我把神交給我的東西當成我的產業，所以怕失去、愛比較，有了還想要，給出去像割肉；我也會用屬靈的話包裝它——說是知足，其實是捨不得；說是守住真道，其實是守住自己的地盤。\n第二個樣子是自高：τετύφωται，被自己的煙燻住。錢多一點，就把成功當成自己的功勞；懂得多一點，就專好問難、爭辯言詞；連守真道也守成了贏過別人。握緊的手和自高的眼睛，都看不見那位住在人不能靠近的光裡、獨有權能的主。","t321":{"k":"耶穌是我的榜樣：這一章的「美好」，在 6:13 第一次有了一個人的臉——那位「向本丟‧彼拉多作過那美好見證的基督耶穌」（6:13）。他被綁著站在羅馬巡撫面前，沒有求饒，也沒有反擊，安靜地說他是為給真理作見證而來。他本來富足，卻為我們成了貧窮；他一生沒有自己的房子，卻從不缺給人的東西，五個餅可以餵飽五千人；他也把父交給他的人保守得好好的，在離世以前，把福音交到一群門徒手上。保羅叫提摩太打的仗、作的見證、守的託付，模子都是他。","g":"讓耶穌作王：這一章要人讓出「主人」的位置。錢最想作的就是主人：它說你倚靠我就安全，它說你有我才有價值。保羅在錢的教導中間停下來，唱出「萬王之王、萬主之主」（6:15）——一切正在作王的、一切正在作主的之上，還有一位。讓耶穌作王，就是把帳本、存摺、投資、事業和生涯規畫，一樣一樣放到他面前問：主啊，這是你的，你要我怎樣用？知足不是放棄，是不再讓錢坐在只屬於他的寶座上。","p":"建立屬神的體系：這一章把錢放回神的家裡它該在的位置。富足的人被吩咐「行善，在好事上富足，甘心施捨，樂意供給人」（6:18），κοινωνικούς 讓錢在弟兄姊妹之間流動，變成彼此相交的管道；教會的財務要透明，傳道人不巴結也不嫉妒有錢的會友。這一章也把體系的另一半講出來：保守所託付的，目的是交給下一棒。一間只靠一位傳道人撐著的教會，再興旺也只有一代；屬神的體系是一棒交一棒，每一代都有人接過福音、守住它、再交下去。"},"grp":["【一、破冰】你這輩子第一次自己賺到的錢，是做甚麼賺的？那筆錢最後花到哪裡去了？","【二、扎心】6:9 說「那些想要發財的人，就陷在迷惑、落在網羅」（6:9）。在你目前的生活裡，哪一件事最常讓你拿自己去和別人比較——薪水、房子、孩子的成績，還是別的？比較完了，你的心是更感恩，還是更焦急？","【三、福音】神是「厚賜百物給我們享受的神」（6:17）。說出這個星期你領受過的一樣好東西——一頓飯、一段休息、一個人的陪伴；你是怎樣領受它的：帶著感謝，還是帶著心虛？如果神真的是這樣一位慷慨的父親，你今天可以放下哪一份擔心？","【四、行動】「樂意供給人」的原文就是團契的形容詞。說出一個你這個星期要用錢或時間去「建立關係」的人的名字，你打算在哪一天、哪裡、做甚麼——請他吃飯、陪他看醫生、替他付一次車資？也請說出你手上有哪一件事，可以開始教一個人接手。","【五、代禱】為我們當中正在經濟壓力裡的人禱告：失業的、負債的、生意正在困難中的——求神供應他們，也讓教會成為他們身邊的家人；也為我們當中被神託付較多的人禱告，求神使他們不倚靠無定的錢財，而在好事上富足。請組員各說出一位要指名代禱的人。"],"prac":{"main":"守好了，交下去：把一筆錢變成一段關係，把一件託付交給下一棒","items":["對神：每天早上讀一次 6:15--16 的頌讚，在禱告裡先說「萬王之王、萬主之主」，再說今天的需要；把一樣你最擔心的財務帳目，具體地交在他面前。","對自己：這一週記下三次你和別人比較的時刻（看到甚麼、心裡說了甚麼），週末回頭看，問自己：那時候我倚靠的是無定的錢財，還是厚賜百物的神？","對人：選一位正在缺乏的人，這週約他吃一頓飯或陪他辦一件事，你出錢、出時間，也出耳朵；讓 κοινωνικούς 落在一個有名字的人身上。","對生活：這週好好享受一件神賜的好東西——一頓家常飯、一次散步、一個安息的下午——不帶罪疚，帶著感謝；同時取消一項只是為了跟上別人而有的花費。","對使命：把你手上一件服事、一段經文、一個習慣，挑一位比你年輕的人，這週坐下來教他一次；保守所託付的，不是鎖起來，是交下去。"]},"safe":["① 用 6:6--10 支持成功神學：「信主就會蒙福發財」「奉獻越多，神就加倍還給你」，把敬虔講成換取財富的投資。","這正是 6:5「以敬虔為得利的門路」的那條路；保羅把「利」重新定價：敬虔加上知足本身就是大利，不是發財的手段。不點名任何當代講員或教會，但要把這條路講清楚（紅線四；全卷立場見 ISS00_5）。","檢驗標準：一位生意剛失敗、奉獻一直很忠心的弟兄聽完，是覺得自己被神虧欠、信心不夠，還是知道神的愛從來不靠存摺證明？","② 反過來，用 6:10 講清貧主義：「錢是骯髒的」「有錢人很難是真基督徒」「越窮越屬靈」，叫會眾對一切財富與享受都心虛。","6:10 的主語是「貪財」（φιλαργυρία，愛錢），不是錢；6:17 說神「厚賜百物給我們享受」，4:4 說凡神所造的物都是好的。富足的人被吩咐的不是變窮，是不倚靠、樂意供給人（紅線四）。","檢驗標準：你有沒有明說「6:10 是貪財，不是錢」？有沒有講到 6:17 的「享受」？一位做生意有成的姊妹聽完，是被羞辱，還是被託付？","③ 把 6:1--2 讀成「聖經支持奴隸制」，或拿來要求今天的員工對老闆一味順服、忍受超時、欠薪或羞辱，「因為聖經說要恭敬主人」。","保羅是在對一群無法改變處境的人牧養，理由是「免得神的名和道理被人褻瀆」；同一封信把「搶人口」列為敵正道的罪（1:10），他也吩咐主人要公平待僕人（西 4:1），要腓利門收阿尼西謀為親愛的兄弟（門 16）。今日職場的應用不可單向化。","檢驗標準：你講完這兩節，有沒有同時對老闆和主管說話？一位正在受職場剝削的人聽完，是知道可以求助、可以守住法律的保護，還是覺得要忍下去才算屬靈？","④ 用處境取消原則：「6:1--2 是第一世紀奴隸社會的事，跟我們無關」；或反過來用原則抹掉處境，把軛下奴僕的話直接套在今天的僱傭關係上。","書信三問要走完：處境是以弗所教會裡同坐一桌的奴僕與主人；原則是信徒在自己的位置上，叫人因他尊重所信的神，弟兄關係不是怠慢的藉口；今天落在辦公室、工廠與家庭僱傭裡，雙方都要聽——判斷的理由要說出來（全卷立場見 ISS00_1）。","檢驗標準：你有沒有具體說出，這兩節的原則今天落在哪裡、為甚麼這樣判斷？","⑤ 把 6:8「只要有衣有食，就當知足」講成「基督徒不可以努力賺錢、不可以投資創業、不可以有計畫」，或叫窮困的人「知足就好，不要求助」。","6:8 列的是生存的底線，不是生活的上限；知足的人仍然可以勤勞工作、可以為家人預備，也可以坦然接受弟兄姊妹的幫助。拿知足去叫缺乏的人閉口，是把經文講反了（全卷立場見 ISS00_5）。","檢驗標準：一位正在為房租發愁的會友聽完，是更敢向教會說出需要，還是更覺得說出來就是不知足？","⑥ 用 6:3--5「專好問難，爭辯言詞」堵住會眾的問題：「不要再問了，問多了就是傳異教」「懷疑就是驕傲」。","保羅診斷的是「專好」——把爭辯當嗜好、從不讓真理改變自己，症狀是嫉妒、紛爭、毀謗、妄疑；他自己寫信常常發問。用這節壓制誠實的提問，本身就是 6:4 那種自高自大。","檢驗標準：一位正在掙扎、帶著真問題來教會的年輕人聽完，是更敢問，還是更不敢問？","⑦ 把 6:20「那敵真道、似是而非的學問」講成反學術、反科學：「讀太多書會失去信心」「科學是魔鬼的工具」。","保羅反對的是 ψευδωνύμου γνώσεως，名不副實、冒用知識之名的說法，不是學問本身；神願意萬人明白真道（2:4），真理不怕被研究。要躲避的是把人從真道引開的話，不論它穿學術的外衣還是屬靈的外衣。","檢驗標準：一位在大學或研究室工作的會友聽完，是覺得他的專業被當成敵人，還是被邀請用所學來愛神？","⑧ 把 6:20「保守所託付的」講成守舊、關門：「我們這裡的傳統一個字都不能改」「新人、年輕人等以後再說」，或傳道人把服事、講台、同工圈守成自己的地盤。","παραθήκη 是寄存物，要原封不動地交還，也要交下去；提後 2:2 說得最清楚，要交託那忠心能教導別人的人。守而不交，福音就斷在這一代。","檢驗標準：你講完這一節，會眾和同工是更會守住自己的位置，還是更想把所領受的教給下一個人？","⑨ 把 6:20 與 6:21 的次序講顛倒，或只講一半：「你守住了，神才會賜恩惠給你」，把恩惠變成守得好的獎賞；或反過來只講恩惠，不講保守。","次序是先保守，再恩惠；但能保守，是因為恩惠先常與我們同在。把恩惠講成獎賞，守門的人會累垮；只講恩惠不講保守，託付就落空了。","檢驗標準：一位疲倦得快守不住的傳道人或同工聽完，是更焦急地要證明自己守得住，還是知道恩惠一直與他同在，所以可以再守下去？","⑩ 把 6:15--16 的頌讚當過門句匆匆念過，或把它拿來講末世時間表：「到了日期」就是哪一年哪一天，主顯現前會先發生哪些國際大事。","這是全卷第三處頌讚，講台必須停下來敬拜；「到了日期」說的是神自己定的時候，不是要我們算日子。果效是忍耐，不是恐慌。","檢驗標準：會眾走出去，是更想算日子、更怕世界，還是更敬畏、更安心地等候那位萬王之王？","⑪ 把 6:11「屬神的人」講成只屬於牧師、傳道人的屬靈階級：「我們是神人，你們要聽我們的」，或講台上只對傳道人說話，會眾覺得與己無關。","這是一封寫給提摩太、卻在全會眾面前宣讀的信；提後 3:17 用同一個稱號指每一個被聖經裝備的信徒，而 6:21 的「你們」是複數。這一章要兩層講：對傳道人，也對會眾。","檢驗標準：你講完，一位坐在最後一排的弟兄，是覺得「那是說給牧師聽的」，還是知道「我也是屬神的人」？","⑫ 把 6:12「打那美好的仗」講成靠自己拚命賺取永生，或講成跟別人、跟別的教會、跟社會打一場要贏的仗。","ἀγωνίζου 是競技場上的拚搏：信心會遇到阻力，這是比賽的一部分；但永生是「被召」得著的，是要持定，不是要賺取；得勝不是贏過別人，是持定永生。","檢驗標準：會眾聽完，是更焦慮地用表現證明自己得救，或更好鬥，還是更有把握地抓住已經賜下的永生？","⑬ 用 6:17--19 討好或羞辱有錢的會友：講台上特別稱讚大額奉獻者、安排他們坐前排；或反過來在講台上影射某位富足的弟兄姊妹。","保羅給年輕的提摩太一份囑咐，去對錢比他多的人說話：不巴結，也不嫉妒，只說「不要自高，也不要倚靠無定的錢財」。教會的財務要透明，奉獻不換取座位、職分或發言權（這使我們想起雅 2:1--4）。","檢驗標準：一位剛來、身上只有零錢的新朋友，和一位事業有成的長輩，聽完這一段，是不是都覺得自己在這個家裡一樣被尊重？","⑭ 把 6:19「為自己積成美好的根基，叫他們持定那真正的生命」講成「多施捨就可以買到永生、積功德」。","那又回到 6:5「以敬虔為得利的門路」的老路；施捨不是交易，而是一個已經抓住真正生命的人，活在將來的實際裡。ὄντως（真正的）就是 5:3「真是寡婦」的那個字：錢買得到生活，買不到真正的生命。","檢驗標準：會眾聽完，是想用奉獻換取保障，還是因為已經蒙了恩典，所以樂意把錢流到別人的需要裡？","⑮ 講奉獻時把 6:5--10 拿來施壓：「你不奉獻就是貪財」「十分之一不夠就是愛錢」，用罪疚感推動預算。","6:10 說的是人心裡愛錢的方向，不是一張奉獻金額表；傳道人若用這段經文替教會預算催款，自己就站到了 6:5 那一邊。奉獻要出於甘心（6:18「甘心施捨」）。","檢驗標準：會眾走出去，是因為怕被說成貪財而奉獻，還是因為認識了厚賜百物的神而樂意供給人？"]}],"txt":{"1":["奉我們救主神和我們的盼望基督耶穌之命，作基督耶穌使徒的保羅","寫信給那因信主作我真兒子的提摩太。願恩惠、憐憫、平安從父神和我們主基督耶穌歸與你！","我往馬其頓去的時候，曾勸你仍住在以弗所，好囑咐那幾個人不可傳異教，","也不可聽從荒渺無憑的話語和無窮的家譜；這等事只生辯論，並不發明神在信上所立的章程。","但命令的總歸就是愛；這愛是從清潔的心和無虧的良心，無偽的信心生出來的。","有人偏離這些，反去講虛浮的話，","想要作教法師，卻不明白自己所講說的所論定的。","我們知道律法原是好的，只要人用得合宜；","因為律法不是為義人設立的，乃是為不法和不服的，不虔誠和犯罪的，不聖潔和戀世俗的，弒父母和殺人的，","行淫和親男色的，搶人口和說謊話的，並起假誓的，或是為別樣敵正道的事設立的。","這是照著可稱頌之神交託我榮耀福音說的。","我感謝那給我力量的我們主基督耶穌，因他以我有忠心，派我服事他。","我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫，因我是不信不明白的時候而做的。","並且我主的恩是格外豐盛，使我在基督耶穌裡有信心和愛心。","「基督耶穌降世，為要拯救罪人。」這話是可信的，是十分可佩服的。在罪人中我是個罪魁。","然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐，給後來信他得永生的人作榜樣。","但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！","我兒提摩太啊，我照從前指著你的預言，將這命令交託你，叫你因此可以打那美好的仗。","常存信心和無虧的良心。有人丟棄良心，就在真道上如同船破壞了一般。","其中有許米乃和亞歷山大；我已經把他們交給撒但，使他們受責罰就不再謗瀆了。"],"2":["我勸你，第一要為萬人懇求、禱告、代求、祝謝；","為君王和一切在位的，也該如此，使我們可以敬虔、端正、平安無事地度日。","這是好的，在神我們救主面前可蒙悅納。","他願意萬人得救，明白真道。","因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌；","他捨自己作萬人的贖價，到了時候，這事必證明出來。","我為此奉派作傳道的，作使徒，作外邦人的師傅，教導他們相信，學習真道。我說的是真話，並不是謊言。","我願男人無忿怒，無爭論，舉起聖潔的手，隨處禱告；","又願女人廉恥、自守，以正派衣裳為妝飾，不以編髮、黃金、珍珠，和貴價的衣裳為妝飾，","只要有善行，這才與自稱是敬神的女人相宜。","女人要沉靜學道，一味地順服。","我不許女人講道，也不許她轄管男人，只要沉靜。","因為先造的是亞當，後造的是夏娃，","且不是亞當被引誘，乃是女人被引誘，陷在罪裡。","然而，女人若常存信心、愛心，又聖潔自守，就必在生產上得救。"],"3":["「人若想要得監督的職分，就是羨慕善工。」這話是可信的。","作監督的，必須無可指責，只作一個婦人的丈夫，有節制，自守，端正，樂意接待遠人，善於教導；","不因酒滋事，不打人，只要溫和，不爭競，不貪財；","好好管理自己的家，使兒女凡事端莊順服。","人若不知道管理自己的家，焉能照管神的教會呢？","初入教的不可作監督，恐怕他自高自大，就落在魔鬼所受的刑罰裡。","監督也必須在教外有好名聲，恐怕被人毀謗，落在魔鬼的網羅裡。","作執事的，也是如此：必須端莊，不一口兩舌，不好喝酒，不貪不義之財；","要存清潔的良心，固守真道的奧祕。","這等人也要先受試驗，若沒有可責之處，然後叫他們作執事。","女執事也是如此：必須端莊，不說讒言，有節制，凡事忠心。","執事只要作一個婦人的丈夫，好好管理兒女和自己的家。","因為善作執事的，自己就得到美好的地步，並且在基督耶穌裡的真道上大有膽量。","我指望快到你那裡去，所以先將這些事寫給你。","倘若我耽延日久，你也可以知道在神的家中當怎樣行。這家就是永生神的教會，真理的柱石和根基。","大哉，敬虔的奧祕，無人不以為然！就是神在肉身顯現，被聖靈稱義，被天使看見，被傳於外邦，被世人信服，被接在榮耀裡。"],"4":["聖靈明說，在後來的時候，必有人離棄真道，聽從那引誘人的邪靈和鬼魔的道理。","這是因為說謊之人的假冒；這等人的良心如同被熱鐵烙慣了一般。","他們禁止嫁娶，又禁戒食物，就是神所造、叫那信而明白真道的人感謝著領受的。","凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的，","都因神的道和人的祈求成為聖潔了。","你若將這些事提醒弟兄們，便是基督耶穌的好執事，在真道的話語和你向來所服從的善道上得了教育。","只是要棄絕那世俗的言語和老婦荒渺的話，在敬虔上操練自己。","「操練身體，益處還少；惟獨敬虔，凡事都有益處，因有今生和來生的應許。」","這話是可信的，是十分可佩服的。","我們勞苦努力，正是為此，因我們的指望在乎永生的神；他是萬人的救主，更是信徒的救主。","這些事，你要吩咐人，也要教導人。","不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。","你要以宣讀、勸勉、教導為念，直等到我來。","你不要輕忽所得的恩賜，就是從前藉著預言、在眾長老按手的時候賜給你的。","這些事你要殷勤去做，並要在此專心，使眾人看出你的長進來。","你要謹慎自己和自己的教訓，要在這些事上恆心；因為這樣行，又能救自己，又能救聽你的人。"],"5":["不可嚴責老年人，只要勸他如同父親；勸少年人如同弟兄；","勸老年婦女如同母親；勸少年婦女如同姊妹；總要清清潔潔的。","要尊敬那真為寡婦的。","若寡婦有兒女，或有孫子孫女，便叫他們先在自己家中學著行孝，報答親恩，因為這在神面前是可悅納的。","那獨居無靠、真為寡婦的，是仰賴神，晝夜不住地祈求禱告。","但那好宴樂的寡婦正活著的時候也是死的。","這些事你要囑咐她們，叫她們無可指責。","人若不看顧親屬，就是背了真道，比不信的人還不好，不看顧自己家裡的人，更是如此。","寡婦記在冊子上，必須年紀到六十歲，從來只作一個丈夫的妻子，","又有行善的名聲，就如養育兒女，接待遠人，洗聖徒的腳，救濟遭難的人，竭力行各樣善事。","至於年輕的寡婦，就可以辭她；因為她們的情慾發動，違背基督的時候就想要嫁人。","她們被定罪，是因廢棄了當初所許的願；","並且她們又習慣懶惰，挨家閒遊；不但是懶惰，又說長道短，好管閒事，說些不當說的話。","所以我願意年輕的寡婦嫁人，生養兒女，治理家務，不給敵人辱罵的把柄。","因為已經有轉去隨從撒但的。","信主的婦女，若家中有寡婦，自己就當救濟她們，不可累著教會，好使教會能救濟那真無倚靠的寡婦。","那善於管理教會的長老，當以為配受加倍的敬奉；那勞苦傳道教導人的，更當如此。","因為經上說：「牛在場上踹穀的時候，不可籠住牠的嘴」；又說：「工人得工價是應當的。」","控告長老的呈子，非有兩三個見證就不要收。","犯罪的人，當在眾人面前責備他，叫其餘的人也可以懼怕。","我在神和基督耶穌並蒙揀選的天使面前囑咐你：要遵守這些話，不可存成見，行事也不可有偏心。","給人行按手的禮，不可急促；不要在別人的罪上有分，要保守自己清潔。","因你胃口不清，屢次患病，再不要照常喝水，可以稍微用點酒。","有些人的罪是明顯的，如同先到審判案前；有些人的罪是隨後跟了去的。","這樣，善行也有明顯的，那不明顯的也不能隱藏。"],"6":["凡在軛下作僕人的，當以自己主人配受十分的恭敬，免得神的名和道理被人褻瀆。","僕人有信道的主人，不可因為與他是弟兄就輕看他；更要加意服事他；因為得服事之益處的，是信道蒙愛的。你要以此教訓人，勸勉人。","若有人傳異教，不服從我們主耶穌基督純正的話與那合乎敬虔的道理，","他是自高自大，一無所知，專好問難，爭辯言詞，從此就生出嫉妒、紛爭、毀謗、妄疑，","並那壞了心術、失喪真理之人的爭競。他們以敬虔為得利的門路。","然而，敬虔加上知足的心便是大利了；","因為我們沒有帶甚麼到世上來，也不能帶甚麼去。","只要有衣有食，就當知足。","但那些想要發財的人，就陷在迷惑、落在網羅和許多無知有害的私慾裡，叫人沉在敗壞和滅亡中。","貪財是萬惡之根。有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。","但你這屬神的人要逃避這些事，追求公義、敬虔、信心、愛心、忍耐、溫柔。","你要為真道打那美好的仗，持定永生。你為此被召，也在許多見證人面前，已經作了那美好的見證。","我在叫萬物生活的神面前，並在向本丟‧彼拉多作過那美好見證的基督耶穌面前囑咐你：","要守這命令，毫不玷污，無可指責，直到我們的主耶穌基督顯現。","到了日期，那可稱頌、獨有權能的萬王之王、萬主之主，","就是那獨一不死、住在人不能靠近的光裡，是人未曾看見、也是不能看見的，要將他顯明出來。但願尊貴和永遠的權能都歸給他。阿們！","你要囑咐那些今世富足的人，不要自高，也不要倚靠無定的錢財；只要倚靠那厚賜百物給我們享受的神。","又要囑咐他們行善，在好事上富足，甘心施捨，樂意供給人，","為自己積成美好的根基，預備將來，叫他們持定那真正的生命。","提摩太啊，你要保守所託付你的，躲避世俗的虛談和那敵真道、似是而非的學問。","已經有人自稱有這學問，就偏離了真道。願恩惠常與你們同在！"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ κατʼ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν</p><p lang=\"grc\">Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.</p>","lit":"<p>保羅，基督耶穌的使徒，照著神我們救主的命令，和基督耶穌我們的盼望，</p><p>給提摩太，在信心上真生的孩子：恩典、憐憫、平安，從父神和基督耶穌我們的主。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κατʼ ἐπιταγὴν θεοῦ</td><td>kat' epitagēn theou</td><td>照著神的命令</td><td>不是自薦，是奉差</td></tr><tr><td>θεοῦ σωτῆρος ἡμῶν</td><td>theou sōtēros hēmōn</td><td>神我們的救主</td><td>教牧書信的稱呼：父神是救主</td></tr><tr><td>τῆς ἐλπίδος ἡμῶν</td><td>tēs elpidos hēmōn</td><td>我們的盼望</td><td>基督自己就是盼望</td></tr><tr><td>γνησίῳ τέκνῳ</td><td>gnēsiō teknō</td><td>真生的孩子</td><td>合法、親生、不是冒充的</td></tr><tr><td>χάρις ἔλεος εἰρήνη</td><td>charis eleos eirēnē</td><td>恩典、憐憫、平安</td><td>保羅問安裡多了「憐憫」</td></tr></table>","gram":"<p><strong>一封託付信的開頭。</strong>保羅寫給提摩太，照理用不著亮身分——兩人同工十多年。他卻寫 Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ κατʼ ἐπιταγὴν θεοῦ（Paulos apostolos Christou Iēsou kat' epitagēn theou），「照著命令」作使徒。ἐπιταγή（epitagē） 是上級的諭令，羅馬官場的委任狀（mandata）也用這種口氣：上司寫給派駐地方的代表，授權給他，也讓當地的人聽見這授權。6:21 的祝福「你們」是複數，信是要在會眾面前宣讀的。開頭的「使徒」不是寫給提摩太看的，是寫給以弗所那些不服的人聽的。</p><p>θεοῦ σωτῆρος ἡμῶν（theou sōtēros hēmōn）：稱父神為「救主」，保羅別的信幾乎不用，教牧書信卻一再出現（2:3；4:10）。Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν（Christou Iēsou tēs elpidos hēmōn）：基督不只是盼望的內容，他自己就是盼望。</p><blockquote><p>γνησίῳ τέκνῳ ἐν πίστει（gnēsiō teknō en pistei）。γνήσιος（gnēsios） 是法律字，指婚生的、合法繼承的孩子，相對於私生或冒認的。提摩太的父親是希臘人（徒 16:1），在血緣上與保羅毫無關係；ἐν πίστει（en pistei） 說明這親子關係建在哪裡。問安的 χάρις ἔλεος εἰρήνη（charis eleos eirēnē） 比保羅慣用的「恩惠、平安」多了 ἔλεος（eleos），只有提摩太前後書如此。這個字在本章要再出現兩次，就是 1:13、1:16 的 ἠλεήθην（ēleēthēn）。</p></blockquote>","exp":"<p>「奉我們救主神和我們的盼望基督耶穌之命，作基督耶穌使徒的保羅」（1:1）。這封信從頭到尾都是交代：誰可以作監督、怎樣照顧寡婦、怎樣對待長老、錢要怎樣看。保羅先把權柄的來源擺在桌上——不是我想這樣，是神吩咐的。一個人要整頓別人之前，先要清楚自己是被差的；權柄是領受的，不是自己長出來的。</p><p>「寫信給那因信主作我真兒子的提摩太」（1:2）。以弗所有人冒充教師（1:7），保羅卻先確認一個「真」的。真兒子不是因為長得像，是因為信。這是對提摩太的肯定，也是在會眾面前替他背書：這年輕人不是我隨便留下的，他是我的孩子。後面 4:12 說「不可叫人小看你年輕」，背書早在第二節就寫好了。</p><p>「願恩惠、憐憫、平安……歸與你」（1:2）。多出來的「憐憫」值得停一下。寫信的人知道自己是怎樣被撿回來的（1:13），所以祝福年輕同工時，連憐憫一起給。帶領的人最需要的，常常不是更多恩賜，而是更多憐憫——被憐憫，也學會憐憫人。</p><p>保羅和提摩太是 321「235」裡屬靈父母與兒女最完整的一例。但次序不可倒：先看見經文說的是一個託付、一份背書、一句「因信」，然後才說，這正是屬靈父子關係的樣子——不是控制，是授權；不是佔有，是成全。</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν</p><p lang=\"grc\">μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—</p>","lit":"<p>正如我勸你繼續留在以弗所，在我往馬其頓去的時候，好叫你囑咐某些人不要教別樣的教訓，</p><p>也不要專心於神話和沒有盡頭的家譜，這些只提供追根究柢的爭辯，而不是神那在信心裡的家政——</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>προσμεῖναι ἐν Ἐφέσῳ</td><td>prosmeinai en Ephesō</td><td>繼續留在以弗所</td><td>留下比離開難</td></tr><tr><td>παραγγείλῃς τισὶν</td><td>parangeilēs tisin</td><td>囑咐某些人</td><td>不點名，不給舞台</td></tr><tr><td>ἑτεροδιδασκαλεῖν</td><td>heterodidaskalein</td><td>教別樣的</td><td>新約只在 1:3、6:3</td></tr><tr><td>μύθοις καὶ γενεαλογίαις ἀπεράντοις</td><td>mythois kai genealogiais aperantois</td><td>神話和沒有盡頭的家譜</td><td>越挖越深，挖不到底</td></tr><tr><td>οἰκονομίαν θεοῦ</td><td>oikonomian theou</td><td>神的家政</td><td>「家」追蹤線第一站</td></tr></table>","gram":"<p><strong>一句沒有說完的話。</strong>1:3 用 Καθὼς παρεκάλεσά σε（Kathōs parekalesa se） 起頭，「正如我勸你……」，照文法後面該接「你也要這樣做」，保羅卻一路講到 1:7 都沒有回到主句。這是書信裡的斷句（anacoluthon），急著交代的人才會這樣寫。προσμεῖναι（prosmeinai） 是「繼續留下」：保羅往馬其頓去，提摩太被留在一間正在出問題的教會。</p><p>ἑτεροδιδασκαλεῖν（heterodidaskalein） 是「別的」加上「教導」的複合字，新約只在 1:3 與 6:3。加拉太書講過「別的福音」——加 1:6 的 ἕτερον εὐαγγέλιον（heteron euangelion）；這裡不是換了一個福音，而是在福音旁邊「教別的」，把重心移走。τισὶν（tisin） 只說「某些人」，到 1:20 才點出兩個名字。</p><blockquote><p>μύθοις καὶ γενεαλογίαις ἀπεράντοις（mythois kai genealogiais aperantois） 是甚麼？學者大致兩說：一說是猶太式的舊約家譜揣測與傳說（多 1:14 明說「猶太人荒渺的言語」；1:7 又說他們想作「教法師」）；一說是後來諾斯底派的「靈體譜系」雛形。前者有本卷與提多書的內證，後者的完整體系要到二世紀才出現。本講義採前者，並保留它已帶著禁慾色彩（4:3）的可能，詳見本章議題頁。αἵτινες ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ（haitines ekzētēseis parechousi mallon ē oikonomian theou）：兩樣東西擺在天平兩端——一邊是無止境的考究，一邊是 οἰκονομίαν θεοῦ（oikonomian theou），神的家政、神管家的安排。和合本譯作「神在信上所立的章程」。οἰκονομία（oikonomia） 從「家」這個字來，本卷「家」的追蹤線從這裡起步，到 3:15「神的家」成為樞紐。</p></blockquote>","exp":"<p>〔背景〕徒 20:29--31（使徒行傳講義第 20 章）</p><p>本系列使徒行傳講義第 20 章講過米利都的告別。保羅對以弗所長老說：「就是你們中間，也必有人起來說悖謬的話，要引誘門徒跟從他們」（徒 20:30）。幾年後，他寫信給留在以弗所的提摩太：「好囑咐那幾個人不可傳異教」（1:3）。米利都說的「你們中間」，如今有了臉孔。危險不是從外面闖進來的豺狼而已，也是從講台旁邊站起來的人。</p><p>「我往馬其頓去的時候，曾勸你仍住在以弗所」（1:3）。「勸」不是命令，是請求。提摩太大概想跟著走——留下來，就是留在衝突中間。許多服事的難處不是不知道該做甚麼，而是不想留下來做。保羅先用一個「勸」字承認這份難。</p><p>「也不可聽從荒渺無憑的話語和無窮的家譜；這等事只生辯論」（1:4）。家譜本身不是壞東西，馬太福音就從家譜開始；問題是「無窮」——挖不到底，也不打算挖到底，因為樂趣就在挖。這樣的研究產生的是辯論，不是生命。今天換了名目：末世時間表的推算、隱藏密碼、某個字的神秘數值。聽起來很屬靈，結果是聚會散了，人更會爭，卻沒有更會愛。</p><p>保羅拿來對照的，是「神的家政」。神在信心裡安排一個家，每個人有位置、有服事；假教訓把人從家裡拉到書房，拉到辯論場。測驗一個教訓，可以問一個很簡單的問題：它讓這個家更像家，還是讓人更愛贏？</p>"},{"a":5,"z":5,"star":3,"grk":"<p lang=\"grc\">τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,</p>","lit":"<p>而那囑咐的目的是愛，出於潔淨的心、良善的良心和不假裝的信心；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸ δὲ τέλος</td><td>to de telos</td><td>而那目的</td><td>τέλος：靶心、終點</td></tr><tr><td>τῆς παραγγελίας</td><td>tēs parangelias</td><td>那囑咐的</td><td>接回 1:3 的「囑咐」</td></tr><tr><td>ἐστὶν ἀγάπη</td><td>estin agapē</td><td>是愛</td><td>全卷主軸第一站</td></tr><tr><td>ἐκ καθαρᾶς καρδίας</td><td>ek katharas kardias</td><td>出於潔淨的心</td><td>源頭一：動機</td></tr><tr><td>συνειδήσεως ἀγαθῆς</td><td>syneidēseōs agathēs</td><td>良善的良心</td><td>源頭二：與神與人無虧</td></tr><tr><td>πίστεως ἀνυποκρίτου</td><td>pisteōs anypokritou</td><td>不假裝的信心</td><td>源頭三：不是演出來的</td></tr></table>","gram":"<p><strong>τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη（to de telos tēs parangelias estin agapē）。</strong>δέ（de） 把這一句和前面的家譜辯論對立起來：他們產生辯論，「而」囑咐的目的是愛。τέλος（telos） 不是「總和」，是「目標、終點」，射箭時箭要去的地方。和合本「總歸」譯得好，有「歸到哪裡」的意思。τῆς παραγγελίας（tēs parangelias） 有冠詞，指的就是 1:3 的 παραγγείλῃς（parangeilēs）——提摩太要去下的那道禁令，目的不是贏，是愛。這個字根在 1:18 再出現：保羅把這「命令」交託提摩太。追蹤線「囑咐」在本章三站：1:3、1:5、1:18。</p><p>愛有三個來源，都用 ἐκ（ek） 帶出：ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου（ek katharas kardias kai syneidēseōs agathēs kai pisteōs anypokritou）。一個是心（動機乾淨），一個是良心（συνείδησις（syneidēsis），對自己行為的內在見證），一個是信（ἀνυπόκριτος（anypokritos），「不戴面具的」，ὑποκριτής（hypokritēs） 是舞台上的演員）。良心在本卷是一條暗線：1:5 良善的、1:19 被推開的、3:9 清潔的、4:2「如同被熱鐵烙慣了一般」（4:2）。</p><blockquote><p>注意保羅沒有把三者排成先後步驟，而是三個並列的泉源。愛不是靠技巧製造的，是從一個乾淨的內裡流出來的。假教師正好相反：1:6 說他們 ἀστοχήσαντες（astochēsantes）——同一個射箭的圖像，「射偏了」。靶心是愛，他們射到辯論上去了。</p></blockquote>","exp":"<p>「但命令的總歸就是愛；這愛是從清潔的心和無虧的良心，無偽的信心生出來的」（1:5）。這是整卷提摩太前書的鑰匙。後面有許多規矩：禱告的次序、監督的資格、寡婦名冊、長老的工價。讀到任何一條，都要回到這一節來問：這一條要成全的愛在哪裡？規矩若不再通向愛，就已經偏了靶。</p><p>這一節出現在一個很不浪漫的地方。保羅剛剛叫提摩太去「囑咐」人閉嘴，馬上補一句：你下這命令的目的，是愛。所以愛不是軟弱，不是甚麼都不管；有時候愛就是禁止。但禁止的人要先問自己：我是為了保護這個家，還是為了證明我對？同一句話，從清潔的心說出來是牧養，從爭勝的心說出來就是另一場辯論。</p><p>三個泉源也是三面鏡子。清潔的心：我的動機有沒有夾雜？無虧的良心：我要求別人的，自己有沒有做到？無偽的信心：我在台上的信心，和我在家裡的信心是不是同一個？三者有一個堵住了，流出來的就不是愛，是別的東西包裝成的愛。</p><p>本卷的歷史有一個令人心驚的回聲。三十多年後，主對以弗所教會說：「你也曾試驗那自稱為使徒卻不是使徒的，看出他們是假的來……然而有一件事我要責備你，就是你把起初的愛心離棄了」（啟 2:2--4）。這間教會學會了 1:3 的分辨，卻忘了 1:5 的目的。守真道不是為了贏，是為了愛。</p><p>321 說「用心靠聖靈」。這一節說得更具體：愛是從「心」生出來的。外面的行為可以學，心的源頭卻只能被潔淨。所以這節不是一張要做到的清單，而是一個要回去的地方。</p>"},{"a":6,"z":7,"star":1,"grk":"<p lang=\"grc\">ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν,</p><p lang=\"grc\">θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.</p>","lit":"<p>有些人偏離了靶心，離開這些，轉向了空談，</p><p>想要作律法的教師，卻既不明白自己所說的，也不明白自己所斷言的是關於甚麼。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀστοχήσαντες</td><td>astochēsantes</td><td>射偏了</td><td>與 1:5「目的」同一個射箭圖像</td></tr><tr><td>ἐξετράπησαν εἰς ματαιολογίαν</td><td>exetrapēsan eis mataiologian</td><td>轉向空談</td><td>離了正路，走進岔路</td></tr><tr><td>θέλοντες εἶναι νομοδιδάσκαλοι</td><td>thelontes einai nomodidaskalo

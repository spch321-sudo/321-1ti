得救之道；有些人甚至用這一節主張書信寫於二世紀。照這個讀法，6:20 只針對那個特定的異端，與今天的學術無關。</p><p><strong>難處：</strong>成熟的諾斯底體系是後來才出現的，6:20 的描寫更接近 1:3--4 的「荒渺無憑的話語和無窮的家譜」，是一種早期的、混合猶太傳說與思辨的教訓；把它限定在一個歷史名詞裡，也會讓今天的讀者錯過它的提醒。</p>"],["冒名知識說（反對的是把人從真道引開的偽知識，不是學問本身）","","<p>認為保羅反對的是一種冒用知識之名、生出爭辯與驕傲、讓人「偏離了真道」（6:21）的說法。它可以穿學術的外衣，也可以穿屬靈的外衣——例如自稱有特別啟示的祕密知識。真正的學問、誠實的科學研究，不在這個警告之內。</p><p><strong>難處：</strong>要分辨甚麼是「似是而非」並不容易，需要群體的智慧與時間；這個讀法也要提醒：基督徒自己的屬靈說法，同樣可能是似是而非的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採冒名知識說。</strong>6:20 不是反學術、反科學；保羅要提摩太躲避的，是那些把人從真道引開、只留下爭辯與驕傲的說法，不論它是學術的還是屬靈的外衣。基督徒可以讀書、研究、從事科學，用所學愛神愛人。以弗所的假教訓，全卷立場見 ISS00_8；作者與年代的問題，全卷立場見 ISS00_6、ISS00_7；這些爭議與信心的關係，見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你在課堂或實驗室裡遇到難解的問題，那不表示你的信仰錯了，只表示你還在學習。你可以帶著問題來到神面前，也帶到教會裡來問；「願恩惠常與你們同在」（6:21），恩惠也與正在思考的人同在。</p>"]],"con":[],"say":"本講義的立場：6:20 不是反學術、反科學，保羅反對的是冒用知識之名、把人從真道引開的說法，不論它穿學術還是屬靈的外衣。以弗所的假教訓見 ISS00_8；爭議與信心見 ISS00_9。","care":"會眾席上可能有正在大學裡經歷信仰掙扎的學生，有在研究室、醫院工作而常被說「讀太多書」的專業人士，也有因為一個問題得不到回答而離開教會的人。講台上不要嘲笑學術或科學，也不要把提問的人說成驕傲；會後可以單獨陪他談，推薦合適的讀物或同工，讓他知道教會是一個可以帶著問題來的家。"}],"terrain":{"points":[[0.725,70,5,"但命令的總歸就是愛",null],[1.325,94,17,"永世的君王","top"],[1.425,8,19,"如同船破壞了一般","bot"],[1.8,88,5,"只有一位中保","top"],[2.4,30,14,"陷在罪裡","bot"],[2.844,22,6,"自高自大","bot"],[3.469,98,16,"大哉，敬虔的奧祕","top"],[3.594,16,2,"良心如同被熱鐵烙慣了","bot"],[4.219,76,12,"都作信徒的榜樣",null],[4.52,64,1,"只要勸他如同父親",null],[5.952,12,10,"把自己刺透了","bot"],[6.238,96,16,"住在人不能靠近的光裡","top"]]},"tracks":[{"gk":"εὐσέβεια／εὐσεβέω ↔ ἀσεβής","tr":"eusebeia / eusebeō ↔ asebēs","gl":"敬虔、行孝、敬神 ↔ 不虔誠","code":"G2150","root":"εὐσέβεια——敬虔（εὖ「好」＋σέβομαι「敬拜、敬畏」：好好地敬畏）；全本新約 15 次，教牧書信佔 10 次，提摩太前書佔 8 次。εὐσεβέω——敬虔地對待，5:4 和合本譯「行孝」；θεοσέβεια——敬神（2:10，新約僅此一次）；ἀσεβής——不虔誠。在希臘世界，這個字指對神明與家族本分的恭敬；保羅把它放進一首基督之歌裡（3:16）","ins":"敬虔先以反面出場：律法是為「不虔誠和犯罪的」設立的（1:9）。第一次正面出現，是教會在社會裡的樣子：為君王和一切在位的禱告，「使我們可以敬虔、端正、平安無事地度日」（2:2）；姊妹的妝飾是善行，「這才與自稱是敬神的女人相宜」（2:10）。3:16 是第一個翻轉，也是全卷的最高點：「大哉，敬虔的奧祕」——敬虔的源頭不是我們的修養，是「神在肉身顯現」的那一位。所以敬虔可以操練：「在敬虔上操練自己」（4:7），而且「惟獨敬虔，凡事都有益處」（4:8）。5:4 和合本把同一個字譯成「行孝」：「便叫他們先在自己家中學著行孝」——敬虔從家裡開始，從照顧年老的父母開始。6:3 說純正的話是「合乎敬虔的道理」。6:5 是第二個翻轉，全卷最難聽的一句：「他們以敬虔為得利的門路」——敬虔被拿來賺錢。下一節立刻翻回來：「然而，敬虔加上知足的心便是大利了」（6:6）。最後一站，敬虔是屬神的人要追求的六樣之一：「追求公義、敬虔、信心、愛心、忍耐、溫柔」（6:11）。敬虔不是一種氣質，是一個被基督抓住的人，天天在家裡、在教會裡、在錢包前面練出來的樣子。","stops":[["1:9","不虔誠和犯罪的","bot"],["2:2","使我們可以敬虔、端正、平安無事地度日",""],["2:10","這才與自稱是敬神的女人相宜",""],["3:16","大哉，敬虔的奧祕","top"],["4:7","在敬虔上操練自己",""],["4:8","惟獨敬虔，凡事都有益處",""],["5:4","便叫他們先在自己家中學著行孝",""],["6:3","與那合乎敬虔的道理",""],["6:5","他們以敬虔為得利的門路","bot"],["6:6","然而，敬虔加上知足的心便是大利了","top"],["6:11","追求公義、敬虔、信心、愛心、忍耐、溫柔",""]]},{"gk":"καλός","tr":"kalos","gl":"好、美好、善","code":"G2570","root":"καλός——好的、美好的、高尚的；不只是「有用」，也是「好看」，是外人看得見的好。提摩太前書 14 節用了它，比保羅任何一封書信都多；和合本按上下文譯作「好」「美好」「善」","ins":"這個字是提摩太前書的底色。第一站說律法本身沒有問題：「我們知道律法原是好的」（1:8）；問題在人怎麼用。1:18 父親把「美好的仗」交給兒子。2:3 為萬人禱告，「這是好的」。到了第 3 章，這個字變成服事的形容詞：監督的職分是「善工」（3:1），監督要「在教外有好名聲」（3:7），善作執事的「得到美好的地步」（3:13）——好，是教外的人也看得見的好。4:4 是第一個翻轉：在一群禁止嫁娶、禁戒食物的人中間，保羅說「凡神所造的物都是好的」——好不是禁出來的，是神造的。4:6 傳講這些的人，就是「基督耶穌的好執事」。第 5 章的好是寡婦一生的行善（5:10），而且善行藏不住（5:25）。第 6 章這個字密集出現：「你要為真道打那美好的仗」（6:12）；6:13 是第二個翻轉，美好有了一個人的臉：那「向本丟‧彼拉多作過那美好見證的基督耶穌」——我們的美好見證，是照著他的那一次。最後兩站落在錢上：富足的人要「在好事上富足」（6:18），「為自己積成美好的根基」（6:19）。好不是外表，是積在將來的根基。","stops":[["1:8","我們知道律法原是好的",""],["1:18","叫你因此可以打那美好的仗","top"],["2:3","這是好的",""],["3:1","就是羨慕善工",""],["3:7","監督也必須在教外有好名聲",""],["3:13","自己就得到美好的地步",""],["4:4","凡神所造的物都是好的","top"],["4:6","便是基督耶穌的好執事",""],["5:10","又有行善的名聲",""],["5:25","這樣，善行也有明顯的",""],["6:12","你要為真道打那美好的仗",""],["6:13","向本丟‧彼拉多作過那美好見證的基督耶穌","top"],["6:18","在好事上富足",""],["6:19","為自己積成美好的根基","top"]]},{"gk":"διδασκαλία／ὑγιαίνω ↔ ἑτεροδιδασκαλέω","tr":"didaskalia / hygiainō ↔ heterodidaskaleō","gl":"教訓、教導、道理、純正 ↔ 傳異教","code":"G1319","root":"διδασκαλία——教導、教訓（全本新約 21 次，教牧書信佔 15 次）；ὑγιαίνω——健康、健全（英文 hygiene 的字根），和合本譯「正道」「純正」；ἑτεροδιδασκαλέω——教別的（新約只在提前 1:3、6:3）。保羅的教訓不是「對的資訊」，是「健康的話」：會使人活","ins":"全卷第一件差事就是攔阻一種教訓：「好囑咐那幾個人不可傳異教」（1:3）——原文是「教別的」。1:10 和合本的「正道」，原文是「健康的教訓」：凡與它為敵的，律法都要管。保羅自己是「外邦人的師傅」（2:7）。4:1 是第一個翻轉：教訓不一定從人來，聖靈明說，後來有人要「聽從那引誘人的邪靈和鬼魔的道理」——錯的教訓背後有屬靈的源頭。所以提摩太要在「善道上得了教育」（4:6），聚會的時候「以宣讀、勸勉、教導為念」（4:13）。4:16 是第二個翻轉，也是這條線的頂點：「你要謹慎自己和自己的教訓」——先看守自己，再看守教訓；健康的教訓從一個健康的生命出來。5:17 勞苦教導的長老配受加倍的敬奉。6:1 奴僕的生活，關係到「神的名和道理」會不會被人褻瀆。終點在 6:3，回到第一站的字，卻有了答案：傳異教的人，是「不服從我們主耶穌基督純正的話」——健康的教訓，最後是一個人的話。","stops":[["1:3","好囑咐那幾個人不可傳異教","bot"],["1:10","或是為別樣敵正道的事設立的",""],["2:7","作外邦人的師傅",""],["4:1","聽從那引誘人的邪靈和鬼魔的道理","bot"],["4:6","在真道的話語和你向來所服從的善道上得了教育",""],["4:13","你要以宣讀、勸勉、教導為念",""],["4:16","你要謹慎自己和自己的教訓","top"],["5:17","那勞苦傳道教導人的，更當如此",""],["6:1","免得神的名和道理被人褻瀆",""],["6:3","若有人傳異教，不服從我們主耶穌基督純正的話","top"]]},{"gk":"οἶκος／οἰκονομία／οἰκέω","tr":"oikos / oikonomia / oikeō","gl":"家、章程、家務、住","code":"G3624","root":"οἶκος——家、家庭、家業；οἰκονομία——家政、管理（1:4 和合本「章程」）；οἰκεῖος——自家人；οἰκοδεσποτέω——治理家務；οἰκέω——居住。提摩太前書的教會論是一個家的比喻，從「神的家政」開始，到「神住在光裡」結束","ins":"第一站是神的家政：假教訓只生辯論，「並不發明神在信上所立的章程」（1:4）——章程原文就是 οἰκονομία，一個家怎麼過日子。第 3 章這個字三次落在服事的人身上：監督要「好好管理自己的家」（3:4），因為「人若不知道管理自己的家，焉能照管神的教會呢」（3:5）；執事也要「好好管理兒女和自己的家」（3:12）。3:15 是第一個翻轉，也是全卷的樞紐：家的比喻從小家走到大家——「在神的家中當怎樣行」。第 5 章回到地上的家：先「在自己家中學著行孝」（5:4）；「不看顧自己家裡的人」，比不信的人還不好（5:8）；年輕的寡婦閒著，就「挨家閒遊」（5:13），所以保羅寧願她們「治理家務」（5:14）。最後一站是第二個翻轉，換了一個字根卻同一個意思：神自己「住在人不能靠近的光裡」（6:16）。我們能住在神的家裡，是因為那住在光裡的神，先在肉身裡住到我們中間來（3:16）。","stops":[["1:4","並不發明神在信上所立的章程",""],["3:4","好好管理自己的家",""],["3:5","人若不知道管理自己的家，焉能照管神的教會呢",""],["3:12","好好管理兒女和自己的家",""],["3:15","在神的家中當怎樣行","top"],["5:4","便叫他們先在自己家中學著行孝",""],["5:8","不看顧自己家裡的人，更是如此","bot"],["5:13","挨家閒遊","bot"],["5:14","治理家務",""],["6:16","住在人不能靠近的光裡","top"]]},{"gk":"παραγγελία／παραγγέλλω／παρατίθημι／παραθήκη","tr":"parangelia / parangellō / paratithēmi / parathēkē","gl":"命令、囑咐、吩咐、交託、所託付的","code":"G3852","root":"παραγγελία——軍令、指示（在軍中是上級傳下來的命令）；παραγγέλλω——囑咐、吩咐；παρατίθημι——交託、存放；παραθήκη——寄存物、託付的財物（古時把貴重東西寄放在朋友家，朋友要原封不動地還）。全卷由 1:18「交託」與 6:20「所託付的」同一個字根框起來","ins":"提摩太在以弗所的第一件差事，就是一個囑咐：「好囑咐那幾個人不可傳異教」（1:3）。下一個用法立刻說出所有囑咐的目的：「但命令的總歸就是愛」（1:5）——命令不是為了管人，是為了愛。1:18 是第一個翻轉：囑咐別人的人，自己先被交託：「將這命令交託你」。所以他可以「吩咐人」（4:11），可以「囑咐她們」（5:7）。6:13 保羅在神和基督面前囑咐他——而那位基督，是「向本丟‧彼拉多作過那美好見證」的：被託付的人，背後站著一位守住見證到底的主。6:17 囑咐的對象是有錢人。最後一站是第二個翻轉，從動詞變成名詞：「提摩太啊，你要保守所託付你的」（6:20）——寄放的貴重東西，要原封不動地交還。福音不是提摩太的發明，是交到他手上、要他守住、再交下去的託付。","stops":[["1:3","好囑咐那幾個人不可傳異教",""],["1:5","但命令的總歸就是愛","top"],["1:18","將這命令交託你",""],["4:11","這些事，你要吩咐人",""],["5:7","這些事你要囑咐她們",""],["6:13","並在向本丟‧彼拉多作過那美好見證的基督耶穌面前囑咐你",""],["6:17","你要囑咐那些今世富足的人",""],["6:20","提摩太啊，你要保守所託付你的","top"]]}],"lesson":{"1":{"no":1,"vol":"《321提摩太前書講義》第一課·提摩太前書第一章","title":"在罪人中我是個罪魁——靶心、草圖、破船","chars":5271,"min":60,"deep":8,"dchars":1644,"tchars":1328,"blocks":[["h","一、交接主日，一封當眾念出來的信"],["p","弟兄姊妹平安。這一課要從一封信進去。那是一個交接主日的早上，一間小鎮上的華人教會。退休的老牧師沒有上台，他請一位長老替他念一封信。信封上寫的是那位年輕傳道人的名字：二十九歲，神學院畢業才三年，坐在第一排，兩隻手不知道該放在膝蓋上還是聖經上。後面坐著幾位比他父親還年長的執事。"],["p","長老念第一句：這間教會不是他自己要來的，是我請他留下的。全場安靜下來。信是寫給一個人的，一百多個人都在聽；每一句給他的叮嚀，也是給大家的交代：他是被託付的。信的中間說：你會遇到很會講的人，你不要和他們比誰比較會講。最後只有一句：我這一生最常禱告的，不是求主使用我，是求主憐憫我。"],["p","兩千年前，以弗所的教會也收到這樣一封信。開頭是：「奉我們救主神和我們的盼望基督耶穌之命，作基督耶穌使徒的保羅」（1:1）。這一行其實是寫給旁邊在聽的人。古時候上司派代表到地方上，會寫一封授權的信，讓當地人都聽見；這封信最後一句的「你們」是複數（6:21）。所以這一課有兩層聽眾：被託付的人，和坐在下面的每一個人。"],["p","「寫信給那因信主作我真兒子的提摩太」（1:2）。「真」是法律上的字：合法的、親生的、不是冒認的。提摩太的父親是希臘人，這對父子是建在信上的；保羅先當眾替一個年輕人背書。問安裡也多了一個詞：「願恩惠、憐憫、平安從父神和我們主基督耶穌歸與你！」（1:2）一個知道自己是怎樣被撿回來的人，祝福年輕同工時，會把憐憫一起交給他。"],["p","為甚麼寫這封信？「我往馬其頓去的時候，曾勸你仍住在以弗所，好囑咐那幾個人不可傳異教」（1:3）。「勸」是請求；留下來，就是留在衝突的正中間。「傳異教」原文的意思是教別的：在福音旁邊教別的，把重心移走。他們熱衷的是「荒渺無憑的話語和無窮的家譜」（1:4），只生辯論，「並不發明神在信上所立的章程」（1:4）。"],["p","「章程」原文是 οἰκονομίαν（oikonomian），裡面有一個「家」字：神在信心裡安排一個家，每一個人有位子、有服事。今天的家譜換了名目：末世時間表、聖經密碼。書信三問的第一問就是這樣：幾個人想作教師，一位年輕傳道人被留在他們中間。這一課用三個畫面走完第一章：靶心、草圖、破船。"],["d",["這封信明明是寫給提摩太一個人的，為甚麼說也是寫給坐在台下的我們？","因為它是一封託付信。古時候上司派代表到地方上，會寫一封授權的信，內容寫給代表，卻要在當地人面前宣讀：一面交代他該做甚麼，一面讓眾人知道他是被授權的。所以開頭特別寫「作基督耶穌使徒」，是寫給以弗所人聽的；最後一句「願恩惠常與你們同在」的「你們」是複數。讀這封信有兩種錯：一種說這是牧者手冊，和會眾無關；另一種把每一條直接套在今天某個人身上。比較好的讀法是走完書信三問，原則對講台和會眾席同樣有效。"]],["h","二、靶心：命令的總歸就是愛"],["p","第一個畫面，是全卷的第一把鑰匙：「但命令的總歸就是愛；這愛是從清潔的心和無虧的良心，無偽的信心生出來的。」（1:5）「總歸」原文是 τέλος（telos），不是加起來的總和，是箭要去的地方，就是靶心。姿勢再漂亮，箭不在那一點上，就是沒有射中。後面的每一條規矩，都要回來問：它的靶心在哪裡？"],["p","這一節緊跟在禁令後面。保羅剛叫提摩太去囑咐人不可再那樣教，馬上說：這道命令的靶心是愛。所以愛不是甚麼都不管，有時候愛就是說不可以。可是說不可以的人要先問：我是為了保護這個家，還是為了證明我對？"],["p","這愛有三個泉源，也是三面鏡子。清潔的心問：我的動機有沒有夾雜？無虧的良心問：我要求別人的，自己做到了沒有？無偽的信心，原文是不戴面具的信，問的是：我在台上的信心，和我在家裡飯桌上的信心，是不是同一個？"],["p","接著是同一個射箭的畫面：「有人偏離這些，反去講虛浮的話」（1:6）。「偏離」原文是 ἀστοχήσαντες（astochēsantes），就是沒射中靶心。箭差一度射出去，近看沒事，遠了就離靶很遠。病根在下一節：「想要作教法師，卻不明白自己所講說的所論定的。」（1:7）他們想要的是位子，所以越不懂，越說得斬釘截鐵。"],["p","保羅馬上補一句：「我們知道律法原是好的，只要人用得合宜」（1:8）。手術刀在醫生手裡救人，在別人手裡傷人。然後是一張清單：「弒父母和殺人的，行淫和親男色的，搶人口和說謊話的，並起假誓的」（1:9–10）。它的次序正是十誡的第五到第九條，每一項都是愛的反面，所以清單和靶心是一體的。"],["p","讀到「親男色的」，教會常犯兩種錯：跳過去不講，或只講這一項、講得特別大聲。經文兩樣都不容許。它清楚說這種行為與健康的教訓相抵觸，也把它放在「說謊話的」旁邊，沒有一個人可以置身事外。這個字描述的是行為，不是一個人的身分；教會要陪伴，不要羞辱。「正道」原文是健康的教訓：真理吃了會健康，假教訓有味道，卻叫人害病。"],["p","這一段結束在「交託我榮耀福音」（1:11）。「交託我」三個字一寫出來，保羅就停不下來了，因為這個「我」，本來是最不該被交託的那一個人。"],["d",["「律法不是為義人設立的」，那麼信主的人還需要律法嗎？","需要，只是角色不同了。保羅前一句先說「律法原是好的，只要人用得合宜」；律法不是我們稱義的途徑，我們不是靠守它進神的家。可是它照出來的罪仍然是罪，那張照著十誡排的清單，每一項都是愛的反面。對活在恩典裡、按著愛行事的人，律法的刀口不是對著他，它變成一面鏡子，叫我們看見哪裡還沒有愛到。講成道德作廢，是把恩典講成放縱；講成靠守律法得救，是把福音講成另一套家譜。詳見本章議題頁。"]],["d",["讀到「親男色的」，教會今天該怎樣陪伴有同性吸引掙扎的弟兄姊妹？","先把經文說清楚，再把人接住。這個字多數學者認為來自利未記的用語，指男性之間的性行為；它放在十誡第七條的位置，經文清楚說這與健康的教訓相抵觸。可是同一張清單也有說謊的、起假誓的，沒有人站在清單外面。這個字描述的是行為，不是一個人的身分或傾向。實際上，講台上不開玩笑、不貼標籤；有人向你說出掙扎，先謝謝他的信任，不轉述給別人，陪他讀經禱告。若他有憂鬱或自傷的念頭，協助尋求專業協助。本系列哥林多前書講義第 6 章有完整處理。"]],["h","三、原文亮光：滿溢、「我是」、草圖"],["p","「我感謝那給我力量的我們主基督耶穌，因他以我有忠心，派我服事他。」（1:12）講到職分，保羅第一個反應是感謝。然後他把過去攤在桌上：「我從前是褻瀆神的，逼迫人的，侮慢人的」（1:13），一個比一個近：先是嘴巴，再是行動，最後是動手羞辱人。「然而我還蒙了憐憫」（1:13）。「不明白」不是替自己減刑，憐憫的理由不在他的無知，在下一節的恩典。"],["p","第一個原文字：ὑπερεπλεόνασεν（hyperepleonasen），就是「並且我主的恩是格外豐盛」（1:14）。這是「滿溢」再加上「超過」，整本新約只出現這一次。請想像一個人捧著很厚的一本帳來到櫃台；那一頭倒下來的恩典不是剛好抵銷，是滿出杯子，流到桌上，又流到地上。"],["p","第二個原文字在全章最有名的一句：「『基督耶穌降世，為要拯救罪人。』這話是可信的，是十分可佩服的。在罪人中我是個罪魁。」（1:15）原文最後是 πρῶτός εἰμι ἐγώ（prōtos eimi egō），中間那個 εἰμι（eimi）是現在式。第十三節講過去，用的是「從前是」；到這裡他不寫我從前是罪魁，他寫「我是」。作使徒將近三十年，越老，越清楚自己站在哪裡。"],["p","這不是說他沒有改變，他在別處說：「若有人在基督裡，他就是新造的人」（林後 5:17）。現在式說的是位置：他從來沒有離開蒙恩的那個位置。好像下午的陽光斜斜照進老房子，你才看見空中飄滿了灰塵；灰塵一直都在，是光讓你看見。一個覺得自己不太需要恩典的領袖，很快就會用規矩壓人。"],["p","第三個原文字，就是第二個畫面：「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐，給後來信他得永生的人作榜樣。」（1:16）「榜樣」原文是 ὑποτύπωσιν（hypotypōsin），是建築師蓋樓以前的草圖，後來整棟樓都照著那幾條線蓋。保羅就是那張草圖。可是草圖上畫的不是保羅多能幹，是「他一切的忍耐」；主詞是耶穌基督。"],["p","神把最難的案例畫在第一張紙上，好叫後來每一個人看了都說：連他都可以，我也可以。覺得自己太糟了的人，你可能正是下一張要畫的人。罪魁和蒙憐憫要一起念，只念一半，都不是福音。"],["p","寫到這裡，保羅唱起來：「但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！」（1:17）這一課也在這裡停一下。以弗所城裡的皇帝會換人，亞底米大廟會倒；這一位王，每一個世代換了誰掌權，他都還在位。不能看見的神在哪裡被看見了？就在上一節，在一個罪魁身上。有些晚期抄本多了「智慧」兩個字，重心都一樣：只有一位。請大家一起慢慢讀一次第十七節，讀到阿們，停三秒。"],["d",["信主多年了，我還要說「我是罪魁」嗎？這樣會不會否定了我是新造的人？","不會，兩句話說的是兩件事。新造的人說的是身分：在基督裡，舊事已過，你是神的兒女。我是罪魁的現在式說的是站立的位置：保羅作使徒將近三十年，仍然站在蒙恩的位置上。越靠近光的人越看得見灰塵，這不是退步，是視力變好了。要小心兩個極端：一個是只念前一半，天天自責，覺得越爛越屬靈；另一個是覺得自己已經不太需要恩典，開始用規矩量別人。保羅把罪魁和蒙憐憫放在連續的兩句裡，請兩半一起念。詳見本章議題頁。"]],["h","四、破船，和窗邊那一盞燈"],["p","頌讚完了，保羅叫他兒子的名字：「我兒提摩太啊，我照從前指著你的預言，將這命令交託你，叫你因此可以打那美好的仗」（1:18）。「交託」原文是 παρατίθεμαί（paratithemai），把貴重的東西存放在別人手裡；信的最後「你要保守所託付你的」（6:20）是同一個字根，把整封信框起來。主交給保羅，保羅交給提摩太，提摩太還要交下去。"],["p","然後是第三個畫面：「常存信心和無虧的良心。有人丟棄良心，就在真道上如同船破壞了一般。」（1:19）信心是羅盤，良心是船身；只有羅盤沒有船身，再對的航線也會沉。「丟棄」原文是 ἀπωσάμενοι（apōsamenoi），是自己用手推開，不是不小心掉了。「船破壞了」原文是 ἐναυάγησαν（enauagēsan），就是船難；保羅自己「遇著船壞三次」（林後 11:25），他知道那是甚麼光景。"],["p","請想像一艘漁船，船底有一條小裂縫。第一天船長說，回港再修；第二天浪不大，又算了。一個月以後，裂縫長滿了藤壺，他也忘了。直到一個起霧的夜裡撞上暗礁，船身就從那條舊裂縫裂開。教會裡有些崩塌也是這樣：外面看來很突然，裡面已經推開良心很久了。這是全卷地勢最低的地方，是給講台的警告，也是給每一個當父母、帶人的你。"],["p","接著是兩個名字：「其中有許米乃和亞歷山大；我已經把他們交給撒但，使他們受責罰就不再謗瀆了。」（1:20）這一句一定要讀完，目的寫在後半句。「受責罰」原文是 παιδευθῶσι（paideuthōsi），從「孩子」這個字來，是父親管教兒女的字，不是報復的字。懲戒的目的是挽回。保羅在哥林多也說，是要「使他的靈魂在主耶穌的日子可以得救」（林前 5:5）。而且這是最後一步，前面有囑咐、有勸、有等待。"],["p","所以交給撒但這句話，今天不可以變成三件事，因為它的目的是挽回：不可以是當眾羞辱；不可以是逐出以後的冷暴力，連他的家人也被孤立；更不可以和趕鬼、咒詛連在一起。那一次紀律的後來，保羅寫道：「倒不如赦免他，安慰他，免得他憂愁太過，甚至沉淪了。」（林後 2:7）門可以暫時關上，窗邊的燈要一直亮著。"],["p","第二十節的「謗瀆」，和第十三節保羅說自己「褻瀆」，原文是同一個字根。主沒有放棄那個褻瀆的人，保羅盼望的，是這兩個人也有一天能說我蒙了憐憫。書信三問的第二問有了答案：命令的靶心是愛，家的地基是蒙了憐憫的罪魁，連懲戒也是為了挽回。第三問落在今天的會議桌、群組，和每一次我們想把人處理掉的時候。"],["d",["「如同船破壞了一般」，是不是說信主的人會失去救恩？","這一題各家立場不同：有人說這是真實的離道，救恩可以失去；有人說這些人從來沒有真正得救；也有人說這是信仰生命受了重創，但仍在可以挽回的地方。本講義不在這一節替整個救恩論下結論，只守住經文自己說的兩件事。第一，警告是真的，船是真的破了，不可以說推開良心沒關係。第二，下一節保羅仍以受責罰、不再謗瀆為目的，可見他沒有把這兩個人當作已經沉到海底。所以該做的不是天天量自己還剩多少救恩，是今天就去修那條裂縫。詳見本章議題頁。"]],["d",["「交給撒但」到底是甚麼意思？今天的教會紀律應該怎樣做才對？","多數解經家認為，交給撒但是指逐出教會：把人放回教會保護之外的世界，讓他經歷離開神家的後果。它不是趕鬼，也不是咒詛。最要緊的是目的寫在同一句：使他們受責罰就不再謗瀆了；「受責罰」是父親管教孩子的字，目的是挽回。今天的紀律要守三件事。第一，有次序：先私下指出，再帶人同去，最後才告訴教會。第二，有溫度：用溫柔的心把人挽回過來，不當眾羞辱，不冷處理，不孤立他的家人。第三，有回家的路：寫清楚怎樣回轉，回轉以後怎樣被接納。若涉及有人受害，先保護受害的人。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把「我是個罪魁」講成越自責越屬靈，信主多年還要天天活在自我貶低裡。保羅下一句就接「然而，我蒙了憐憫」；現在式說的是站立的位置，不是舊人沒有死。只念前一半，會叫正在憂鬱、自卑裡的人更想躲起來。"],["p","第二個偏差，剛好反過來：領袖拿我也是罪人當擋箭牌，被指出錯誤就說大家要饒恕我，然後甚麼都不改、甚麼都不交代。保羅說罪魁，是把自己放在恩典底下，不是放在問責之外；同一封信說犯了罪的長老要被責備。"],["p","第三個偏差，是把第二十節講成可以當眾羞辱、逐出以後全教會冷處理，或拿許米乃的名字嚇唬提出問題的人。「謗瀆」是抵擋真道，不是向領袖提出異議；交給撒但的目的寫在同一句：受責罰，就不再謗瀆，是挽回。"],["p","第四個偏差，是用第五節取消第三節，說指出錯誤就是不愛；或反過來，以為分辨得越準越忠心。以弗所教會後來走到第二條路上，主對他們說：「然而有一件事我要責備你，就是你把起初的愛心離棄了。」（啟 2:4）他們學會了分辨，卻忘了靶心。"],["p","第五個偏差，是把第九、十節那張清單拿去指著外面的人罵，或讀到「親男色的」就放大音量、甚至開玩笑；又或者乾脆跳過不講。清單的主詞應該是我們，保羅講完清單，第一句就說自己是罪魁。經文的立場要說清楚，行為不等於身分也要說清楚。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：面子。華人教會很難聽見一位長輩說我錯了。同工會上，一位資深執事當眾說了一句重話，大家都知道傷了人，可是沒有人敢請他道歉，他也覺得一道歉就沒有威信。保羅是使徒，他在一封要當眾宣讀的信裡寫自己是罪魁；他的權柄沒有因此變小，反而更清楚是從哪裡來的。一個家若只有晚輩會認錯，這個家就會越來越像衙門。誰先開口說那天我說話的心不夠清潔，誰就把靶心找回來了。"],["p","第二個問題：冷處理。我們很少大吵，我們只是不來往。家族裡有人做錯了事，從此逢年過節不再叫他；教會裡有人被勸退或自己離開，名字就不再被提起，街上遇見也裝作沒看見。我們以為這比吵架溫和，其實這正是第二十節最不容許的那一種：沒有回家路的懲戒。紀律可以有界線，有人受了傷害時也需要距離；可是方向是挽回。要有人負責禱告，有人在合宜、安全的時候問候，也要有一條寫清楚的回轉之路。"],["h","七、活出321——草圖上畫的是他的忍耐"],["p","走到這裡，我們才把國度321空中團契常說的幾句話接上去。次序不能倒：經文先說完，321 才在末端接上。"],["p","耶穌是我的榜樣：法利賽人議論他說：「這個人接待罪人，又同他們吃飯。」（路 15:2）彼得三次不認主，主復活以後在海邊先預備早飯，三次問他愛不愛，然後才說「你餵養我的小羊」（約 21:15）。先有憐憫，後有託付，正是第一章的次序；保羅這一張草圖，是照著主的忍耐畫出來的。"],["p","聖經是我的準則：準則要「用得合宜」（1:8）。經文先照自己，再扶別人；我用經文若總是指向別人、從不指向自己，就該停下來。"],["p","聖靈是我的引導：愛是從清潔的心生出來的。外面的行為可以學，心的源頭只能被潔淨。良心輕輕敲門的時候，常常是聖靈在提醒；不要把它推開。"],["p","讓耶穌作王：讓出三個位子。第一，教法師的位子，那個一定要講對、一定要贏的我（1:7）。第二，站在清單外面當審判官的位子。第三，故事主角的位子。可以檢查：我上一次講完見證，大家記得的是我，還是他？"],["p","讓耶穌得著一切的榮耀：保羅講著自己的故事，在第十七節把所有可能的掌聲，全數轉交給永世的君王。我們作見證也是一張草圖，畫的不是我多好，是他多能忍。"],["p","建立屬神的體系：讓教導有靶心，處理爭議先問這會不會讓我們更相愛；讓同工會從認罪和感恩開始；讓紀律有回家的路，每一步都有人陪；讓交託有接力，每一位同工找一位比自己年輕的人一同禱告。"],["h","八、四種心，聽同一封信"],["p","驕傲型的心，坐在台下聽信的時候，眼睛會偷偷看向別人：這一段是在講他。你很會分辨誰的教導有問題，說話越來越肯定，心卻越來越硬。第七節那兩個字是寫給你的：想要。請把自己放進第十五節那個「我」裡面，再念一次。"],["p","恐懼型的心，像被留在以弗所的提摩太，想走，又被勸留下；或者一讀到破船就怕：我是不是已經沉了？請聽第十八節，你被差出來時有人為你說過的話，是你的盔甲。破船的警告是要你今天就去修那條裂縫，不是要你絕望；良心還會敲門，就是神的憐憫還在。"],["p","羞恥型的心，最怕過去被翻出來。你也許做過連自己都不敢回想的事。第十六節說，主把最難的案例畫在第一張草圖上。你可能正是下一張要畫的人；你的過去不是你的名字，蒙了憐憫才是。"],["p","受傷型的心，也許你就是那個被處理過的人：被當眾點名，被冷處理，被說成謗瀆，連家人也被疏遠。請先聽見，那不是第二十節的心意；懲戒的目的是挽回，不是羞辱。你不必假裝沒事，也不必馬上回到那個地方。請找一位信得過的人說出來，必要時讓人陪你尋求專業的協助。"],["d",["我曾經被教會公開處理、被冷落，現在讀到第二十節很難受，我該怎麼面對？","先謝謝你願意讀下去。當眾羞辱、逐出以後的冷暴力、連家人也被疏遠，都不是第二十節的心意；那一節的目的是挽回，不是毀掉一個人。你的難受是真的，不必假裝沒事。第一，你不必馬上回到那個地方，也不必立刻原諒誰；饒恕可以在神面前慢慢走。第二，找一位信得過的人說出來。第三，若這件事讓你長期失眠、無望，或有傷害自己的念頭，請尋求專業的協助。組長若在組裡聽到這樣的事，不追問細節，不替教會辯護，會後單獨關心，必要時協助尋求專業協助。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上慢慢讀一次第十五到十七節，兩半一起念：先說在罪人中我是個罪魁，再說然而我蒙了憐憫，最後用第十七節讚美，念到阿們，停三秒。"],["p","第二，每晚睡前用第五節的三面鏡子照一次自己，把良心提醒你、你卻推開的那一件事寫下來，第二天就處理。"],["p","第三，找出手機裡一段你吵贏了卻冷掉的對話，這一週主動傳一句話或打一通電話，不重新辯論，只說：那天我說話的心不夠清潔，對不起。"],["p","第四，想一位曾被你或你的教會冷處理、或自己離開了的人，為他指名禱告；在合宜、安全的情況下，傳一則問候，讓他知道燈還亮著。"],["p","第五，刪掉一則只生辯論的轉貼，換成一句給某個人的祝福。"],["p","然後我們一起開口說四句話。"],["p","我宣告：基督耶穌降世，為要拯救罪人；在罪人中我是個罪魁，然而我蒙了憐憫。"],["p","我宣告：命令的總歸就是愛，我要從清潔的心、無虧的良心、無偽的信心去愛人。"],["p","我宣告：我不再推開良心，我要常存信心和無虧的良心，打那美好的仗。"],["p","我宣告：尊貴、榮耀不歸我，要歸與那不能朽壞、不能看見、永世的君王、獨一的神。"],["d",["我想向一位吵過架的人道歉，可是怕一開口又吵起來，要怎麼開始？","這一次的目標不是把那場辯論重新打贏，是把靶心找回來。第一，先在主面前讀一次第五節，問自己那天哪一個泉源堵住了。第二，只為自己的部分道歉，不加可是你也。可以說：那天我說話的心不夠清潔，傷了你，對不起。第三，不在訊息裡重新解釋立場；對方若想談，約一個時間當面慢慢談。第四，對方沒有回應也沒關係，繼續為他禱告。若那個人曾經傷害你、讓你不安全，就不必勉強接近，先把這件事交給神，也告訴一位信得過的人。"]],["h","十、結語"],["p","我們回到那個交接主日。散會以後，有人問那位年輕傳道人最記得哪一句。他說，是最後那一句：求主憐憫我。原來我接過來的不是一個位子，是一份只有蒙憐憫的人才扛得起的託付。那封信後來一直夾在他的聖經裡，就夾在這一章。"],["p","可是這一課的焦點，不在老牧師多謙卑，也不在保羅多了不起。焦點在第十六節那幾個字：他一切的忍耐。靶心是他定的，草圖上畫的是他，連破了的船，他還在海上找人。我們不必更佩服保羅，要更愛那一位忍耐保羅、也忍耐我們的主。"],["p","我們一起低頭禱告。永世的君王、獨一的神，我們感謝你，基督耶穌降世，為要拯救罪人；在罪人中我們就是罪魁，然而我們蒙了憐憫。赦免我們射偏了靶心，守住了自己的對，卻失去了愛；赦免我們一次又一次推開良心。求你醫治那些曾被羞辱、被冷處理的人，讓他們看見窗邊的燈；也給被託付的人清潔的心，打那美好的仗。尊貴、榮耀都歸給你，直到永永遠遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰比較會分辨，是讓每一個人照一照自己的靶心，說出一條該修的裂縫和這一週要去找的那一個人；請組長照著次序帶。"],["m","帶領說明：本課主軸是靶心、草圖、破船。席上可能有曾被教會公開處理或冷處理的人，也可能有長期自責的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：命令的靶心是愛；罪魁和蒙憐憫要一起念，草圖畫的是主的忍耐；推開良心會破船，懲戒是為了挽回。"],["n","1. ★ 說一次你吵贏了卻不太開心的經驗：家裡、群組，或公司會議上。吵完以後，你和那個人的關係怎樣了？"],["n","2. ★★★ 第五節說命令的靶心是愛。請用一句話說：為甚麼說不可以也可能是愛？說不可以的人，又要先用哪三面鏡子照自己？"],["n","3. ★★ 第十三節保羅說從前是，第十五節說我是。請說出這兩個時態的分別，以及為甚麼罪魁和蒙憐憫一定要一起念。"],["n","4. ★★ 第十六節的草圖上畫的是誰？聽見證的時候，更佩服作見證的人，和更愛那位忍耐他的主，會有甚麼不同？"],["m","帶領提醒：第十五、十六節請一口氣讀完。談到第十節時，不讓任何人說羞辱或開玩笑的話。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人照出自己射偏的地方，說出船底那一條一直不修的裂縫，並說出這一週要修補的那一件事或那一個人。"],["t","【看】看見自己"],["n","5. ★★★ 用第五節的三面鏡子照自己，最近哪一面最模糊？說一件具體的事：在哪裡、對誰，你守住了自己的對，卻沒有流出愛來。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀第十五、十六節兩遍，第二遍把「我」換成你自己的名字。讀完說一句：你聽見主對你有怎樣的忍耐？"],["t","【想】想通關卡"],["n","7. ★★★ 你船底那一條一直說這次就算了的裂縫，為甚麼還不修？是怕丟臉、怕失去位子、覺得大家都這樣，還是不知道從哪裡開始？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：在罪人中我是個罪魁，然而我蒙了憐憫。右手邊的人只回一句：主對你有一切的忍耐。不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要修的那一條裂縫，或要修補關係的那一個人：名字或關係、星期幾、用甚麼方式、要說的那一句話。若那個人曾讓你不安全，改寫下你要告訴的那一位信得過的人。"],["m","帶領提醒：這一化可能碰到被教會公開處理、被羞辱的經驗，或長期的無望感。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」。若有人說出正處在危險中或有自傷的念頭，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。第六題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天兩半一起念、一次修補關係、一次為被冷處理的人禱告、一個要帶的人。"],["n","10. ★★ 你的小組或同工會下一次聚會，可以怎樣從認罪和感恩開始？說出日期，和你要請誰先分享一句我蒙了憐憫。"],["n","11. ★ 看一看你這一週的轉貼和留言，說出一則你要刪掉的只生辯論的訊息，和你要改送祝福的那一個人。"],["n","12. ★★ 說出一位曾被你或教會冷處理、或自己離開的人，可以只說關係。這一週哪一天你要為他指名禱告？在合宜、安全的情況下，怎樣讓他知道燈還亮著？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，和這一週哪一天你要向他分享：連罪魁都蒙了憐憫，你也可以。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一個逼迫基督徒的人，後來說自己是罪人中的罪魁。第二句，耶穌沒有放棄他，用他的一生畫了一張草圖，讓人看見主的忍耐有多長。第三句，所以不管你覺得自己多糟，也可以來到這一位面前。下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收我會多愛人一點這類答案；若那個人曾傷害組員，不勉強他接近。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要修的那一條裂縫，或我要去找的那一個人。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位被留在衝突中間的同工；一位曾被教會處理過、如今離開了的人；一位像從前的保羅一樣反對福音的家人。"],["p","最後一起讀第十七節，讀到阿們，停三秒，再散會。"]]},"2":{"no":2,"vol":"《321提摩太前書講義》第二課·提摩太前書第二章","title":"只有一位中保——禱告、中保、學道","chars":5190,"min":60,"deep":8,"dchars":1710,"tchars":1417,"blocks":[["h","一、一張只寫得下一個名字的紙"],["p","弟兄姊妹平安。開始以前，請你先回答一個問題：如果今天晚上你只能為一個人禱告，而且這個人不能是你自己，不能是你的家人，也不能是坐在這間教會裡的人，你會寫下誰的名字？請你真的想一想，先不要急著聽我往下講。"],["p","這個問題一問出來，常常會安靜很久。有人寫下一位同事，有人寫下樓下的鄰居；很少有人寫下一位市長、一位校長，更少有人寫下一位得罪過他的人。這張紙很小，卻很誠實，它量出來的是我們禱告的範圍有多寬。"],["p","提摩太前書第二章，就從這一張紙開始。請記得第一章是怎麼結束的：「有人丟棄良心，就在真道上如同船破壞了一般。」（1:19）教會裡有人翻了船，保羅還點了兩個人的名字。換作我們，下一章大概要寫整頓、寫規章、寫誰該被請出去。保羅寫的卻是：「我勸你，第一要為萬人懇求、禱告、代求、祝謝；」（2:1）"],["p","「第一」原文是 πρῶτον πάντων（prōton pantōn），是一切事情裡面的先。神的家第一件事不是開會，是禱告。四個字都是複數，有人想把它們拆成四個步驟；其實保羅要說的是各樣的禱告，為各樣的人。四個字裡最難的是最後一個：祝謝。為一位難相處的同工代求還可以，為他感謝，就得先承認神在他身上也有工作。"],["p","用書信三問來讀，第一問的答案是：以弗所的假教訓喜歡講家譜，家譜是用來分你我的。禱告的範圍一放到萬人，那個圈子就破了。這封信寫給提摩太一個人，卻要在全會眾面前念出來，所以這一課是講給講台上的人聽，也是講給坐在下面的你聽。我們沿著三個詞走：禱告、中保、學道。"],["d",["懇求、禱告、代求、祝謝這四個字，是不是一套要照順序走的禱告步驟？","不是。四個字在原文都是複數，有人替它們劃出界線：懇求是因缺乏而求，禱告是向神的一般禱告，代求在當時的文件裡常指替人向君王遞的陳情書，祝謝是感謝。字義的色彩可以講，但保羅的重點是範圍：各樣的禱告，為各樣的人。做成公式，會叫人把禱告當成要照格式交的作業，少了一步就擔心不蒙垂聽。可以實際試的，是替一個具體的人寫一張具體的陳情，說出他的名字和需要；再為一個不容易為他感謝的人，找出一件真的可以感謝的事。"]],["h","二、為在位的禱告，因為神也願意他們得救"],["p","保羅接著點出一群特別的人：「為君王和一切在位的，也該如此，使我們可以敬虔、端正、平安無事地度日。」（2:2）寫這封信的時候，坐在寶座上的是羅馬皇帝，各省有總督，沒有一位是基督徒；「君王」在原文是複數，全都包了進去。保羅沒有先評估他們好不好，才決定要不要為他們禱告。"],["p","這一節常被兩邊拿去用：有人用它要基督徒擁護某一個政權，有人嫌它太軟，不肯為自己不喜歡的領袖禱告。經文兩條路都不走。所以這一課守住同一條線：我們不替任何當代政權背書，也不攻擊任何當代政權，不在這裡評價任何一個國家的現任領袖。我們為那個職分禱告，也為坐在那個職分上的那一個人禱告。"],["p","禱告求的是甚麼？經文寫得清楚：敬虔、端正、平安無事地度日。不是特權，不是影響力，是一個可以安安靜靜過敬虔日子的空間。先知對被擄的百姓也這樣吩咐：「你們要為那城求平安，為那城禱告耶和華」（耶 29:7）。接著保羅說：「這是好的，在神我們救主面前可蒙悅納。」（2:3）那個時代的石碑常稱皇帝為救主，保羅為皇帝禱告，卻把救主這個稱號留給神。為在位者禱告，不等於敬拜在位者。"],["p","然後是更深的理由：「他願意萬人得救，明白真道。」（2:4）為在位的人禱告，是因為神也願意他們得救。坐在高位上的人，在神眼中也是一個需要救主的人。只罵不禱告，忘了這一點；只求他們保護教會，也忘了這一點。寫這封信的人，從前是「逼迫人的，侮慢人的」（1:13），神既然願意救一個罪魁，就沒有一個人在他的心意之外。"],["p","這不是說最後人人都會得救，神「是萬人的救主，更是信徒的救主」（4:10）。所以保羅緊接著說，他奉派作「外邦人的師傅，教導他們相信，學習真道」（2:7）。請記住「學習」這兩個字，等一下它會回來。"],["d",["如果在位的人限制、甚至逼迫教會，我們還要為他們禱告嗎？","要。保羅寫信的時候，掌權的沒有一位是基督徒；主耶穌也說要為逼迫你們的禱告。禱告的理由不是在位者好不好，是 2:4 神願意萬人得救。但要分清楚兩件事：為人禱告，不等於支持他所作的一切，也不等於在良心的事上放棄順從神；使徒們在公會面前就說過要聽從神。所以這一課不替任何當代政權背書，也不攻擊任何當代政權。對正在受苦的弟兄姊妹，先聽他說完、承認他的苦是真的；涉及人身安全，私下關心，協助他找到可靠的支援。詳見本章議題頁。"]],["d",["既然神願意萬人得救，為甚麼不是每一個人都得救？","這一題各派都承認有奧祕，經文在這裡沒有展開，卻給了線索。2:4 的「得救」是被動，是神的作為；「明白真道」的「來到」是主動，人要走進去。4:10 說神是萬人的救主，更是信徒的救主：救恩向萬人敞開，信的人進入。本卷也明說有人在真道上船破了，所以這一節不是說最後人人都會得救。本講義沿用以弗所書的立場：神真實地願意每一個人得救，這份心意不是假的；也承認上下文的君王與外邦人，正是當時被認為最不可能的人。對一位為不信的家人禱告多年的人，這一節的意思是：你不是在求神作一件他不想作的事。爭議與信心的全卷立場見議題頁。"]],["h","三、原文亮光：一位中保、一份贖價、一個安靜的字"],["p","我們憑甚麼可以為萬人禱告？第五節第一個字就是答案：「因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌；」（2:5）原文是兩個平行的「一」：εἷς γὰρ θεός（heis gar theos），εἷς καὶ μεσίτης（heis kai mesitēs）。神是一位，所以他是萬人的神；中保是一位，所以他是萬人的中保。正因為只有一位，門才向所有的人開。"],["p","第一個字，μεσίτης（mesitēs），就是站在中間的人。華人很懂這個字：結婚有媒人，辦事要託關係。提摩太所在的城也是這樣，有祭司、有卜者、有護身符，要見神先找人。保羅說：不必一層一層轉介，已經有一位站在中間。原文接著把 ἄνθρωπος Χριστὸς Ἰησοῦς（anthrōpos Christos Iēsous）的「人」字放在最前面：中保要兩邊都碰得到，他是神，能代表神向人說話；他是人，懂我們的軟弱與眼淚。"],["p","第二個字，ἀντίλυτρον（antilytron），贖價，整本新約只在這裡出現：「他捨自己作萬人的贖價，到了時候，這事必證明出來。」（2:6）贖價是付給主人、換回奴隸自由的那一筆錢。主耶穌自己說過，他來「並且要捨命作多人的贖價」（可 10:45）。保羅用的動詞是 ὁ δοὺς ἑαυτὸν（ho dous heauton），他給出去的不是一樣東西，是他自己。這位中保不是靠地位站到中間的，是把自己交出去才站上去的。"],["p","第三個字很小，卻是讀這一章的鑰匙。2:2 的「平安無事」裡有一個 ἡσύχιον（hēsychion），安靜；2:11 和 2:12 的「沉靜」是 ἐν ἡσυχίᾳ（en hēsychia），同一個字根。也就是說，安靜是保羅先向全教會要的，不是先向姊妹要的。它不是一句話都不准說，是安靜受教的樣子，正好和第八節的忿怒、爭論相反。在真道面前，我們每一個人都是學生。"],["p","所以 2:1 的彼此代求和只有一位中保並不衝突：代禱的人不是另一層中介，是一起敲門的家人。講台上的人不是會眾和神中間的那一層，只是指路的人；坐在下面的你也不必覺得，要牧師替你禱告才比較有效。同一位中保，同樣近。"],["d",["只有一位中保，那麼請弟兄姊妹代禱、向馬利亞祈求、祭拜祖先各算甚麼？","請活著的弟兄姊妹代禱，是同一個家的人一同到同一位神面前，靠同一位中保，這正是 2:1 的吩咐。天主教與東方教會也承認基督是唯一的中保，向聖徒祈求是請天上的家人一同代禱；更正教則不向離世的聖徒祈求，因為信徒可以直接藉著基督到父面前。本講義站在後者，但不嘲笑天主教的朋友。祭祖取紀念而不祈求：孝敬父母是應當的，追思、獻花、陪伴、照顧長輩都可以；祖先卻不是我們到神面前的中保，也不是保佑我們的靈。這一句是要告訴人路已經開了，不是用來和家人決裂的。"]],["h","四、先放下忿怒，再讀最難讀的那幾節"],["p","接下來這幾節，有人曾經被它傷過，也有人準備好要吵一架。所以請先別跳到第十二節，先聽第八節：「我願男人無忿怒，無爭論，舉起聖潔的手，隨處禱告；」（2:8）這一段的第一條規矩是對男人說的，說的不是誰可以站講台，是禱告的人心裡不可以有火。原文 χωρὶς ὀργῆς καὶ διαλογισμοῦ（chōris orgēs kai dialogismou），一個是心裡的火，一個是口裡的火。為這段經文吵架，就已經違背了這段經文的第一句。"],["p","然後保羅轉向姊妹，講到妝飾。他列的編髮、黃金、珍珠、貴價的衣裳，是當時富家炫富的全套。所以重點在下一句：「只要有善行，這才與自稱是敬神的女人相宜。」（2:10）這不是服裝規定，更不是叫弟兄去檢查姊妹的穿著；弟兄的功課，第八節已經給了。"],["p","現在我們來到 2:11：「女人要沉靜學道，一味地順服。」這一節最常被讀漏的，是第一個動詞 μανθανέτω（manthanetō），讓她學。在當時，女人通常不被正式教導經典；保羅在一封要當眾念出來的信裡，對女人下的第一個命令卻是學。在當時，這是開門。這一段不是從閉嘴開始的，是從進來學開始的。"],["p","「我不許女人講道，也不許她轄管男人，只要沉靜。」（2:12）「轄管」是 αὐθεντεῖν（authentein），新約只出現這一次，各家讀法不同，我把四種並排放在這裡。互補派較嚴的一讀說，姊妹不擔任向全會眾的權威性教導，也不擔任長老、監督。互補派較寬的一讀說，限制只在長老、牧師這一個職分，姊妹可以講道、教導。處境派與平等派說，這是針對以弗所的處境，有些婦女受了假教訓影響，又還沒有學過。中間讀法說，原則是任何人都不可專橫地奪取權柄，男女都一樣。"],["p","各宗派在這件事上有真誠的不同，這一課陳列，不裁判。但有兩條底線四讀都守：不能用一句那只是當時的文化，就把經文一筆勾銷，四讀都在認真讀它；也不能拿這兩節看低任何一位姊妹的價值、頭腦、恩賜和屬靈地位。就在以弗所這座城，「百基拉、亞居拉聽見，就接他來，將神的道給他講解更加詳細」（徒 18:26），百基拉的名字還排在前面。"],["p","再讀 2:13–14：「因為先造的是亞當，後造的是夏娃，且不是亞當被引誘，乃是女人被引誘，陷在罪裡。」第十三節有人讀成超越文化的創造次序，有人讀成針對以弗所處境的提醒。可是有一種讀法，這卷書自己就擋住了：說這兩節在評估姊妹的頭腦。第一章被點名的許米乃和亞歷山大，是兩個男人（1:20）；第五章說到幾位年輕寡婦，「因為已經有轉去隨從撒但的。」（5:15）偏離真道的有男也有女，被騙這件事不分性別。亞當沒有被騙卻吃了，那是明知故犯；兩個人都需要同一位中保。"],["p","還有一讀說，神的命令是在夏娃被造以前直接給亞當的（創 2:16–17），夏娃聽到的是轉述，所以她在創 3:3 多說了「也不可摸」。這一讀可以幫助我們想像那個處境，但經文沒有明說，這一課只把它並陳，不採為定論。各讀都能同意的功課在 2:11：受騙的危險在沒有好好學過真道的人身上最大，所以解藥是學。保羅也用同一個夏娃提醒整個哥林多教會，「就像蛇用詭詐誘惑了夏娃一樣」（林後 11:3），那封信裡男男女女都在。"],["p","最後一節：「然而，女人若常存信心、愛心，又聖潔自守，就必在生產上得救。」（2:15）「得救」原文 σωθήσεται（sōthēsetai），和 2:4 那個「得救」是同一個字。「生產」也有四讀：一讀是那一次生產，就是救主的降生，「為女子所生」（加 4:4）；一讀是神在生產的苦楚裡保全她；一讀是在妻子和母親的呼召裡活出救恩；一讀是在回應那些「禁止嫁娶」（4:3）的假教師。四讀並陳。但有一件事四讀都要面對：這一節寫出的條件是信心、愛心、聖潔、自守，四樣裡面沒有一樣是生育。得救的根據是第六節那一位捨己的中保。"],["p","所以我要對你說話：盼望了很多年、懷裡仍然空著的你；曾經失去一個還沒見面的孩子的你；一個人走著單身的路、忠心服事的你。這一節沒有把你排除在救恩之外，一點點都沒有。寫這封信的保羅自己也沒有成家。神願意萬人得救，萬人裡面沒有少掉你。"],["d",["我的教會不按立姊妹作牧師（或按立姊妹），我該怎樣看別的教會？","先回到 2:8：無忿怒、無爭論。2:12 的四種讀法，都是認真讀過經文之後的選擇，各宗派在這件事上有真誠的不同，這一課陳列而不裁判。所以第一，尊重你自己的教會，也問清楚它採哪一讀、理由是甚麼。第二，尊重別的教會的選擇，不在網上為這件事定罪人。第三，不論哪一讀，都守同一條底線：任何一位姊妹的價值、恩賜、在基督裡的地位，與任何一位弟兄一樣。第四，回到 2:11 的第一個命令：學。你的教會若有姊妹想好好讀經、讀神學，不論採哪一讀，都要有人陪她學。全卷立場見性別與事奉的議題頁。"]],["d",["有人說夏娃聽到的是亞當轉述的命令，所以她才被引誘，這個說法可信嗎？","這是一種讀法，只能並陳，不能採為定論。它的觀察是：神吩咐不可吃那棵樹的果子，是在夏娃被造以前直接對亞當說的（創 2:16–17），夏娃回答蛇的時候又多說了也不可摸（創 3:3）。據此有人推想，她聽到的是轉述，所以更容易被扭曲。這可以幫助想像，但創世記沒有告訴我們亞當怎樣轉述，保羅也沒有這樣說明。所以不要在這一讀上立論，更不要把它講成誰的錯比較大。比較穩妥的功課是各讀都同意的：被騙的危險不在性別，在不學、不查；而亞當沒有被騙卻吃了，兩個人都需要同一位中保。"]],["d",["我不能生育，或曾經流產，讀到「在生產上得救」心裡很痛，該怎麼讀？","請先聽清楚：這一節沒有把你排除在救恩之外。得救的根據是 2:6 那一位捨自己作萬人贖價的中保，是 1:15 基督耶穌降世為要拯救罪人，不是任何人的身體能不能生。這一節自己寫出的條件，是信心、愛心、聖潔、自守，四樣裡面沒有一樣是生育。「生產」有四讀，沒有一讀說不能生的人不能得救。寫這封信的保羅自己也沒有成家。若你的心還很痛，不必勉強自己立刻好起來；找一位信得過的人陪你，必要時尋求專業的協助。組長在組裡聽到這樣的事，不追問細節，會後單獨關心。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 2:1–2 替某一個政權、政黨或領袖背書，暗示為他禱告就是支持他；或反過來，用為他禱告的名義說出攻擊他的話。2:4 的理由是神願意他得救，講台不是評論台。"],["p","第二個偏差，是講台上的人把自己講成會眾和神中間的一層，說沒有經過我的禱告神不會聽；或拿 2:5 嘲笑還在拜祖先的長輩。這一句是告訴每一個人路已經開了，不是一根指著別人的手指。"],["p","第三個偏差，是用 2:11–15 的任何一種讀法看低姊妹，說姊妹只適合在後面幫忙，或說她們的判斷不可靠，屬靈的事要由弟兄替她們決定。這卷書自己就說偏離真道的有男也有女；用這段經文看低姊妹，比讀錯一個字更離經文遠。"],["p","第四個偏差，是只講沉靜、不許，不講第一個命令是學；或反過來，一句那是當時的文化就把整段跳過。前者把保羅打開的門講成關上的門，後者沒有認真讀經文。"],["p","第五個偏差，是把 2:15 講成生兒育女是姊妹得救的條件，或暗示不孕、流產、單身的姊妹在神面前比較次等。條件是信心、愛心、聖潔、自守；根據是那一位捨自己作萬人贖價的中保。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：飯桌和群組上的政治。選舉一到，家族群組裡的話越來越冷，同一間教會的人說起某一位掌權的人，一邊擁護，一邊咒罵，有的家吵到過年不同桌。2:1–4 不叫我們假裝沒有看法，卻改變我們開口的次序：先禱告，再說話。為那個職分禱告，為那個人得救禱告，求的是大家都能敬虔、端正、平安無事地度日。可以問自己：這一週我為他說過的話，罵的多，還是禱告的多？"],["p","第二個問題：祖先牌位與傳宗接代。很多華人家裡，這兩件事綁在一起：要拜祖先，也要有人傳香火。清明節要不要拿香，過年長輩一句甚麼時候生，都叫人坐立不安。2:5 說祖先不是我們到神面前的中保，可是孝敬父母是應當的，可以陪伴、追思、獻花、照顧長輩，紀念而不祈求。2:15 也告訴那位被長輩追問的姊妹：你在神面前的位置，不是由你能不能生來決定的。多陪長輩吃幾頓飯，比贏他幾句辯論更像那一位捨己的中保。"],["h","七、活出321——讓出中間的位置"],["p","走到這裡，我們才把國度321空中團契常說的「無己」接上去。它的源頭不在我們的意志力，在 2:6：他捨自己。無己先是基督的樣子，然後才是我們的操練。"],["p","耶穌是我的榜樣：他被釘的時候，為判他、釘他的人禱告：「父啊！赦免他們；因為他們所做的，他們不曉得。」（路 23:34）他為在位的人禱告，卻不向在位的人屈膝；他也讓馬利亞坐在腳前聽道，先教那些不被教的人。"],["p","聖經是我的準則：先讓經文說完。2:12 陳列四讀，不把我喜歡的那一讀當成中保的話；2:15 讀到條件子句，不替經文加上生育這個條件。"],["p","聖靈是我的引導：那張只寫得下一個名字的紙，求聖靈替你指出那個名字；在最難讀的經文上，求他給你溫柔的口和受教的心。"],["p","讓耶穌作王：讓出兩個位置。一個是中間人的位置，傳道人不作門路，會眾不把禱告外包；一個是贏的位置，在 2:11–15 上，我的讀法不是他的寶座。可以檢查：這一週我最後一次非要別人照我的意思不可，坐在中間的是誰？"],["p","讓耶穌得著一切的榮耀：救主這個稱號，保羅留給了神。一個為萬人禱告的教會，被看見的不是講員多會講，是那一位用自己作贖價的主。"],["p","建立屬神的體系：讓公禱回到聚會的最前面，為城裡的官長、鄰舍、不信的家人指名禱告，只為職分與人，不發表政見；讓每一個人都被教，新來的、年長的、從前沒有機會學的姊妹，都有人陪著讀經；讓爭議有一張安全的桌子，教會採哪一讀要說出理由，也說出底線：任何一位姊妹都不因此被看低。"],["h","八、四種心，怎樣走到那一位中保面前"],["p","驕傲型的心，喜歡站在中間。也許你暗暗喜歡別人說先問過你神才會聽，也許你在 2:11–15 上非吵贏不可。這一章只問你一句：中間那個位置，是一位捨了自己的人站上去的，你要拿甚麼站上去？"],["p","恐懼型的心，不敢自己走到神面前，總要找一個比較屬靈的人替你開口；或者一讀到為在位者禱告，就怕被人看成站哪一邊。請聽 2:5：中保只有一位，而且是一個人，懂你的害怕。你可以今天就直接說：主耶穌，我靠著你來。"],["p","羞恥型的心，也許是一位從小沒有被好好教過的姊妹，覺得自己讀不懂、不配問；也許是一位被長輩追問為甚麼還沒有孩子的人。請聽 2:11 的第一個命令：學。神的家為你開了門，你不是來旁聽的，你是被請進來的學生。"],["p","受傷型的心，也許你曾經被人用這幾節經文擋在門外，被說過次等，或在流產、不孕的路上，聽過一句讓你再也不想進教會的話。今天不必立刻原諒誰，也不必假裝沒事，先把那一句話帶到中保面前；若那個傷還很深，請找一位信得過的人，讓人陪你找到專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，寫一張陳情名單，三個名字：一位在位的人（只寫職分和名字，不寫評語）、一位得罪過你的人、一位還不信的家人。每天早上為他們各說一句：主啊，願他得救，明白真道。"],["p","第二，為名單上的一位找出一件可以祝謝的事，這一週至少有一天，只為他感謝，不為他代求。"],["p","第三，這七天，每當你在心裡或群組裡想罵一位掌權的人，就停下來把那一句改成一句禱告，記下時間和對象；週末數一數。"],["p","第四，下一次你想找人替你傳話給神的時候，自己先開口，直接說：主耶穌，我靠著你來。"],["p","第五，約一位從來沒有被好好教過聖經的人，新朋友、長輩，或覺得自己讀不懂的弟兄姊妹，定一個時間陪他讀 2:1–7，先問他讀到了甚麼，不急著講你的看法。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神願意萬人得救，明白真道；我的禱告名單不再比神的心窄。"],["p","我宣告：在神和人中間只有一位中保，就是降世為人的基督耶穌；我不必另找門路，也不作別人的門檻。"],["p","我宣告：他捨自己作萬人的贖價，我是被他用自己贖回來的人。"],["p","我宣告：在真道面前我是學生；我不為這段經文吵架，我要和弟兄姊妹一起學。"],["d",["在主日或小組裡為在位的人公開禱告，怎樣才不會變成發表政見？","可以守三條規矩。第一，只提職分和名字，不加評語，也不提政黨。第二，照 2:2 和 2:4 求兩件事：求神使這城的人可以敬虔、端正、平安無事地度日；求神使這一位在位的人得救，明白真道。第三，為不同層級的人輪流禱告：這週為市長，下週為校長，讓會眾記得神願意萬人得救。帶領的人可以先問自己：一位政治立場和我相反的弟兄姊妹聽完，是被帶到神面前，還是被推到門外？若是後者，就刪掉那一句。"]],["h","十、結語"],["p","請你再看一次那張紙。也許你寫不出名字，也許你寫了一個很不想寫的名字。不要緊。第二章告訴我們，你寫下的那一個人，不在神的心意之外；你為他禱告的時候，也不必找人替你遞狀子，因為有一位已經站在中間。"],["p","這一課的焦點，不在我們終於把 2:12 弄清楚，也不在我們的禱告名單變得多長。焦點在保羅寫下的那一句：只有一位中保，乃是降世為人的基督耶穌，他捨自己作萬人的贖價。我們能為萬人禱告，是因為他為萬人捨了自己；姊妹被請進來學，弟兄先放下忿怒，都是因為大家站在同一位中保面前。你不必更佩服誰，只要更認識這一位中保。"],["p","我們一起低頭禱告。願意萬人得救的父神，我們的禱告名單常常比你的心窄，求你赦免。謝謝你差來那一位中保，降世為人，捨自己作萬人的贖價。我們把紙上的名字交給你，求你使他們得救，明白真道，也使這城的人可以敬虔、端正、平安無事地度日。求你安慰那些在等候、失落、單身的路上流淚的姊妹，讓她們知道自己在萬人裡面；求你教我們在最難讀的經文上不吵，一起學。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不辯論誰的讀法對，是讓每一個人寫下一個名字、說出一次想找門路的經驗、走一步學的路；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是禱告、中保、學道。席上可能有因為 2:11–15 受過傷的姊妹，也可能有正在不孕、流產或單身的路上流淚的人；小組不辯論立場，請先讀三段的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：神的家第一件事是為萬人禱告，因為神願意萬人得救；神和人中間只有一位中保；2:11 的第一個命令是學。"],["n","1. ★ 你有沒有替別人寫過一封求情的信、打過一通拜託的電話？那一次是為了誰、在甚麼場合，結果怎麼樣？"],["n","2. ★★★ 保羅說為在位的人禱告，是因為神願意萬人得救。請用一句話說：這和為了讓他保護教會而禱告，有甚麼不同？"],["n","3. ★★ 只有一位中保，為甚麼不會和彼此代禱衝突？請說出代禱的人和中保最大的分別是甚麼。"],["n","4. ★★ 2:11 的第一個動詞是學。為甚麼說在當時這是開門？只講沉靜和不許、不講學，會讓一位姊妹聽成甚麼？"],["m","帶領提醒：小組不辯論立場，2:12 的四讀只並陳，不投票、不定誰對；談政治時只說職分，不評價任何現任領袖。若有人說到不孕、流產或性別上受的傷，不追問細節，會後單獨關心，必要時協助尋求專業協助。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己禱告名單的窄處、一次想找門路的經驗，以及這一週要為誰禱告、陪誰學。"],["t","【看】看見自己"],["n","5. ★★★ 說出一位你最不想為他禱告的人，可以只說職分或關係，不必說政治立場。上一次想到他的時候，你心裡的第一個字是甚麼？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:4–6 兩遍，第二遍在「萬人」那裡停一下，放進那個人的名字，也放進你自己的名字。讀完說一句你聽見了甚麼。"],["t","【想】想通關卡"],["n","7. ★★★ 你不直接到神面前、總想找人替你開口，卡在哪裡：覺得自己不夠格、怕說錯、習慣靠別人，還是曾經被人說過不配？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我不必另找門路，主耶穌已經站在中間。」右手邊的人只回一句「你可以直接來」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要為他禱告的那一個人，星期幾、在哪裡、要為他祝謝的哪一件事；再寫下一位你要陪他讀 2:1–7 的人和哪一天。"],["m","帶領提醒：這一化可能碰到不孕、流產、單身的眼淚，或性別上受過的傷。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。小組不辯論立場，有人想爭 2:12 時，請溫和地帶回 2:8。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一張陳情名單、一次把罵改成禱告、一位要陪著學的人、一個要帶的人。"],["n","10. ★★ 你的小組或團契，上一次在聚會裡為城裡的官長、鄰舍或還不信的家人指名禱告，是甚麼時候？說出下一次聚會要為哪一位禱告，由誰帶。"],["n","11. ★ 選一則這一週讓你生氣的新聞，說出你要在哪一天、為新聞裡的哪一個人禱告一次，不轉發、不留言。"],["n","12. ★★ 說出一位你身邊從來沒有被好好教過聖經的人，新朋友、長輩或一位姊妹，你要在哪一天、在哪裡，陪他讀第一段經文？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：只有一位中保，你可以直接到神面前。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人覺得要見神，得先找一層又一層的人替自己傳話。第二句，聖經說神和人中間只有一位中保，就是耶穌，他把自己當作贖價給了出去。第三句，所以你不必找門路，今天就可以直接向他開口，他也願意你明白真道。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多禱告」這類答案。小組不辯論立場；碰到不孕、流產、性別受傷的題目，不追問細節，會後單獨關心。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要為他禱告的那一個人是誰。可以只說職分或關係。"],["p","然後彼此代禱，為三種人指名禱告：一位在本地掌權的人，只提職分與名字，求神使他得救、明白真道；一位曾經覺得自己不配學、不配服事的人，求主讓他知道自己在神家裡被看重；一位正在為不能生育、流產或單身而流淚的姊妹，求主親自安慰她，讓她知道她在萬人裡面。"],["p","散會以前，確認紙上寫了三樣：你的陳情名單、要陪著學的那一個人、你的那個「2」。下次帶來對。"]]},"3":{"no":3,"vol":"《321提摩太前書講義》第三課·提摩太前書第三章","title":"柱石撐起的是一個人——善工、試驗、奧祕","chars":5227,"min":60,"deep":8,"dchars":1691,"tchars":1383,"blocks":[["h","一、一通打給推薦人的電話"],["p","弟兄姊妹平安。先說一件很多人都遇過的小事。一位弟兄去應徵倉庫主管，履歷、證照都交了，面試也過了。兩天以後，他填的推薦人接到一通電話，是那家公司的人事主管打來的。她很客氣：「他的資歷我們都看過了，今天只想請教您三個問題。」"],["p","第一個問題：他答應的事，會不會做到？第二個問題：他和同事起衝突的時候，是甚麼樣子？第三個問題：經他手的錢和貨，清不清楚？推薦人一題一題回答完，她說：謝謝，我們想知道的就是這些。掛電話以前，她又補了一句：履歷告訴我們他會甚麼，這通電話，是想知道他是誰。"],["p","提摩太前書第三章，很像保羅替神的家打的一通推薦電話。這一課用三個詞走完這一章：善工、試驗、奧祕。"],["p","先問書信的第一問：以弗所教會遇到甚麼？保羅當年在米利都對這裡的長老說過：「就是你們中間，也必有人起來說悖謬的話」（徒 20:30）。這句話應驗了。被自己的領袖傷過的教會，最容易出兩種人：一種把職分當作位子，爭著往上擠；一種心灰意冷，說這種事我再也不碰。"],["p","所以保羅一開口就說：「人若想要得監督的職分，就是羨慕善工」（3:1）。對灰心的人，他說想要服事不是虛榮，這是一件美好的事；對爭位的人，他說你要的是「工」，不是「位」。監督是一份看顧人的工作，要守夜、要扛擔子、要為人的靈魂交帳。主耶穌說得更直接：「誰願為大，就必作你們的用人」（可 10:43）。"],["p","還要先說一件事。這封信寫給提摩太一個人，卻要在全會眾面前念出來。所以這一課有兩層：一層給站在前面服事的人，一層給坐在這裡、也許從來沒有任何職分的你。"],["d",["我在教會裡沒有任何職分，監督和執事的條件跟我有甚麼關係？","關係很大。第一，這封信雖然寫給提摩太，卻要在全會眾面前宣讀；3:15 說「你也可以知道在神的家中當怎樣行」，對象是神家裡的每一個人。第二，十五項裡十四項是品格：有節制、自守、溫和、不爭競、不貪財、好好帶領自己的家、在教外有好名聲。這些不是長執專用的美德，是每一個基督徒本來就該長出來的樣子；保羅只是說，被託付照管別人的人，要先在這些事上被看見。第三，你把服事當座位還是當善工，會影響整個教會選出甚麼樣的人。"]],["h","二、十五項裡的十四項"],["p","我們把那一份推薦表攤開來：「作監督的，必須無可指責，只作一個婦人的丈夫，有節制，自守，端正，樂意接待遠人，善於教導」（3:2）。從第二節數到第七節，一共十五項。十五項裡，只有「善於教導」是一種能力，其餘十四項都是生命。連那一項能力，也夾在品格的中間：一個人怎樣活，就怎樣教。排第一的「無可指責」，不是完美無罪，是沒有一個明顯的破口讓人拿來羞辱福音。"],["p","第二項最重，我們要慢慢讀：「只作一個婦人的丈夫」（3:2）。歷來有四種讀法。第一讀說，這是禁止多妻。第二讀說，這是禁止離婚再婚。第三讀說，連喪偶以後再婚也不可以。第四讀說，這是一個對妻子專一忠誠的人，一心只屬一個女人的男人。本講義以第四讀為主軸，其餘三讀並陳。為甚麼採第四讀？因為清單上其他各項，有節制、自守、端正、溫和，全都是一個人現在的品格，沒有一項在翻他過去的紀錄。這一節也不是要求監督必須結婚，否則一生單身的保羅，連自己定的條件都不合。"],["p","在那座有神廟祭儀、有宴席放縱的城裡，一個領袖對妻子忠不忠誠，不是私事，是福音掛在門口的招牌。這幾個字真正在問的是：他的心有沒有一個方向？"],["p","可是我也要很清楚地說另一件事。寫這張清單的人，剛剛在第一章說過自己是誰：「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（1:13）。他稱自己是罪魁，神卻要在他身上顯明一切的忍耐（1:15–16）。神親手用了一個過去最不合格的人。所以這一節不可以拿來羞辱離婚、再婚、單身的弟兄姊妹；有人的婚姻破碎，是被背叛、被遺棄的那一方，有人一生單身，是神親自的帶領。講台和小組，都不是討論任何人婚姻史的地方；教會在按立上若有規定，就照程序，私下、溫柔地處理。這一節要守護的是忠誠，不是給受過傷的人再加一道傷。"],["p","第三節開頭是「不因酒滋事」（3:3）。原文是賴在酒邊、因酒鬧事的人，重點是節制。保羅在同一封信裡還勸提摩太「可以稍微用點酒」（5:23），理由是「因你胃口不清，屢次患病」（5:23），那是藥用，不是鼓勵。所以既不要拿這一節把飲酒本身定罪，也不要把滴酒不沾當成屬靈的資格。但節制有它的溫度：「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好」（羅 14:21）。在座可能有人正在戒酒，有人的家曾被酒毀過；監督的節制，包括為他們甘心不用自己的自由。"],["p","然後保羅從教會轉回家裡：「人若不知道管理自己的家，焉能照管神的教會呢？」（3:5）家是教會的試金石，在講台上溫和、在家裡暴躁的人，最先被家裡的人看穿。保羅要的不是一個完美的家，是一位好好帶領的父親：有秩序，有尊重，有照顧。本講義讀「使兒女凡事端莊順服」，指的是兒女年幼時家裡的秩序；成年兒女還沒有信主，不自動使父親失去資格。「兒子必不擔當父親的罪孽」（結 18:20），信仰不能由父母代替決定。許多忠心的父母，兒女仍然走了遠路，那是他們的眼淚，不是他們的罪狀。"],["p","回到那通電話。人事主管問的三題，幾乎就是 3:2 到 3:5 的濃縮。第七節又說：「監督也必須在教外有好名聲」（3:7）。打電話來的那一位，正是「教外」的人。鄰居、同事、生意上往來的人，都是神的家的推薦人。"],["d",["我離過婚，或者再婚了，讀到「只作一個婦人的丈夫」，是不是表示我在神的家裡永遠矮一截？","不是。這一節是監督職分的條件之一，歷來有四讀，本講義以「一個對妻子專一忠誠的人」為主軸，因為清單上其餘各項都是現在的品格，不是過去的履歷。它沒有說一個人在神面前的價值，也沒有說他不能愛人、不能服事。寫這張清單的保羅，從前是褻瀆神、逼迫人的，然而蒙了憐憫。有人的婚姻破碎，是被背叛、被遺棄的那一方；有人再婚，是在神面前重新開始。教會在按立長執上若有自己的規定，應照程序、私下、溫柔地處理，不在講台或小組裡討論。你若因為這一節想坐到最後一排，請找一位信得過的牧者單獨談；你是神家裡的人。"]],["d",["我的孩子已經成年，卻不信主，甚至離開了教會，我還可以服事嗎？","可以。3:4「使兒女凡事端莊順服」歷來有兩讀：兒女年幼時家中的秩序，或成年兒女的信仰。本講義採前一讀，因為「順服」說的是家中的秩序，是父母帶得到、也該帶好的範圍。成年人要為自己的選擇向神交帳，「兒子必不擔當父親的罪孽」（結 18:20），信仰不能由父母代替決定。所以成年兒女還沒有信主，不自動使你失去服事的資格。經文問的是你怎樣帶家：有沒有用愛和端莊建立秩序。許多忠心的父母，兒女仍然走了遠路；那是你的眼淚，不是你的罪狀。請找兩三位肯陪你禱告的人一起守望，不要一個人躲起來。"]],["h","三、原文亮光：煙、試驗、台階"],["p","第一個字是煙。「初入教的不可作監督，恐怕他自高自大，就落在魔鬼所受的刑罰裡」（3:6）。「自高自大」是 τυφωθεὶς（typhōtheis），字根就是煙：被煙燻得頭昏眼花，自己覺得站得很高，其實甚麼也看不清。驕傲不是從外面撲過來的試探，是從裡面冒出來的煙。保羅不是怕新信徒能力不夠，是怕他上去得太快，掌聲長得比根快。這一節也要配著讀兩句：「給人行按手的禮，不可急促」（5:22），以及「不可叫人小看你年輕」（4:12）。問題不在年紀，在根的深淺。"],["p","第二個字是試驗。執事的清單裡沒有「善於教導」，品格的門檻卻一點也沒有降低：端莊，不一口兩舌，不好喝酒，不貪不義之財。中心那一句是「要存清潔的良心，固守真道的奧祕」（3:9）：道理不必花巧，良心卻要乾淨。然後是：「這等人也要先受試驗，若沒有可責之處，然後叫他們作執事」（3:10）。「要先受試驗」是 δοκιμαζέσθωσαν πρῶτον（dokimazesthōsan prōton）。很多時候，試驗就是時間：讓一個人先在小事上服事，看他在沒有人看見的地方，是不是一樣忠心。教會最常犯的錯，就是缺人的時候抓到誰就是誰。按立要慢；慢，是對這個人的保護，也是對羊群的愛。"],["p","第十一節有一個翻譯上的問題，我們要誠實地面對：「女執事也是如此：必須端莊，不說讒言，有節制，凡事忠心」（3:11）。和合本正文寫「女執事」，又在旁邊加註，說原文是女人。所以這一節有兩讀：一讀是女執事，一讀是執事的妻子。主張女執事的人指出，這一節和第八節一樣是開一組新的人；保羅也說過：「我對你們舉薦我們的姊妹非比；她是堅革哩教會中的女執事」（羅 16:1）。主張執事妻子的人指出，下一節立刻又回到執事本人。本講義兩讀並陳，不作裁判，只指出兩件事：這一節夾在執事的條件中間，而監督的條件裡沒有一節提到監督的妻子。不論哪一讀，四項條件都和第八節逐條對應，保羅沒有為姊妹另定一套較低或較苛的標準。「不說讒言」的原文 διαβόλους（diabolous），就是「魔鬼」那個字。"],["p","第三個字是台階。「因為善作執事的，自己就得到美好的地步，並且在基督耶穌裡的真道上大有膽量」（3:13）。「地步」是 βαθμὸν（bathmon），本來是台階的一級。可是保羅說，這一級是「自己」就得到的，不是升上監督的梯子。賞賜不在下一個職位，就在服事本身裡面。一位一生作執事、從沒站上講台的弟兄姊妹，若好好服事了，他在神面前的地步一點也不比誰低。"],["d",["教會缺人，有一位剛信主的弟兄很有恩賜也很熱心，可以讓他馬上帶小組或上台服事嗎？","可以讓他服事，但不要急著放到台前或帶領的位置。3:6 說「初入教的不可作監督」，是怕他被掌聲的煙燻昏；5:22 也說按手不可急促。這不是看輕新人，同一封信也說不可叫人小看你年輕；問題在根的深淺。具體可以這樣做：第一，先給他一件幕後的事，例如迎新、收場、陪一位組員。第二，安排一位成熟的同伴陪他服事三個月，聊事工，也聊他的家。第三，三個月後一起回顧：答應的事有沒有做到？被糾正時是甚麼反應？這就是 3:10 的先受試驗。慢，是保護他，也保護整個家。"]],["d",["3:11 到底是「女執事」還是「執事的妻子」？我們教會該怎麼辦？","這一節原文只寫「女人」，和合本正文作「女執事」，又誠實地加註。主張女執事的人說：這一節和 3:8 一樣是開一組新的人；四項條件與 3:8 逐條平行；保羅也稱非比為堅革哩教會的女執事。主張執事妻子的人說：這一節夾在執事的條件中間，下一節又回到執事本人，而且沒有自己的婚姻條件。本講義兩讀並陳，不作裁判，只指出：這一節與執事的工作緊緊相連，而監督的條件裡沒有一節提到監督的妻子。各宗派怎樣落實，回到全卷立場二、三。不論哪一讀，都不可拿來貶低姊妹的恩賜與服事。"]],["h","四、柱石撐起的是一個人"],["p","清單寫完，保羅說出他為甚麼要寫：「倘若我耽延日久，你也可以知道在神的家中當怎樣行。這家就是永生神的教會，真理的柱石和根基」（3:15）。這是全卷的鑰匙。第二、三章的禱告、男女、監督、執事，都在回答同一個問題：在神的家裡，該怎樣生活？請留意，保羅說的是「家」，不是機構；家規的目的不是控制，是讓一家人能一起活下去。"],["p","以弗所人聽到「柱石」，一定想起城外的亞底米大廟，想起群眾喊了兩個小時的那一句：「大哉，以弗所人的亞底米啊！」（徒 19:28）。保羅用了兩個字：「柱石」是 στῦλος（stylos），把屋頂舉起來；「根基」是 ἑδραίωμα（hedraiōma），新約只出現在這裡，是穩住房子的底座。教會的工作有兩件：高舉真理，守住真理。但這不是說教會在真理之上。柱子不製造屋頂，底座也不發明房子。「你的道就是真理」（約 17:17）；連使徒的話，庇哩亞人也「天天考查聖經，要曉得這道是與不是」（徒 17:11）。"],["p","那麼這些柱子撐起的是甚麼？保羅的回答不是一段解釋。他停下來，開始唱：「大哉，敬虔的奧祕，無人不以為然！就是神在肉身顯現，被聖靈稱義，被天使看見，被傳於外邦，被世人信服，被接在榮耀裡」（3:16）。六行詩，在地與天之間來回：肉身是地，聖靈稱義與天使是天，外邦與世人又回到地，最後被接回榮耀。六個動詞全是被動，行動的是神。柱石撐起的不是一套規條，也不是教會自己的名聲，是一個人。"],["p","第一行有古卷的問題，要平靜地說明。多數早期抄本寫「那一位」，Ὃς（Hos），就是那一位在肉身顯現；另一系古卷寫「神」，θεὸς（theos），和合本照這一系翻成「神在肉身顯現」。兩種讀法說的都是同一位基督，而且「那一位在肉身顯現」本身就預設了他在顯現以前已經存在。基督的神性也不靠這一節才成立：「道就是神」（約 1:1），「神本性一切的豐盛都有形有體地居住在基督裡面」（西 2:9）。異文改變的是這一節的措辭，不是這一位的身分。"],["p","讀到這裡，前面那張清單也有了新的光。條件那麼高，不是因為神的家要一群完美的人，是因為這群人站在一位完美的主旁邊。"],["d",["聽說有的聖經版本在 3:16 沒有「神」字，是不是有人要否認基督的神性？","不必恐慌。3:16 第一行，多數早期抄本寫「那一位」，後來的抄本與多數拜占庭抄本寫「神」，少數寫「那事」。和合本照「神」這一系翻譯；許多學者判斷「那一位」比較可能是原文，因為最早的見證支持它，而且古代大寫抄本裡兩種寫法只差一橫和一條縮寫線，抄寫時容易加上。兩種讀法說的都是同一位基督，「那一位在肉身顯現」本身就預設他先前已經存在；基督的神性也不靠這一節成立，「道就是神」（約 1:1）。用不同譯本的弟兄姊妹，信的是同一位主。"]],["d",["教會是「真理的柱石和根基」，是不是表示教會說的就是真理，不必再查考？","不是。柱子不製造屋頂，底座也不發明房子。3:15 說教會撐住真理、高舉真理，不是說教會在真理之上；「你的道就是真理」（約 17:17），教會是被託付來撐住它的。所以庇哩亞人連保羅的話，都「天天考查聖經，要曉得這道是與不是」（徒 17:11）。健康的教會會鼓勵會眾打開聖經查考。若有人拿這一節要求你不可以問、不可以查，那正好把柱子當成了屋頂。而 3:16 緊接著說，柱石撐起的不是一套規條，是一位基督。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 3:2 審查人的過去：把離婚、再婚、單身的弟兄姊妹講成「不合格的例子」，或在講台、小組裡舉某一個人的婚姻史作例子。寫這張清單的人，是一個蒙了憐憫的罪魁。"],["p","第二個偏差在 3:3 的兩頭：一頭把飲酒本身定為罪，把滴酒不沾當成按立的門檻；另一頭拿 5:23 替喝酒說好話，忘了席上正在戒酒、家裡曾被酒毀過的人。經文擋的是醉與失控，要的是節制。"],["p","第三個偏差，是用 3:4–5 責怪兒女還沒有信主、或正在走遠路的父母：「你家都管不好，還服事甚麼？」成年兒女要自己向神交帳，父母需要的是代禱，不是眼光。"],["p","第四個偏差，是把職分變成地位或梯子：爭著上台，把執事當成升長老前的實習，把 3:13 的「地步」講成升遷；或反過來，因為缺人、因為對方有恩賜，就急著把剛信主的人推上台。3:1 說的是善工，3:6 說的是根。"],["p","第五個偏差，是把這一章讀成一份考核表，講到 3:13 就散會，跳過 3:16；或拿 3:15 說「教會說的就是真理」，不必再查考。柱石是撐起那一位的，不是取代他的。"],["d",["所以基督徒到底可不可以喝酒？教會聚餐該怎麼安排才好？","3:3「不因酒滋事」是賴在酒邊、因酒鬧事的人，3:8 也說「好喝酒」，重點是節制與失控。5:23 勸提摩太稍微用點酒，處境是胃口不清、屢次患病，是藥用，不是鼓勵。所以本講義不把飲酒本身定為罪，也不把滴酒不沾當成屬靈資格或按立門檻；教會為見證所定的守則可以尊重，但不要講成聖經的命令。另一面，「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好」（羅 14:21）。聚餐時若知道有人正在戒酒，或家裡曾被酒毀過，最簡單的愛就是不擺酒、不拿酒開玩笑，為他留一個不尷尬的位子。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：資歷、輩分與關係。華人教會選同工，很容易看誰來得最久、誰奉獻最多、誰在社會上有頭銜；或者誰最肯做就先抓誰。這一章把順序擺回來：先問品格，再問恩賜；先試驗，再交託。一位很會辦事的人，若在家裡讓家人害怕、在公司讓同事搖頭，履歷再漂亮，那通電話也過不了。反過來，一位沒有學歷、沒有頭銜、默默收了二十年椅子的阿姨，可能正是這張清單最清楚的樣子。"],["p","第二個問題：面子與閒話。我們從小學會家醜不可外揚，傳道人的家更要看起來完美，於是在外面笑、回家沒人敢說真話；另一面，誰家離了婚、誰的孩子不去教會了，消息在客廳和群組裡傳得比禱告還快。3:4–5 要的不是一個表演出來的家，是一個真實被好好帶領的家；3:11 的「不說讒言」，則把我們的嘴從別人的家門口收回來。知道了一個家的難處，該做的是替他守住、為他禱告，不是拿去傳。"],["h","七、活出321——先生命，再關係，後事工"],["p","經文說完了它自己的話，國度321空中團契才接上去。先說清楚：3:1–13 的監督、執事是地方教會的職分，不是 321 五重職份的插圖，也不是發放頭銜的根據。這一章給我們的是一條次序：品格先於恩賜，生命先於事工。我們常說「先生命，再關係，後事工」，這一章正是這句話最直接的經文土壤。"],["p","耶穌是我的榜樣：3:16 唱的那一位在肉身顯現，在拿撒勒的木匠家裡住了三十年才出來公開服事，沒有急著上台。他說：「我給你們作了榜樣，叫你們照著我向你們所做的去做」（約 13:15），說完就束上手巾，彎下腰洗門徒的腳。"],["p","聖經是我的準則：教會是真理的柱石，不是真理的作者。我們選同工、定規矩、處理難處，都要回到「你的道就是真理」（約 17:17）；團契的傳統一旦放在經文之上，柱子就變成了另一座廟。"],["p","聖靈是我的引導：先受試驗需要分辨，對受過傷的人說話需要溫柔。哪一位新人該再陪一段時間，哪一個家需要安靜的陪伴，求聖靈給我們看見根的眼睛。"],["p","讓耶穌作王：讓出兩個位子。一個是「這個家的主人」的位子：這是神的教會，不是我的事業，也不是哪一個家族的；另一個是「裁判」的位子：審判人過去的權柄在他手上，他在 1:13–16 已經親手用了一個過去最不合格的人。"],["p","讓耶穌得著一切的榮耀：柱子不讓人看柱子，是讓人看見它撐起的那一位。一個在家中專一、在酒桌旁節制、在教外有好名聲的人，就是在自己的肉身裡，讓人看見那一位曾在肉身顯現的主。"],["p","建立屬神的體系：體系的第一層不是組織圖，是一群在自己家中先活出基督的人。具體說：揀選同工先看生命與關係，再看恩賜；新的服事者先有人陪伴；真心尊重一生作執事的人。"],["h","八、四種心，各在這張清單前停在哪裡"],["p","驕傲型的心，一看到清單就想：這幾項我都做到了。或者把清單轉過去，對準牧者、對準別人的家。3:6 那股煙最先燻的是自己的眼睛；這一章對你說：你羨慕的若是座位，請回到「善工」那兩個字。"],["p","恐懼型的心，讀完十五項就想退：我永遠不夠格，乾脆甚麼都不要碰。可是 3:10 的試驗不是一場淘汰賽，是讓根慢慢長出來的時間；3:13 的應許，正是給那些在小事上忠心的人。先接一件小事，就是開始。"],["p","羞恥型的心，聽到 3:2 就低下頭，也許是因為婚姻，也許是因為從前。請你聽寫這封信的人怎樣介紹自己：他是個罪魁，卻蒙了憐憫。神用他，不是因為他的履歷乾淨，是要在他身上「顯明他一切的忍耐」（1:16）。你在神的家裡，不是坐在最後一排的客人。"],["p","受傷型的心，也許曾被人拿這一章翻過舊帳，也許家裡曾被酒毀過，或被一位不配作監督的領袖傷過。這一章不是寫來再傷你的；它正是要保護羊群。今天你不必勉強原諒誰，也不必說出細節；你可以找一位信得過的人，讓人陪你走，必要時也可以尋求專業的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上慢慢讀一遍 3:16 的六行詩，每天停在其中一行，用它向主說一句感謝；第七天把六行連起來念出來。"],["p","第二，挑一天晚上，問一位與你同住的家人：「這個月，我在家裡哪一件事讓你最累？」只聽，不辯解，選一件在七天之內改。"],["p","第三，在神的家裡做一件沒有人會看見的善工：收椅子、洗杯子、探望一位很久沒來的人，寫下是哪一天、為了誰。"],["p","第四，為一位默默服事多年的執事、同工或司事寫一張卡片，具體謝謝他做過的一件小事，這個主日親手交給他。"],["p","第五，檢查你在教外的名聲：在公司、社區、網路上，有沒有一句話、一筆帳、一次失約會讓旁人對你的信仰搖頭？找出一件，這一週補上。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我羨慕的是善工，不是座位；神的家是神的，不是我的。"],["p","我宣告：我不是因為合格才進到這個家，我是蒙了憐憫的人；我不拿這張清單去量別人，只拿它照自己。"],["p","我宣告：我願意先受試驗，在沒有人看見的地方，一樣忠心。"],["p","我宣告：柱石撐起的是那一位在肉身顯現、被接在榮耀裡的主；我這根柱子，是為他站的。"],["h","十、結語"],["p","我們回到那一通電話。人事主管掛電話以前說：履歷告訴我們他會甚麼，這通電話是想知道他是誰。其實你的鄰居、同事和家裡的孩子，每天都在問同樣的問題，只是沒有撥號。他們想知道的，最後不只是你是誰，也是你所信的那一位是誰。"],["p","所以這一課的焦點，不在一份多麼高的條件，也不在誰合格、誰不合格。焦點在那一位使條件有意義的主：他在肉身顯現，住在我們中間，走過最低的路，又被接在榮耀裡。他用了一個自稱罪魁的人寫這封信，也照樣用我們這些不夠格、卻蒙了憐憫的人，撐起他的家。你不必更佩服合格的人，你只要更愛那一位被柱石高舉的主。"],["p","我們一起低頭禱告。在肉身顯現的主，謝謝你先向我們顯明了自己，又把我們這些蒙憐憫的人接進你的家。求你赦免我們把服事當成座位，拿你的話去量別人的過去。求你安慰因婚姻、兒女、從前而抬不起頭的弟兄姊妹，保守正在戒酒的人。願我們這些柱子，只讓人看見你。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不是替誰打分數，是讓每一個人拿這張清單照照自己，說出這一週在家裡、在神的家裡、在教外要走的那一步；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是善工、試驗、奧祕。席上可能有離婚、再婚、單身或喪偶的人，有為成年兒女流淚的父母，也可能有正在戒酒的人；請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：職分是善工不是座位；按立要慢，先受試驗；柱石撐起的是一個人。"],["n","1. ★ 你當過別人的推薦人，或請別人當過你的推薦人嗎？對方問了哪些問題？那些問題問的是能力，還是品格？"],["n","2. ★★★ 3:2 到 3:7 十五項條件裡，只有一項是能力。請用一句話說：為甚麼保羅先問「你是誰」，再問「你會甚麼」？這和 3:1 的「善工」有甚麼關係？"],["n","3. ★★ 3:2「只作一個婦人的丈夫」有四種讀法。請說出本課的主軸讀法，並說出兩個理由；再說為甚麼 1:13–16 要和這一節一起讀。"],["n","4. ★★ 3:15 說教會是真理的柱石和根基，3:16 說柱石撐起的是誰？請用柱子和屋頂的比喻，說出教會和真理的關係。"],["m","帶領提醒：第一題輕鬆帶；討論 3:2 時只談經文的四讀，不舉任何一位組員、同工或知名人物的婚姻作例子，也不評論在職的長執。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人拿這張清單照自己，不是量別人，並說出這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 你在外面和在家裡，最不一樣的一件事是甚麼？說出最近一次是哪一天、在家裡的哪一個角落。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:16 兩遍，第二遍停在你最有感覺的那一行，說一句：這一行讓你看見主為你做了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 這一章有沒有一句話，讓你一聽就想縮起來，或一聽就想到別人？不必說細節，只說是哪一節、卡在哪裡：覺得不夠格、怕被看見，還是想當裁判？"],["t","【講】說出口"],["n","8. ★★ 請對右手邊的人說：「我不是因為合格才在神的家裡，我是蒙了憐憫的人；這一週我要在……做一件沒有人看見的善工。」右手邊的人只回「你是神家裡的人」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要在家裡改的一件事：對哪一位家人、星期幾，是多聽他十分鐘，還是少說一句重話？再寫下你要做的那一件善工：哪一天、在哪裡、為了誰。"],["m","帶領提醒：這一化可能碰到婚姻破碎、再婚、單身、兒女的光景、酗酒或家庭傷害。不追問細節，不在組裡討論任何人的婚姻史，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」；若有人顯得難過或退縮，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一位要陪的新人、一張卡片、一件要補上的事、一個要分享的人。"],["n","10. ★★ 照 3:10「先受試驗」：你的小組或服事團隊裡，有沒有一位剛加入的人？這三個月誰陪他一起服事？說出名字，和第一次一起服事的日子。"],["n","11. ★ 說出一位默默服事多年、很少被人謝過的執事、同工或司事的名字，你要在卡片上謝他做過的哪一件小事？哪一個主日交給他？"],["n","12. ★★ 照 3:7「在教外有好名聲」：在公司、社區或網路上，有沒有一句話、一筆帳、一次失約需要補上？說出是哪一件、要向誰補、哪一天。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要在他面前活出專一、節制、溫和的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：神用了一個自稱罪魁的人，也願意用我。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，公司打電話給推薦人，問的常常不是他會甚麼，而是他是誰。第二句，聖經說神的家選人也是這樣，而且神願意用一個過去很不合格、卻蒙了憐憫的人。第三句，這個家撐起的不是一群完美的人，是來到世上又回到榮耀裡的耶穌，我想讓你在我身上看見他。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更注意」這類答案。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我在家裡要改的那一件事，和我要做的那一件善工。"],["p","然後為三種人指名禱告：一位默默服事多年的同工，求主讓他得著美好的地步；一位因婚姻、家庭或兒女抬不起頭的弟兄姊妹，求主讓他知道自己是神家裡的人；一位剛信主的熱心人，求主讓他的根扎得比枝葉快。"],["p","最後一起念一遍 3:16。散會前確認紙上寫了三樣：家裡要改的事、要寫卡片的那一位、你的那個「2」。"]]},"4":{"no":4,"vol":"《321提摩太前書講義》第四課·提摩太前書第四章","title":"敬虔是練出來的——感謝、操練、留印","chars":5161,"min":60,"deep":8,"dchars":1782,"tchars":1419,"blocks":[["h","一、台上一分鐘，台下十年功"],["p","弟兄姊妹平安。華人有一句俗語：台上一分鐘，台下十年功。戲台上的武生翻一個筋斗，觀眾拍一下手，前後不到一分鐘；可是那一個筋斗，是他從七八歲起，天還沒亮就在後台壓腿、吊嗓，摔了上千次才翻得出來的。觀眾看見的是那一分鐘，師父看的是那十年。"],["p","提摩太前書第四章講的，正是台下那十年。這一章有一句話，是整卷書的轉身：「只是要棄絕那世俗的言語和老婦荒渺的話，在敬虔上操練自己。」（4:7）這一課我們用三個詞走完這一章：感謝、操練、留印。先看怎樣感謝著領受神所造的，再看敬虔怎樣一天一天練出來，最後看一個年輕人怎樣在別人身上留下印子。"],["p","先用書信三問的第一問：以弗所的教會和提摩太遇到甚麼？那裡有人傳異教，講家譜、講禁戒；提摩太大約三十多歲，屋裡的長老有幾位比他父親還年長。這封信寫給他一個人，卻要在全會眾面前宣讀；所以這一課，帶領的人要聽，坐著的每一位也要聽。"],["p","第三章剛剛唱完一首詩歌：「大哉，敬虔的奧祕，無人不以為然！」（3:16）歌聲還沒停，第四章第一個字就是「但是」：同一個家裡，已經有人站開了：「聖靈明說，在後來的時候，必有人離棄真道，聽從那引誘人的邪靈和鬼魔的道理。」（4:1）「明說」是說得清清楚楚。這裡的「時候」是時期的字，不是日曆上的某一天；新約把主兩次降臨之間都叫作末後。所以這不是一張時間表，是一塊警示牌：不在這裡算日子，只在這裡看路。"],["p","接著是全卷最低的谷底之一：「這等人的良心如同被熱鐵烙慣了一般。」（4:2）燒傷過的皮膚結成硬疤，摸上去沒有感覺。第一次在報帳單上多寫一筆，手會抖；第五年，就順手了。一顆還會痛的良心是恩典，可怕的是不再痛。而這些人教的，偏偏是一套看起來非常嚴格的東西。"],["d",["「在後來的時候」是不是指我們今天？新聞上的事件是不是應驗了這一節？","這一節的「時候」用的是時期、時機的字，不是日曆上可以計算的某一天。新約把基督兩次降臨之間整段日子都叫作末後；所以提摩太當下已經活在其中，保羅在 4:6 立刻要他把這些事提醒當時的弟兄。本講義的讀法是已然未然：末後從基督第一次降臨已經開始，朝著主再來推進，離棄真道的現象可能越演越烈，但沒有一個世代可以宣告就是這幾年。所以這一節不是叫我們對照新聞、推算還剩幾年，而是叫每一個世代醒著：留意自己聽的道理是不是把人帶回基督，留意自己的良心還會不會痛。落空的是人的時間表，不是神的話。"]],["h","二、問題在禁止，不在選擇"],["p","「他們禁止嫁娶，又禁戒食物，就是神所造、叫那信而明白真道的人感謝著領受的。」（4:3）這一節要讀得很小心，因為它很容易被拿來傷人。請先抓住這一節的動詞：「禁止」。原文 κωλυόντων（kōlyontōn）是現在分詞，一直在攔阻、一直在說不准。保羅反對的不是有人不結婚，也不是有人不吃肉；他反對的是有人把禁戒立成條件：不守，就不夠屬靈；不守，就不能得救。"],["p","所以請聽清楚：一位為了健康吃素的弟兄，沒有錯；一位為了專心禱告禁食三天的姊妹，沒有錯；一位甘心單身、全心服事的同工，更沒有錯。保羅自己沒有結婚。羅馬書說得最清楚：「吃的人不可輕看不吃的人；不吃的人不可論斷吃的人」（羅 14:3）自願是獻給主的，是自由；強加在別人身上，才是捆綁。錯不在選擇，錯在禁止。"],["p","還有一層分寸。佛教、道教的素食與齋戒，有它們自己的傳統，也有許多人真誠的心。我們不拿這一節去嘲笑任何人的信仰，也不把它當成攻擊別人的工具。這一節處理的是教會裡面的事：有人在基督的恩典上，加了一條「不准」。"],["p","那麼，保羅怎樣回答這一份禁止清單？他沒有另外寫一份更長的清單，他回到創世記第一章：「凡神所造的物都是好的，若感謝著領受，就沒有一樣可棄的，」（4:4）神每造一天就說一次好，到第六天，「神看著一切所造的都甚好」（創 1:31）。世界不是陷阱，是禮物；拒絕禮物，並不比送禮的那一位更聖潔。"],["p","中間有一個條件：若感謝著領受。「感謝」和「聖餐」同一個字根，就是把手上的東西，接回送的那一位身上。接著：「都因神的道和人的祈求成為聖潔了。」（4:5）神先說了：這是好的；人再回應：主啊，這是從你來的。飯前禱告不是替食物消毒，是把一張普通的餐桌，變成一個想起創造主的地方。"],["p","哥林多前書講義第八章說過：為了軟弱的弟兄甘心不吃，是愛的自願，不是恐懼的禁令。健康的信仰不是一份越來越長的禁止清單，是一顆越來越會感謝的心。"],["d",["我自己吃素，或每年都會禁食一段時間，4:3 是不是在說我？","不是。4:3 的主要動詞是禁止，描寫的是第二節那一群說謊的人：他們把禁戒立成規條，叫人以為不守就不夠屬靈、不能得救。你自願為健康吃素、為禱告禁食、為服事單身，是你在主面前的選擇，不在這一節所責備的範圍裡。要留意的只有兩件事：第一，不把它當成功勞，好像我禁了這些，神就比較喜悅我；第二，不把它強加給別人，也不暗暗看不起吃的人。自願是獻給主的自由；一旦變成量別人的尺，才走到 4:3 那一邊去了。"]],["d",["過年家裡拜過祖先的菜端上桌，我可以吃嗎？飯前忘了禱告會怎樣？","先說飯前禱告。4:5 的成為聖潔不是消毒：食物本來就是神所造的好東西，禱告是在神的話面前承認這是從他來的，把一張餐桌變成敬拜的地方。忘了禱告，飯沒有變髒，只是錯過了一次感謝，下一餐再開口就好。祭品的問題回到哥林多前書講義第八、十章的原則：參與祭拜不可以，食物本身算不得甚麼；吃不吃，看愛心與在場的人的良心。若有人特別說明這是祭過的，或你吃了會叫初信的人絆倒，可以自願不吃，並溫柔地說明。孝敬父母與敬拜獨一的神並不對立。"]],["h","三、原文亮光：γύμναζε、πρὸς ὀλίγον、ὠφέλιμος"],["p","一顆會感謝的心，不是一夜之間長出來的，是練出來的。保羅先說：「你若將這些事提醒弟兄們，便是基督耶穌的好執事，在真道的話語和你向來所服從的善道上得了教育。」（4:6）「得了教育」原文是被餵養：好的服事者，先是一個天天在吃的人。"],["p","第一個字在 4:7：γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν（gymnaze de seauton pros eusebeian），「在敬虔上操練自己」。γύμναζε（gymnaze）的字根就是希臘城裡的體育場，英文 gymnasium 從這裡來。它是現在式的命令：一直練，天天練。不是一次營會，是明天早上再上場一次。受詞是 σεαυτὸν（seauton），你自己，不是你的會眾或配偶。前半句先要棄絕荒渺的話，今天可能是滑到半夜的短影片：先放下，才拿得起。"],["p","操練的方向是敬虔，介系詞 πρὸς（pros）是朝向。敬虔的根，是第三章那一位在肉身顯現的基督。所以操練不是靠自己的力氣，一級一級爬到神那裡；戲班的學徒天天練功，是因為已經拜了師，不是練好了才准進門。信徒操練，不是為了屬於基督，是因為已經屬於基督。"],["p","第二個字在 4:8：「操練身體，益處還少；惟獨敬虔，凡事都有益處，因有今生和來生的應許。」（4:8）「益處還少」原文是 πρὸς ὀλίγον（pros oligon），可以讀作範圍小，也可以讀作時間短。請聽清楚：少，不是沒有。好好睡覺、規律運動、按時看醫生，都是對神所造的身體負責。也有人倒過來，很會為了身材早起，卻很難為了禱告早起。身體操練的果效，最多陪我們走完今生。"],["p","第三個字是 ὠφέλιμος（ōphelimos），有益處的。它在這一節出現兩次，一次給身體，一次給敬虔，所以這是比較，不是否定。敬虔帶著今生和來生的應許，一個生命跨兩個時代。但「凡事都有益處」不是保證發財、升官、萬事順利；第六章保羅會責備那些以敬虔為得利的人。它的益處是應許：今生有神同在，來生有永遠的生命。"],["p","保羅接著說：「這話是可信的，是十分可佩服的。」（4:9）又說：「我們勞苦努力，正是為此，因我們的指望在乎永生的神；他是萬人的救主，更是信徒的救主。」（4:10）「努力」有些抄本作「受辱罵」，兩讀都通：為福音勞苦的人，既要奮力，也要受辱。「萬人的救主」不是說所有的人最後都會得救，第一節才說有人離棄真道；意思是救恩只有一個源頭，門向萬人敞開。門開著，人仍要進來。"],["d",["「他是萬人的救主」，是不是表示所有的人最後都會得救？我過世的家人呢？","這一節不是普救論。同一卷書說有人離棄真道，第六章說想要發財的人會沉在敗壞和滅亡中；若萬人無論如何都得救，4:16 的持守就失去了意義。神是萬人的救主，意思是：救恩只有一個源頭，門向萬人敞開，基督捨自己作萬人的贖價；他也在今生普遍地看顧萬人。這救恩要藉著信落實在一個人身上，所以說更是信徒的救主。至於你那位到離世都沒有信主的親人，本講義不替神下判語，也不說輕易安慰人的話。你可以把這份心痛帶到神面前：他比你更愛那個人，他的審判絕不會比你的愛更不公道。"]],["d",["這個月我幾乎沒有讀經禱告，很自責，是不是操練不夠神就不喜悅我？","請先聽 4:10：我們的指望在乎永生的神，不在自己的紀錄表。學徒天天練功，是因為已經拜了師；你操練，是因為你已經屬於基督，不是為了換得他的喜悅。把操練變成沒做到就被定罪，正是 4:3 那一條禁止換了一件衣服。可是自責也是一個訊號：你心裡其實想回來。具體可以這樣開始：不要從一天一小時開始，從十分鐘開始；定一個固定的時間和地方，例如早上出門前在餐桌旁讀一段 4:7–10；漏了一天，第二天照常回來，不補、不罰自己。γύμναζε 是現在式，意思是持續；持續不是從不中斷，是中斷了再回來。"]],["h","四、在五個範圍上留下印子"],["p","「這些事，你要吩咐人，也要教導人。」（4:11）然後保羅轉過頭，對提摩太本人說：「不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。」（4:12）提摩太一開口，台下大概就有人在心裡說：這麼年輕，懂甚麼？保羅怎樣幫他？沒有給他一個頭銜，給他五個範圍。別人怎麼想，他管不了；他能負責的，是自己成為甚麼樣的人。"],["p","「榜樣」原文 τύπος（typos），原來是敲打留下的痕跡，後來指印章、模子。印章壓在印泥上，再蓋到紙上，紙上就留下了那個形狀。一位傳道人的生命，本身就在會眾身上壓出印子；人最後不看他的年紀，看他留下的印子。"],["p","五個範圍，一個一個看。言語：說話誠實、帶著恩典，背後說的和當面說的一樣。行為：日常的來來往往，怎樣排隊、怎樣對待餐廳的服務員。愛心：不是只對有用的人好。信心：也可以譯作忠信，答應的事做到。清潔：在男女的關係上，在心思意念裡，都是乾淨的。這五樣，沒有一樣需要年紀才做得到。經驗要靠歲月，品格今天就可以開始練。"],["p","接著是兩件日常的功課。「你要以宣讀、勸勉、教導為念，直等到我來。」（4:13）聚會的第一件事，是把神的話大聲讀出來。然後：「你不要輕忽所得的恩賜，就是從前藉著預言、在眾長老按手的時候賜給你的。」（4:14）恩賜是神賜的；眾長老按手，是教會一同承認、一同交託。被小看的那一天，提摩太可以想起來：我不是自己封自己的。"],["p","最後兩節，是全章的收口。「這些事你要殷勤去做，並要在此專心，使眾人看出你的長進來。」（4:15）保羅沒有要提摩太完美，他要人看見他在往前走。然後是這一節：「你要謹慎自己和自己的教訓，要在這些事上恆心；因為這樣行，又能救自己，又能救聽你的人。」（4:16）請看次序。原文 ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ（epeche seautō kai tē didaskalia）：先看守自己，再看守教訓。"],["p","我們很容易倒過來，勤於檢查別人講得對不對，很少檢查自己的生命；教訓的偏差，常常從生命的偏差開始。又能救聽你的人，不是說傳道人可以作救主，救主只有一位；意思是在真道上恆心到底，自己和聽的人都不被拖走。帶兒女的父母、陪伴人的組長，都在同一個責任裡。看守好自己，就是對身邊的人最好的保護。"],["d",["4:14 的「眾長老按手」到底傳遞甚麼？沒有被按手的服事算不算數？","這一節說恩賜是賜給你的，被動語態，真正的賜予者是神。兩個介系詞分工清楚：恩賜是藉著預言被指明，伴隨眾長老按手被確認；按手本身不是恩賜的來源。安提阿教會也是禁食禱告之後按手打發人，按手是教會在神面前一同承認、一同交託、一同代禱的記號。神可以在這個時刻真實作工，但按手的人不是恩賜的源頭，按手也不是權力或恩膏的轉移。所以不必追逐名人按手，沒有被誰按過，服事也一樣算數。要緊的是保羅那一句不要輕忽，把神給你的那一份拿出來用。教會的責任也不止於按手那一天，被差派的人往後的路，需要眾人持續的代禱。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 4:3 去批評基督徒自願的吃素、禁食或獨身，說禁食是律法主義、不結婚就是不順服；或拿這一段取笑佛教、道教的齋戒。關鍵字是禁止，不是選擇；嘲笑別人的誠意，只會關上福音的門。"],["p","第二個偏差在 4:4–5 的兩頭：一頭說凡神所造的都是好的，所以暴飲暴食、放縱也沒關係；一頭把飯前禱告當成消毒或護身的儀式，好像不禱告就吃會出事。同一節有條件，若感謝著領受；感謝叫人懂得節制，也叫禱告回到真心。"],["p","第三個偏差在 4:8 的兩頭：拿益處還少當作不必運動、不必照顧健康的理由，甚至笑上健身房的人屬肉體；或反過來，把健身、養生、身材數據當成新的信仰。少，不是沒有；可是身體的果效停在今生，敬虔的應許跨到來生。"],["p","第四個偏差，是把操練敬虔講成新的律法：你操練得不夠，神就不喜悅你；每天沒有靈修一小時，就不是好基督徒。這正是 4:3 那一條禁止換了一件衣服。我們操練，是因為已經屬於基督，指望在乎永生的神，不在自己的紀錄表。"],["p","第五個偏差在 4:12 的兩頭：年輕的同工拿這一節封住長輩的提醒，誰質疑我就是小看我；或者會眾拿這一段要求傳道人完美無缺，一點軟弱都不准有。保羅的方法不是要人尊重，是作榜樣；4:15 要的是長進，不是完美。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：初一十五與年節的餐桌。許多弟兄姊妹來自佛教、道教的家庭，母親初一十五吃素，過年整桌菜先上供桌、再上餐桌。剛信主的人常常卡在兩邊。這一章給的路，不是嘲笑母親的齋戒，也不是在餐桌上當眾宣布這些我一律不吃。陪母親吃素的那一天，可以安靜地感謝；面對祭品，不參與祭拜，吃不吃，看愛心與在場的人的良心，可以溫柔地說明。孝敬父母與敬拜獨一的神，並不對立；一顆會感謝的心，常常是家人第一次聽懂福音的地方。"],["p","第二個問題：論資排輩。我們有一句俗話：嘴上無毛，辦事不牢。年輕同工常常一開口就被這句話擋回去；回應也常是兩種：急著拿學歷、頭銜讓人服氣，或乾脆退下來。這一章同時擋住這兩頭：不用頭銜爭，也不必退，在五個範圍上讓人看見。這一段也念給長輩聽：給年輕的人犯錯的空間，也給他長進的時間。下一章保羅立刻教提摩太待老年人如同父親；尊重是雙向的，一個家才站得穩。"],["d",["我是年輕的同工，長輩常常不聽我說，我要怎樣作榜樣而不是辯解？","先記得保羅給提摩太的方法：他沒有給一個頭銜，給了五個範圍。具體可以這樣做。第一，言語：被質疑的時候，先說謝謝你提醒我，我回去想一想，不在當場爭贏。第二，行為：長輩最看的是日常，準時、守約、把交代的小事做完。第三，主動請教：挑一位你最怕的長輩，約他喝茶，問他當年怎樣服事，他講的時候不打斷。第四，承認不足：說錯了就說錯了，4:15 要的是長進，不是完美。若長輩的話已經變成持續的羞辱或控制，不必一個人吞下來，請找你的牧者或一位信得過的同工談。下一章保羅叫提摩太待老年人如同父親；尊重是雙向的。"]],["h","七、活出321——在敬虔上天天上場"],["p","經文先說完了它自己的話：感謝著領受，在敬虔上操練自己，在五個範圍上作榜樣，先看守自己。我們國度321空中團契，才在這裡接上。"],["p","耶穌是我的榜樣：他自己就是感謝著領受的那一位。他拿起五個餅、兩條魚，望著天祝福；他禁食四十晝夜，卻不把禁食立成門徒的條件。他在家鄉被人看輕，卻沒有拿頭銜壓人，在言語、行為、愛心、信心、清潔上，一生沒有留下一處錯的印子。"],["p","聖經是我的準則：次序不可倒過來。先讀 4:3 的禁止與 4:4 的好，先讀 4:7 的 γύμναζε，先讀 4:12 的五個範圍，然後才說任何一套方法。4:7 要我們練的是敬虔；任何操練的方法，都只是走這一條路的工具，不是這一節要證明的對象。"],["p","聖靈是我的引導：「聖靈明說」（4:1），他的引導不只是安慰，也包括警告。當他在你裡面說這樣不對，那份不舒服不是敵人；求他保守我們的良心一直柔軟，也在每一張餐桌上提醒我們說謝謝。"],["p","讓耶穌作王：讓出兩個位子。第一個是立規條的位子：在神說好的東西上，我不再替神加一條禁止，也不拿自己的禁戒去量別人。第二個是要人尊重我的位子：年輕的不靠頭銜，年長的不靠資歷；讓神的話先被宣讀出來，自己退到話語後面。"],["p","讓耶穌得著一切的榮耀：台下的十年功，若是為了台上那一分鐘的掌聲，我們就練錯了方向。保羅說他自己是罪魁，能上場是因為蒙了憐憫：「然而，我蒙了憐憫，是因耶穌基督要在我這罪魁身上顯明他一切的忍耐，給後來信他得永生的人作榜樣。」（1:16）會眾記得的，應當是那一位的忍耐。"],["p","建立屬神的體系：一個屬神的體系不是一份禁止清單，是一群彼此作模子的人：年長的扶持年輕的，年輕的在五個範圍上留下印子。我們常說操練920：每一個和我有關係的人是我的「2」，我在他面前操練無己的「0」，讓聖靈結出「9」。這不是 4:7 要證明的東西；可是當一個人天天朝著敬虔上場，那個場地，常常就是今天和他同桌吃飯的那一個人。量這個體系的尺，在 4:16：聽的人有沒有一同站穩？"],["h","八、四種心，各站在練功房的哪一個角落"],["p","驕傲型的心，守的規矩比別人多，練的功比別人勤，於是暗暗看不起那些不守、不練的人；這一章對你說：凡神所造的都是好的，你多守的那一條，不是你的功勞；4:16 先叫你看守的，正是你自己。"],["p","恐懼型的心，怕吃錯、怕做錯、怕一天沒有靈修神就不喜悅，於是信仰像走鋼索，戰戰兢兢，餐桌上的感謝早就不見了。請聽 4:10：我們的指望在乎永生的神，不在自己的紀錄表。你是因為已經屬於他，才天天上場；今天練不好，明天早上，門還是開著。"],["p","羞恥型的心，覺得自己台下沒有十年功：好幾年沒有好好讀經，健康、成績、成就都比不上人，更不敢想自己能作誰的榜樣。保羅說他是罪魁，主卻在他身上顯明一切的忍耐。模子不是自己先完美才壓得下去的；4:15 要的是長進，你今天往前走一步，就是印子。"],["p","受傷型的心，也許曾經被一份屬靈的禁止清單管了很多年，穿甚麼、吃甚麼、跟誰結婚都有人替你決定；也許曾經因為年輕、因為身體有限制，被人一句話擋在門外。今天不必勉強原諒誰，也不必立刻回到那個地方；先把那份傷告訴一位信得過的人，若那份控制還在繼續，讓人陪你尋求安全與專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每一餐飯前，停十秒，用自己的話說出一樣要感謝的東西：不背固定的禱詞，說出那碗湯是誰煮的、那份工資是怎樣來的。"],["p","第二，寫下你心裡那張沒有寫出來的禁止清單，逐條問：這一條是我獻給主的自願，還是我拿來證明自己、量別人的條件？劃掉一條拿來量別人的。"],["p","第三，挑一個小小的操練，定在每天同一個時間、同一個地方，例如早上七點在餐桌旁讀一章聖經，連續七天。"],["p","第四，從言語、行為、愛心、信心、清潔裡挑一個範圍，選一個你最常出現的場合，這七天在那裡操練它；每晚睡前回想，今天留下的是甚麼印子。"],["p","第五，找一位比你年輕、正在學著服事的人，這一週當面說一句具體的肯定，或請他吃一頓飯、聽他說話；若你自己是年輕的，去向一位長輩請教一件事，以尊重代替辯解。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：凡神所造的都是好的；我不在恩典上加一條禁止，我要感謝著領受。"],["p","我宣告：我不是因為練得好才屬於主；我屬於他，所以我要天天上場。"],["p","我宣告：我要在言語、行為、愛心、信心、清潔上，在身邊的人身上留下好的印子。"],["p","我宣告：我要先看守自己，再看守教訓；我的指望在乎永生的神。"],["d",["我想替自己定一個每天的小操練，怎樣開始才不會三天就放棄？","可以照這三步。第一，只挑一件：不要同時開始讀經、禱告、運動、早睡，挑一件就好，例如每天讀一章聖經。第二，綁一個固定的時間和地點：早上刷牙以後、在餐桌那張椅子上，讓身體記得那個位置；手機放到另一個房間。第三，訂一個小到不會失敗的量：一章太多，就先讀一段，讀完寫下一句今天聽見的話。若中斷了，不要從頭再立一次大志，第二天照原來的時間回來。台下的十年功，就是這樣一天一天累積的；你不是因為練得好才屬於主，是因為屬於主，所以天天上場。"]],["h","十、結語"],["p","我們回到那一句俗語：台上一分鐘，台下十年功。戲演完了，觀眾散了，後台的燈還亮著。那位武生第二天清早，又回到練功房。他知道，那一分鐘是被台下的十年撐起來的。"],["p","可是這一課的焦點，不在我們練得多勤，也不在誰的印子壓得多深。焦點在那一位：他造了萬物，說都是好的；他是永生的神，是萬人的救主；他在保羅這個罪魁身上顯明一切的忍耐，把一個逼迫教會的人，壓成了後來信的人的模子。你不必更佩服台上的人，台上的人也還在長進；你只要更認識這一位，對罪魁滿有忍耐的主。"],["p","我們一起低頭禱告。造天地的主，謝謝你把一切好的放在我們面前；赦免我們常常在你的恩典上加一條禁止，也赦免我們很會為身體早起，卻很少為你早起。求你教我們每一餐都感謝著領受，每一天都在敬虔上操練自己，在言語、行為、愛心、信心、清潔上，在身邊的人身上留下你的印子。求你保守曾經被禁止清單捆綁的人，讓他們知道你先接納了他們。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰練得勤，是讓每一個人說出自己那張隱形的禁止清單、這一週要練的那一個範圍，以及要在誰身上留下印子；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是感謝、操練、留印。席上可能有吃素、禁食或單身的人，有來自他宗教家庭的新朋友，也可能有身體長期病痛的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：4:3 的問題在禁止，不在選擇；敬虔是天天練出來的，少不是沒有；榜樣是在五個範圍上留下印子。"],["n","1. ★ 你有沒有一樣從小練到大的功夫？說一說你最想放棄的是哪一個階段，是誰陪你撐過去的？"],["n","2. ★★★ 4:3 的關鍵動詞是禁止。請用一句話說：為甚麼一位為健康吃素、為禱告禁食的弟兄姊妹，不在這一節所責備的範圍裡？保羅反對的到底是甚麼？"],["n","3. ★★ 操練身體，益處還少：請說出兩種常見的錯讀，再用自己的話說「少，不是沒有」是甚麼意思。"],["n","4. ★★ 4:16 的次序是先自己，再教訓。請說出一個你看過的例子：一個人講得很對，生命卻沒有站住，他的話在別人身上留下了甚麼？不必說名字。"],["m","帶領提醒：第一題輕鬆帶；討論 4:3 時，不在組裡評論任何組員或家人的吃素、禁食或單身，也不拿任何宗教的齋戒當例子取笑。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己那張隱形的禁止清單，並說出這一週要練的一步。"],["t","【看】看見自己"],["n","5. ★★★ 你心裡有沒有一張沒有寫出來的禁止清單：不可以這樣穿、不可以那樣吃、不可以去那種地方才算屬靈？說出其中一條，以及它是從哪一年、哪一個人那裡來的。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:4 和 4:10 兩遍，第二遍讀到「信徒」時換成你自己的名字。讀完說一句：你聽見神怎樣看他放在你面前的那些好東西，又怎樣看你？"],["t","【想】想通關卡"],["n","7. ★★★ 這一週你給身體、手機和工作的時間，和給禱告讀經的時間，誠實地比一比。卡住你天天上場的是甚麼：太累、覺得練不好、怕又中斷，還是覺得神反正不在意？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我不是因為練得好才屬於主；我屬於他，所以我要在……上天天操練。」右手邊的人只回一句「我陪你練」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要練的那一件事：在五個範圍裡挑哪一個、在哪一個場合、每天幾點、對著誰。再寫下你要劃掉的那一條拿來量別人的禁止。"],["m","帶領提醒：這一化可能碰到長期的病痛與身體限制、屬靈控制，或因為守不住規矩而長期覺得自己不夠屬靈的無望感。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一張感謝的餐桌、一個固定的操練、一個要扶持的人、一個要分享的「2」。"],["n","10. ★★ 說出這一週你要在哪一張餐桌上、對著誰，用自己的話開口感謝一次。若那張桌上有家人吃素或拜過的菜，你打算怎樣帶著尊重說明你的信仰？"],["n","11. ★ 說出一位比你年輕、正在學著服事的人的名字，這一週哪一天，你要當面對他說哪一句具體的肯定？若你是年輕的，說出你要請教的長輩。"],["n","12. ★★ 4:13 說聚會的第一件事是宣讀神的話。下一次小組聚會，你願意邀請哪一位平常不太開口的組員，朗讀哪一段經文？說出名字和那一段經節。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」。當場說出他的名字，並說出這一週哪一天，你要向他分享：神所造的都是好的，我正在學著感謝著領受。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，台上一分鐘，台下十年功，好品格也是一天一天練出來的。第二句，聖經說神造的東西都是好的，要感謝著領受，信仰不是一份越來越長的禁止清單。第三句，我不是因為練得好才被神接納，是他先接納了我，所以我天天上場，想在你身上留下好的印子。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多感謝」「我會多操練」這類答案；不替組員決定祭品吃不吃。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要練的那一件事是甚麼，在哪一個場合。"],["p","然後彼此代禱，為三種人指名禱告：一位年輕的傳道人或小組長，求主叫他站穩；一位覺得自己不夠屬靈而遠離的人，求主讓他重新聽見恩典；一位服事到疲憊的人，求主讓他先被主餵養。"],["p","散會以前，確認紙上寫了三樣：要感謝的那一張餐桌、要練的那一個範圍、你的那個「2」。下次帶來對。"]]},"5":{"no":5,"vol":"《321提摩太前書講義》第五課·提摩太前書第五章","title":"勸他如同父親——稱呼、名冊、天平","chars":5262,"min":60,"deep":8,"dchars":1648,"tchars":1338,"blocks":[["h","一、電梯口的一聲林伯"],["p","弟兄姊妹平安。這一課從一段對話開始。星期二晚上，同工會剛散。阿傑二十八歲，是新來的青年傳道；林伯七十二歲，在這間教會作了三十年的執事。剛才在會上，阿傑提出調整青少年聚會的時間，林伯當眾拍了桌子：「你們年輕人懂甚麼？這樣改，教會就散了！」阿傑把文件夾收好，深吸一口氣，走過去。"],["p","「林伯，我送您下樓。」「不用，我自己會走。」「那我陪您走到電梯口就好。」到了電梯口，阿傑開口：「林伯，剛才您說的那件事，我想再聽您講一次。不過有一句話，我也想說給您聽。」林伯看了他一眼：「你說。」「您說怕教會散，我也怕。可是那天青少年那幾個孩子聽到您那樣講，有兩個這個禮拜就沒有來了。」電梯門開了，又關上，林伯沒有進去。過了很久，他問：「你剛才為甚麼不在會上講？」阿傑說：「在會上講，就變成我在打您的臉。我想像對自己的爸爸那樣，跟您說。」"],["p","阿傑沒有把真話吞回去，也沒有當眾揮拳。他先決定怎樣稱呼眼前這個人，才決定怎樣說話。第五章正是從這裡開始：「不可嚴責老年人，只要勸他如同父親；勸少年人如同弟兄；」（5:1）「勸老年婦女如同母親；勸少年婦女如同姊妹；總要清清潔潔的。」（5:2）"],["p","書信三問的第一問：提摩太遇到甚麼？他年輕，面前有白髮的長老、獨居的寡婦，也有以敬虔為得利的人。年輕的傳道人最容易犯兩種錯：不是怕，就是硬。怕的人把真話吞回去，硬的人把真話打出去。保羅給他的第一條路，不是一套程序，是一張家人的名單。"],["p","教會裡的規矩，是從家人之間的稱呼開始的。你怎樣稱呼一個人，就決定你怎樣對他說話。叫一聲父親，你就不會在眾人面前羞辱他；叫一聲弟兄，你就不會把他當成下屬或對手；叫一聲姊妹，你就知道中間要清清楚楚，沒有曖昧，也沒有私下的特權。「總要清清潔潔的」是對提摩太說的，是傳道人自己要守的界線，不是把責任推到姊妹的衣服上。這是家事，不是人事。"],["p","這封信寫給一個人，卻要在全會眾面前念出來：對同工，這是說話的口氣；對會眾，你叫出的每一聲弟兄、姊妹都是承諾：我不把你當外人，也不把你當工具。這一課用三個詞走完這一章：稱呼、名冊、天平。"],["d",["教會說「我們是一家人」，會不會變成人情包袱，甚至不敢說出問題？","會，如果家只剩下溫度、沒有骨架。華人說一家人，常帶著輩分壓力和家醜不外揚。可是 5:1–2 定的是口氣，不是遮蓋；同一章就有名冊、分工、控告的程序，也有「當在眾人面前責備」（5:20）和「不可有偏心」（5:21）。所以人情包袱不是神的家的本質，是家生病了的樣子。健康的神的家，允許人說不，允許人提問題，允許人慢慢靠近；長輩被尊重，卻不是不能被勸的人。若你曾經被「一家人」三個字綁住，可以先保持一點距離，用自己的節奏再一次被帶進這個家。"]],["h","二、原文亮光：打、敬虔、先想"],["p","第一個字在 5:1。「嚴責」原文是 ἐπιπλήξῃς（epiplēxēs），新約只出現這一次，字根是「打」，打上去，像揮出去的一拳。接著 ἀλλὰ（alla）一轉，換成現在式的 παρακάλει（parakalei），「勸」，而且是一直用勸的態度。原文只有一個「勸」，四組人共用。勸不是不說真話，勸是把真話說得像家人。"],["p","第二個字在 5:4：「便叫他們先在自己家中學著行孝，報答親恩，因為這在神面前是可悅納的。」（5:4）「行孝」原文是 εὐσεβεῖν（eusebein），就是全卷那個「敬虔」的動詞。敬虔的操練場不在禱告室，在自己的家。「報答親恩」是 ἀμοιβὰς ἀποδιδόναι（amoibas apodidonai），把受過的恩回報出去。一個在教會很屬靈、卻一年不回家看父母的人，他的敬虔還沒有回家。"],["p","第三個字在 5:8：「人若不看顧親屬，就是背了真道，比不信的人還不好，不看顧自己家裡的人，更是如此。」（5:8）這是全章最常被拿去打人的一句。動詞是 προνοεῖ（pronoei），字面是「先想」：預先想到、預先預備，講的是生活與經濟上的供應安排。它不是順從。新約講兒女聽從，用的是另一個字，對象是還在家中受養育的兒女，同一段也立刻吩咐作父親的「不要惹兒女的氣」（弗 6:4）。"],["p","所以要分清楚看顧和順從。看顧是付一張醫藥費、安排長照、陪一次門診、和兄弟姊妹分工輪流；順從是父母說甚麼就照做。5:4、5:8 要的是看顧。這兩節不可以拿來捆綁成年兒女：若有人從小被打罵、被控制，回到那個家至今仍不安全，教會不可以對他說「你不回家就是背了真道」。先顧安全，必要時尋求專業協助與法律保護，再在安全的距離裡，透過兄弟姊妹或第三方，找出你能盡的那一份看顧。"],["p","反過來也不可以。界線是一個好字，卻不可以成為取消孝道的理由。「當孝敬父母」（出 20:12）仍是帶著應許的誡命；耶穌也責備那些把奉養父母的錢說成「各耳板」的人（可 7:11–12）。界線決定怎樣看顧，不決定要不要看顧。一位年老的母親一個禮拜沒有人去看她，那不是界線，那是 5:8 說的不看顧親屬。"],["d",["我小時候常被父母打罵，到現在回家仍不安全，5:8 是不是說我背了真道？","不是。5:8 的動詞是 προνοεῖ（pronoei），預先想到、供應安排，講的是看顧，不是順從；經文沒有要你回到傷害裡。教會也不可以用這一節叫你回家、叫你原諒、叫你交出收入。你可以先顧自己的安全，必要時尋求專業的協談與法律保護。然後在安全的距離裡，慢慢找出你現在能盡的那一份看顧：也許是透過兄弟姊妹分擔費用，也許是透過第三方聯絡，也許現在甚麼都還做不到，那也可以先帶到神面前。界線決定怎樣看顧，不決定要不要看顧；神看見你的傷，也看見你那一份心。若你此刻仍在危險中，請先告訴一位信得過的人。"]],["d",["我把失智的母親送去安養院，親戚說我不孝，我是不是比不信的人還不好？","保羅講的是不肯看顧，不是看顧的方式。5:8 說的看顧是預先想到、供應安排；把長輩交給專業照護，讓她得到你在家裡給不了的醫療與安全，本身就可以是一種看顧。真正要問的是：你有沒有繼續去看她？有沒有和兄弟姊妹分工，不讓一個人扛下所有？若這些你都在做，你是在報答親恩。照顧者自己的崩潰，不是敬虔的證明；小組可以輪流陪你去探望，或在你最累的那一週替你送一餐。若你已經長期失眠、情緒低落，請尋求專業的協助，這不是軟弱。"]],["h","三、名冊上的名字"],["p","第二個詞是名冊。「要尊敬那真為寡婦的。」（5:3）「尊敬」是 τίμα（tima），在這裡包括實際的供養。那個「真」字 ὄντως（ontōs），在這一段出現三次，像三根釘子把整段釘住。誰是真為寡婦的？保羅說：「那獨居無靠、真為寡婦的，是仰賴神，晝夜不住地祈求禱告。」（5:5）身邊沒有人，她就把盼望放在神身上，而且一直放著。"],["p","然後是那本冊子：「寡婦記在冊子上，必須年紀到六十歲，從來只作一個丈夫的妻子，」（5:9）又要有行善的名聲，接待遠人，洗聖徒的腳。記在冊子上的人，不只是被照顧的人，她們自己就是神家裡服事最久的同工。問題是：你的小組手上，有沒有這樣一張名單？誰獨居、誰喪偶、誰獨自帶孩子、誰長期患病，上一次有人去看他，是哪一天？"],["p","年輕的寡婦，保羅說可以推辭，推辭的是入冊的申請，不是這個人：她們在哀傷中許下專心事奉的願，日後守不住，反而被定罪；被教會供養又沒有家務，就挨家閒遊、說長道短。所以保羅說：「所以我願意年輕的寡婦嫁人，生養兒女，治理家務，不給敵人辱罵的把柄。」（5:14）這不是羞辱再婚，也不是逼每一位喪偶的姊妹再嫁；是不讓人在最痛的時候，背上她背不起的擔子。5:15 轉去隨從撒但的動詞，和 1:6 偏離的人同一個字；偏離真道的有男也有女，這一段不是在說女人愛講閒話。"],["p","最後是分工：「信主的婦女，若家中有寡婦，自己就當救濟她們，不可累著教會，好使教會能救濟那真無倚靠的寡婦。」（5:16）家人先接住，教會補上那真無倚靠的。判斷真無倚靠，看實際處境，不看形式上有沒有兒女；兒女都在國外的長輩，教會不可以裝作看不見。"],["d",["保羅說「我願意年輕的寡婦嫁人」，那喪偶後再婚，或決定不再婚，哪一個比較屬靈？","兩個都不是次等的。5:11–12 被定罪的，不是婚姻本身，而是一個在哀傷中太早許下、許了又守不住的入冊誓約；所以保羅寧可一開始不讓年輕的寡婦入冊，而正面地說他「願意」她們嫁人（5:14）。4:3 正是把禁止嫁娶列為假教訓。另一面，5:14 是對以弗所處境的牧養安排，不是要每一位喪偶的人都再婚；單身與守寡同樣可以尊貴地活著、服事。5:9「從來只作一個丈夫的妻子」要和 3:2 一起讀，重點是專一忠誠的品格，不是拿來排除再婚的人。哀傷中的人，不要催他許願，也不要催他再婚。"]],["h","四、天平的兩端"],["p","第三個詞是天平。保羅轉向長老：「那善於管理教會的長老，當以為配受加倍的敬奉；那勞苦傳道教導人的，更當如此。」（5:17）「敬奉」是 τιμῆς（timēs），兼有尊敬與酬金。保羅隨即引兩句經文：「牛在場上踹穀的時候，不可籠住牠的嘴」，又說「工人得工價是應當的」（5:18）。神連替人工作的牛都顧念，教會就不可以讓一位全時間教導的人，為下個月的房租和孩子的學費焦慮。合理供應傳道人，不是施捨，是本分。"],["p","天平的另一端也要講。同一封信說，有人「以敬虔為得利的門路」（6:5）。加倍的敬奉是教會給出的尊重，不是傳道人可以索取的權利。一位傳道人若拿 5:17 向會眾要錢，說奉獻給我就是奉獻給神，他就站到了 6:5 那一邊。尊榮跟著勞苦與品格走，不跟著頭銜走。財務透明，是兩邊共同的保護。"],["p","接著是這一章最需要小心讀的一節：「控告長老的呈子，非有兩三個見證就不要收。」（5:19）這是申命記的原則：「總要憑兩三個人的口作見證才可定案」（申 19:15）。請聽清楚最後兩個字：定案。兩三個見證是定案的門檻，不是開口的門檻。同一段申命記緊接著說「審判官要細細地查究」（申 19:18），查證的責任在負責的人身上，不在提出控訴的人身上。所以這一節是保護無辜的人免於誣告，不是叫受害者閉嘴，不是要受了傷的人先自己找齊證人才可以說話。"],["p","而且 5:19 一定要連著下面兩節讀：「犯罪的人，當在眾人面前責備他，叫其餘的人也可以懼怕。」（5:20）長老的身分，不給他私下了結的特權。接著是全章最重的誓詞：「我在神和基督耶穌並蒙揀選的天使面前囑咐你：要遵守這些話，不可存成見，行事也不可有偏心。」（5:21）「偏心」原文 κατὰ πρόσκλισιν（kata prosklisin），意思是秤桿往一邊傾斜。不可以因為他是長老，就先判他無罪；也不可以因為不喜歡他，就先判他有罪。"],["p","落到今天，教會收到對牧者或長老的指控，要有獨立、可信的調查：不由被指控者的親信主導，保護提出的人不受報復。涉及性侵、兒童保護等刑事的，要依法通報主管機關，不可以用教會內部處理、先私下去勸為由延誤。馬太福音十八章處理的是弟兄之間的得罪，不是刑事案件的替代程序。一位終於鼓起勇氣說出來的人，應當聽見：我們會細細地查，照著真相去做。"],["p","然後是預防：「給人行按手的禮，不可急促；不要在別人的罪上有分，要保守自己清潔。」（5:22）恩賜幾個月就看得見，品格要好幾年才看得清：「有些人的罪是明顯的，如同先到審判案前；有些人的罪是隨後跟了去的。」（5:24）所以按立同工、安排兒童事工，要給足觀察的時間，多人察驗，查問過去的紀錄。不可急促的是託付，不是查究。"],["p","就在這一串嚴肅的話中間，保羅寫了一句：「因你胃口不清，屢次患病，再不要照常喝水，可以稍微用點酒。」（5:23）處境是一位屢次患病的人，分量是「稍微」，用法是當藥。這一節不是鼓勵飲酒，不能拿來替應酬勸酒開脫；保羅這樣吩咐，也表示飲酒本身沒有被定為罪，滴酒不沾不是屬靈的資格，3:3 的重點是不因酒滋事，是節制。若你今天正在戒酒，完全不碰酒是智慧，也是忠心。這一句最動人的，其實是一位屬靈的父親停下來，關心一個年輕人的胃。"],["p","這一段收在 5:25：「這樣，善行也有明顯的，那不明顯的也不能隱藏。」（5:25）神不讓罪永遠藏著，也不讓善行永遠埋著：那位每天清早為教會禱告、名字從來沒上過週報的老姊妹，神記得。"],["d",["教會該給傳道人多少薪水？談錢會不會讓服事變得不屬靈？","經文沒有給數字，卻給了方向。5:17 的「加倍的敬奉」兼有尊敬與酬金，5:18 的兩句引文都講到實際的供應，所以教會有責任合理地供應勞苦的同工：參照當地的生活水準和家庭的需要，顧到醫療、保險和退休，同時，傳道人有責任不以敬虔為得利，不把 5:17 當成向會眾要錢的條文；具體做法可以是：執事會參照當地薪資定公開的原則，每年檢討，財務報告讓會眾看得到。談錢不會讓服事變得不屬靈，不透明的錢才會。"]],["d",["我知道某位領袖有不當的行為，但只有我一個人看見，5:19 是不是叫我不要說？","不是。5:19 的兩三個見證，是定案的門檻，不是開口的門檻；申命記同一段說審判官要細細地查究，查證的責任在負責的人身上，不在你身上。你可以先寫下日期、地點、發生了甚麼，然後告訴一位你信得過、又不屬於那位領袖親信圈子的同工或長老，請他們啟動獨立的調查。若事情涉及性侵、性騷擾或兒童，請直接依法通報主管機關，不必等教會走完內部程序。5:20 說犯罪的要責備，5:21 說不可有偏心；你說出來，不是破壞這個家，是在保護下一個人。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 5:1–2 的「如同家人」講成家醜不可外揚：一家人有事關起門來說，不要張揚，不要報警。這兩節管的是口氣，不是遮蓋；同一章就說犯罪的要責備，行事不可有偏心。"],["p","第二個偏差，是反過來用「勸他如同父親」要求年輕的同工對長輩絕對順服，資深的人說了算，提意見就是不敬。勸本身就是說真話；耶穌說「只有一位是你們的父，就是在天上的父」（太 23:9），長輩不是不能被勸、不能被問的人。"],["p","第三個偏差在 5:4、5:8 的兩頭：一頭說「父母打你也是為你好，你不回家就是背了真道」，把受虐的人推回傷害裡；一頭說「我有界線，所以對父母沒有虧欠」，讓年老無靠的父母無人看顧。經文要的是看顧，不是順從；界線決定怎樣看顧，不決定要不要看顧。"],["p","第四個偏差，是用 5:19 封口：「你有兩三個見證嗎？沒有就不要亂說。」或者用「先照馬太福音十八章私下處理」延誤通報。兩三個見證是定案的門檻，查證的責任在負責的人；而且一定要連著 5:20 的責備與 5:21 的不偏心一起讀。"],["p","第五個偏差在 5:23 的兩頭：一頭說保羅都叫人喝一點，替勸酒開脫；一頭把飲酒本身定為罪，把滴酒不沾當成屬靈的資格。處境是屢次患病，重點是節制，也要顧及正在戒酒的人。"],["d",["基督徒到底可不可以喝酒？保羅不是叫提摩太用點酒嗎？","先看處境：「因你胃口不清，屢次患病」，對象是一位長期只喝水、身體很差的年輕人，分量是「稍微」，用法是當藥。所以 5:23 不是鼓勵飲酒。可是保羅這樣吩咐，也表示飲酒本身沒有被定為罪；3:3 對監督的要求是不因酒滋事，重點是節制，滴酒不沾不是屬靈的資格。在這兩頭中間，要用節制與愛心判斷：若你身邊有人正在戒酒，或家裡曾經被酗酒傷過，為他的緣故不喝，是愛。若你自己正在戒酒，完全不碰酒是智慧，也是忠心，不必向任何人解釋。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：孝與順。我們從小聽「百善孝為先」，也聽「天下無不是的父母」，於是孝和順被綁成一個詞。有人在原生家庭受過打罵、控制，一聽到孝順就喘不過氣；也有人照顧失智的母親三年，筋疲力盡，親戚還說送安養院就是不孝。這一章把兩個字拆開：5:4 的行孝是敬虔，5:8 的看顧是預先想到、供應安排，都不是無條件的順從。安全的看顧、專業的照護、兄弟姊妹的分工，都可以是孝；照顧者自己的崩潰，不是敬虔的證明。"],["p","第二個問題：面子。華人教會很怕兩件事被說出來，一是錢，一是領袖的問題。談傳道人的薪水好像不屬靈，同工的家庭長年拮据不敢開口；領袖出了事，說出來好像丟了教會的臉，受傷的人就被勸顧全大局。這一章正好在這兩件事上都要神的家把話說清楚：供應要合理、透明，指控要細細地查、依法通報，行事不可有偏心。面子保護位子，真理保護人。"],["h","七、活出321——有溫度也有骨架的家"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。321 常說「人比事重要」，最直接的經文就在 5:1–2。可是這一章也說，一個家要活得像家，也需要骨架：名冊、分工、供應、程序、慢慢的按手。"],["p","耶穌是我的榜樣：他指著門徒說：「凡遵行我天父旨意的人，就是我的弟兄姊妹和母親了」（太 12:50），他先定義了這個家。在十字架上，他把母親託給所愛的門徒：「看，你的母親！」（約 19:27）看顧而不被捆綁，溫柔而不偏心，這是神家裡長子的樣子。"],["p","聖經是我的準則：保羅講長老的供應，說「經上說」，引的是申命記踹穀的牛；講控告，用的是申命記兩三個見證、保護無辜者免於誣告的原則。這個家怎樣運作，不憑輩分、不憑面子，憑經文。"],["p","聖靈是我的引導：有些人的罪是隨後跟了去的，有些善行是不明顯的（5:24–25）。我們看不透人心，所以按手不可急促，也求聖靈給我們分辨的心：哪一句真話要怎樣說，哪一個家暫時需要安全的距離。"],["p","讓耶穌作王：讓出兩個位子。第一個是審判台，保羅是在神和基督耶穌面前囑咐的（5:21），審判台不是我們的，我們不能先替喜歡的人判無罪，也不能替主決定哪些事不查。第二個是家長的位子，長輩不能拿父親的稱呼要求絕對順從，父母也不能拿孝道取代神的主權。"],["p","讓耶穌得著一切的榮耀：善行那不明顯的，也不能隱藏（5:25）。我們不必搶著讓自己的服事被看見；那位晝夜禱告的寡婦，她的榮耀也歸給那位記得她的主。"],["p","建立屬神的體系：團契每一次檢討，不只問聚會多熱鬧，也問五件事：我們有沒有一份獨居者、喪偶者、單親家長的關懷名單？同工的供應是否合理、財務是否透明？收到指控時，有沒有獨立調查、依法通報的流程？說話的口氣，像不像家人？"],["h","八、四種心，在這張長桌的哪一頭"],["p","驕傲型的心，喜歡坐在桌頭。也許你是拍桌子的長輩，覺得年資就是道理；也許你是覺得長輩都落伍了的年輕人。這一章對兩邊都說：先叫一聲父親、叫一聲弟兄，再開口。真話要說，可是不必用拳頭說。"],["p","恐懼型的心，坐在門邊。你心裡藏著一件關於某位領袖的事，不知道說出來以後，這個家會接住你，還是把你推出門外；或者你很想去看那位獨居的長輩，卻怕不知道說甚麼。請聽 5:21：這個家行事不可有偏心，你說出來，是幫它走在神面前。去探訪也不必會講道，坐下來聽就夠了。"],["p","羞恥型的心，覺得自己是這個家的負擔。也許你是獨居的長輩、剛守寡的姊妹、單親家長，覺得每次被幫助都欠了人情。請聽 5:5 和 5:10：記在冊子上的人，是仰賴神、晝夜禱告、接待遠人的人；你不只是被照顧的人，你的禱告是這個家的寶貝。"],["p","受傷型的心，也許在原生家庭裡受過傷，一聽到孝順就發抖；也許在教會說出被傷害，卻沒有被認真對待。這一章不是要你回到傷害裡。今天不必勉強原諒誰，也不必立刻回家；若你現在仍不安全，請先告訴一位信得過的人，讓人陪你找到安全，尋求專業的協助，必要時報案。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次 5:1–2，用家人的稱呼，把幾位長輩和弟兄姊妹的名字帶到神面前。"],["p","第二，想一位你最近對他說過重話的人，長輩、同工或家人都可以；這一週私下用勸的口氣，把該說的真話重新說一次，也為那一次的口氣道歉。"],["p","第三，為父母或長輩做一件具體的看顧：一通電話、一次陪診、一頓飯。若那個家仍不安全，不必獨自回去，透過兄弟姊妹或第三方，找出你能盡的那一份。"],["p","第四，從通訊錄找出一位獨居的長輩或單親家長，這一週約時間去看他，問他有沒有要幫忙的事。"],["p","第五，若你在同工團隊裡，問一句：收到指控時，下一步是甚麼？答不清楚，這個月就把獨立調查、依法通報的流程寫下來。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神的家裡沒有外人，也沒有工具；我要用家人的口氣，說真話。"],["p","我宣告：我要看顧我的家人，看顧不是順從；我的安全和我的孝心，主都放在心上。"],["p","我宣告：那獨居無靠的人，神記得他的名字，我也要記得。"],["p","我宣告：這家的主人不偏心；我不替任何人遮蓋罪，也不叫任何受傷的人閉嘴。"],["d",["我想為小組列一份關懷名單，具體要從哪裡開始？","可以分四步。第一，列名字：請組長和兩位組員一起，寫下小組和團契裡獨居、喪偶、單親、長期患病、行動不便的人，網路上一起聚會的長輩也算。第二，寫日期：在每一個名字旁邊寫上，上一次有人去看他或打電話給他，是哪一天；空白的，就是這個月要先去的。第三，排人：每一個名字配兩位組員，避免一男一女單獨探訪，排出這個月每一週由誰去。第四，回報：下次小組花五分鐘，說說誰被看見了。若發現有人長期憂鬱、失智或家裡不安全，交給牧者，協助他尋求專業協助。要緊的是每一個名字都有人記得。"]],["h","十、結語"],["p","我們回到那個電梯口。那天晚上，林伯最後還是進了電梯。門關上以前，他說：「下個月的會，你再提一次，我先聽你講完。」兩個禮拜後，他自己打電話給那兩個孩子。"],["p","可是這一課的焦點，不在阿傑多會說話，也不在林伯肯不肯改。焦點在那一位坐在長桌上座、我們看不見的主：他把我們這些外人接進他的家，給我們父親、母親、弟兄、姊妹；他記得每一個獨居無靠的人的名字，他的天平從來不往一邊傾斜。你不必更佩服誰會帶教會，你只要更認識這一位記得你、也公正待你的主。"],["p","我們一起低頭禱告。天上的父，謝謝你讓我們這些外人成為你家裡的人。求你赦免我們用拳頭說話，對獨居的人沒有時間，對有地位的人偏心。教我們看顧家人而不被捆綁，記得那真無倚靠的人。求你保守每一位在家裡或在教會裡受過傷的人，讓他們找到安全，也讓這個家配得他們的信任。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰的家比較好，是讓每一個人說出：我怎樣稱呼身邊的人，我記得哪一個名字，我的天平往哪一邊傾斜；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是稱呼、名冊、天平。席上可能有在原生家庭受過虐待的人、筋疲力盡的照顧者，也可能有受過屬靈虐待的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：規矩從家人的稱呼開始；看顧不是順從；兩三個見證是定案的門檻，不是開口的門檻。"],["n","1. ★ 你在家族裡怎樣被稱呼，小名、排行，還是阿弟、大姊？哪一個稱呼讓你覺得自己被疼愛？是誰這樣叫你？"],["n","2. ★★★ 5:1 說不可嚴責，只要勸他如同父親。請用自己的話說：嚴責和勸差在哪裡？用電梯口那段對話舉例。"],["n","3. ★★ 5:8 的看顧原文是預先想到、供應安排。請各說一個看顧和一個順從的例子，再說為甚麼這兩節不能叫受虐的人回家，也不能拿界線取消孝道。"],["n","4. ★★ 5:19 的兩三個見證，為甚麼是定案的門檻，不是開口的門檻？5:20、5:21 各補上甚麼？涉及刑事時教會要做哪一件事？"],["m","帶領提醒：第一題輕鬆帶；討論 5:19 時，不評論任何真實的人或案子，把話題帶回 5:20 與 5:21。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：看見自己說話的口氣和自己的天平，說出這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 最近一次你對長輩、同工或家人說重話，是在哪裡、為了甚麼？那一刻你比較像拍桌子的林伯，還是想當眾反駁的年輕人？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 5:1–2 兩遍，第二遍在每一個稱呼後面停一下，想一張臉。讀完說：神要你重新怎樣稱呼哪一個人？"],["t","【想】想通關卡"],["n","7. ★★★ 看顧家人，你最難的關卡在哪裡：時間、錢、過去的傷、兄弟姊妹不分工，還是怕被說不孝？不必說細節，只說卡在哪裡。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「神的家裡沒有外人；這一週我要用家人的口氣，對……說一句真話。」右手邊的人只回一句「你是我們家裡的人」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要為家中長輩做的一件看顧：做甚麼、哪一天、和誰分工。若那個家仍不安全，寫下你要先告訴的那一位信得過的人。"],["m","帶領提醒：這一化可能碰到虐待、家庭傷害、屬靈虐待或長期無望感。不追問細節，不要求任何人原諒誰、和好或回家，不對正在流淚的人說「你要有信心」，也不說「父母都是為你好」；若有人說出正處在危險中，不在組裡處理，先確認他現在是否安全，會後單獨關心，協助他尋求專業協助，必要時協助報案；涉及兒童的，依法通報。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個要去看的名字、一個流程、一個要帶的人。"],["n","10. ★★★ 一起列出小組裡獨居、喪偶、單親、長期患病的人，至少三個名字。每個名字由哪兩位組員負責？這個月哪一天去看？"],["n","11. ★ 說出一位默默服事、很少被看見的長輩的名字，這一週哪一天，你要用字條、電話還是一頓飯謝謝他？"],["n","12. ★★ 若你是同工或組長：團隊收到對領袖的指控時，下一步是甚麼？答不出來的，說出這個月要和哪一位同工、哪一天把流程寫下來。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，你要待他如同弟兄姊妹的那一個人。當場說出他的名字，和這一週哪一天你要找他，向他分享：神的家裡沒有外人。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，聖經說教會是一個家，要待老人如同父母，待年輕人如同弟兄姊妹。第二句，這個家記得最孤單的人，也公正地處理領袖的錯，不偏向任何一邊。第三句，我也在學著這樣待我的家人，所以這一週我要去看一位獨居的長輩。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心」這類答案；探訪安排兩人同行，避免一男一女單獨探訪；若組員的家人曾傷害他、並不安全，不勉強他去探望或和好。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要去看的那一個名字。"],["p","然後彼此代禱，為三種人指名禱告：一位獨居無靠的長輩，求主讓教會記得他的名字；一位在原生家庭受過傷的人，求主保護、醫治；一位說出自己被傷害卻沒有被認真對待的人，求主安慰他，也求這個家配得他的信任。"],["p","散會前確認紙上寫了三樣：你負責的名字、要為長輩做的事、你的那個「2」。下次帶來對。"]]},"6":{"no":6,"vol":"《321提摩太前書講義》第六課·提摩太前書第六章","title":"保守所託付的——知足、持定、交棒","chars":5170,"min":60,"deep":8,"dchars":1768,"tchars":1335,"blocks":[["h","一、少了一個字的那句話"],["p","弟兄姊妹平安。今天這一課，我想先請你幫我拆一句話。這句話你一定聽過，說不定上個星期還從自己嘴裡說出來過：「錢是萬惡之根。」長輩用它教訓亂花錢的孩子，連續劇裡的清官用它罵貪官，連不信主的同事都知道，這是聖經說的。可是請你翻開提摩太前書第六章，從頭找到尾，聖經裡沒有這一句。"],["p","經文是這樣寫的：「貪財是萬惡之根。有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。」（6:10）少了一個「貪」字。只差一個字，整句話就翻了過來。說「錢是萬惡之根」，問題不是在人心裡，是在銀行裡、在皮夾裡，人可以指著別人的存摺罵；說「貪財是萬惡之根」，問題就搬回了人心裡，每一個人都得先照鏡子，有錢的人要照，沒錢的人也要照。"],["p","這一個字說丟了以後，會長出兩種相反的人。一種人覺得有錢就是罪：加了薪不敢在小組裡提，吃一頓好的也心虛，看見事業有成的弟兄，心裡先打一個問號。另一種人乾脆把整句丟掉，說那是老一輩的想法，神是要我們興旺的，信得好就會賺得多。一種把錢當成魔鬼，一種把錢當成神發的獎牌。保羅在這一章，兩邊都不站。"],["p","先用書信三問的第一問：以弗所教會和提摩太遇到甚麼？傳異教的人進來了，有人把敬虔當成生財的門路；教會裡有在軛下的奴僕，也有家裡很富足的會友；看守這群羊的，是一個常被人小看年輕的傳道人。這是全信的最後一章，保羅要在收筆以前，把幾件最重的事交代清楚。也請記得，這封信要在全會眾面前念出來，所以它是對站講台的人說的，也是對坐在座位上的你說的。"],["p","第六章一開頭，先對在軛下作僕人的說話，理由只有一句：「免得神的名和道理被人褻瀆。」（6:1）保羅承認那是一副軛，他不是在替奴隸制度背書，是在牧養一群改變不了處境的人。今天放進職場，也不可以只講一邊；同一位保羅對主人說：「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。」（西 4:1）這一課我們用三個詞走完這一章：知足、持定、交棒。"],["d",["既然聖經說的是「貪財」，那錢本身就完全中性、怎麼用都沒關係嗎？","錢是工具，但不是沒有重量的工具。主耶穌說：「一個人不能事奉兩個主；」（太 6:24）他把瑪門說成一個會要求人事奉的主人，可見錢有一股想坐上寶座的拉力。所以 6:10 的意思不是錢很危險、最好不要碰，也不是錢完全中性、隨便用都可以，而是：錢本身不是惡，可是它很容易成為人心所愛的對象。分辨的方法不是看你有多少，是看三件事：它是不是你安全感的來源？你給出去的時候是不是像割肉？你是不是常常因為它和別人比較？若三題的答案都是是，問題就不在帳戶裡，在心裡。議題頁有整理。"]],["h","二、知足：把「利」重新定價"],["p","保羅先描寫一種人：「他是自高自大，一無所知，專好問難，爭辯言詞，」（6:4）「自高自大」原文是 τετύφωται（tetyphōtai），字根是煙。一個被自己的煙燻住的人，覺得自己很高大，其實甚麼也看不清。他生出來的是嫉妒、紛爭、毀謗、妄疑。今天的留言串越拉越長、愛心越來越少，常常就是這一張症狀表。請注意，保羅診斷的是「專好」，把爭辯當成嗜好；帶著真問題來教會的人，不在這一張表上。"],["p","然後保羅揭開動機：「他們以敬虔為得利的門路。」（6:5）信仰變成生財的工具，敬虔從目的變成手段。保羅沒有在信裡點出這些人的名字，我們今天也不點名任何講員、任何教會；這面鏡子是拿給每一個講台照的，也是拿給每一顆心照的：我來到神面前，是要他，還是要他手裡的東西？"],["p","下一節，保羅用同一個字把這句話翻過來：「然而，敬虔加上知足的心便是大利了；」（6:6）他沒有說敬虔沒有利，他說那是大利。他不跟假師傅搶那個「利」字，他把「利」重新定價。假師傅說，敬虔可以換到錢；保羅說，敬虔加上知足，本身就是那一筆大利。"],["p","理由是兩端都是空的：「因為我們沒有帶甚麼到世上來，也不能帶甚麼去。」（6:7）產房裡的嬰兒，手是握著的，可是裡面甚麼也沒有；殯儀館裡的人，手是攤開的，也甚麼都帶不走。中間經手的一切，房子、存款、名片，都是借來用的。所以：「只要有衣有食，就當知足。」（6:8）請你聽準，這是生存的底線，不是生活的上限。保羅沒有說基督徒只能有衣食，他是說衣食之上的，不是我們安全感的來源；多出來的那一份，可以開始問：神要我拿去做甚麼？"],["p","接著，經文走到這一章的谷底：「但那些想要發財的人，就陷在迷惑、落在網羅和許多無知有害的私慾裡，叫人沉在敗壞和滅亡中。」（6:9）「沉」是把船弄沉的字。一條貨船，一箱一箱往上堆，每一箱都只多一點點，沒有一條船是一天之內沉下去的。先是想要，心意定了；然後替它找理由；然後被套住。"],["p","現在回到開場那一句。6:10 的主語是「貪財」，不是錢。錢可以買藥，也可以買毒品；可以蓋學校，也可以收買人。錢是一把刀，貪財是握刀的那一份愛。最痛的是後半句：「用許多愁苦把自己刺透了」，沒有人刺他，是他自己刺的。失眠、焦慮、兄弟為遺產不再說話，常常都是從「再多一點，我就安全了」那一句開始的。"],["d",["「敬虔加上知足的心便是大利」，是不是表示基督徒不該想要賺更多、不該投資或創業？","不是。6:8 說的「有衣有食，就當知足」，是生存的底線，不是生活的上限。保羅在第五章還要信徒看顧自己的家人，在 6:18 要富足的人在好事上富足；工作、計畫、投資、創業，本身都不違背知足。分寸在方向和用途：你賺錢是為了證明自己、跟上別人，還是為了負起責任、也有餘力供給人？一個知足的創業者，仍然會努力，只是不讓營收決定他的價值，也不讓「再多一點才安全」綁住他的心。可以問自己：如果這一年收入減少三成，我和神的關係會不會一起垮？若會，問題不在投資，在倚靠。全卷立場見 ISS00_5。"]],["d",["我常聽到「你奉獻多少，神就加倍還給你」的講法，這種說法錯在哪裡？","它把 6:5 的路包裝成屬靈的話。神確實是慷慨的，聖經也說施比受更為有福；可是「奉獻換祝福」把神變成一台投幣機：投進去多少，等著吐出來多少。這樣奉獻的動機就不是愛，是投資；而當生意失敗、病痛臨到，人就會覺得神欠了他，或覺得是自己信心不夠。6:6 把利重新定價：敬虔加上知足，本身就是大利，不是換取財富的手段。6:18 說的是「甘心施捨」，奉獻要出於甘心，不是出於交易，也不是出於罪疚。我們不點名任何講員或教會，只把這條路講清楚：神的愛從來不靠存摺證明，奉獻也不能買到他的恩典。"]],["h","三、持定：在頌讚前面停下來"],["p","保羅轉過身，對提摩太說：「但你這屬神的人要逃避這些事，追求公義、敬虔、信心、愛心、忍耐、溫柔。」（6:11）「屬神的人」是舊約稱呼摩西、以利亞的話；提後 3:17 又用同一個稱號，指每一個被聖經裝備的信徒。所以坐在最後一排的你，也是屬神的人。兩個動詞要一起看：逃避，追求。前面那群人在追錢，提摩太也要追，只是換了追的東西。基督徒不是不追求的人，是換了追求對象的人。有些試探不是拿來抵擋的，是拿來跑開的。"],["p","「你要為真道打那美好的仗，持定永生。」（6:12）「打仗」原文是 ἀγωνίζου（agōnizou），運動場上的拚搏，肌肉會痠，呼吸會亂。疲倦、懷疑、反對，不是信心失敗的證據，是比賽正在進行的證據。「持定」原文是 ἐπιλαβοῦ（epilabou），一把抓住。永生是「被召」得著的，不是靠拚命賺來的；拚的是不放手。手裡握著永生的人，就空不出手去抓前面那群人在抓的東西。"],["p","那麼要照著誰的樣子打這一仗？保羅把提摩太帶到「向本丟‧彼拉多作過那美好見證的基督耶穌面前」（6:13）。這一章一直在說「美好」，美好的仗，美好的見證，到這一節，美好有了一個人的臉。被綁著站在羅馬巡撫面前的那一位，沒有求饒，也沒有反擊，只說：「我為此而生，也為此來到世間，特為給真理作見證。」（約 18:37）安靜，清楚，不退讓。提摩太面對假師傅、面對比他有錢的會友，就照這個模子說話。"],["p","然後保羅說，要守這命令「直到我們的主耶穌基督顯現」（6:14），講到這裡，他停不住了，唱了起來。教學的時候，我們也在這裡停下來，不急著往下解釋。請大家一起慢慢念：「到了日期，那可稱頌、獨有權能的萬王之王、萬主之主，」（6:15）「就是那獨一不死、住在人不能靠近的光裡，是人未曾看見、也是不能看見的，要將他顯明出來。但願尊貴和永遠的權能都歸給他。阿們！」（6:16）"],["p","請留意這首詩歌放在哪裡：放在兩段講錢的話中間。以弗所人手上的錢幣，印著皇帝的頭像，人以為有錢就有權能；保羅說，獨有權能的只有一位。「萬王之王」原文是一切正在作王的王，此刻坐在任何寶座上的，都在他以下，包括那個最想坐上寶座的東西，錢。讀到這裡，最好的回應不是分析，是一起說：阿們。"],["d",["6:15–16 的頌讚夾在講錢的段落中間，對我每天的錢包有甚麼實際的意義？","很實際。錢最想作的就是主人：它說你倚靠我才安全，有我才有價值。保羅在兩段講錢的話中間停下來，唱出萬王之王、萬主之主、獨有權能的那一位，等於把錢從寶座上請下來。你可以這樣用：每次要做一個不小的財務決定之前，先念一次 6:15–16，再問兩個問題：這筆錢的主人是誰？這個決定是讓我更倚靠他，還是更倚靠霧？又如每個月看帳單的時候，先說一句「但願尊貴和永遠的權能都歸給他」，再開始算。頌讚不是逃避現實，是把現實放回正確的次序：先是王，然後才是帳目。"]],["h","四、原文亮光：無定、供給、寄存"],["p","唱完了，保羅低下頭，回到以弗所的教會，回到錢上：「你要囑咐那些今世富足的人，不要自高，也不要倚靠無定的錢財；只要倚靠那厚賜百物給我們享受的神。」（6:17）第一個字是「無定的」，原文 ἀδηλότητι（adēlotēti），看不清楚的。倚靠錢財就像倚靠一片晨霧：看得見，摸不著，一出太陽就散了。去年那支人人都說穩賺的股票，今年在哪裡？"],["p","可是同一節最美的一句是：神是「厚賜百物給我們享受」的。神不是吝嗇的主人，他給得豐富，目的就是叫我們享受。一頓好吃的年夜飯，一次和家人的旅行，一個可以安心睡覺的家，不必帶著罪疚感領受；這也接上了第四章「凡神所造的物都是好的」（4:4）。享受不是罪，忘了那位賜予者才是。所以保羅沒有叫富足的人變窮，只叫他換一個倚靠：從禮物，換到賜禮物的那一位。"],["p","第二個字在 6:18：「又要囑咐他們行善，在好事上富足，甘心施捨，樂意供給人，」（6:18）「樂意供給人」原文是 κοινωνικούς（koinōnikous），字根就是 κοινωνία（koinōnia），團契、相交、彼此有分。轉帳只要一秒鐘，κοινωνικούς 卻是把自己和對方連在一起：知道他的名字，知道他的難處，坐到他的桌邊。錢在神的家裡，是用來建立關係的。接著保羅說，這樣的人「持定那真正的生命」（6:19）；這不是說施捨可以買永生，是說一個慷慨的人，已經抓住了錢買不到的那一種生命。"],["p","第三個字在 6:20：「提摩太啊，你要保守所託付你的，」（6:20）「所託付的」原文 παραθήκην（parathēkēn），是一個法律用語：寄存物。古時出遠門的人，把一袋銀子交給可靠的朋友，回來時要原封不動地取回。不挪用，不打折，不加料。福音就是這樣的寄存物，不是提摩太發明的，也不是他可以修改的。同一節還要他躲避「那敵真道、似是而非的學問」，原文是名不副實、冒用知識之名的說法；這不是叫我們反對讀書、反對科學，真理不怕被研究。"],["p","可是寄存物還有另一面：它總有一天要交出去。保羅後來寫給同一個人：「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」（提後 2:2）保守，是為了交給下一棒，不是關起門來。一間只會守、不會交的教會，最後守住的只是一個空箱子。保羅交給提摩太，提摩太交給忠心的人，一棒一棒，交到了今天坐在這裡的我們手上。"],["p","然後是全信最後一句：「願恩惠常與你們同在！」（6:21）「你們」是複數，信寫給一個人，最後一句卻轉身對全會眾說。請記住次序：先保守，再恩惠，這個次序不能顛倒；可是我們能保守，是因為恩惠先常與我們同在。恩惠不是守得好的獎賞，是守門的人一開始就站在裡面的那個覆庇。"],["d",["教會應該怎樣對待有錢的會友？傳道人要怎樣向比自己富足的人說話？","保羅叫一個年輕人，去對年紀比他大、錢比他多的人說話，給的是一份囑咐，不是一份奉承。年輕的牧者面對有錢的會友，常有兩個試探：一個是巴結，一個是嫉妒。6:17–18 兩樣都不給：不要自高，不要倚靠無定的錢財，要行善、樂意供給人。所以教會不在講台上特別稱讚大額奉獻者，不讓奉獻換取座位、職分或發言權，這使我們想起雅各書第二章的提醒；也不在講台上影射任何一位富足的弟兄姊妹。教會的財務要透明。對富足的會友，最好的牧養不是要他的錢，是邀請他把錢變成關係：認識一個有需要的人，坐到他的桌邊。"]],["d",["「保守所託付的」和「交給下一棒」聽起來有點矛盾，到底是要守，還是要交？","兩件事是同一件事。παραθήκη 是寄存物：不是你的，所以要守，不挪用、不打折、不加料；也正因為不是你的，總有一天要交出去。守的目的就是交。若只交不守，交出去的已經走了樣，下一棒拿到的是你加料過的版本；若只守不交，福音就斷在你這一代，守住的只是一個空箱子。保羅自己就是這樣做的：他從主領受，守住了，又交給提摩太，再要提摩太交託那忠心能教導別人的人。所以每一個守門的人都可以問兩個問題：我手上的東西還是原來的樣子嗎？我已經開始教誰了嗎？兩題都要答。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是成功神學：信主就會發財，奉獻越多神就加倍還你，把敬虔講成換取財富的投資。這正是 6:5「以敬虔為得利的門路」那條路。我們拒絕它，不是因為神不賜福，是因為神的愛從來不靠存摺證明。"],["p","第二個偏差，是清貧主義：錢是骯髒的，有錢人很難是真基督徒，越窮越屬靈。6:10 的主語是貪財，不是錢；6:17 說神厚賜百物給我們享受。我們也拒絕這一邊，貧窮不是屬靈的證明，富足也不是犯罪的證據。"],["p","第三個偏差，是拿 6:8 叫缺乏的人閉口：知足就好，不要開口求助，說出需要就是不知足；或說基督徒不可以努力、不可以投資創業。6:8 是底線，不是天花板；知足的人可以勤勞、可以計畫，也可以坦然接受弟兄姊妹的幫助。"],["p","第四個偏差，是把 6:1–2 單向化：拿來要求今天的員工忍受欠薪、超時、羞辱，因為聖經說要恭敬主人。這兩節的理由是福音的名聲，同一位保羅也吩咐主人要公平；遇到違法的剝削，可以求助，也可以守住法律的保護。"],["p","第五個偏差，是把 6:20 的「保守」講成關門：傳統一個字都不能改，年輕人等以後再說，傳道人把講台、同工圈守成自己的地盤；或把次序講反，說你守住了神才給你恩惠。寄存物要交下去，恩惠也從來不是獎賞。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：錢等於安全感。我們從小聽「有土斯有財」，見面三句話就問薪水、問房子、問孩子考上哪裡；過年的紅包、婚宴的禮金，一筆一筆都記在心裡。很多人不是貪心，是怕，怕老了沒人照顧，怕孩子輸在起跑點。這一章不罵這份怕，它把那份怕帶到萬王之王面前：無定的錢財撐不住你，厚賜百物的神撐得住。存錢可以，計畫可以，只是不再讓那一本存摺坐在只屬於他的位子上。"],["p","第二個問題：教會徒弟，餓死師傅。手藝人留一手，是怕被取代；這一套也很容易搬進教會。司琴的不教新人，帶小組的不培養副組長，老同工說「年輕人還不成熟」，一做就是二十年。等到他病倒了、移民了，整個服事就停了。6:20 的寄存物不是師傅的手藝，是神交給我們、原本就要交出去的東西。在神的家裡，徒弟學會了，師傅不會餓死，那是他最好的成績。"],["d",["我是長年做同一個服事的老同工，要怎樣把服事交給年輕人，又不會讓事情亂掉？","可以分四步走。第一，列清單：寫下你固定在做的事，圈出一件別人也做得來的。第二，親自去邀：不在台上公開招募，親自去問一位還沒有上場的年輕人，說出具體的事、具體的日子。第三，一起做：前兩次你做、他看；接著兩次他做、你在旁邊；之後他做，你不在場。第四，忍住不搶：他做得比你慢、比你粗，只要不傷人，就讓他做下去，事後具體稱讚一件做得好的地方。交出去的人沒有失去位置，是成了交棒的人；年輕人做得比你好的那一天，正是 6:20 最好的成績。"]],["h","七、活出321——守好了，交下去"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。我們常說「人比事重要，關係比東西重要」，6:18 的 κοινωνικούς 把這一句放進了錢包裡：東西最好的用途，是成為關係的橋。"],["p","耶穌是我的榜樣：6:13 那位在彼拉多面前作美好見證的主，是我們打仗、作見證的模子；他也把父交給他的人保守得好好的，離世以前，把福音交到一群門徒手上。他自己就是那位守住、又交下去的主。"],["p","聖經是我的準則：寄存物不由我們加料。6:3 說的是「主耶穌基督純正的話」，6:20 說要原封不動地保守。我們交給下一棒的，是經文本身，不是我們的偏好。"],["p","聖靈是我的引導：保羅後來對提摩太說：「從前所交託你的善道，你要靠著那住在我們裡面的聖靈牢牢地守著。」（提後 1:14）守不是靠意志力，是靠住在我們裡面的那一位；交給誰、甚麼時候交，也求他指引。"],["p","讓耶穌作王：錢最想作的就是主人。把帳本、存摺、事業與生涯規畫，一樣一樣放到「萬王之王、萬主之主」（6:15）面前問：主啊，這是你的，你要我怎樣用？"],["p","讓耶穌得著一切的榮耀：6:16 的頌讚結在「但願尊貴和永遠的權能都歸給他」。我們守住甚麼、交出甚麼，最後被記住的名字都不是自己。"],["p","建立屬神的體系：一間只靠一位傳道人撐著的教會，再興旺也只有一代。屬神的體系是一棒交一棒，每一代都有人接過福音、守住它、再交下去；錢在這個家裡流動，變成彼此相交的管道，財務透明，奉獻不換座位，也不換發言權。"],["h","八、四種心，各握著甚麼"],["p","驕傲型的心，握著的是成就。錢多一點，就當成自己的功勞；懂得多一點，就專好問難。這一章對你說：你也是赤身來的，獨有權能的只有一位。你最好的成績，不是你守了多久，是你交給了誰。"],["p","恐懼型的心，握著的是存摺。一直算，一直怕，怕不夠，怕失去，也怕把服事交出去以後自己就沒有用了。請聽 6:17：倚靠的是厚賜百物給我們享受的神，不是無定的霧。先學著享受一樣神給的好東西，手就會慢慢鬆開。"],["p","羞恥型的心，覺得自己沒資格談錢，也沒資格接棒：欠過債、生意失敗過，或曾經為了錢做過不光彩的事。請聽 6:11 的稱呼，「屬神的人」，不是因為你做了多少，是因為你屬於誰。寄存物交到人手上，從來不是先查他的帳簿。"],["p","受傷型的心，也許曾經被教會的奉獻話語壓過，被說成不夠信才窮；或在職場上被欠薪、被羞辱，又被人勸「要恭敬主人」。這一章不是要你回到傷害裡。今天不必勉強原諒誰；若你正處在經濟或職場的困境裡，請告訴一位信得過的人，讓教會陪你找到實際和專業的幫助。"],["d",["我現在負債、收入不穩，聽到「有衣有食就當知足」反而更有壓力，該怎麼辦？","先聽清楚：6:8 不是要你閉口忍耐，也不是說你的困難是因為不夠知足。知足說的是心不被錢綁住，不是叫缺乏的人不准開口。你可以做三件事。第一，把實際的數字寫下來，收入、支出、債務，帶到神面前，也帶到一位信得過的弟兄姊妹面前。第二，向教會說出需要；神的家原本就要讓錢在弟兄姊妹之間流動，6:18 的「樂意供給人」，有一半是說給願意接受幫助的人聽的。第三，必要時尋求專業的理財或債務協商協助，這和禱告一點也不衝突。若壓力大到失眠、覺得撐不下去，請今天就告訴一個人。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次 6:15–16 的頌讚，禱告時先稱呼「萬王之王、萬主之主」，再說今天的需要；把一筆你最擔心的帳目，具體地交在他面前。"],["p","第二，記下這一週三次和別人比較的時刻，看到甚麼、心裡說了甚麼；週末回頭問自己：那一刻我倚靠的是無定的錢財，還是厚賜百物的神？"],["p","第三，好好享受一件神賜的好東西，一頓家常飯、一個安息的下午，不帶罪疚，帶著感謝；同時取消一項只是為了跟上別人的花費。"],["p","第四，把一筆錢變成一段關係：約一位正在缺乏的人吃一頓飯，你請客，聽他說話，不急著給建議。"],["p","第五，把你手上一件只有你會做的事，挑一位比你年輕的人，這一週坐下來教他一次。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：貪財是萬惡之根，錢不是我的主人；萬王之王、萬主之主才是。"],["p","我宣告：神厚賜百物給我享受，我領受的時候不心虛，給出去的時候也不心疼。"],["p","我宣告：我是屬神的人，我要逃避、要追求、要持定永生。"],["p","我宣告：我要保守所託付我的，也要把它交給下一棒；恩惠常與我同在。"],["h","十、結語"],["p","我們回到開場那一句話。下一次你聽見有人說「錢是萬惡之根」，不必糾正得很兇，只要溫和地補回那一個字：不是錢，是貪財。這一個字補回來，錢就回到它該在的地方：可以享受，可以給出去，可以變成一段關係，卻不再作主人。"],["p","可是這一課的焦點，不在我們把錢管得多好，也不在我們守得多牢、交得多漂亮。焦點在那一位在彼拉多面前作過美好見證的主：他本來富足，卻為我們成了貧窮；他守住了真理，一直守到十字架上，把自己交了出去；他從死裡復活，是那獨一不死的，他要再來，是萬王之王。我們守的不是一套道理，是一位先為我們把自己交出來的主；我們能守，是因為他的恩惠先常與我們同在。"],["p","我們一起低頭禱告。萬王之王、萬主之主，謝謝你厚賜百物給我們享受，也謝謝你把福音這一份寄存物交到我們手上。求你赦免我們握得太緊，把錢當成安全，把服事當成地盤。求你看顧正在經濟壓力裡的弟兄姊妹，也使被託付較多的人樂意供給人。教我們守好了，就交下去，在你的恩惠裡守，在你的恩惠裡交。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰賺得多、誰給得多，是讓每一個人說出自己手裡握著甚麼，也說出這一週要鬆開、要交給下一棒的那一件事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是知足、持定、交棒。席上可能有正在負債、失業、職場受欺壓的人，也可能有被奉獻話語壓過的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：6:10 的主語是貪財，不是錢；神厚賜百物給我們享受，也要我們樂意供給人；保守所託付的，是為了交給下一棒。"],["n","1. ★ 你這輩子第一次自己賺到的錢，是做甚麼賺的？那筆錢最後花到哪裡去了？現在想起來，你對那筆錢是甚麼感覺？"],["n","2. ★★★ 「錢是萬惡之根」和「貪財是萬惡之根」差了一個字。請用一句話說，這一個字怎樣同時擋住成功神學和清貧主義？"],["n","3. ★★ 「樂意供給人」原文就是團契那個字。請說出一個你看過的例子：有人用錢或時間，不只是幫了忙，而是和對方建立了關係。"],["n","4. ★★ 6:20 先說保守，6:21 再說恩惠。請說說：為甚麼這個次序不能顛倒，又為甚麼我們能保守，是因為恩惠先與我們同在？"],["m","帶領提醒：第一題輕鬆帶；討論成功神學時，不在組裡評論任何講員或教會，把話題帶回 6:5 與 6:6。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己手裡握緊的是甚麼，並說出這一週要鬆開的一步。"],["t","【看】看見自己"],["n","5. ★★★ 在你目前的生活裡，哪一件事最常讓你拿自己和別人比較：薪水、房子、孩子的成績，還是服事的位置？說一件最近的事。"],["t","【聽】聽神說話"],["n","6. ★★ 請大家一起慢慢念 6:15–16 兩遍，第二遍念完，安靜一分鐘。然後說一句：你聽見這位萬王之王對你握著的那樣東西說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你最捨不得交出去的是甚麼：一筆錢、一個服事的位置、一份被需要的感覺？不必說細節，只說它卡在哪裡：怕不夠、怕被取代，還是怕沒有用？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我是屬神的人，錢不是我的主人；這一週我要鬆開的是……。」右手邊的人只回「恩惠與你同在」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要把一筆錢變成一段關係的那一步：請誰、在哪裡、星期幾、做甚麼。若你正在缺乏，寫下你要向誰說出需要。"],["m","帶領提醒：這一化可能碰到負債、失業、職場欺壓或長期無望感。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不說「知足就好」；若有人說出正處在危機中，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一次享受、一段關係、一件交出去的服事、一個接棒的人。"],["n","10. ★★ 說出你這一週要好好享受、不帶罪疚的一件神賜的好東西，以及你要取消的一項只是為了跟上別人的花費。"],["n","11. ★ 列出你手上一件只有你會做的服事或技能。這個月你要教給誰？第一次坐下來教他，是哪一天、在哪裡？"],["n","12. ★★ 說出一位正在經濟壓力裡、你要指名代禱的人，並說出這一週你可以為他做的一件實際的事，以及哪一天去做。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，就是你要交棒的那一位。當場說出他的名字，說出這一週哪一天你要找他，並把你從神那裡領受的一句話交給他、向他分享。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，聖經沒有說錢是萬惡之根，它說的是貪財，問題不在錢，在心裡對錢的那份愛。第二句，神是厚賜百物給我們享受的，所以我可以享受，也可以把錢拿去和人建立關係。第三句，我手上最寶貴的不是錢，是別人交給我的福音，我要守好它，再交給下一個人。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多奉獻」「我會注意」這類答案；不在組裡問任何人的收入或奉獻金額。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要鬆開的那一樣東西，和我要交棒的那一個人。"],["p","然後彼此代禱，為三種人指名禱告：一位正在負債或失業的人，求主供應，也讓教會成為他身邊的家人；一位被託付較多的人，求主使他不倚靠無定的錢財；一位你要交棒的年輕人，求主預備他的心。"],["p","散會以前，確認紙上寫了三樣：要建立關係的那一位、要交出去的那一件事、你的那個「2」。下次帶來對。"]]}}}</script>

<script>/* ===== 321提摩太前書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}
